name: Publish bright continuous club comparison on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-bright-club-column-release.yml
permissions:
  contents: read
concurrency:
  group: numi-bright-club-column-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish vivid club discounts on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate isolated release
        run: python3 -m py_compile account-service/deploy-bright-club-column.py
      - name: Publish with independent backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-bright-club-column.py
