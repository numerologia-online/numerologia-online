name: Publish public offer to REG.RU

on:
  push:
    paths:
      - .github/workflows/numi-public-offer-release.yml

permissions:
  contents: read

concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish public offer on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate offer source and isolated publisher
        run: |
          python3 -m py_compile scripts/publish-offer-policy.py
          test -s offer.html
          grep -q 'href="/offer.html"' index.html
      - name: Upload only the offer page and footer link, back up and verify
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-offer-policy.py
