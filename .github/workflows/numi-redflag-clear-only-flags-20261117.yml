name: Clear only Red Flag category text and prompts on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-clear-only-flags-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  clear:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify flags cleared while other seven categories untouched
        run: |
          set -euo pipefail
          node --check redflag-feature.js
          node --check redflag-text-bank.js
          node --check redflag-categories.js
          node --check redflag-public-catalog.js
          node --check app.js
          php -l api/redflag-free-ai.php
          node tests/redflag-owner-direct-question.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          catalog=Path('redflag-public-catalog.js').read_text()
          flags=catalog.split('  "flags": [',1)[1].split('  "infidelity": [',1)[0]
          assert '"variants"' not in flags and '"answer"' not in flags
          assert flags.count('"status": "soon"')==10
          other=Path('redflag-feature.js').read_text()
          assert 'section!=="flags"' in other
          assert 'showInlinePurchase(item,target,' in other
          assert 'redflag-feature.js?v=flags-cleared-20261117' in Path('app.js').read_text()
          assert 'app.js?v=flags-cleared-20261117' in Path('index.html').read_text()
          assert 'redflag-public-catalog.js?v=flags-cleared-20261117' in Path('redflag-text-bank.js').read_text()
          assert 'FLAGS_PROMPT_CLEARED' in Path('api/redflag-free-ai.php').read_text()
          assert 'ледян\\w*' not in Path('api/redflag-free-ai.php').read_text()
          print('VALIDATED_ONLY_FLAGS_PURGED_OTHER_SECTIONS_PRESERVED')
          PY
      - name: Safe publish changed files and remove only flags caches/owner drafts
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,ssl,os,io,hashlib,subprocess,urllib.request,time,re,json
          from pathlib import Path
          paths=['redflag-public-catalog.js','redflag-text-bank.js','redflag-categories.js',
                 'redflag-feature.js','api/redflag-free-ai.php','app.js','index.html']
          wanted={p:Path(p).read_bytes() for p in paths}
          sha=lambda v:hashlib.sha256(v).hexdigest()
          approved={}
          for p in paths:
              history=subprocess.check_output(['git','log','--format=%H','-n','450','--',p],text=True).splitlines()
              approved[p]={sha(subprocess.check_output(['git','show',r+':'+p])) for r in history}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=50)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def get(path):
              output=io.BytesIO()
              ftp.retrbinary('RETR '+path,output.write)
              return output.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if get(path)!=data:raise RuntimeError('READBACK_MISMATCH_'+path)
          before={};updated=[]
          try:
              before={p:get(root+p) for p in paths}
              for p in paths:
                  if sha(before[p]) not in approved[p]:
                      raise RuntimeError('REFUSE_OVERWRITE_UNRECOGNIZED_LIVE_'+p)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  name=backup+'/pre-flags-only-reset-'+stamp+'-'+p.replace('/','-')+'.bak'
                  ftp.storbinary('STOR '+name,io.BytesIO(before[p]))
                  if get(name)!=before[p]:raise RuntimeError('BACKUP_FAILURE_'+p)
              for p in paths:
                  if get(root+p)!=before[p]:raise RuntimeError('CONCURRENT_SERVER_CHANGE_'+p)
                  if before[p]!=wanted[p]:
                      updated.append(p)
                      put(root+p,wanted[p])
              # Verify actual live JS and HTML; only then remove old flags JSON.
              base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in [x for x in paths if x.endswith('.js') or x.endswith('.html')]:
                  req=urllib.request.Request(base+p+'?flags_reset='+str(time.time_ns()),
                       headers={'Cache-Control':'no-cache','User-Agent':'NumiFlagsOnlyReset/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as res:
                      data=res.read(450000)
                  if sha(data)!=sha(wanted[p]):raise RuntimeError('PUBLIC_HASH_MISMATCH_'+p)
              print('ONLY_FLAGS_SITE_FILES_VERIFIED',flush=True)
              dirs=[
                  (home+'/private/numi-redflag-owner-kept-v1',
                   re.compile(r'^flags__[a-z0-9-]+__[0-9]{1,2}-[0-9]{1,2}\\.json$')),
                  (home+'/private/numi-redflag-free-ai-v1',
                   re.compile(r'^day-[0-9]{1,2}-month-[0-9]{1,2}\\.json$'))
              ]
              for directory,pattern in dirs:
                  try:listing=ftp.nlst(directory)
                  except ftplib.error_perm as e:
                      if str(e).startswith('550'):listing=[]
                      else:raise
                  deleted=0
                  for entry in listing:
                      name=entry.rsplit('/',1)[-1]
                      if not pattern.fullmatch(name):continue
                      ftp.delete(directory+'/'+name);deleted+=1
                  print('PRIVATE_FLAGS_ONLY_RESET',directory.rsplit('/',1)[-1],'deleted',deleted,flush=True)
              print('FLAGS_ONLY_RESET_COMPLETE: other sections/purchases unchanged',flush=True)
          except BaseException:
              for p in reversed(updated):
                  try:put(root+p,before[p]);print('ROLLBACK_OK',p,flush=True)
                  except BaseException:print('ROLLBACK_FAILED',p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Mark confirmed live flags-only reset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/flags-only-reset-live" -f description="Flags answers/prompt cleared; other categories unmodified; caches wiped" >/dev/null
      - name: Mark failed reset
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/flags-only-reset-live" -f description="Flags reset not verified; inspect workflow and rollback" >/dev/null
