name: Keep question layout stable during time entry
on:
  push:
    branches: [fix/yesno-stable-keyboard]
    paths: [.github/workflows/numi-yesno-stable-keyboard.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable keyboard layout with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/stable-keyboard/deploy.py
