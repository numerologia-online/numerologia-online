name: Hide owner report notice only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-owner-report-clean-view-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and publish only shared report view
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          node --input-type=module --check < store-entry.js
          python3 -u - <<'PY'
          import os,io,ftplib,ssl,subprocess,pathlib,time,urllib.request
          name='store-entry.js'
          base='bf9d59d5e86e04020ca105a9571468a7b9b1ec04'
          old=subprocess.check_output(['git','show',base+':'+name])
          new=pathlib.Path(name).read_bytes()
          text=old.decode()
          start=text.index('      const note=document.createElement("p");',text.index('if(ownerDoc && ownerDoc.sections?.length)'))
          end=text.index('      const content=document.createElement("section");',start)
          expected=(text[:start]+text[end:]).replace('region.replaceChildren(note,content);','region.replaceChildren(content);').encode()
          assert new==expected
          assert b'walletOwnerMaterial(item)' in new and b'owner_preview:true,entitlement_id:null' in new
          assert b'region.replaceChildren(line,content);' in new and b'walletMaterial(quote.entitlement_id)' in new
          def get(p):
            req=urllib.request.Request('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?owner_view_check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as res:
              assert res.status==200
              return res.read()
          get('')
          with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30) as f:
            f.connect('server172.hosting.reg.ru',21)
            f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
            f.prot_p()
            home=f.pwd().rstrip('/')
            target=home+'/www/xn--c1adkkdfjbp1a4l.online/'+name
            def read(p):
              buf=io.BytesIO()
              f.retrbinary('RETR '+p,buf.write)
              return buf.getvalue()
            def write(p,b):
              f.storbinary('STOR '+p,io.BytesIO(b))
              assert read(p)==b
            before=read(target)
            assert before in (old,new),'LIVE_DIFFERS_REFUSE_OVERWRITE'
            changed=False
            try:
              if before!=new:
                backup=home+'/site-safeguard-backups/owner-report-clean-'+str(time.time_ns())+'-'+name
                write(backup,before)
                assert read(target)==before
                changed=True
                write(target,new)
              assert get(name)==new,'PUBLIC_BYTES_MISMATCH'
              get('')
              get('child/')
            except BaseException:
              if changed:write(target,before)
              raise
          print('OWNER_REPORT_NOTICE_REMOVED_LIVE; authorization and paid access unchanged; only store-entry.js published')
          PY
