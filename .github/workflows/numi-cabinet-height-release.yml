name: Publish stable account dialog height on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-cabinet-height-release.yml
permissions:
  contents: read
concurrency:
  group: numi-cabinet-height-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish stable cabinet height on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate guarded CSS deployment
        run: python3 -m py_compile account-service/deploy-cabinet-height.py
      - name: Publish homepage patch only, with backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-cabinet-height.py
