name: Inspect REG.RU full backup inventory
on:
  push:
    paths:
      - .github/workflows/numi-backup-inventory.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: List website files and sizes read-only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/inspect-regru-backup-inventory.py
      - name: Publish file count only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-backup-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Record REG.RU backup inventory"
            git push
          fi
