name: Diagnose Red Flag ticket origin guard (one-time)
on:
  push:
    paths: ['.github/workflows/numi-redflag-origin-fix-20261105.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read exact origin/host checks without changing server
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,hashlib,re
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          root=f.pwd().rstrip('/')
          b=io.BytesIO()
          f.retrbinary('RETR '+root+'/www/xn--c1adkkdfjbp1a4l.online/api/redflag-save.php',b.write)
          data=b.getvalue()
          print('SOURCE_SHA256',hashlib.sha256(data).hexdigest(),'bytes',len(data))
          lines=data.decode('utf8').splitlines()
          for i,line in enumerate(lines,1):
            if i<10 or i>73:continue
            if re.search('origin|http_host|cors|worker|parse_url|in_array|allowed|request_method|post',line,re.I):
              # Only expose non-secret routing logic; never read configuration or credentials.
              if re.search('token|secret|password|api_key|credential|authorization',line,re.I):
                print('RULE',i,'[secret-adjacent line withheld]')
              else:
                print('RULE',i,line[:450])
          f.quit()
          PY
