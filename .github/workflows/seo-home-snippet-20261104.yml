name: SEO home snippet fix (REG.RU isolated)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-home-snippet-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numi-seo-home-snippet-live
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded SEO patch
        run: python3 -m py_compile .github/scripts/seo-home-snippet-20261104.py
      - name: Patch only live homepage with backup and HTTP verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/seo-home-snippet-20261104.py
