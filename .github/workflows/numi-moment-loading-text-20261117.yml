name: Publish only Moment calculation-loading text
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-loading-text-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact user-facing loading text and script syntax
        run: |
          set -euo pipefail
          node --check moment/moment.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('moment/moment.js').read_text()
          html=Path('moment/index.html').read_text()
          assert js.count("'Идёт расчёт…'")==1
          assert 'Составляю твой личный ответ' not in js
          assert './moment.js?v=calculation-loading-20261117' in html
          assert 'ownerMode && q.category' in js
          print('MOMENT_LOADING_ONLY_CODE_OK',flush=True)
          PY
      - name: Backup, publish and verify ONLY moment.js and its page cache key
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,hashlib,io,time,subprocess,urllib.request
          paths=['moment/moment.js','moment/index.html']
          target={p:Path(p).read_bytes() for p in paths}
          sha=lambda data:hashlib.sha256(data).hexdigest()
          allow={}
          for p in paths:
            revisions=subprocess.check_output(['git','log','--format=%H','-n','160','--',p],text=True).splitlines()
            allow[p]={sha(subprocess.check_output(['git','show',rev+':'+p])) for rev in revisions}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          prefix=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          def get(p):
            buffer=io.BytesIO()
            ftp.retrbinary('RETR '+prefix+p,buffer.write)
            return buffer.getvalue()
          def put(p,content):
            ftp.storbinary('STOR '+prefix+p,io.BytesIO(content))
            if get(p)!=content:raise RuntimeError('FTP_VERIFY_FAILED '+p)
          original={};written=[]
          try:
            original={p:get(p) for p in paths}
            for p in paths:
              if sha(original[p]) not in allow[p]:
                raise RuntimeError('UNKNOWN_LIVE_VERSION_NO_OVERWRITE '+p)
            backup_dir=root+'/site-safeguard-backups'
            try:ftp.mkd(backup_dir)
            except ftplib.error_perm as exc:
              if not str(exc).startswith('550'):raise
            stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            for p in paths:
              backup=backup_dir+'/moment-loading-'+stamp+'-'+p.replace('/','-')+'.bak'
              ftp.storbinary('STOR '+backup,io.BytesIO(original[p]))
              buf=io.BytesIO();ftp.retrbinary('RETR '+backup,buf.write)
              if buf.getvalue()!=original[p]:raise RuntimeError('BACKUP_VERIFY_FAILED '+p)
            for p in paths:
              if get(p)!=original[p]:raise RuntimeError('LIVE_CHANGED_DURING_BACKUP '+p)
              if target[p]!=original[p]:
                written.append(p)
                put(p,target[p])
            for p in paths:
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?loading_check='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:public=r.read(250000)
              if sha(public)!=sha(target[p]):raise RuntimeError('PUBLIC_LIVE_SHA_MISMATCH '+p)
            print('MOMENT_LOADING_TEXT_LIVE_OK',flush=True)
          except BaseException:
            for p in reversed(written):
              try:put(p,original[p]);print('ROLLBACK_OK',p)
              except BaseException:print('ROLLBACK_FAILED',p)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
      - name: Write successful publication status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/moment-loading-live" -f description="New calculation label verified live on REG.RU" >/dev/null
      - name: Write unsuccessful publication status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/moment-loading-live" -f description="Moment loading text was not verified live" >/dev/null
