name: Publish readable account tariff labels to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-tariff-legibility-release.yml
permissions:
  contents: read
concurrency:
  group: numi-tariff-legibility-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish readable tariff labels on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tariff release
        run: |
          python3 -m py_compile account-service/deploy-tariff-legibility.py
          grep -q 'numi-tariff-legibility-fix-20261031' index.html
      - name: Publish isolated tariff update with backup and live verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-tariff-legibility.py
