name: Save critical REG.RU live snapshot
on:
  push:
    paths:
      - .github/workflows/numi-critical-backup.yml
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Safeguard critical live files outside web root
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/backup-regru-critical.py
      - name: Commit non-secret status
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-critical-backup.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified critical REG.RU backup"
            git pull --rebase origin main
            git push
          fi
