name: Inspect Red Flag ticket format and historical REG.RU handler
on:
  push:
    paths: ['.github/workflows/numi-redflag-payload-audit-20261105.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only inspect ticket text validation and bot reg handler hints
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,re
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          for name in ['api/redflag-save.php','api/telegram-reg-stage-15-10-2026.php']:
            b=io.BytesIO();f.retrbinary('RETR '+root+name,b.write)
            lines=b.getvalue().decode('utf8','replace').splitlines()
            print('FILE',name,'LINES',len(lines))
            for n,line in enumerate(lines,1):
              if name.endswith('redflag-save.php'):
                show=72<=n<=111
              else:
                show=('start' in line.lower() or 'chat_id' in line or 'sendMessage' in line) and n<260
              if show:
                if re.search(r'password|secret|token|credential|authorization|api.?key|db_|mysqli|pdo|bindparam|private',line,re.I):
                  print('RULE',n,'[withheld sensitive]')
                else:print('RULE',n,line[:380])
          f.quit()
          PY
