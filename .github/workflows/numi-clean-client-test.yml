name: Check redacted browser-site candidate
on:
  push:
    paths:
      - .github/workflows/numi-clean-client-test.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check app imports and paid-data redactions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess,os,re
          root=pathlib.Path('.')
          def status(ctx,ok,desc):
              subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA'],
              '-f','state='+('success' if ok else 'failure'),'-f','context='+ctx,'-f','description='+desc],check=True)
          files=['paid-access.js','paid-content-paths.js','year-content.js','year-feature.js','redflag-text-bank.js','redflag-feature.js','child/child.js','full-report-library.js','matrix-feature.js','pro/pro.js','compatibility-feature.js','destiny-code-feature.js','karmic-programs.js']
          errors=[]
          for path in files:
              code=root.joinpath(path).read_text()
              check=subprocess.run(['node','--check',path],capture_output=True,text=True)
              if check.returncode: errors.append(path+': JS syntax')
              for match in re.finditer(r'\bfrom\s+[\x22\x27](\.[^\x22\x27]+)[\x22\x27]',code):
                  relative=match.group(1).split('?')[0]
                  dest=(pathlib.Path(path).parent/relative)
                  if not dest.is_file():errors.append(path+': missing '+relative)
          status('numi/js-module-check',not errors,'JS imports valid='+str(not errors))
          print('JS errors:',errors[:10],flush=True)
          year=list(pathlib.Path('data/year').rglob('energy-*.txt'))
          if year:errors.append('Raw paid year files still published')
          for file in pathlib.Path('child/data/matrix/sections').glob('energy-*.json'):
              data=json.loads(file.read_text())
              if 'sections' in data:errors.append('Child paid sections exposed: '+str(file))
          for file in pathlib.Path('data/redflag/love/published').glob('*.json'):
              data=json.loads(file.read_text())
              if set(data.get('entries',{}))-{'first-step'}:errors.append('Full Red Flag entries: '+str(file))
          for file in pathlib.Path('data/redflag/money').glob('*.json'):
              data=json.loads(file.read_text())
              if file.name != 'gift.json' and data.get('entries'):errors.append('Paid Red Flag money entries exposed: '+str(file))
          for file in pathlib.Path('knowledge/full-report/sections').glob('energy-*.json'):
              if 'sections' in json.loads(file.read_text()):errors.append('Full report answers exposed: '+str(file))
          status('numi/client-bank-redactions',not errors,'Redacted client files valid='+str(not errors))
          print('Audited site files; errors:',errors[:20],flush=True)
          if errors:raise SystemExit(1)
          PY
