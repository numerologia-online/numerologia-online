name: REG.RU FTPS connectivity diagnosis read-only
on:
  push:
    paths:
      - .github/workflows/numi-ftps-connectivity-diagnosis.yml
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect connect-login-list stages with bounded timeout
        env:
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,socket,time,subprocess
          host='server172.hosting.reg.ru'
          stage='dns'
          def status(ok,where):
              desc='FTPS '+where+' '+('OK' if ok else 'FAIL')
              subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA'],
              '-f','state='+('success' if ok else 'failure'),'-f','context=numi/ftps-stage','-f','description='+desc],check=True)
          ftp=None
          try:
              ip=socket.gethostbyname(host)
              print('DNS OK; server resolved',flush=True)
              stage='tcp'
              probe=socket.create_connection((host,21),timeout=9);probe.close()
              print('TCP 21 OK',flush=True)
              stage='ftp-tls'
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=9)
              ftp.connect(host,21);ftp.auth()
              print('FTP TLS OK',flush=True)
              stage='login'
              ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);ftp.prot_p()
              print('FTPS login OK',flush=True)
              stage='cwd'
              ftp.cwd('www/xn--c1adkkdfjbp1a4l.online')
              print('Website directory OK',flush=True)
              stage='list'
              items=ftp.nlst()
              print('Root listing OK; count',len(items),flush=True)
              status(True,'all-stages')
          except Exception as e:
              print('FTPS FAILED AT',stage,'type',type(e).__name__,flush=True)
              status(False,stage+'-'+type(e).__name__)
              raise
          finally:
              if ftp is not None:
                  try:ftp.quit()
                  except:ftp.close()
          PY
