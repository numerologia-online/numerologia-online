name: Child live paywall browser audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/child-paywall-live.yml'
      - 'tests/child-paywall-live.mjs'
      - 'child/index.html'
      - 'child/child.js'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/child-paywall-live.mjs
