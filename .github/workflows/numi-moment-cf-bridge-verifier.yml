name: Derive public verifier for isolated Moment AI bridge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cf-bridge-verifier.yml
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - name: Print one-way verifier only, never publish a credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib,hmac,os
          key=os.environ.get('GROQ_API_KEY','')
          if not key.startswith('gsk_'):raise RuntimeError('OWNER_PRIVATE_KEY_UNAVAILABLE')
          proof=hmac.new(key.encode(),b'numi-moment-cloudflare-bridge-v1',hashlib.sha256).hexdigest()
          print('MOMENT_CLOUDFLARE_PUBLIC_VERIFIER_SHA256='+hashlib.sha256(proof.encode()).hexdigest())
          print('MOMENT_CLOUDFLARE_PRIVATE_PROOF_NOT_PRINTED')
          PY
