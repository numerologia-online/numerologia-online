name: Publish approved second question
on:
  push:
    branches: [fix/yesno-second-question]
    paths: [.github/workflows/numi-yesno-second-question.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify both approved questions
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/second-question/deploy.py
