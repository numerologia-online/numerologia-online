name: Verify Cloud.ru saved key without website changes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-cloudru-auth-check-20261119.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request one short response with the saved key
        env:
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY_2 }}
          PREVIOUS_CLOUD_KEY: ${{ secrets.CLOUDRU_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('CLOUD_RU_API_KEY','').strip()
          if not key:raise SystemExit('CLOUD_RU_API_KEY_2_MISSING')
          old=os.environ.get('PREVIOUS_CLOUD_KEY','').strip()
          print('PREVIOUS_SECRET '+json.dumps({'present':bool(old),'same_as_new':bool(old) and old==key}))
          if not old or old==key:
              print('NO_ADDITIONAL_PROVIDER_CALL same_or_missing_previous_key=true')
              raise SystemExit(0)
          key=old
          payload={'model':'ai-sage/GigaChat3-10B-A1.8B','messages':[{'role':'user','content':'Ответь одним словом: работает'}],'max_tokens':20,'stream':False}
          req=urllib.request.Request('https://foundation-models.api.cloud.ru/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+key})
          try:
              with urllib.request.urlopen(req,timeout=50) as res:
                  data=json.load(res)
                  answer=data.get('choices',[{}])[0].get('message',{}).get('content','')
                  if not answer:raise SystemExit('PROVIDER_EMPTY_RESPONSE')
                  print('CLOUD_RU_AUTH_OK model='+payload['model']+' answer='+str(answer).replace(key,'[redacted]')[:100])
          except urllib.error.HTTPError as e:
              body=e.read(3000).decode('utf-8','replace').replace(key,'[redacted]')
              print('CLOUD_RU_AUTH_FAILED http='+str(e.code)+' detail='+body[:700])
              raise SystemExit(1)
          print('WEBSITE_UNCHANGED inference_calls=1')
          PY
