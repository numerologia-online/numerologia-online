name: Diagnose Claude Opus 4.8 Cloud.ru response read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Cloud.ru API without modifying server or generating customer text
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ftplib,ssl,io,base64,json,urllib.request,urllib.error,time
          from pathlib import Path
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          buf=io.BytesIO()
          f.retrbinary('RETR '+root+'redflag-ai-lab/style-test-api.php',buf.write)
          f.quit()
          live=buf.getvalue()
          start=b"base64_decode('";i=live.index(start)+len(start);j=live.index(b"'",i)
          encoded=live[i:j]
          normalized=live[:i]+b'__CLOUDRU_KEY_BASE64__'+live[j:]
          assert normalized==Path('redflag-ai-lab/style-test-api.php').read_bytes(), 'LIVE_CODE_MISMATCH'
          assert live.count(b'anthropic/claude-opus-4.8')==2, 'LIVE_MODEL_MISMATCH'
          key=base64.b64decode(encoded,validate=True).decode()
          request_body=json.dumps({
              'model':'anthropic/claude-opus-4.8',
              'messages':[{'role':'user','content':'Напиши только слово да.'}],
              'max_tokens':1100,'stream':False
          },ensure_ascii=False).encode()
          req=urllib.request.Request('https://foundation-models.api.cloud.ru/v1/chat/completions',data=request_body,headers={'Content-Type':'application/json','Authorization':'Bearer '+key},method='POST')
          t=time.monotonic()
          try:
              with urllib.request.urlopen(req,timeout=95) as resp:
                  status=resp.status;raw=resp.read(25000)
          except urllib.error.HTTPError as e:
              status=e.code;raw=e.read(25000)
          except Exception as e:
              print('PROVIDER_CONNECT_ERROR',type(e).__name__,'elapsed_s',round(time.monotonic()-t,1))
              raise SystemExit(1)
          try: parsed=json.loads(raw)
          except Exception: parsed={}
          print('PROVIDER_STATUS',status,'elapsed_s',round(time.monotonic()-t,1))
          if status!=200:
              err=parsed.get('error',{}) if isinstance(parsed,dict) else {}
              if isinstance(err,dict):
                  print('PROVIDER_ERROR_TYPE',str(err.get('type','unknown'))[:80])
                  message=str(err.get('message',''))
                  # Avoid outputting any untrusted sensitive text from provider.
                  print('PROVIDER_ERROR_CATEGORY', 'model' if 'model' in message.lower() else 'token' if 'token' in message.lower() else 'quota' if 'quota' in message.lower() else 'parameter' if 'parameter' in message.lower() else 'other')
                  print('PROVIDER_ERROR_TEXT',message.replace(key,'[REDACTED]')[:220])
              else: print('PROVIDER_ERROR_FORMAT',type(err).__name__)
              raise SystemExit(1)
          print('PROVIDER_CONTENT_OK',bool(parsed.get('choices',[{}])[0].get('message',{}).get('content')))
          print('PROVIDER_USAGE',json.dumps(parsed.get('usage',{}),ensure_ascii=False))
          print('DIAG_READ_ONLY website_writes=0 prompt_unchanged=true')
          PY
