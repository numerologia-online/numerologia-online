name: Safe publish isolated Red Flag jealousy 366 pair revisions
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-cloudru-auth-check-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish-jealousy-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact 366 pair bank; update only live owner-preview PHP with rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, io, os, ssl, subprocess, re, base64, urllib.request, urllib.error, datetime
          from pathlib import Path
          repo=os.environ.get('GITHUB_REPOSITORY','')
          path='redflag-ai-lab/style-test-api.php'
          local=Path(path).read_bytes()
          marker=b'__CLOUDRU_KEY_BASE64__'
          assert local.count(marker)==1,'LOCAL_KEY_PLACEHOLDER_MISSING'
          prefix=b'/** Owner-only editorial jealousy thesis bank:'
          suffix=b'/** Owner-only editorial notes for all 366 valid day/month pairs'
          def remove_jealousy_bank(blob):
              a=blob.index(prefix)
              b=blob.index(suffix,a)
              return blob[:a]+b'__JEALOUSY_BANK_EXCLUDED__'+blob[b:]
          a=local.index(prefix)
          b=local.index(suffix,a)
          section=local[a:b]
          found=re.findall(rb"(?m)^\s*'(\d{2}\.\d{2})'=>\[",section)
          valid=set()
          for m in range(1,13):
              for d in range(1,32):
                  try:datetime.date(2000,m,d)
                  except ValueError:continue
                  valid.add(f'{d:02}.{m:02}'.encode())
          assert len(found)==366 and len(set(found))==366 and set(found)==valid,'JEALOUSY_DATE_BANK_INVALID'
          for key in (b'09.03',b'09.09',b'09.10',b'31.03',b'15.09'):
              assert b"'"+key+b"'=>[" in section,'KEY_PAIR_MISSING'
          assert b'function rfHeroTheses(' in local and b'function rfJealousyTheses(' in local,'OTHER_BANK_MISSING'
          assert b'anthropic/claude-sonnet-4.6' in local,'WRONG_MODEL'
          assert 'Ты пишешь женщине о мужчине в рамках вопроса'.encode() in local,'HERO_PROMPT_MISSING'
          assert 'Ты отвечаешь женщине о мужчине на вопрос'.encode() in local,'JEALOUSY_PROMPT_MISSING'
          assert b'if(!naTestOwner(naCurrent(naDB())))' in local,'OWNER_PROTECTION_MISSING'
          assert b"if($autonomousMode){" in local,'OTHER_CATEGORIES_MISSING'
          # Lint before opening any write connection.
          syntax=subprocess.run(['php','-l'],input=local,capture_output=True)
          assert syntax.returncode==0,('PHP_SYNTAX_FAILED '+syntax.stderr.decode(errors='replace')[:300])
          print('LOCAL_PHP_LINT_OK, DATE_PAIRS=366',flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          file=root+'/www/xn--c1adkkdfjbp1a4l.online/'+path
          def read(p):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+p,b.write)
              return b.getvalue()
          def write(p,data):
              ftp.storbinary('STOR '+p,io.BytesIO(data))
              assert read(p)==data,'FTP_READBACK_DIFFERS'
          def http(endpoint):
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+endpoint
              req=urllib.request.Request(url,headers={'Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:return response.status
              except urllib.error.HTTPError as error:return error.code
          old=None;changed=False
          try:
              old=read(file)
              match=re.search(rb"base64_decode\('([^']+)'\s*,true\)",old)
              assert match is not None,'LIVE_AUTH_MARKER_MISSING'
              original_key=match.group(1)
              assert len(base64.b64decode(original_key,validate=True))>12,'LIVE_AUTH_KEY_INVALID'
              live_template=old[:match.start(1)]+marker+old[match.end(1):]
              # All live PHP outside this one bank must match byte for byte.
              assert remove_jealousy_bank(live_template)==remove_jealousy_bank(local),'LIVE_OTHER_CHANGES_DETECTED'
              new=local.replace(marker,original_key)
              assert new!=old,'NOTHING_TO_PUBLISH'
              assert subprocess.run(['php','-l'],input=new,capture_output=True).returncode==0,'DEPLOYED_PHP_LINT_FAILED'
              assert http('')==200,'HOMEPAGE_PRECHECK_FAILED'
              assert http(path)==403,'OWNER_GUARD_PRECHECK_FAILED'
              changed=True
              write(file,new)
              assert http(path)==403,'OWNER_GUARD_POSTCHECK_FAILED'
              assert http('')==200,'HOMEPAGE_POSTCHECK_FAILED'
              assert read(file)==new,'FINAL_PHP_NOT_EQUAL'
              print('JEALOUSY_366_LIVE_VERIFIED PHP_ONLY=1 AUTH_PRESERVED=1 OTHER_CODE_UNTOUCHED=1 SONNET_NOT_CALLED=1',flush=True)
          except BaseException:
              if changed and old is not None:
                  try:
                      write(file,old)
                      print('ROLLBACK_RESTORED',flush=True)
                  except BaseException: print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Report result without credentials
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Owner-only jealousy 366 revised bank live; all other PHP unchanged"
          else
            state=failure
            description="Safe jealousy deployment blocked or rolled back"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context="numi/jealousy-366-live" -f description="$description" >/dev/null
