name: Publish care-or-control day-month Sonnet bank to REG.RU
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bank, preserve Cloud.ru key, publish to private REG.RU folder, rollback on errors
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import ftplib,io,os,ssl,subprocess,urllib.request,urllib.error,re,base64,json
          from pathlib import Path
          php_path='redflag-ai-lab/style-test-api.php'
          bank_source='redflag-ai-lab/banks/care-or-control.json'
          php_ref='8b06ae2765388292229d001a474993c482678bea'
          marker=b'__CLOUDRU_KEY_BASE64__'
          previous_php_template=subprocess.check_output(['git','show',php_ref+'^:'+php_path])
          wanted_php_template=subprocess.check_output(['git','show',php_ref+':'+php_path])
          assert Path(php_path).read_bytes()==wanted_php_template,'UNEXPECTED_PHP_SOURCE'
          assert wanted_php_template.count(marker)==1 and previous_php_template.count(marker)==1
          assert b'anthropic/claude-sonnet-4.6' in wanted_php_template
          assert b'QUESTION_REFERENCE_NOT_DEPLOYED' in wanted_php_template
          assert b"$monthGuide=$bank['energies'][(string)$month]" in wanted_php_template
          assert b"$dayGuide=$bank['energies'][(string)$energy]" in wanted_php_template
          bank_bytes=Path(bank_source).read_bytes()
          bank=json.loads(bank_bytes)
          assert bank['question_id']=='care-or-control' and bank['category_id']=='flags'
          assert len(bank['energies'])==22 and set(bank['energies'].keys())=={str(n) for n in range(1,23)}
          assert all(isinstance(v,str) and len(v)>=140 for v in bank['energies'].values())
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          site_dir=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          protected_dir=root+'/private/numi-account-20261031/redflag-question-banks'
          target_bank=protected_dir+'/care-or-control.json'
          target_php=site_dir+php_path
          def read_abs(p):
              buf=io.BytesIO()
              try:ftp.retrbinary('RETR '+p,buf.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return buf.getvalue()
          def write_abs(p,data):
              ftp.storbinary('STOR '+p,io.BytesIO(data))
              if read_abs(p)!=data:raise RuntimeError('FTP_READBACK_FAILED')
          def http(p,data=None):
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p
              req=urllib.request.Request(url,data=data,headers={'Origin':'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','Content-Type':'application/json','Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status
              except urllib.error.HTTPError as err:return err.code
          old_php=None;old_bank=None;php_changed=False;bank_changed=False;created_directory=False
          try:
              old_php=read_abs(target_php)
              assert old_php is not None,'LIVE_PHP_NOT_FOUND'
              start=b"base64_decode('"
              assert old_php.count(start)==1,'LIVE_KEY_LOCATION_UNKNOWN'
              pos=old_php.index(start)+len(start)
              end=old_php.index(b"'",pos)
              encoded=old_php[pos:end]
              assert len(base64.b64decode(encoded,validate=True))>12,'LIVE_KEY_INVALID'
              assert old_php[:pos]+marker+old_php[end:]==previous_php_template,'LIVE_PHP_DIFFERS_FROM_EXPECTED'
              wanted_php=wanted_php_template.replace(marker,encoded)
              assert subprocess.run(['php','-l'],input=wanted_php,capture_output=True).returncode==0,'PHP_SYNTAX_FAILED'
              assert http('')==200,'HOMEPAGE_PRECHECK_FAILED'
              unaffected=['redflag-ai-lab/draft.php','redflag-feature.js','index.html','app.js','api/numi-account.php']
              untouched={p:read_abs(site_dir+p) for p in unaffected}
              assert all(value is not None for value in untouched.values()),'UNRELATED_FILE_MISSING'
              # Verify root PHP's private include directory exists. Never create unrelated roots.
              assert read_abs(root+'/private/numi-account-20261031/core.php') is not None,'PRIVATE_CORE_NOT_FOUND'
              old_bank=read_abs(target_bank)
              if old_bank is not None and old_bank!=bank_bytes:
                  raise RuntimeError('UNEXPECTED_EXISTING_BANK_REFUSE_OVERWRITE')
              if old_bank is None:
                  try:
                      ftp.mkd(protected_dir)
                      created_directory=True
                  except ftplib.error_perm as exc:
                      if not str(exc).startswith('550'):raise
                  bank_changed=True
                  write_abs(target_bank,bank_bytes)
              php_changed=True
              write_abs(target_php,wanted_php)
              assert http(php_path)==403,'OWNER_GET_GUARD_FAILED'
              assert http(php_path,b'{"category":"flags","question_id":"care-or-control","day":15,"month":7}')==403,'OWNER_POST_GUARD_FAILED'
              assert http('')==200,'HOMEPAGE_POSTCHECK_FAILED'
              for p,expected in untouched.items():
                  assert read_abs(site_dir+p)==expected,'UNRELATED_FILE_CHANGED_'+p
              assert read_abs(target_bank)==bank_bytes and read_abs(target_php)==wanted_php,'FINAL_CONTENT_MISMATCH'
              # Private bank must not be served through the public website.
              assert http('private/numi-account-20261031/redflag-question-banks/care-or-control.json') in (403,404),'PRIVATE_BANK_PUBLICLY_ACCESSIBLE'
              print('CARE_CONTROL_BANK_PUBLISHED_TO_REGRU energies=22 day_month_both=true bank_private=true key_preserved=true owner_only=true other_files_identical=true homepage_200=true inference_calls=0',flush=True)
          except BaseException:
              if php_changed and old_php is not None:
                  try:write_abs(target_php,old_php);print('PHP_ROLLBACK_OK',flush=True)
                  except BaseException:print('PHP_ROLLBACK_FAILED',flush=True)
              if bank_changed:
                  try:
                      if old_bank is None:ftp.delete(target_bank)
                      else:write_abs(target_bank,old_bank)
                      print('BANK_ROLLBACK_OK',flush=True)
                  except BaseException:print('BANK_ROLLBACK_FAILED',flush=True)
              if created_directory:
                  try:ftp.rmd(protected_dir)
                  except BaseException:pass
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Report verified deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then outcome=success; message="Care-control 22 energies published privately on REG.RU"; else outcome=failure; message="Care-control bank release failed; see logs"; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$outcome" -f context="numi/care-control-bank-regru" -f description="$message" >/dev/null
