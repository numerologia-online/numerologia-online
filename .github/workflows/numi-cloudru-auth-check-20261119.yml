name: Diagnose Red Flag request paths without generation or writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read request statuses and redacted Red Flag error codes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,re,json,hashlib
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          f.connect('server172.hosting.reg.ru',21);f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          home=f.pwd().rstrip('/');host='xn--c1adkkdfjbp1a4l.online'
          def read(p):
              b=io.BytesIO()
              try:f.retrbinary('RETR '+home+'/'+p,b.write)
              except ftplib.error_perm:return b''
              return b.getvalue()
          for p in ['redflag-feature.js','redflag-ai-lab/draft.php']:
              b=read('www/'+host+'/'+p)
              print('LIVE_ROUTE '+json.dumps({'file':p,'sha256':hashlib.sha256(b).hexdigest(),'old_route_mentions':b.count(b'/redflag-ai-lab/draft.php'),'direct_route_mentions':b.count(b'/redflag-ai-lab/style-test-api.php'),'old_worker_mentions':b.count(b'workers.dev')}))
          access=read('logs/'+host+'.access.log').decode('utf-8','replace')
          rows=[]
          for row in access.splitlines():
              m=re.search(r'\\[([^\\]]+)\\].*?"(GET|POST) (/redflag-ai-lab/(?:draft|style-test-api)\\.php)(?:\\?[^ ]*)? HTTP/[^"]+" (\\d{3})',row)
              if m:rows.append(m.groups())
          print('RECENT_REDFLAG_REQUESTS '+json.dumps(rows[-30:]))
          errors=read('logs/'+host+'.error.log').decode('utf-8','replace')
          found=[]
          for row in errors.splitlines():
              if 'REDFLAG_CLOUDRU:' in row:
                  m=re.search(r'REDFLAG_CLOUDRU:([A-Za-z0-9_: -]{1,180})',row)
                  if m:found.append(m.group(1))
          print('REDFLAG_ERROR_CODES '+json.dumps(found[-10:]))
          f.quit()
          print('READ_ONLY no_model_calls=true')
          PY
