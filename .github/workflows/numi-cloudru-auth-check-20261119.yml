name: Publish approved 22 energies for care versus control to REG.RU preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bank, preserve Cloud.ru key, publish to private REG.RU folder, rollback on errors
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import ftplib,io,os,ssl,subprocess,urllib.request,urllib.error,re,base64,json
          from pathlib import Path
          php_path='redflag-ai-lab/style-test-api.php'
          bank_source='redflag-ai-lab/banks/care-or-control.json'
          php_previous_ref='2b4061832e96b612dea9e3e0a151829790ba6d0e'
          php_current_ref='f2828f4faec57db2fc6233690785317c4cc61cfc'
          bank_previous_ref='c2e52bc60a20c7848b84f028fe844907de547af4'
          marker=b'__CLOUDRU_KEY_BASE64__'
          previous_php_template=subprocess.check_output(['git','show',php_previous_ref+':'+php_path])
          wanted_php_template=subprocess.check_output(['git','show',php_current_ref+':'+php_path])
          assert Path(php_path).read_bytes()==wanted_php_template,'UNEXPECTED_PHP_SOURCE'
          assert wanted_php_template.count(marker)==1 and previous_php_template.count(marker)==1
          assert b'anthropic/claude-sonnet-4.6' in wanted_php_template
          assert b'QUESTION_REFERENCE_NOT_DEPLOYED' in wanted_php_template
          assert b'RELATED_QUESTION_MISSING_FROM_CATALOG' in wanted_php_template,'FOLLOWUP_SELECTION_MISSING'
          assert b'function rfCareControlMeaning' in wanted_php_template,'COMBINATION_ENGINE_MISSING'
          assert b"'calendar_day'" in wanted_php_template,'EXACT_DAY_OVERRIDE_MISSING'
          assert 'Не используй длинное или среднее тире'.encode('utf-8') in wanted_php_template,'DASH_PROMPT_MISSING'
          assert 'готовый_вывод_двух_энергий'.encode() in wanted_php_template,'COMBINED_RESULT_NOT_PASSED'
          assert b'infidelity/options' in wanted_php_template,'FIDELITY_REFERRAL_MISSING'
          assert '1000–1200 знаков'.encode('utf-8') in wanted_php_template,'OLD_LIVE_STYLE_NOT_RESTORED'
          assert b'foreach([700,150]' not in wanted_php_template,'TRUNCATION_NOT_REMOVED'
          assert b"$monthGuide=$bank['energies'][(string)$month]" not in wanted_php_template,'OLD_MODEL_INTERPRETATION_STILL_ACTIVE'
          assert b"$dayGuide=$bank['energies'][(string)$energy]" not in wanted_php_template,'OLD_MODEL_INTERPRETATION_STILL_ACTIVE'
          bank_bytes=Path(bank_source).read_bytes()
          bank_previous_bytes=subprocess.check_output(['git','show',bank_previous_ref+':'+bank_source])
          assert bank_bytes!=bank_previous_bytes,'BANK_NOT_CHANGED'
          bank=json.loads(bank_bytes)
          assert bank['question_id']=='care-or-control' and bank['category_id']=='flags' and bank['version']==4
          assert len(bank['energies'])==22 and set(bank['energies'].keys())=={str(n) for n in range(1,23)}
          assert all(isinstance(v,str) and len(v)>=140 for v in bank['energies'].values())
          rules=bank['combination_rules']
          assert bank['version']==4 and len(rules['signatures'])==22 and len(rules['repeats'])==12
          assert len(rules['pairs'])>=7
          assert set(rules['signatures'])=={str(n) for n in range(1,23)}
          assert set(rules['repeats'])=={str(n) for n in range(1,13)}
          assert all(0<=v[k]<=4 for v in rules['signatures'].values() for k in ('care','control','freedom'))
          assert all(v['drive'] and v['modifier'] for v in rules['signatures'].values())
          assert rules['signatures']['9']['control']>rules['signatures']['9']['care'],'NINE_MUST_CONSIDER_CONTROL_CARE'
          assert rules['signatures']['19']['care']>rules['signatures']['19']['control'],'SUN_MUST_BE_CARING'
          assert all(rules['signatures'][str(n)]['care']>rules['signatures'][str(n)]['control'] for n in (1,2,3,4,5,6,8,11,12,14,17,19,20,21,22)),'CARE_BIAS_NOT_FIXED'
          assert rules['signatures']['7']['freedom']>rules['signatures']['7']['control']
          assert rules['signatures']['15']['freedom']>rules['signatures']['15']['control']
          assert rules['signatures']['19']['care']==4 and rules['signatures']['19']['control']==1,'SUN_19_NOT_CARING'
          assert rules['pairs']['19.1']['followup']=='language/show-love','SUN_PLUS_ONE_REFERRAL_INCORRECT'
          assert rules['calendar_day_overrides']['31.10']['followup']=='family/roles','CALENDAR_31_10_OVERRIDE_MISSING'
          # Run every possible day-energy / month combination in PHP before touching REG.RU.
          code=wanted_php_template.decode('utf-8')
          fn_start=code.index('/** Fixed editorial conclusion')
          fn_end=code.index('try {',fn_start)
          test_php=code[fn_start:fn_end]+"""
          $bank=json_decode(file_get_contents('redflag-ai-lab/banks/care-or-control.json'),true);
          $rules=$bank['combination_rules'];
          $cases=[
              '9.9'=>['Очень сильная склонность к контролю','flags/argument'],
              '9.3'=>['Контроль через опеку','language/hurt'],
              '9.7'=>['Двойные стандарты свободы','family/home'],
              '15.7'=>['Не контролёр и не заботливый опекун','infidelity/options'],
              '3.6'=>['Главная линия сочетания','language/accept-love'],
              '13.6'=>['Потребность в близости сталкивается','family/conflict'],
              '4.10'=>['Забота через продуманные решения','family/roles'],
              '19.1'=>['Забота у него тёплая','language/show-love']
          ];
          foreach($cases as $key=>$expect){
              [$d,$m]=array_map('intval',explode('.',$key));
              $actual=rfCareControlMeaning($rules,$d,$m);
              if(!str_starts_with($actual['meaning'],$expect[0])||$actual['followup']!==$expect[1]||$actual['source']!=='pair')
                  throw new Exception('CASE_FAILED_'.$key);
          }
          $cal=rfCareControlMeaning($rules,4,10,31);
          if($cal['source']!=='calendar_day'||!str_starts_with($cal['meaning'],'Он живёт по собственному расписанию')||$cal['followup']!=='family/roles')
              throw new Exception('CALENDAR_31_10_FAILED');
          $normal=rfCareControlMeaning($rules,4,10,4);
          if($normal['source']!=='pair'||str_starts_with($normal['meaning'],'Он живёт по собственному расписанию'))
              throw new Exception('ORIGINAL_4_10_CHANGED');
          for($d=1;$d<=22;$d++){
              for($m=1;$m<=12;$m++){
                  $actual=rfCareControlMeaning($rules,$d,$m);
                  if(strlen($actual['meaning'])<90||!str_contains($actual['followup'],'/'))
                      throw new Exception('INCOMPLETE_'.$d.'_'.$m);
              }
          }
          if(rfCareControlMeaning($rules,9,9)['source']!=='pair')
              throw new Exception('REPEATED_NINE_MISSING');
          echo "DAY_MONTH_RULES_OK total=264 approved_energies=22 care_direction_checked=true calendar_31_10=true sun_19_1=true\\n";
          """
          preflight=subprocess.run(['php','-r',test_php],capture_output=True,text=True)
          assert preflight.returncode==0,('PHP_MEANING_TEST_FAILED '+preflight.stderr[:1000])
          print(preflight.stdout.strip(),flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          site_dir=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          protected_dir=root+'/private/numi-account-20261031/redflag-question-banks'
          target_bank=protected_dir+'/care-or-control.json'
          target_php=site_dir+php_path
          def read_abs(p):
              buf=io.BytesIO()
              try:ftp.retrbinary('RETR '+p,buf.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return buf.getvalue()
          def write_abs(p,data):
              ftp.storbinary('STOR '+p,io.BytesIO(data))
              if read_abs(p)!=data:raise RuntimeError('FTP_READBACK_FAILED')
          def http(p,data=None):
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p
              req=urllib.request.Request(url,data=data,headers={'Origin':'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','Content-Type':'application/json','Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status
              except urllib.error.HTTPError as err:return err.code
          old_php=None;old_bank=None;php_changed=False;bank_changed=False;created_directory=False
          try:
              old_php=read_abs(target_php)
              assert old_php is not None,'LIVE_PHP_NOT_FOUND'
              start=b"base64_decode('"
              assert old_php.count(start)==1,'LIVE_KEY_LOCATION_UNKNOWN'
              pos=old_php.index(start)+len(start)
              end=old_php.index(b"'",pos)
              encoded=old_php[pos:end]
              assert len(base64.b64decode(encoded,validate=True))>12,'LIVE_KEY_INVALID'
              assert old_php[:pos]+marker+old_php[end:]==previous_php_template,'LIVE_PHP_DIFFERS_FROM_EXPECTED'
              wanted_php=wanted_php_template.replace(marker,encoded)
              assert subprocess.run(['php','-l'],input=wanted_php,capture_output=True).returncode==0,'PHP_SYNTAX_FAILED'
              assert http('')==200,'HOMEPAGE_PRECHECK_FAILED'
              unaffected=['redflag-ai-lab/draft.php','redflag-feature.js','index.html','app.js','api/numi-account.php']
              untouched={p:read_abs(site_dir+p) for p in unaffected}
              assert all(value is not None for value in untouched.values()),'UNRELATED_FILE_MISSING'
              # Verify root PHP's private include directory exists. Never create unrelated roots.
              assert read_abs(root+'/private/numi-account-20261031/core.php') is not None,'PRIVATE_CORE_NOT_FOUND'
              old_bank=read_abs(target_bank)
              if old_bank!=bank_previous_bytes and old_bank!=bank_bytes:
                  raise RuntimeError('LIVE_BANK_CHANGED_REFUSE_OVERWRITE')
              if old_bank!=bank_bytes:
                  bank_changed=True
                  write_abs(target_bank,bank_bytes)
              php_changed=True
              write_abs(target_php,wanted_php)
              assert http(php_path)==403,'OWNER_GET_GUARD_FAILED'
              assert http(php_path,b'{"category":"flags","question_id":"care-or-control","day":15,"month":7}')==403,'OWNER_POST_GUARD_FAILED'
              assert http('')==200,'HOMEPAGE_POSTCHECK_FAILED'
              for p,expected in untouched.items():
                  assert read_abs(site_dir+p)==expected,'UNRELATED_FILE_CHANGED_'+p
              assert read_abs(target_bank)==bank_bytes and read_abs(target_php)==wanted_php,'FINAL_CONTENT_MISMATCH'
              # Private bank must not be served through the public website.
              assert http('private/numi-account-20261031/redflag-question-banks/care-or-control.json') in (403,404),'PRIVATE_BANK_PUBLICLY_ACCESSIBLE'
              print('APPROVED_22_CARE_CONTROL_ENERGIES_PUBLISHED energies=22 day_month_both=true warm_second_paragraph=true full_length=true 15_birth_referral=infidelity_options bank_private=true key_preserved=true owner_only=true other_files_identical=true homepage_200=true inference_calls=0',flush=True)
          except BaseException:
              if php_changed and old_php is not None:
                  try:write_abs(target_php,old_php);print('PHP_ROLLBACK_OK',flush=True)
                  except BaseException:print('PHP_ROLLBACK_FAILED',flush=True)
              if bank_changed:
                  try:
                      if old_bank is None:ftp.delete(target_bank)
                      else:write_abs(target_bank,old_bank)
                      print('BANK_ROLLBACK_OK',flush=True)
                  except BaseException:print('BANK_ROLLBACK_FAILED',flush=True)
              if created_directory:
                  try:ftp.rmd(protected_dir)
                  except BaseException:pass
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Report verified deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then outcome=success; message="Approved 22 care/control energies deployed to Sonnet preview"; else outcome=failure; message="Care/control energy bank release failed; see logs"; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$outcome" -f context="numi/care-control-bank-regru" -f description="$message" >/dev/null
