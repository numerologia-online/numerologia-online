name: Read-only diagnosis of cabinet connecting state
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read profile routing and request status without changes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,re,json,hashlib,time,urllib.request,urllib.error
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect('server172.hosting.reg.ru',21);f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          home=f.pwd().rstrip('/');host='xn--c1adkkdfjbp1a4l.online'
          def read(path):
              b=io.BytesIO()
              try:f.retrbinary('RETR '+home+'/'+path,b.write)
              except ftplib.error_perm:return b''
              return b.getvalue()
          for p in ['auth-profile.js','api/profile.php','api/numi-miniapp.php']:
              b=read('www/'+host+'/'+p)
              print('FILE '+json.dumps({'path':p,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}))
              if p=='api/profile.php':
                  safe=re.sub(r'[A-Za-z0-9_+=/-]{24,}','[redacted]',b.decode('utf-8','replace'))
                  print('PROFILE_ROUTING '+safe[:18000])
              if p.endswith('.js'):
                  print('CLIENT_ROUTING '+json.dumps([s.strip() for s in b.decode('utf-8','replace').splitlines() if 'CHECK_URL' in s or 'Abort' in s or '12000' in s]))
          text=read('logs/'+host+'.access.log').decode('utf-8','replace')
          rows=[]
          for line in text.splitlines():
              parts=line.split('"')
              if len(parts)<3:continue
              req=parts[1].split()
              if len(req)<2:continue
              path=req[1].split('?',1)[0]
              if path not in ['/api/profile.php','/api/numi-miniapp.php','/api/numi-account.php']:continue
              rows.append([line.split('[',1)[-1].split(']',1)[0],req[0],path,parts[2].strip().split()[0]])
          print('RECENT_CABINET_REQUESTS '+json.dumps(rows[-24:]))
          f.quit()
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          for path,payload in [('/api/profile.php',{'action':'get','init_data':''}),('/api/numi-account.php',{'action':'session'})]:
              start=time.monotonic()
              req=urllib.request.Request(site+path,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Origin':site})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:status=r.status;body=r.read(3000)
              except urllib.error.HTTPError as e:status=e.code;body=e.read(3000)
              except Exception as e:
                  print('API_CHECK '+json.dumps({'route':path,'error':type(e).__name__}));continue
              try:
                  d=json.loads(body);safe={k:d.get(k) for k in ['ok','error','authenticated'] if k in d}
              except Exception:safe={'json':False}
              print('API_CHECK '+json.dumps({'route':path,'http':status,'seconds':round(time.monotonic()-start,2),'result':safe}))
          print('READ_ONLY_COMPLETE model_calls=0 writes=0')
          PY
