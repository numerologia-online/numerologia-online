name: Bound Telegram cabinet connection wait without changing identity checks
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-cloudru-auth-check-20261119.yml]
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Publish only existing auth-profile client and verify readback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,json,hashlib,subprocess,time,urllib.request,urllib.error
          from pathlib import Path
          p='auth-profile.js';desired=Path(p).read_bytes()
          if subprocess.run(['node','--check'],input=desired,capture_output=True).returncode:raise SystemExit('JS_SYNTAX_FAILED')
          assert b'signal: controller.signal' in desired and b'controller.abort(), 12000' in desired
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect('server172.hosting.reg.ru',21);f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              b=io.BytesIO();f.retrbinary('RETR '+root+p,b.write);return b.getvalue()
          def put(p,b):
              f.storbinary('STOR '+root+p,io.BytesIO(b))
              if read(p)!=b:raise RuntimeError('READBACK_MISMATCH')
          old=read(p);changed=False
          try:
              if hashlib.sha256(old).hexdigest()!='692e190335497d565fe30375d2883e02470a4b184ff8d5bbf4c0191b95a6fc9f':raise RuntimeError('CLIENT_BASELINE_CHANGED')
              guard=['api/profile.php','api/numi-account.php','api/numi-miniapp.php','index.html','app.js','redflag-ai-lab/style-test-api.php']
              before={x:read(x) for x in guard}
              changed=True;put(p,desired)
              site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              req=urllib.request.Request(site+p+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status!=200 or response.read(100000)!=desired:raise RuntimeError('PUBLIC_CLIENT_HASH_MISMATCH')
              for x in guard:
                  if read(x)!=before[x]:raise RuntimeError('GUARDED_FILE_CHANGED_'+x)
              with urllib.request.urlopen(site,timeout=25) as response:
                  if response.status!=200:raise RuntimeError('HOME_UNAVAILABLE')
              print('CABINET_WAIT_FIXED timeout_12s=true button_reenabled=true live_js_verified=true auth_backend_unchanged=true redflag_unchanged=true model_calls=0')
          except BaseException:
              if changed:put(p,old);print('CLIENT_ROLLED_BACK')
              raise
          finally:
              try:f.quit()
              except Exception:f.close()
          PY
