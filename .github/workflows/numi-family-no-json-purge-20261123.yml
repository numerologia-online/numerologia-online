name: Delete 42 old Family answer JSON and disable new saves - guarded REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-no-json-purge-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI calls - guard paths, disable Family saved drafts, purge old JSON and locks
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_no_json_purge_20261123.py
