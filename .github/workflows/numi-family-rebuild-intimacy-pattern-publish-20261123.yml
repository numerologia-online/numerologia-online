name: Rebuild Family from approved Intimacy style - guarded REG RU release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-rebuild-intimacy-pattern-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static 22-energy / 31-point checks and guarded FAMILY-only FTPS publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_rebuild_intimacy_pattern_publish_20261123.py
