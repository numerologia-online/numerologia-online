name: Publish self-study naming and disclaimer to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-selfstudy-disclaimer-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish self-study naming and disclaimer on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated release and document
        run: |
          python3 -m py_compile scripts/publish-selfstudy-disclaimer.py
          python3 -m json.tool scripts/selfstudy-disclaimer-patches.json >/dev/null
          test -s disclaimer.html
          grep -q 'href="/disclaimer.html"' index.html
      - name: Apply guarded HTML labels and publish disclaimer with rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-selfstudy-disclaimer.py
