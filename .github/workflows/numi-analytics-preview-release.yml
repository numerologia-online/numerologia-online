name: Publish analytics preview without login on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-analytics-preview-release.yml
permissions:
  contents: read
concurrency:
  group: numi-analytics-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish real analytics without login on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate preview
        run: |
          python3 -m py_compile analytics/deploy-preview.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('analytics/deploy-preview.py').read_text()
          assert '"Что интересно посетителям".encode("utf-8")' in s
          PY
          php -l analytics/public/numi-analytics.php
          node --check moment/analytics.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path("analytics/admin/index.html").read_text()
          assert 'ДЕМО' not in s
          assert 'sample=' not in s
          assert 'fetch(' in s
          assert 'data-sort="views"' in s and 'data-sort="orders"' in s
          assert 'data-sort="conversion"' in s
          assert 'loadNames();' in s
          assert 'questionTitles' in s
          assert 'campaign-rows' in s and 'partner-code' in s
          assert 'utm_campaign' in Path('moment/analytics.js').read_text()
          assert 'sample=' not in s
          php=open('analytics/public/numi-analytics.php',encoding='utf8').read()
          assert 'axEnsureTable' in php
          assert 'admin_login' not in php
          assert '<form id="login"' not in s
          assert 'dashboard.js?v=1' not in s
          print("Preview is display-only and has no API login")
          PY
      - name: Publish real stats page and public aggregate API with backups
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u analytics/deploy-preview.py
