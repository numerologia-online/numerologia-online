name: Publish direct wallet without a cart to REG.RU (TEST only)
on:
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: 'Подтверждаю: публикуем без корзины, ТОЛЬКО тестовые деньги, с резервными копиями'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_test_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed direct-wallet branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-wallet-direct-access-20261107
          fetch-depth: 0
      - name: Verify reviewed source, code syntax and no cart
        env:
          APPROVED_SOURCE_SHA: 8c7bd81af24357679de6ff5503ff8aee965dd878
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
          python3 -m py_compile scripts/deploy-unified-wallet-direct-20261107.py
          for file in account-service/private/{wallet,core,subscriptions,store,fulfillment}.php; do php -l "$file"; done
          node --check account-browser.js
          node --check app.js
          node --input-type=module --check < wallet-client.js
          node --input-type=module --check < store-entry.js
          node --input-type=module --check < shared-offer.js
          node --input-type=module --check < redflag-feature.js
          node --check moment/yes-no/yes-no.js
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
          test "$(grep -c 'src="store-browser.js' index.html || true)" = "0"
          echo DIRECT_WALLET_RELEASE_SYNTAX_APPROVED
      - name: Guarded FTPS backup, deploy, HTTPS and API verification
        env:
          APPROVED_SOURCE_SHA: 8c7bd81af24357679de6ff5503ff8aee965dd878
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/deploy-unified-wallet-direct-20261107.py
