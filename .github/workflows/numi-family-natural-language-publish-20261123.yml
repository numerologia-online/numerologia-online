name: Publish family natural language and deduped arcana to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-natural-language-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify only family facts and style changed, no paid AI tests; guarded publish
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_natural_language_publish_20261123.py
