name: READ ONLY diagnose REG.RU protected full-life text drift before publication
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-life-neutral-readonly-drift-20261116.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 701b061d4247255ac6aade1b96ebdc56d6090cd0
          fetch-depth: 2
      - name: Compare only hashes and paragraph-difference counts (NO FTP WRITES)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,json,hashlib,subprocess,pathlib
          def sha(x):return hashlib.sha256(x).hexdigest()
          def prev(path):return subprocess.check_output(['git','show','HEAD^:'+path])
          names=sorted([s for s in subprocess.check_output(['git','diff','HEAD^','HEAD','--name-only'],text=True).splitlines() if s.startswith('knowledge/full-report/sections/energy-')])
          assert len(names)==21
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          public=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          private=home+'/private/numi-account-20261031/'
          def get(path):
              buf=io.BytesIO()
              ftp.retrbinary('RETR '+path,buf.write)
              return buf.getvalue()
          try:
              manifest=json.loads(get(private+'store-assets.json'))
              counts={}
              for name in names:
                  b=prev(name);a=pathlib.Path(name).read_bytes()
                  live_private=get(private+'store-content/'+name)
                  live_public=get(public+name)
                  oldhash,newhash,privhash,pubhash=map(sha,(b,a,live_private,live_public))
                  m=manifest['files'].get(name)
                  status=lambda h:('old' if h==oldhash else 'new' if h==newhash else 'DIFFERENT')
                  try:
                      old=json.loads(b.decode('utf-8-sig'))
                      live=json.loads(live_private.decode('utf-8-sig'))
                      shapes='same' if list(old['sections'])==list(live['sections']) else 'different'
                      diffs=[(k,len([i for i,(x,y) in enumerate(zip(old['sections'][k].get('paragraphs',[]),live['sections'][k].get('paragraphs',[]))) if x!=y])) for k in old['sections'] if k in live['sections']]
                      diff_sections=[f'{k}:{n}' for k,n in diffs if n]
                  except Exception:
                      shapes='parse-failed';diff_sections=['parse-error']
                  counts[status(privhash)]=counts.get(status(privhash),0)+1
                  print('BANK',name.rsplit('/',1)[-1], 'manifest='+status(m), 'private='+status(privhash), 'public='+status(pubhash), 'public_private_equal='+str(live_private==live_public), 'shape='+shapes,'difference_sections='+','.join(diff_sections),'manifest_matches_private='+str(m==privhash),flush=True)
              print('READONLY_DRIFT_COMPLETE',counts,'uploads=0 mutations=0',flush=True)
          finally:
              ftp.quit()
          PY
