name: READ ONLY check REG.RU access-rule modification times and rollback inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-reg-access-date-20261119.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect only known rule and log paths; no user data or changes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,hashlib
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect('server172.hosting.reg.ru',21);f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p();f.set_pasv(True)
          home=f.pwd().rstrip('/')
          web=home+'/www/xn--c1adkkdfjbp1a4l.online'
          checks=[
            web+'/.htaccess',web+'/.user.ini',web+'/index.html',web+'/app.js',
            web+'/api/redflag-cloudru.php',web+'/auth-profile.js',web+'/account-browser.js',
            home+'/private/numerologia-daily-08-msk-21-10-2026.php']
          for path in checks:
            label=path.replace(home,'~')
            try:
              size=f.size(path)
              try:mtime=f.sendcmd('MDTM '+path)
              except Exception:mtime='NOT_SUPPORTED'
              print('FILE_META',label,'size',size,'mtime_utc',mtime,flush=True)
            except Exception as e:print('FILE_META',label,'unavailable',type(e).__name__,flush=True)
          for path in [home,home+'/logs',home+'/log',home+'/www',home+'/site-safeguard-backups']:
            try:
              names=f.nlst(path)
              selected=[]
              for p in names:
                s=p.split('/')[-1]
                if 'backup' in path:
                  if any(x in s for x in ('access','htaccess','20261119','recovery-20261119-v1')):selected.append(s)
                else:
                  if any(x in s.lower() for x in ('log','access','error','backup','www','xn--')): selected.append(s)
              print('DIRECTORY',path.replace(home,'~'),'count',len(names),'relevant',selected[:55],flush=True)
            except Exception as e:print('DIRECTORY',path.replace(home,'~'),'unavailable',type(e).__name__,flush=True)
          try:
            b=io.BytesIO();f.retrbinary('RETR '+web+'/.htaccess',b.write)
            txt=b.getvalue().decode('utf-8','replace')
            lines=[s.strip() for s in txt.splitlines() if s.strip() and not s.lstrip().startswith('#')]
            for keyword in ['RewriteCond','RewriteRule','Require','Deny','Allow','SetEnvIf','FilesMatch','ErrorDocument','Redirect']:
              print('RULE_COUNTS',keyword,sum(x.lower().startswith(keyword.lower()) for x in lines),flush=True)
            for keyword in ['http_user_agent','remote_addr','geoip','country','cf_connecting_ip','x_forwarded_for','vpn','cloudru','cloud.ru','ipmatch','198.','deny from','forbidden']:
              print('RULE_PATTERNS',keyword,keyword.lower() in txt.lower(),flush=True)
            print('RULES_SIZE_SHA',len(b.getvalue()),hashlib.sha256(b.getvalue()).hexdigest(),flush=True)
          except Exception as e:print('RULES_UNREADABLE',type(e).__name__,flush=True)
          f.quit()
          PY
