name: Moment 300 owner editor manual-date input only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-owner-date-input.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check owner editor JS and date fields before release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('moment/owner-preview.html').read_text(encoding='utf8')
          assert 'type="date"' not in h and 'type="datetime-local"' not in h
          assert h.count('inputmode="numeric"')==3
          assert "function toIsoDate(raw)" in h and "function toIsoMoment(raw)" in h
          assert "'./owner-ai.php'" in h
          assert "if(!access.ok||!access.owner)" in h
          assert "question_id:$('question').value" in h
          code=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/moment-owner-date.js').write_text(code,encoding='utf8')
          PY
          node --check /tmp/moment-owner-date.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const s=fs.readFileSync('/tmp/moment-owner-date.js','utf8');
          const dateCode=s.slice(s.indexOf('function toIsoDate(raw)'),s.indexOf('function showQuestions(){'));
          const ctx={};vm.runInNewContext(dateCode+';globalFns={toIsoDate,toIsoMoment};',ctx);
          const f=ctx.globalFns;
          const cases=[
            [f.toIsoDate('09.09.1986'),'1986-09-09'],
            [f.toIsoDate('29.02.2024'),'2024-02-29'],
            [f.toIsoDate('29.02.2025'),null],
            [f.toIsoDate('31.11.2026'),null],
            [f.toIsoDate('12.05.1997'),'1997-05-12'],
            [f.toIsoMoment('15.11.2026 19:56'),'2026-11-15T19:56'],
            [f.toIsoMoment('15.11.2026 25:22'),null]
          ];
          for(const [actual,want] of cases){if(actual!==want)throw Error('Incorrect date conversion '+actual+' expected '+want)}
          console.log('MOMENT_DATE_ENTRY_VALIDATED no_calendar=true digits_editable=true');
          JS
      - name: Replace ONLY current /moment/owner-preview.html with backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,io,ftplib,ssl,hashlib,time,subprocess,json,urllib.request,urllib.error
          from pathlib import Path
          p='moment/owner-preview.html'
          wanted=Path(p).read_bytes()
          before=subprocess.check_output(['git','show','b271f75f5f3e05f9a5a70e1b56bbaec283863273^:'+p])
          def sha(x):return hashlib.sha256(x).hexdigest()
          primary='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          def online(name):
            req=urllib.request.Request('https://'+primary+'/'+name+'?date_edit_check='+str(time.time_ns()),headers={'User-Agent':'NumiOwnerDateField/1.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=28) as res:return res.status,res.read(300000)
            except urllib.error.HTTPError as e:return e.code,e.read(5000)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          dest=home+'/www/xn--c1adkkdfjbp1a4l.online/'+p
          def read(path):
            b=io.BytesIO();ftp.retrbinary('RETR '+path,b.write);return b.getvalue()
          def write(blob):
            ftp.storbinary('STOR '+dest,io.BytesIO(blob))
            if sha(read(dest))!=sha(blob):raise RuntimeError('FTP_READBACK_FAILED')
          touched=False
          try:
            current=read(dest)
            if current not in (before,wanted):raise RuntimeError('LIVE_EDITOR_CHANGED_REFUSE_OVERWRITE')
            status,api=online('moment/owner-ai.php')
            if status!=403 or json.loads(api).get('error')!='OWNER_LOGIN_REQUIRED':raise RuntimeError('OWNER_GATE_INVALID')
            status,catalog=online('moment/questions.json')
            if status!=200 or len(json.loads(catalog).get('questions',[]))!=300:raise RuntimeError('MOMENT_CATALOG_INVALID')
            backup=home+'/site-safeguard-backups/owner-date-edit-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
            ftp.storbinary('STOR '+backup,io.BytesIO(current))
            if read(backup)!=current:raise RuntimeError('BACKUP_VERIFICATION_FAILED')
            if read(dest)!=current:raise RuntimeError('CONCURRENT_EDIT')
            if current!=wanted:
              touched=True
              write(wanted)
            status,live=online(p)
            if status!=200 or sha(live)!=sha(wanted):raise RuntimeError('PUBLIC_EDITOR_CHECK_FAILED')
            status,api=online('moment/owner-ai.php')
            if status!=403:raise RuntimeError('OWNER_GATE_CHANGED')
            print('MOMENT_OWNER_DATE_INPUT_PUBLISHED_OK only_file=moment/owner-preview.html owner_403=True purchase_untouched=True',flush=True)
          except BaseException:
            if touched:
              try:write(current);print('MOMENT_OWNER_DATE_INPUT_ROLLBACK_OK',flush=True)
              except BaseException:print('MOMENT_OWNER_DATE_INPUT_ROLLBACK_FAILED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
