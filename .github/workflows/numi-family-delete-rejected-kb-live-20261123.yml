name: Remove rejected Family KB safely from REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-delete-rejected-kb-live-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify safe Family pause and remove only rejected KB files from REG RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_remove_kb_live_20261123.py
