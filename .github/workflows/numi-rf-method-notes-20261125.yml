name: Verify and publish accurate Red Flag method notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-rf-method-notes-20261125.yml', '.github/scripts/publish-rf-method-notes.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check exact coverage and publish editorial notes only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/publish-rf-method-notes.py
