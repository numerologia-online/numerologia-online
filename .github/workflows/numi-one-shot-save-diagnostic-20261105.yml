name: Inspect exact origin whitelist for signed Telegram save
on:
  push:
    paths: ['.github/workflows/numi-one-shot-save-diagnostic-20261105.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Show only origin guard lines 49-57 no private configuration
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          p=home+'/www/xn--c1adkkdfjbp1a4l.online/api/numi-save-answer.php'
          buf=io.BytesIO();ftp.retrbinary('RETR '+p,buf.write)
          src=buf.getvalue()
          print('SHA',hashlib.sha256(src).hexdigest())
          for j,line in enumerate(src.decode('utf-8','replace').splitlines(),1):
            if 48<=j<=57:
              if any(s in line.lower() for s in ['secret','token','password','credential','apikey']):
                print('CODE',j,'[sensitive line withheld]')
              else:print('CODE',j,line[:500])
          ftp.quit()
          PY
