name: Revise approved first question answers
on:
  push:
    branches: [fix/yesno-answer-revision]
    paths: [.github/workflows/numi-yesno-answer-revision.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved answers and verify all nine
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/answer-revision/deploy.py
