name: Open approved Family sales and audit all 88 Red Flag cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-family-sales-final-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate isolated question and publish
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_sales_final_20261125.py

# Verify guarded re-publication if the server has independent changes.
