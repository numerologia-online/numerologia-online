name: Restore previous approved Infidelity editor style only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-revert-editor-infidelity-20261122.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify rollback scope and free PHP lint
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import subprocess,pathlib
          p='redflag-ai-lab/style-test-api.php'
          old='a67b1a7b156448252f46a201bf9c8a0135ab3dcd'
          good='f3097a5cd958196073429be4926562d65a2341e3'
          old_bytes=subprocess.check_output(['git','show',old+':'+p])
          good_bytes=subprocess.check_output(['git','show',good+':'+p])
          assert pathlib.Path(p).read_bytes()==good_bytes,'RESTORED_GITHUB_VERSION_CHANGED'
          opener=b'function rfOwnerSharpInfidelity('
          closer=b'\ntry {\n    // DEPLOYMENT_HEALTH_SLOT'
          assert old_bytes.split(opener,1)[0]==good_bytes.split(opener,1)[0],'FLAGS_OR_OTHER_API_CHANGED'
          assert old_bytes.split(closer,1)[1]==good_bytes.split(closer,1)[1],'OTHER_ENDPOINTS_CHANGED'
          assert b'RF_OWNER_INF_SHORT_PREVIEW' in good_bytes,'SHORT_RESPONSE_DIAGNOSTIC_MISSING'
          assert b"unset($_SESSION['last_generation'])" in good_bytes,'FAILED_GENERATION_COOLDOWN_MISSING'
          assert good_bytes.count(b"2800,'google/gemini-3-flash-preview'")==2,'MODEL_OR_TOKEN_BUDGET_CHANGED'
          assert good_bytes.count(b'__CLOUDRU_KEY_BASE64__')==1,'SECRET_LAYOUT_CHANGED'
          assert b'950' in good_bytes and b'1500' in old_bytes,'RESTORE_TARGET_UNEXPECTED'
          print('RESTORE_APPROVED_OLD_EDITOR_STYLE no_inference_queries=true',flush=True)
          PY
      - name: Restore only editor PHP through secure FTPS with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,ssl,io,ftplib,re,subprocess,pathlib,urllib.request,urllib.error,time
          path='redflag-ai-lab/style-test-api.php'
          old='a67b1a7b156448252f46a201bf9c8a0135ab3dcd'
          good='f3097a5cd958196073429be4926562d65a2341e3'
          old_code=subprocess.check_output(['git','show',old+':'+path])
          good_code=subprocess.check_output(['git','show',good+':'+path])
          assert pathlib.Path(path).read_bytes()==good_code,'SOURCE_CODE_MISMATCH'
          base_url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(route):
              req=urllib.request.Request(base_url+route+'?editor_restore='+str(time.time_ns()),
                headers={'Cache-Control':'no-store','User-Agent':'NumiEditorRollback/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status
              except urllib.error.HTTPError as e:return e.code
          if status('')!=200:raise RuntimeError('HOME_NOT_200_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              b=io.BytesIO();ftp.retrbinary('RETR '+root+p,b.write);return b.getvalue()
          def write(p,content):
              ftp.storbinary('STOR '+root+p,io.BytesIO(content))
              if read(p)!=content:raise RuntimeError('READBACK_FAILED_'+p)
          guarded=['redflag-ai-lab/catalog.json','redflag-ai-lab/intimacy-knowledge-v1.json',
             'redflag-feature.js','app.js','index.html','redflag-public-catalog.js',
             'redflag-text-bank.js','api/numi-account.php','api/redflag-free-ai.php']
          changed=False
          try:
              live=read(path)
              matches=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",live))
              if len(matches)!=1:raise RuntimeError('LIVE_KEY_FORMAT_CHANGED')
              match=matches[0];secret=match.group(2)
              if len(secret)<16 or secret==b'__CLOUDRU_KEY_BASE64__' or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_KEY_UNAVAILABLE')
              redacted=live[:match.start(2)]+b'__CLOUDRU_KEY_BASE64__'+live[match.end(2):]
              if redacted!=old_code:raise RuntimeError('SERVER_CODE_NO_LONGER_EXPECTED_VERSION')
              desired=good_code.replace(b'__CLOUDRU_KEY_BASE64__',secret)
              if subprocess.run(['php','-l'],input=desired,capture_output=True).returncode!=0:
                  raise RuntimeError('RESTORED_PHP_SYNTAX_FAILED')
              untouched={p:read(p) for p in guarded}
              folder=home+'/site-safeguard-backups'
              try:ftp.mkd(folder)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              ftp.storbinary('STOR '+folder+'/restore-previous-editor-style-'+stamp+'.php.bak',io.BytesIO(live))
              if read(path)!=live:raise RuntimeError('CONCURRENT_SITE_CHANGE')
              changed=True
              write(path,desired)
              if status('')!=200:raise RuntimeError('HOME_NOT_200_AFTER')
              if status('redflag-ai-lab/style-test-api.php')!=403:
                  raise RuntimeError('OWNER_ROUTE_NOT_PROTECTED')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_ROUTE_ERROR')
              if read(path)!=desired:raise RuntimeError('SITE_ROLLBACK_NOT_VERIFIED')
              for p,data in untouched.items():
                  if read(p)!=data:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              print('PUBLISHED_AND_VERIFIED previous_editor_infidelity_prompt_restored=true redflags_unchanged=true payment_unchanged=true model_2800_unchanged=true short_error_diagnostics_preserved=true inference_calls=0',flush=True)
          except BaseException:
              if changed:
                  try:write(path,live);print('ROLLBACK_OK',flush=True)
                  except BaseException:print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
