name: Publish approved Red Flag intro only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-intro-only-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify strictly scoped content and safely upload only index.html
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          path='index.html'
          data=Path(path).read_bytes()
          assert data.count('Не гадай. Проверь его!'.encode())==1
          assert 'Каждый ответ основан на индивидуальном нумерологическом расчёте по дате рождения мужчины.'.encode() in data
          assert 'Выбирай то, что действительно хочешь о нём узнать.'.encode() in data
          assert b'id="redflag-approved-intro-20261117"' in data
          def sha(b):return hashlib.sha256(b).hexdigest()
          history=subprocess.check_output(['git','log','--format=%H','-n','150','--',path],text=True).splitlines()
          trusted={sha(subprocess.check_output(['git','show',rev+':'+path])) for rev in history}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          remote=home+'/www/xn--c1adkkdfjbp1a4l.online/index.html'
          def read():
            b=io.BytesIO();ftp.retrbinary('RETR '+remote,b.write);return b.getvalue()
          def write(b):
            ftp.storbinary('STOR '+remote,io.BytesIO(b))
            if sha(read())!=sha(b):raise RuntimeError('FTP_READBACK_FAILED')
          before=read()
          wrote=False
          try:
            if sha(before) not in trusted:raise RuntimeError('LIVE_INDEX_NOT_RECOGNIZED_REFUSE_OVERWRITE')
            if before!=data:
              backup=home+'/site-safeguard-backups/redflag-intro-index-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
              ftp.storbinary('STOR '+backup,io.BytesIO(before))
              b=io.BytesIO();ftp.retrbinary('RETR '+backup,b.write)
              if b.getvalue()!=before:raise RuntimeError('BACKUP_READBACK_FAILED')
              if read()!=before:raise RuntimeError('CONCURRENT_LIVE_CHANGE')
              wrote=True;write(data)
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/?redflag_intro_check='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiRedFlagIntroRelease'})
            with urllib.request.urlopen(req,timeout=35) as res:
              live=res.read(300000)
            if sha(live)!=sha(data):raise RuntimeError('PUBLIC_INDEX_NOT_UPDATED')
            print('REDFLAG_INTRO_LIVE_VERIFIED single_file=index.html',flush=True)
          except BaseException:
            if wrote:
              try:write(before);print('REDFLAG_INTRO_ROLLBACK_OK',flush=True)
              except BaseException:print('REDFLAG_INTRO_ROLLBACK_FAILED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
