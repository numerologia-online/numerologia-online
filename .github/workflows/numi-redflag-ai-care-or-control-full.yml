name: Expand approved Red Flag one-question pilot to all 366 unpublished drafts
on:
  push:
    branches: [main]
    paths:
      - data/redflag/ai-drafts/flags/care-or-control.json
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: redflag-unpublished-ai-first-question
  cancel-in-progress: false
jobs:
  complete:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Save unapproved Red Flag care-or-control AI pilot drafts')
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify pilot bank scope and public content unchanged
        run: |
          set -euo pipefail
          node --check scripts/redflag-generate-care-or-control.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/redflag/ai-drafts/flags/care-or-control.json')
          d=json.loads(p.read_text())
          assert d['section']=='flags' and d['questionId']=='care-or-control'
          assert d['status']=='draft' and d['autoPublish'] is False
          assert d['keyRule']=='day-month'
          assert 1<=len(d['entries'])<=366
          assert not any(k=='payment' for k in d)
          print('SAFE_PILOT_READY_FOR_ONE_BANK',len(d['entries']),flush=True)
          PY
      - name: Fill one unpublished bank across all 366 birthdates
        id: generate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REDFLAG_GENERATION_MODE: all
        run: node scripts/redflag-generate-care-or-control.mjs
      - name: Commit generated drafts only, even if incomplete
        id: save
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/redflag/ai-drafts/flags/care-or-control.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/redflag/ai-drafts/flags/care-or-control.json').read_text())
          assert d['section']=='flags' and d['questionId']=='care-or-control'
          assert d['status']=='draft' and d['autoPublish'] is False
          assert len(d['entries'])<=366
          print('EDITORIAL_DRAFTS_SAVED',len(d['entries']),flush=True)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/redflag/ai-drafts/flags/care-or-control.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Red Flag one-question unpublished AI drafts, no customer content"
              git push origin HEAD:main
            fi
          fi
      - name: Report completed or partial draft bank
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.generate.outcome }}" = success ] && [ "${{ steps.save.outcome }}" = success ]; then
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-one-question-366-drafts" -f description="All 366 Red Flag answers generated as unpublished editorial drafts only" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-one-question-366-drafts" -f description="Batch incomplete or unavailable; saved drafts remain unpublished" >/dev/null
          fi
      - name: Require complete generation
        if: steps.generate.outcome != 'success' || steps.save.outcome != 'success'
        run: exit 1
