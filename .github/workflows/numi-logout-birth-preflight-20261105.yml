name: One-time verify real account logout and birthday removal before REG.RU release
on:
  push:
    paths: ['.github/workflows/numi-logout-birth-preflight-20261105.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify syntax and both exit flows and birthday action
        run: |
          node --check account-browser.js
          node --check auth-profile.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const html=fs.readFileSync('index.html','utf8');
          const account=fs.readFileSync('account-browser.js','utf8');
          const tg=fs.readFileSync('auth-profile.js','utf8');
          assert.match(html,/id="account-logout-overview"/);
          assert.match(html,/id="account-birth-delete">Удалить дату рождения<\/button>/);
          assert.match(html,/auth-profile\.js\?v=20261105logoutbirth1/);
          assert.match(html,/account-browser\.js\?v=20261105logoutbirth1/);
          assert.match(account,/logoutControls=\[logoutButton,logoutOverview\]/);
          assert.match(account,/await request\("logout"\)/);
          assert.match(account,/Telegram\?\.WebApp\?\.close/);
          assert.match(account,/window\.dispatchEvent\(new Event\("numi:account-logged-out"\)\)/);
          assert.match(account,/request\("birth",\{birth_date:null\}\)/);
          assert.match(account,/event\.stopImmediatePropagation\(\)/);
          assert.match(account,/control\.disabled=true/);
          assert.match(tg,/signedOutForThisLaunch/);
          assert.match(tg,/requestProfile\("clear"\)/);
          assert.match(tg,/localStorage\.removeItem\(BIRTH_PREFIX \+ verifiedId\)/);
          console.log('LOGOUT_BIRTH_BROWSER_AND_TELEGRAM_CHECKS_OK');
          JS
      - name: Read-only compare each live file with exact Git parent and inspect PHP clear route
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,io,hashlib,subprocess,os,re
          files=['index.html','account-browser.js','auth-profile.js']
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          try:
            for path in files:
              raw=io.BytesIO();f.retrbinary('RETR '+root+path,raw.write)
              old=subprocess.check_output(['git','show','74c3a564b426fbdc57ce22c69cfbe5a486f91014^:'+path])
              livehash=hashlib.sha256(raw.getvalue()).hexdigest()
              oldhash=hashlib.sha256(old).hexdigest()
              print('LOGOUT_PREFLIGHT',path,'LIVE',livehash,'EXPECTED',oldhash,'MATCH',livehash==oldhash,flush=True)
              if livehash!=oldhash:raise RuntimeError('Live drift on '+path+' - do not publish')
            server=io.BytesIO()
            f.retrbinary('RETR '+root+'api/profile.php',server.write)
            code=server.getvalue().decode('utf8','replace')
            print('TELEGRAM_PROFILE_CLEAR_ACTION_EXISTS',bool(re.search(r"['\\\"]clear['\\\"]",code)),flush=True)
            if 'clear' not in code:raise RuntimeError('Missing Telegram profile date clear route')
          finally:f.quit()
          PY
