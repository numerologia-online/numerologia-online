name: Publish account communication privacy note on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-telegram-email-note-release.yml
permissions:
  contents: read
concurrency:
  group: numi-telegram-email-note-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish account communication privacy note on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax checks
        run: |
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-telegram-email-note.py
      - name: Publish only the account UI, with backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-telegram-email-note.py
