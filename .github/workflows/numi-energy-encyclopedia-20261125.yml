name: Publish encyclopedia of 22 energies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-energy-encyclopedia-20261125.yml', '.github/scripts/publish-energy-encyclopedia.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source and publish only public encyclopedia
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/publish-energy-encyclopedia.py
