name: Read-only forensic test of original full-life text banks and live report paths
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-pro-readonly-bank-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check every 1-22 full-report bank without printing paid content or changing site
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ssl,ftplib,os,io,json,pathlib,hashlib,urllib.request,urllib.error,time
          root='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          base=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
            out=io.BytesIO()
            try:ftp.retrbinary('RETR '+base+path,out.write)
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
            return out.getvalue()
          def http(path):
            request=urllib.request.Request(root+path+'?pro_bank_audit='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'NumiProAudit/1.0'})
            try:
              with urllib.request.urlopen(request,timeout=18) as response:
                raw=response.read(300000)
                return response.status,response.headers.get('Content-Type',''),raw
            except urllib.error.HTTPError as e:
              return e.code,e.headers.get('Content-Type',''),e.read(1000)
            except Exception as e:
              return 0,type(e).__name__,b''
          required=['impression','trueSelf','growth','character','parentsPain','familyError','trueLove','partner','moneyBlock','moneyFlow','earning','energyLeak','health','lifeLesson']
          missing=[];invalid=[];different=[];web_status={}
          for energy in range(1,23):
            path='knowledge/full-report/sections/energy-'+str(energy)+'.json'
            local=pathlib.Path(path).read_bytes()
            installed=read(path)
            if installed is None:
              missing.append(energy)
              continue
            if hashlib.sha256(local).digest()!=hashlib.sha256(installed).digest():
              different.append(energy)
            try:
              obj=json.loads(installed)
              sections=obj.get('sections') or {}
              if not all(isinstance(sections.get(k,{}).get('paragraphs'),list) and len(sections[k]['paragraphs'])>3 for k in required):
                invalid.append(energy)
            except Exception:invalid.append(energy)
          for sample in ['knowledge/full-report/sections/energy-1.json','knowledge/full-report/sections/energy-9.json','knowledge/full-report/sections/energy-22.json','knowledge/full-report/free/impression/energy-9.json','knowledge/full-report/energies.json','pro/pro.js','pro/pro.css','pro/','pro/purpose/personal.json']:
            status,ctype,body=http(sample)
            web_status[sample]=status
            print('PRO_AUDIT_HTTP path='+sample+' status='+str(status)+' type='+ctype.split(';')[0]+' bytes='+str(len(body)))
          print('PRO_AUDIT_BANK_SUMMARY git_count=22 ftp_missing='+str(missing)+' ftp_invalid='+str(invalid)+' ftp_sha_different='+str(different))
          for p in ('pro/pro.js','pro/pro.css','pro/index.html','full-report-library.js'):
            live=read(p)
            source=pathlib.Path(p).read_bytes()
            print('PRO_AUDIT_LIVE_CODE '+p+' ftp_exists='+str(live is not None)+' matches_git='+str(live==source)+' bytes='+str(len(live or b'')))
          ftp.quit()
          if missing or invalid:raise RuntimeError('FULL_LIFE_BANKS_MISSING_OR_INVALID')
          print('PRO_AUDIT_COMPLETE no_files_modified=true')
          PY
