name: Read-only live Telegram login verification
on:
  push:
    paths: [.github/workflows/diag-live-login-nochange.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate REG.RU profile contract without displaying private source
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,re,hashlib
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('www/xn--c1adkkdfjbp1a4l.online')
          for path in ['api/profile.php','api/numi-miniapp.php','auth-profile.js']:
            parts=[]
            ftp.retrbinary('RETR '+path,parts.append)
            s=b''.join(parts).decode('utf-8','replace')
            print('FILE',path,'length',len(s),'sha256',hashlib.sha256(s.encode()).hexdigest(),flush=True)
            if path.endswith('.php'):
              print('CONTRACT',path,'has_user_field',bool(re.search(r"""['"]user['"]\s*=>""",s)),'has_name_field',bool(re.search(r"""['"]name['"]\s*=>""",s)),'has_auth_check',('init_data' in s),'has_birth_date',('birth_date' in s),'has_json',('json_encode' in s),flush=True)
            else:
              print('CLIENT', 'server_vercel',('numerologia-online-auth-server.vercel.app/api/miniapp' in s),'silent_on_error',('if (dialog.open) dialog.close();' in s),'client_profile_url',('api/profile.php' in s),flush=True)
          ftp.quit()
          PY