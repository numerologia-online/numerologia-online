name: Read-only live Telegram login verification
on:
  push:
    paths: [.github/workflows/diag-live-login-nochange.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate REG.RU profile contract without displaying private source
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,re,hashlib
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('www/xn--c1adkkdfjbp1a4l.online')
          for path in ['api/profile.php','api/numi-miniapp.php','auth-profile.js']:
            parts=[]
            ftp.retrbinary('RETR '+path,parts.append)
            s=b''.join(parts).decode('utf-8','replace')
            print('FILE',path,'length',len(s),'sha256',hashlib.sha256(s.encode()).hexdigest(),flush=True)
            if path.endswith('.php'):
              print('CONTRACT',path,'has_user_field',bool(re.search(r"""['"]user['"]\s*=>""",s)),'has_name_field',bool(re.search(r"""['"]name['"]\s*=>""",s)),'has_auth_check',('init_data' in s),'has_birth_date',('birth_date' in s),'has_json',('json_encode' in s),flush=True)
            else:
              print('CLIENT', 'server_vercel',('numerologia-online-auth-server.vercel.app/api/miniapp' in s),'silent_on_error',('if (dialog.open) dialog.close();' in s),'client_profile_url',('api/profile.php' in s),flush=True)
          ftp.quit()
          PY
      - name: Read Telegram launch menu and verify TLS without changing settings
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,io,re,json,urllib.request,urllib.error,subprocess
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          b=io.BytesIO()
          ftp.retrbinary('RETR private/bot-config.php',b.write)
          ftp.quit()
          tokens=re.findall(rb'[0-9]{6,15}:[A-Za-z0-9_-]{30,60}',b.getvalue())
          print('PRIVATE_CONFIG_TOKEN_COUNT',len(set(tokens)),flush=True)
          for token in set(tokens):
              for method in ['getMe','getChatMenuButton','getWebhookInfo']:
                  try:
                      req=urllib.request.Request('https://api.telegram.org/bot'+token.decode()+'/'+method)
                      with urllib.request.urlopen(req,timeout=20) as res: data=json.load(res)
                      result=data.get('result',{})
                      if method=='getMe': safe={k:result.get(k) for k in ['username','has_main_web_app']}
                      elif method=='getChatMenuButton': safe=result
                      else: safe={k:result.get(k) for k in ['url','pending_update_count','last_error_message']}
                      print('TELEGRAM',method,json.dumps(safe,ensure_ascii=False),flush=True)
                  except Exception as e: print('TELEGRAM_READ_FAILED',method,type(e).__name__,flush=True)
          for host in ['xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','xn--c1adkkdfjbp1a4l.online']:
              for flag in ['-4','-6']:
                  p=subprocess.run(['curl',flag,'-sS','-o','/dev/null','--max-time','15','-w','%{http_code} %{ssl_verify_result} %{remote_ip}','https://'+host+'/'],capture_output=True,text=True)
                  print('NETWORK',host,flag,p.returncode,p.stdout,flush=True)
          PY
