name: Read-only live Telegram login verification
on:
  push:
    paths: [.github/workflows/diag-live-login-nochange.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare Vercel login aliases and REG.RU local identity
        run: |
          for host in numerologia-online-auth-server.vercel.app numerologia-online-auth-server-79ed375z2-tankraft431-1927.vercel.app numerologia-online-auth-server-hobzpw620-tankraft431-1927.vercel.app; do
            for route in api/health api/miniapp; do
              echo "CHECK $host/$route"
              curl -4 -sS -L --max-time 12 --output /tmp/verify-output --write-out 'STATUS %{http_code} IP %{remote_ip}\n' --url "https://$host/$route"
              head -c 180 /tmp/verify-output
              echo
            done
          done
          echo "CHECK REG.RU profile.php with invalid credentials"
          curl -4 -sS -L --max-time 12 --output /tmp/verify-output --write-out 'STATUS %{http_code} IP %{remote_ip}\n' --request POST -H 'Content-Type: application/json' --data '{"action":"get","init_data":"invalid"}' https://xn--c1adkkdfjbp1a4l.online/api/profile.php
          head -c 180 /tmp/verify-output
          echo
