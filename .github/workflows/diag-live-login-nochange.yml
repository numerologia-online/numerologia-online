name: Read-only live Telegram login verification
on:
  push:
    paths: [.github/workflows/diag-live-login-nochange.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check IPv4-only URL and script behavior
        run: |
          set +e
          curl -4 -sS -L --max-time 14 -o /tmp/home -w 'HOME %{http_code} %{remote_ip}\n' https://xn--c1adkkdfjbp1a4l.online/
          grep -o 'auth-profile.js?v=[0-9]*' /tmp/home | head -3
          curl -4 -sS -L --max-time 14 -o /tmp/auth -w 'SCRIPT %{http_code} %{remote_ip}\n' https://xn--c1adkkdfjbp1a4l.online/auth-profile.js?v=18
          sha256sum /tmp/auth
          grep -F -c 'if (dialog.open) dialog.close();' /tmp/auth
          grep -F -c 'if (!user)' /tmp/auth
          curl -4 -sS -L --max-time 14 -o /tmp/vercel -w 'VERCEL %{http_code} %{remote_ip}\n' https://numerologia-online-auth-server.vercel.app/api/health
          head -c 160 /tmp/vercel
          echo
          curl -4 -sS -L --max-time 14 -o /tmp/profile -w 'REG_PROFILE %{http_code} %{remote_ip}\n' https://xn--c1adkkdfjbp1a4l.online/api/profile.php
          head -c 100 /tmp/profile
          echo
