name: Compare isolated Red Flag owner AI responses through protected server bridge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-owner-dates-direct-probe-20261118.yml
      - .github/scripts/numi-redflag-owner-date-compare.py
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check temporary probe syntax
        run: python3 -m py_compile .github/scripts/numi-redflag-owner-date-compare.py
      - name: Query genuine Cloudflare AI through expiring owner-only REG.RU bridge
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 .github/scripts/numi-redflag-owner-date-compare.py
      - name: Save eight unapproved responses without putting draft text into public logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redflag-owner-date-comparison-20261118
          path: redflag-probe-output/owner-date-comparison.json
          retention-days: 1
          if-no-files-found: warn
