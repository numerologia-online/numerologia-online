name: Publish intimacy full-catalog followup prompts only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-intimacy-all-followups-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact catalogue and PHP syntax
        run: |
          set -euo pipefail
          php -l account-service/private/intimacy-live.php
          python3 -m py_compile .github/scripts/numi_intimacy_all_followups_publish_20261123.py
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('account-service/private/intimacy-live.php').read_text()
          match=re.search(r"\$externalJson=<<<'FOLLOWUP_CATALOG'\n(.*?)\nFOLLOWUP_CATALOG;",src,re.S)
          assert match,'FOLLOWUP_CATALOG_MISSING'
          catalog=json.loads(match.group(1))
          assert len(catalog)==64, 'EXPECTED_64_OTHER_PAID_QUESTIONS'
          assert len({row['вопрос'] for row in catalog})==64
          assert len({row['раздел'] for row in catalog})==7
          assert all(row['тип']=='платный' for row in catalog)
          assert 'Не делай сухое объявление' in src
          assert 'Приоритет: платный вопрос в другом разделе' in src
          assert 'google/gemini-3-flash-preview' in src
          print('INTIMACY_ALL_CATALOG_73_OPTIONS_VALIDATED zero_paid_calls=true')
          PY
      - name: Backed-up guarded REG.RU publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_intimacy_all_followups_publish_20261123.py
