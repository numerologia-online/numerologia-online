name: Publish age boundaries and editable dates only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-age-date-20261125.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Restrict new age-specific readings and preserve date cursor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline boundary and date-edit checks then guarded REG.RU publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_age_date_20261125.py
