name: Release personal day Back button and fresh club text
on:
  push:
    paths:
      - .github/workflows/numi-day-back-live.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish personal day back button and cache refresh to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax and intended UI
        run: |
          node --check app.js
          node --check personal-day-feature.js
          grep -q 'min-width:148px;min-height:54px' personal-day-feature.js
          grep -q '20261103clubback1' app.js
          grep -q '20261103clubback1' index.html
          grep -q '490 ₽' personal-day-feature.js
      - name: Back up and patch only the three production files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,io,os,pathlib,re,ssl,subprocess,tempfile,time
          host='server172.hosting.reg.ru'
          site='www/xn--c1adkkdfjbp1a4l.online'
          day='personal-day-feature.js'
          app='app.js'
          index='index.html'
          expected_day_sha='b493b336091c3191c881afce8e8fc8fb0ec2cbc3afef6f98ccd5b8506b6943f3'
          sources={name:pathlib.Path(name).read_text('utf-8') for name in [day,app,index]}
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect(host,21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          f.set_pasv(True)
          home=f.pwd()
          f.cwd(site)
          if 'index.html' not in [p.rsplit('/',1)[-1] for p in f.nlst()]:
              raise RuntimeError('Wrong website root; no files modified')
          def read(name):
              b=io.BytesIO()
              f.retrbinary('RETR '+name,b.write)
              return b.getvalue()
          def upload(name,data):
              f.storbinary('STOR '+name,io.BytesIO(data))
              if hashlib.sha256(read(name)).digest()!=hashlib.sha256(data).digest():
                  raise RuntimeError('Upload checksum mismatch: '+name)
          originals={name:read(name) for name in [day,app,index]}
          for name,original in originals.items():
              print('LIVE FILE',name,'BEFORE SHA256',hashlib.sha256(original).hexdigest(),'BYTES',len(original),flush=True)
          if hashlib.sha256(originals[day]).hexdigest()!=expected_day_sha:
              raise RuntimeError('Live personal day changed since verified subscriber release; abort to preserve edits')
          new={}
          def one_replace(haystack,before,after,label):
              if haystack.count(before)!=1:
                  raise RuntimeError('Unexpected live '+label+' content, occurrences '+str(haystack.count(before)))
              return haystack.replace(before,after,1)
          old_day=originals[day].decode('utf-8')
          source_day=sources[day]
          pattern=r'<button class="personal-day-back"[^>]*>← Назад</button>'
          matches=re.findall(pattern,source_day)
          if len(matches)!=1 or 'min-height:54px' not in matches[0]:
              raise RuntimeError('Invalid source button')
          old_button='<button class="personal-day-back" type="button" aria-label="Вернуться ко всем расчётам">← Назад</button>'
          new_day=one_replace(old_day,old_button,matches[0],'Back button')
          if '490 ₽' not in new_day or 'Месячная подписка ещё готовится' in new_day:
              raise RuntimeError('New club details missing; no files modified')
          new[day]=new_day.encode('utf-8')
          live_app=originals[app].decode('utf-8')
          pattern_app=r'import\(["\']\./personal-day-feature\.js\?v=[^"\']+["\']\)'
          matched=re.findall(pattern_app,live_app)
          if len(matched)!=1:
              raise RuntimeError('Unexpected dynamic day import: '+str(len(matched)))
          updated_app='import("./personal-day-feature.js?v=20261103clubback1")'
          new[app]=live_app.replace(matched[0],updated_app,1).encode('utf-8')
          live_index=originals[index].decode('utf-8')
          pattern_index=r'src=["\']app\.js\?v=[^"\']+["\']'
          matches=re.findall(pattern_index,live_index)
          if len(matches)!=1:
              raise RuntimeError('Unexpected entry script reference: '+str(len(matches)))
          new[index]=live_index.replace(matches[0],'src="app.js?v=20261103clubback1"',1).encode('utf-8')
          for name in [day,app]:
              with tempfile.NamedTemporaryFile(suffix='.mjs') as test:
                  test.write(new[name])
                  test.flush()
                  res=subprocess.run(['node','--check',test.name],capture_output=True,text=True)
                  if res.returncode:
                      raise RuntimeError(name+' syntax check failed: '+res.stderr[:1000])
          for name in new:
              print('PATCH READY',name,'AFTER SHA256',hashlib.sha256(new[name]).hexdigest(),'BYTES',len(new[name]),flush=True)
          f.cwd(home)
          try:f.mkd('site-safeguard-backups')
          except ftplib.error_perm:pass
          f.cwd('site-safeguard-backups')
          stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
          for name,data in originals.items():
              backup=stamp+'-day-back-'+name
              upload(backup,data)
              print('BACKUP VERIFIED',name,'OUTSIDE PUBLIC ROOT',flush=True)
          f.cwd(home)
          f.cwd(site)
          changed=[]
          try:
              for name in [day,app,index]:
                  changed.append(name)
                  upload(name,new[name])
                  print('PUBLISHED AND VERIFIED',name,flush=True)
          except Exception:
              print('UPLOAD FAILED; ROLLING BACK',flush=True)
              for name in reversed(changed):
                  try:
                      upload(name,originals[name])
                      print('RESTORED',name,flush=True)
                  except Exception as exc:
                      print('ROLLBACK FAILED',name,type(exc).__name__,flush=True)
              raise
          finally:
              f.quit()
          print('REG.RU LIVE PERSONAL DAY BUTTON RELEASE SUCCESS',flush=True)
          PY
