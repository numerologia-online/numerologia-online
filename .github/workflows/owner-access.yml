name: Owner access safety checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-access.yml'
      - 'tests/owner-access.test.mjs'
      - 'tests/telegram-scroll-guard.test.mjs'
      - 'pro/pro.js'
      - 'auth-server/**'
      - 'auth-profile.js'
      - 'account-service/**'
      - 'telegram-scroll-guard.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-only access and syntax
        run: |
          node --test tests/owner-access.test.mjs tests/telegram-scroll-guard.test.mjs
          node --check pro/pro.js
          node --check auth-server/api/miniapp.js
          node --check auth-server/api/session.js
          node --check auth-server/api/start.js
          node --check auth-server/api/callback.js
