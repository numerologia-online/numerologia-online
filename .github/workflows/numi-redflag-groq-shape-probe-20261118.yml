name: Diagnose real Groq Red Flag four-block output without touching site
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-groq-shape-probe-20261118.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Ask owner-approved Groq model for exact four-block response
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,re,json,pathlib,urllib.request
          text=pathlib.Path('cloudflare/redflag-draft-ai/src/index.js').read_text('utf8')
          def extract(name,separator):
              pattern=r'const '+name+r'=\\[([\\s\\S]*?)\\]\\.join\\('+re.escape(json.dumps(separator,ensure_ascii=False))+r'\\);'
              found=re.search(pattern,text)
              if not found:
                  print('EXTRACTION_MISSING',name,flush=True)
                  raise SystemExit(1)
              return separator.join(json.loads(line.strip().removesuffix(',')) for line in found.group(1).splitlines() if line.strip().startswith('"'))
          system=extract('FLAGS_OWNER_PROMPT','\\n\\n')
          response_format=extract('FLAGS_PRIVATE_RESPONSE_FORMAT','\\n')
          msg='Вопрос: Скромный мужчина или считает себя подарком судьбы?\nНаправление анализа этого вопроса: исследуй самооценку мужчины.\nДень рождения мужчины: 9 (энергия 9).\nМесяц рождения мужчины: 10 (энергия 10).\nРеально доступные вопросы в других разделах: ["Щедрый мужчина или считает каждую копейку?","Пишет первым или ждёт инициативы от женщины?"]'
          payload={'model':'openai/gpt-oss-120b','messages':[{'role':'system','content':system+'\\n\\n'+response_format},{'role':'user','content':msg}],'temperature':0.7,'reasoning_effort':'low','max_completion_tokens':2300,'stream':False}
          request=urllib.request.Request('https://api.groq.com/openai/v1/chat/completions',data=json.dumps(payload,ensure_ascii=False).encode('utf8'),method='POST',headers={'Authorization':'Bearer '+os.environ['GROQ_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=100) as resp:r=json.load(resp)
          body=r.get('choices',[{}])[0].get('message',{}).get('content') or ''
          lengths={x:len((re.search('<'+x+'>\\s*([\\s\\S]*?)\\s*</'+x+'>',body,re.I) or [None,''])[1]) for x in ('DAY','MONTH','COMBINED','ANSWER')}
          print('GROQ_RAW_CHARS',len(body),'BLOCK_LENGTHS',lengths,'TOKENS',r.get('usage',{}).get('total_tokens'),flush=True)
          output=pathlib.Path('redflag-groq-shape');output.mkdir(exist_ok=True)
          (output/'raw-output.txt').write_text(body,encoding='utf8')
          PY
      - name: Save private one-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redflag-groq-shape-20261118
          path: redflag-groq-shape/
          retention-days: 1
          if-no-files-found: warn
