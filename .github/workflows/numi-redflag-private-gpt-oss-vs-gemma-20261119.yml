name: Compare private Red Flag drafts using stronger Workers AI model
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-private-gpt-oss-vs-gemma-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run six private Red Flag drafts with GPT OSS via the already working Wrangler AI binding
        id: qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,urllib.error,hmac,hashlib,pathlib,time,difflib,shutil,concurrent.futures
          key=os.environ.get("GROQ_API_KEY","")
          if not key.startswith("gsk_"):raise RuntimeError("OWNER_PROOF_UNAVAILABLE")
          proof=hmac.new(key.encode(),b"numi-moment-cloudflare-bridge-v1",hashlib.sha256).hexdigest()
          runtime=pathlib.Path("private-strong-model-runtime")
          (runtime/"src").mkdir(parents=True,exist_ok=True)
          source=pathlib.Path("cloudflare/redflag-draft-ai/src/index.js").read_text("utf-8")
          original='const MODEL="@cf/google/gemma-4-26b-a4b-it";'
          assert original in source
          source=source.replace(original,'const MODEL="@cf/openai/gpt-oss-120b";')
          source=source.replace('chat_template_kwargs:{enable_thinking:false}','reasoning_effort:"low"')
          source=source.replace('max_completion_tokens:', 'max_tokens:')
          # In this LOCAL TEST COPY only, return drafts that failed editorial validation
          # so their quality can still be reviewed; never publish test outputs to a site.
          old='return reply(503,{ok:false,error:"FLAGS_DRAFT_NEEDS_REVIEW",draft_only:true});'
          assert old in source
          source=source.replace(old,'return reply(200,{ok:true,draft_only:true,published:false,model:MODEL,answer,needs_review:true});')
          (runtime/"src/index.js").write_text(source,"utf-8")
          shutil.copyfile("cloudflare/redflag-draft-ai/wrangler.jsonc",runtime/"wrangler.jsonc")
          title="Уважает женское «нет» или начинает давить?"
          choices=[(9,2),(9,7),(9,9),(31,3),(31,8),(31,12)]
          dir=pathlib.Path("private-gptoss-compare")
          dir.mkdir(exist_ok=True)
          env=os.environ.copy()
          env["NO_PROXY"]="localhost,127.0.0.1"
          env["no_proxy"]="localhost,127.0.0.1"
          env["WRANGLER_SEND_METRICS"]="false"
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with (dir/"wrangler.log").open("w",encoding="utf8") as fh:
              p=subprocess.Popen(["npx","--yes","wrangler@4","dev","--ip","127.0.0.1","--port","8787"],
                cwd=str(runtime),env=env,stdout=fh,stderr=subprocess.STDOUT)
              try:
                  ready=False
                  for i in range(75):
                      if p.poll() is not None:break
                      try:
                          with client.open("http://127.0.0.1:8787/health",timeout=3) as response:
                              data=json.load(response)
                          if data.get("ok") and data.get("ai_bound"):ready=True;break
                      except Exception:pass
                      time.sleep(1)
                  if not ready:raise RuntimeError("WRANGLER_LOCAL_AI_UNAVAILABLE")
                  def ask(pair):
                      day,month=pair
                      payload={"category":"flags","question_id":"say-no","title":title,
                        "day":day,"month":month,"followups":[]}
                      http=0;result={};error=None
                      for retry in range(2):
                          req=urllib.request.Request("http://127.0.0.1:8787/v1/redflag-owner-question",
                            data=json.dumps(payload,ensure_ascii=False).encode(),method="POST",
                            headers={"Content-Type":"application/json","Accept":"application/json",
                              "X-Numi-Moment-Proof":proof})
                          try:
                              with client.open(req,timeout=135) as response:
                                  http=response.status;result=json.load(response)
                              break
                          except urllib.error.HTTPError as ex:
                              http=ex.code
                              try:result=json.loads(ex.read(3000))
                              except Exception:result={"error":"HTTP_"+str(ex.code)}
                              if http in (401,403,404):break
                          except Exception as ex:
                              http=0;result={"error":type(ex).__name__}
                          time.sleep(6*(retry+1))
                      answer=result.get("answer","")
                      return {"date":f"{day:02d}.{month:02d}","http":http,
                        "ok":bool(http==200 and result.get("ok")==True and answer),
                        "chars":len(answer),"answer":answer,"needs_review":result.get("needs_review",False),
                        "error":result.get("error")}
                  with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
                      answers=list(ex.map(ask,choices))
                  for x in answers:
                      print("CF_GPTOSS_PRIVATE",x["date"],"HTTP",x["http"],"CHARS",x["chars"],
                        "NEEDS_REVIEW",x["needs_review"],"ERROR",x["error"],flush=True)
                  (dir/"six-dates.json").write_text(json.dumps({"model":"@cf/openai/gpt-oss-120b",
                    "questions":title,"answers":answers,"published":False,"reg_ru_touched":False},
                    ensure_ascii=False,indent=2),encoding="utf8")
                  if sum(x["ok"] for x in answers)<4:raise RuntimeError("FEWER_THAN_FOUR_GPTOSS_OUTPUTS")
              finally:
                  p.terminate()
                  try:p.wait(timeout=8)
                  except subprocess.TimeoutExpired:p.kill()
          PY
      - name: Save private stronger-model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-gpt-oss-six-date-comparison
          path: private-gptoss-compare/six-dates.json
          retention-days: 3
          if-no-files-found: warn
      - name: Record verification link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.qa.outcome }}" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="numi/redflag-gptoss-private-qa" \
            -f description="Test stronger model locally with private owner-only drafts" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

# energy-lens-editorial-20261119: evaluate specific month/day shadow interactions
