name: Release reviewed Club-only Yes/No backend to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-yesno-daily-free.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish Club-only Yes/No backend to REG.RU')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint PHP, test catalog and verify no individual Yes/No sale
        run: |
          set -euo pipefail
          for file in account-service/private/{core,wallet,store}.php yesno-service/public/numi-yesno-answer.php; do php -l "$file"; done
          node --check moment/yes-no/yes-no.js
          node --input-type=module --check < wallet-client.js
          python3 -m py_compile yesno-service/daily-free/deploy.py
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
          python3 - <<'PY'
          from pathlib import Path
          core=Path('account-service/private/core.php').read_text()
          wallet=Path('account-service/private/wallet.php').read_text()
          answer=Path('yesno-service/public/numi-yesno-answer.php').read_text()
          ui=Path('moment/yes-no/yes-no.js').read_text()
          html=Path('moment/yes-no/index.html').read_text()
          assert "$price=$club?0:1900;" not in core
          assert "$price=0;" in core and "CLUB_REQUIRED" in core
          assert "YESNO_CLUB_ONLY" in wallet
          assert "$paidAnswer" not in answer
          assert "INSERT IGNORE INTO numi_yesno_daily_uses" in answer
          assert "DAILY_LIMIT_REACHED" in answer
          assert "naCatalogHasAccess($db,['id'=>$accountId],'club_month','club')" in answer
          assert "showInlinePurchase" not in ui
          assert "19 ₽" not in html
          print("YESNO_CLUB_ONLY_SOURCE_AND_REGRESSION_TESTS_OK")
          PY
      - name: Guard remote originals, backup, publish only three PHP files, verify live API
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/daily-free/deploy.py
