name: Verify and publish Club calendar and rituals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-club-benefits-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numi_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NUMI_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=numi_test;charset=utf8mb4"
      NUMI_TEST_MYSQL_USER: root
      NUMI_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Run existing wallet suite on isolated MySQL without real charges
        run: |
          php -l account-service/tests/real-wallet-payment.php
          php account-service/tests/real-wallet.php
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: reg-ru-manual-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify access, calendar, ten original rituals and syntax
        run: |
          node --test tests/monthly-calendar-paywall.test.mjs tests/club-checkout.test.mjs
          for f in club-benefits.js personal-day-feature.js destiny-code-feature.js app.js; do node --input-type=module --check < "$f"; done
          php -l account-service/public/numi-club-benefits.php
      - name: Publish narrow changes, private ritual library and read-only access API
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,subprocess,pathlib,urllib.request,urllib.error
          patches=json.loads(pathlib.Path('.github/club-benefits-patches-20261127.json').read_text())
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          private=home+'/private/numi-account-20261031/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          def syntax(path,data):
              if path.endswith('.js'):
                  subprocess.run(['node','--input-type=module','--check'],input=data,check=True)
              elif path.endswith('.php'):
                  subprocess.run(['php','-l'],input=data,check=True)
          def optional(path):
              try:return read(path)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
          try:
              assert b'account-browser.js' in read(root+'index.html')
              core=read(private+'core.php')
              assert b'function naTestOwner(' in core and b'function naCatalogHasAccess(' in core
              old={};new={}
              for rel,source in [(private+'club-money-rituals.json','data/money-rituals.json'),(root+'api/numi-club-benefits.php','account-service/public/numi-club-benefits.php'),(root+'club-benefits.js','club-benefits.js')]:
                  old[rel]=optional(rel)
                  new[rel]=pathlib.Path(source).read_bytes()
                  assert old[rel] is None or old[rel]==new[rel],'Unexpected existing target'
                  syntax(rel,new[rel])
              for path,changes in patches.items():
                  rel=root+path
                  old[rel]=read(rel)
                  current=old[rel].decode('utf-8')
                  for before,after in changes:
                      if before!=after and current.count(after)==1:continue
                      assert current.count(before)==1, 'Live copy differs; no files modified: '+path
                      current=current.replace(before,after,1)
                  new[rel]=current.encode('utf-8')
                  syntax(path,new[rel])
                  print('VALIDATED',path)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for i,(path,data) in enumerate(old.items()):
                  if data is not None and data!=new[path]:
                      put(backup+'/club-benefits-'+os.environ['GITHUB_RUN_ID']+'-'+str(i)+'.bak',data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      if old[path]==data:continue
                      assert optional(path)==old[path],'Concurrent change'
                      uploaded.append(path)
                      put(path,data)
                      print('PUBLISHED AND VERIFIED',path.split('/')[-1])
                  origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
                  for benefit in ['calendar','rituals']:
                      request=urllib.request.Request(origin+'/api/numi-club-benefits.php',data=json.dumps({'benefit':benefit}).encode(),headers={'Origin':origin,'Content-Type':'application/json','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          result=json.load(response)
                      assert result=={'ok':True,'allowed':False},'Guest access check failed'
                  print('GUEST BENEFITS DENIED; no payment operation')
              except BaseException:
                  for path in reversed(uploaded):
                      if old[path] is None:ftp.delete(path)
                      else:put(path,old[path])
                  raise
              print('SUCCESS: Club benefits only, wallet and Telegram code untouched')
          finally:ftp.quit()
          PY
