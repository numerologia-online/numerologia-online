name: Publish truly free per-date Red Flag AI answer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-free-say-no-ai-live-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate narrow free question scope
        run: |
          set -euo pipefail
          node --check redflag-feature.js
          node --check app.js
          php -l api/redflag-free-ai.php
          python3 - <<'PY'
          from pathlib import Path
          source=Path('api/redflag-free-ai.php').read_text()
          feature=Path('redflag-feature.js').read_text()
          assert 'naAllowedOrigins()' in source
          assert "'question_id'=>'say-no'" in source
          assert "'category'=>'flags'" in source
          assert 'numi-redflag-free-ai-v1' in source
          assert 'private/numi-moment-groq/config.local.php' in source
          assert 'CURLOPT_TIMEOUT=>85' in source
          assert "'ai_generated'=>true" in source
          assert 'naTestOwner(' not in source
          assert 'wallet' not in source.lower()
          assert 'store-assets' not in source
          assert 'showInlinePurchase(item,target,' in feature
          assert 'if(question.isFree&&id==="say-no"' in feature
          assert '"/api/redflag-free-ai.php"' in feature
          assert 'data?.ai_generated!==true' in feature
          assert 'const task=Promise.resolve().then(()=>question.answer(profile));' in feature
          assert 'redflag-feature.js?v=free-say-no-ai-20261117' in Path('app.js').read_text()
          assert 'app.js?v=free-say-no-ai-20261117' in Path('index.html').read_text()
          print('REDFLAG_FREE_REAL_AI_SCOPE_VALIDATED',flush=True)
          PY
      - name: Backup, publish and live-smoke only free AI and front-end
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,io,hashlib,subprocess,time,urllib.request,urllib.error,json
          paths=['api/redflag-free-ai.php','redflag-feature.js','app.js','index.html']
          desired={p:Path(p).read_bytes() for p in paths}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          known={}
          for p in paths:
              revs=subprocess.check_output(['git','log','--format=%H','-n','250','--',p],text=True).splitlines()
              known[p]={sha(subprocess.check_output(['git','show',rev+':'+p])) for rev in revs}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          prefix=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              buff=io.BytesIO()
              try:ftp.retrbinary('RETR '+prefix+p,buff.write)
              except ftplib.error_perm as exc:
                  if str(exc).startswith('550'):return None
                  raise
              return buff.getvalue()
          def put(p,data):
              ftp.storbinary('STOR '+prefix+p,io.BytesIO(data))
              if read(p)!=data:raise RuntimeError('FTP_READBACK_FAILED:'+p)
          original={};modified=[]
          try:
              original={p:read(p) for p in paths}
              for p in paths:
                  if p=='api/redflag-free-ai.php' and original[p] is not None:
                      raise RuntimeError('FREE_ENDPOINT_ALREADY_EXISTS_REFUSE_OVERWRITE')
                  if original[p] is not None and sha(original[p]) not in known[p]:
                      raise RuntimeError('UNKNOWN_LIVE_FILE_REFUSE_OVERWRITE:'+p)
                  if p!='api/redflag-free-ai.php' and original[p] is None:
                      raise RuntimeError('EXPECTED_FRONTEND_FILE_MISSING:'+p)
              backDir=home+'/site-safeguard-backups'
              try:ftp.mkd(backDir)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  if original[p] is None:continue
                  backup=backDir+'/redflag-free-ai-'+stamp+'-'+p.replace('/','-')+'.bak'
                  ftp.storbinary('STOR '+backup,io.BytesIO(original[p]))
                  buf=io.BytesIO();ftp.retrbinary('RETR '+backup,buf.write)
                  if buf.getvalue()!=original[p]:raise RuntimeError('BACKUP_MISMATCH:'+p)
              for p in paths:
                  if read(p)!=original[p]:raise RuntimeError('CONCURRENT_LIVE_FILE_CHANGE:'+p)
                  if desired[p]!=original[p]:
                      modified.append(p);put(p,desired[p])
              public='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in ['redflag-feature.js','app.js','index.html']:
                  url=public+p+'?free_ai_verify='+str(time.time_ns())
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-store'})
                  with urllib.request.urlopen(req,timeout=30) as res:actual=res.read(300000)
                  if sha(actual)!=sha(desired[p]):
                      raise RuntimeError('FRONTEND_LIVE_HASH_MISMATCH:'+p)
              endpoint=public+'api/redflag-free-ai.php'
              # No answer or payment should be possible through an unsupported ID.
              negative=urllib.request.Request(endpoint,
                  data=json.dumps({'question_id':'not-free','day':9,'month':9}).encode(),
                  method='POST',headers={'Content-Type':'application/json','Origin':public.rstrip('/')})
              try:
                  with urllib.request.urlopen(negative,timeout=15) as res:
                      raise RuntimeError('UNEXPECTED_ARBITRARY_QUESTION_IN_FREE_AI')
              except urllib.error.HTTPError as e:
                  if e.code!=400:raise RuntimeError('FREE_AI_VALIDATION_FAILED_HTTP_'+str(e.code))
              # End-to-end inference, not merely a static source check.
              request=urllib.request.Request(endpoint,
                  data=json.dumps({'question_id':'say-no','day':9,'month':9}).encode(),
                  method='POST',headers={
                      'Content-Type':'application/json',
                      'Accept':'application/json',
                      'Origin':public.rstrip('/')
                  })
              try:
                  with urllib.request.urlopen(request,timeout=115) as res:
                      value=json.load(res)
              except urllib.error.HTTPError as e:
                  raise RuntimeError('FREE_AI_LIVE_HTTP_'+str(e.code))
              except Exception as e:
                  raise RuntimeError('FREE_AI_LIVE_REQUEST_FAILED_'+e.__class__.__name__)
              answer=value.get('answer','')
              assert value.get('ok') is True and value.get('free') is True
              assert value.get('ai_generated') is True
              assert value.get('question_id')=='say-no' and value.get('date_key')=='9-9'
              assert isinstance(answer,str) and 450<=len(answer)<=1900
              assert len(answer.split('\n\n'))==2
              assert ':' not in answer and '—' not in answer
              print('REDFLAG_FREE_SAY_NO_AI_LIVE_OK two_paragraphs=true day_month=9-9 paid_unchanged=true',flush=True)
          except BaseException:
              for p in reversed(modified):
                  try:
                      if original[p] is None:ftp.delete(prefix+p)
                      else:put(p,original[p])
                      print('REDFLAG_FREE_AI_ROLLBACK_OK',p,flush=True)
                  except BaseException:
                      print('REDFLAG_FREE_AI_ROLLBACK_FAILED',p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Confirm live free AI successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-free-say-no-ai-live" -f description="Live free Red Flag AI answer generated for 9-9; no billing changes" >/dev/null
      - name: Mark free AI live not verified
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-free-say-no-ai-live" -f description="Free Red Flag AI live generation not verified; see rollback" >/dev/null
