name: Publish owner-only fake purchases to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-owner-test-checkout-release.yml
permissions:
  contents: read
concurrency:
  group: numi-owner-test-checkout-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Retry fixed owner-only 0-ruble test purchases on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP, JavaScript and sandbox deployment
        run: |
          php -l account-service/private/core.php
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-test-checkout.py
          grep -q 'function naTestOwner' account-service/private/core.php
          grep -q 'numi-owner-test-checkout-20261031' index.html
      - name: Publish isolated owner test with backup and live verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-test-checkout.py
