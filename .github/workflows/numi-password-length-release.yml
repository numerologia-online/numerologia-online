name: Publish password length change on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-password-length-release.yml
permissions:
  contents: read
concurrency:
  group: numi-password-length-live-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish shorter password acceptance on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate syntax
        run: |
          node --check account-browser.js
          php -l account-service/private/core.php
          python3 -m py_compile account-service/deploy-password-length.py
      - name: Deploy only account frontend and private account server with backups
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-password-length.py
