name: Release universal partner wording only · full life 22 energy banks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-universal-life-partner-release-20261116.yml
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  update_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout main and existing safe publication scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare ONLY partner wording and protected bank hashes
        run: |
          python3 -m py_compile scripts/release-universal-life-partner-20261116.py
          python3 scripts/release-universal-life-partner-20261116.py prepare
          git diff --check
      - name: Save reviewed-scope texts to GitHub history before server release
        run: |
          git config user.name "numi-universal-partner-editor"
          git config user.email "numi-universal-partner-editor@users.noreply.github.com"
          git add -- knowledge/full-report/sections/energy-*.json account-service/private/store-assets.json
          git diff --cached --check
          git commit -m "Full-life partner sections: universal wording without changing other sections"
          git push origin HEAD:refs/heads/main
          echo 'UNIVERSAL_PARTNER_GITHUB_OK'
      - name: Back up and publish only edited energy banks and private manifest to REG.RU
        env:
          REG_FTP_USER: \${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: \${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 scripts/release-universal-life-partner-20261116.py deploy
