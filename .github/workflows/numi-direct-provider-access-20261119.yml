name: Check direct REG.RU provider access without inference
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-direct-provider-access-20261119.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check authentication and provider model list without generating
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,hmac,io,json,os,pathlib,re,secrets,ssl,subprocess,time,urllib.request,urllib.error
          key=os.environ['GROQ_API_KEY']
          proof=hmac.new(key.encode(),b'numi-moment-cloudflare-bridge-v1',hashlib.sha256).hexdigest()
          source=pathlib.Path('cloudflare/moment-300-ai/src/index.js').read_text('utf-8')
          expected=re.search(r'BRIDGE_PROOF_SHA256 = "([0-9a-f]{64})"',source).group(1)
          print('MOMENT_METADATA_AUTH '+json.dumps({'github_proof_matches_worker':hashlib.sha256(proof.encode()).hexdigest()==expected}),flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def get(url,headers):
              req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-store','User-Agent':'NumiOneQuestionVerifiedRelease/1.0',**headers})
              try:
                  with opener.open(req,timeout=35) as response:code=response.status;body=response.read(20000)
              except urllib.error.HTTPError as error:code=error.code;body=error.read(20000)
              try:data=json.loads(body)
              except (ValueError,UnicodeError):data={'response_json':False}
              if isinstance(data,dict) and isinstance(data.get('data'),list):data={'models_count':len(data['data'])}
              return {'http':code,'data':data}
          direct=get('https://api.groq.com/openai/v1/models',
              {'Authorization':'Bearer '+key})
          print('MOMENT_METADATA_FROM_GITHUB '+json.dumps(direct,ensure_ascii=False),flush=True)
          token=secrets.token_hex(32)
          php=r'''<?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store, private, max-age=0');
          if(time()>__DEADLINE__||!hash_equals('__TOKEN_HASH__',hash('sha256',(string)($_SERVER['HTTP_X_NUMI_METADATA']??'')))){http_response_code(404);exit;}
          try{
          $config=require dirname(__DIR__,3).'/private/numi-moment-groq/config.local.php';
          $key=$config['groq_api_key']??'';
          if(!is_string($key)||!str_starts_with($key,'gsk_'))throw new RuntimeException('KEY_MISSING');
          $proof=hash_hmac('sha256','numi-moment-cloudflare-bridge-v1',$key);
          $ch=curl_init('https://api.groq.com/openai/v1/models');
          curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_CONNECTTIMEOUT=>8,CURLOPT_TIMEOUT=>25,
          CURLOPT_USERAGENT=>'NumiMomentOwnerPreview/2.0',CURLOPT_HTTPHEADER=>['Accept: application/json','Authorization: Bearer '.$key]]);
          $body=curl_exec($ch);$code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);$errno=curl_errno($ch);curl_close($ch);
          echo json_encode(['site_key_matches_github'=>hash_equals('__KEY_HASH__',hash('sha256',$key)),'worker_http'=>$code,'curl_errno'=>$errno,
          'provider'=>is_string($body)?(isset(json_decode($body,true)['data'])?['models_count'=>count(json_decode($body,true)['data'])]:['error_excerpt'=>mb_substr(str_replace($key,'[redacted]',$body),0,1200)]):null],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          }catch(Throwable $e){http_response_code(503);echo json_encode(['error'=>get_class($e)]);}
          '''
          php=php.replace('__DEADLINE__',str(int(time.time())+180)).replace('__TOKEN_HASH__',hashlib.sha256(token.encode()).hexdigest()).replace('__KEY_HASH__',hashlib.sha256(key.encode()).hexdigest())
          lint=subprocess.run(['php','-l'],input=php.encode(),capture_output=True)
          if lint.returncode:raise SystemExit('METADATA_HELPER_SYNTAX_FAILED')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          name='.groq-metadata-'+secrets.token_hex(16)+'.php'
          remote=home+'/www/xn--c1adkkdfjbp1a4l.online/moment/'+name
          try:
              ftp.storbinary('STOR '+remote,io.BytesIO(php.encode()))
              result=get('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/'+name,{'X-Numi-Metadata':token})
              print('MOMENT_METADATA_FROM_REGRU '+json.dumps(result,ensure_ascii=False),flush=True)
          finally:
              ftp.delete(remote)
              print('MOMENT_METADATA_HELPER_REMOVED inference_calls=0',flush=True)
              try:ftp.quit()
              except Exception:ftp.close()
          PY
