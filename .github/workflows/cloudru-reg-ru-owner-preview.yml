name: Install Cloud.ru owner preview directly on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudru-reg-ru-owner-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check owner-only PHP syntax
        run: php -l redflag-ai-lab/cloudru-owner-preview.php
      - name: Publish private API key and owner preview; no paid model requests
        env:
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os, io, urllib.request, urllib.error, time
          from pathlib import Path
          key = os.environ.get('CLOUDRU_API_KEY','').strip()
          if len(key) < 16:
              raise RuntimeError('CLOUDRU_API_KEY_SECRET_MISSING: no files published')
          for envname in ('REG_FTP_USER','REG_FTP_PASSWORD'):
              if not os.environ.get(envname):
                  raise RuntimeError('MISSING_DEPLOY_SECRET: '+envname)
          public_rel = 'redflag-ai-lab/cloudru-owner-preview.php'
          public_data = Path(public_rel).read_bytes()
          escaped = key.replace('\\','\\\\').replace("'","\\'")
          config_data = ("<?php\nreturn ['cloudru_api_key' => '" + escaped + "'];\n").encode('utf-8')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          docroot=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          p_private=home+'/private/numi-cloudru'
          public_path=docroot+public_rel
          config_path=p_private+'/config.local.php'
          backupdir=home+'/site-safeguard-backups'
          def mkdir_if_missing(path):
              try:ftp.mkd(path)
              except ftplib.error_perm as err:
                  if not str(err).startswith('550'):raise
          def read(path):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+path,b.write)
              except ftplib.error_perm as err:
                  if str(err).startswith('550'):return None
                  raise
              return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('FTP_READBACK_MISMATCH')
          previous={}
          changed=[]
          try:
              mkdir_if_missing(home+'/private')
              mkdir_if_missing(p_private)
              mkdir_if_missing(backupdir)
              files={config_path:config_data,public_path:public_data}
              for path in files: previous[path]=read(path)
              if previous[public_path] is not None and previous[public_path]!=public_data:
                  raise RuntimeError('OWNER_PREVIEW_ALREADY_EXISTS_WITH_DIFFERENT_CONTENT')
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for path,old in previous.items():
                  if old is None or old==files[path]:continue
                  basename=('cloudru-config' if path==config_path else 'cloudru-owner-preview')
                  write(backupdir+'/'+basename+'-'+stamp+'.bak',old)
              for path,data in files.items():
                  if previous[path]!=data:
                      changed.append(path)
                      write(path,data)
              # GET requires owner authentication and never sends an AI request.
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+public_rel
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiCloudruOwnerDeploy/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      status=response.status
              except urllib.error.HTTPError as error:
                  status=error.code
              if status not in (401,403):
                  raise RuntimeError('OWNER_AUTH_NOT_VERIFIED_HTTP_'+str(status))
              print('CLOUDRU_DIRECT_REGRU_INSTALLED; php_lint=ok; private_key_outside_webroot=true; owner_gate_http='+str(status)+'; paid_model_calls=0; auto_generation=false',flush=True)
          except BaseException:
              for path in reversed(changed):
                  try:
                      if previous[path] is None:ftp.delete(path)
                      else:write(path,previous[path])
                  except BaseException:
                      print('CLOUDRU_ROLLBACK_ERROR; contact operator',flush=True)
              raise
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY