name: Polish only standalone Yes-No homepage card on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-yesno-card-visual-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify only standalone product visual changed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          home=Path('index.html').read_text('utf8')
          svg=Path('assets/yesno-standalone-card.svg').read_text('utf8')
          ET.fromstring(svg)
          assert home.count('id="yesno-section"')==1
          assert 'href="./moment/yes-no/"' in home
          assert 'id="horary-section"' in home
          assert 'background-image:url("assets/yesno-standalone-card.svg")' in home
          assert 'min-height:84px' in home
          assert 'min-height:115px;text-decoration:none' not in home
          assert '100 вопросов. 1 в день бесплатно, остальные по подписке Клуба' in home
          print('NUMI_YESNO_POLISH_PREFLIGHT_OK only_home_visual=true')
          PY
      - name: Backup live homepage, publish illustration and corrected card, verify
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,os,ftplib,ssl,hashlib,subprocess,pathlib,urllib.request,urllib.error,time
          base_commit='892595605284b3df04b076da4701d471e94ad6d6'
          old_html=subprocess.check_output(['git','show',base_commit+'^:index.html'])
          files=('assets/yesno-standalone-card.svg','index.html')
          target={name:pathlib.Path(name).read_bytes() for name in files}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          site=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=root+'/site-safeguard-backups/'
          def read(p):
            b=io.BytesIO()
            try:ftp.retrbinary('RETR '+p,b.write)
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
            return b.getvalue()
          def write(p,data):
            ftp.storbinary('STOR '+p,io.BytesIO(data))
            if read(p)!=data:raise RuntimeError('NUMI_YESNO_FTP_READBACK_MISMATCH')
          initial={}
          changed=[]
          try:
            for name in files:
              live=read(site+name)
              if name=='index.html' and live not in (old_html,target[name]):
                raise RuntimeError('HOMEPAGE_MODIFIED_REFUSE_OVERWRITE')
              if name!='index.html' and live not in (None,target[name]):
                raise RuntimeError('ILLUSTRATION_MODIFIED_REFUSE_OVERWRITE')
              initial[name]=live
            if initial['index.html']!=target['index.html']:
              bname='yesno-card-before-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
              write(backups+bname,initial['index.html'])
            for name in files:
              if initial[name]!=target[name]:
                write(site+name,target[name]);changed.append(name)
            public='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
            for name in files:
              url=public+name+'?yesno_polish='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=28) as resp:
                status=resp.status
                raw=resp.read(190000)
              if status!=200 or hashlib.sha256(raw).digest()!=hashlib.sha256(target[name]).digest():
                raise RuntimeError('PUBLIC_YESNO_CARD_NOT_UPDATED '+name)
            print('NUMI_YESNO_CARD_POLISHED_LIVE_OK homepage=true compact_mobile=true standalone_illustration=true all_other_products_unchanged=true')
          except BaseException:
            for name in reversed(changed):
              try:
                if initial[name] is None:ftp.delete(site+name)
                else:write(site+name,initial[name])
                print('NUMI_YESNO_CARD_ROLLBACK_OK '+name)
              except Exception:
                print('NUMI_YESNO_CARD_ROLLBACK_FAILED '+name)
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
