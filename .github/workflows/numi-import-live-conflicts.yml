name: Preserve nine live website customizations in private Git objects
on:
  push:
    paths:
      - .github/workflows/numi-import-live-conflicts.yml
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public browser files and save as unreferenced private Git blobs
        env:
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import os,ftplib,ssl,urllib.request,io,json,hashlib
          paths=['app.js','compatibility-feature.js','destiny-code-feature.js','index.html','pro/index.html','pro/pro.js','redflag-categories.js','redflag-feature.js','redflag-text-bank.js']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          ftp.connect('server172.hosting.reg.ru',21);ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);ftp.prot_p();ftp.cwd('www/xn--c1adkkdfjbp1a4l.online')
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          for path in paths:
              out=io.BytesIO()
              ftp.retrbinary('RETR '+path,out.write)
              raw=out.getvalue()
              source=raw.decode('utf-8')
              body=json.dumps({'content':source,'encoding':'utf-8'},ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(endpoint,data=body,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'numi-preserve-live-sources/1.0','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=15)as response:record=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert record['sha']==expected
              print('PRESERVED',path,record['sha'],len(raw),flush=True)
          ftp.quit()
          PY
