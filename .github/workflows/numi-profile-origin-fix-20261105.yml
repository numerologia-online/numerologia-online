name: One-time narrowly scoped Telegram Mini App profile origin correction
on:
  push:
    paths: ['.github/workflows/numi-profile-origin-fix-20261105.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backup, exact guard, PHP lint, replace one allowlist, verify requests and rollback on failure
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,time,subprocess,tempfile,urllib.request,urllib.error,json
          HOST="xn--c1adkkdfjbp1a4l.online"
          NEW="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          EXPECTED="2320b966ab749c4fad4634e47ce6c975a2f82b78b18c132b7637a788a025768f"
          OLD="    'https://xn--c1adkkdfjbp1a4l.online',"
          AFTER="    'https://xn--c1adkkdfjbp1a4l.online',\n    'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai',\n    'https://www.xn----8sbhhqijddjgdebdz2c2o.xn--p1ai',"
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);f.prot_p()
          root=f.pwd().rstrip('/')
          target=root+'/www/'+HOST+'/api/profile.php'
          def read(p):
           b=io.BytesIO();f.retrbinary('RETR '+p,b.write);return b.getvalue()
          def store(p,data):
           f.storbinary('STOR '+p,io.BytesIO(data))
           if read(p)!=data:raise RuntimeError('FTP file readback differs')
          try:
           original=read(target)
           oldhash=hashlib.sha256(original).hexdigest()
           if oldhash!=EXPECTED:raise RuntimeError('Live file differs from audited version; no changes')
           if original.count(OLD.encode())!=1:raise RuntimeError('Old domain allowlist entry not exactly one occurrence')
           changed=original.replace(OLD.encode(),AFTER.encode(),1)
           with tempfile.NamedTemporaryFile(suffix='.php') as t:
            t.write(changed);t.flush()
            subprocess.run(['php','-l',t.name],check=True,stdout=subprocess.DEVNULL)
           backup=root+'/site-safeguard-backups/'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-telegram-profile-allowed-origins-before.php'
           store(backup,original)
           print('BACKUP_VERIFIED',oldhash,flush=True)
           try:
            store(target,changed)
            print('PROFILE_ORIGIN_PATCH_VERIFIED',hashlib.sha256(changed).hexdigest(),flush=True)
            endpoint='https://'+NEW+'/api/profile.php'
            for origin,expected_allowed in [('https://'+NEW,True),('https://'+HOST,True),('https://www.'+NEW,True),('https://untrusted.invalid',False)]:
             request=urllib.request.Request(endpoint,method='POST',headers={'Content-Type':'application/json','Origin':origin,'User-Agent':'Numi-Safe-Invalid-Telegram-Signature-Probe'},data=b'{"action":"get","init_data":"synthetic-invalid-signature"}')
             try:
              with urllib.request.urlopen(request,timeout=12) as response:
               status=response.status;body=response.read(650)
             except urllib.error.HTTPError as err:
              status=err.code;body=err.read(650)
             try:info=json.loads(body)
             except:raise RuntimeError('Non JSON response from profile route: HTTP '+str(status))
             code=info.get('error')
             if expected_allowed:
              if code=='ORIGIN_NOT_ALLOWED':raise RuntimeError('Allowed origin blocked '+origin)
              if info.get('ok') is True:raise RuntimeError('Fake unsigned user data was accepted')
             elif status!=403 or code!='ORIGIN_NOT_ALLOWED':
              raise RuntimeError('Disallowed origin was not rejected')
             print('PROFILE_ORIGIN_TEST',origin,status,code,flush=True)
            opt=urllib.request.Request(endpoint,method='OPTIONS',headers={'Origin':'https://'+NEW,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'Content-Type'})
            try:
             with urllib.request.urlopen(opt,timeout=12) as response:
              status=response.status;allow=response.headers.get('Access-Control-Allow-Origin','')
            except urllib.error.HTTPError as err:
             status=err.code;allow=err.headers.get('Access-Control-Allow-Origin','')
            if status>=400 or allow!='https://'+NEW:raise RuntimeError('Telegram auth preflight failed: HTTP '+str(status))
            print('PROFILE_CORS_PREFLIGHT_OK',status,flush=True)
            print('TELEGRAM_PROFILE_ORIGIN_FIX_VERIFIED',flush=True)
           except Exception:
            try:store(target,original);print('PROFILE_ROLLBACK_VERIFIED',flush=True)
            except Exception:print('PROFILE_ROLLBACK_FAILED',flush=True)
            raise
          finally:
           try:f.quit()
           except:f.close()
          PY
