name: Publish FIRST real Groq answer privately for owner (Moment 300 only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-first-real-answer.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  first-answer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated owner-only page preflight
        run: |
          php -l moment/owner-first-answer.php
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('moment/owner-first-answer.php').read_text(encoding='utf8')
          assert 'naTestOwner($owner)' in p
          assert 'first-answer.json' in p
          assert 'numi-wallet' not in p
          print('MOMENT_FIRST_OWNER_PREFLIGHT_OK')
          PY
      - name: Generate genuine Groq response on working GitHub runner and save privately to REG.RU
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json,os,io,ssl,ftplib,hashlib,time,urllib.request,urllib.error,datetime,pathlib
          key=os.environ.get('GROQ_API_KEY','')
          if not key.startswith('gsk_'):raise RuntimeError('GROQ_SECRET_UNAVAILABLE')
          # Use the same day/month interpretation as the on-site PHP test.
          # No full dates of birth or personal identities are committed to this public repo.
          prompt=(
            'Вопрос из раздела «300 вопросов о жизни»: Что он чувствует ко мне?\n'
            'Спрашивающий: день рождения несёт число 9, месяц 9.\n'
            'Другой человек: число дня 4, месяц 10.\n'
            'Оцени сочетание обеих дат. Пиши по существу конкретного вопроса.'
          )
          instructions=(
            'Ты опытный нумеролог, отвечаешь естественно как подруга, коротко и содержательно. '
            'Это символическая трактовка по дню и месяцу, а не знание реальных мыслей человека. '
            'Не выдумывай однозначную любовь, измены или жестокость; учитывай и сильные, и теневые проявления сочетания. '
            'Не приписывай всем мужчинам одинаковые сюжеты. Без слов «энергия», формул, лести и общих портретов. '
            'Первый абзац — прямо о его возможных чувствах, заинтересованности и противоречиях. '
            'Второй — конкретные наблюдаемые сигналы, которые помогут отличить симпатию от удобства или безразличия. '
            'Ответ 120–180 слов, два абзаца. Не делай вид, что достоверно читаешь чужие мысли. Только русский язык.'
          )
          payload={
            'model':'openai/gpt-oss-120b','temperature':0.7,'max_completion_tokens':1600,
            'messages':[{'role':'system','content':instructions},{'role':'user','content':prompt}]
          }
          req=urllib.request.Request(
            'https://api.groq.com/openai/v1/chat/completions',
            data=json.dumps(payload,ensure_ascii=False).encode('utf8'),method='POST',
            headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json',
                     'User-Agent':'numi-moment-groq-test/1.0'}
          )
          with urllib.request.urlopen(req,timeout=62) as resp:
            if resp.status!=200:raise RuntimeError('GROQ_API_NOT_200')
            parsed=json.load(resp)
          answer=parsed.get('choices',[{}])[0].get('message',{}).get('content','')
          if not isinstance(answer,str) or len(answer.strip())<350 or len(answer)>7000:
            raise RuntimeError('GROQ_ANSWER_UNSUITABLE')
          if len([x for x in answer.split('\n\n') if x.strip()])<2:
            raise RuntimeError('GROQ_ANSWER_PARAGRAPHS_UNSUITABLE')
          print('MOMENT_FIRST_GROQ_REAL_ANSWER_OK chars='+str(len(answer))+' model='+str(parsed.get('model','unknown')),flush=True)
          record=json.dumps({
            'question_id':'love-001','question':'Что он чувствует ко мне?','answer':answer.strip(),
            'model':parsed.get('model','openai/gpt-oss-120b'),
            'generated_utc':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          },ensure_ascii=False).encode('utf8')
          page=pathlib.Path('moment/owner-first-answer.php').read_bytes()
          def sha(b):return hashlib.sha256(b).hexdigest()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          private=home+'/private/numi-moment-groq/first-answer.json'
          public=home+'/www/xn--c1adkkdfjbp1a4l.online/moment/owner-first-answer.php'
          def read(path):
            stream=io.BytesIO()
            try:ftp.retrbinary('RETR '+path,stream.write)
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
            return stream.getvalue()
          def write(path,blob):
            ftp.storbinary('STOR '+path,io.BytesIO(blob))
            if sha(read(path) or b'')!=sha(blob):raise RuntimeError('FTP_READBACK_MISMATCH')
          touched=[]
          try:
            core=read(home+'/private/numi-account-20261031/core.php')
            if not core or b'function naTestOwner' not in core:raise RuntimeError('OWNER_AUTH_NOT_FOUND')
            config=read(home+'/private/numi-moment-groq/config.local.php')
            if not config:raise RuntimeError('PRIVATE_CONFIG_DIR_NOT_FOUND')
            if read(public) is not None or read(private) is not None:raise RuntimeError('FIRST_ANSWER_ALREADY_EXISTS_REFUSE_OVERWRITE')
            # Write the private data before the owner-only page becomes available.
            touched.append(private);write(private,record)
            try:ftp.sendcmd('SITE CHMOD 600 '+private)
            except ftplib.error_perm:pass
            touched.append(public);write(public,page)
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/owner-first-answer.php?check='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiFirstOwner/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r: status=r.status
            except urllib.error.HTTPError as e:status=e.code
            if status!=403:raise RuntimeError('PUBLIC_OWNER_AUTH_GATE_NOT_403')
            print('MOMENT_FIRST_REAL_ANSWER_PUBLISHED_OK private_answer=True owner_gate_403=True other_sections_untouched=True',flush=True)
          except BaseException:
            for file in reversed(touched):
              try:ftp.delete(file)
              except Exception:print('MOMENT_FIRST_ROLLBACK_PROBLEM',file.rsplit('/',1)[-1],flush=True)
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
