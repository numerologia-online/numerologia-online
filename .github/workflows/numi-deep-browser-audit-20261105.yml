name: Read-only mobile browser audit of main sections and Telegram deep links
on:
  push:
    paths: ['.github/workflows/numi-deep-browser-audit-20261105.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporary browser tooling (audit only)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open live mobile sections without saving, purchasing or authenticating
        run: |
          cat > /tmp/numi-deep-browser-audit.cjs <<'JS'
          (async()=>{
          const {chromium}=require('playwright');
          const ROOT='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/';
          const cases=[
           ['redflag','[data-open-redflag]','#redflag'],
           ['compatibility','[data-open-compatibility]','#compatibility'],
           ['wealth','[data-open-destiny-code]','#destiny-code'],
           ['year','[data-open-year]','#year'],
           ['matrix','[data-open-matrix]','#matrix'],
           ['day','[data-open-personal-day]','#personal-day'],
           ['account',"[data-account-open='profile']",'#account-dialog']
          ];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          async function inspect(name,route,button,target,opts={}){
           const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'ru-RU',serviceWorkers:'block'});
           const errors=[],failures=[],dialog=[];
           p.on('pageerror',e=>errors.push(String(e.message||e).slice(0,150)));
           p.on('response',r=>{if(r.status()>=400&&r.url().startsWith(ROOT.slice(0,-1)))failures.push([r.status(),new URL(r.url()).pathname]);});
           p.on('dialog',async d=>{dialog.push(d.message().slice(0,120));await d.dismiss()});
           const start=Date.now(),result={name};
           try{
            const res=await p.goto(ROOT+route,{waitUntil:'domcontentloaded',timeout:30000});
            result.http=res?.status();
            await p.waitForTimeout(1050);
            if(button){
             result.buttonCount=await p.locator(button).count();
             if(result.buttonCount){
              await p.locator(button).first().evaluate(el=>el.click());
              await p.waitForTimeout(1400);
             }
            }else{await p.waitForTimeout(900)}
            if(target){
             result.targetCount=await p.locator(target).count();
             result.visible=await p.evaluate(sel=>{
              const e=document.querySelector(sel);if(!e)return false;
              const cs=getComputedStyle(e);
              return !e.hidden&&cs.display!=='none'&&cs.visibility!=='hidden'&&(e.tagName!=='DIALOG'||e.open);
             },target)
            }
            result.viewport=await p.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyWidth:document.body.scrollWidth}));
            result.horizontalOverflow=result.viewport.scrollWidth>result.viewport.clientWidth+3;
            if(name==='account'){
             result.botSignIn=await p.locator('#numi-bot-signin').count();
             result.botSignInLink=await p.locator('#numi-bot-signin').getAttribute('href').catch(()=>null);
             result.loginEmail=await p.locator('input[name="email"]').count();
             result.exitButton=await p.locator('#account-logout-overview').count();
             result.deleteBirthButton=await p.locator('#account-birth-delete').count();
            }
            if(name==='redflag'){
             const toggles=p.locator('.redflag-category-toggle');
             result.categoryCount=await toggles.count();
             if(result.categoryCount>0){
              await toggles.first().evaluate(el=>el.click());
              await p.waitForTimeout(800);
              result.firstExpanded=await toggles.first().getAttribute('aria-expanded');
              result.firstQuestions=await p.locator('[data-question-id]').count();
              result.afterAccordion=await p.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
             }
            }
           }catch(e){result.fatal=String(e.message||e).slice(0,280)}
           result.durationMs=Date.now()-start;result.jsErrors=[...new Set(errors)].slice(0,7);result.badRequests=[...new Set(failures.map(JSON.stringify))].slice(0,8).map(JSON.parse);result.dialogs=dialog;
           console.log('BROWSER_CASE',JSON.stringify(result));
           await p.close();
          }
          try{
           for(const [name,button,target] of cases)await inspect(name,'?audit='+name,button,target);
           for(const [name,route,target] of [
            ['deep-redflag','?view=redflag','#redflag'],
            ['deep-year','?view=year','#year'],
            ['deep-day','?view=day','#personal-day'],
            ['deep-money','?view=wealth','#destiny-code'],
            ['deep-child','?view=children',null],
            ['deep-school','?view=school',null],
            ['moment','moment/',null],
            ['yesno','moment/yes-no/',null],
            ['child','child/',null],
            ['schools','pro/schools/',null],
            ['professional','pro/',null],
            ['insights','insights/',null],
            ['guide','guide/',null]
           ])await inspect(name,route,null,target)
          }finally{await browser.close()}
          console.log('BROWSER_AUDIT_FINISHED');
          })().catch(e=>{console.error('BROWSER_AUDIT_FATAL',String(e));process.exit(1)});
          JS
          cp /tmp/numi-deep-browser-audit.cjs ./numi-deep-browser-audit.cjs
          node numi-deep-browser-audit.cjs

      - name: Diagnose actual Red Flag scroll motion after taps without altering the site
        run: |
          cat > /tmp/numi-scroll-diagnostic.cjs <<'JS'
          (async()=>{
            const {chromium}=require('playwright');
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'ru-RU',serviceWorkers:'block'});
            p.on('pageerror',e=>console.log('SCROLL_JS_ERROR',String(e).slice(0,180)));
            const root='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/?view=redflag';
            await p.goto(root,{waitUntil:'domcontentloaded',timeout:35000});
            await p.waitForTimeout(1800);
            console.log('SCROLL_UI_INIT',JSON.stringify(await p.evaluate(()=>({active:document.querySelector('#redflag')?.className,form:!!document.querySelector('#redflag-form'),categories:document.querySelectorAll('.redflag-category-toggle').length}))));
            await p.locator('#redflag-birth-date').fill('09.09.1986');
            await p.locator('#redflag-form').evaluate(el=>el.requestSubmit());
            await p.waitForTimeout(1400);
            console.log('SCROLL_UI_FORM',JSON.stringify(await p.evaluate(()=>({scrollY,active:document.querySelector('#redflag')?.className,questionCount:document.querySelectorAll('[data-question-id]').length,error:document.querySelector('#redflag-error')?.textContent?.trim()}))));
            const categories=p.locator('.redflag-category-toggle');
            async function motion(label,locator,mode='click'){
              if(await locator.count()===0){console.log('SCROLL_MISSING',label);return}
              await locator.first().scrollIntoViewIfNeeded();
              await p.waitForTimeout(280);
              const before=await locator.first().evaluate(el=>({top:el.getBoundingClientRect().top,y:scrollY,bottom:el.getBoundingClientRect().bottom,category:el.closest('.redflag-category')?.className,question:el.closest('[data-question-id]')?.dataset.questionId}));
              if(mode==='js') await locator.first().evaluate(el=>el.click()); else await locator.first().dispatchEvent('click');
              await p.waitForTimeout(850);
              const after=await p.evaluate(({id,categoryIndex})=>{
                const el=id?document.querySelector('[data-question-id="'+id+'"] .redflag-question-toggle'):document.querySelectorAll('.redflag-category-toggle')[categoryIndex];
                return {top:el?.getBoundingClientRect().top,y:scrollY,bottom:el?.getBoundingClientRect().bottom,category:el?.closest('.redflag-category')?.className}
              },{id:before.question,categoryIndex:Number(label.split('_').pop())});
              console.log('SCROLL_MOTION',label,JSON.stringify({before,after,viewport:p.viewportSize()}));
            }
            await motion('question_0',p.locator('.redflag-question-toggle').nth(0));
            await motion('question_5',p.locator('.redflag-question-toggle').nth(5));
            await motion('category_1',categories.nth(1));
            await p.waitForTimeout(400);
            await motion('category_0',categories.nth(0));
            await motion('category_2',categories.nth(2));
            await browser.close();
          })().catch(e=>{console.error('SCROLL_FATAL',String(e));process.exit(1)});
          JS
          cp /tmp/numi-scroll-diagnostic.cjs ./numi-scroll-diagnostic.cjs
          node numi-scroll-diagnostic.cjs
