name: Verify three live Telegram Red Flag questions for 09.09 with Groq
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-groq-0909-live-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual owner Groq Worker route and real 09.09 question output
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,hmac,hashlib,time,pathlib
          key=os.environ.get("GROQ_API_KEY","")
          if not key.startswith("gsk_"):raise RuntimeError("GROQ_KEY_MISSING")
          proof=hmac.new(key.encode(),b"numi-moment-cloudflare-bridge-v1",hashlib.sha256).hexdigest()
          url="https://numerologia-300-ai.tankraft431.workers.dev/v1/redflag-owner-question"
          checks=[
            ("say-no","Уважает женское «нет» или начинает давить?"),
            ("care-or-control","Заботится или будет контролировать каждый твой шаг?"),
            ("hero","Скромный мужчина или считает себя подарком судьбы?")
          ]
          followups=[
            "Щедрый мужчина или считает каждую копейку?",
            "Пишет первым или ждёт инициативы от женщины?",
            "Держит слово или опять одни красивые разговоры?"
          ]
          data=[];success=0
          for qid,title in checks:
            body=json.dumps({"category":"flags","question_id":qid,"title":title,
              "day":9,"month":9,"followups":followups},ensure_ascii=False).encode()
            req=urllib.request.Request(url,data=body,method="POST",headers={
              "Content-Type":"application/json","Accept":"application/json",
              "X-Numi-Moment-Proof":proof,"User-Agent":"NumiOwnerGroq0909Live/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=115) as response:
                code=response.status;result=json.load(response)
            except urllib.error.HTTPError as e:
              code=e.code
              try:result=json.loads(e.read(1500))
              except Exception:result={}
            except Exception as e:
              code=0;result={"error":type(e).__name__}
            answer=result.get("answer") or ""
            ok=code==200 and result.get("ok") is True and result.get("model")=="openai/gpt-oss-120b" and isinstance(answer,str) and len(answer)>=380 and result.get("draft_only") is True
            if ok:success+=1
            data.append({"question_id":qid,"status":code,"ok":ok,"error":result.get("error"),
              "chars":len(answer),"model":result.get("model"),"answer":answer if ok else None})
            print("REDFLAG_GROQ_0909",qid,"HTTP",code,"ok",ok,
              "chars",len(answer),"error",result.get("error"),flush=True)
            time.sleep(3)
          folder=pathlib.Path("redflag-live-0909");folder.mkdir(exist_ok=True)
          (folder/"live-0909-results.json").write_text(
            json.dumps(data,ensure_ascii=False,indent=2),encoding="utf8")
          print("REDFLAG_GROQ_0909_SUMMARY",success,"/3",flush=True)
          if success!=3:raise RuntimeError("REDFLAG_GROQ_0909_NOT_ALL_READY")
          PY
      - name: Save owner-only unapproved response text for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redflag-0909-three-groq-responses
          path: redflag-live-0909/
          retention-days: 1
          if-no-files-found: warn
