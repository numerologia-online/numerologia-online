name: Test Cloudflare Workers AI quota and model on user's account
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cf-model-api-check.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Call one Cloudflare-hosted free AI model as an availability test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          url='https://api.cloudflare.com/client/v4/accounts/de77758c4b3efd26fef26ab600cb02a2/ai/run/@cf/google/gemma-4-26b-a4b-it'
          prompt=json.dumps({'messages':[{'role':'user','content':'Одним предложением по-русски ответь: что такое любовь?'}],'max_completion_tokens':120},ensure_ascii=False).encode()
          req=urllib.request.Request(url,data=prompt,method='POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=85) as r:
              status=r.status
              data=json.load(r)
          except urllib.error.HTTPError as err:
            status=err.code
            data=json.loads(err.read(10000))
          answer=data.get('result') or {}
          if not isinstance(answer,dict):answer={}
          output=answer.get('response') or answer.get('choices',[{}])[0].get('message',{}).get('content','')
          print('MOMENT_CF_MODEL_API_CHECK status='+str(status)+' success='+str(data.get('success',False))+' chars='+str(len(output))+' error_codes='+','.join(str(e.get('code')) for e in (data.get('errors') or []) if isinstance(e,dict)))
          if status!=200 or not data.get('success'):
            raise RuntimeError('CLOUDFLARE_MODEL_API_ACCESS_NOT_READY')
          PY
