name: Restore original Full Life readings on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-pro-safe-source-gate-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the original report and protected reader
        run: |
          php -l account-service/public/numi-life-content.php
          for file in pro/{pro,secure-reader,karmic-programs-secure,full-report-pdf-secure,purpose-readings,pro-pdf-content}.js; do
            node --check "$file" || exit
          done
          git diff --exit-code a6adaf2ff517 -- pro/pro.css knowledge/full-report pro/purpose pro/guidance pro/karmic-programs.json pro/karmic-tail-deepening-a.json pro/karmic-tail-deepening-b.json karmic-tails.md full-report-pdf.js
      - name: Publish Full Life only and verify the live response
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-pro-life-source-release.py
