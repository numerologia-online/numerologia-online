name: Diagnose Moment 300 Groq API from REG.RU without changing live products
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-groq-regru-diagnose.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Temporary isolated on-server network test, remove probe afterwards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,io,os,secrets,urllib.request,urllib.error,json
          php=r'''<?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          $result=['config'=>'unknown','curl'=>'unknown','provider_status'=>null,'curl_errno'=>null,'elapsed_ms'=>null,'error_code'=>null];
          try{
            $path=dirname(__DIR__,3).'/private/numi-moment-groq/config.local.php';
            if(!is_file($path))throw new RuntimeException('CONFIG_FILE_ABSENT');
            $config=require $path;
            $key=$config['groq_api_key']??null;
            if(!is_string($key)||!str_starts_with($key,'gsk_'))throw new RuntimeException('CONFIG_KEY_ABSENT');
            $result['config']='ok';
            if(!function_exists('curl_init'))throw new RuntimeException('CURL_UNAVAILABLE');
            $data=['model'=>'openai/gpt-oss-120b','max_completion_tokens'=>250,
              'messages'=>[['role'=>'system','content'=>'Return only: Готово.'],['role'=>'user','content'=>'Проверка соединения.']]];
            $ch=curl_init('https://api.groq.com/openai/v1/chat/completions');
            curl_setopt_array($ch,[CURLOPT_POST=>true,CURLOPT_RETURNTRANSFER=>true,CURLOPT_CONNECTTIMEOUT=>7,
              CURLOPT_TIMEOUT=>26,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_HTTPHEADER=>[
              'Authorization: Bearer '.$key,'Content-Type: application/json','Accept: application/json',
              'User-Agent: numi-moment-owner-preview/1.0'],
              CURLOPT_POSTFIELDS=>json_encode($data,JSON_UNESCAPED_UNICODE)]);
            $start=microtime(true);
            $raw=curl_exec($ch);
            $result['elapsed_ms']=(int)round((microtime(true)-$start)*1000);
            $result['provider_status']=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);
            $result['curl_errno']=curl_errno($ch);
            $result['curl']=$raw===false?'failed':'returned';
            if(is_string($raw)){
              $parsed=json_decode($raw,true);
              if(is_array($parsed)){
                $result['error_code']=preg_replace('/[^a-zA-Z0-9_-]/','',strval($parsed['error']['code']??$parsed['error']['type']??''))?:null;
                $result['has_answer']=isset($parsed['choices'][0]['message']['content']);
                $result['finish_reason']=$parsed['choices'][0]['finish_reason']??null;
              }else{$result['provider_non_json']=true;}
            }
            curl_close($ch);
          }catch(Throwable $e){$result['failure_class']=get_class($e);$result['failure_reason']=preg_replace('/[^A-Z_]/','',strval($e->getMessage()));}
          echo json_encode($result,JSON_UNESCAPED_UNICODE);
          '''
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          name='moment/.owner-groq-probe-'+secrets.token_hex(22)+'.php'
          remote=root+'/www/xn--c1adkkdfjbp1a4l.online/'+name
          try:
            ftp.storbinary('STOR '+remote,io.BytesIO(php.encode('utf8')))
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+name
            req=urllib.request.Request(url,headers={'User-Agent':'NumiOwnerProbe/1.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=50) as res:status=res.status;body=res.read(4000)
            except urllib.error.HTTPError as e:status=e.code;body=e.read(4000)
            try:detail=json.loads(body)
            except Exception:detail={'response_kind':'non-json','length':len(body)}
            print('MOMENT_GROQ_ON_REGRU_DIAG '+json.dumps({'http_status':status,'detail':detail},ensure_ascii=False),flush=True)
          finally:
            try:ftp.delete(remote);print('MOMENT_GROQ_ON_REGRU_PROBE_REMOVED',flush=True)
            finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
