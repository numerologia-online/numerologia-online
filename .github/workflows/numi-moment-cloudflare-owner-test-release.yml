name: Publish isolated fast Cloudflare AI owner test on Moment 300 REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cloudflare-owner-test-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated PHP owner gate and Cloudflare JS syntax
        run: |
          php -l moment/owner-ai.php
          python3 - <<'PY'
          import pathlib
          php=pathlib.Path('moment/owner-ai.php').read_text('utf8')
          html=pathlib.Path('moment/owner-preview.html').read_text('utf8')
          assert 'naTestOwner($account)' in php
          assert 'hash_hmac(' in php
          assert 'numerologia-300-ai.tankraft431.workers.dev/v1/owner-preview' in php
          assert 'api.groq.com' not in php
          assert 'owner-ai.php' in html and 'owner-queue.php' in html
          assert 'generate-cloudflare' in html
          assert 'moment' in html
          pathlib.Path('/tmp/moment-cloudflare-preview-check.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf8')
          print('MOMENT_CLOUDFLARE_OWNER_PRECHECK_OK')
          PY
          node --check /tmp/moment-cloudflare-preview-check.js
      - name: Backup and publish only moment/owner-ai.php and moment/owner-preview.html
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,subprocess,pathlib,urllib.request,urllib.error,json,time
          files=('moment/owner-ai.php','moment/owner-preview.html')
          original={
            'moment/owner-ai.php': subprocess.check_output(['git','show','1076259c37aa6d0a7a54d54b8f67ea62c5e8d51f^:moment/owner-ai.php']),
            'moment/owner-preview.html': subprocess.check_output(['git','show','1ae5c378c762f0dc8982af2ee4f744e32cc1449b^:moment/owner-preview.html'])
          }
          next_files={name:pathlib.Path(name).read_bytes() for name in files}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          base=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=home+'/site-safeguard-backups/'
          def read(path):
            b=io.BytesIO()
            ftp.retrbinary('RETR '+path,b.write)
            return b.getvalue()
          def write(path,data):
            ftp.storbinary('STOR '+path,io.BytesIO(data))
            if read(path)!=data:raise RuntimeError('FTP_READBACK_MISMATCH')
          prior={}
          updated=[]
          try:
            for name in files:
              current=read(base+name)
              if current not in (original[name],next_files[name]):
                raise RuntimeError('LIVE_MOMENT_OWNER_FILE_MODIFIED_REFUSE_OVERWRITE '+name)
              prior[name]=current
            for name in files:
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              backup=backups+'moment-cf-owner-'+name.split('/')[-1]+'-'+stamp+'.bak'
              write(backup,prior[name])
            for name in files:
              if prior[name]!=next_files[name]:
                write(base+name,next_files[name])
                updated.append(name)
            site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/'
            req=urllib.request.Request(site+'owner-preview.html?cf_owner_publish='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=28) as response:
              body=response.read(200000)
              status=response.status
            if status!=200 or hashlib.sha256(body).digest()!=hashlib.sha256(next_files['moment/owner-preview.html']).digest():
              raise RuntimeError('PUBLIC_EDITOR_NOT_SYNCED')
            for name in ('owner-ai.php','owner-queue.php'):
              req=urllib.request.Request(site+name+'?anon_check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              try:
                with urllib.request.urlopen(req,timeout=25) as response:code=response.status
              except urllib.error.HTTPError as err:code=err.code
              if code!=403:raise RuntimeError('OWNER_AUTH_GATE_NOT_CLOSED '+name)
            print('MOMENT_CLOUDFLARE_FAST_TEST_PUBLISHED_OK editor_and_owner_backend_only=true owner_403=true paid_products_unchanged=true')
          except BaseException:
            for name in reversed(updated):
              try:
                write(base+name,prior[name])
                print('MOMENT_FAST_TEST_ROLLBACK_OK file='+name.split('/')[-1])
              except Exception:
                print('MOMENT_FAST_TEST_ROLLBACK_FAILED file='+name.split('/')[-1])
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
