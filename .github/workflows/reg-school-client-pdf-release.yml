name: Restore owner-verified school client PDF on REG.RU
on:
  push:
    paths:
      - .github/numi-school-client-pdf-release.json
permissions:
  contents: read
concurrency:
  group: reg-ru-school-owner-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish verified school client PDF to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check school PDF owner access and ordinary paid report isolation
        run: |
          node --check pro/pro.js
          node --test tests/school-client-entry.test.mjs tests/owner-access.test.mjs
          python3 -m py_compile .github/scripts/reg-school-client-pdf-release.py
          python3 -m json.tool .github/numi-school-client-pdf-release.json >/dev/null
      - name: Patch exactly three approved sources with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-school-client-pdf-release.py
