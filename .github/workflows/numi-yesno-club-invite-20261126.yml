name: Publish approved Yes/No Club invitation only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-club-invite-20261126.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: node --check moment/yes-no/yes-no.js
      - name: Patch only approved live text and asset version, backup and verify
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          patches=json.loads("{\"moment/yes-no/yes-no.js\":[[\"          : \\\"Вы уже использовали бесплатный ответ на сегодня. С подпиской на Клуб можно задавать вопросы в «Да / Нет» каждый день без лимита и доплаты.\\\";\",\"          : \\\"\\\";\\n        if (!mustLogin) {\\n          const heading=document.createElement(\\\"h2\\\");\\n          heading.textContent=\\\"Остались вопросы?\\\";\\n          heading.style.cssText=\\\"font:500 24px/1.2 Georgia,serif;color:#173e31;margin:0 0 10px\\\";\\n          const intro=document.createElement(\\\"p\\\");\\n          intro.textContent=\\\"Сегодня вы уже получили свой бесплатный ответ.\\\";\\n          intro.style.cssText=\\\"margin:0 0 10px\\\";\\n          const invite=document.createElement(\\\"p\\\");\\n          invite.textContent=\\\"Станьте членом Клуба и получайте ответы на любые вопросы «Да / Нет» каждый день без ограничений.\\\";\\n          invite.style.cssText=\\\"margin:0\\\";\\n          timeResult.replaceChildren(heading,intro,invite);\\n        }\"],[\"\\\"Подключить Клуб · 490 ₽ в месяц\\\"\",\"\\\"Вступить в Клуб · 490 ₽ в месяц\\\"\"]],\"moment/yes-no/index.html\":[[\"./yes-no.js?v=club-copy-20261126\",\"./yes-no.js?v=club-invite-20261126\"]]}")
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path,changes in patches.items():
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  for before,after in changes:
                      assert current.count(before)==1, 'Live copy differs; no files modified: '+path
                      current=current.replace(before,after,1)
                  new[path]=current.encode('utf-8')
              with tempfile.TemporaryDirectory() as d:
                  file=pathlib.Path(d)/'yes-no.js'
                  file.write_bytes(new['moment/yes-no/yes-no.js'])
                  subprocess.run(['node','--check',str(file)],check=True)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/club-invite-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: approved copy and button only')
          finally:ftp.quit()
          PY
