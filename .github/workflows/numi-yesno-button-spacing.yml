name: Refine ask button spacing
on:
  push:
    branches: [fix/yesno-button-spacing]
    paths: [.github/workflows/numi-yesno-button-spacing.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish button spacing with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/button-spacing/deploy.py
