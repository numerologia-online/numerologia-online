name: Validate isolated Cloudflare Workers AI 300-question source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cloudflare-source-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and isolate calls from other product branches
        run: |
          node --check cloudflare/moment-300-ai/src/index.js
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import worker from './cloudflare/moment-300-ai/src/index.js';
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('cloudflare/moment-300-ai/wrangler.jsonc','utf8'));
          assert.equal(config.name, 'numerologia-300-ai');
          assert.equal(config.ai.binding, 'AI');
          const env = {
            AI: {run: async (model, options) => {
              assert.equal(model, '@cf/google/gemma-4-26b-a4b-it');
              assert.equal(options.messages.length, 2);
              return { response: 'Это только пробный ответ для проверки соединения с моделью. Настоящие выводы по выбранному вопросу нельзя считать установленными фактами.' };
            }},
            MOMENT_BRIDGE_SECRET: 'test-private-shared-key'
          };
          const data = {
            question_id:'love-001',title:'Что он чувствует ко мне?',
            birth_date:'1986-09-09',other_date:'1988-10-31',
            moment:'2026-11-15T21:21'
          };
          const req = (headers={}, body=data) => new Request('https://example.invalid/v1/owner-preview',{
            method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)
          });
          let response=await worker.fetch(req(),env);
          assert.equal(response.status,403);
          response=await worker.fetch(req({'X-Numi-Moment-Secret':'test-private-shared-key'}),env);
          assert.equal(response.status,200);
          const out=await response.json();
          assert.equal(out.question_id,'love-001');
          assert.equal(out.test,true);
          response=await worker.fetch(req({'X-Numi-Moment-Secret':'test-private-shared-key'},{
            ...data,birth_date:'1986-02-31'
          }),env);
          assert.equal(response.status,400);
          response=await worker.fetch(new Request('https://example.invalid/v1/wallet'),env);
          assert.equal(response.status,404);
          console.log('MOMENT_CF_WORKER_ISOLATION_TEST_OK no_deployment=true');
          JS
