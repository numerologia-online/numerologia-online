name: Publish password-protected analytics to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-analytics-release.yml
permissions:
  contents: read
concurrency:
  group: numi-analytics-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish password-protected analytics on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate isolated aggregate analytics
        run: |
          python3 -m py_compile analytics/deploy.py
          python3 - <<'PY'
          s=open('analytics/deploy.py',encoding='utf-8').read()
          assert 'public_login_probe' in s
          assert 'INVALID_CREDENTIALS' in s
          print('Negative login probe configured')
          PY
          php -l analytics/public/numi-analytics.php
          node --check moment/analytics.js
          node --check moment/moment.js
          node --check moment/yes-no/yes-no.js
          node --check analytics/admin/dashboard.js
          grep -q 'reset-access' analytics/admin/index.html
          grep -q 'request_reset' analytics/admin/dashboard.js
      # Final independent verification rejects unexpected live files and rolls back on failure.
      - name: Deploy with backup, rollback, public checks and owner-only login
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u analytics/deploy.py
