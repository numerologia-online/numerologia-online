name: Check gift trial analytics feature
on:
  push:
    branches: [feature/analytics-gift-club-day-20261121]
  pull_request:
    paths:
      - 'insights/public/numi-gifts.php'
      - 'insights/public/gift-claim.html'
      - 'insights/public/index.html'
      - 'insights/public/insights.js'
      - 'insights/public/insights.css'
      - 'account-service/private/core.php'
      - 'account-service/private/wallet-real.php'
      - 'account-service/private/subscriptions.php'
      - 'account-browser.js'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gift_test_only
          MYSQL_DATABASE: gift_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgift_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and browser source
        run: |
          php -l insights/public/numi-gifts.php
          php -l insights/tests/gift.mysql.php
          php -l account-service/private/core.php
          php -l account-service/private/wallet-real.php
          php -l account-service/private/subscriptions.php
          php -l insights/public/numi-insights.php
          node --check insights/public/insights.js
          node --check account-browser.js
          node --test insights/tests/*.test.cjs
      - name: Verify gift offers, activation and expiry in isolated MySQL
        env:
          NG_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=gift_test;charset=utf8mb4
        run: php insights/tests/gift.mysql.php
