name: Publish Save and Share for all Moment question answers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-all-answer-save-share-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate save/share on all Moment answer routes without enabling purchase
        run: |
          set -euo pipefail
          node --check moment/moment.js
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          page=Path('moment/owner-preview.html').read_text()
          script=page.split('<script>')[-1].split('</script>')[0]
          test_file=Path('/tmp/numi-owner-all-answer-actions.js')
          test_file.write_text(script)
          subprocess.run(['node','--check',str(test_file)],check=True)
          assert page.count('function renderMomentAnswerActions(')==1
          assert page.count('function renderCurrentAnswerActions(')==1
          assert page.count('renderCurrentAnswerActions(')==5
          assert 'renderMomentAnswerActions(question,response.answer.trim(),{self,other})' in page
          for needle in ["'❤️ Сохранить в бот'","'💌 Переслать подруге'","fetch('/api/redflag-save.php'","navigator.share({title:question.title,text:report})","function compactLoveMode(","await showCompactLoveAnswer(requested);return;","showReviewCandidate(response.record.answer"]:
            assert needle in page,needle
          catalog=json.loads(Path('moment/questions.json').read_text())
          assert len(catalog['questions'])==300 and len(catalog['categories'])==12
          assert all(q['mode'] in ('self','partner','event') for q in catalog['questions'])
          assert "49 ₽ за вопрос" in Path('moment/index.html').read_text()
          assert "ownerMode=true" in Path('moment/moment.js').read_text()
          assert "showComingSoon(q.title)" in Path('moment/moment.js').read_text()
          assert "./moment.js?v=all-answer-actions-20261117" in Path('moment/index.html').read_text()
          assert "'❤️ Сохранить в бот'" in Path('moment/moment.js').read_text()
          assert "'💌 Переслать подруге'" in Path('moment/moment.js').read_text()
          print('ALL_MOMENT_ANSWERS_SAVE_SHARE_SOURCE_VERIFIED',flush=True)
          PY
      - name: Safeguard, publish and verify only the three changed frontend files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          paths=['moment/owner-preview.html','moment/moment.js','moment/index.html']
          target={p:Path(p).read_bytes() for p in paths}
          def h(data):return hashlib.sha256(data).hexdigest()
          trusted={}
          for p in paths:
            revisions=subprocess.check_output(['git','log','--format=%H','-n','160','--',p],text=True).splitlines()
            trusted[p]={h(subprocess.check_output(['git','show',rev+':'+p])) for rev in revisions}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          prefix=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
            buf=io.BytesIO();ftp.retrbinary('RETR '+prefix+path,buf.write)
            return buf.getvalue()
          def write(path,data):
            ftp.storbinary('STOR '+prefix+path,io.BytesIO(data))
            if h(read(path))!=h(data):raise RuntimeError('FTP_READBACK_FAILED '+path)
          updated=[]
          original={}
          try:
            original={p:read(p) for p in paths}
            for p in paths:
              if h(original[p]) not in trusted[p]:raise RuntimeError('UNKNOWN_LIVE_VERSION_REFUSE_WRITE '+p)
            backup_dir=home+'/site-safeguard-backups'
            try:ftp.mkd(backup_dir)
            except ftplib.error_perm as error:
              if not str(error).startswith('550'):raise
            stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            for p in paths:
              archive=backup_dir+'/moment-all-answer-actions-'+stamp+'-'+p.replace('/','-')+'.bak'
              ftp.storbinary('STOR '+archive,io.BytesIO(original[p]))
              buf=io.BytesIO();ftp.retrbinary('RETR '+archive,buf.write)
              if buf.getvalue()!=original[p]:raise RuntimeError('BACKUP_CHECK_FAILED '+p)
            for p in paths:
              if read(p)!=original[p]:raise RuntimeError('CONCURRENT_UPDATE_DETECTED '+p)
              if h(original[p])!=h(target[p]):
                updated.append(p);write(p,target[p])
            for p in paths:
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?all_actions='+str(time.time_ns())
              req=urllib.request.Request(url,headers={
                'Cache-Control':'no-cache','User-Agent':'NumiMomentAllAnswerActions'})
              with urllib.request.urlopen(req,timeout=35) as result:
                public=result.read(250000)
              if h(public)!=h(target[p]):raise RuntimeError('PUBLIC_READBACK_FAILED '+p)
            print('MOMENT_ALL_ANSWER_ACTIONS_PUBLISHED_VERIFIED files='+','.join(paths),flush=True)
          except BaseException:
            for p in reversed(updated):
              try:write(p,original[p]);print('ROLLBACK_OK '+p,flush=True)
              except BaseException:print('ROLLBACK_FAILED '+p,flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
