name: Publish Red Flag owner knowledge arcana 15
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-say-no-fresh-json-fence-fix-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only owner Red Flag knowledge JSON, no model calls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,io,os,ssl,ftplib,urllib.request,urllib.error,time,json,copy
          path='redflag-ai-lab/intimacy-knowledge-v1.json'
          before_revision='0305378464caf87b6a2f1bada664030e029c8f5d'
          after_revision='46403c100eb032276201afff58b385a97e0f35b6'
          before=subprocess.check_output(['git','show',before_revision+':'+path])
          after=subprocess.check_output(['git','show',after_revision+':'+path])
          if pathlib.Path(path).read_bytes()!=after:raise RuntimeError('SOURCE_CHANGED_AFTER_REVIEW')
          old=json.loads(before);new=json.loads(after)
          if new.get('schema')!='numi-owner-intimacy-matrix-knowledge-v1' or len(new.get('arcana',{}))!=22:
              raise RuntimeError('KNOWLEDGE_SCHEMA_OR_COUNT_INVALID')
          if old['arcana']['15']['minus']==new['arcana']['15']['minus'] or old['arcana']['15']['love']==new['arcana']['15']['love']:
              raise RuntimeError('ARCANA_15_NOT_UPDATED')
          oldcopy=copy.deepcopy(old);newcopy=copy.deepcopy(new)
          for data in [oldcopy,newcopy]:
              data['arcana']['15'].pop('minus')
              data['arcana']['15'].pop('love')
          if oldcopy!=newcopy:raise RuntimeError('OTHER_KNOWLEDGE_CHANGED')
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def request(p,method='GET',body=None):
              req=urllib.request.Request(site+p+'?owner_15_release='+str(time.time_ns()),data=body,method=method,
                headers={'Cache-Control':'no-store','Content-Type':'application/json','Origin':site.rstrip('/'),
                         'User-Agent':'NumiOwnerKnowledgePatch/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=28) as res:return res.status,res.read(6500)
              except urllib.error.HTTPError as e:return e.code,e.read(6500)
          if request('')[0]!=200:raise RuntimeError('HOME_BEFORE_NOT_200')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(name):
              buf=io.BytesIO();ftp.retrbinary('RETR '+root+name,buf.write);return buf.getvalue()
          def write(name,data):
              ftp.storbinary('STOR '+root+name,io.BytesIO(data))
              if read(name)!=data:raise RuntimeError('FTPS_READBACK_FAILED_'+name)
          modified=False
          try:
              if read(path)!=before:raise RuntimeError('LIVE_KNOWLEDGE_DIFFERS_FROM_BASELINE_NO_CHANGE')
              protected=['redflag-ai-lab/style-test-api.php','redflag-feature.js','index.html',
                         'api/numi-account.php','api/redflag-free-ai.php']
              unchanged={n:read(n) for n in protected}
              if b'google/gemini-3-flash-preview' not in unchanged['redflag-ai-lab/style-test-api.php']:
                  raise RuntimeError('GEMINI_OWNER_ROUTE_NOT_DEPLOYED_NO_CHANGE')
              modified=True
              write(path,after)
              for method,body in [('GET',None),('POST',b'{"category":"flags","question_id":"say-no","day":15,"month":7,"year":1988}')]:
                  status,_=request('redflag-ai-lab/style-test-api.php',method,body)
                  if status!=403:raise RuntimeError('OWNER_GUARD_FAILED_'+method+'_HTTP_'+str(status))
              for n,data in unchanged.items():
                  if read(n)!=data:raise RuntimeError('PROTECTED_FILE_CHANGED_'+n)
              if request('')[0]!=200:raise RuntimeError('HOME_AFTER_NOT_200')
              print('PUBLISHED_AND_VERIFIED arcana_15_impulsive_vs_restrained=true prompt_unchanged=true owner_model_gemini_unchanged=true protected_payments_unchanged=true customer_routes_unchanged=true inference_calls=0',flush=True)
          except BaseException:
              if modified:
                  try:write(path,before);print('ROLLBACK_OK',flush=True)
                  except BaseException:print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
