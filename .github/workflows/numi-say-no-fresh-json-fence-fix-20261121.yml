name: Publish existing Telegram Red Flag owner cards with new GLM style
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-say-no-fresh-json-fence-fix-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only current owner Red Flag API, no inference
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY_2 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,io,os,ssl,ftplib,base64,urllib.request,urllib.error,time,json
          path='redflag-ai-lab/style-test-api.php'
          before_revision='62ee85e9cec3c24a4b3736f637c9d59ff583f154'
          after_revision='2b0ebe365c976a0eae5b15bc9a225dafab87a14f'
          old=subprocess.check_output(['git','show',before_revision+':'+path])
          new=subprocess.check_output(['git','show',after_revision+':'+path])
          if pathlib.Path(path).read_bytes()!=new:raise RuntimeError('SOURCE_CHANGED_AFTER_REVIEW')
          marker=b'__CLOUDRU_KEY_BASE64__'
          if old.count(marker)!=1 or new.count(marker)!=1:raise RuntimeError('MODEL_KEY_TEMPLATE_INVALID')
          if old.count(b'naTestOwner(naCurrent(naDB()))')!=1:raise RuntimeError('OLD_OWNER_GUARD_INVALID')
          if new.count(b'naTestOwner(naCurrent(naDB()))')!=1 or b'naAllowedOrigins()' not in new:
              raise RuntimeError('OWNER_AUTHORIZATION_GUARD_INVALID')
          if b"rfOwnerSharpFlags($question,$day,$month,$y,$catalog)" not in new:
              raise RuntimeError('OWNER_RED_FLAG_ROUTE_MISSING')
          if b"'model'=>'zai-org/GLM-5.1'" not in new or b"rfUnifiedQuestionMeaning($category['id'],$question['id'],$day,$month)" not in new:
              raise RuntimeError('MODEL_OR_LEGACY_FALLBACK_MISSING')
          if b"'value'=>$n,'name'=>$a['name']" in new or b"$relevantArcana[(string)$n]=$a" in new:
              raise RuntimeError('ARCANA_NAMES_STILL_SENT_TO_MODEL')
          if "preg_replace('/[ \\t]*[—–―][ \\t]*/u'".encode('utf-8') not in new:
              raise RuntimeError('DASH_NORMALIZER_NOT_FOUND')
          # Only the shared provider-call helper changes; the user-facing
          # GLM prompt and all business logic must be byte-identical.
          beginning=b'function rfCloudCall('
          ending=b'\n\n/** Shared Red Flag editor:'
          def without_provider_helper(buf):
              start=buf.index(beginning)
              stop=buf.index(ending,start)
              return buf[:start]+b'<CLOUD_CALL_HELPER>'+buf[stop:]
          if without_provider_helper(old)!=without_provider_helper(new):
              raise RuntimeError('MODIFICATION_OUTSIDE_PROVIDER_HELPER')
          if b"'chat_template_kwargs'=>['enable_thinking'=>false]" not in new:
              raise RuntimeError('GLM_THINKING_BUDGET_FIX_NOT_FOUND')
          if b'REDFLAG_EMPTY_META' not in new:
              raise RuntimeError('SAFE_EMPTY_LOGGING_MISSING')
          # Make sure existing paid customer endpoints are not in the deployment set.
          protected=['redflag-feature.js','index.html','api/numi-account.php','api/redflag-free-ai.php']
          kpath='redflag-ai-lab/intimacy-knowledge-v1.json'
          kb=json.loads(pathlib.Path(kpath).read_bytes())
          if len(kb['arcana'])!=22 or kb['schema']!='numi-owner-intimacy-matrix-knowledge-v1':
              raise RuntimeError('ARCANA_KNOWLEDGE_INVALID')
          key=os.environ['CLOUD_RU_API_KEY'].strip()
          if len(key)<15:raise RuntimeError('MODEL_KEY_MISSING')
          key64=base64.b64encode(key.encode())
          print('::add-mask::'+key64.decode(),flush=True)
          before=old.replace(marker,key64)
          desired=new.replace(marker,key64)
          for body in (old,new,before,desired):
              php=subprocess.run(['php','-l'],input=body,capture_output=True)
              if php.returncode:raise RuntimeError('PHP_SYNTAX_FAILED_'+php.stderr.decode(errors='replace')[:300])
          print('PHP_LINT_OK model=zai-org/GLM-5.1 owner_only=true cost_tests=0',flush=True)
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def request(p,method='GET',body=None):
              req=urllib.request.Request(site+p+'?owner_flags_release='+str(time.time_ns()),
                  data=body,method=method,
                  headers={'Cache-Control':'no-store','Content-Type':'application/json',
                           'Origin':site.rstrip('/'),'User-Agent':'NumiOwnerRedFlagsRelease/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=28) as res:return res.status,res.read(6500)
              except urllib.error.HTTPError as e:return e.code,e.read(6500)
          if request('')[0]!=200:raise RuntimeError('HOME_BEFORE_NOT_200')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(name):
              b=io.BytesIO();ftp.retrbinary('RETR '+root+name,b.write);return b.getvalue()
          def write(name,data):
              ftp.storbinary('STOR '+root+name,io.BytesIO(data))
              if read(name)!=data:raise RuntimeError('FTPS_READBACK_FAILED_'+name)
          modified=False
          try:
              actual=read(path)
              if actual!=before:raise RuntimeError('LIVE_API_DIFFERS_FROM_APPROVED_BASELINE_NO_CHANGE')
              untouched={name:read(name) for name in protected}
              knowledgeLive=read(kpath)
              if knowledgeLive!=pathlib.Path(kpath).read_bytes():
                  raise RuntimeError('KNOWLEDGE_ON_SITE_NOT_CURRENT_NO_CHANGE')
              modified=True
              write(path,desired)
              for method,body in [('GET',None),('POST',b'{"category":"flags","question_id":"say-no","day":15,"month":7,"year":1987}')]:
                  status,data=request(path,method,body)
                  if status!=403:raise RuntimeError('OWNER_GUARD_FAILED_'+method+'_HTTP_'+str(status))
                  if key.encode() in data or key64 in data:raise RuntimeError('MODEL_SECRET_EXPOSED')
              for name,blob in untouched.items():
                  if read(name)!=blob:raise RuntimeError('PROTECTED_FILE_CHANGED_'+name)
              if request('')[0]!=200:raise RuntimeError('HOME_AFTER_NOT_200')
              print('PUBLISHED_AND_VERIFIED owner_GLМ_thinking_disabled=true empty_metadata_logging=true prompt_unchanged=true protected_payments_unchanged=true customer_answers_unchanged=true inference_calls=0',flush=True)
          except BaseException:
              if modified:
                  try:write(path,before);print('ROLLBACK_OK',flush=True)
                  except BaseException:print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
