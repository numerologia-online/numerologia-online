name: Release safe owner-only TEST payment method selector on REG.RU

on:
  push:
    paths:
      - .github/workflows/numi-wallet-test-methods-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish owner TEST card and YooMoney selector')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned server script and payment UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/numi_wallet_test_methods_release.py
          node --check wallet-owner-flow-20261106.js
          git fetch --no-tags origin feature/wallet-yookassa-test-20261106
          git show ddeb6aeec637e1d9afcbb766b4d02157d29f400d:wallet-service/private/test-core.php > /tmp/numi-test-method-core.php
          php -l /tmp/numi-test-method-core.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path("wallet-owner-flow-20261106.js").read_text()
          assert 'numi-ow-amount' in s and 'numi-ow-yoomoney' in s
          assert 'numi-ow-choice' in s and 'numi-ow-once' in s
          assert 'localStorage' not in s
          p=Path("/tmp/numi-test-method-core.php").read_text()
          assert "payment_method_data'=>['type'=>$method]" in p
          assert "wtOwnerOnly($current)" in p
          print("TEST_WALLET_METHODS_PHP_JS_CHECKED")
          PY
      - name: Narrow private core and owner JS release with backups and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_wallet_test_methods_release.py
