name: Publish detailed account tariffs to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-detailed-tariffs-release.yml
permissions:
  contents: read
concurrency:
  group: numi-detailed-tariffs-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release expanded tariffs to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate guarded tariff release script
        run: python3 -m py_compile account-service/deploy-detailed-tariffs.py
      - name: Publish isolated account tariffs with backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-detailed-tariffs.py
