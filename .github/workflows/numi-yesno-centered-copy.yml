name: Center question dialog text
on:
  push:
    branches: [fix/yesno-centered-copy]
    paths: [.github/workflows/numi-yesno-centered-copy.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish centered copy with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/centered-layout/deploy.py
