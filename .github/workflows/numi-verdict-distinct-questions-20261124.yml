name: Publish distinct question angles for Final Verdict energies one through ten
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_verdict_distinct_questions_20261124.py'
      - '.github/workflows/numi-verdict-distinct-questions-20261124.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify separate question keys, preserve approved energy four
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_verdict_distinct_questions_20261124.py
