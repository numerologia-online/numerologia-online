name: Publish 100-question topic readability on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-yesno-readability-20261101.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: numi-yesno-readability-20261101
  cancel-in-progress: false
jobs:
  release:
    if: github.event.head_commit.message == 'Locate exact Yes-No Back validation failure'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated CSS, unchanged question catalog and valid release
        id: validate
        run: |
          echo python-syntax > /tmp/yesno-validation-stage
          python3 -m py_compile moment/deploy-yesno-unified-back-20261101.py
          echo js-syntax > /tmp/yesno-validation-stage
          node --check moment/yes-no/yes-no.js
          echo browser-navigation-test > /tmp/yesno-validation-stage
          node moment/tests/yesno-back-flow.test.cjs
          echo catalog-integrity > /tmp/yesno-validation-stage
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('moment/yes-no')
          d=json.loads((p/'questions.json').read_text(encoding='utf-8'))
          assert len(d['categories']) == 7 and len(d['questions']) == 100
          assert len({q['id'] for q in d['questions']}) == 100
          assert len({q['title'] for q in d['questions']}) == 100
          style=(p/'yes-no.css').read_text()
          assert style.count('{')==style.count('}')
          assert 'yes-no.css?v=8' in (p/'index.html').read_text()
          assert 'yes-no.js?v=3' in (p/'index.html').read_text()
          print('Readability and catalog checks passed')
          PY
          echo all-pass > /tmp/yesno-validation-stage
      - name: Back up, publish CSS and update only stylesheet link, verify live public site
        id: publish
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -o pipefail
          python3 -u moment/deploy-yesno-unified-back-20261101.py 2>&1 | tee /tmp/yesno-back-release.log
      - name: Record live publication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          state='success' if os.environ.get('RELEASE_OUTCOME')=='success' else 'failure'
          description='Back navigation verified live on REG.RU' if state=='success' else 'Deployment failed before diagnostics'
          if state=='failure':
            if os.environ.get('VALIDATION_OUTCOME')!='success':
              stagefile=pathlib.Path('/tmp/yesno-validation-stage')
              description='Predeployment validation failed at '+(stagefile.read_text().strip() if stagefile.exists() else 'initialization')
            else:
              logfile=pathlib.Path('/tmp/yesno-back-release.log')
              if logfile.exists():
                for line in reversed(logfile.read_text(errors='replace').splitlines()):
                  if line.startswith('YESNO_UNIFIED_BACK '):
                    try:description=str(json.loads(line.partition(' ')[2]).get('message') or json.loads(line.partition(' ')[2]).get('error'))[:130]
                    except Exception:pass
                    break
          context='yesno-readability-live' if state=='success' else 'yesno-back-'+''.join(c if c.isalnum() and c.isascii() else '-' for c in description.lower())[:80]
          body=json.dumps({'state':state,'context':context,'description':description}).encode()
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA']
          req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:print('Live result recorded:',state,response.status)
          PY
