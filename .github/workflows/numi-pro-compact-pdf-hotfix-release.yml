name: Fix full-life accordion overflow and restore PDF on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-pro-compact-pdf-hotfix-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original sectioned reader, purchased access, and PDF exist
        run: |
          node --check pro/pro.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('pro/pro.js').read_text('utf8')
          css=Path('pro/pro.css').read_text('utf8')
          page=Path('pro/index.html').read_text('utf8')
          assert 'verifiedOwner && !ownerSeeFree' in js
          assert 'verifiedPurchaseDate === input.value.trim()' in js
          assert 'const quote=await walletRequest("wallet_quote",{item});' in js
          assert 'quote.owned===true && quote.product_code==="life_full"' in js
          assert 'results.prepend(purchasedProRegion)' not in js
          assert 'renderQuestions(definitions);' in js
          assert 'renderDiagram(points);' in js
          assert 'renderZones(zones);' in js
          assert 'panel.hidden = !open;' in js
          assert 'createFullReportPdfButton("top")' in js
          assert 'pdfControls.hidden=false' in js
          assert 'makePreparingPdfButton()' in js
          assert '.pro-question-item:not(.pro-question-free).expanded > .pro-answer' in css
          assert 'overflow-y:auto' in css and 'max-height: min(47dvh,400px)' in css
          assert 'pro/pro.css?v=compact-windows-20261116' in page
          assert 'pro/pro.js?v=compact-windows-20261116' in page
          assert 'id="pro-pdf-controls"' in page
          assert 'id="pro-question-buttons"' in page
          assert 'id="pro-free-impression"' in page
          print('PRO_NATIVE_COMPACT_PDF_PREFLIGHT_OK owner_free=true paid_natively=true pdf_present=true public_locks_intact=true')
          PY
      - name: Backup and deploy exactly 3 full-life view files with public verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,io,ftplib,ssl,subprocess,hashlib,pathlib,urllib.request,urllib.error,time,json
          names=['pro/pro.css','pro/pro.js','pro/index.html']
          previous_refs={
            'pro/pro.js':'23223fe49a431ce6c84bea46790523d1b8f9f7f8',
            'pro/index.html':'cf88cd37947891a51adf0000cf8779bb9aad79a8',
            'pro/pro.css':'cf88cd37947891a51adf0000cf8779bb9aad79a8'
          }
          previous={name:subprocess.check_output(['git','show',previous_refs[name]+':'+name]) for name in names}
          wanted={name:pathlib.Path(name).read_bytes() for name in names}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          base=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=root+'/site-safeguard-backups/'
          def read(path):
            buf=io.BytesIO()
            ftp.retrbinary('RETR '+path,buf.write)
            return buf.getvalue()
          def write(path,data):
            ftp.storbinary('STOR '+path,io.BytesIO(data))
            if read(path)!=data:raise RuntimeError('PRO_COMPACT_FTP_READBACK_FAILED')
          prior={};updated=[]
          try:
            for name in names:
              live=read(base+name)
              if live not in (previous[name],wanted[name]):
                raise RuntimeError('PRO_COMPACT_LIVE_FILE_CHANGED_REFUSE_OVERWRITE '+name)
              prior[name]=live
            stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            for name in names:
              if prior[name]!=wanted[name]:
                write(backups+'pro-compact-pdf-'+name.replace('/','-')+'-'+stamp+'.bak',prior[name])
            for name in names:
              if prior[name]!=wanted[name]:
                write(base+name,wanted[name]);updated.append(name)
            site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
            for name in names:
              req=urllib.request.Request(site+name+'?pdf_compact='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                contents=r.read(140000);status=r.status
              if status!=200 or hashlib.sha256(contents).digest()!=hashlib.sha256(wanted[name]).digest():
                raise RuntimeError('PRO_COMPACT_PUBLIC_MISMATCH '+name)
            req=urllib.request.Request(site+'api/numi-owner-access.php?anon='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as r:
              anonymous=json.load(r)
            if anonymous.get('ok')!=True or anonymous.get('owner') is not False:
              raise RuntimeError('PRO_COMPACT_OWNER_GATE_BROKEN')
            print('PRO_COMPACT_PDF_LIVE_OK native_accordion=true long_answer_scroll_inside=true native_owner_paid=true pdf_button_restored=true anonymous_locked=true')
          except BaseException:
            for name in reversed(updated):
              try:
                write(base+name,prior[name])
                print('PRO_COMPACT_ROLLBACK_OK '+name)
              except Exception:print('PRO_COMPACT_ROLLBACK_FAILED '+name)
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
