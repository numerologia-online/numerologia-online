name: Compare external IPv4 versus IPv6 from Globalping (READ ONLY)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-world-ipv4-ipv6-20261119.yml']
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Test public homepage over both IP versions from independent international probes
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,json,time
          endpoint='https://api.globalping.io/v1/measurements'
          target='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          def fetch(url,payload=None):
              h={'Content-Type':'application/json','User-Agent':'NumiReadOnlyTroubleshooting/1.0'}
              req=urllib.request.Request(url,headers=h,data=json.dumps(payload).encode() if payload is not None else None)
              with urllib.request.urlopen(req,timeout=16) as r:return json.load(r)
          for family in [4,6]:
              payload={'type':'http','target':target,'locations':[{'country':'DE','limit':2},{'country':'US','limit':1}],
                       'measurementOptions':{'protocol':'HTTPS','ipVersion':family,'request':{'method':'GET','path':'/'}}}
              try:
                  item=fetch(endpoint,payload)
                  print('START',family,'id',item.get('id'),'count',item.get('probesCount'),flush=True)
              except urllib.error.HTTPError as e:
                  print('START_ERROR',family,e.code,e.read(800).decode('utf-8','replace'),flush=True);continue
              ident=item.get('id')
              if not ident:continue
              for attempt in range(9):
                  time.sleep(3)
                  try:out=fetch(endpoint+'/'+ident)
                  except Exception as e:print('POLL_ERROR',family,type(e).__name__,flush=True);break
                  if out.get('status') not in ('in-progress','queued'):break
              print('MEASUREMENT',family,'status',out.get('status'),flush=True)
              for x in out.get('results',[]):
                  loc=x.get('probe',{})
                  res=x.get('result',{})
                  print('LOCATION',family,loc.get('country'),loc.get('city'),
                        'status',res.get('status'),'code',res.get('statusCode'),
                        'time',res.get('totalTime'),
                        'raw',str(res.get('rawOutput',''))[-320:].replace('\n',' '),flush=True)
          PY
