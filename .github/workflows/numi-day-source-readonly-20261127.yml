name: Confirm live daily forecast sources without changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-day-source-readonly-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the source markers in the live daily files
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,socket,os,re,io,urllib.request,urllib.error,hashlib,concurrent.futures
          h=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(h)
          ptr=socket.gethostbyaddr(h)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert h in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21);ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              buffer=io.BytesIO()
              ftp.retrbinary('RETR '+path,buffer.write)
              return buffer.getvalue().decode('utf-8','replace')
          try:
              page=read(root+'index.html')
              js=read(root+'personal-day-feature.js')
              print('LIVE_HOME_REFERENCES_DAY_SCRIPT', 'personal-day-feature.js' in page)
              print('LIVE_DAY_FETCHES_PAGES', bool(re.search(r'fetch\(\x60https://numerologia-online\.github\.io/',js)))
              try:
                  sender=read(home+'/private/numerologia-daily-08-msk-21-10-2026.php')
              except ftplib.error_perm:
                  print('DOCUMENTED_REG_RU_SENDER_UNREADABLE')
              else:
                  block=re.search(r'\$bankOrigins\s*=\s*\[(.*?)\]',sender,re.S)
                  if block:
                      from urllib.parse import urlparse
                      hosts=sorted({urlparse(url).hostname for url in re.findall(r'https?://[^\s\x27\x22]+',block.group(1))})
                      print('LIVE_SENDER_FORECAST_HOSTS', ','.join(hosts))
                  else:
                      print('LIVE_SENDER_ORIGIN_LIST_NOT_FOUND')
          finally:
              ftp.quit()
          PY
