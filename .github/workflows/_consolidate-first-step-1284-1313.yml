name: Consolidate approved first-step texts 1284 to 1313

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_consolidate-first-step-1284-1313.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-step-consolidation-1284-1313
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and merge thirty approved interpretations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          root = Path("data/redflag/love")
          target = root / "first-step.json"
          parts = [
              root / "_approved_1284_1293.json",
              root / "_approved_1294_1303.json",
              root / "_approved_1304_1313.json",
          ]
          old = json.loads(target.read_text(encoding="utf-8"))
          if len(old["entries"]) != 1283:
              raise SystemExit("Aborted: canonical count has changed")
          merged = {}
          groups = {}
          for part in parts:
              data = json.loads(part.read_text(encoding="utf-8"))
              group = data["entries"]
              if len(group) != 10:
                  raise SystemExit(f"Aborted: wrong group count {part}")
              groups[part.name] = len(group)
              for key, value in group.items():
                  if key in old["entries"] or key in merged:
                      raise SystemExit(f"Aborted: duplicate {key}")
                  day, month, energy = map(int, key.split("-"))
                  dt = datetime.strptime(value["exampleDate"], "%d.%m.%Y")
                  assert (day, month, energy, dt.year) == (dt.day, dt.month, 5, 1985)
                  assert value["text"] and "\n" not in value["text"]
                  merged[key] = value
          if len(merged) != 30:
              raise SystemExit(f"Aborted: got {len(merged)}, not 30")
          expected_dates = ["20.03.1985", "21.03.1985"]
          expected_dates += [f"{d:02d}.04.1985" for d in [1,2,3,4,6,7,10,12,13,14,15,17,19,20,21]]
          expected_dates += [f"{d:02d}.05.1985" for d in [1,2,3,4,6,7,10,12,13,14,15,17,19]]
          expected_keys = {f"{int(s[:2])}-{int(s[3:5])}-5" for s in expected_dates}
          if set(merged) != expected_keys:
              raise SystemExit("Aborted: wrong or missing target keys")
          old["entries"].update(merged)
          target.write_text(json.dumps(old, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for part in parts:
              part.unlink()
          leftover = root / "_merge_payload_may_01.json"
          if leftover.exists():
              staged = json.loads(leftover.read_text(encoding="utf-8"))
              if list(staged.get("entries", {})) != ["1-5-5"]:
                  raise SystemExit("Aborted: unexpected earlier temporary file")
              leftover.unlink()
          check = json.loads(target.read_text(encoding="utf-8"))["entries"]
          assert len(check) == 1313
          assert all(check[k] == v for k, v in merged.items())
          print("Success: canonical JSON now holds 1313 entries; 30 new ones verified.")
          PY
      - name: Remove temporary files and this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_consolidate-first-step-1284-1313.yml
          git add -A data/redflag/love
          git diff --cached --stat
          git commit -m "Merge approved interpretations 1284-1313 into main JSON and clean up"
          git push origin HEAD:main
