name: Publish live Gemini Love Languages full block to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-language-live-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all ten language questions without Gemini then guarded REG RU publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_language_live_publish_20261123.py
