name: Release Family owner preview no-session/no-15s issue
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-owner-unblock-20261124.yml
      - .github/scripts/numi_family_owner_unblock_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static check and safe one-file owner API publish, zero model requests
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_owner_unblock_20261124.py
