name: Publish approved Red Flag Love August 13 to REG.RU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-love-aug13-approved-release.yml'
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact approved August 13 copy to GitHub and REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
            import json,hashlib,os,pathlib,subprocess,ftplib,ssl,io,time
            DATE='13-8'
            PAYLOAD=json.loads("{\"first-step\":\"Первым он пишет охотно, пока чувствует, что женщину ещё нужно завоевать. Может несколько раз за день напомнить о себе, предложить встречу, настойчиво интересоваться её планами. Но как только понимает, что она уже привязалась, инициативы становится заметно меньше. Он начинает отвечать тогда, когда удобно ему, пропускает сообщения, а потом появляется с таким видом, будто ничего не произошло. Особенно неприятно, что её попытки обсудить перемены он может назвать навязчивостью. Получается интересная история: сначала мужчина сам приучает женщину к постоянному вниманию, а потом обвиняет её в том, что она этого внимания ждёт. Если она перестанет писать первой, отношения вполне могут надолго зависнуть.\\n\\nЕсли после яркого знакомства он вдруг перестал выходить на связь, открой «Почему он исчезает без объяснений?». Иногда за внезапной тишиной стоит не занятость и даже не потеря интереса, а весьма удобный способ управлять отношениями.\",\"romance\":\"С романтикой у него своеобразные отношения. Ему нравится производить впечатление, поэтому на этапе знакомства могут быть красивые сообщения, неожиданные приглашения и даже тщательно продуманные свидания. Но у этой романтики часто есть зритель, и этот зритель должен восхищаться. Если женщина недостаточно восторженно отреагировала на сюрприз, он способен обидеться сильнее, чем она ожидала. В обычной жизни всё гораздо прозаичнее. Он может не замечать, что партнёрша несколько недель просит провести с ней вечер, зато искренне считать себя романтиком, потому что однажды устроил незабываемые выходные. Его ухаживания иногда больше похожи на демонстрацию собственных возможностей, чем на желание узнать, что действительно делает женщину счастливой.\\n\\nРядом с ним женщина расцветает или гаснет? Особенно интересно, что происходит, когда восхищаться начинают не им, а самой женщиной.\",\"relationship-or-comfort\":\"Ему хочется отношений, в которых есть любовь, забота, секс, внимание и поддержка, но желательно без необходимости слишком сильно менять собственные привычки. Например, он может регулярно оставаться у женщины, пользоваться её гостеприимством, принимать приготовленные ужины и совершенно не задумываться, сколько сил она вкладывает в их встречи. Зато если однажды она попросит его приехать к ней после тяжёлого рабочего дня и помочь с делами, внезапно выяснится, что он устал, занят или вообще не любит, когда на него давят. Самое неприятное, что мужчина вполне способен считать такие отношения взаимными. Ведь он же приезжает, разговаривает, проводит с ней время! Только женщина постепенно обнаруживает, что её присутствие делает его жизнь комфортнее, а его присутствие добавляет ей обязанностей.\\n\\nМужчина для семьи или вечный мальчик? Совместный быт быстро показывает, кто собирается строить семью, а кто просто ищет улучшенную версию обслуживания.\",\"adult-partner\":\"Он может рассуждать о семье вполне серьёзно, представлять будущий дом, детей и совместные праздники. Но его представления нередко заканчиваются там, где начинается ежедневная ответственность. Например, он с удовольствием выбирает дорогой телевизор в общую квартиру, но обсуждение коммунальных платежей, расходов на продукты и домашних обязанностей внезапно становится скучным. Если женщина берёт организацию на себя, он не обязательно возражает. Наоборот, ему очень удобно. Постепенно она превращается в человека, который помнит обо всём, планирует за двоих и напоминает взрослому мужчине о самых элементарных вещах. А он ещё может возмущаться, что она стала слишком требовательной и перестала быть той лёгкой девушкой, в которую он влюбился.\\n\\nГотов к серьёзным отношениям или вечно «я не готов»? Иногда мужчина мечтает о семье исключительно до того момента, когда от него требуют конкретного решения.\",\"near-him\":\"В начале отношений он может восхищаться её красотой, самостоятельностью и успехами. Но когда женщина действительно начинает добиваться большего, у него иногда просыпается неприятное чувство соперничества. Например, она получает повышение, а вместо радости слышит замечание, что теперь совсем зазнается. Покупает себе дорогую вещь, и он интересуется, не слишком ли много она о себе возомнила. Особенно болезненными становятся ситуации, когда окружающие уделяют ей больше внимания, чем ему. Тогда он может испортить настроение едким комментарием, обесценить достижение или внезапно вспомнить её старую ошибку. Женщина не сразу замечает, как начинает рассказывать о своих победах осторожнее, выбирать слова и даже преуменьшать собственные успехи. Не потому, что он прямо запрещает ей развиваться, а потому, что радоваться рядом с ним становится небезопасно.\\n\\nСпособен быть с одной женщиной или его тянет в любовные треугольники? Его отношение к чужому вниманию может оказаться довольно показательным.\",\"hard-moment\":\"Если неприятность можно решить быстро, он, вероятно, включится. Но настоящая проверка начинается, когда женщине плохо не один вечер, а несколько недель подряд. Болезнь, потеря работы, семейные проблемы или эмоциональное истощение способны вызвать у него раздражение. Сначала он может пытаться помочь, потом начнёт спрашивать, когда всё наконец закончится. Особенно неприятна его привычка сравнивать чужие трудности со своими: мол, у него тоже проблемы, но он же не жалуется. Женщина рискует оказаться в положении, когда ей приходится не только справляться с бедой, но ещё и делать вид, что всё нормально, чтобы не портить мужчине настроение. Его присутствие в спокойные времена само по себе ничего не доказывает. Важно, способен ли он выдерживать отношения, в которых какое-то время не получает привычного внимания и удовольствия.\\n\\nИщет любовь или просто удобную женщину? Когда партнёрша временно перестаёт быть удобной, многое становится очевидным без признаний.\",\"relationship-format\":\"Он может годами находиться в отношениях, которые его полностью устраивают, и при этом убеждать женщину, что для следующего шага пока неподходящее время. Сегодня ему нужно разобраться с работой, завтра заработать больше, через полгода решить жилищный вопрос. Каждая причина по отдельности звучит убедительно, поэтому спорить с ним непросто. Но стоит женщине предложить конкретный план, как появляются новые препятствия. Особенно показательно, если мужчина уже пользуется всеми преимуществами совместной жизни, но любые разговоры об официальных обязательствах называет давлением. Он может даже обижаться, что партнёрша ставит под сомнение его чувства. При этом сам предпочитает не замечать, что её жизнь тоже проходит, пока он бесконечно готовится к будущему.\\n\\nПочему он исчезает без объяснений? Иногда мужчина уходит в тишину именно тогда, когда понимает, что разговоров о будущем больше не избежать.\",\"family-or-triangle\":\"Ему может быть недостаточно внимания одной женщины, даже когда отношения вполне благополучны. Дело не обязательно в желании изменить. Ему приятно знать, что он по-прежнему интересен другим, и ради этого он способен поддерживать довольно двусмысленное общение. Например, регулярно переписываться с бывшей, реагировать на откровенные фотографии знакомой или встречаться с женщиной, которая явно рассчитывает на большее. При этом партнёрше он будет объяснять, что она всё неправильно понимает и вообще слишком ревнивая. Самое неприятное здесь не наличие других женщин, а двойные стандарты. Его флирт считается безобидным общением, а аналогичное поведение любимой легко превращается в повод для скандала. Так возникает ситуация, в которой он оставляет себе свободу, а от женщины требует безусловной верности.\\n\\nРядом с ним женщина расцветает или гаснет? Постоянное соревнование с другими женщинами иногда становится частью отношений, даже если никто физически не изменяет.\",\"honest-or-disappear\":\"Он не любит разговоры, в которых приходится признавать собственную неправоту, объяснять перемену чувств или принимать неприятное решение. Поэтому вместо честного ответа иногда выбирает молчание. Например, после конфликта может перестать выходить на связь на несколько дней, прекрасно понимая, что женщина переживает и пытается разобраться в случившемся. При этом он не обязательно собирается расставаться. Иногда ему достаточно дождаться, пока она сама напишет, соскучится, извинится или предложит забыть ссору. Тогда он возвращается без объяснений, словно ничего особенного не произошло. Если этот сценарий повторяется, исчезновения становятся удобным способом избегать ответственности за собственные поступки. Особенно тревожно, когда женщина постепенно привыкает бояться любого серьёзного разговора, потому что знает, чем он может закончиться.\\n\\nПишет первым или ждёт инициативы от женщины? Здесь важно разобраться, кто на самом деле поддерживает общение и кому приходится каждый раз восстанавливать контакт.\"}")
            IDS=["first-step","romance","relationship-or-comfort","adult-partner","near-him","hard-moment","relationship-format","family-or-triangle","honest-or-disappear"]
            ROOT=pathlib.Path("data/redflag/love")
            MANIFEST=pathlib.Path("account-service/private/store-assets.json")
            PATHS=[ROOT/(i+".json") for i in IDS]
            original={}
            result={}
            for id,p in zip(IDS,PATHS):
              before=p.read_bytes()
              obj=json.loads(before)
              assert obj["section"]=="love" and obj["questionId"]==id and obj["keyRule"]=="day-month"
              if DATE in obj["entries"] and id!="first-step":
                assert obj["entries"][DATE]==PAYLOAD[id], "PAID_DATE_ALREADY_EXISTS_DIFFERENT:"+id
              original[str(p)]=before
              obj["entries"][DATE]=PAYLOAD[id]
              new=(json.dumps(obj,ensure_ascii=False,indent=2)+"\n").encode()
              result[str(p)]=new
              p.write_bytes(new)
            m=json.loads(MANIFEST.read_bytes())
            for p,b in result.items():m["files"][p]=hashlib.sha256(b).hexdigest()
            MANIFEST.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
            subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
            subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
            subprocess.run(["git","add",*[str(p) for p in PATHS],str(MANIFEST)],check=True)
            check=subprocess.run(["git","diff","--cached","--quiet"])
            if check.returncode:
              subprocess.run(["git","commit","-m","Publish approved Red Flag Love August 13 answers and manifest"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)
            print("GITHUB_APPROVED_AUG13_COMMITTED",flush=True)
            username=os.environ.get("REG_FTP_USER")
            password=os.environ.get("REG_FTP_PASSWORD")
            if not username or not password:raise RuntimeError("REG_RU_SECRETS_MISSING")
            ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
            ftp.connect("server172.hosting.reg.ru",21)
            ftp.login(username,password);ftp.prot_p();ftp.set_pasv(True)
            home=ftp.pwd().rstrip("/")
            private=home+"/private/numi-account-20261031"
            remote={str(p):private+"/store-content/"+str(p) for p in PATHS}
            remote[str(MANIFEST)]=private+"/store-assets.json"
            def read(p):
             b=io.BytesIO()
             def collect(chunk):
              if b.tell()+len(chunk)>1800000:raise RuntimeError("OVERSIZE:"+p)
              b.write(chunk)
             ftp.retrbinary("RETR "+p,collect)
             return b.getvalue()
            def write(p,data):
             ftp.storbinary("STOR "+p,io.BytesIO(data))
             if read(p)!=data:raise RuntimeError("FTP_READBACK_FAILED:"+p)
            actual={}
            new={}
            for id,p in zip(IDS,PATHS):
             key=str(p)
             actual[key]=read(remote[key])
             obj=json.loads(actual[key])
             target=json.loads(result[key])
             assert obj["section"]=="love" and obj["questionId"]==id and obj["status"]==target["status"]
             assert obj["keyRule"]=="day-month"
             assert id=="first-step" or DATE not in obj["entries"] or obj["entries"][DATE]==PAYLOAD[id], "EXISTING_LIVE_PAID_DATE_CONFLICT:"+id
             obj["entries"][DATE]=PAYLOAD[id]
             new[key]=(json.dumps(obj,ensure_ascii=False,indent=2)+"\n").encode()
            actual[str(MANIFEST)]=read(remote[str(MANIFEST)])
            live_m=json.loads(actual[str(MANIFEST)])
            assert live_m["version"]==2 and isinstance(live_m["files"],dict)
            for p in PATHS[1:]:
             key=str(p)
             assert live_m["files"].get(key)==hashlib.sha256(actual[key]).hexdigest(),"LIVE_MANIFEST_DRIFT:"+key
            for key in result:live_m["files"][key]=hashlib.sha256(new[key]).hexdigest()
            new[str(MANIFEST)]=(json.dumps(live_m,ensure_ascii=False,indent=2)+"\n").encode()
            backup_root=home+"/site-safeguard-backups"
            ftp.cwd(backup_root)
            backup=backup_root+"/redflag-love-aug13-"+os.environ["GITHUB_RUN_ID"]
            ftp.mkd(backup)
            for i,key in enumerate([*result,str(MANIFEST)]):
             write(backup+"/"+str(i).zfill(2)+"-"+key.rsplit("/",1)[-1]+".before",actual[key])
            print("FTP_AUG13_BACKUP_VERIFIED",flush=True)
            touched=[]
            try:
             for key in [*result,str(MANIFEST)]:
              if read(remote[key])!=actual[key]:raise RuntimeError("CONCURRENT_FTP_CHANGE:"+key)
              if actual[key]!=new[key]:
               touched.append(key)
               write(remote[key],new[key])
             for key in [*result,str(MANIFEST)]:
              if read(remote[key])!=new[key]:raise RuntimeError("FINAL_REMOTE_VERIFY_FAIL:"+key)
             print("AUG13_9_ANSWERS_REG_RU_VERIFIED",flush=True)
            except BaseException:
             for key in reversed(touched):
              try:write(remote[key],actual[key]);print("ROLLBACK_OK:"+key,flush=True)
              except BaseException:print("ROLLBACK_FAILED:"+key,flush=True)
             raise
            finally:
             ftp.quit()
          PY
