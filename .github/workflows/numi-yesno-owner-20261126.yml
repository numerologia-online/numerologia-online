name: Yes/No verified owner access only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-yesno-owner-20261126.yml
      - yesno-service/public/numi-yesno-answer.php
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint and verify narrow access change
        run: |
          php -l yesno-service/public/numi-yesno-answer.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('yesno-service/public/numi-yesno-answer.php').read_text()
          assert '$unlimited=naTestOwner($account) || $member;' in s
          assert 'if (!$unlimited)' in s
          assert "if (!$account) ynReply(401" in s
          assert 'DAILY_LIMIT_REACHED' in s and 'INSERT IGNORE INTO' in s
          PY
      - name: Guard, back up and deploy only existing Yes/No API
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, ssl, socket, re, os, io, subprocess, pathlib, time, json, urllib.request, urllib.error
          source='yesno-service/public/numi-yesno-answer.php'
          old=subprocess.check_output(['git','show','c82b5a5c6ceab6155936b4b144ab3d90dd81c3e2:'+source])
          new=pathlib.Path(source).read_bytes()
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {v[4][0] for v in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          try:
              home=ftp.pwd().rstrip('/')
              site=home+'/www/xn--c1adkkdfjbp1a4l.online'
              target=site+'/api/numi-yesno-answer.php'
              def read(path):
                  buf=io.BytesIO()
                  ftp.retrbinary('RETR '+path,buf.write)
                  return buf.getvalue()
              def put(path,value):
                  ftp.storbinary('STOR '+path,io.BytesIO(value))
                  assert read(path)==value,'Upload verification failed'
              assert b'account-browser.js' in read(site+'/index.html'),'Site identity not verified'
              core=read(home+'/private/numi-account-20261031/core.php')
              assert b'function naTestOwner(' in core,'Existing owner authority missing'
              live=read(target)
              assert live in (old,new),'Production drift: no files modified'
              if live!=new:
                  backup=home+'/site-safeguard-backups'
                  try: ftp.mkd(backup)
                  except ftplib.error_perm: pass
                  put(backup+'/yesno-owner-'+os.environ['GITHUB_RUN_ID']+'.php.bak',live)
              try:
                  if live!=new: put(target,new)
                  origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
                  def call(path,body=None):
                      req=urllib.request.Request(origin+path,data=body,headers={'Origin':origin,'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'numi-yesno-owner-verifier'})
                      try:
                          with urllib.request.urlopen(req,timeout=25) as r: return r.status,json.load(r)
                      except urllib.error.HTTPError as e: return e.code,json.load(e)
                  status,result=call('/api/numi-yesno-answer.php?status=1')
                  assert status==200 and result.get('authenticated') is False and result.get('remaining')==0
                  status,result=call('/api/numi-yesno-answer.php',b'{"question":"yn-man-001","time":"12:34"}')
                  assert status==401 and result.get('error')=='LOGIN_REQUIRED'
                  print('YESNO OWNER ACCESS API PUBLISHED; anonymous access remains protected')
              except BaseException:
                  if live!=new: put(target,live)
                  raise
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          PY
