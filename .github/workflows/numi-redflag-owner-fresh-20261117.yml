name: Publish owner Red Flag fresh answers on reopen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-owner-fresh-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify owner refresh and preserve customer calculations
        run: |
          set -euo pipefail
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('redflag-feature.js').read_text()
          app=Path('app.js').read_text()
          html=Path('index.html').read_text()
          assert '<span class="redflag-submit-label">Введите дату</span>' in html
          assert '<span class="redflag-submit-arrow" aria-hidden="true" hidden>→</span>' in html
          assert 'const valid = Boolean(parseRedFlagDate(birthDateInput.value));' in js
          assert 'checkManLabel.textContent = valid ? "Проверить мужчину" : "Введите дату";' in js
          assert 'checkManArrow.hidden = !valid;' in js
          assert js.count('syncCheckManButton();')>=3
          assert 'form.addEventListener("submit"' in js
          assert 'showInlinePurchase(item,target,' in js
          assert 'redflag-feature.js?v=flags-owner-preview-20261117' in app
          assert 'app.js?v=flags-owner-preview-20261117' in html
          assert 'if(!opened&&ownerDraftInScope(question,state)){' in js
          assert 'state.answers.delete(question.id);' in js
          assert 'ensureAnswer(question, state, {forceNew:ownerDraftInScope(question,state)})' in js
          assert 'Показать сохранённое' in js
          assert 'const previous=await fetch("/redflag-ai-lab/keep.php"' not in js
          assert 'fetch("/redflag-ai-lab/draft.php",{' in js
          assert 'if(question.isFree&&id==="say-no"' in js
          print('OWNER_FRESH_TESTS_AND_CLIENT_CODE_PRESERVED')
          PY
      - name: Backup and upload only three owner test frontend files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,subprocess,time,urllib.request
          from pathlib import Path
          paths=['redflag-feature.js','app.js','index.html']
          wanted={p:Path(p).read_bytes() for p in paths}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          approved={}
          for p in paths:
              revisions=subprocess.check_output(['git','log','--format=%H','-n','350','--',p],text=True).splitlines()
              approved[p]={sha(subprocess.check_output(['git','show',rev+':'+p])) for rev in revisions}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          prefix=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              target=io.BytesIO()
              ftp.retrbinary('RETR '+prefix+path,target.write)
              return target.getvalue()
          def publish(path,data):
              ftp.storbinary('STOR '+prefix+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('UPLOAD_READBACK_FAILED_'+path)
          previous={};updated=[]
          try:
              previous={p:read(p) for p in paths}
              for p in paths:
                  if sha(previous[p]) not in approved[p]:raise RuntimeError('UNEXPECTED_LIVE_EDIT_'+p)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              timestamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  dest=backup+'/redflag-owner-fresh-'+timestamp+'-'+p+'.bak'
                  ftp.storbinary('STOR '+dest,io.BytesIO(previous[p]))
                  b=io.BytesIO();ftp.retrbinary('RETR '+dest,b.write)
                  if b.getvalue()!=previous[p]:raise RuntimeError('BACKUP_FAILED_'+p)
              for p in paths:
                  if read(p)!=previous[p]:raise RuntimeError('CONCURRENT_EDIT_'+p)
                  if previous[p]!=wanted[p]:
                      updated.append(p);publish(p,wanted[p])
              base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in paths:
                  req=urllib.request.Request(base+p+'?check='+str(time.time_ns()),
                    headers={'Cache-Control':'no-cache','User-Agent':'NumiVerifiedOwnerFreshPreview/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      body=response.read(350000)
                  if sha(body)!=sha(wanted[p]):raise RuntimeError('PUBLIC_BUTTON_HASH_MISMATCH_'+p)
              print('REDFLAG_OWNER_FRESH_PREVIEW_LIVE_VERIFIED',flush=True)
          except BaseException:
              for p in reversed(updated):
                  try:publish(p,previous[p]);print('ROLLBACK_OK',p,flush=True)
                  except BaseException:print('ROLLBACK_FAILED',p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Record publish result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-owner-fresh-live" -f description="Owner preview: fresh on reopen; kept drafts accessible separately" >/dev/null
      - name: Record verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-owner-fresh-live" -f description="Owner fresh preview not verified; check workflow and rollback" >/dev/null
