name: Publish compact Telegram account card to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-compact-cabinet-release.yml
permissions:
  contents: read
concurrency:
  group: numi-compact-cabinet-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish compact account layout on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate compact cabinet frontend
        run: |
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-compact-cabinet.py
      - name: Release with backup, guard and integrity check
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-compact-cabinet.py
