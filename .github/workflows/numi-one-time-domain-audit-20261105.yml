name: Audit new and old domain mapping safely
on:
  push:
    paths:
      - .github/workflows/numi-one-time-domain-audit-20261105.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read-only FTP webroot and HTTPS audit
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,re,urllib.request,urllib.error
          old='xn--c1adkkdfjbp1a4l.online'
          new='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          def read(path):
            out=io.BytesIO()
            ftp.retrbinary('RETR '+path,out.write)
            return out.getvalue()
          try:
            for host in [old,new]:
              root=home+'/www/'+host
              try:
                ftp.cwd(root)
                print('WEBROOT',host,'EXISTS')
              except ftplib.all_errors as exc:
                print('WEBROOT',host,'NOT_PRESENT',type(exc).__name__)
                continue
              for name in ['index.html','offer.html','privacy.html','sitemap.xml','account-browser.js','.htaccess']:
                try:
                  data=read(root+'/'+name)
                except ftplib.all_errors as exc:
                  print('FILE',host,name,'MISSING',type(exc).__name__)
                  continue
                text=data.decode('utf-8','replace')
                if len(data)>250000:raise ValueError('unexpected big file')
                match=re.search(r'<link[^>]*rel="canonical"[^>]*>',text,re.I)
                print('FILE',host,name,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest(),'old',text.count(old)+text.count('нумерология.online'),'new',text.count(new)+text.count('нумерология-онлайн.рф'),'canonical',match.group(0)[:170] if match else '')
                if name=='.htaccess':
                  for line in text.splitlines():
                    if ('RewriteCond' in line or 'RewriteRule' in line or 'Redirect' in line) and any(term in line for term in ('HTTP_HOST',old,new,'REQUEST_URI','HTTPS','www.','^https?')):
                      print('RULE',host,line[:240])
            for host in [old,new]:
              for path in ['/','/offer.html']:
                url='https://'+host+path
                try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=10) as response:
                    body=response.read(200000)
                    match=re.search(rb'<link[^>]*rel="canonical"[^>]*>',body,re.I)
                    print('HTTP',host,path,response.status,response.url,'bytes_sample',len(body),'canonical',match.group(0).decode('utf-8','replace')[:160] if match else '')
                except Exception as exc:
                  print('HTTP',host,path,'ERROR',str(exc)[:180])
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
