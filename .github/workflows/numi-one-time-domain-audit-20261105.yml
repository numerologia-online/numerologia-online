name: Final read-only audit old redirect and live-to-GitHub public sync
on:
  push:
    paths: ['.github/workflows/numi-one-time-domain-audit-20261105.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify new domain and public files match byte for byte
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,pathlib,hashlib,urllib.request,urllib.error
          FILES=["index.html","child/index.html","pro/index.html","year/index.html","guide/index.html","offer.html","privacy.html","refunds.html","terms.html","disclaimer.html","contacts.html","prices.html","analytics-settings.html","robots.txt","sitemap.xml","account-browser.js","app.js","redflag-feature.js"]
          OLD='xn--c1adkkdfjbp1a4l.online'
          NEW='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          root=ftp.pwd().rstrip('/')+'/www/'+OLD
          n=0
          try:
           ftp.cwd(root)
           for path in FILES:
            buf=io.BytesIO()
            ftp.retrbinary('RETR '+root+'/'+path,buf.write)
            live=buf.getvalue()
            local=pathlib.Path(path).read_bytes()
            if hashlib.sha256(live).digest()!=hashlib.sha256(local).digest():
             raise RuntimeError('Public GitHub and REG.RU mismatch: '+path)
            content=live.decode('utf-8','replace')
            if path.endswith('.html'):
             canonical='<link rel="canonical" href="https://'+NEW+'/'
             if canonical not in content:
              raise RuntimeError('Primary domain canonical not new: '+path)
            if path=='sitemap.xml' and ('https://'+OLD in content or 'https://'+NEW+'/' not in content):
             raise RuntimeError('Sitemap has incorrect domain')
            if path=='robots.txt' and ('https://'+NEW+'/sitemap.xml' not in content):
             raise RuntimeError('Robots has incorrect sitemap')
            print('MATCHED',path,flush=True)
            n+=1
          finally:
           try:ftp.quit()
           except Exception:ftp.close()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
           opener.open('https://'+OLD+'/?final_domain_check=1',timeout=12)
           raise RuntimeError('Legacy host did not redirect')
          except urllib.error.HTTPError as exc:
           if exc.code!=301 or exc.headers.get('Location')!='https://'+NEW+'/?final_domain_check=1':
            raise RuntimeError('Legacy redirection failed')
          with urllib.request.urlopen('https://'+NEW+'/?final_domain_check=1',timeout=12) as response:
           if response.status!=200:raise RuntimeError('New host not 200')
           print('NEW_DOMAIN_HTTP_200',flush=True)
          print('FINAL_VERIFICATION_OK',n,'matched public assets; old host HTTP 301; new host HTTP 200',flush=True)
          PY
