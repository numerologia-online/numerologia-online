name: Publish Family 22-energy concise KB - owner-only guarded
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-knowledge-publish-20261124.yml
      - .github/scripts/numi_family_knowledge_publish_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify 22-energy KB and publish only owner Family API and private KB
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_knowledge_publish_20261124.py
