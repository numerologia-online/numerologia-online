name: Publish scoped Red Flags and Infidelity question facets
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_flags_infidelity_question_facets_20261125.py'
      - '.github/workflows/numi-flags-infidelity-question-facets-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate 440 keys and unchanged prompts; publish only owner preview data
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_flags_infidelity_question_facets_20261125.py
