name: Publish reviewed Intimacy distinct keys to REG.RU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-intimacy-distinct-review-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish reviewed distinct Intimacy keys with protected author rows'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and publish the approved knowledge file
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import ssl
          import subprocess
          import urllib.error
          import urllib.request

          PRIVATE = Path("account-service/private")
          KNOWLEDGE = PRIVATE / "intimacy-practical-knowledge.txt"
          ENGINE = PRIVATE / "intimacy-practical-engine.php"
          QUESTION_INDEX = PRIVATE / "intimacy-live-questions.json"
          OLD_COMMIT = "662fc3c209af274b09e3f92d8959640c3b7b7b88"
          SITE = "https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/"
          PREVIEW_PATH = "redflag-ai-lab/intimacy-practical-preview-api.php"
          PROTECTED = {4, 9, 15}


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def validate_knowledge(current, previous, question_ids):
              text = current.decode("utf-8")
              rows = [row.split("|") for row in text.splitlines()]
              old_rows = [row.split("|") for row in previous.decode("utf-8").splitlines()]
              require(len(text) <= 16000, "Knowledge file exceeds character limit")
              require(len(question_ids) == 10 and rows[0] == ["energy", *question_ids], "Question columns differ")
              require([row[0] for row in rows[1:]] == [str(n) for n in range(1, 23)], "Energy rows differ")
              require(all(len(row) == 11 for row in rows), "Each energy needs ten keys")
              keys = [key for row in rows[1:] for key in row[1:]]
              require(len(set(keys)) == len(keys) == 220, "Expected 220 unique keys")
              require(all(0 < len(key) <= 160 and key == key.strip() for key in keys), "Invalid key length or spacing")
              for n in range(1, 23):
                  changes = sum(a != b for a, b in zip(old_rows[n], rows[n], strict=True))
                  require((changes == 0 if n in PROTECTED else changes > 0), f"Unexpected key changes for energy {n}")
              print(f"Checked 19 revised rows and 3 unchanged author rows, 220 unique keys, {len(text)} characters", flush=True)


          def check_engine_without_generation():
              php = r"""<?php
              require 'account-service/private/intimacy-practical-engine.php';
              $knowledge = ipKnowledge();
              $questions = ipQuestions();
              foreach ($questions as $question) {
                  foreach ([[1, 1, 1986], [4, 4, 1986], [9, 9, 1986], [15, 7, 1988], [22, 2, 1990], [29, 2, 2000]] as [$day, $month, $year]) {
                      $id = $question['id'];
                      $matrix = ni31($day, $month, $year);
                      $messages = ipMessages($question, $day, $month, $year);
                      $input = json_decode($messages[1]['content'], true, 30, JSON_THROW_ON_ERROR);
                      foreach (ipPointMap($id) as $index => $point) {
                          if ($input['четыре_значимые_позиции'][$index]['смысловой_ключ'] !== $knowledge[$matrix[$point]][$id]) {
                              throw new RuntimeException("Wrong knowledge key for " . $id);
                          }
                      }
                  }
              }
              echo "Knowledge and question routing verified with zero model calls\n";
              """
              subprocess.run(["php"], input=php.encode(), check=True)


          def check_site():
              for url, expected in ((SITE, 200), (SITE + PREVIEW_PATH, 403)):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          status = response.status
                  except urllib.error.HTTPError as response:
                      status = response.code
                  require(status == expected, f"Unexpected HTTP status {status}, expected {expected}")


          def download(ftp, path):
              contents = io.BytesIO()
              ftp.retrbinary(f"RETR {path}", contents.write)
              return contents.getvalue()


          def upload(ftp, path, contents):
              ftp.storbinary(f"STOR {path}", io.BytesIO(contents))
              require(download(ftp, path) == contents, "Uploaded bytes did not match")


          def replace(ftp, path, previous, contents, tag):
              stage = f"{path}.stage-{tag}"
              try:
                  upload(ftp, stage, contents)
                  require(download(ftp, path) == previous, "Server file changed during staging")
                  ftp.rename(stage, path)
              except BaseException:
                  try:
                      ftp.delete(stage)
                  except ftplib.all_errors:
                      pass
                  raise


          def publish(current, previous, engine, question_ids):
              tag = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              check_site()
              with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45) as ftp:
                  ftp.connect("server172.hosting.reg.ru", 21)
                  ftp.login(os.environ["REG_FTP_USER"], os.environ["REG_FTP_PASSWORD"])
                  ftp.prot_p()
                  home = ftp.pwd().rstrip("/")
                  private = f"{home}/private/numi-account-20261031"
                  target = f"{private}/{KNOWLEDGE.name}"
                  engine_path = f"{private}/{ENGINE.name}"
                  deployed_questions = json.loads(download(ftp, f"{private}/{QUESTION_INDEX.name}"))
                  require([q["id"] for q in deployed_questions["questions"]] == question_ids, "Server question routing differs")
                  require(download(ftp, engine_path) == engine, "Server engine differs from the approved engine")
                  installed = download(ftp, target)
                  require(installed in (previous, current), "Server knowledge file differs from the approved previous version")
                  if installed != current:
                      backups = f"{home}/site-safeguard-backups"
                      try:
                          ftp.mkd(backups)
                      except ftplib.error_perm as error:
                          if not str(error).startswith("550"):
                              raise
                      upload(ftp, f"{backups}/before-intimacy-distinct-review-{tag}.bak", installed)
                      print("Previous server version backed up and verified", flush=True)
                      replace(ftp, target, installed, current, tag)
                  try:
                      require(download(ftp, target) == current, "Server verification did not match approved bytes")
                      require(download(ftp, engine_path) == engine, "Server engine changed during publication")
                      check_site()
                  except BaseException:
                      if installed != current and download(ftp, target) == current:
                          replace(ftp, target, current, installed, f"{tag}-rollback")
                          require(download(ftp, target) == installed, "Server rollback verification failed")
                          print("Previous server version restored", flush=True)
                      raise
              print(f"REG.RU verified SHA-256 {hashlib.sha256(current).hexdigest()}; site HTTP 200; owner access enforced; model calls 0", flush=True)


          def main():
              current = KNOWLEDGE.read_bytes()
              previous = subprocess.check_output(["git", "show", f"{OLD_COMMIT}:{KNOWLEDGE}"])
              engine = ENGINE.read_bytes()
              require(engine == subprocess.check_output(["git", "show", f"{OLD_COMMIT}:{ENGINE}"]), "Approved engine differs")
              question_ids = [q["id"] for q in json.loads(QUESTION_INDEX.read_text(encoding="utf-8"))["questions"]]
              validate_knowledge(current, previous, question_ids)
              check_engine_without_generation()
              publish(current, previous, engine, question_ids)


          if __name__ == "__main__":
              main()
          PY
