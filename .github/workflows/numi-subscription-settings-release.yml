name: Move My Club subscription management into My Data
on:
  push:
    paths:
      - .github/workflows/numi-subscription-settings-release.yml
permissions:
  contents: read
concurrency:
  group: numi-subscription-settings-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish subscription management in My Data on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate guarded publishing script
        run: python3 -m py_compile account-service/deploy-subscription-settings.py
      - name: Publish only account page HTML with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-subscription-settings.py
