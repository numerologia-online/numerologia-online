name: Publish saved-item privacy controls to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-saved-privacy-release.yml
permissions:
  contents: read
concurrency:
  group: numi-saved-privacy-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish safe saved-item deletion on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JS, PHP and publish script
        run: |
          node --check account-browser.js
          php -l account-service/private/core.php
          python3 -m py_compile account-service/deploy-saved-privacy.py
      - name: Publish isolated account changes with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-saved-privacy.py
