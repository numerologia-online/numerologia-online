name: Read-only compare deployed Family owner API with GitHub versions
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-owner-current-file-readonly-20261124.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare live byte hash with known commits (read only)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,io,os,hashlib,subprocess,pathlib
          path='redflag-ai-lab/family-owner-preview-api.php'
          host='server172.hosting.reg.ru'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect(host,21);ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          remote=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'+path
          b=io.BytesIO()
          ftp.retrbinary('RETR '+remote,b.write);current=b.getvalue()
          ftp.quit()
          print('REMOTE_HASH',hashlib.sha256(current).hexdigest(),'BYTES',len(current),flush=True)
          for ref in ['3ba866cfba97c10b3499bcaa71b52dd020f91b07','c3b5a3227dbd1985b39674a562dc31c9e5fc5f3b','6929cf801bc46e84d2fb8389c4ee84e024fd566e','76de7855473b11e6eb51fd55d2ea64a274ef7e24','3880ba51c0adbb5030fb6ceac243389370b363b9','99cacb0bd315812af663ce5145ad10e391582892','c2ff79814452baac4e01de81a9a91406e1ce4f5f','main']:
              expected=subprocess.check_output(['git','show',ref+':'+path])
              print('CANDIDATE',ref[:12],'matches',current==expected,'hash',hashlib.sha256(expected).hexdigest()[:16],flush=True)
          PY
