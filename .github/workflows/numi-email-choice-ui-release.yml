name: Publish clear email account linking choices on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-email-choice-ui-release.yml
permissions:
  contents: read
concurrency:
  group: numi-email-choice-ui-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish clear email linking choices on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed frontend and release script
        run: |
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-email-choice-ui.py
      - name: Publish only UI with full backup and rollback protection
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-email-choice-ui.py
