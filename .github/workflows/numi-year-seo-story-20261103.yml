name: Publish approved year article to REG.RU safely
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-year-seo-story-20261103.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Back up live article, preserve shell, publish approved body and verify
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,pathlib,re,hashlib,time,urllib.request,json
          PATH='guide/razbor-goda/index.html'
          DOMAIN='xn--c1adkkdfjbp1a4l.online'
          src=pathlib.Path(PATH).read_bytes()
          def sha(x):return hashlib.sha256(x).hexdigest()
          def required_one(pattern,data,label):
              matches=list(re.finditer(pattern,data,re.DOTALL))
              if len(matches)!=1:raise RuntimeError('UNEXPECTED '+label+' count='+str(len(matches))+'; no publication')
              return matches[0]
          desired_story=required_one(rb'<div class="hero">.*?</article>',src,'approved story').group()
          style=required_one(rb'<style id="year-seo-cta-20261103">.*?</style>',src,'CTA style').group()
          if (desired_story.count(b'class="year-cta"')!=3
              or desired_story.count(b'href="/year/"')!=3
              or b'2006' not in desired_story
              or 'Навигатор на всю жизнь'.encode() not in desired_story):
              raise RuntimeError('Approved story/CTA requirements missing')
          meta_patterns=[
              (rb'<title>[^<]*</title>', 'title'),
              (rb'<meta name="description" content="[^"]*">','description'),
              (rb'<meta property="og:title" content="[^"]*">','og:title'),
              (rb'<meta property="og:description" content="[^"]*">','og:description'),
          ]
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          base=home+'/www/'+DOMAIN
          target=base+'/'+PATH
          def read(path):
              out=io.BytesIO()
              def append(b):
                  if out.tell()+len(b)>2500000:raise RuntimeError('Oversized remote file')
                  out.write(b)
              ftp.retrbinary('RETR '+path,append)
              return out.getvalue()
          def write(path,content):
              ftp.storbinary('STOR '+path,io.BytesIO(content))
              if read(path)!=content:raise RuntimeError('FTP readback failed')
          written=False
          original=None
          try:
              if not read(base+'/index.html').lower().startswith(b'<!doctype html'):
                  raise RuntimeError('Unexpected REG.RU site root')
              original=read(target)
              old_story=required_one(rb'<div class="hero">.*?</article>',original,'live story')
              # Never replace unexpected article or an unrelated custom landing page.
              if b'razbor-goda' not in original or 'Разбор'.encode() not in original:
                  raise RuntimeError('Unexpected live year article; no publication')
              if b'year-seo-cta-20261103' in original and original!=src:
                  raise RuntimeError('Another revised year story is live; no overwrite')
              updated=original[:old_story.start()]+desired_story+original[old_story.end():]
              for pattern,label in meta_patterns:
                  current=required_one(pattern,updated,'live '+label)
                  replacement=required_one(pattern,src,'approved '+label).group()
                  updated=updated[:current.start()]+replacement+updated[current.end():]
              if b'year-seo-cta-20261103' not in updated:
                  end=required_one(rb'</head>',updated,'head')
                  updated=updated[:end.start()]+style+b'\n'+updated[end.start():]
              updated=updated.replace('Разбор года по месяцам | Нумерология Онлайн'.encode(),
                                     'Разбор года по дате рождения | Нумерология онлайн'.encode())
              updated=updated.replace(b'"Разбор года по месяцам"',
                                     '"Разбор года по дате рождения"'.encode())
              if (updated.count(b'class="year-cta"')!=3 or
                  updated.count(b'href="/year/"')!=3 or
                  updated.count('<h1>Разбор года по дате рождения</h1>'.encode())!=1 or
                  updated.count(b'<link rel="canonical"')!=1):
                  raise RuntimeError('Final page validation failed')
              print('PREFLIGHT SUCCESS: preserving existing shell and unrelated links',flush=True)
              if updated!=original:
                  backup_root=home+'/site-safeguard-backups'
                  try:ftp.mkd(backup_root)
                  except ftplib.error_perm:ftp.cwd(backup_root)
                  folder=backup_root+'/seo-year-approved-'+str(int(time.time()))
                  ftp.mkd(folder)
                  write(folder+'/razbor-goda-index.html.bak',original)
                  print('BACKUP SAVED outside public www; sha256='+sha(original),flush=True)
                  if read(target)!=original:raise RuntimeError('Concurrent update, no writes')
                  written=True
                  write(target,updated)
                  print('PUBLISHED ONLY '+PATH,flush=True)
              url='https://'+DOMAIN+'/guide/razbor-goda/?publication_check='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as res:
                  public=res.read(2500001)
                  if res.status!=200 or 'noindex' in res.headers.get('X-Robots-Tag','').lower():
                      raise RuntimeError('Search-friendly HTTP check failed')
              if public!=updated:raise RuntimeError('Public site response differs from FTP content')
              print('YEAR SEO LIVE SUCCESS: HTTP 200, body, metadata, 3 buttons verified, no other pages modified',flush=True)
          except BaseException:
              if written and original is not None:
                  try:
                      write(target,original)
                      print('ROLLED BACK TO ORIGINAL',flush=True)
                  except Exception as e:print('ROLLBACK FAILED',str(e)[:250],flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
