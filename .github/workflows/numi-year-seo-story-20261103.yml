name: Publish year SEO story with 3 CTAs to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-year-seo-story-20261103.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Guard, back up, publish, and verify only year article on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,pathlib,hashlib,time,urllib.request
          path='guide/razbor-goda/index.html'
          old_blob_sha='24d997a8466a5caae5905829f14910a5790035b2'
          content=pathlib.Path(path).read_bytes()
          def gitsha(b):
           return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\x00'+b).hexdigest()
          # Ensure only expected publication content is released
          if content.count(b'class="year-cta"') != 3 or content.count(b'href="/year/"') != 3:
           raise RuntimeError('SEO CTAs do not match reviewed article')
          if 'Навигатор на всю жизнь'.encode() not in content:raise RuntimeError('Missing article subtitle')
          if not content.count(b'year-seo-cta-20261103'):raise RuntimeError('Missing dedicated button styling')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online'
          def read(p):
           b=io.BytesIO();ftp.retrbinary('RETR '+p,b.write)
           if b.tell()>2000000:raise RuntimeError('Unexpected oversized file')
           return b.getvalue()
          def put(p,b):
           ftp.storbinary('STOR '+p,io.BytesIO(b))
           if read(p)!=b:raise RuntimeError('FTPS verification mismatch')
          target=root+'/'+path
          changed=False
          try:
           if read(root+'/index.html')[:20].lower().find(b'<!doctype html')<0:
            raise RuntimeError('Unexpected website root')
           original=read(target)
           if original==content:print('Article already published on REG.RU',flush=True)
           elif gitsha(original)!=old_blob_sha:
            raise RuntimeError('Live article differs from reviewed source. No changes made. Blob '+gitsha(original))
           else:
            backup=home+'/site-safeguard-backups'
            folder=backup+'/year-seo-story-'+str(int(time.time()))
            ftp.mkd(folder)
            put(folder+'/razbor-goda-index.html.bak',original)
            print('ORIGINAL BACKED UP OUTSIDE WWW',flush=True)
            if read(target)!=original:raise RuntimeError('Concurrent edit detected before release')
            try:
             changed=True
             put(target,content)
             print('ONE FILE PUBLISHED: '+path,flush=True)
            except BaseException:
             if changed:
              put(target,original)
              print('ROLLBACK COMPLETE',flush=True)
             raise
           url='https://xn--c1adkkdfjbp1a4l.online/guide/razbor-goda/?year_seo_check='+str(time.time_ns())
           req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
           with urllib.request.urlopen(req,timeout=35) as resp:
            public=resp.read(2000000)
            if resp.status!=200 or 'noindex' in resp.headers.get('X-Robots-Tag','').lower():
             raise RuntimeError('Public HTTP status or indexability check failed')
           if public!=content:raise RuntimeError('Published HTTP content differs from source')
           print('YEAR SEO STORY LIVE SUCCESS: all 3 CTAs, HTTP 200, content verified',flush=True)
          except BaseException:
           if changed:
            try:
             put(target,original)
             print('ROLLBACK VERIFIED after failed HTTP check',flush=True)
            except Exception as e:print('ROLLBACK FAILED',str(e)[:120],flush=True)
           raise
          finally:
           try:ftp.quit()
           except BaseException:ftp.close()
          PY
