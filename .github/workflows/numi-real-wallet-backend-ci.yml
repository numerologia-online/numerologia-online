name: VERIFY isolated real-wallet backend (NO deployment)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/numi-real-wallet-backend-ci.yml'
      - 'account-service/private/wallet-real.php'
      - 'account-service/private/wallet-real-worker.php'
      - 'account-service/private/wallet-real-payment.php'
      - 'account-service/tests/real-wallet-payment.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NUMI_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=numi_test;charset=utf8mb4"
      NUMI_TEST_MYSQL_USER: root
      NUMI_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Lint live wallet, fiscal worker and migration sources
        run: |
          set -euo pipefail
          for file in account-service/private/{wallet-real,wallet-real-worker,wallet-real-payment,wallet,core,store}.php account-service/tests/{real-wallet,real-wallet-payment}.php; do
            php -l "$file"
          done
          grep -q 'numi_real_wallet_receipt_allocations' account-service/private/wallet-real.php
          grep -q 'naRealWalletAllocateReceiptSources' account-service/private/wallet-real.php
          grep -q 'naRealWorkerReceiptSource' account-service/private/wallet-real-worker.php
          echo REAL_WALLET_MULTI_ADVANCE_STATIC_PASS
      - name: Test REAL and TEST account ledgers on independent MySQL schemas
        run: |
          set -euo pipefail
          php account-service/tests/real-wallet.php
      - name: Existing catalog and subscriptions remain valid
        run: |
          set -euo pipefail
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
