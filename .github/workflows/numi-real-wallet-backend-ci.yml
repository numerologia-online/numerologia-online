name: VERIFY isolated real-wallet backend (NO deployment)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/numi-real-wallet-backend-ci.yml'
      - 'account-service/private/wallet-real.php'
      - 'account-service/private/wallet-real-worker.php'
      - 'account-service/private/wallet-real-payment.php'
      - 'account-service/tests/real-wallet-payment.php'
      - 'account-service/private/store.php'
      - 'account-service/public/numi-real-worker.php'
      - 'year-feature.js'
      - 'compatibility-feature.js'
      - 'pro/pro.js'
      - 'child/child.js'
      - 'store-entry.js'
      - 'shared-offer.js'
      - 'app.js'
      - 'wallet-client.js'
      - 'redflag-feature.js'
      - 'account-service/private/fulfillment.php'
      - 'account-service/tests/store.php'
      - 'account-service/tests/real-wallet.php'
      - 'account-service/private/core.php'
      - 'account-service/private/redflag-catalog.json'
      - 'account-service/private/store-assets.json'
      - 'scripts/build-store-assets.py'
      - 'scripts/build-store-catalog.py'
      - 'scripts/deploy-redflag-unified-catalog-20261109.py'
      - 'tests/redflag-calendar-coverage.test.mjs'
      - 'redflag-public-catalog.js'
      - 'redflag-text-bank.js'
      - 'data/redflag/banks/**'
      - 'data/redflag/money/**'
      - 'data/redflag/love/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NUMI_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=numi_test;charset=utf8mb4"
      NUMI_TEST_MYSQL_USER: root
      NUMI_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Lint live wallet, fiscal worker and migration sources
        run: |
          set -euo pipefail
          for file in account-service/private/{wallet-real,wallet-real-worker,wallet-real-payment,wallet,core,store}.php account-service/tests/{real-wallet,real-wallet-payment}.php; do
            php -l "$file"
          done
          grep -q 'numi_real_wallet_receipt_allocations' account-service/private/wallet-real.php
          grep -q 'naRealWalletAllocateReceiptSources' account-service/private/wallet-real.php
          grep -q 'naRealWorkerReceiptSource' account-service/private/wallet-real-worker.php
          echo REAL_WALLET_MULTI_ADVANCE_STATIC_PASS
          php -l account-service/public/numi-real-worker.php
          php -l account-service/private/fulfillment.php
          python3 -m py_compile scripts/build-store-catalog.py scripts/deploy-redflag-unified-catalog-20261109.py
          grep -Fq "modify('+1 year')" account-service/private/store.php
          grep -Fq "INTERVAL 1 YEAR" account-service/public/numi-real-worker.php
          for file in year-feature.js compatibility-feature.js pro/pro.js child/child.js store-entry.js shared-offer.js app.js wallet-client.js redflag-feature.js; do node --check "$file"; done
          grep -Fq "naRedFlagPaidStatus" account-service/private/fulfillment.php
          grep -Fq "Недостаточно средств на балансе. Для ответа нужно " wallet-client.js
          grep -Fq "redflag-question-stable-20261109" redflag-feature.js
          grep -Fq "app.js?v=redflag-catalog-refresh-20261109b" index.html
          grep -Fq "naRedFlagCatalog()" account-service/private/core.php
          grep -Fq "FULFILLMENT_NOT_CONNECTED" account-service/private/store.php
          grep -Fq "recognizePurchasedReport" store-entry.js
          grep -Fq "recognizePurchasedReport" year-feature.js
          grep -Fq "recognizePurchasedReport" pro/pro.js
          grep -Fq "recognizePurchasedReport" compatibility-feature.js
          grep -Fq "recognizePurchasedReport" child/child.js
          echo REAL_WALLET_ANNUAL_REPORT_STATIC_PASS
      - name: Test REAL and TEST account ledgers on independent MySQL schemas
        run: |
          set -euo pipefail
          php account-service/tests/real-wallet.php
      - name: Verify generated Red Flag catalog matches the one editorial source
        run: |
          set -euo pipefail
          python3 scripts/build-store-catalog.py
          python3 scripts/build-store-assets.py
          git diff --exit-code -- account-service/private/redflag-catalog.json redflag-public-catalog.js store-catalog.json account-service/private/store-assets.json
          node --test tests/redflag-calendar-coverage.test.mjs
      - name: Existing catalog and subscriptions remain valid
        run: |
          set -euo pipefail
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php

  publish-reviewed-redflag:
    # Exact release-message gate and required passing wallet regressions.
    needs: real-wallet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release guarded unified Red Flag catalog to REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: reg-ru-manual-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only reviewed single-source content and no leaked answers
        run: |
          set -euo pipefail
          python3 scripts/build-store-catalog.py
          python3 scripts/build-store-assets.py
          git diff --exit-code -- redflag-public-catalog.js account-service/private/redflag-catalog.json store-catalog.json account-service/private/store-assets.json
          php -l account-service/private/core.php
          php -l account-service/private/store.php
          node --check redflag-public-catalog.js
          node --check redflag-text-bank.js
          node --check redflag-categories.js
          node --check redflag-text-bank.js
          node --check redflag-feature.js
          node --check app.js
          python3 -m py_compile scripts/deploy-redflag-unified-catalog-20261109.py
      - name: Guarded REG.RU publication of Red Flag only, with rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/deploy-redflag-unified-catalog-20261109.py

# Approved Red Flag release: verified catalog 81 entries, 8 free; no payment engine changes.
# Approved 366-day content repair: statuses derive solely from the protected answer bank; three vault files and hashes deploy together.
# Release correction: prevent duplicate redflag-text-bank.js causing self-induced CONCURRENT_REMOTE_EDIT.
