name: REG.RU quarantine staging files after access-control audit

on:
  push:
    paths:
      - .github/workflows/reg-ru-quarantine-unsafe-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Move isolated test folder OUTSIDE public web root
        env:
          FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASS: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, os, re, socket, ssl, time, urllib.error, urllib.request
          STAGING="vesta-blinchik-numi-c313e2f44ae802e16599"
          DOMAIN="xn--c1adkkdfjbp1a4l.online"
          host=os.environ.get("FTP_HOST","").strip()
          user=os.environ.get("FTP_USER","").strip()
          password=os.environ.get("FTP_PASS","")
          if not all([host,user,password]): raise SystemExit("Missing FTP credentials")
          socket.inet_aton(host)
          hostname=socket.gethostbyaddr(host)[0].rstrip(".").lower()
          if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru",hostname):
              raise SystemExit("Unverified server")
          if host not in {x[4][0] for x in socket.getaddrinfo(hostname,21,type=socket.SOCK_STREAM)}:
              raise SystemExit("Server IP mismatch")
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          try:
              ftp.connect(hostname,21)
              ftp.auth()
              ftp.login(user,password)
              ftp.prot_p()
              ftp.set_pasv(True)
              home=ftp.pwd()
              live="www/"+DOMAIN
              ftp.cwd(live)
              if "index.html" not in [x.rsplit("/",1)[-1] for x in ftp.nlst()]:
                  raise RuntimeError("Production site folder check failed; no mutation")
              site_root=ftp.pwd()
              try:
                  ftp.cwd(STAGING)
              except ftplib.error_perm:
                  print("Preview folder already absent from public site")
              else:
                  files=[x.rsplit("/",1)[-1] for x in ftp.nlst()]
                  if "index.html" not in files or ".htaccess" not in files:
                      raise RuntimeError("Preview marker check failed; refusing to move folder")
                  ftp.cwd(home)
                  try:
                      ftp.mkd("site-safeguard-backups")
                  except ftplib.error_perm:
                      pass
                  stamp=time.strftime("%Y%m%dT%H%M%SZ",time.gmtime())
                  src=site_root.rstrip("/")+"/"+STAGING
                  dst=home.rstrip("/")+"/site-safeguard-backups/unsafe-stage-"+stamp
                  print("QUARANTINE: moving isolated staging folder outside public website",flush=True)
                  ftp.rename(src,dst)
                  print("QUARANTINE: folder moved outside public website",flush=True)

              ftp.cwd(site_root)
              visible=[x.rsplit("/",1)[-1] for x in ftp.nlst()]
              if STAGING in visible:
                  raise RuntimeError("UNSAFE: preview directory still public")
              if "index.html" not in visible:
                  raise RuntimeError("Production index unexpectedly missing")
              print("VERIFIED: preview directory absent; production index intact")
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          for relative in ("","index.html","styles.css","data/"):
              url="https://"+DOMAIN+"/"+STAGING+"/"+relative
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      print("PUBLIC URL CHECK:",relative or "home","status",r.status,flush=True)
              except urllib.error.HTTPError as e:
                  print("PUBLIC URL CHECK:",relative or "home","status",e.code,flush=True)
              except Exception as e:
                  print("PUBLIC URL CHECK:",relative or "home",type(e).__name__,flush=True)
          PY
