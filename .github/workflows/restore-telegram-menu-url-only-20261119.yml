name: Restore Telegram Mini App menu URL only (ASCII, no query)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-telegram-menu-url-only-20261119.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Set original Telegram button URL and verify after propagation
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,io,re,json,urllib.request,urllib.parse,time
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          b=io.BytesIO()
          ftp.retrbinary('RETR '+home+'/private/bot-config.php',b.write)
          ftp.quit()
          tokens=set(re.findall(rb'[0-9]{6,15}:[A-Za-z0-9_-]{30,60}',b.getvalue()))
          if len(tokens)!=1:raise RuntimeError('AMBIGUOUS_PRIVATE_BOT_TOKEN')
          token=next(iter(tokens)).decode()
          def api(method,payload=None):
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8') if payload is not None else None,
                  headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=18) as r: response=json.load(r)
              if response.get('ok') is not True:raise RuntimeError('BOT_API_FAILED_'+method)
              return response['result']
          correct='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          expected_host='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          current=api('getChatMenuButton')
          if current.get('type')!='web_app' or current.get('text')!='Жми сюда 🫶':
              raise RuntimeError('UNEXPECTED_BOT_MENU_REFUSE_CHANGE')
          url=current.get('web_app',{}).get('url','')
          parts=urllib.parse.urlsplit(url)
          if parts.hostname not in (expected_host,'нумерология-онлайн.рф'):
              raise RuntimeError('UNEXPECTED_CURRENT_MENU_DOMAIN')
          if parts.path not in ('','/') or parts.fragment:
              raise RuntimeError('UNEXPECTED_CURRENT_MENU_PATH')
          if parts.query not in ('','v=recovery-20261119-v1'):
              raise RuntimeError('UNEXPECTED_CURRENT_MENU_QUERY')
          if parts.query:
              api('setChatMenuButton',{'menu_button':{'type':'web_app','text':current['text'],'web_app':{'url':correct}}})
          for attempt in range(5):
              menu=api('getChatMenuButton')
              target=urllib.parse.urlsplit(menu.get('web_app',{}).get('url',''))
              ok=menu.get('type')=='web_app' and target.hostname in (expected_host,'нумерология-онлайн.рф') and target.path in ('','/') and not target.query and not target.fragment
              if ok:
                  print('TELEGRAM_MENU_BASE_URL_VERIFIED_NO_QUERY',flush=True)
                  print('NO_SITE_DB_PAYMENTS_CRON_CHANGES',flush=True)
                  break
              print('MENU_PROPAGATION_PENDING',attempt,flush=True)
              time.sleep(4)
          else:
              raise RuntimeError('MENU_CHANGED_BUT_NOT_VISIBLE')
          PY
