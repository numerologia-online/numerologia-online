name: Red Flag first question batch pilot via existing protected Worker
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-care-or-control-batch-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: redflag-first-question-ai-draft-pilot
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify scope and generator
        run: |
          node --check scripts/redflag-generate-one-bank.mjs
          SELFTEST=1 BATCH_LIMIT=1 node scripts/redflag-generate-one-bank.mjs
      - name: Mark local preflight success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-batch-preflight" -f description="Generator syntax, question, published followups and worker prompt validated" >/dev/null
      - name: Install Wrangler for temporary hashed AI batch authorization
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Activate one-use hashed batch proof (not customer auth)
        id: ephemeral
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de77758c4b3efd26fef26ab600cb02a2
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          DIGEST="$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$DIGEST"
          printf '%s' "$DIGEST" | npx wrangler secret put REDFLAG_BATCH_KEY_SHA256 --name numerologia-300-ai --cwd cloudflare/moment-300-ai
          echo "REDFLAG_BATCH_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Verify temporary batch proof is private
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json
          url="https://numerologia-300-ai.tankraft431.workers.dev/v1/redflag-batch-run"
          body=json.dumps({"messages":[{"role":"system","content":"Respond only with two words."},
            {"role":"user","content":"Скажи: проба успешна"}],"temperature":0.1,"max_completion_tokens":80}).encode()
          def post(headers):
              req=urllib.request.Request(url,body,method="POST",headers={"Content-Type":"application/json",**headers})
              try:
                  with urllib.request.urlopen(req,timeout=70) as response:return response.status,json.load(response)
              except urllib.error.HTTPError as e:
                  return e.code,{}
          status,_=post({})
          assert status==403,"UNAUTHENTICATED_BATCH_ACCESS"
          status,data=post({"X-Numi-Redflag-Batch":os.environ["REDFLAG_BATCH_KEY"]})
          assert status==200 and data.get("ok") is True and isinstance(data.get("response"),str),"BATCH_AI_PROOF_NOT_READY:"+str(status)
          print("REDFLAG_EPHEMERAL_AI_ACCESS_OK")
          PY
      - name: Generate only unpublished AI drafts with independent AI review
        env:
          BATCH_LIMIT: "1"
        run: node scripts/redflag-generate-one-bank.mjs
      - name: Store draft privately as an Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redflag-care-or-control-pilot
          path: redflag-batch-output/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary batch proof from live AI service
        if: always() && steps.ephemeral.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de77758c4b3efd26fef26ab600cb02a2
        run: |
          npx wrangler secret delete REDFLAG_BATCH_KEY_SHA256 --name numerologia-300-ai --cwd cloudflare/moment-300-ai --skip-confirmation
      - name: Mark verified pilot
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-batch-pilot" -f description="One private Red Flag draft generated and passed independent AI/editor checks" >/dev/null
      - name: Distinguish AI API permissions from answer quality
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          p=pathlib.Path('redflag-batch-output/care-or-control-report.json')
          result=json.loads(p.read_text()) if p.exists() else {}
          code=('no-output' if not result else
                'quality-rejected' if result.get('flagged',0)>0 else
                'api-or-permissions')
          env=dict(os.environ)
          subprocess.run(['gh','api','--method','POST',
              'repos/'+env['GITHUB_REPOSITORY']+'/statuses/'+env['GITHUB_SHA'],
              '-f','state=failure','-f','context=numi/redflag-batch-'+code,
              '-f','description=Pilot diagnostic: '+code],check=True)
          PY
      - name: Flag failed pilot
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-batch-pilot" -f description="Cloudflare AI private draft pilot failed; no production content changed" >/dev/null
