name: Read-only Telegram guest launch diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-telegram-guest-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-network:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare anonymous entry routes and startup assets
        run: |
          python3 -u - <<'PY'
          import subprocess,concurrent.futures
          hosts=['xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','xn--c1adkkdfjbp1a4l.online']
          paths=['/','/index.html','/assets/telegram-web-app-20261102.js','/auth-profile.js','/account-browser.js','/app.js','/moment/','/moment/yes-no/','/api/numi-yesno-answer.php?status=1']
          def check(item):
              host,path=item
              p=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','7','--max-time','18','-o','/dev/null','-w','http=%{http_code} redirects=%{num_redirects} bytes=%{size_download} time=%{time_total} final=%{url_effective}', '-A','Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Telegram','https://'+host+path],capture_output=True,text=True)
              return (host,path,p.returncode,p.stdout,p.stderr[:180])
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for row in pool.map(check,[(h,p) for h in hosts for p in paths]):print('PUBLIC',*row,flush=True)
          PY
  server-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare deployed homepage and aggregate today access codes, never print personal data
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,re,collections,pathlib,hashlib
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p();f.set_pasv(True)
          home=f.pwd().rstrip('/')
          host='xn--c1adkkdfjbp1a4l.online'
          web=home+'/www/'+host+'/'
          def read(path,limit=25_000_000):
              b=io.BytesIO()
              def add(data):
                  if b.tell()+len(data)>limit:raise RuntimeError('TOO_LARGE')
                  b.write(data)
              f.retrbinary('RETR '+path,add)
              return b.getvalue()
          try:
              for path in ['index.html','auth-profile.js','account-browser.js','app.js','assets/telegram-web-app-20261102.js','.htaccess']:
                  try:
                      v=read(web+path,3_000_000)
                      local=pathlib.Path(path)
                      print('SOURCE',path,'bytes',len(v),'matches_repo',local.is_file() and local.read_bytes()==v,flush=True)
                      if path=='.htaccess':
                          print('RULE_COUNTS',len(re.findall(rb'(?im)^\s*Require\s+all\s+denied',v)),len(re.findall(rb'(?im)^\s*Deny\s+from\s+all',v)),len(re.findall(rb'(?im)^\s*RewriteRule',v)),flush=True)
                  except Exception as e:print('SOURCE_ERROR',path,type(e).__name__,flush=True)
              for name in [host,'xn----8sbhhqijddjgdebdz2c2o.xn--p1ai']:
                  try:
                      rows=read(home+'/logs/'+name+'.access.log').decode('utf-8','replace').splitlines()
                      tally=collections.Counter()
                      for row in rows:
                          if '26/Nov/2026' not in row:continue
                          a=re.search(r'\[26/Nov/2026:(\d\d):\d\d:.*?\]\s+"(GET|POST|HEAD|OPTIONS)\s+([^\s]+)\s+HTTP/[^"]+"\s+(\d{3})',row)
                          if not a:continue
                          hour,method,route,status=a.groups();route=route.split('?')[0]
                          kind='home' if route in ('/','/index.html') else 'startup' if route in ('/app.js','/auth-profile.js','/account-browser.js','/assets/telegram-web-app-20261102.js') else 'login' if route in ('/api/profile.php','/api/numi-miniapp.php','/api/telegram.php') else 'other'
                          if kind!='other':tally[(hour,kind,status)]+=1
                      print('ACCESS_AGGREGATE',name,sorted(tally.items()),flush=True)
                  except Exception as e:print('ACCESS_LOG_ERROR',name,type(e).__name__,flush=True)
          finally:f.quit()
          PY
