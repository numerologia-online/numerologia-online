name: Publish Family owner-only manual preview - guarded REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-owner-preview-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and deploy owner-only nine Family questions, zero AI calls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_owner_preview_publish_20261123.py
