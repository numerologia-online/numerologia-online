name: Publish distinct Intimacy keys and remove one prompt phrase
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_intimacy_distinct_keys_20261125.py'
      - '.github/workflows/numi-intimacy-distinct-keys-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and deploy only Intimacy knowledge and one prompt phrase
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_intimacy_distinct_keys_20261125.py
