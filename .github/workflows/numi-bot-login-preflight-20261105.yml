name: Preflight own-bot login button and live file hashes
on:
  push:
    paths: ['.github/workflows/numi-bot-login-preflight-20261105.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate frontend JavaScript and exact bot link
        run: |
          node --check account-browser.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const account = fs.readFileSync('account-browser.js', 'utf8');
          const home = fs.readFileSync('index.html','utf8');
          assert.match(account, /id="numi-bot-signin"/);
          assert.match(account, /🤖 Войти через наш бот/);
          assert.match(account, /https:\/\/t\.me\/Numerologiaonline_bot\?startapp/);
          assert.match(account, /id="numi-bot-signin"[\s\S]{0,1000}numi-auth-tabs/);
          assert.match(home, /account-browser\.js\?v=20261105botentry1/);
          assert.match(account, /request\("telegram",\{init_data:signedTelegram\(\)\}\)/);
          console.log('BOT_LOGIN_ENTRY_CHECKS_PASSED');
          JS
      - name: Read-only confirm production originals against Git parent
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,subprocess,hashlib,io
          files=['account-browser.js','index.html']
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          try:
            for path in files:
              old=subprocess.check_output(['git','show','0e68f1c3314ea0b059f02c942b6d8cb2b74176dc^:'+path])
              file=io.BytesIO();f.retrbinary('RETR '+root+path,file.write)
              live=file.getvalue()
              oldhash=hashlib.sha256(old).hexdigest()
              livehash=hashlib.sha256(live).hexdigest()
              print('BOT_LOGIN_PREFLIGHT',path,'live',livehash,'expected',oldhash,'equal',livehash==oldhash,flush=True)
              if livehash!=oldhash:raise SystemExit('Live differs from reviewed original. Do not publish.')
          finally:
            f.quit()
          PY
