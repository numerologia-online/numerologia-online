name: Year report free-month & PDF audit
on:
  push:
    paths:
      - 'year-feature.js'
      - 'year-access.js'
      - 'year-paywall.css'
      - 'year/index.html'
      - 'tests/year-access.test.mjs'
      - 'tests/year-paywall-live.mjs'
      - '.github/workflows/year-paywall-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and date boundary tests
        run: |
          node --check year-feature.js
          node --test tests/year-access.test.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test local year report as a guest in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/year-http.log 2>&1 &
          node tests/year-paywall-live.mjs
