name: Verify full REG.RU reference backup
on:
  push:
    paths:
      - .github/workflows/numi-verify-live-reference.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm private full site snapshot exists
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/verify-live-reference-backup.py
      - name: Record non-sensitive verified manifest summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-reference-backup.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified REG.RU reference snapshot"
            git pull --rebase origin main
            git push
          fi
