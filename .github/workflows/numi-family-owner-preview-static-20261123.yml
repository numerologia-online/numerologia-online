name: Family owner preview - static safety checks only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-owner-preview-static-20261123.yml
      - redflag-ai-lab/family-owner-preview-api.php
      - account-service/private/family-household-five-points-pilot.php
      - tests/family-household-five-points-pilot.php
      - redflag-feature.js
      - app.js
      - index.html
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l redflag-ai-lab/family-owner-preview-api.php
          php -l account-service/private/family-household-five-points-pilot.php
          php -l account-service/private/family-live.php
      - name: JavaScript syntax
        run: |
          node --check redflag-feature.js
          node --check app.js
      - name: Five point static tests, no provider requests
        run: php tests/family-household-five-points-pilot.php
      - name: Guard owner only and customers paused
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('redflag-ai-lab/family-owner-preview-api.php').read_text()
          ui=Path('redflag-feature.js').read_text()
          paused=Path('account-service/private/family-live.php').read_text()
          pilot=Path('account-service/private/family-household-five-points-pilot.php').read_text()
          assert "if(!naTestOwner(naCurrent(naDB())))" in p
          assert "'draft_only'=>true,'published'=>false" in p
          assert "'google/gemini-3-flash-preview'" in p
          assert "50/50" not in p+pilot
          assert "family-owner-preview-api.php" in ui
          assert "(section===\"family\"&&!question.isFree)" in ui
          assert "function nfEngineInstalled(): bool {" in paused
          assert "return false;" in paused
          assert "FAMILY_REBUILD_PENDING" in paused
          assert len(re.findall(r"'(?:household|vacation|plans|children|roles|home|conflict|money-at-home|care)'=>\['left','top'",p))==9
          print('FAMILY_OWNER_PREVIEW_STATIC_PASS')
          PY
