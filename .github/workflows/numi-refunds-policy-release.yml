name: Publish refunds policy to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-refunds-policy-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish refunds policy on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated release and approved page
        run: |
          python3 -m py_compile scripts/publish-refunds-policy.py
          test -s refunds.html
          grep -q 'href="/refunds.html"' index.html
      - name: Back up production then publish only refund page and footer
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-refunds-policy.py
