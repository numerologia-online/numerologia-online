name: Check if GitHub diagnostic host supports IPv6 itself
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-ipv6-controls-nochange-20261119.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare IPv6 controls with the site's IPv6 address
        run: |
          for host in ipv6.google.com one.one.one.one xn----8sbhhqijddjgdebdz2c2o.xn--p1ai; do
            echo IPV6_TEST_HOST "$host"
            curl -6 --connect-timeout 4 --max-time 7 -sS -o /dev/null -w 'code=%{http_code} remote=%{remote_ip} ssl=%{ssl_verify_result}\n' "https://$host/" || true
          done
