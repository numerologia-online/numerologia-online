name: Inspect exact live domain script references (read-only)
on:
  push:
    paths:
      - .github/workflows/numi-domain-api-readonly-preflight-20261106.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Print only live reference lines and hashes (no secrets, no changes)
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json
          base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          for path in ('index.html','app.js','auth-profile.js','year-feature.js','personal-day-feature.js'):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=22) as r:
                  blob=r.read(200000)
              source=blob.decode('utf-8')
              if path=='index.html':
                  terms=('auth-profile.js','src="app.js')
              elif path=='app.js':
                  terms=('year-feature.js','personal-day-feature.js')
              else:
                  terms=('PROFILE_URL =','YEAR_CONTENT_API =','DAY_SITE_URL =')
              lines=[line.strip()[:190] for line in source.splitlines() if any(t in line for t in terms)]
              print('LIVE_REFERENCE',json.dumps({'path':path,'sha256':hashlib.sha256(blob).hexdigest(),'matches':lines[:10]},ensure_ascii=False),flush=True)
          PY
