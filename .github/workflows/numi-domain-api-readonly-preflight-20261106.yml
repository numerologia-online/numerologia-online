name: Inspect old and new domain API routes read-only
on:
  push:
    paths:
      - .github/workflows/numi-domain-api-readonly-preflight-20261106.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect API route response codes and public JS without sessions, purchases or writes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,hashlib,json,ssl
          domains={'new':'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','old':'https://xn--c1adkkdfjbp1a4l.online'}
          paths=['/','/api/profile.php','/api/numi-miniapp.php','/api/numi-paid-content.php','/api/numi-year-preview.php','/api/numi-school.php','/api/numi-account.php','/api/telegram-reg-stage-15-10-2026.php','/api/owner-mailing.php','/api/redflag-save.php']
          for label,base in domains.items():
            for path in paths:
              url=base+path
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NumerologiaDomainMigrationPreflight/1'}),timeout=12) as r:
                  print('DOMAIN_ROUTE',json.dumps({'domain':label,'path':path,'status':r.status,'final_host':urllib.parse.urlsplit(r.url).hostname},ensure_ascii=False),flush=True)
              except urllib.error.HTTPError as e:
                print('DOMAIN_ROUTE',json.dumps({'domain':label,'path':path,'status':e.code,'final_host':urllib.parse.urlsplit(e.url).hostname},ensure_ascii=False),flush=True)
              except Exception as e:
                print('DOMAIN_ROUTE',json.dumps({'domain':label,'path':path,'network_error':type(e).__name__},ensure_ascii=False),flush=True)
          for p in ['/year-feature.js','/personal-day-feature.js','/auth-profile.js','/cloudflare/telegram-bot/src/index.js']:
            u=domains['new']+p
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=12) as r:
                data=r.read(200000)
                print('LIVE_JS_READ',json.dumps({'path':p,'status':r.status,'length':len(data),'sha256':hashlib.sha256(data).hexdigest()}),flush=True)
            except urllib.error.HTTPError as e:
              print('LIVE_JS_READ',json.dumps({'path':p,'status':e.code}),flush=True)
            except Exception as e:
              print('LIVE_JS_READ',json.dumps({'path':p,'error':type(e).__name__}),flush=True)
          PY
