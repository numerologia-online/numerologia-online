name: Publish revised public prices to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-revised-prices-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish revised prices on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded price release and source prices
        run: |
          python3 -m py_compile scripts/publish-revised-price-list.py
          test -s prices.html
          grep -q '25 ₽' prices.html
          grep -q '990 ₽' child/index.html
      - name: Patch only reviewed public prices, back up, verify, rollback on error
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-revised-price-list.py
