name: One-time read-only email account production checks
on:
  push:
    paths: ['.github/workflows/numi-account-email-readonly-check-20261105.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed private core and safe email API responses
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,io,hashlib,urllib.request,urllib.error,json
          domain='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          old='xn--c1adkkdfjbp1a4l.online'
          api='https://'+domain+'/api/numi-account.php'
          src=open('account-service/private/core.php','rb').read()
          expected_hash=hashlib.sha256(src).hexdigest()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p()
          root=ftp.pwd().rstrip('/')
          candidates=[root+'/private/numi-account-20261031/core.php',
             root+'/www/'+old+'/private/numi-account-20261031/core.php']
          found=False
          for path in candidates:
            try:
              buffer=io.BytesIO();ftp.retrbinary('RETR '+path,buffer.write)
            except ftplib.error_perm:continue
            production_hash=hashlib.sha256(buffer.getvalue()).hexdigest()
            print('LIVE_PRIVATE_CORE_SHA256',production_hash,'GITHUB_CORE_SHA256',expected_hash,'MATCH',production_hash==expected_hash,flush=True)
            found=True
            break
          if not found:print('LIVE_PRIVATE_CORE_UNAVAILABLE_FOR_READONLY_COMPARE',flush=True)
          ftp.quit()
          def call(action,origin,extra=None):
            data={'action':action}
            if extra:data.update(extra)
            request=urllib.request.Request(api,method='POST',headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'Numi-Email-Auth-ReadOnly-Verification'},data=json.dumps(data).encode('utf8'))
            try:
              with urllib.request.urlopen(request,timeout=15) as response:
                status=response.status;body=response.read(1200);cookies=response.headers.get_all('Set-Cookie',[])
            except urllib.error.HTTPError as e:
              status=e.code;body=e.read(1200);cookies=e.headers.get_all('Set-Cookie',[])
            try:result=json.loads(body)
            except:raise RuntimeError('NonJSON account API response, HTTP '+str(status))
            return status,result,len(cookies)
          for origin in ['https://'+domain,'https://'+old]:
            status,res,cookies=call('health',origin)
            print('ACCOUNT_HEALTH',origin,'status',status,'ok',res.get('ok'),'database',res.get('database'),flush=True)
            if status!=200 or not res.get('ok') or not res.get('database'):raise RuntimeError('Health check failed '+origin)
            status,res,cookies=call('session',origin)
            print('GUEST_SESSION',origin,'status',status,'ok',res.get('ok'),'authenticated',res.get('authenticated'),'set_cookie_headers',cookies,flush=True)
            if status!=200 or not res.get('ok') or res.get('authenticated') is not False:raise RuntimeError('Guest session incorrect')
          status,res,cookies=call('register','https://'+domain,{'email':'invalid','password':'short'})
          print('INVALID_REGISTER','status',status,'error',res.get('error'),flush=True)
          if status!=400 or res.get('error')!='INVALID_EMAIL_OR_PASSWORD':raise RuntimeError('Invalid signup not handled')
          status,res,cookies=call('login','https://'+domain,{'email':'invalid','password':'not-a-real-password'})
          print('INVALID_LOGIN','status',status,'error',res.get('error'),flush=True)
          if status!=400 or res.get('error')!='INVALID_CREDENTIALS':raise RuntimeError('Invalid email login not handled')
          status,res,cookies=call('health','https://not-ours.invalid')
          print('FOREIGN_ORIGIN_DENIAL','status',status,'error',res.get('error'),flush=True)
          if status!=403 or res.get('error')!='ORIGIN_DENIED':raise RuntimeError('Foreign origin was not rejected')
          print('EMAIL_ACCOUNT_PRODUCTION_SAFE_CHECKS_PASSED',flush=True)
          PY
