name: Switch only morning forecast source with verified backup
on:
  push:
    branches: [daily-runtime-independent-20261127]
    paths: ['.github/workflows/switch-independent-daily.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm every forecast and change only origin list in existing private sender
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import pathlib,json,ftplib,ssl,socket,os,re,io,hashlib,urllib.request,concurrent.futures,subprocess
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/daily-runtime-20261127-independent/'
          previous='https://numerologia-online.github.io/numerologia-online/'
          expected={f'data/day/{kind}/{kind}-day-{i:02}.json' for kind in ('general','practical') for i in range(1,23)}
          expected.add('data/day/general/index.json')
          files={p:pathlib.Path(p).read_bytes() for p in sorted(expected)}
          def get(url):
              q=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=20) as r:
                  assert r.status==200 and r.url==url
                  return r.read(1000001)
          def verify(p):
              data=files[p]
              assert get(origin+p)==data,p
              assert get(previous+p)==data,p
              if not p.endswith('index.json'):
                  entries=json.loads(data)['entries']
                  assert isinstance(entries,dict) and len(entries)==31,p
                  for i in range(1,32):
                      e=entries.get(str(i),entries.get(str(int(p[-7:-5]))+'-'+str(i)))
                      assert isinstance(e,dict),p
                      if '/general/' in p:assert isinstance(e.get('text'),str) and e['text'].strip(),p
              return p
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              done=list(pool.map(verify,files))
          print('INDEPENDENT_SOURCE_MATCHES_CURRENT_SOURCE_ALL_FILES',len(done))
          h=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(h)
          ptr=socket.gethostbyaddr(h)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert h in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          def read(p):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+p,b.write)
              return b.getvalue()
          def put(p,data):
              ftp.storbinary('STOR '+p,io.BytesIO(data))
              assert read(p)==data
          def lint(data):
              assert subprocess.run(['php','-l'],input=data,capture_output=True).returncode==0
          try:
              home=ftp.pwd().rstrip('/')
              target=home+'/private/numerologia-daily-08-msk-21-10-2026.php'
              tmp=target+'.source-'+os.environ['GITHUB_RUN_ID']+'.tmp'
              before=read(target)
              assert before.startswith(b'<?php') and b'function forecastBank(' in before and b'EXPECTED_BOT_ID' in before
              old=("$bankOrigins = [\n    '"+previous+"',\n];").encode()
              new=("$bankOrigins = [\n    '"+origin+"',\n    '"+previous+"',\n];").encode()
              assert before.count(old)==1 and new not in before,'LIVE_BASELINE_CHANGED_NO_WRITE'
              after=before.replace(old,new,1)
              assert after.replace(new,old,1)==before
              lint(before);lint(after)
              backupdir=home+'/site-safeguard-backups'
              ftp.cwd(backupdir)
              backup=backupdir+'/daily-origin-before-'+os.environ['GITHUB_RUN_ID']+'.php.bak'
              put(backup,before)
              print('EXACT_PRIVATE_SENDER_BACKUP_VERIFIED')
              replaced=False
              try:
                  assert read(target)==before,'CONCURRENT_EDIT'
                  put(tmp,after)
                  ftp.rename(tmp,target)
                  replaced=True
                  assert read(target)==after
                  # Recheck the new primary after activation; old origin stays as fallback.
                  for p in ('data/day/general/general-day-01.json','data/day/practical/practical-day-01.json'):
                      assert get(origin+p)==files[p]
                  print('LIVE_SENDER_PRIMARY_REGRU_BACKUP_GITHUB_VERIFIED')
                  print('ONLY_ORIGIN_LIST_CHANGED_NO_CRON_SUBSCRIBERS_DATABASE_OR_WEBHOOK_CHANGE')
              except BaseException:
                  if replaced:
                      put(tmp,before)
                      ftp.rename(tmp,target)
                      assert read(target)==before
                      print('ORIGINAL_SENDER_RESTORED_VERIFIED')
                  raise
              finally:
                  try:ftp.delete(tmp)
                  except ftplib.error_perm:pass
          finally:ftp.quit()
          PY
