name: Publish school owner-only access to REG.RU
on:
  push:
    paths:
      - .github/workflows/reg-school-owner-lock-20261128.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-school-owner-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: php tests/school-access.php
      - name: Publish school files and verify production responses
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-school-owner-lock-20261128.py
