name: Publish public price list to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-public-prices-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish-prices:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish public price list on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated publication procedure
        run: |
          python3 -m py_compile scripts/publish-public-prices.py
          test -s prices.html
          grep -q 'NUMI PUBLIC PRICE LIST 2026-11-03' prices.html
          grep -q 'href="/prices.html"' index.html
      - name: Upload only public prices and homepage footer link, with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-public-prices.py
