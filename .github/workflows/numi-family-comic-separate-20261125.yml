name: Activate separate Family comic verdict
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-family-comic-separate-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43e2d568c3182a7f4b64f9957ab79a7168351f52
          fetch-depth: 0
          persist-credentials: false
      - name: Publish preceding Intimacy question first
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_intimacy_comic_separate_20261125.py
      - name: Switch to reviewed Family revision
        run: git checkout --detach 2a5eef28349e3a06d6b896546dace7175c173d32
      - name: Validate isolated Family owner question and publish
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_comic_separate_20261125.py
