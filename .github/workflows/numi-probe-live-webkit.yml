name: Probe live REG.RU on iPhone WebKit
on:
  push:
    paths:
      - .github/workflows/numi-probe-live-webkit.yml
permissions:
  contents: write
concurrency:
  group: reg-ru-webkit-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Test live sections using WebKit mobile
        run: node scripts/probe-live-webkit.cjs
      - name: Save non-sensitive report
        if: always()
        run: |
          if [ ! -f diagnostics/regru-webkit.json ]; then
            mkdir -p diagnostics
            printf '{"kind":"WebKit test did not complete","cases":[]}' > diagnostics/regru-webkit.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-webkit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record REG.RU WebKit browser test"
            git push
          fi
