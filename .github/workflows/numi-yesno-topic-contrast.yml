name: Give topic selection a sage background
on:
  push:
    branches: [fix/yesno-topic-contrast]
    paths: [.github/workflows/numi-yesno-topic-contrast.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish topic contrast with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/topic-contrast/deploy.py
