name: Publish organized saved library on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-saved-library-layout-release.yml
permissions:
  contents: read
concurrency:
  group: numi-saved-library-layout-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release organized saved library on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate guarded saved layout release
        run: |
          python3 -m py_compile account-service/deploy-saved-library-layout.py
          grep -q 'numi-saved-library-structure-20261031' index.html
      - name: Publish only saved-pane HTML with full backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-saved-library-layout.py
