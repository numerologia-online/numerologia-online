name: Publish selected event question date fields to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-owner-ui-cleanup-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely publish only Moment owner editor with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request,urllib.error
          from pathlib import Path
          filename='moment/owner-preview.html'
          wanted=Path(filename).read_bytes()
          assert b'#review-progress{display:none!important}' in wanted
          assert b'<div hidden><label for="category">' in wanted
          assert 'Получить ответ</button>'.encode() in wanted
          assert b'id="event-date-fields"' in wanted
          assert b'id="moment-question-fields"' in wanted
          assert b'function selectedEventMoment()' in wanted
          subprocess.run(['node','--check','/dev/stdin'],input=wanted.split(b'<script>')[-1].split(b'</script>')[0],check=True)
          def digest(value):return hashlib.sha256(value).hexdigest()
          refs=subprocess.check_output(['git','log','--format=%H','-n','60','--',filename],text=True).splitlines()
          trusted={digest(subprocess.check_output(['git','show',ref+':'+filename])) for ref in refs}
          trusted.add(digest(wanted))
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          dest=home+'/www/xn--c1adkkdfjbp1a4l.online/'+filename
          def read():
            b=io.BytesIO();ftp.retrbinary('RETR '+dest,b.write)
            return b.getvalue()
          def write(data):
            ftp.storbinary('STOR '+dest,io.BytesIO(data))
            if digest(read())!=digest(data):raise RuntimeError('FTP_READBACK_FAILED')
          def public():
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+filename+'?owner_ui_version='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiMomentOwnerUiRelease'})
            with urllib.request.urlopen(req,timeout=30) as response:
              return response.read(200000)
          old=read();written=False
          try:
            if digest(old) not in trusted:raise RuntimeError('LIVE_EDITOR_HAS_UNRECOGNIZED_CHANGES_REFUSE_OVERWRITE')
            if digest(old)==digest(wanted):
              print('OWNER_UI_ALREADY_CURRENT',flush=True)
            else:
              backup=home+'/site-safeguard-backups/moment-owner-ui-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
              ftp.storbinary('STOR '+backup,io.BytesIO(old))
              b=io.BytesIO();ftp.retrbinary('RETR '+backup,b.write)
              if b.getvalue()!=old:raise RuntimeError('BACKUP_READBACK_FAILED')
              if read()!=old:raise RuntimeError('CONCURRENT_EDITOR_CHANGE')
              written=True;write(wanted)
            live=public()
            if digest(live)!=digest(wanted):raise RuntimeError('PUBLIC_EDITOR_DIFF')
            print('OWNER_UI_CLEANUP_VERIFIED only_file='+filename+' no_other_sections_touched=true',flush=True)
          except BaseException:
            if written:
              try:write(old);print('OWNER_UI_ROLLBACK_OK',flush=True)
              except BaseException:print('OWNER_UI_ROLLBACK_FAILED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
