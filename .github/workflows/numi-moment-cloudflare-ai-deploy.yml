name: Deploy ONLY numerologia-300-ai Worker with Cloudflare AI binding
on:
  push:
    branches: [main]
    paths:
      - cloudflare/moment-300-ai/src/index.js
      - cloudflare/moment-300-ai/tests/love001-full-birthdate-monthly.mjs
      - cloudflare/moment-300-ai/wrangler.jsonc
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: cloudflare-numerologia-300-ai
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Restrict deployment to separate 300-question service only
        run: |
          node --check cloudflare/moment-300-ai/src/index.js
          node - <<'JS'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('cloudflare/moment-300-ai/wrangler.jsonc','utf8'));
          if(cfg.name!=='numerologia-300-ai'||cfg.main!=='src/index.js'||cfg.ai?.binding!=='AI')throw Error('WRONG_CLOUDFLARE_DEPLOY_TARGET');
          const src=fs.readFileSync('cloudflare/moment-300-ai/src/index.js','utf8');
          if(!src.includes('MOMENT_BRIDGE_SECRET')||!src.includes('env.AI.run('))throw Error('MOMENT_AUTH_OR_AI_MISSING');
          console.log('MOMENT_CLOUDFLARE_TARGET_ISOLATED_OK');
          JS
      - name: Test only first Moment question across full dates and monthly cycles
        run: |
          node --test cloudflare/moment-300-ai/tests/love001-full-birthdate-monthly.mjs
      - name: Confirm test step for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="numi/moment-test" \
            -f description="test completed for one-question release" >/dev/null
      - name: Bind the existing Groq API key to this Worker as an encrypted secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          key=os.environ.get('GROQ_API_KEY','')
          if not key.startswith('gsk_'):raise RuntimeError('GROQ_SECRET_UNAVAILABLE')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token:raise RuntimeError('CLOUDFLARE_SECRET_WRITE_UNAVAILABLE')
          url='https://api.cloudflare.com/client/v4/accounts/de77758c4b3efd26fef26ab600cb02a2/workers/scripts/numerologia-300-ai/secrets'
          blob=json.dumps({'name':'GROQ_API_KEY','text':key,'type':'secret_text'}).encode('utf-8')
          req=urllib.request.Request(url,data=blob,method='PUT',headers={
            'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=35) as response:
              result=json.load(response)
          except Exception as error:
            print('GROQ_SECRET_INSTALL_FAILED',type(error).__name__)
            raise
          if result.get('success') is not True:
            print('GROQ_SECRET_INSTALL_UNCONFIRMED')
            raise RuntimeError('GROQ_SECRET_UNCONFIRMED')
          print('GROQ_SECRET_BOUND_TO_WORKER name_only=GROQ_API_KEY',flush=True)
          PY
      - name: Deploy only target Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: de77758c4b3efd26fef26ab600cb02a2
          workingDirectory: cloudflare/moment-300-ai
          command: deploy
      - name: Confirm upload step for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="numi/moment-upload" \
            -f description="upload completed for one-question release" >/dev/null
      - name: Check live Workers AI binding without using any billable inference
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,time
          url='https://numerologia-300-ai.tankraft431.workers.dev/health'
          result=None
          exception_name='none'
          for attempt in range(6):
            try:
              req=urllib.request.Request(url+'?version=full-birthdate-two-person-monthly-20261117&attempt='+str(attempt),
                headers={'Cache-Control':'no-store','User-Agent':'NumiOneQuestionVerifiedRelease/1.0'})
              with urllib.request.urlopen(req,timeout=16) as r:result=json.load(r)
              if result.get('love001_emotion_version')=='direct-feelings-20261117' and result.get('ai_bound') is True:
                break
            except Exception as ex:
              exception_name=ex.__class__.__name__
              print('MOMENT_HEALTH_TRY',attempt+1,'error_class',exception_name,flush=True)
            if attempt!=5:time.sleep(3)
          reason=None
          if result is None: reason='unreachable'
          elif result.get('ai_bound') is not True: reason='binding'
          elif result.get('service')!='numi-moment-300-owner-preview':reason='service'
          elif result.get('love001_cycle_version')!='full-birthdate-two-person-monthly-20261117':reason='stale'
          elif result.get('love001_emotion_version')!='direct-feelings-20261117':reason='stale-emotions'
          elif result.get('live_answers_enabled') is not False:reason='gate'
          if reason is not None:
            if result is not None:print('MOMENT_HEALTH_STATUS',json.dumps({k:result.get(k) for k in ('service','ai_bound','love001_cycle_version','love001_emotion_version')},ensure_ascii=False),flush=True)
            print('MOMENT_LIVE_VERIFY_FAILED',reason,'exception',exception_name,flush=True)
            endpoint=f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['GH_SHA']}"
            data=json.dumps({'state':'failure','context':'numi/moment-health-'+reason,
              'description':'Live health verification failed: '+reason}).encode()
            req=urllib.request.Request(endpoint,data=data,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=12) as res:pass
            except Exception as ex:print('MOMENT_HEALTH_DIAG_REPORT_ERROR',ex.__class__.__name__)
            raise RuntimeError('CLOUDFLARE_LIVE_CHECK_'+reason.upper())
          print('MOMENT_LOVE001_LIVE_VERIFIED full_birthdate=true both_personal_months=true only_question=love-001')
          PY
      - name: Confirm health step for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="numi/moment-health" \
            -f description="health completed for one-question release" >/dev/null
      - name: Record confirmed release on the exact main commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['GH_SHA']}"
          data=json.dumps({"state":"success","context":"numi/moment-love001-live",
            "description":"Cloudflare live health confirms full-date, two personal months, owner-only gate"}).encode()
          request=urllib.request.Request(url,data=data,method="POST",headers={
            "Authorization":"Bearer "+os.environ['GH_TOKEN'],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=15) as response:
            assert response.status==201
          print("MOMENT_LOVE001_DEPLOY_STATUS_PUBLISHED")
          PY
      - name: Record failure if Cloudflare release was not confirmed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GH_REPO']}/statuses/{os.environ['GH_SHA']}"
          data=json.dumps({"state":"failure","context":"numi/moment-love001-live",
            "description":"One-question deploy or live verification failed; check GitHub Actions",
             "target_url":f"https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          request=urllib.request.Request(url,data=data,method="POST",headers={
            "Authorization":"Bearer "+os.environ['GH_TOKEN'],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=15) as response:
            assert response.status==201
          print("MOMENT_LOVE001_DEPLOY_FAILURE_RECORDED")
          PY
