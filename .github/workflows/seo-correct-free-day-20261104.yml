name: Correct homepage SEO free claim (REG.RU)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-correct-free-day-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numi-home-claim-correction
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile .github/scripts/seo-correct-free-day-20261104.py
      - name: Back up and correct only live index.html
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/seo-correct-free-day-20261104.py
