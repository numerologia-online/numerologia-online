name: Targeted Family regression correction - restore humor and clarify arcana 15 (static fix)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-rollback-overreach-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check 15-07 matrix without Gemini and guarded Family-only publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_rollback_overreach_20261123.py
