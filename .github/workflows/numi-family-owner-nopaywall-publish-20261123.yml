name: Publish Family owner preview no-paywall error fix to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-owner-nopaywall-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guarded deployment of only Family owner fallback and cache-busters
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_owner_nopaywall_publish_20261123.py
