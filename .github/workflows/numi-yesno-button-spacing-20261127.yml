name: Publish Yes/No button spacing only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-button-spacing-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only two button dimensions and spacing
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          css_path='moment/yes-no/yes-no.css'
          version='button-spacing-20261127'
          old_rules=[".yn-confirm-time{display:block;width:100%;min-height:44px;padding:9px;border:0;border-radius:8px;background:#214b39;color:#fffefa;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer}",".yn-uncensored{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin:6px 0 0;padding:8px 7px;border:1px solid #aac49e;border-radius:8px;background:#f0f7e9;color:#214b39;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer;box-sizing:border-box}"]
          new_rules=[".yn-confirm-time{display:block;width:calc(100% - 16px);min-height:48px;margin:0 auto;box-sizing:border-box;padding:9px;border:0;border-radius:8px;background:#214b39;color:#fffefa;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer}",".yn-uncensored{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 16px);min-height:48px;margin:10px auto 0;padding:8px 7px;border:1px solid #aac49e;border-radius:8px;background:#f0f7e9;color:#214b39;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer;box-sizing:border-box}"]
          assert all(rule in pathlib.Path(css_path).read_text(encoding='utf-8') for rule in new_rules)
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path in (css_path,html_path):
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  if path==css_path:
                      for before,after in zip(old_rules,new_rules):
                          assert current.count(before)+current.count(after)==1,'Unexpected live button CSS'
                          current=current.replace(before,after,1)
                  else:
                      assert 'id="yn-uncensored"' in current
                      current,n=re.subn(r'\./yes-no\.css\?v=[a-zA-Z0-9_-]+','./yes-no.css?v='+version,current)
                      assert n==1,'Unexpected CSS link'
                  new[path]=current.encode('utf-8')
              assert all(rule.encode() in new[css_path] for rule in new_rules)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/button-spacing-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: two button dimensions only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  style=public(origin+'yes-no.css?v='+version)
                  assert version in live and all(rule in style for rule in new_rules)
                  print('PUBLIC HTTP VERIFIED: two button dimensions')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
