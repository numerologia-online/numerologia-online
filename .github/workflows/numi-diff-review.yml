name: Review REG.RU and GitHub differences
on:
  push:
    paths:
      - .github/workflows/numi-diff-review.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read-only code comparison
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -m py_compile scripts/review-regru-differences.py
          python3 -u scripts/review-regru-differences.py
      - name: Store review findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-diff-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Record REG.RU code difference review"
            git push
          fi
