name: READ ONLY investigate why approved Year Report main changes are not on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-year-client-urgent-readonly-20261116.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare year-report JS and PDF assets with live REG.RU, read only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,pathlib,hashlib,io,difflib,json
          names=['year/index.html','year-feature.js','year-content.js','year-polish.css','year-paywall.css','year-access.js','app.js','index.html','store-entry.js','wallet-client.js','shared-offer.js','pdf-public-outro.js']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def get(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+root+path,b.write)
              return b.getvalue()
          def sha(x):return hashlib.sha256(x).hexdigest()
          try:
              for name in names:
                  source=pathlib.Path(name).read_bytes()
                  try:live=get(name)
                  except ftplib.error_perm as exc:
                      print('YEAR_FILE',name,'FTP_MISSING_OR_DENIED',str(exc)[:100],flush=True)
                      continue
                  same=sha(source)==sha(live)
                  print('YEAR_FILE',name,'status='+('MATCH' if same else 'DIFFERENT'),'live_sha='+sha(live),'main_sha='+sha(source),'live_bytes='+str(len(live)),'main_bytes='+str(len(source)),flush=True)
                  if not same:
                      lines_a=live.decode('utf8',errors='replace').splitlines()
                      lines_b=source.decode('utf8',errors='replace').splitlines()
                      ops=difflib.SequenceMatcher(None,lines_a,lines_b,autojunk=False).get_opcodes()
                      hunks=[(op,i1,i2,j1,j2) for op,i1,i2,j1,j2 in ops if op!='equal']
                      print('YEAR_DIFF_SUMMARY',name,'hunks='+str(len(hunks)), 'ranges='+json.dumps([(a+1,b,c+1,d) for _,a,b,c,d in hunks[:15]]),flush=True)
                      if name in ('year-feature.js','year/index.html','year-polish.css','app.js','store-entry.js','wallet-client.js'):
                          for op,i1,i2,j1,j2 in hunks[:12]:
                              for s in lines_a[i1:min(i2,i1+3)]:
                                  print('LIVE_CONTEXT',name,repr(s[:220]),flush=True)
                              for s in lines_b[j1:min(j2,j1+3)]:
                                  print('MAIN_CONTEXT',name,repr(s[:220]),flush=True)
              print('YEAR_REPORT_MAIN_REG_RU_READONLY_AUDIT_OK writes=0',flush=True)
          finally:ftp.quit()
          PY
