name: Diagnose one rejected Gemma owner Red Flag response
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-gemma-one-diagnosis-20261118.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Call protected owner-only Red Flag prompt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,hmac,hashlib,json,urllib.request,urllib.error
          key=os.environ['GROQ_API_KEY']
          proof=hmac.new(key.encode(),b'numi-moment-cloudflare-bridge-v1',hashlib.sha256).hexdigest()
          body={'category':'flags','question_id':'hero',
            'title':'Скромный мужчина или считает себя подарком судьбы?',
            'day':9,'month':1,
            'followups':['Держит слово или опять одни красивые разговоры?',
              'Щедрый мужчина или считает каждую копейку?']}
          req=urllib.request.Request('https://numerologia-300-ai.tankraft431.workers.dev/v1/redflag-owner-question',
            data=json.dumps(body,ensure_ascii=False).encode(),method='POST',
            headers={'Content-Type':'application/json','X-Numi-Moment-Proof':proof})
          try:
            with urllib.request.urlopen(req,timeout=125) as res: result=json.load(res);code=res.status
          except urllib.error.HTTPError as e:
            code=e.code
            try:result=json.load(e)
            except Exception:result={}
          print('FLAGS_GEMMA_DIAGNOSTIC',code,result.get('error'),result.get('diagnosis'),flush=True)
          if code==200:print('FLAGS_GEMMA_VALID_CHARS',len(result.get('answer','')),flush=True)
          PY
