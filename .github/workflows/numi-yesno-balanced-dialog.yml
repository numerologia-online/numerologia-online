name: Balance the question dialog layout
on:
  push:
    branches: [fix/yesno-balanced-dialog]
    paths: [.github/workflows/numi-yesno-balanced-dialog.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish balanced layout with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/balanced-layout/deploy.py
