name: One real Groq answer through the Moment site handler
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-groq-one-real-answer-20261119.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  one-answer:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request exactly one owner answer and remove the temporary session
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import datetime,ftplib,hashlib,io,json,os,re,secrets,ssl,subprocess,time,urllib.request,urllib.error
          from zoneinfo import ZoneInfo
          
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          site=origin+'/moment/'
          token=secrets.token_hex(32)
          request_id='groq-site-one-answer-20261119-gpt-oss-fixed'
          php=r'''<?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store, private, max-age=0');
          header('X-Robots-Tag: noindex, nofollow, noarchive');
          function singleTestReply(int $status,array $data): never {
              http_response_code($status);
              echo json_encode($data,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
              exit;
          }
          if($_SERVER['REQUEST_METHOD']!=='POST' ||
             !hash_equals('__AUTH_HASH__',hash('sha256',(string)($_SERVER['HTTP_X_NUMI_SINGLE_TEST']??''))))
              singleTestReply(404,['ok'=>false]);
          require dirname(__DIR__,3).'/private/numi-account-20261031/core.php';
          try {
              $body=json_decode((string)file_get_contents('php://input'),true,5,JSON_THROW_ON_ERROR);
              $state=dirname(__DIR__,3).'/private/numi-moment-groq/__REQUEST_ID__.attempt';
              $db=naDB();
              if(($body['operation']??null)==='cleanup') {
                  if(is_file($state)) {
                      $saved=json_decode((string)file_get_contents($state),true);
                      $hash=is_array($saved)?($saved['session_hash']??null):null;
                      if(is_string($hash)&&preg_match('/^[0-9a-f]{64}$/D',$hash)) {
                          $db->prepare('DELETE FROM numi_sessions WHERE session_hash=?')->execute([$hash]);
                          file_put_contents($state,'{"consumed":true}',LOCK_EX);
                      }
                  }
                  singleTestReply(200,['ok'=>true,'cleaned'=>true]);
              }
              if(($body['operation']??null)!=='create'||time()>__DEADLINE__)
                  singleTestReply(410,['ok'=>false,'error'=>'TEST_EXPIRED']);
              $query=$db->prepare('SELECT id,email,email_verified_at FROM numi_accounts WHERE SHA2(LOWER(email),256)=? AND email_verified_at IS NOT NULL LIMIT 1');
              $query->execute(['f289c5906895cbbd1b42d74e4e2e07d531fc1af4e91bcf7e5700835856003d29']);
              $owner=$query->fetch();
              if(!is_array($owner)||!naTestOwner($owner))
                  singleTestReply(403,['ok'=>false,'error'=>'OWNER_NOT_FOUND']);
              $handle=@fopen($state,'x');
              if($handle===false)singleTestReply(409,['ok'=>false,'error'=>'ONE_TEST_ALREADY_CONSUMED']);
              $raw=naToken();
              $hash=hash('sha256',$raw);
              fwrite($handle,json_encode(['session_hash'=>$hash],JSON_THROW_ON_ERROR));
              fclose($handle);
              chmod($state,0600);
              $db->prepare('INSERT INTO numi_sessions(session_hash,account_id,expires_at) VALUES(?,?,DATE_ADD(UTC_TIMESTAMP(),INTERVAL 3 MINUTE))')->execute([$hash,$owner['id']]);
              singleTestReply(200,['ok'=>true,'cookie_name'=>NUMI_ACCOUNT_COOKIE,'cookie_value'=>$raw]);
          } catch(Throwable $e) {
              error_log('MOMENT_ONE_ANSWER_SESSION:'.get_class($e));
              singleTestReply(503,['ok'=>false,'error'=>'TEST_SESSION_SETUP_FAILED']);
          }
          '''
          php=php.replace('__AUTH_HASH__',hashlib.sha256(token.encode()).hexdigest()).replace('__REQUEST_ID__',request_id).replace('__DEADLINE__',str(int(time.time())+300))
          lint=subprocess.run(['php','-l'],input=php.encode(),capture_output=True)
          if lint.returncode:raise SystemExit('ONE_ANSWER_HELPER_SYNTAX_FAILED')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def post_json(url,body,headers):
              request=urllib.request.Request(url,data=json.dumps(body,ensure_ascii=False).encode('utf-8'),
                method='POST',headers={'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-store',**headers})
              try:
                  with opener.open(request,timeout=95) as response:
                      code=response.status
                      data=response.read(40001)
              except urllib.error.HTTPError as error:
                  code=error.code
                  data=error.read(40001)
              if len(data)>40000:raise RuntimeError('ONE_ANSWER_RESPONSE_TOO_LARGE')
              try:parsed=json.loads(data)
              except (ValueError,UnicodeError):parsed={}
              return code,parsed if isinstance(parsed,dict) else {}
          def connect():
              client=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
              client.connect('server172.hosting.reg.ru',21)
              client.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
              client.prot_p();client.set_pasv(True)
              return client
          
          ftp=connect()
          home=ftp.pwd().rstrip('/')
          name='.single-groq-answer-'+secrets.token_hex(16)+'.php'
          remote=home+'/www/xn--c1adkkdfjbp1a4l.online/moment/'+name
          helper_url=site+name
          uploaded=False
          session_cleaned=False
          helper_removed=False
          try:
              ftp.storbinary('STOR '+remote,io.BytesIO(php.encode('utf-8')))
              uploaded=True
              code,session=post_json(helper_url,{'operation':'create'},{'X-Numi-Single-Test':token})
              if code!=200 or session.get('ok') is not True:
                  error=re.sub('[^A-Z0-9_]','',str(session.get('error','UNAVAILABLE')))[:80]
                  raise SystemExit('ONE_ANSWER_OWNER_SESSION_HTTP_'+str(code)+'_'+error)
              cookie_name=session.get('cookie_name')
              cookie_value=session.get('cookie_value')
              if not isinstance(cookie_name,str) or not re.fullmatch('[A-Za-z0-9_-]{1,80}',cookie_name) or not isinstance(cookie_value,str) or not re.fullmatch('[A-Za-z0-9_-]{43}',cookie_value):
                  raise SystemExit('ONE_ANSWER_SESSION_FORMAT_INVALID')
              payload={'question_id':'love-001','birth_date':'2000-09-09','other_date':'2000-10-31',
                       'moment':datetime.datetime.now(ZoneInfo('Europe/Samara')).strftime('%Y-%m-%dT%H:%M')}
              print('MOMENT_ONE_ANSWER_REQUEST attempts=1 no_retries=true site_handler=owner-ai.php synthetic_dates=true',flush=True)
              code,result=post_json(site+'owner-ai.php',payload,{'Origin':origin,'Cookie':cookie_name+'='+cookie_value})
              answer=result.get('answer')
              summary={'http':code,'ok':result.get('ok') is True,'provider':result.get('provider'),
                'question':result.get('question'),'answer':answer if isinstance(answer,str) else None,
                'error':re.sub('[^A-Z0-9_]','',str(result.get('error','')))[:80] or None,
                'birth_date':payload['birth_date'],'other_date':payload['other_date']}
              print('MOMENT_ONE_ANSWER_RESULT '+json.dumps(summary,ensure_ascii=False),flush=True)
              if code!=200 or result.get('ok') is not True or result.get('provider')!='groq' or not isinstance(answer,str) or len(answer.strip())<70:
                  raise SystemExit('ONE_ANSWER_SITE_DID_NOT_RETURN_GROQ_ANSWER')
          finally:
              if uploaded:
                  try:
                      code,clean=post_json(helper_url,{'operation':'cleanup'},{'X-Numi-Single-Test':token})
                      session_cleaned=code==200 and clean.get('cleaned') is True
                  except Exception:
                      pass
                  try:
                      ftp.delete(remote)
                      helper_removed=True
                  except ftplib.all_errors:
                      try:
                          ftp.close()
                          ftp=connect()
                          ftp.delete(remote)
                          helper_removed=True
                      except Exception:
                          pass
              try:ftp.quit()
              except Exception:ftp.close()
              print('MOMENT_ONE_ANSWER_CLEANUP '+json.dumps({'temporary_session_removed':session_cleaned,'temporary_helper_removed':helper_removed}),flush=True)
              if uploaded and not (session_cleaned and helper_removed):
                  raise SystemExit('ONE_ANSWER_CLEANUP_NOT_CONFIRMED')
          PY
