name: Publish personal day club advantages to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-day-subscription-inspect.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish personal day club offer to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and required subscriber benefits
        run: |
          node --check personal-day-feature.js
          grep -q 'Подписка 490 ₽/мес' personal-day-feature.js
          grep -q 'Скидка 50%' personal-day-feature.js
          grep -q 'Денежные ритуалы' personal-day-feature.js
      - name: Replace only subscription UI in live personal day (with backup and rollback)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,io,os,pathlib,ssl,subprocess,tempfile,time
          host='server172.hosting.reg.ru'
          site='www/xn--c1adkkdfjbp1a4l.online'
          file='personal-day-feature.js'
          expected_sha='1ae9fdd008f0c2fa1d4f55185aaf9ddc3cb48cd68488912d707f764b44a1112c'
          def section(s):
              start=s.index('    <button type="button" class="personal-month-open"')
              end=s.index(chr(10)+'  </section>'+chr(96)+';',start)
              return s[start:end]
          src=pathlib.Path(file).read_text('utf-8')
          new_section=section(src)
          assert src.count(new_section)==1
          assert '490 ₽' in new_section and 'Скидка 50%' in new_section
          assert 'Месячная подписка ещё готовится' not in new_section
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect(host,21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          f.set_pasv(True)
          home=f.pwd()
          f.cwd(site)
          if 'index.html' not in [p.rsplit('/',1)[-1] for p in f.nlst()]:
              raise RuntimeError('Unexpected website root; no changes')
          def read(name):
              b=io.BytesIO()
              f.retrbinary('RETR '+name,b.write)
              return b.getvalue()
          def upload(name,content):
              f.storbinary('STOR '+name,io.BytesIO(content))
              if hashlib.sha256(read(name)).digest()!=hashlib.sha256(content).digest():
                  raise RuntimeError('Upload checksum mismatch')
          old=read(file)
          actual=hashlib.sha256(old).hexdigest()
          print('LIVE BEFORE SHA256',actual)
          if actual!=expected_sha:
              raise RuntimeError('Live file changed since inspection; refusing overwrite')
          live=old.decode('utf-8')
          old_section=section(live)
          for marker in ['Месячная подписка ещё готовится', 'Важные числа - только по подписке']:
              if marker not in old_section:
                  raise RuntimeError('Unexpected old subscription UI; refusing change')
          new=live.replace(old_section,new_section,1)
          replacements=[
              ("'🔒 Открыть по подписке <span aria-hidden=\\"true\\">↓</span>'",
               "'Подписка 490 ₽/мес <span aria-hidden=\\"true\\">↓</span>'"),
              ("'Скрыть условия подписки <span aria-hidden=\\"true\\">↑</span>'",
               "'Скрыть преимущества подписки <span aria-hidden=\\"true\\">↑</span>'")
          ]
          for before,after in replacements:
              if new.count(before)!=1:
                  raise RuntimeError('Unexpected toggle code; refusing change')
              new=new.replace(before,after,1)
          if 'Месячная подписка ещё готовится' in new:
              raise RuntimeError('Stale payment placeholder remains')
          if section(new)!=new_section:
              raise RuntimeError('Unexpected generated section')
          with tempfile.NamedTemporaryFile(suffix='.mjs') as test:
              test.write(new.encode('utf-8'));test.flush()
              result=subprocess.run(['node','--check',test.name],capture_output=True,text=True)
              if result.returncode:
                  raise RuntimeError('JavaScript syntax check failed: '+result.stderr[:900])
          changed=new.encode('utf-8')
          print('TARGETED UPDATE, BEFORE BYTES',len(old),'AFTER BYTES',len(changed))
          f.cwd(home)
          try:f.mkd('site-safeguard-backups')
          except ftplib.error_perm:pass
          f.cwd('site-safeguard-backups')
          backup=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-day-subscription-'+hashlib.sha256(old).hexdigest()[:12]+'.js'
          upload(backup,old)
          print('BACKUP VERIFIED OUTSIDE PUBLIC ROOT:',backup)
          f.cwd(home)
          f.cwd(site)
          try:
              upload(file,changed)
              print('PUBLISHED AND FTP-CHECKSUM VERIFIED',file,hashlib.sha256(changed).hexdigest())
          except Exception:
              print('Attempting rollback')
              upload(file,old)
              print('ROLLBACK VERIFIED')
              raise
          finally:
              f.quit()
          PY
