name: Safely publish merged Telegram and email account login
on:
  push:
    paths:
      - .github/workflows/numi-account-merge-release.yml
permissions:
  contents: read
concurrency:
  group: numi-account-merge-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release verified Telegram and email account merging to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint PHP, JS, and guarded deployment
        run: |
          php -l account-service/private/core.php
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-account-merge.py
      - name: Deploy backend and UX with transaction-safe account merging
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-account-merge.py
