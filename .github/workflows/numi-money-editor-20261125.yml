name: Money author answers editorial expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-money-editor-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all source mappings without provider calls
        run: |
          php -l account-service/private/money-editor-live.php
          php -l account-service/public/numi-money-editor-free.php
          php -l account-service/private/fulfillment.php
          php -l account-service/private/wallet-real-payment.php
          php -l account-service/public/numi-owner-material.php
          php account-service/tests/money-editor.php
          node --input-type=module --check < redflag-feature.js
      - name: Guarded REG.RU publication and readback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_money_editor_20261125.py
