name: Publish compact 300 questions heading to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-compact-heading-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope of catalog heading change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('moment/index.html').read_text()
          assert 'id="moment-compact-catalog-heading-20261117"' in page
          assert page.count('Выберите, что сейчас важно')==1
          assert page.count('300 вопросов о жизни')==2
          assert 'font:600 clamp(32px,7.5vw,54px)/1.15' in page
          css=page.split('<style id="moment-compact-catalog-heading-20261117">',1)[1].split('</style>',1)[0]
          assert '.explore .section-heading h2' in css
          assert 'font-size:clamp(18px,5.2vw,21px)' in css
          assert '.explore{padding-top:8px}' in css
          print('MOMENT_HEADING_SOURCE_VALIDATED')
          PY
      - name: Backup and publish only moment/index.html with verified public readback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          path='moment/index.html'
          wanted=Path(path).read_bytes()
          def sha(b):return hashlib.sha256(b).hexdigest()
          history=subprocess.check_output(['git','log','--format=%H','-n','180','--',path],text=True).splitlines()
          trusted={sha(subprocess.check_output(['git','show',rev+':'+path])) for rev in history}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          remote=home+'/www/xn--c1adkkdfjbp1a4l.online/'+path
          def read():
            b=io.BytesIO()
            ftp.retrbinary('RETR '+remote,b.write)
            return b.getvalue()
          def upload(b):
            ftp.storbinary('STOR '+remote,io.BytesIO(b))
            if sha(read())!=sha(b):raise RuntimeError('FTP_READBACK_FAILED')
          changed=False
          try:
            previous=read()
            if sha(previous) not in trusted:raise RuntimeError('UNKNOWN_LIVE_MOMENT_FILE__REFUSE_OVERWRITE')
            if previous!=wanted:
              backup_dir=home+'/site-safeguard-backups'
              try:ftp.mkd(backup_dir)
              except ftplib.error_perm as e:
                if not str(e).startswith('550'):raise
              backup=backup_dir+'/moment-index-compact-heading-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
              ftp.storbinary('STOR '+backup,io.BytesIO(previous))
              b=io.BytesIO()
              ftp.retrbinary('RETR '+backup,b.write)
              if b.getvalue()!=previous:raise RuntimeError('BACKUP_READBACK_FAILED')
              if read()!=previous:raise RuntimeError('CONCURRENT_LIVE_CHANGE')
              changed=True
              upload(wanted)
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/?compact_heading_check='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiMomentHeadingRelease'})
            with urllib.request.urlopen(req,timeout=35) as res:published=res.read(200000)
            if sha(published)!=sha(wanted):raise RuntimeError('PUBLIC_MOMENT_PAGE_NOT_UPDATED')
            print('MOMENT_COMPACT_HEADING_LIVE_VERIFIED only=moment/index.html',flush=True)
          except BaseException:
            if changed:
              try:upload(previous);print('MOMENT_HEADING_ROLLBACK_OK',flush=True)
              except BaseException:print('MOMENT_HEADING_ROLLBACK_FAILED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
