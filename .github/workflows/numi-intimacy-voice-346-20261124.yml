name: Publish Intimacy owner-only conversational voice and energies 3 4 6
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-intimacy-voice-346-20261124.yml
      - .github/scripts/numi_intimacy_voice_346_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline checks and guarded owner-only publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_intimacy_voice_346_20261124.py
