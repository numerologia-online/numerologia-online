name: Publish corrected owner-only YooKassa TEST checkout on REG.RU

on:
  push:
    paths:
      - .github/workflows/numi-wallet-external-browser-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish owner-only TEST wallet external checkout and recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact TEST wallet fixes; no real gateway changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/test-wallet-server-sync-20261106
          git cat-file -e '810f302451157fc864d9b915bf91f3fadb693d2e^{commit}'
          python3 -m py_compile .github/scripts/numi_wallet_external_browser_release.py
          node --check wallet-owner-flow-20261106.js
          git show 810f302451157fc864d9b915bf91f3fadb693d2e:wallet-service/private/test-core.php > /tmp/numi-test-recovery-core.php
          git show 810f302451157fc864d9b915bf91f3fadb693d2e:wallet-service/private/subscriptions-test.php > /tmp/numi-test-recovery-subs.php
          php -l /tmp/numi-test-recovery-core.php
          php -l /tmp/numi-test-recovery-subs.php
          echo TEST_ONLY_LINTS_PASSED
      - name: Back up precisely two TEST files, release with rollback and verify
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_wallet_external_browser_release.py
