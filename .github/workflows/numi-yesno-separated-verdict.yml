name: Separate yes-no verdict from explanation
on:
  push:
    branches: [fix/yesno-separated-verdict]
    paths: [.github/workflows/numi-yesno-separated-verdict.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check yesno-service/answer-layout/yes-no.js
      - name: Publish answer layout with backups and checksum guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/answer-layout/deploy.py
