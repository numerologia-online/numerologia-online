name: Audit latest Love owner error codes and request statuses READ ONLY
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-love-comic-failures-readonly-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read redacted access and PHP error log tails. No generation or edits
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,re,collections,json
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/logs/xn--c1adkkdfjbp1a4l.online.'
          def last(name):
             path=root+name+'.log'
             ftp.voidcmd('TYPE I')
             size=ftp.size(path)
             offset=max(0,size-1700000)
             out=io.BytesIO()
             ftp.retrbinary('RETR '+path,out.write,rest=offset)
             lines=out.getvalue().decode('utf-8','replace').splitlines()
             if offset>0:lines=lines[1:]
             print('LOG_TAIL',name,'size',size,'lines',len(lines),flush=True)
             return lines
          try:
             access=last('access')
             recent=[x for x in access if 'love-owner-preview-api.php' in x]
             hist=collections.Counter()
             examples=[]
             for x in recent:
                m=re.search(r'"POST\s+[^"]*love-owner-preview-api.php[^"]*\s+HTTP/[^"]+"\s+(\d{3})\s+',x)
                if m:
                   hist[m.group(1)]+=1
                   dt=re.search(r'\[([^]]+)\]',x)
                   examples.append({'when':dt.group(1) if dt else '?','http':m.group(1)})
             print('OWNER_LOVE_HTTP_COUNTS',dict(hist),flush=True)
             print('OWNER_LOVE_HTTP_LATEST_35',json.dumps(examples[-35:],ensure_ascii=False),flush=True)
             errors=last('error')
             hits=[x for x in errors if ('LOVE_OWNER_PREVIEW_FAIL' in x or 'INTIMACY_PROVIDER' in x or 'LOVE_PROVIDER' in x)]
             classified=collections.Counter()
             last30=[]
             for line in hits:
                when=re.search(r'\[([^]]+)\]',line)
                t=when.group(1) if when else '?'
                m=re.search(r'LOVE_OWNER_PREVIEW_FAIL\s+([A-Z0-9_]+)',line)
                if m:code=m.group(1)
                else:
                   p=re.search(r'"error"\s*:\s*"([A-Z0-9_]+)"',line)
                   code='PROVIDER_'+p.group(1) if p else 'PROVIDER_OTHER'
                classified[code]+=1
                last30.append({'when':t,'error':code})
             print('OWNER_LOVE_PROVIDER_ERROR_COUNTS',dict(classified),flush=True)
             print('OWNER_LOVE_ERROR_LATEST_35',json.dumps(last30[-35:],ensure_ascii=False),flush=True)
          finally:
             ftp.quit()
          PY
