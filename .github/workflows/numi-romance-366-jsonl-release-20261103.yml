name: Publish 366 protected romance responses in one JSONL
on:
  push:
    paths:
      - .github/workflows/numi-romance-366-jsonl-release-20261103.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish one protected JSONL bank for 366 romance answers'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate public modules and absence of bank data
        run: |
          for f in redflag-text-bank.js redflag-categories.js redflag-feature.js app.js; do node --check "$f"; done
          grep -q 'data/redflag/love/romance.jsonl' redflag-text-bank.js
          grep -q '20261103romance3661' redflag-categories.js
          grep -q '20261103romance3661' redflag-feature.js
          grep -q '20261103romance3661' app.js
          grep -q '20261103romance3661' index.html
          if grep -q 'романтики от этого мужчины я бы не ждала' redflag-text-bank.js; then echo 'Paid content found in public JS' >&2; exit 1; fi
      - name: Prepare protected bank, back up live files and publish with guarded rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,json,hashlib,re,time,urllib.request,urllib.error,pathlib,subprocess,tempfile,calendar
          ROOT=pathlib.Path('.')
          HOST='server172.hosting.reg.ru'
          DOMAIN='xn--c1adkkdfjbp1a4l.online'
          JSONL_PATH='data/redflag/love/romance.jsonl'
          OLD_PATH='data/redflag/love/romance.json'
          SOURCE_PATH='data/redflag/love/romance.json'
          CORE_PATH='infrastructure/reg-protection/2026-10-31/server/core.php'
          SOURCE_BLOB_SHA='9de0bf1a77dfc20db81e47e186dbfe18edfc760e'
          OLD_CORE_SHA256='ba5cd5f0c90b3f9361c98c91f62ec1b7fae87bab9b84663656741c8966ec69ad'
          OLD_ROMANCE_SHA='31041b7ddf2e38af33080e2ee1e73715872c77a7'
          VERSION='20261103romance3661'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect(HOST,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          private=home+'/private/numi-content-reg-20261031'
          web=home+'/www/'+DOMAIN
          backups=home+'/site-safeguard-backups'
          def read(path):
              buff=io.BytesIO()
              ftp.retrbinary('RETR '+path,buff.write)
              if buff.tell()>6000000:raise RuntimeError('Unexpectedly large file')
              return buff.getvalue()
          def tryread(path):
              try:return read(path)
              except ftplib.error_perm as exc:
                  if str(exc).startswith('550'):return None
                  raise
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('FTP checksum mismatch for '+path)
          def blobsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()
          def one(text,old,new,what):
              matches=text.count(old)
              if matches!=1:raise RuntimeError('Unexpected live '+what+' '+str(matches))
              return text.replace(old,new,1)
          def github_raw(token,path):
              url='https://api.github.com/repos/numerologia-online/numi-numi-on-private/contents/'+path+'?ref=main'
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/vnd.github.raw+json',
                  'User-Agent':'numi-reg-private-romance-366-deployment',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=35) as response:
                  if response.status!=200:raise RuntimeError('Private source unavailable')
                  raw=response.read(3500001)
              if len(raw)>3500000:raise RuntimeError('Source too large')
              return raw
          def http(path,body=None):
              url='https://'+DOMAIN+'/'+path+'?verify='+str(time.time_ns())
              headers={'Cache-Control':'no-cache','User-Agent':'NumiPrivateRomanceRelease/1.0'}
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=json.dumps(body).encode() if body is not None else None,headers=headers)
              try:r=urllib.request.urlopen(req,timeout=26)
              except urllib.error.HTTPError as err:r=err
              with r:
                  status=r.status
                  data=r.read(6000000)
              return status,data
          # Verify that the target is exactly the intended REG.RU account and protection layout.
          if b'<html' not in read(web+'/index.html').lower()[:1200]:raise RuntimeError('Unexpected site root')
          old_manifest_bytes=read(private+'/manifest.json')
          manifest=json.loads(old_manifest_bytes)
          if manifest['files'].get(OLD_PATH,{}).get('sha')!=OLD_ROMANCE_SHA:
              raise RuntimeError('Existing protected romance source has changed')
          if JSONL_PATH in manifest['files'] or tryread(web+'/'+JSONL_PATH) is not None:
              raise RuntimeError('JSONL already published or exposed; refuse overwrite')
          core_file=private+'/core.php'
          old_core=read(core_file)
          if hashlib.sha256(old_core).hexdigest()!=OLD_CORE_SHA256:
              raise RuntimeError('Protected PHP core changed independently')
          # Existing secret stays outside webroot; use it read-only and never print it.
          cfg=read(home+'/private/numi-secure-access/config.local.php')
          found=re.findall(rb'(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}',cfg)
          if len(found)!=1:raise RuntimeError('Private read credential is unavailable')
          token=found[0].decode('ascii')
          print('::add-mask::'+token,flush=True)
          raw=github_raw(token,SOURCE_PATH)
          if blobsha(raw)!=SOURCE_BLOB_SHA:raise RuntimeError('GitHub romance content changed since inspection')
          source=json.loads(raw)
          if source.get('questionId')!='romance' or source.get('keyRule')!='day-month' or source.get('schemaVersion')!=2:
              raise RuntimeError('Unexpected question or date rule')
          original_entries=source['entries']
          dates=[str(d)+'-'+str(m) for m in range(1,13) for d in range(1,calendar.monthrange(2024,m)[1]+1)]
          if len(dates)!=366 or set(dates)!=set(original_entries):
              raise RuntimeError('Not exactly 366 distinct calendar dates')
          text_set=set()
          for date in dates:
              value=original_entries[date]
              if not isinstance(value,str) or len(value.strip())<100 or '\\n\\n' not in value:
                  raise RuntimeError('Missing or incomplete response for '+date)
              if value in text_set:raise RuntimeError('Duplicate complete response for '+date)
              text_set.add(value)
          bank=b''.join((json.dumps({'date_key':date,'text':original_entries[date]},ensure_ascii=False,separators=(',',':'))+'\\n').encode('utf-8') for date in dates)
          if len(bank.splitlines())!=366:
              raise RuntimeError('Unexpected JSONL line count')
          for line in bank.splitlines():
              obj=json.loads(line)
              if set(obj)!=set(['date_key','text']) or not obj['text']:raise RuntimeError('Invalid JSONL row')
          new_sha=blobsha(bank)
          print('BANK_READY',len(dates),'UNIQUE_ANSWERS',len(text_set),'JSONL_BYTES',len(bank),'BLOB_SHA',new_sha,flush=True)
          core_new=github_raw(token,CORE_PATH)
          if b'function numiRomanceJsonlAnswer' not in core_new or b"if($endpoint==='redflag-content' && $path==='data/redflag/love/romance.jsonl')" not in core_new:
              raise RuntimeError('Unrecognized protected server update')
          if b'if (!$owner) numiReply(403' not in core_new or b"if ($user===null) numiReply(401" not in core_new:
              raise RuntimeError('Mandatory existing owner security rule missing')
          with tempfile.TemporaryDirectory() as tmp:
              core_temp=pathlib.Path(tmp)/'core.php'
              core_temp.write_bytes(core_new)
              bank_temp=pathlib.Path(tmp)/'romance.jsonl'
              bank_temp.write_bytes(bank)
              lint=subprocess.run(['php','-l',str(core_temp)],capture_output=True,text=True)
              if lint.returncode:raise RuntimeError('PHP syntax failed: '+lint.stderr[:1000])
              for date in ['1-1','29-2','31-12']:
                  code='require '+json.dumps(str(core_temp))+'; echo numiRomanceJsonlAnswer(file_get_contents('+json.dumps(str(bank_temp))+'), '+json.dumps(date)+');'
                  check=subprocess.run(['php','-r',code],capture_output=True,text=True)
                  if check.returncode or check.stdout!=original_entries[date]:
                      raise RuntimeError('Private PHP JSONL selection mismatch: '+date)
          print('PHP_LINT_AND_3_JSONL_SELECTION_TESTS_PASS',flush=True)
          names=['redflag-text-bank.js','redflag-categories.js','redflag-feature.js','app.js','index.html']
          original={name:read(web+'/'+name) for name in names}
          modified={}
          old_owner='const ownerJson = (path) => {\\n  const key = initData() + ":" + path;'
          new_owner='const ownerJson = (path, dateKey = "") => {\\n  const key = initData() + ":" + path + (dateKey ? ":" + dateKey : "");'
          old_body='body: JSON.stringify({ init_data: initData(), path }),'
          new_body='body: JSON.stringify({ init_data: initData(), path, ...(dateKey ? { date_key: dateKey } : {}) }),'
          old_branch='''  if (bankName === "love" && publicQuestion.id === "romance") {
    const { day, month } = profile.classic.birthDate;
    const key = day + "-" + month;
    if (["1-1", "2-1", "3-1", "4-1"].includes(key)) {
      const approved = await ownerJson("data/redflag/love/romance.json");
      const text = approved.entries?.[key];
      if (approved.questionId !== "romance" || typeof text !== "string" || !text.trim()) {
        throw accessError("ANSWER_NOT_FOUND");
      }
      return { answer: text };
    }
  }'''
          bank_source=(ROOT/'redflag-text-bank.js').read_text('utf-8')
          a=bank_source.index('  if (bankName === "love" && publicQuestion.id === "romance") {')
          b=bank_source.index('  if (publicQuestion.status === "in-progress") {',a)
          branch=bank_source[a:b].rstrip('\\n')
          live_bank=original['redflag-text-bank.js'].decode('utf-8')
          live_bank=one(live_bank,old_owner.replace('\\n','\\n'),new_owner.replace('\\n','\\n'),'romance request cache')
          live_bank=one(live_bank,old_body,new_body,'romance date request')
          live_bank=one(live_bank,old_branch,branch,'four-date romance branch')
          modified['redflag-text-bank.js']=live_bank.encode('utf-8')
          rules=[
           ('redflag-categories.js','./redflag-text-bank.js?v=20261102romance4','./redflag-text-bank.js?v='+VERSION),
           ('redflag-feature.js','./redflag-categories.js?v=20261102romance4','./redflag-categories.js?v='+VERSION),
           ('app.js','./redflag-feature.js?v=20261102alllocks2','./redflag-feature.js?v='+VERSION),
           ('index.html','src="app.js?v=20261103freeblock1"','src="app.js?v='+VERSION+'"')
          ]
          for file,old,new in rules:
              modified[file]=one(original[file].decode('utf-8'),old,new,file+' cache key').encode('utf-8')
          for name in names[:-1]:
              with tempfile.NamedTemporaryFile(suffix='.mjs') as tf:
                  tf.write(modified[name]);tf.flush()
                  check=subprocess.run(['node','--check',tf.name],capture_output=True,text=True)
                  if check.returncode:raise RuntimeError('JS parse failure '+name+': '+check.stderr[:900])
          if b'romance.jsonl' not in modified['redflag-text-bank.js']:
              raise RuntimeError('Missing protected JSONL route in client')
          print('LIVE_FRONTEND_PATCHES_VALIDATED',names,flush=True)
          # Baseline anonymous security before touching any live files.
          status,raw_http=http('api/numi-redflag-content.php',{'init_data':'','path':OLD_PATH})
          if status!=401 or json.loads(raw_http).get('ok') is not False:
              raise RuntimeError('Protected access baseline failed')
          manifest2=json.loads(old_manifest_bytes)
          manifest2['files'][JSONL_PATH]={'sha':new_sha,'source':SOURCE_PATH,'ref':SOURCE_BLOB_SHA,'format':'jsonl'}
          new_manifest=(json.dumps(manifest2,ensure_ascii=False,indent=2)+'\\n').encode('utf-8')
          cache_path=private+'/cache/'+new_sha
          if tryread(cache_path) is not None:raise RuntimeError('JSONL blob already in protected cache')
          stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
          backup=backups+'/romance366-'+stamp
          ftp.mkd(backup)
          put(backup+'/core.php.bak',old_core)
          put(backup+'/manifest.json.bak',old_manifest_bytes)
          for name in names:put(backup+'/'+name+'.bak',original[name])
          print('BACKUPS_SAVED_AND_VERIFIED_OUTSIDE_WEBROOT',len(names)+2,flush=True)
          changed=[]
          def publish(p,b,original_data=None):
              if original_data is not None and read(p)!=original_data:
                  raise RuntimeError('Concurrent update at '+p.rsplit('/',1)[-1])
              changed.append((p,original_data))
              put(p,b)
              print('UPLOADED_AND_FTP_VERIFIED',p.rsplit('/',1)[-1],hashlib.sha256(b).hexdigest(),flush=True)
          try:
              publish(cache_path,bank,None)
              ftp.sendcmd('SITE CHMOD 600 '+cache_path)
              publish(core_file,core_new,old_core)
              publish(private+'/manifest.json',new_manifest,old_manifest_bytes)
              # After backend cutover, verify anonymous requests remain denied.
              for date in ['1-1','29-2','31-12']:
                  status,raw_http=http('api/numi-redflag-content.php',{'init_data':'','path':JSONL_PATH,'date_key':date})
                  if status!=401 or json.loads(raw_http).get('ok') is not False:
                      raise RuntimeError('Anonymous protected JSONL access was not denied')
              print('PROTECTED_API_ANONYMOUS_DENIAL_VERIFIED',flush=True)
              for name in names:publish(web+'/'+name,modified[name],original[name])
              for name in names:
                  status,http_bytes=http(name)
                  if status!=200 or http_bytes!=modified[name]:
                      raise RuntimeError('Public HTTP checksum mismatch '+name)
              status,body=http(JSONL_PATH)
              if status==200:raise RuntimeError('Private paid JSONL was exposed publicly')
              print('PUBLIC_WEB_ASSETS_VERIFIED_AND_JSONL_UNREACHABLE',flush=True)
              m=json.loads(read(private+'/manifest.json'))
              if m['files'][JSONL_PATH]['sha']!=new_sha or read(cache_path)!=bank:
                  raise RuntimeError('Active protected romance bank mismatch')
              print('SUCCESS_366_PROTECTED_JSONL_ANSWERS_LIVE',flush=True)
          except BaseException as exc:
              print('ROLLBACK_STARTED',type(exc).__name__,str(exc)[:140],flush=True)
              for p,previous in reversed(changed):
                  try:
                      if previous is None:
                          ftp.delete(p)
                          print('NEW_BLOB_REMOVED',flush=True)
                      else:
                          put(p,previous)
                          print('ROLLBACK_VERIFIED',p.rsplit('/',1)[-1],flush=True)
                  except Exception as rollback:
                      print('ROLLBACK_FAILED',p.rsplit('/',1)[-1],type(rollback).__name__,flush=True)
              raise
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
