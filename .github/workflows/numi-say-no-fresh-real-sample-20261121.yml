name: One real Cloud.ru sample for independent say-no creative prompt
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-say-no-fresh-real-sample-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: One sample, no site writes, no customer data
        env:
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY_2 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.request
          text=pathlib.Path('redflag-ai-lab/say-no-fresh-api.php').read_text('utf-8')
          system=text.split("$system=<<<'INSTRUCTION'\n",1)[1].split("\nINSTRUCTION;",1)[0]
          if 'НЕТ заранее написанной трактовки' not in system or 'готовых' not in system:
              raise RuntimeError('NOT_NEW_PROMPT')
          kb=json.loads(pathlib.Path('redflag-ai-lab/intimacy-knowledge-v1.json').read_text('utf-8'))
          cat=json.loads(pathlib.Path('redflag-ai-lab/catalog.json').read_text('utf-8'))
          questions=[q['title'] for c in cat['categories'] if c['id']=='flags'
                      for q in c['questions'] if q['id']!='say-no']
          # Fictional 09.02.1990: computed by same formula as numerology-core.js.
          day,month,year=9,2,1990
          def r(n):
              while n>22:n=sum(int(c) for c in str(n))
              return n
          left=r(day);right=r(sum(map(int,str(year))));top=month
          bottom=r(left+top+right);center=r(left+top+right+bottom)
          tail=r(center+bottom);cash=r(right+center);balance=r(cash+tail)
          values={'left':left,'right':right,'center':center,'loveHeart':r(tail+balance),
                  'tailFirst':tail,'bottom':bottom}
          selected=[{'key':p,'role':kb['pointDescriptions'][p],
                     'arcana':n,'name':kb['arcana'][str(n)]['name']}
                    for p,n in values.items()]
          knowledge={str(n):kb['arcana'][str(n)] for n in values.values()}
          message=json.dumps({'question':'Уважает женское «нет» или начинает давить?',
                'calculated_matrix_points':selected,
                'arcana_descriptions_from_our_knowledge_base':knowledge,
                'exact_followup_titles':questions},ensure_ascii=False)
          params=json.dumps({
            'model':'anthropic/claude-sonnet-4.6',
            'messages':[{'role':'system','content':system},{'role':'user','content':message}],
            'max_tokens':1750,'stream':False},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request('https://foundation-models.api.cloud.ru/v1/chat/completions',
             data=params,method='POST',headers={
              'Authorization':'Bearer '+os.environ['CLOUD_RU_API_KEY'],
              'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=100) as response:
              obj=json.load(response)
          raw=obj['choices'][0]['message']['content']
          data=json.loads(raw)
          a=data['analysis'];s=data['answer']
          points=a['points']
          assert len(points)>=3
          for p in points:
              assert values[p['key']]==p['number']
          paragraphs=re.split(r'\n\s*\n',s.strip())
          assert len(paragraphs)==2
          assert 400<=len(s)<=1600
          assert any(q in paragraphs[1] for q in questions)
          print('ONE_REAL_AI_SAMPLE_VERIFIED date=fictional:09.02.1990 num_points='+str(len(points))+
                ' paragraphs=2 answer_chars='+str(len(s))+' usage='+str(obj.get('usage',{})),flush=True)
          print('SAMPLE_VERDICT: '+str(a['verdict'])[:300],flush=True)
          print('SAMPLE_ANSWER_START')
          print(s,flush=True)
          print('SAMPLE_ANSWER_END')
          PY
