name: Small 4 and 10 Family thesis correction on REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-4-10-tweaks-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate only 4 and 10 entries changed and publish private Family files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_4_10_tweaks_20261123.py
