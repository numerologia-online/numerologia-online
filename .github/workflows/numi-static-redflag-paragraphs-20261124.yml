name: Repair missing static JSON Red Flag followups
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-static-redflag-paragraphs-20261124.yml'
      - '.github/scripts/numi_static_redflag_paragraphs_20261124.py'
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit static texts, preserve original wording, publish verified paragraphs
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_static_redflag_paragraphs_20261124.py
