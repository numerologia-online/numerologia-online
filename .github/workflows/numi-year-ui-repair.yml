name: Restore live year calculation with free past months and protected paid readings
on:
  push:
    paths:
      - .github/workflows/numi-year-ui-repair.yml
permissions:
  contents: read
concurrency:
  group: numi-year-ui-manual-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release year preview loader repair to REG.RU only'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate year frontend source and publish script
        run: |
          node --check year-feature.js
          node --check app.js
          python3 -m py_compile .github/scripts/numi-year-ui-repair.py
      - name: Back up and publish exactly three year UI files to REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi-year-ui-repair.py

# Recheck precise live-file baseline before release
