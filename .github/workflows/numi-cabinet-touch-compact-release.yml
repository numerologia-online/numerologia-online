name: Publish safer full-height cabinet and compact tariffs on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-cabinet-touch-compact-release.yml
permissions:
  contents: read
concurrency:
  group: numi-cabinet-touch-compact-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish cabinet touch protection and compact prices on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax validation
        run: |
          node --check auth-profile.js
          python3 -m py_compile account-service/deploy-cabinet-touch-and-compact.py
      - name: Guarded FTPS release with backup and live verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-cabinet-touch-and-compact.py
