name: Roll back owner free intimacy preview changes on REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-rollback-intimacy-free-owner-preview-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore five files to pre-editorial-free-question state
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          import os,io,ssl,ftplib,time,uuid,hashlib,subprocess,pathlib,urllib.request,urllib.error
          oldref='7e4b60a23139f2dd3ff05b133ef83f21b81f82d5'
          base='dfcdcf2424f8162a5209b8741401c0db3de6d599'
          files=['redflag-ai-lab/catalog.json','redflag-ai-lab/style-test-api.php','redflag-feature.js','app.js','index.html']
          target={p:pathlib.Path(p).read_bytes() for p in files}
          expected={p:subprocess.check_output(['git','show',oldref+':'+p]) for p in files}
          for p in files:
              b=subprocess.check_output(['git','show',base+':'+p])
              assert target[p]==b,'ROLLBACK_TARGET_CHANGED_'+p
          php='redflag-ai-lab/style-test-api.php'
          def function(s,name):
              start=s.index(b'function '+name+b'(')
              end=s.index(b'\n}\n',start)+2
              return s[start:end]
          fnName=b'rfOwnerSharpIntimacy'
          oldFn=function(expected[php],fnName)
          newFn=function(target[php],fnName)
          fire=b"     'fire'=>['left','top','loveHeart','center','tailFirst'],\n"
          assert oldFn.replace(fire,b'',1)==newFn
          assert expected[php].replace(oldFn,newFn,1)==target[php]
          host='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(host+path+'?rollback='+str(time.time_ns()),headers={'Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:return response.status
              except urllib.error.HTTPError as e:return e.code
          def healthy():
              s=[status(''),status('redflag-ai-lab/style-test-api.php'),status('redflag-ai-lab/style-test.php')]
              print('SITE_HEALTH',s,flush=True)
              return s==[200,403,403]
          if not healthy():raise RuntimeError('SITE_UNHEALTHY_BEFORE_NO_WRITES')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=48)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=home+'/site-safeguard-backups'
          def read(p,absolute=False):
              bio=io.BytesIO();ftp.retrbinary('RETR '+(p if absolute else root+p),bio.write);return bio.getvalue()
          def write(p,data,absolute=False):
              ftp.storbinary('STOR '+(p if absolute else root+p),io.BytesIO(data))
              if read(p,absolute)!=data:raise RuntimeError('READBACK_FAILED_'+p)
          live={};rewritten={};written=[]
          try:
              for p in files:
                  live[p]=read(p)
                  if p!=php:
                      if live[p]!=expected[p]:raise RuntimeError('LIVE_UNEXPECTED_DIFF_'+p)
                      rewritten[p]=target[p]
                  else:
                      if function(live[p],fnName)!=oldFn:raise RuntimeError('LIVE_INTIMACY_FUNCTION_DRIFT')
                      rewritten[p]=live[p].replace(oldFn,newFn,1)
                      if rewritten[p].replace(newFn,oldFn,1)!=live[p]:raise RuntimeError('PHP_REPLACEMENT_DRIFT')
                      if subprocess.run(['php','-l'],input=rewritten[p],capture_output=True).returncode!=0:raise RuntimeError('RESTORED_PHP_INVALID')
              protected=['redflag-ai-lab/sexuality-knowledge-v1.json','redflag-ai-lab/infidelity-knowledge-v1.json','redflag-ai-lab/intimacy-knowledge-v1.json','data/redflag/banks/intimacy.json','redflag-public-catalog.js','redflag-ai-lab/style-test.php','redflag-text-bank.js']
              hashes={p:hashlib.sha256(read(p)).digest() for p in protected}
              try:ftp.mkd(backups)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              tag=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              for p in files:write(backups+'/before-rollback-intimacy-fire-'+p.replace('/','-')+'-'+tag+'.bak',live[p],True)
              for p in files:
                  if read(p)!=live[p]:raise RuntimeError('LIVE_CHANGED_DURING_BACKUP_'+p)
              for p in (php,'redflag-ai-lab/catalog.json','redflag-feature.js','app.js','index.html'):
                  written.append(p)
                  write(p,rewritten[p])
              if not healthy():raise RuntimeError('SITE_HEALTH_AFTER_ROLLBACK')
              for p,h in hashes.items():
                  if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              for p in files:
                  if read(p)!=rewritten[p]:raise RuntimeError('FINAL_READBACK_MISMATCH_'+p)
              html=urllib.request.urlopen(urllib.request.Request(host+'?restore_verify='+str(time.time_ns()),headers={'Cache-Control':'no-store'}),timeout=25).read()
              assert b'app.js?v=redflag-retry-message-20261122' in html
              assert b'app.js?v=intimacy-owner-fire-20261123' not in html
              print('FREE_INTIMACY_OWNER_PREVIEW_ROLLED_BACK_OK files=5 paid_calls=0 existing_intimacy_kb_preserved=true flags_and_infidelity_preserved=true',flush=True)
          except BaseException:
              failed=[]
              for p in reversed(written):
                  try:write(p,live[p])
                  except BaseException:failed.append(p)
              print('ROLLBACK_OF_REVERT_'+('FAILED_'+','.join(failed) if failed else 'SUCCESS'),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
