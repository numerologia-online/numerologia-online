name: Publish fairy-tale angel in Saved cabinet on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-fairytale-angel-release.yml
permissions:
  contents: read
concurrency:
  group: numi-fairytale-angel-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish delicate line-art angel on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate guarded illustration deployment
        run: |
          python3 -m py_compile account-service/deploy-fairytale-angel.py
          grep -q 'numi-angel-hair' index.html
      - name: Publish only angel illustration with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-fairytale-angel.py
