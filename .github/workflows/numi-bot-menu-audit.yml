name: Check Telegram bot site button read only
on:
  push:
    paths:
      - .github/workflows/numi-bot-menu-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read bot settings without exposing token
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,json,re,urllib.request,urllib.error,urllib.parse
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=15)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          base=ftp.pwd().rstrip('/')
          out=io.BytesIO()
          try:ftp.retrbinary('RETR '+base+'/private/bot-config.php',out.write)
          finally:
              try:ftp.quit()
              except:ftp.close()
          source=out.getvalue()
          tokens=re.findall(rb'[0-9]{8,12}:[A-Za-z0-9_-]{30,}',source)
          if len(tokens)!=1:
              print('Bot config: readable, unique token not found; count',len(tokens),flush=True)
              raise SystemExit(1)
          token=tokens[0].decode()
          def api(method,params=None):
              data=urllib.parse.urlencode(params or {}).encode()
              request=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,data=data,headers={'User-Agent':'numi-bot-readonly/1.0'})
              with urllib.request.urlopen(request,timeout=12) as response:
                  return json.load(response).get('result')
          me=api('getMe')
          button=api('getChatMenuButton')
          print('BOT USERNAME:',me.get('username'),'ID:',me.get('id'),flush=True)
          print('BOT MENU TYPE:',button.get('type'),flush=True)
          print('BOT MENU URL:',button.get('web_app',{}).get('url','<none>'),flush=True)
          print('BOT MENU TEXT:',button.get('text','<none>'),flush=True)
          PY
