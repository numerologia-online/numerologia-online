name: Publish unavailable tariff labels to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-tariff-unavailable-release.yml
permissions:
  contents: read
concurrency:
  group: numi-tariff-unavailable-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish tariff unavailable labels on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate selective publication script
        run: |
          python3 -m py_compile account-service/deploy-tariff-unavailable-labels.py
          grep -q 'class="numi-tariff-unavailable">Недоступно' index.html
      - name: Safely publish two labels and CSS with backup
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-tariff-unavailable-labels.py
