name: "Red Flag first question AI pilot - paused while authenticated batch is configured"
on:
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: redflag-unpublished-ai-first-question
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check one-question scope and safe static code
        run: |
          node --check scripts/redflag-generate-care-or-control.mjs
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('scripts/redflag-generate-care-or-control.mjs','utf8');
          if(!s.includes('status:"draft",autoPublish:false'))throw Error('MISSING_PUBLICATION_GUARD');
          if(!s.includes('data/redflag/ai-drafts/flags/care-or-control.json'))throw Error('WRONG_DRAFT_TARGET');
          if(s.includes('wallet_buy')||s.includes('store-assets.json'))throw Error('PAYMENT_OR_STORE_TOUCH_FORBIDDEN');
          JS
      - name: Generate pilot answers with existing Cloudflare account token
        id: generate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REDFLAG_GENERATION_MODE: pilot
        run: node scripts/redflag-generate-care-or-control.mjs
      - name: Save pilot JSON to main (UNPUBLISHED only)
        id: save
        if: always()
        run: |
          set -euo pipefail
          file=data/redflag/ai-drafts/flags/care-or-control.json
          if [ -f "$file" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/redflag/ai-drafts/flags/care-or-control.json')
          d=json.loads(p.read_text())
          assert d['status']=='draft' and d['autoPublish'] is False and d['section']=='flags' and d['questionId']=='care-or-control'
          assert len(d['entries'])<=366
          print('REDFLAG_AI_PILOT_SAVED',len(d['entries']),flush=True)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file"
            if ! git diff --cached --quiet; then
              git commit -m "Save unapproved Red Flag care-or-control AI pilot drafts (not published)"
              git push origin HEAD:main
            fi
          else
            echo "No draft was generated. Live site unaffected."
          fi
      - name: Report pilot result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.generate.outcome }}" = success ] && [ "${{ steps.save.outcome }}" = success ]; then
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-ai-first-question-pilot" -f description="Pilot generation saved to private editorial draft path; no live publication" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-ai-first-question-pilot" -f description="Pilot generation needs diagnosis; no live content changes" >/dev/null
          fi
      - name: Require pilot success
        if: steps.generate.outcome != 'success' || steps.save.outcome != 'success'
        run: exit 1
