name: Harden account registration mail rate limits on existing REG.RU API
on:
  push:
    paths:
      - .github/workflows/numi-account-rate-hardening.yml
permissions:
  contents: read
jobs:
  harden:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release account anti-spam rate limit without UI changes'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax-check PHP and one-file deployment
        run: |
          php -l account-service/private/core.php
          python3 -m py_compile account-service/deploy-rate.py
      - name: Back up then replace only the isolated private account PHP
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-rate.py
