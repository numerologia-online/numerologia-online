name: Publish Red Flag question opening and no-jump fixes ONLY
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-accordion-live-fix-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scroll fix, loading feedback, and unchanged paid access
        run: |
          set -euo pipefail
          node --check redflag-feature.js
          node --check wallet-client.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          src=Path('redflag-feature.js').read_text()
          wallet=Path('wallet-client.js').read_text()
          app=Path('app.js').read_text()
          html=Path('index.html').read_text()
          required=['card.replaceChildren(...updated.childNodes)',
            'const renderCategories = (anchor = null) => {',
            'Проверяем доступ к ответу…',
            'state.answerErrors.set(id,"Не удалось загрузить ответ. Попробуйте ещё раз.")',
            'showInlinePurchase(item,target,']
          for s in required:assert s in src,s
          assert 'window.setTimeout(() => {' not in src[src.index('const createQuestion ='):src.index('const ensureQuestions =')], 'Delayed focused card still present'
          assert 'walletOwnerMaterial(item)' in wallet
          assert 'wallet_quote' in wallet and 'wallet_buy' in wallet
          assert 'redflag-feature.js?v=fast-open-no-scroll-20261117' in app
          assert 'app.js?v=fast-redflag-scroll-20261117' in html
          print('REDFLAG_OPEN_AND_SCROLL_SOURCE_OK',flush=True)
          PY
      - name: Backup and upload precisely four changed static files to REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,io,hashlib,subprocess,time,urllib.request,urllib.error
          paths=['redflag-feature.js','wallet-client.js','app.js','index.html']
          expected={p:Path(p).read_bytes() for p in paths}
          hash256=lambda data:hashlib.sha256(data).hexdigest()
          known={}
          for p in paths:
              commits=subprocess.check_output(['git','log','--format=%H','-n','200','--',p],text=True).splitlines()
              known[p]={hash256(subprocess.check_output(['git','show',rev+':'+p])) for rev in commits}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          base=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              buf=io.BytesIO()
              ftp.retrbinary('RETR '+base+p,buf.write)
              return buf.getvalue()
          def write(p,data):
              ftp.storbinary('STOR '+base+p,io.BytesIO(data))
              if read(p)!=data:raise RuntimeError('REDFLAG_FTP_READBACK_MISMATCH_'+p)
          old={};written=[]
          try:
              old={p:read(p) for p in paths}
              for p in paths:
                  if hash256(old[p]) not in known[p]:
                      raise RuntimeError('REDFLAG_UNKNOWN_LIVE_VERSION_NO_OVERWRITE_'+p)
              backupDir=home+'/site-safeguard-backups'
              try:ftp.mkd(backupDir)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):raise
              timestamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  backup=backupDir+'/redflag-nojump-'+timestamp+'-'+p+'.bak'
                  ftp.storbinary('STOR '+backup,io.BytesIO(old[p]))
                  check=io.BytesIO();ftp.retrbinary('RETR '+backup,check.write)
                  if check.getvalue()!=old[p]:raise RuntimeError('REDFLAG_BACKUP_NOT_VERIFIED_'+p)
              for p in paths:
                  if read(p)!=old[p]:raise RuntimeError('REDFLAG_CONCURRENT_LIVE_EDIT_'+p)
                  if expected[p]!=old[p]:
                      written.append(p);write(p,expected[p])
              urlBase='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in paths:
                  req=urllib.request.Request(urlBase+p+'?redflag_verify='+str(time.time_ns()),
                      headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as res:
                      actual=res.read(250000)
                  if hash256(actual)!=hash256(expected[p]):
                      raise RuntimeError('REDFLAG_PUBLIC_FILE_NOT_VERIFIED_'+p)
              print('REDFLAG_UI_LIVE_VERIFIED four_files=4 paid_banks_unchanged=true',flush=True)
          except BaseException:
              for p in reversed(written):
                  try:write(p,old[p]);print('REDFLAG_ROLLBACK_OK',p,flush=True)
                  except BaseException:print('REDFLAG_ROLLBACK_FAILED',p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Report confirmed live state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-scroll-fix-live" -f description="Red Flag question opening and no-jump scripts verified on REG.RU" >/dev/null
      - name: Report failed verification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-scroll-fix-live" -f description="Red Flag static script publish not verified; check workflow" >/dev/null
