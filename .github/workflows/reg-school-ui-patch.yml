name: Publish reviewed protected school reading layout
on:
  push:
    paths:
      - .github/numi-school-ui-patch.json
permissions:
  contents: read
concurrency:
  group: reg-ru-school-owner-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: node --check pro/school/school.js
      - name: Apply only the reviewed interface removals to existing private snapshots
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,io,json,os,pathlib,ssl,time,urllib.request,urllib.error
          release=json.loads(pathlib.Path('.github/numi-school-ui-patch.json').read_text())
          patches=release['patches']
          if set(patches)!={'pro/school/learning.css','pro/school/lesson/index.html'}:raise RuntimeError('Only reviewed lesson reading sources are allowed')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21);ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/');root=home+'/private/numi-school-owner-20261103/sources';stamp=str(int(time.time()))
          def read(path):
              out=io.BytesIO();ftp.retrbinary('RETR '+path,out.write);return out.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('File integrity mismatch')
          originals={};prepared={};targets={}
          for name,patch in patches.items():
              target=root+'/'+hashlib.sha256(name.encode()).hexdigest();old=read(target)
              new=old
              changes=patch.get('replacements',[])
              if not 1<=len(changes)<=3:raise RuntimeError('Invalid reviewed replacements')
              for change in changes:
                  before=change['before'].encode();after=change['after'].encode()
                  if not before or not after or before==after:raise RuntimeError('Invalid source patch')
                  if new.count(before)==1:new=new.replace(before,after,1)
                  elif new.count(after)==1:pass
                  else:raise RuntimeError('Protected source differs from reviewed source: '+name)
              originals[name]=old;prepared[name]=new;targets[name]=target
          backup=home+'/site-safeguard-backups/school-ui-'+stamp
          ftp.mkd(backup)
          for name,data in originals.items():write(backup+'/'+hashlib.sha256(name.encode()).hexdigest(),data)
          touched=[]
          def install(name,data):
              target=targets[name];stage=target+'.new-'+stamp;write(stage,data);ftp.rename(stage,target);ftp.sendcmd('SITE CHMOD 600 '+target)
              if read(target)!=data:raise RuntimeError('Installed source mismatch')
          try:
              for name,data in prepared.items():touched.append(name);install(name,data)
              req=urllib.request.Request('https://xn--c1adkkdfjbp1a4l.online/pro/school/',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25)as response:
                  if response.status!=200 or b'school-subscription-offer' not in response.read():raise RuntimeError('Existing access lock changed')
              print('SCHOOL_READING_PATCH_SUCCESS: full page scroll for lesson and practice; existing owner-only access preserved.')
          except Exception:
              for name in reversed(touched):install(name,originals[name])
              raise
          finally:ftp.quit()
          PY
