name: Release guarded owner-only TEST wallet to REG.RU (2026-11-07)
on:
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: 'Подтверждаю запуск ТОЛЬКО тестового кошелька владельца на REG.RU'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_test_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate minimal PHP and JS before touching live files
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-owner-wallet-sandbox-20261107.py
          php -l account-service/private/core.php
          php -l account-service/private/wallet.php
          php -l account-service/private/store.php
          node --check account-browser.js
          node --check store-browser.js
          node --input-type=module --check < store-entry.js
          node --check store-material.js
          echo WALLET_SOURCE_SYNTAX_OK
      - name: Guarded FTPS publication and verification; rollback on failure
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          NUMI_YOOKASSA_TEST_SECRET_KEY_1521071: ${{ secrets.NUMI_YOOKASSA_TEST_SECRET_KEY_1521071 }}
        run: python3 -u scripts/deploy-owner-wallet-sandbox-20261107.py
