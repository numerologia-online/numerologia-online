name: Deploy isolated Sex and Intimacy owner preview to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-intimacy-owner-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish only added intimacy function, route and knowledge
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import pathlib,json,subprocess,ftplib,ssl,io,os,hashlib,time,uuid,urllib.request,urllib.error
          ap='redflag-ai-lab/style-test-api.php'
          kp='redflag-ai-lab/sexuality-knowledge-v1.json'
          target=pathlib.Path(ap).read_bytes()
          kb=pathlib.Path(kp).read_bytes()
          info=json.loads(kb)
          assert set(info['arcana'])==set(str(i) for i in range(1,23))
          assert b'function rfOwnerSharpIntimacy(' in target
          def function(data,name):
              start=data.index(b'function '+name+b'(')
              end=data.index(b'\n}\n',start)+2
              return data[start:end]
          fn=function(target,b'rfOwnerSharpIntimacy')
          routeBegin=b"    // Isolated owner Gemini preview for Sex and Intimacy; other routes unchanged."
          routeEnd=b"    // Shared autonomous Sonnet preview for every question except the editorial"
          route=target[target.index(routeBegin):target.index(routeEnd)]
          assert route.count(b"if($category['id']==='intimacy')")==1
          assert fn.count(b'google/gemini-3-flash-preview')==1
          assert b'sexuality-knowledge-v1.json' in fn
          oldCommit='28500a7cf014c78207682a9ec461fa7ef7c8af62'
          base=subprocess.check_output(['git','show',oldCommit+':'+ap])
          # Only isolated function and route are allowed differences from historical API.
          stem=base
          fnMarker=b'function rfOwnerSharpInfidelity('
          fnEnd=stem.index(b'\n}\n',stem.index(fnMarker))+3
          stem=stem[:fnEnd]+b'\n'+fn+b'\n'+stem[fnEnd:]
          routePos=stem.index(routeEnd)
          stem=stem[:routePos]+route+stem[routePos:]
          assert stem==target,'UNEXPECTED_API_CHANGE_FROM_APPROVED_BASE'
          host='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(host+path+'?intimacy_deploy='+str(time.time_ns()),headers={'Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          def healthy():
              codes=[status(''),status('redflag-ai-lab/style-test-api.php'),status('redflag-ai-lab/style-test.php')]
              print('SITE_HEALTH',codes,flush=True)
              return codes==[200,403,403]
          if not healthy():raise RuntimeError('SITE_UNHEALTHY_BEFORE_NO_WRITES')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=44)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=home+'/site-safeguard-backups'
          def read(path,absolute=False):
              v=io.BytesIO();ftp.retrbinary('RETR '+(path if absolute else root+path),v.write);return v.getvalue()
          def write(path,data,absolute=False):
              ftp.storbinary('STOR '+(path if absolute else root+path),io.BytesIO(data))
              if read(path,absolute)!=data:raise RuntimeError('READBACK_MISMATCH_'+path)
          oldPhp=None;oldKB=None;kbExists=False;started=False
          try:
              oldPhp=read(ap)
              if b'function rfOwnerSharpIntimacy(' in oldPhp or routeBegin in oldPhp:raise RuntimeError('INTIMACY_ALREADY_MODIFIED_ABORT')
              # Verify unchanged approved Red Flags and Infidelity logic by byte content, without secrets.
              for name in (b'rfOwner31',b'rfOwnerSharpFlags',b'rfOwnerSharpInfidelity'):
                  if function(oldPhp,name)!=function(base,name):raise RuntimeError('REMOTE_FUNCTION_DRIFT_'+name.decode())
              if oldPhp.count(routeEnd)!=1:raise RuntimeError('ROUTE_ANCHOR_DRIFT')
              try:
                  oldKB=read(kp);kbExists=True
                  if oldKB!=kb:raise RuntimeError('EXISTING_SEXUALITY_KB_DRIFT')
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              infEnd=oldPhp.index(b'\n}\n',oldPhp.index(fnMarker))+3
              desired=oldPhp[:infEnd]+b'\n'+fn+b'\n'+oldPhp[infEnd:]
              desired=desired.replace(routeEnd,route+routeEnd,1)
              syntax=subprocess.run(['php','-l'],input=desired,capture_output=True)
              if syntax.returncode:raise RuntimeError('NEW_PHP_SYNTAX_INVALID_'+syntax.stderr.decode(errors='replace')[:200])
              protected=['redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/infidelity-knowledge-v1.json','redflag-ai-lab/catalog.json','redflag-ai-lab/style-test.php','redflag-feature.js','redflag-public-catalog.js','redflag-engine.js','app.js','index.html','api/redflag-free-ai.php','wallet-client.js']
              hashes={p:hashlib.sha256(read(p)).hexdigest() for p in protected}
              try:ftp.mkd(backups)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              tag=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              write(backups+'/before-intimacy-owner-api-'+tag+'.bak',oldPhp,True)
              if kbExists:write(backups+'/before-intimacy-owner-kb-'+tag+'.bak',oldKB,True)
              if read(ap)!=oldPhp:raise RuntimeError('REMOTE_CONCURRENT_CHANGE')
              started=True
              write(kp,kb)
              write(ap,desired)
              if not healthy():raise RuntimeError('SITE_HEALTH_FAILED_AFTER')
              for p,h in hashes.items():
                  if hashlib.sha256(read(p)).hexdigest()!=h:raise RuntimeError('PROTECTED_CHANGED_'+p)
              live=read(ap)
              assert function(live,b'rfOwnerSharpIntimacy')==fn
              assert live.count(routeBegin)==1
              assert read(kp)==kb
              print('INTIMACY_OWNER_PUBLISHED_VERIFIED questions=9 energies=22 paid_calls=0 flags_unchanged=true infidelity_unchanged=true',flush=True)
          except BaseException:
              if started and oldPhp is not None:
                  errors=[]
                  try:write(ap,oldPhp)
                  except BaseException:errors.append(ap)
                  if kbExists and oldKB is not None:
                      try:write(kp,oldKB)
                      except BaseException:errors.append(kp)
                  else:
                      try:ftp.delete(root+kp)
                      except BaseException:errors.append(kp)
                  print('ROLLBACK_'+('FAILED_'+','.join(errors) if errors else 'SUCCESS'),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
