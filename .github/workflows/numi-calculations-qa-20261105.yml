name: Read-only live user-facing calculators smoke tests on synthetic dates
on:
  push:
    paths: ['.github/workflows/numi-calculations-qa-20261105.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test synthetic calculations only; never authenticate or purchase
        run: |
          cat > numi-calculations-qa.cjs <<'JS'
          (async()=>{
          const {chromium}=require('playwright');
          const root='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          async function run(name,url,setup){
           const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'ru-RU',serviceWorkers:'block'});
           const errors=[],bad=[],result={name};
           p.on('pageerror',e=>errors.push(String(e.message||e).slice(0,250)));
           p.on('response',x=>{if(x.status()>=400&&x.url().startsWith(root))bad.push([x.status(),new URL(x.url()).pathname])});
           p.on('dialog',async d=>{await d.dismiss()});
           try{
            const r=await p.goto(root+url,{waitUntil:'domcontentloaded',timeout:28000});
            result.http=r?.status();
            await p.waitForTimeout(800);
            await setup(p,result);
            await p.waitForTimeout(2500);
            result.mobileWidth=await p.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
           }catch(e){result.testError=String(e.message||e).slice(0,340)}
           result.jsErrors=[...new Set(errors)].slice(0,6);result.httpErrors=[...new Set(bad.map(JSON.stringify))].slice(0,8).map(JSON.parse);
           console.log('CALC_QA_CASE',JSON.stringify(result));
           await p.close();
          }
          try{
           await run('redflag_synthetic_date','',async(p,o)=>{
            await p.locator('[data-open-redflag]').first().evaluate(x=>x.click());
            await p.locator('#redflag-birth-date').fill('12.05.1997');
            await p.locator('#redflag-form').evaluate(x=>x.requestSubmit());
            await p.waitForTimeout(1200);
            o.categories=await p.locator('.redflag-category-toggle').count();
            await p.locator('.redflag-category-toggle').first().evaluate(x=>x.click());
            await p.waitForTimeout(850);
            o.questions=await p.locator('[data-question-id]').count();
            await p.locator('[data-question-id] button').first().evaluate(x=>x.click());
            await p.waitForTimeout(800);
            o.answerVisible=await p.locator('.redflag-question.is-open').count();
            o.answerTextLen=await p.locator('.redflag-question.is-open').first().evaluate(x=>x.innerText.length).catch(()=>0);
            o.error=await p.locator('#redflag-error').innerText().catch(()=>'');
           });
           await run('compatibility_synthetic_dates','',async(p,o)=>{
            await p.locator('[data-open-compatibility]').first().evaluate(x=>x.click());
            await p.locator('#compatibility-date-a').fill('09.09.1986');
            await p.locator('#compatibility-date-b').fill('12.05.1997');
            await p.locator('#compatibility-form').evaluate(x=>x.requestSubmit());
            o.visible=await p.locator('#compatibility-result').isVisible().catch(()=>false);
            o.summaryLen=await p.locator('#compatibility-summary').evaluate(x=>x.innerText.length).catch(()=>0);
            o.topics=await p.locator('.compatibility-topic').count();
            o.error=await p.locator('#compatibility-error').innerText().catch(()=>'');
           });
           await run('year_synthetic_date','',async(p,o)=>{
            await p.locator('[data-open-year]').first().evaluate(x=>x.click());
            await p.locator('#birth-date').fill('09.09.1986');
            await p.locator('#report-year').fill('2027');
            await p.locator('#year-form').evaluate(x=>x.requestSubmit());
            await p.waitForTimeout(700);
            o.reportTitle=await p.locator('#report-title').innerText().catch(()=>'');
            o.monthCards=await p.locator('#months details').count();
            o.reportVisible=await p.locator('#report').isVisible().catch(()=>false);
           });
           await run('child_synthetic_date','child/',async(p,o)=>{
            await p.locator('#child-date').fill('09.09.2018');
            await p.locator('#child-form').evaluate(x=>x.requestSubmit());
            await p.waitForTimeout(700);
            o.matrixVisible=await p.locator('#child-result').isVisible().catch(()=>false);
            o.matrixPointCount=await p.locator('[data-child-topic],.child-matrix-point,.child-point').count();
            o.error=await p.locator('#child-error').innerText().catch(()=>'');
           });
           await run('professional_synthetic_date','pro/',async(p,o)=>{
            await p.locator('#pro-birth-date').fill('09.09.1986');
            await p.locator('#pro-form').evaluate(x=>x.requestSubmit());
            await p.waitForTimeout(700);
            o.resultsVisible=await p.locator('#pro-results').isVisible().catch(()=>false);
            o.diagramChildren=await p.locator('#pro-diagram svg').count();
            o.error=await p.locator('#pro-error').innerText().catch(()=>'');
           });
           await run('personal_day_form_inspection','',async(p,o)=>{
            await p.locator('[data-open-personal-day]').first().evaluate(x=>x.click());
            await p.waitForTimeout(600);
            o.formInputs=await p.locator('.personal-day-overlay input').evaluateAll(items=>items.map(e=>({id:e.id,type:e.type,placeholder:e.placeholder})));
            o.formButtons=await p.locator('.personal-day-overlay button').evaluateAll(items=>items.slice(0,8).map(x=>(x.innerText||x.getAttribute('aria-label')||'').trim().slice(0,50)));
            o.overlayVisible=await p.locator('.personal-day-overlay').isVisible().catch(()=>false);
           });
          }finally{await b.close()}
          console.log('CALC_QA_COMPLETED');
          })().catch(e=>{console.error('CALC_QA_FATAL',String(e));process.exit(1)});
          JS
          node numi-calculations-qa.cjs
