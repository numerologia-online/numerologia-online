name: Check Red Flag scrolling and mobile containment before release
on:
  push:
    paths: ['.github/workflows/numi-redflag-ux-check-20261105.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and all common accordion handlers
        run: |
          node --check redflag-feature.js
          node --check app.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const code=fs.readFileSync('redflag-feature.js','utf8');
          const style=fs.readFileSync('redflag-polish.css','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const page=fs.readFileSync('index.html','utf8');
          assert.match(code,/const renderCategories = \(anchor = null\)/);
          assert.match(code,/renderCategories\(\{ type: "question", id: question\.id \}\)/);
          assert.match(code,/renderCategories\(\{ type: "category", id: category\.id \}\)/);
          assert.match(code,/renderCategories\(\{ type: "question", id \}\)/);
          assert.doesNotMatch(code,/target\.scrollIntoView/);
          assert.match(style,/REDFLAG_MOBILE_VIEWPORT_FIX_20261105/);
          assert.match(style,/grid-template-columns: minmax\(0, 1fr\)/);
          assert.match(style,/overflow-wrap: anywhere/);
          assert.match(app,/redflag-feature\.js\?v=20261105scrollfit1/);
          assert.match(app,/redflag-polish\.css\?v=20261105scrollfit1/);
          assert.match(page,/app\.js\?v=20261105scrollfit1/);
          assert.match(code,/const REDFLAG_SAVE_VIA_TICKET = true;/);
          console.log('REDFLAG_COMMON_ACCORDION_CHECKS_PASSED');
          JS
