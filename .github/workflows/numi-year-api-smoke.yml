name: REG.RU year preview guest contract
on:
  push:
    paths:
      - .github/workflows/numi-year-api-smoke.yml
      - year-content.js
      - year-feature.js
      - paid-access.js
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check guest preview API and local JS parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,subprocess
          url='https://xn--c1adkkdfjbp1a4l.online/api/numi-year-preview.php'
          headers={'Content-Type':'application/json','User-Agent':'numi-year-readonly-smoke'}
          body=json.dumps({'birth_date':'1989-09-09','year':2026,'timezone':'Europe/Samara'}).encode()
          def status(ok,msg):
              subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA'],
              '-f','state='+('success' if ok else 'failure'),'-f','context=numi/year-preview-api','-f','description='+msg],check=True)
          try:
              with urllib.request.urlopen(urllib.request.Request(url,data=body,headers=headers),timeout=24) as r:
                  content=json.loads(r.read(1000000))
                  ok=r.status==200 and content.get('ok')is True and isinstance(content.get('primary'),dict) and isinstance(content.get('alternate'),dict)
              print('Guest annual API:',ok,flush=True)
              status(ok,'Guest annual API contract valid='+str(ok))
              if not ok:raise SystemExit(1)
          except Exception as e:
              print('Guest preview check error:',type(e).__name__,flush=True)
              status(False,'Guest annual API unavailable')
              raise
          PY
