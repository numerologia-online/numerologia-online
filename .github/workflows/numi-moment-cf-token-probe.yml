name: Moment 300 Cloudflare token access check (read only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cf-token-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify Cloudflare API token and locate only intended Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          tok=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not tok:raise RuntimeError('CLOUDFLARE_TOKEN_SECRET_MISSING')
          def cf(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/'+path,headers={
              'Authorization':'Bearer '+tok,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=22) as r:
                return r.status,json.load(r)
            except urllib.error.HTTPError as e:
              return e.code,{}
          status,d=cf('user/tokens/verify')
          print('MOMENT_CF_VERIFY status='+str(status)+' valid='+str(d.get('success',False)).lower())
          if status!=200 or not d.get('success'):raise RuntimeError('CLOUDFLARE_TOKEN_INVALID')
          status,d=cf('accounts?per_page=50')
          print('MOMENT_CF_ACCOUNTS_LIST status='+str(status)+' count='+str(len(d.get('result') or [])))
          if status!=200:raise RuntimeError('CLOUDFLARE_ACCOUNTS_UNAVAILABLE')
          accounts=d.get('result') or []
          if len(accounts)!=1:raise RuntimeError('EXPECTED_ONE_ACCOUNT')
          aid=accounts[0]['id']
          print('MOMENT_CF_ACCOUNT_ID='+aid)
          status,d=cf('accounts/'+aid+'/workers/scripts/numerologia-300-ai')
          print('MOMENT_CF_TARGET_WORKER status='+str(status))
          if status!=200:raise RuntimeError('TARGET_WORKER_NOT_FOUND_OR_ACCESS_DENIED')
          print('MOMENT_CF_TOKEN_AND_TARGET_WORKER_CONFIRMED')
          PY
