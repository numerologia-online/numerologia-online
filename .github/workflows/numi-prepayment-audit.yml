name: Audit REG.RU before payments
on:
  push:
    paths:
      - .github/workflows/numi-prepayment-audit.yml
permissions:
  contents: write
concurrency:
  group: reg-ru-prepayment-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check public pages and FTP security markers (read-only)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -m py_compile scripts/audit-regru-prepayment.py
          python3 -u scripts/audit-regru-prepayment.py
      - name: Save metadata-only audit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-prepayment-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record REG.RU prepayment audit"
            git push
          fi
