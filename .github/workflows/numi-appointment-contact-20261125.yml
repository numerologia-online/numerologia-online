name: Publish bright appointment calendar and Telegram contact
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_appointment_contact_20261125.py'
      - '.github/workflows/numi-appointment-contact-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish booking UI and contact
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_appointment_contact_20261125.py
