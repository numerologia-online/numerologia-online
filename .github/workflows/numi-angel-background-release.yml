name: Publish seamless angel card to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-angel-background-release.yml
permissions:
  contents: read
concurrency:
  group: numi-angel-background-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish seamless angel background on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify guarded publishing script
        run: |
          python3 -m py_compile account-service/deploy-seamless-angel.py
          grep -q 'numi-angel-seamless-background-20261031' index.html
      - name: Publish isolated saved-card update, backup and rollback on errors
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-seamless-angel.py
