name: Publish approved yes-no answers to REG.RU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-yesno-publish.yml'
      - 'yesno-service/publish-approved.trigger'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numi-yesno-approved-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher and PHP syntax
        run: |
          python3 -m py_compile yesno-service/publish-approved.py
          php -l yesno-service/public/numi-yesno-answer.php
      - name: Transfer approved private JSON and verify live answers
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/publish-approved.py
