name: Moment 300 questions - Groq isolated smoke test (NO site changes)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-groq-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify only the 300 Moment questions are in scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open('moment/questions.json', encoding='utf-8') as f:
              catalog=json.load(f)
          questions=catalog['questions']
          assert len(catalog['categories'])==12 and len(questions)==300
          assert len({q['id'] for q in questions})==300
          assert any(q['id']=='love-001' for q in questions)
          print('MOMENT_300_CATALOG_OK; NO OTHER PRODUCTS IN TEST')
          PY
      - name: Call Groq with one synthetic Moment-only question (no deploy, no payments)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key=os.environ.get('GROQ_API_KEY','')
          if not key:
              raise SystemExit('GROQ_KEY_NOT_CONFIGURED')
          with open('moment/questions.json',encoding='utf-8') as f:
              catalog=json.load(f)
          question=next(q for q in catalog['questions'] if q['id']=='love-001')
          payload={
              'model':'openai/gpt-oss-120b',
              'temperature':0.5,
              'max_completion_tokens':500,
              'messages':[
                  {'role':'system','content':'Ты автор ответов ТОЛЬКО для отдельного раздела «300 вопросов о жизни» нумерологического сайта. Пиши по-русски, прямо отвечай на конкретный вопрос; избегай шаблонного портрета и бездоказательных уверенных утверждений о чужих мыслях. Это символическая интерпретация, а не знание реальных фактов. 100-160 слов.'},
                  {'role':'user','content':'Тестовый вопрос '+question['id']+': '+question['title']+'; дата рождения клиента 09.09.1986; дата другого человека 12.05.1997. Ответь только на выбранный вопрос, учитывая обе даты, без фатальных предсказаний.'}
              ]
          }
          req=urllib.request.Request(
              'https://api.groq.com/openai/v1/chat/completions',
              data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
              headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','User-Agent':'numi-moment-groq-test/1.0','Accept':'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(req,timeout=55) as response:
                  status=response.status
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              try:
                  err=json.loads(e.read(8000).decode('utf-8'))
                  info=err.get('error',{}) if isinstance(err,dict) else {}
                  code=str(info.get('code','unspecified'))
                  etype=str(info.get('type','unspecified'))
                  # Only print constrained error identifiers; never echo credentials or raw bodies.
                  import re
                  clean=lambda s: re.sub('[^a-zA-Z0-9_-]','',s)[:70]
                  raise SystemExit('GROQ_HTTP_'+str(e.code)+'_TYPE_'+clean(etype)+'_CODE_'+clean(code))
              except (ValueError,UnicodeError):
                  import re
                  server=re.sub('[^a-zA-Z0-9_-]','',str(e.headers.get('Server','unknown')))[:35]
                  mitigated=re.sub('[^a-zA-Z0-9_-]','',str(e.headers.get('cf-mitigated','none')))[:35]
                  raise SystemExit('GROQ_HTTP_'+str(e.code)+'_NON_JSON_ERROR_SERVER_'+server+'_MITIGATED_'+mitigated)
          except Exception as e:
              raise SystemExit('GROQ_API_CONNECTION_FAILURE_'+type(e).__name__)
          answer=data.get('choices',[{}])[0].get('message',{}).get('content','')
          if status!=200 or not isinstance(answer,str) or len(answer.strip())<90:
              raise SystemExit('GROQ_ANSWER_EMPTY_OR_TOO_SHORT')
          print('GROQ_MOMENT_SMOKE_OK; MODEL='+str(data.get('model','unknown')))
          print('TEST_ANSWER_BEGIN')
          print(answer[:1200].strip())
          print('TEST_ANSWER_END')
          PY
