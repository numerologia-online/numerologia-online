name: Diagnose actual REG.RU Red Flag to Groq bridge and key match
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-live-bridge-diagnose-20261118.yml
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check server key parity and protected PHP to Cloudflare/Groq chain
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,io,os,hashlib,hmac,re,secrets,json,urllib.request,urllib.error
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          prefix=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          conf=root+'/private/numi-moment-groq/config.local.php'
          output=io.BytesIO();ftp.retrbinary('RETR '+conf,output.write)
          raw=output.getvalue().decode('utf8','replace')
          keys=re.findall(r'gsk_[a-zA-Z0-9_-]+',raw)
          print('GROQ_KEY_COUNT_CONFIG',len(keys),flush=True)
          if len(keys)==1:
              print('GROQ_SITE_KEY_MATCHES_GITHUB',hmac.compare_digest(keys[0],os.environ['GROQ_API_KEY']),flush=True)
          elif len(keys)==0:
              print('GROQ_SITE_KEY_NOT_FOUND_IN_CONFIG_TEXT',flush=True)
          token=secrets.token_hex(32)
          path='redflag-ai-lab/redflag-private-chain-'+secrets.token_hex(14)+'.php'
          remote=prefix+path
          php=r'''<?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: private, no-store');
          if (!hash_equals('__OTP__',(string)($_SERVER['HTTP_X_NUMI_DIAG']??''))) {
              http_response_code(404);exit;
          }
          try {
            $config=require dirname(__DIR__,3).'/private/numi-moment-groq/config.local.php';
            $key=is_array($config)?($config['groq_api_key']??null):null;
            if(!is_string($key)||!str_starts_with($key,'gsk_')) {
              echo json_encode(['ok'=>false,'error'=>'GROQ_SITE_KEY_NOT_FOUND']);exit;
            }
            $proof=hash_hmac('sha256','numi-moment-cloudflare-bridge-v1',$key);
            $payload=json_encode(['category'=>'flags','question_id'=>'hero',
              'title'=>'Скромный мужчина или считает себя подарком судьбы?',
              'day'=>9,'month'=>9,'followups'=>['Щедрый мужчина или считает каждую копейку?']],
              JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
            $ch=curl_init('https://numerologia-300-ai.tankraft431.workers.dev/v1/redflag-owner-question');
            curl_setopt_array($ch,[CURLOPT_POST=>true,CURLOPT_RETURNTRANSFER=>true,
              CURLOPT_FOLLOWLOCATION=>false,CURLOPT_CONNECTTIMEOUT=>10,CURLOPT_TIMEOUT=>85,
              CURLOPT_MAXREDIRS=>0,CURLOPT_HTTPHEADER=>['Content-Type: application/json','Accept: application/json',
                'X-Numi-Moment-Proof: '.$proof,'User-Agent: NumiRedFlagBridgeTrace/1.0'],
              CURLOPT_POSTFIELDS=>$payload]);
            $txt=curl_exec($ch);
            $status=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);
            $errno=curl_errno($ch);curl_close($ch);
            $json=is_string($txt)?json_decode($txt,true):null;
            echo json_encode(['ok'=>$json['ok']??false,
              'http'=>$status,'curl_errno'=>$errno,'service_error'=>$json['error']??null,
              'model'=>$json['model']??null,'answer_chars'=>is_string($json['answer']??null)?mb_strlen($json['answer']):0],
              JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          } catch(Throwable $e){echo json_encode(['ok'=>false,'error'=>get_class($e)]);}
          ?>'''.replace('__OTP__',token)
          try:
              try:
                  ftp.size(remote)
                  raise RuntimeError('REFUSE_OVERWRITE_PRIVATE_DIAG')
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              ftp.storbinary('STOR '+remote,io.BytesIO(php.encode('utf8')))
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'NumiRedFlagBridgeTrace/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as resp: code=resp.status
              except urllib.error.HTTPError as err:code=err.code
              print('BRIDGE_DIAG_PUBLIC_HTTP',code,flush=True)
              if code!=404:raise RuntimeError('DIAG_NOT_PRIVATE')
              req=urllib.request.Request(url,data=b'{}',headers={'X-Numi-Diag':token,
                'Content-Type':'application/json','User-Agent':'NumiRedFlagBridgeTrace/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=115) as response:
                      status=response.status;parsed=json.load(response)
                  print('BRIDGE_PHP_RESPONSE',json.dumps({'site_http':status,**parsed},ensure_ascii=False),flush=True)
              except urllib.error.HTTPError as err:
                  print('BRIDGE_PHP_HTTP_ERROR',err.code,flush=True)
          finally:
              try:ftp.delete(remote);print('BRIDGE_DIAG_REMOVED',flush=True)
              finally:ftp.quit()
          PY
