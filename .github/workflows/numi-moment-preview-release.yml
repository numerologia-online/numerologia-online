name: Publish compact Moment intro spacing safely on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-moment-preview-release.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: numi-moment-preview-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish more compact Moment landing page on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate complete moment preview without touching production
        id: validate
        run: |
          echo syntax > /tmp/moment-stage
          python3 -m py_compile moment/deploy-compact-spacing-20261101.py
          echo javascript > /tmp/moment-stage
          node --check moment/moment.js
          node moment/tests/compact-topic-list.test.cjs > /tmp/moment-js-validation.log 2>&1 || { tail -35 /tmp/moment-js-validation.log; exit 1; }
          echo catalog > /tmp/moment-stage
          python3 - <<'PY'
          import json
          d=json.load(open('moment/questions.json',encoding='utf-8'))
          assert len(d['categories']) == 12
          assert len(d['questions']) == 300
          assert len({x['title'] for x in d['questions']}) == 300
          assert len({x['id'] for x in d['questions']}) == 300
          assert set(x['category'] for x in d['questions']) == set(x['id'] for x in d['categories'])
          assert set(x['mode'] for x in d['questions']) <= {'self','partner','event'}
          h=open('moment/index.html',encoding='utf-8').read()
          assert '<section class="hero">' not in h
          assert '300 вопросов о жизни</h1>' in h
          assert h.count('id="question-search"')==1
          assert h.count('id="clear-search"')==1
          assert h.count('href="./yes-no/"')==1
          assert 'class="moment-back-button"' in h
          assert '← Назад</a>' in h
          assert 'class="header-back"' not in h
          assert '<div class="section-heading">\n        <h2>Выберите, что сейчас важно</h2>' in h
          assert 'Без бесконечных списков' not in h
          assert 'ВАША БИБЛИОТЕКА ВОПРОСОВ' not in h
          assert 'moment.css?v=4' in h
          assert 'moment.js?v=2' in h
          assert 'id="questions-panel" class="questions-panel" hidden' in h
          assert h.count('id="show-all"')==1
          assert 'gap:7px;padding:clamp(17px,4vw,26px) 18px' in h
          assert 'aria-label="Да или нет" style="padding-top:18px"' in h
          css=open('moment/moment.css',encoding='utf-8').read()
          assert '.explore .category{background:#f3f0e7' in css
          assert '.explore .category-grid{display:grid;grid-template-columns:minmax(0,1fr)' in css
          assert css.count('{')==css.count('}')
          assert '.explore{padding-top:clamp(19px,3vw,29px)}' in css
          assert '  .explore{padding:25px 0 65px}' in css
          print('Simplified Moment heading and all 300 questions validated')
          PY
          echo validated > /tmp/moment-stage
      - name: Back up and publish only Moment index.html with live checksum
        id: release
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -o pipefail
          python3 -u moment/deploy-compact-spacing-20261101.py 2>&1 | tee /tmp/moment-release-log

      - name: Record actual public deployment verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          passed=os.environ.get('RELEASE_RESULT')=='success'
          reason='Compact Moment spacing verified on REG.RU' if passed else 'Moment release failed'
          if not passed:
            if os.environ.get('VALIDATION_RESULT')!='success':
              stage=pathlib.Path('/tmp/moment-stage')
              reason='Preflight failed at '+(stage.read_text().strip() if stage.exists() else 'initialization')
              jslog=pathlib.Path('/tmp/moment-js-validation.log')
              if stage.exists() and stage.read_text().strip()=='javascript' and jslog.exists():
                lines=[x.strip() for x in jslog.read_text(errors='replace').splitlines() if x.strip()]
                if lines:reason='JS: '+(' / '.join(lines[:2]))[:125]
            else:
              logfile=pathlib.Path('/tmp/moment-release-log')
              if logfile.exists():
                for line in reversed(logfile.read_text(errors='replace').splitlines()):
                  if line.startswith('MOMENT_COMPACT_SPACING '):
                    try:reason=json.loads(line.partition(' ')[2]).get('reason','Unknown deployment error')[:120]
                    except Exception:pass
                    break
          context='moment-compact-spacing-live' if passed else 'moment-failure-'+''.join(x if x.isascii() and x.isalnum() else '-' for x in reason.lower())[:70]
          body=json.dumps({'state':'success' if passed else 'failure',
            'context':context,'description':reason[:140]}).encode()
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA']
          req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:print(response.status)
          PY

  inspect-catalog-live:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Inspect missing Moment 300 questions on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only compare live catalog, UI and JS responses
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, hashlib, pathlib, re
          base="https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          paths=["/moment/","/moment/moment.js?v=club-ask-20261111","/moment/questions.json?v=1","/moment/moment.css?v=club-ask-20261111","/moment/yes-no/"]
          for path in paths:
              req=urllib.request.Request(base+path,headers={"User-Agent":"NumiCatalogReadOnly/20261113","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:
                      status=res.status;content=res.read(400000);typ=res.headers.get("Content-Type","");url=res.url
              except urllib.error.HTTPError as e:
                  status=e.code;content=e.read(1000);typ=e.headers.get("Content-Type","");url=e.url
              info={"path":path,"status":status,"type":typ,"bytes":len(content),"final_url":url,"sha256":hashlib.sha256(content).hexdigest()[:20]}
              if path.startswith("/moment/questions"):
                  try:
                      d=json.loads(content)
                      info.update(categories=len(d["categories"]),questions=len(d["questions"]),valid_count=len(d["categories"])==12 and len(d["questions"])==300)
                  except Exception as e: info["json_error"]=str(e)[:100];info["first_bytes"]=content[:100].decode("utf-8","replace")
              if path=="/moment/":
                  src=content.decode("utf-8","replace")
                  info.update(grid=src.count('id="category-grid"'),scripts=re.findall(r'src="([^"]*moment.js[^"]*)"',src),questions_panel=src.count('id="questions-panel"'))
              if path.startswith("/moment/moment.js"):
                  src=content.decode("utf-8","replace")
                  info.update(js_has_render_categories="function renderCategories()" in src,js_has_valid_check="data.questions.length!==300" in src,js_has_fetch="./questions.json?v=1" in src)
              print("CATALOG_LIVE",json.dumps(info,ensure_ascii=False),flush=True)
          PY

      - name: Verify iOS WebKit Moment rendering
        run: |
          mkdir -p /tmp/numi-moment-browser && cd /tmp/numi-moment-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
          node - <<'JS'
          const {webkit}=require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('requestfailed',r=>errors.push('REQ '+r.url()+' '+r.failure()?.errorText));
            const response=await page.goto('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            console.log('IOS_WEBKIT_MOMENT',JSON.stringify({htmlStatus:response.status(),categories:await page.locator('#category-grid>.category').count(),gridVisible:await page.locator('#category-grid').isVisible(),errors:errors.slice(0,5)}));
            await browser.close();
          })().catch(e=>{console.error('WEBKIT_FATAL',e.message);process.exit(1);});
          JS

      - name: Verify live Moment catalog in mobile browser
        run: |
          mkdir -p /tmp/numi-moment-browser && cd /tmp/numi-moment-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright@1.56.1 >/dev/null
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const setup of [
              {label:'ordinary_mobile',context:{viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'}},
              {label:'telegram_user_agent',context:{viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Telegram-iOS/11.0'}}
            ]){
              const page=await browser.newPage(setup.context);
              const errs=[],fail=[];
              page.on('pageerror',e=>errs.push(e.message.slice(0,250)));
              page.on('requestfailed',r=>fail.push({url:r.url().slice(0,140),error:r.failure()?.errorText}));
              page.on('console',msg=>{if(msg.type()==='error')errs.push('console:'+msg.text().slice(0,250));});
              const response=await page.goto('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1500);
              const info=await page.evaluate(async()=>({
                categoryCount:document.querySelectorAll('#category-grid>.category').length,
                gridText:document.querySelector('#category-grid')?.innerText.slice(0,180),
                gridStyle:getComputedStyle(document.querySelector('#category-grid')).display,
                scriptTags:[...document.scripts].map(s=>s.src).filter(Boolean).slice(0,8),
                hidden:document.querySelector('#category-grid')?.hidden,
                jsonCheck:await fetch('./questions.json?v=1').then(r=>r.json()).then(d=>[d.categories?.length,d.questions?.length]).catch(e=>String(e))
              }));
              console.log('MOMENT_BROWSER',JSON.stringify({label:setup.label,htmlStatus:response.status(),...info,errors:errs.slice(0,6),failedRequests:fail.slice(0,6)}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('BROWSER_FATAL',e.message);process.exit(1)});
          JS

  publish-catalog-fallback:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Moment fallback for 300 questions to REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Back up and publish only Moment index and JS, verify 300 questions and preserve Yes/No
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,time,hashlib,subprocess,urllib.request
          from pathlib import Path
          OLD_COMMIT_INDEX="7d2b3d03bb5039c94e96245d3397e7fb50cf179e"
          OLD_COMMIT_JS="9b64ac33760fa40061773aa2f38f15385756071b"
          base="xn--c1adkkdfjbp1a4l.online"
          primary="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          names=["moment/moment.js","moment/index.html"]
          baseline={
            "moment/index.html":subprocess.check_output(["git","show",OLD_COMMIT_INDEX+"^:moment/index.html"]),
            "moment/moment.js":subprocess.check_output(["git","show",OLD_COMMIT_JS+"^:moment/moment.js"])
          }
          desired={x:Path(x).read_bytes() for x in names}
          def sha(x):return hashlib.sha256(x).hexdigest()
          html=desired["moment/index.html"].decode("utf-8")
          js=desired["moment/moment.js"].decode("utf-8")
          if html.count('class="moment-static-topic"')!=12 or html.count("<li>")!=300 or html.count('id="moment-catalog-retry"')!=1:raise RuntimeError("INVALID_STATIC_FALLBACK")
          if html.count("moment.js?v=catalog-fallback-20261113")!=1:raise RuntimeError("INVALID_SCRIPT_VERSION")
          if 'if(catalogStatus)catalogStatus.hidden=false;' not in js or 'grid.replaceChildren();' not in js:raise RuntimeError("INVALID_JS_FALLBACK")
          subprocess.run(["node","--check","moment/moment.js"],check=True,timeout=15)
          print("LOCAL_FALLBACK_300_VALID",flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect("server172.hosting.reg.ru",21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip("/");folder=home+"/www/"+base
          def read(n):
            out=io.BytesIO();ftp.retrbinary("RETR "+folder+"/"+n,out.write)
            if out.tell()>200000:raise RuntimeError("SIZE_LIMIT")
            return out.getvalue()
          def write(n,b):
            ftp.storbinary("STOR "+folder+"/"+n,io.BytesIO(b))
            if read(n)!=b:raise RuntimeError("READBACK_DIFF:"+n)
          def online(n):
            req=urllib.request.Request("https://"+primary+"/"+n+"?moment_fallback_check="+str(time.time_ns()),headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(req,timeout=22) as r:
              if r.status!=200:raise RuntimeError("HTTP_STATUS_FAIL:"+n)
              return r.read(200000)
          try:
            original={n:read(n) for n in names}
            if original["moment/index.html"]==desired["moment/index.html"] and original["moment/moment.js"]==desired["moment/moment.js"]:
              print("MOMENT_FALLBACK_ALREADY_DEPLOYED");raise SystemExit(0)
            for n in names:
              if sha(original[n])!=sha(baseline[n]):raise RuntimeError("LIVE_BASELINE_DIFF:"+n)
            backup=home+"/site-safeguard-backups/moment-fallback-"+time.strftime("%Y%m%dT%H%M%SZ",time.gmtime())
            ftp.mkd(backup)
            for n in names:
              path=backup+"/"+n.replace("/","__")+".bak"
              ftp.storbinary("STOR "+path,io.BytesIO(original[n]))
              b=io.BytesIO();ftp.retrbinary("RETR "+path,b.write)
              if b.getvalue()!=original[n]:raise RuntimeError("BACKUP_READBACK_FAILED")
            print("BACKUP_VERIFIED",flush=True)
            touched=[]
            try:
              for n in names:
                if read(n)!=original[n]:raise RuntimeError("CONCURRENT_MODIFICATION:"+n)
                touched.append(n);write(n,desired[n])
              for n in names:
                if online(n)!=desired[n]:raise RuntimeError("LIVE_HTTP_READBACK_FAIL:"+n)
              if online("moment/questions.json").count(b'"title"')<300:raise RuntimeError("CATALOG_HEALTH_FAILED")
              if online("moment/yes-no/index.html").count(b'yn-categories')<1:raise RuntimeError("YESNO_CHECK_FAILED")
              print("MOMENT_FALLBACK_300_RELEASE_SUCCESS",flush=True)
            except BaseException:
              for n in reversed(touched):write(n,original[n])
              print("MOMENT_FALLBACK_ROLLBACK_VERIFIED",flush=True)
              raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY

  publish-moment-coming-soon-49:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish 49 RUB Moment coming soon to REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    concurrency:
      group: reg-ru-manual-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guarded publish of Moment page and JS with full readback, backup, and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,io,os,time,hashlib,subprocess,urllib.request,json
          from pathlib import Path
          repo_commit_index="95a912f0ef03a0e8e47f155f363f7e4baf72af06"
          repo_commit_js="1be10b97836db621c6bfcd0b558934e3f1f5011c"
          base="xn--c1adkkdfjbp1a4l.online"
          primary="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          files=["moment/moment.js","moment/index.html"]
          baseline={
           "moment/index.html":subprocess.check_output(["git","show",repo_commit_index+"^:moment/index.html"],timeout=20),
           "moment/moment.js":subprocess.check_output(["git","show",repo_commit_js+"^:moment/moment.js"],timeout=20)}
          desired={p:Path(p).read_bytes() for p in files}
          def sha(b):return hashlib.sha256(b).hexdigest()
          h=desired["moment/index.html"].decode("utf-8")
          j=desired["moment/moment.js"].decode("utf-8")
          assert h.count('class="moment-static-topic"')==12 and h.count("<li>")==300
          assert h.count("moment.js?v=coming-soon-49-20261113")==1
          assert h.count("49 ₽ за вопрос")==1 and h.count('href="./yes-no/"')==1
          assert 'id="question-dialog"' not in h and "Доступно по подписке" not in h
          assert j.count('b.disabled=true;')==1 and "49 ₽ · Скоро" in j
          assert 'clubStatus' not in j and 'question-dialog' not in j
          subprocess.run(["node","--check","moment/moment.js"],check=True,timeout=18)
          q=json.loads(Path("moment/questions.json").read_text())
          assert len(q["categories"])==12 and len(q["questions"])==300
          print("MOMENT_COMING_SOON_LOCAL_VALID",flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect("server172.hosting.reg.ru",21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip("/")
          root=home+"/www/"+base
          def read(p):
           out=io.BytesIO();ftp.retrbinary("RETR "+root+"/"+p,out.write)
           if out.tell()>200000:raise RuntimeError("FILE_SIZE_LIMIT")
           return out.getvalue()
          def write(p,blob):
           ftp.storbinary("STOR "+root+"/"+p,io.BytesIO(blob))
           if read(p)!=blob:raise RuntimeError("FTP_READBACK_FAILED "+p)
          def http(p):
           req=urllib.request.Request("https://"+primary+"/"+p+"?coming_soon_check="+str(time.time_ns()),headers={"Cache-Control":"no-cache"})
           with urllib.request.urlopen(req,timeout=28) as response:
            if response.status!=200:raise RuntimeError("PUBLIC_HTTP_NOT_200 "+p)
            return response.read(200000)
          try:
           original={p:read(p) for p in files}
           if all(original[p]==desired[p] for p in files):
            print("MOMENT_COMING_SOON_ALREADY_LIVE");raise SystemExit(0)
           for p in files:
            if sha(original[p])!=sha(baseline[p]):
             raise RuntimeError("LIVE_CHANGED_REFUSE_OVERWRITE "+p)
           yesno_before=sha(http("moment/yes-no/index.html"))
           backup=home+"/site-safeguard-backups/moment-soon-49-"+time.strftime("%Y%m%dT%H%M%SZ",time.gmtime())
           ftp.mkd(backup)
           for p in files:
            save=backup+"/"+p.replace("/","__")+".bak"
            ftp.storbinary("STOR "+save,io.BytesIO(original[p]))
            b=io.BytesIO();ftp.retrbinary("RETR "+save,b.write)
            if b.getvalue()!=original[p]:raise RuntimeError("BACKUP_FAILED")
           print("MOMENT_COMING_SOON_BACKUP_VERIFIED",flush=True)
           touched=[]
           try:
            for p in files:
             if read(p)!=original[p]:raise RuntimeError("CONCURRENT_MODIFICATION "+p)
             touched.append(p);write(p,desired[p])
            for p in files:
             if http(p)!=desired[p]:raise RuntimeError("PUBLIC_READBACK_FAILED "+p)
            liveq=json.loads(http("moment/questions.json"))
            if len(liveq.get("categories",[]))!=12 or len(liveq.get("questions",[]))!=300:raise RuntimeError("CATALOG_CHANGED")
            if sha(http("moment/yes-no/index.html"))!=yesno_before:raise RuntimeError("YESNO_CHANGED")
            print("MOMENT_COMING_SOON_49_RELEASE_SUCCESS 300_DISABLED yesno_unchanged=True",flush=True)
           except BaseException:
            for p in reversed(touched):write(p,original[p])
            print("MOMENT_COMING_SOON_ROLLBACK_VERIFIED",flush=True)
            raise
          finally:
           try:ftp.quit()
           except Exception:ftp.close()
          PY

  publish-moment-price-49:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish 49 RUB Moment tariff on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    concurrency:
      group: reg-ru-manual-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Update only the outdated Moment price row with FTP backup and HTTP verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,urllib.request,time
          from pathlib import Path
          old='<div class="item"><div class="name"><a href="/moment/">«Нумерология момента»</a><span class="desc">Один персональный ответ. Раздел готовится к запуску.</span></div><div class="price">50 ₽</div><div class="member">25 ₽</div></div>'.encode()
          new='<div class="item"><div class="name"><a href="/moment/">«Нумерология момента» — 300 вопросов</a><span class="desc">49 ₽ за один вопрос. Все 300 вопросов пока в разработке, покупка недоступна.</span></div><div class="price">49 ₽<small>Скоро</small></div><div class="member">Подписка не требуется</div></div>'.encode()
          target=Path("prices.html").read_bytes()
          if target.count(new)!=1 or old in target:raise RuntimeError("REPOSITORY_PRICE_NOT_VALIDATED")
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect("server172.hosting.reg.ru",21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip("/")
          path=home+"/www/xn--c1adkkdfjbp1a4l.online/prices.html"
          def read():
           b=io.BytesIO();ftp.retrbinary("RETR "+path,b.write)
           if b.tell()>200000:raise RuntimeError("PRICE_FILE_SIZE")
           return b.getvalue()
