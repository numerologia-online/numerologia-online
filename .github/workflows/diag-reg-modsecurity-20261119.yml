name: READ ONLY classify REG.RU site protection events November 19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-reg-modsecurity-20261119.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Summarize WAF, upstream and 403 events without logging personal data
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ftplib,ssl,io,re,collections
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          root=home+'/logs/xn--c1adkkdfjbp1a4l.online.'
          def retrieve(name):
              buff=io.BytesIO()
              ftp.retrbinary('RETR '+root+name,buff.write)
              return buff.getvalue().decode('utf-8','replace').splitlines()
          errs=retrieve('error.log')
          hourly=collections.Counter();rules=collections.Counter();targets=collections.Counter();reasons=collections.Counter()
          def kind(path):
              path=path.split('?',1)[0]
              if path in ('/','/index.html'):return 'homepage'
              if path.startswith('/api/'):return 'api'
              if path.startswith('/redflag-ai-lab/'):return 'redflag_ai_lab'
              if path.endswith(('.js','.css','.png','.svg','.webp','.woff2')):return 'assets'
              if path.startswith('/.'):return 'hidden_file'
              if path.startswith('/wp-') or path.endswith('.php'):return 'other_php'
              return 'other'
          for s in errs:
              cat='modsecurity' if 'modsecurity' in s.lower() or 'mod_security' in s.lower() else 'upstream' if 'upstream' in s.lower() else 'client_denied' if 'client denied' in s.lower() else 'other'
              r=re.search(r'\[id\s+"(\d+)"\]',s)
              if r:rules[(cat,r.group(1))]+=1
              u=re.search(r'\[uri\s+"([^"]+)"\]',s)
              if not u:u=re.search(r'request:\s+"(?:GET|POST|HEAD)\s+([^\s]+)',s)
              route=kind(u.group(1)) if u else 'unknown'
              targets[(cat,route)]+=1
              t=re.search(r'2026/(11/19)\s+(\d\d):',s) or re.search(r'(Nov 19)\s+(\d\d):',s) or re.search(r'2026-11-19[T ](\d\d):',s)
              hour=t.group(t.lastindex) if t else 'not_parsed'
              hourly[(cat,hour)]+=1
              if cat=='modsecurity':
                  if 'Access denied' in s:reason='access_denied'
                  elif 'Warning' in s:reason='warning'
                  else:reason='other'
                  reasons[reason]+=1
          print('WAF_TYPES',targets.most_common(30),flush=True)
          print('WAF_RULES',rules.most_common(15),flush=True)
          print('WAF_HOURLY',hourly.most_common(35),flush=True)
          print('WAF_REASONS',reasons.most_common(),flush=True)
          logs=retrieve('access.log')
          classes=collections.Counter();hour403=collections.Counter()
          for line in logs:
              q=re.search(r'"(GET|POST|HEAD|OPTIONS)\s+([^\s]+)\s+HTTP/[^"]+"\s+(\d{3})\s',line)
              if not q:continue
              route,status=kind(q.group(2)),q.group(3)
              if status in ('403','503','400','404','502'):
                  classes[(status,route)]+=1
              if status=='403':
                  hour=re.search(r'19/Nov/2026:(\d\d):',line)
                  hour403[(hour.group(1) if hour else 'unknown',route)]+=1
          print('ERROR_STATUS_CLASSES',classes.most_common(40),flush=True)
          print('HTTP403_BY_HOUR',hour403.most_common(30),flush=True)
          ftp.quit()
          print('READ_ONLY_COMPLETE',flush=True)
          PY
