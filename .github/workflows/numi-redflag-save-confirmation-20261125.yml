name: Publish Red Flag Telegram save confirmation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-redflag-save-confirmation-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Show confirmed Red Flag delivery in Telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < redflag-feature.js
          node --input-type=module --check < app.js
      - name: Verify the send endpoint and publish the updated save controls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, io, json, os, pathlib, ssl, subprocess, time, urllib.error, urllib.request
          files = ('redflag-feature.js', 'app.js', 'index.html')
          baseline = {p: subprocess.check_output(['git', 'show', 'HEAD^:'+p]) for p in files}
          desired = {p: pathlib.Path(p).read_bytes() for p in files}
          origin = 'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          tag = 'redflag-telegram-feedback-20261125'

          def request(path, data=None):
              req = urllib.request.Request(
                  origin + '/' + path, data=data,
                  headers={'Cache-Control':'no-cache','Origin':origin,'Content-Type':'application/json'})
              try:
                  resp = urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError as error:
                  resp = error
              with resp:
                  return resp.status, resp.read(2000000)

          def get(path):
              status, content = request(path)
              assert status == 200, 'PUBLIC_STATUS_' + path
              return content

          # Exercise the live validation with a synthetic report and no Telegram
          # credentials. This request cannot send a message to a chat.
          report = ('🚩 Мужчина или Red Flag\nВопрос: Проверка\nДата рождения мужчины: 01.01.2000\n\n'
                    'Синтетическая проверка без данных пользователя.\n'
                    '🌐 Сайт: ' + origin + '/?view=redflag\n🤖 Бот: https://t.me/Numerologiaonline_bot')
          status, body = request('api/numi-save-answer.php', json.dumps({'init_data':'','text':report}).encode())
          response = json.loads(body)
          error = response.get('error', '')
          assert status in (400, 401, 403, 422) and response.get('ok') is False, 'DIRECT_SAVE_VALIDATION'
          assert error not in ('ORIGIN_NOT_ALLOWED', 'INVALID_FORECAST', 'BOT_NOT_CONFIGURED'), 'DIRECT_SAVE_' + error
          print('LIVE_SEND_VALIDATION', status, error)

          nonce = str(time.time_ns())
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25) as ftp:
              ftp.connect('server172.hosting.reg.ru', 21)
              ftp.login(os.environ['REG_FTP_USER'], os.environ['REG_FTP_PASSWORD'])
              ftp.prot_p()
              home = ftp.pwd().rstrip('/')
              web = home + '/www/xn--c1adkkdfjbp1a4l.online/'
              backup = home + '/site-safeguard-backups/redflag-save-confirmation-' + nonce

              def read(path):
                  buf = io.BytesIO()
                  ftp.retrbinary('RETR ' + path, buf.write)
                  return buf.getvalue()

              def write(path, data):
                  ftp.storbinary('STOR ' + path, io.BytesIO(data))
                  assert read(path) == data, 'STAGED_BYTES'

              before = {p: read(web + p) for p in files}
              for p in files:
                  assert before[p] in (baseline[p], desired[p]), 'LIVE_CHANGED_' + p
                  assert get(p + '?save_confirmation_preflight=' + nonce) == before[p], 'WRONG_SITE_ROOT_' + p

              ftp.mkd(backup)
              changes = [p for p in files if before[p] != desired[p]]
              for p in changes:
                  write(backup + '/' + p + '.bak', before[p])
                  write(backup + '/' + p + '.ready', desired[p])

              installed = []
              try:
                  for p in changes:
                      assert read(web + p) == before[p], 'CONCURRENT_CHANGE_' + p
                      ftp.rename(backup + '/' + p + '.ready', web + p)
                      installed.append(p)
                      assert read(web + p) == desired[p], 'INSTALLED_BYTES_' + p
                  assert get('?save_confirmation=' + nonce) == desired['index.html'], 'LIVE_HOME'
                  for p in files[:2]:
                      assert get(p + '?v=' + tag) == desired[p], 'LIVE_SCRIPT_' + p
              except BaseException:
                  for p in reversed(installed):
                      ftp.rename(backup + '/' + p + '.bak', web + p)
                      assert read(web + p) == before[p], 'ROLLBACK_BYTES_' + p
                  raise
          print('REDFLAG_TELEGRAM_SAVE_CONFIRMATION_LIVE')
          PY
