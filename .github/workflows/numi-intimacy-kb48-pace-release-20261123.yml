name: Publish corrected energies 4 and 8 and intimacy pace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-intimacy-kb48-pace-release-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PHP, no inference and exact change scope
        run: |
          set -euo pipefail
          php -l account-service/private/intimacy-live.php
          python3 -m py_compile .github/scripts/numi_intimacy_kb48_pace_publish_20261123.py
      - name: Back up and publish two private files on REG RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_intimacy_kb48_pace_publish_20261123.py
