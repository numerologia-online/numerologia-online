name: Enable four approved romance answers on live REG.RU
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-romance-four-routing.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect four answers and verify live modules
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,json,hashlib,time,re,subprocess,urllib.request
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect("server172.hosting.reg.ru",21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);ftp.prot_p()
          home=ftp.pwd().rstrip("/");site=home+"/www/xn--c1adkkdfjbp1a4l.online"
          def read(p):
              b=io.BytesIO();ftp.retrbinary("RETR "+p,b.write)
              if b.tell()>5500000:raise RuntimeError("File exceeds limit")
              return b.getvalue()
          def put(p,b):
              ftp.storbinary("STOR "+p,io.BytesIO(b))
              if read(p)!=b:raise RuntimeError("Readback failed")
          names=["redflag-text-bank.js","redflag-categories.js","redflag-feature.js","app.js","index.html"]
          original={n:read(site+"/"+n) for n in names};updated=dict(original)
          needle='  if (publicQuestion.status === "in-progress") {'
          branch="  if (bankName === \"love\" && publicQuestion.id === \"romance\") {\n    const { day, month } = profile.classic.birthDate;\n    const key = day + \"-\" + month;\n    if ([\"1-1\", \"2-1\", \"3-1\", \"4-1\"].includes(key)) {\n      const approved = await ownerJson(\"data/redflag/love/romance.json\");\n      const text = approved.entries?.[key];\n      if (approved.questionId !== \"romance\" || typeof text !== \"string\" || !text.trim()) {\n        throw accessError(\"ANSWER_NOT_FOUND\");\n      }\n      return { answer: text };\n    }\n  }\n"
          code=original[names[0]].decode()
          if code.count(needle)!=1 or 'const ownerJson = ' not in code:raise RuntimeError("Unexpected live reader layout")
          if branch in code:raise RuntimeError("Branch already present")
          updated[names[0]]=code.replace(needle,branch+needle,1).encode()
          version="20261102romance4"
          for filename,dependency in [("redflag-categories.js","redflag-text-bank.js"),("redflag-feature.js","redflag-categories.js"),("app.js","redflag-feature.js"),("index.html","app.js")]:
              text=original[filename].decode()
              pattern=r'(["\x27](?:\./)?'+re.escape(dependency)+r'\?v=)[^"\x27]+(["\x27])'
              text,n=re.subn(pattern,lambda m:m.group(1)+version+m.group(2),text)
              if n!=1:raise RuntimeError("Unexpected dependency count: "+filename)
              updated[filename]=text.encode()
          for n in names[:-1]:
              subprocess.run(["node","--input-type=module","--check"],input=updated[n],check=True)
          manifest=json.loads(read(home+"/private/numi-content-reg-20261031/manifest.json"))
          if manifest["files"]["data/redflag/love/romance.json"]["sha"]!="31041b7ddf2e38af33080e2ee1e73715872c77a7":raise RuntimeError("Approved texts not installed")
          backup=home+"/site-safeguard-backups/romance-routing-"+str(int(time.time()))
          ftp.mkd(backup)
          for n in names:put(backup+"/"+n,original[n])
          applied=[]
          try:
              for n in names:
                  if read(site+"/"+n)!=original[n]:raise RuntimeError("Concurrent edit")
                  applied.append(n);put(site+"/"+n,updated[n])
              for n in names:
                  req=urllib.request.Request("https://xn--c1adkkdfjbp1a4l.online/"+n+"?release="+version,headers={"Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=30) as res:b=res.read(5500001)
                  if b!=updated[n]:raise RuntimeError("HTTP verification failed: "+n)
              print("SUCCESS: live route enabled ONLY for romance January 1-4; all five HTTP files match; syntax passed; backups saved")
          except BaseException:
              for n in reversed(applied):put(site+"/"+n,original[n])
              print("ROLLED BACK public routing");raise
          finally:ftp.quit()
          
          PY
