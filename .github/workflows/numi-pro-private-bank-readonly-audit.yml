name: Read only - discover full-life protected original data paths
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-pro-private-bank-readonly-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check protected sources, no writing, no text disclosure
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,os,ftplib,ssl,hashlib,urllib.request,urllib.error,time
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p();f.set_pasv(True)
          root=f.pwd().rstrip('/')
          def fetch(p):
            b=io.BytesIO()
            try:f.retrbinary('RETR '+p,b.write);return b.getvalue()
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
          pub=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          priv=root+'/private/numi-account-20261031/store-content/'
          for fragment in ('knowledge/full-report/sections/energy-1.json','knowledge/full-report/sections/energy-9.json','knowledge/full-report/sections/energy-18.json','knowledge/full-report/sections/energy-22.json','pro/purpose/personal.json','pro/guidance/energy-9.json','pro/guidance/energy-18.json','karmic-tails.md'):
            public=fetch(pub+fragment)
            private=fetch(priv+fragment)
            print('PRO_SOURCE path='+fragment+' public_exists='+str(public is not None)+' private_exists='+str(private is not None)+
              ' bytes_pub='+str(len(public or b''))+' bytes_private='+str(len(private or b''))+
              ' private_matches_pub='+str(public==private if private and public else '-'))
          f.quit()
          rooturl='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          paths=('pro/guidance/energy-9.json','pro/guidance/energy-18.json','pro/purpose/personal.json','pro/purpose/planetary.json','karmic-programs.js','karmic-tails.md','pro/karmic-tail-deepening-a.json','pro/karmic-tail-deepening-b.json','pro/zones.json','pro/point-previews.json')
          for p in paths:
            request=urllib.request.Request(rooturl+p+'?audit='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(request,timeout=16) as res:
                code=res.status;size=len(res.read(190000))
            except urllib.error.HTTPError as e:
              code=e.code;size=0
            except Exception:
              code=0;size=0
            print('PRO_PATH_STATUS path='+p+' status='+str(code)+' bytes='+str(size))
          print('PRO_PRIVATE_BANK_AUDIT_COMPLETE no_changes=true')
          PY
