name: Check existing Cloudflare deployment access for isolated 300-question Worker
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cf-access-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Detect deployment credentials without printing or using secrets
        env:
          HAS_CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ALT: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_ALT_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID != '' }}
        run: |
          printf 'MOMENT_CLOUDFLARE_ACCESS_CHECK api_token=%s alternate_token=%s account_id=%s alternate_account_id=%s\n' "$HAS_CF_API" "$HAS_CF_ALT" "$HAS_CF_ACCOUNT" "$HAS_CF_ALT_ACCOUNT"
          echo "READ_ONLY_CHECK_COMPLETE"
