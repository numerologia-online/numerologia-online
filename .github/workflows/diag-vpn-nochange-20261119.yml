name: Diagnose production DNS, TLS, IPv4 and HTML without changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-vpn-nochange-20261119.yml']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public read-only networking
        run: |
          python3 - <<'PY'
          import json,subprocess,urllib.request,urllib.parse,ssl
          hosts=['xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','xn--c1adkkdfjbp1a4l.online']
          for host in hosts:
              for rr in ('A','AAAA'):
                  u='https://dns.google/resolve?'+urllib.parse.urlencode({'name':host,'type':rr})
                  try:
                      with urllib.request.urlopen(u,timeout=10) as f: j=json.load(f)
                      print('DNS',host,rr,j.get('Status'),[(x.get('type'),x.get('data')) for x in j.get('Answer',[]) if x.get('type') in (1,28)],flush=True)
                  except Exception as e:print('DNS_ERROR',host,rr,type(e).__name__,flush=True)
              for family in ('-4','-6'):
                  cmd=['curl',family,'-sS','-L','-o','/dev/null','--connect-timeout','6','--max-time','15','-w','http=%{http_code} verify=%{ssl_verify_result} ip=%{remote_ip} redirect=%{num_redirects} bytes=%{size_download}',f'https://{host}/']
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=20)
                  print('HTTP',host,family,'exit='+str(p.returncode),p.stdout,'stderr='+p.stderr[-120:],flush=True)
          host=hosts[0]
          for path in ['/','/index.html','/auth-profile.js','/account-browser.js','/app.js','/assets/telegram-web-app-20261102.js','/api/profile.php']:
              cmd=['curl','-4','-sS','-o','/dev/null','--connect-timeout','6','--max-time','14','-w','http=%{http_code} type=%{content_type} ssl=%{ssl_verify_result} ip=%{remote_ip}',f'https://{host}{path}']
              p=subprocess.run(cmd,capture_output=True,text=True)
              print('RESOURCE',path,'exit='+str(p.returncode),p.stdout,'stderr='+p.stderr[-100:],flush=True)
          PY