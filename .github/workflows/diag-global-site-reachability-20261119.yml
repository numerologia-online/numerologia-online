name: External regional HTTP availability test for live domain (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-global-site-reachability-20261119.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ask independent public network probes whether the restored website responds
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time,collections
          domain='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          u='https://check-host.net/check-http?'+urllib.parse.urlencode({'host':domain,'max_nodes':12})
          req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'NumiSiteDiagnostics/1.0'})
          with urllib.request.urlopen(req,timeout=17) as r:j=json.load(r)
          if not j.get('ok') or not j.get('request_id'):raise RuntimeError('NO_REQUEST_ID')
          rid=j['request_id']
          print('CHECK_HOST_NODES',[(k,v[1] if isinstance(v,list) and len(v)>1 else None) for k,v in j['nodes'].items()])
          results={}
          for attempt in range(9):
              time.sleep(2)
              u='https://check-host.net/check-result/'+urllib.parse.quote(rid,safe='')
              with urllib.request.urlopen(urllib.request.Request(u,headers={'Accept':'application/json'}),timeout=17) as r:results=json.load(r)
              if all(results.get(k) is not None for k in j['nodes']):break
          total=collections.Counter()
          for key,meta in j['nodes'].items():
              value=results.get(key)
              if not value:
                  print('PROBE',meta[1],meta[2],'PENDING');total['pending']+=1;continue
              first=value[0] if isinstance(value,list) and value else None
              if not first:
                  print('PROBE',meta[1],meta[2],'NO_DATA');total['no_data']+=1;continue
              success,sec,reason,status,*rest=first
              ip=rest[0] if rest else None
              print('PROBE',meta[1],meta[2],'success',bool(success),'http',status,'reason',str(reason)[:100],'ip',ip)
              total['good' if success else 'bad']+=1
          print('RESULT_SUMMARY',dict(total))
          print('PUBLIC_PROBE_REPORT',j['permanent_link'])
          PY
