name: Publish independent owner-only say-no free AI test without 366 bank
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-say-no-fresh-owner-test-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify provider and deploy only three owner-only files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY_2 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,ftplib,io,json,os,pathlib,ssl,subprocess,time,urllib.request,urllib.error
          names=[
            'redflag-ai-lab/say-no-fresh-api.php',
            'redflag-ai-lab/say-no-fresh.php'
          ]
          approved={
            names[0]:'269af0b23e58d4c904026c2a1e0c80d40d87a138',
            names[1]:'c8e658a820c1a895aa50ac5c073895f12a41048a'
          }
          for path in names:
              approved_body=subprocess.check_output(['git','show',approved[path]+':'+path])
              if pathlib.Path(path).read_bytes()!=approved_body:
                  raise RuntimeError('SOURCE_CHANGED_'+path)
          kb=json.loads(pathlib.Path('redflag-ai-lab/intimacy-knowledge-v1.json').read_bytes())
          assert kb['schema']=='numi-owner-intimacy-matrix-knowledge-v1'
          assert kb['mode']=='owner_draft_only'
          assert len(kb['arcana'])==22 and set(kb['arcana'])==set(map(str,range(1,23)))
          assert len(kb['questions'])==9
          api=pathlib.Path(names[0]).read_bytes()
          page=pathlib.Path(names[1]).read_bytes()
          marker=b'__SAY_NO_FRESH_CLOUD_KEY__'
          if api.count(marker)!=1:raise RuntimeError('KEY_PLACEHOLDER_MISMATCH')
          if b'naTestOwner(naCurrent(naDB()))' not in api or b'naTestOwner(naCurrent(naDB()))' not in page:
              raise RuntimeError('OWNER_GUARD_MISSING')
          if b'naAllowedOrigins()' not in api or b"'published'=>false" not in api:
              raise RuntimeError('REQUEST_GUARD_MISSING')
          if b'say-no-fresh-api.php' not in page:raise RuntimeError('UI_API_UNLINKED')
          key=os.environ.get('CLOUD_RU_API_KEY','').strip()
          if len(key)<15:raise RuntimeError('CLOUD_RU_KEY_NOT_AVAILABLE')
          b64=base64.b64encode(key.encode())
          print('::add-mask::'+b64.decode(),flush=True)
          live_api=api.replace(marker,b64)
          for data in (api,live_api,page):
              test=subprocess.run(['php','-l'],input=data,capture_output=True)
              if test.returncode:raise RuntimeError('PHP_SYNTAX_INVALID_'+test.stderr.decode(errors='replace')[:200])
          content={names[0]:live_api,names[1]:page}
          print('SOURCE_OK 22_arcana=22 say_no_fresh=true no_366_bank=true full_date=true old_prompts_unchanged=true',flush=True)
          # Small real Cloud.ru call verifies account, model and network before deployment.
          params=json.dumps({'model':'anthropic/claude-sonnet-4.6',
              'messages':[{'role':'user','content':'Одним словом: работает'}],
              'max_tokens':18,'stream':False},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request('https://foundation-models.api.cloud.ru/v1/chat/completions',
              data=params,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=70) as res:
              if res.status!=200:raise RuntimeError('CLOUD_NOT_200')
              result=json.load(res)
          if not str(result.get('choices',[{}])[0].get('message',{}).get('content') or '').strip():
              raise RuntimeError('CLOUD_EMPTY_RESPONSE')
          print('CLOUD_RU_SONNET_4_6_VERIFIED inference_count=1 tokens_limit=18',flush=True)
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def request(path,method='GET',data=None,headers=None):
              req=urllib.request.Request(site+path+'?matrix_test='+str(time.time_ns()),
                  method=method,data=data,
                  headers={'Cache-Control':'no-store','User-Agent':'NumiOwnerMatrixPilot/1.0',**(headers or {})})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status,res.read(7000)
              except urllib.error.HTTPError as e:return e.code,e.read(7000)
          if request('')[0]!=200:raise RuntimeError('HOME_PRECHECK_FAILED')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          prefix=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          created=[]
          def read(path):
              buf=io.BytesIO()
              try:ftp.retrbinary('RETR '+prefix+path,buf.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return buf.getvalue()
          try:
              if read('redflag-ai-lab/intimacy-knowledge-v1.json')!=pathlib.Path('redflag-ai-lab/intimacy-knowledge-v1.json').read_bytes():
                  raise RuntimeError('LIVE_ARCANA_KNOWLEDGE_MISMATCH')
              for name in names:
                  if read(name) is not None:raise RuntimeError('REFUSE_OVERWRITE_EXISTING_'+name)
              for name in names:
                  created.append(name)
                  ftp.storbinary('STOR '+prefix+name,io.BytesIO(content[name]))
                  if read(name)!=content[name]:raise RuntimeError('FTPS_VERIFY_FAILED_'+name)
                  print('NEW_FILE_VERIFIED '+name,flush=True)
              for name in names:
                  status,body=request(name)
                  if status!=403:raise RuntimeError('GUEST_GET_GUARD_'+name+'_HTTP_'+str(status))
                  if key.encode() in body or b64 in body:raise RuntimeError('SECRET_LEAK')
              status,body=request(names[0],method='POST',
                  data=b'{"day":9,"month":9,"year":1986}',
                  headers={'Content-Type':'application/json','Origin':site.rstrip('/')})
              if status!=403:raise RuntimeError('GUEST_POST_GUARD_HTTP_'+str(status))
              if request('')[0]!=200:raise RuntimeError('HOME_POSTCHECK_FAILED')
              print('PUBLISHED_AND_VERIFIED say_no_fresh_no_366_bank=true owner_only=true 22_arcana=true 31_matrix_points=true model=anthropic/claude-sonnet-4.6 guest_guard=true public_redflags_unchanged=true payments_unchanged=true',flush=True)
          except BaseException:
              for name in reversed(created):
                  try:ftp.delete(prefix+name);print('ROLLBACK_REMOVED '+name,flush=True)
                  except BaseException:print('ROLLBACK_FAILED '+name,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
