name: Refresh restored site assets in Telegram without changing user data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-yesterday-live-20261119.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Back up and refresh restored asset URLs and Telegram launch menu
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,io,re,hashlib,time,subprocess,pathlib,json,urllib.request
          stamp='recovery-20261119-v1'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          webroot=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO();ftp.retrbinary('RETR '+path,b.write);return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('READBACK_FAILED')
          old={p:read(webroot+p) for p in ['index.html','app.js']}
          html=old['index.html'].decode()
          app=old['app.js'].decode()
          # Refresh only script/style URLs. Preserve all page text and account/payment logic.
          html,n=re.subn(r'(<script\b[^>]*\bsrc=["\x27])([^"\x27]+)(["\x27])',lambda m:m[1]+m[2].split('?')[0]+'?v='+stamp+m[3],html)
          if n<6:raise RuntimeError('SCRIPT_URLS_NOT_FOUND')
          html,c=re.subn(r'(<link\b[^>]*href=["\x27])([^"\x27]+\.css)(?:\?[^"\x27]*)?(["\x27])',lambda m:m[1]+m[2]+'?v='+stamp+m[3],html)
          app,a=re.subn(r'(\./[A-Za-z0-9_/-]+\.js|[A-Za-z0-9_/-]+\.css)\?[^"\x27\s)]+',lambda m:m[1]+'?v='+stamp,app)
          if a<5:raise RuntimeError('LAZY_MODULE_URLS_NOT_FOUND')
          pathlib.Path('/tmp/restored-app.js').write_text(app)
          subprocess.run(['node','--input-type=module','--check'],input=app.encode(),check=True)
          new={'index.html':html.encode(),'app.js':app.encode()}
          bakdir=home+'/site-safeguard-backups'
          try:ftp.mkd(bakdir)
          except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
          for p,b in old.items():write(bakdir+'/'+stamp+'-'+p+'.bak',b)
          changed=[]
          try:
              for p in ['app.js','index.html']:
                  changed.append(p);write(webroot+p,new[p])
              base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in ['index.html','app.js']:
                  req=urllib.request.Request(base+p+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as res:actual=res.read()
                  if actual!=new[p]:raise RuntimeError('PUBLIC_HASH_MISMATCH')
              print('RESTORED_ASSET_CACHE_REFRESH_VERIFIED',n,c,a,flush=True)
          except BaseException:
              for p in reversed(changed):write(webroot+p,old[p])
              raise
          # Refresh the existing menu URL on the same site, preserving its label.
          config=read(home+'/private/bot-config.php')
          ftp.quit()
          tokens=set(re.findall(rb'[0-9]{6,15}:[A-Za-z0-9_-]{30,60}',config))
          if len(tokens)!=1:raise RuntimeError('TOKEN_SELECTION_AMBIGUOUS')
          token=next(iter(tokens)).decode()
          def telegram(method,payload=None):
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:data=json.load(res)
              except Exception as e:raise RuntimeError('TELEGRAM_REQUEST_FAILED:'+type(e).__name__) from None
              if not data.get('ok'):raise RuntimeError('TELEGRAM_RESULT_NOT_OK')
              return data['result']
          menu=telegram('getChatMenuButton')
          if menu.get('type')!='web_app':raise RuntimeError('MENU_TYPE_CHANGED')
          from urllib.parse import urlparse
          origin=urlparse(menu['web_app']['url'])
          if origin.hostname not in ['нумерология-онлайн.рф','xn----8sbhhqijddjgdebdz2c2o.xn--p1ai']:raise RuntimeError('UNEXPECTED_MENU_ORIGIN')
          target=base+'?v='+stamp
          updated={'type':'web_app','text':menu['text'],'web_app':{'url':target}}
          telegram('setChatMenuButton',{'menu_button':updated})
          if telegram('getChatMenuButton')!=updated:raise RuntimeError('MENU_VERIFY_FAILED')
          print('TELEGRAM_EXISTING_MENU_REFRESH_VERIFIED',target,flush=True)
          print('DATABASE_PAYMENTS_AND_CUSTOMER_FILES_UNCHANGED',flush=True)
          PY
