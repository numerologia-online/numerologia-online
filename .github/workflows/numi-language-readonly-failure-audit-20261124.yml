name: Audit Love Languages failures read only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-language-readonly-failure-audit-20261124.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read only bounded server log summaries
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,re,collections,datetime
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          domain='xn--c1adkkdfjbp1a4l.online'
          web=home+'/www/'+domain
          dirs=[('home',home),('logs',home+'/logs'),('private/app',home+'/private/numi-account-20261031'),('webroot',web),('api',web+'/api'),('webroot/logs',web+'/logs')]
          candidates={}
          for label,folder in dirs:
              try:
                  entries=ftp.nlst(folder)
                  for name in {x.rstrip('/').rsplit('/',1)[-1] for x in entries}:
                      if re.search(r'(?:error|php|access).*(?:log|txt)(?:\.\d+)?$|^error_log$|^php_errors$|^error\.log$',name,re.I) and '/' not in name and name not in ('.','..'):
                          if not re.search(r'\.gz$|\.zip$',name,re.I):
                              candidates[folder+'/'+name]=label
                  print('LOG_DIRECTORY',label,'accessible',len(entries),flush=True)
              except ftplib.all_errors:
                  print('LOG_DIRECTORY',label,'unavailable',flush=True)
          for file in (domain+'.error.log',domain+'.access.log'):
              candidates.setdefault(home+'/logs/'+file,'logs')
          for folder,label in [(web,'webroot'),(web+'/api','api'),(home+'/private/numi-account-20261031','private/app')]:
              candidates.setdefault(folder+'/error_log',label)
          def read_tail(path):
              ftp.voidcmd('TYPE I');size=ftp.size(path)
              if size is None:return None
              start=max(0,size-4_000_000)
              out=io.BytesIO()
              def add(chunk):
                  if out.tell()+len(chunk)>4_500_000:raise RuntimeError('LOG_LIMIT')
                  out.write(chunk)
              ftp.retrbinary('RETR '+path,add,rest=start if start else None)
              return out.getvalue().decode('utf-8','replace').splitlines()
          def stamp(line):
              m=re.search(r'24/Nov/2026[: ](\d\d):(\d\d):(\d\d)|Nov\s+24\s+(\d\d):(\d\d):(\d\d)|2026-11-24[ T](\d\d):(\d\d):(\d\d)|24-Nov-2026\s+(\d\d):(\d\d):(\d\d)',line)
              if not m:return None
              return ':'.join(x for x in m.groups() if x is not None)
          lang=collections.Counter();provider=collections.Counter();access=collections.Counter()
          allowed={'love-language','how-to-talk','accept-love','show-love','criticism','ask','distance','hurt','conflict-style','compliment'}
          for path,label in list(candidates.items())[:30]:
              try:
                  lines=read_tail(path)
                  if lines is None:continue
                  print('LOG_READ',label,path.rsplit('/',1)[-1][:90],len(lines),flush=True)
                  for line in lines:
                      t=stamp(line)
                      m=re.search(r'LANGUAGE_RESULT_FAIL question=([a-z-]+) reason=([A-Z][A-Z0-9_]{2,79})',line)
                      if m and m.group(1) in allowed:
                          lang[(t or 'undated',m.group(1),m.group(2))]+=1
                      if 'INTIMACY_PROVIDER' in line and 'google/gemini-3-flash-preview' in line:
                          m=re.search(r'"error"\s*:\s*"([A-Z0-9_]{3,80})"',line)
                          h=re.search(r'"http_status"\s*:\s*(\d{1,3})',line)
                          f=re.search(r'"finish_reason"\s*:\s*"([a-zA-Z_]{1,35})"',line)
                          if m:provider[(t or 'undated',m.group(1),h.group(1) if h else '-',f.group(1) if f else '-')]+=1
                      a=re.search(r'"POST\s+(/api/(?:numi-language-free|numi-owner-material)\.php)(?:\?[^\s"]*)?\s+HTTP/[^"]+"\s+(\d{3})\s',line)
                      if a and t:access[(t[:5],a.group(1),a.group(2))]+=1
              except ftplib.all_errors + (RuntimeError,) as e:
                  print('LOG_READ_UNAVAILABLE',label,type(e).__name__,flush=True)
          ftp.quit()
          print('LANGUAGE_FAILURES',list(lang.items())[-80:],flush=True)
          print('GEMINI_FAILURES',list(provider.items())[-80:],flush=True)
          print('ENDPOINT_STATUS',list(access.items())[-100:],flush=True)
          print('READ_ONLY_AUDIT_COMPLETE no_model_calls=true no_site_writes=true',flush=True)
          PY
