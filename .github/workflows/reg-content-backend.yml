name: Deploy native REG.RU private content backend
on:
  push:
    branches: [main]
    paths: ['.github/numi-content-release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-native-content-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install private PHP backend and validate original content
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-content-backend.py
