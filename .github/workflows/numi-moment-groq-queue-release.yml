name: Moment 300 owner-only Groq queue release (no other sections)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-groq-queue-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Isolated queue and editor preflight
        run: |
          php -l moment/owner-queue.php
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('moment/owner-queue.php').read_text('utf8')
          page=pathlib.Path('moment/owner-preview.html').read_text('utf8')
          assert 'naTestOwner($owner)' in p
          assert "private/numi-moment-groq/jobs" in p
          assert "owner-queue.php" in page
          assert "ownerQueueJobKey" in page
          assert page.count("owner-ai.php")==1
          assert len(json.loads(pathlib.Path('moment/questions.json').read_text('utf8'))['questions'])==300
          assert "moment/owner-queue.php" not in (str(pathlib.Path('cloudflare/telegram-bot/wrangler.jsonc').read_text('utf8')))
          code=page.split('<script>',1)[1].split('</script>',1)[0]
          pathlib.Path('/tmp/moment-queue-editor.js').write_text(code,'utf8')
          print('MOMENT_QUEUE_EDITOR_PREFLIGHT_OK')
          PY
          node --check /tmp/moment-queue-editor.js
      - name: Publish only queue API and editor, create private queue directory
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,io,ftplib,ssl,hashlib,subprocess,urllib.request,urllib.error,json,time,pathlib
          def sha(b):return hashlib.sha256(b).hexdigest()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          site=home+'/www/xn--c1adkkdfjbp1a4l.online/moment'
          public=site+'/owner-preview.html'
          backend=site+'/owner-queue.php'
          jobs=home+'/private/numi-moment-groq/jobs'
          backed=home+'/site-safeguard-backups'
          expected_previous=subprocess.check_output(['git','show','5c4f48fcc5aef082b7ec5407c12999cdceb918de^:moment/owner-preview.html'])
          page=pathlib.Path('moment/owner-preview.html').read_bytes()
          service=pathlib.Path('moment/owner-queue.php').read_bytes()
          def read(path):
            stream=io.BytesIO()
            try:ftp.retrbinary('RETR '+path,stream.write)
            except ftplib.error_perm as e:
              if str(e).startswith('550'):return None
              raise
            return stream.getvalue()
          def write(path,data):
            ftp.storbinary('STOR '+path,io.BytesIO(data))
            if read(path)!=data:raise RuntimeError('FTP_READBACK_MISMATCH')
          def online(name):
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/'+name+'?queue_release_check='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiMomentOwnerQueueRelease/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=28) as r:return r.status,r.read(300000)
            except urllib.error.HTTPError as e:return e.code,e.read(2000)
          old_page=None
          old_backend=None
          had_jobs=False
          wrote=[]
          try:
            old_page=read(public)
            old_backend=read(backend)
            if old_page not in (expected_previous,page):raise RuntimeError('LIVE_EDITOR_UNEXPECTED_REFUSE_OVERWRITE')
            if old_backend not in (None,service):raise RuntimeError('LIVE_QUEUE_UNEXPECTED_REFUSE_OVERWRITE')
            core=read(home+'/private/numi-account-20261031/core.php')
            if not core or b'function naTestOwner' not in core:raise RuntimeError('OWNER_AUTH_NOT_VERIFIED')
            if not read(home+'/private/numi-moment-groq/config.local.php'):raise RuntimeError('MOMENT_PRIVATE_DIRECTORY_MISSING')
            status,raw=online('questions.json')
            if status!=200 or len(json.loads(raw)['questions'])!=300:raise RuntimeError('LIVE_MOMENT_CATALOG_INCOMPLETE')
            try:
              ftp.cwd(jobs);had_jobs=True
            except ftplib.error_perm as e:
              if not str(e).startswith('550'):raise
              ftp.mkd(jobs)
            ftp.cwd(home)
            backup=backed+'/moment-owner-before-groq-queue-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
            if old_page!=page:
              write(backup,old_page)
              if read(public)!=old_page:raise RuntimeError('EDITOR_CONCURRENT_CHANGE')
            if old_backend!=service:
              write(backend,service)
              wrote.append((backend,old_backend))
            if old_page!=page:
              write(public,page)
              wrote.append((public,old_page))
            status,live=online('owner-preview.html')
            if status!=200 or sha(live)!=sha(page):raise RuntimeError('LIVE_PAGE_SHA_MISMATCH')
            status,raw=online('owner-queue.php')
            if status!=403:raise RuntimeError('QUEUE_OWNER_GATE_NOT_403')
            status,raw=online('owner-ai.php')
            if status!=403:raise RuntimeError('ORIGINAL_OWNER_GATE_NOT_403')
            print('MOMENT_GROQ_QUEUE_DEPLOYED_OK editor_and_backend_only=true owner_403=true site_sha_match=true no_payment_changes=true')
          except BaseException:
            for dest,prev in reversed(wrote):
              try:
                if prev is None:ftp.delete(dest)
                else:write(dest,prev)
                print('MOMENT_QUEUE_RELEASE_ROLLBACK_OK file='+dest.rsplit('/',1)[-1])
              except Exception:
                print('MOMENT_QUEUE_RELEASE_ROLLBACK_FAILED file='+dest.rsplit('/',1)[-1])
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
