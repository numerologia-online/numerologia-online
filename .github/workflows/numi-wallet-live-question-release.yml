name: Release owner-only inline YooKassa test wallet on actual Red Flag question
on:
  push:
    paths:
      - .github/workflows/numi-wallet-live-question-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release owner-only inline wallet test on actual question')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Syntax and isolated test-only source validation
        shell: bash
        run: |
          set -euo pipefail
          node --check wallet-owner-flow-20261106.js
          python3 -m py_compile .github/scripts/numi_wallet_live_question_release.py
          git fetch --no-tags origin feature/wallet-yookassa-test-20261106
          git show 8e75cd84791725dcc693929e017a1500e204e8c9:wallet-service/private/test-core.php > /tmp/numi-owner-wallet-core.php
          php -l /tmp/numi-owner-wallet-core.php
          python3 - <<'PY'
          from pathlib import Path
          code=Path("wallet-owner-flow-20261106.js").read_text()
          assert "redflag-question.is-calculated" in code
          assert "data-question-id=\"generosity\"" in code
          assert "numi-wallet-test.php" in code
          assert "localStorage" not in code
          assert "numi-owner-wallet-tile" in code
          assert "TEST" in code
          print("OWNER_WALLET_PILOT_PRECHECK_OK")
          PY
      - name: Guarded REG.RU publication, back up and verify only minimal site entrypoint
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_wallet_live_question_release.py

# Live app script tag selected by checked exact match on active site.
