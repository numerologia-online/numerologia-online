name: Publish complete free Red Flag boundary answer without teaser
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-free-say-no-full-answer-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fully rendered free question and all three answers
        run: |
          set -euo pipefail
          node --check redflag-feature.js
          node --check app.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {PUBLIC_QUESTIONS,PUBLIC_CATEGORIES} from './redflag-public-catalog.js';
          import {loadQuestionBank} from './redflag-text-bank.js';
          const question=PUBLIC_QUESTIONS.flags[0];
          assert.equal(question.id,'say-no');
          assert.equal(question.status,'ready');
          assert.ok(!('observation' in question));
          const bank=await loadQuestionBank('flags');
          for(const variant of ['firm','soft','porous']){
            const response=await bank.QUESTIONS[0].answer({boundaries:variant});
            assert.ok(response.answer.length>=750 && response.answer.length<=1200,variant);
            assert.equal(response.paragraphs?.length,2,variant);
            assert.equal(response.paragraphs.join('\n\n'),response.answer,variant);
            assert.ok(!response.answer.includes(':')&&!response.answer.includes('—'),variant);
            assert.ok(!response.verdict&&!response.observation,variant);
          }
          assert.ok(!PUBLIC_CATEGORIES.find(x=>x.id==='flags').description.includes(':'));
          console.log('REDFLAG_FREE_FULL_ANSWERS_VERIFIED variants=3 paragraphs=2 paid_banks_unchanged=true');
          JS
          python3 - <<'PY'
          from pathlib import Path
          feature=Path('redflag-feature.js').read_text()
          assert 'showInlinePurchase(item,target,' in feature
          assert 'if(!question?.isFree||question.isComingSoon)return;' in feature
          version='free-say-no-full-text-20261117'
          paths=[
            ('redflag-text-bank.js','redflag-public-catalog.js'),
            ('redflag-categories.js','redflag-text-bank.js'),
            ('redflag-feature.js','redflag-categories.js'),
            ('app.js','redflag-feature.js'),
            ('index.html','app.js'),
          ]
          for source,target in paths:
              assert target+'?v='+version in Path(source).read_text(),source
          print('REDFLAG_ALL_CACHE_VERSIONS_MATCH',flush=True)
          PY
      - name: Backup and publish only six Red Flag front-end files, verify public hashes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,io,hashlib,subprocess,time,urllib.request
          files=['redflag-public-catalog.js','redflag-text-bank.js','redflag-categories.js','redflag-feature.js','app.js','index.html']
          desired={file:Path(file).read_bytes() for file in files}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          known={}
          for file in files:
              commits=subprocess.check_output(['git','log','--format=%H','-n','250','--',file],text=True).splitlines()
              known[file]={sha(subprocess.check_output(['git','show',rev+':'+file])) for rev in commits}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          prefix=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(file):
              out=io.BytesIO()
              ftp.retrbinary('RETR '+prefix+file,out.write)
              return out.getvalue()
          def write(file,content):
              ftp.storbinary('STOR '+prefix+file,io.BytesIO(content))
              if read(file)!=content:raise RuntimeError('REDFLAG_OWNER_UI_FTP_READBACK_FAILED:'+file)
          original={};changed=[]
          try:
              original={file:read(file) for file in files}
              for file in files:
                  if sha(original[file]) not in known[file]:
                      raise RuntimeError('UNKNOWN_LIVE_VERSION_NO_OVERWRITE:'+file)
              backupDir=root+'/site-safeguard-backups'
              try:ftp.mkd(backupDir)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for file in files:
                  backup=backupDir+'/redflag-owner-one-answer-'+stamp+'-'+file+'.bak'
                  ftp.storbinary('STOR '+backup,io.BytesIO(original[file]))
                  check=io.BytesIO()
                  ftp.retrbinary('RETR '+backup,check.write)
                  if check.getvalue()!=original[file]:raise RuntimeError('BACKUP_CHECK_FAILED:'+file)
              for file in files:
                  if read(file)!=original[file]:raise RuntimeError('LIVE_CHANGED_DURING_BACKUP:'+file)
                  if desired[file]!=original[file]:
                      changed.append(file)
                      write(file,desired[file])
              for file in files:
                  url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+file+'?owner_ai_verify='+str(time.time_ns())
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as res:live=res.read(250000)
                  if sha(live)!=sha(desired[file]):
                      raise RuntimeError('PUBLIC_SHA_MISMATCH:'+file)
              print('OWNER_AI_ONE_ANSWER_IN_REDFLAG_LIVE_OK unchanged_paid_banks=true',flush=True)
          except BaseException:
              for file in reversed(changed):
                  try:write(file,original[file]);print('ROLLBACK_OK',file,flush=True)
                  except BaseException:print('ROLLBACK_FAILED',file,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Confirm Red Flag owner AI live on REG.RU
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-free-full-answer-live" -f description="Verified full two-paragraph free boundary answer and six static files live" >/dev/null
      - name: Flag incomplete Red Flag owner AI publication
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-free-full-answer-live" -f description="Free boundary answer publication failed or not verified; paid files untouched" >/dev/null
