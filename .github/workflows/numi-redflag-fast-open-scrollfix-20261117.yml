name: Publish Red Flag immediate open and stable scroll, only four public files
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-fast-open-scrollfix-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no payment or other feature change before release
        run: |
          set -euo pipefail
          node --input-type=module --check < redflag-feature.js
          node --input-type=module --check < wallet-client.js
          node --input-type=module --check < app.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('redflag-feature.js').read_text()
          wallet=Path('wallet-client.js').read_text()
          app=Path('app.js').read_text()
          page=Path('index.html').read_text()
          assert "}, 145);" not in js
          assert 'card.replaceChildren(...updated.childNodes)' in js
          assert 'const stabilize = () =>' in js
          assert 'Проверяем доступ к ответу…' in js
          assert 'wallet-client.js?v=fast-redflag-owner-20261117' in js
          assert '/api/numi-owner-material.php' in wallet
          assert 'ownerVerifiedUntil=Date.now()+60000' in wallet
          assert 'redflag-feature.js?v=fast-open-no-scroll-20261117' in app
          assert 'src="app.js?v=fast-redflag-scroll-20261117"' in page
          assert 'numi:account-session-changed' in wallet
          assert 'product_code:"redflag_question"' in js
          print('REDFLAG_SCROLL_AND_WAIT_PATCH_SOURCE_OK',flush=True)
          PY
      - name: Back up and publish only four matching site files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,pathlib,ssl,subprocess,time,urllib.request
          paths=['redflag-feature.js','wallet-client.js','app.js','index.html']
          desired={p:pathlib.Path(p).read_bytes() for p in paths}
          sha=lambda data:hashlib.sha256(data).hexdigest()
          history={}
          for p in paths:
              versions=subprocess.check_output(['git','log','--format=%H','-n','140','--',p],text=True).splitlines()
              history[p]={sha(subprocess.check_output(['git','show',commit+':'+p])) for commit in versions}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          live=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              buffer=io.BytesIO();ftp.retrbinary('RETR '+live+p,buffer.write)
              return buffer.getvalue()
          def put(p,data):
              ftp.storbinary('STOR '+live+p,io.BytesIO(data))
              if read(p)!=data:raise RuntimeError('REDFLAG_FTP_READBACK_MISMATCH:'+p)
          before={};changed=[]
          try:
              before={p:read(p) for p in paths}
              for p in paths:
                  if sha(before[p]) not in history[p]:
                      raise RuntimeError('UNRECOGNIZED_LIVE_CONTENT_ABORT:'+p)
              backup=root+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm as error:
                  if not str(error).startswith('550'):raise
              tag=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  target=backup+'/redflag-scrollfix-'+tag+'-'+p+'.bak'
                  ftp.storbinary('STOR '+target,io.BytesIO(before[p]))
                  checked=io.BytesIO();ftp.retrbinary('RETR '+target,checked.write)
                  if checked.getvalue()!=before[p]:raise RuntimeError('BACKUP_MISMATCH:'+p)
              for p in paths:
                  if read(p)!=before[p]:raise RuntimeError('CONCURRENT_SITE_EDIT_ABORT:'+p)
                  if desired[p]!=before[p]:
                      changed.append(p);put(p,desired[p])
              for p in paths:
                  url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?redflag_scrolldebug='+str(time.time_ns())
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      actual=response.read(len(desired[p])+4096)
                  if sha(actual)!=sha(desired[p]):raise RuntimeError('PUBLIC_FILE_NOT_CURRENT:'+p)
              print('REDFLAG_QUICK_OPEN_LIVE_VERIFIED files=4 no_paid_changes=true',flush=True)
          except BaseException:
              for p in reversed(changed):
                  try:put(p,before[p]);print('REDFLAG_SCROLLFIX_ROLLBACK_OK '+p,flush=True)
                  except BaseException:print('REDFLAG_SCROLLFIX_ROLLBACK_FAILED '+p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
      - name: Report successful Red Flag fix
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="numi/redflag-fast-scroll-live" -f description="Red Flag no-jump and quick loading verified on new site" >/dev/null
      - name: Report failed Red Flag fix
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context="numi/redflag-fast-scroll-live" -f description="Red Flag changes not verified on new site, safety rollback attempted" >/dev/null
