name: Private Red Flag Groq 120B direct quality comparison
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-direct-groq-quality-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Generate eight isolated, unapproved Red Flag Groq answers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, re, pathlib, urllib.request, urllib.error
          key=os.environ.get("GROQ_API_KEY","")
          if not key.startswith("gsk_"):
              raise SystemExit("GROQ_SECRET_UNAVAILABLE")
          system="Ты опытный нумеролог, работающий с 22 энергиями Матрицы судьбы. Женщина задала конкретный вопрос о мужчине и хочет получить на него понятный, интересный и полезный ответ.\n\nНачни сразу с ответа на сам вопрос. Уже первое предложение должно дать ясный вывод. Если вопрос предлагает два варианта, скажи, какой вероятнее, или объясни, как проявляются оба. Не начинай с вступлений вроде «Слушай», «Знаешь», «Тут ситуация непростая» и не открывай ответ общим портретом мужчины. Не используй одну и ту же начальную формулу для всех вопросов.\n\nСначала пойми, о каком конкретном поступке спрашивает женщина. Самостоятельно используй свои знания системы 22 энергий, без готовых списков характеристик и предписанных сценариев. Дай энергии дня и энергии месяца строго равный вес, 50 на 50. Ни одна из них не главная и не вспомогательная. Исследуй их взаимодействие именно для этого вопроса: где они усиливают, смягчают или меняют проявления друг друга. Вывод делай только из сочетания, а не из одной энергии с декоративным дополнением второй. Если месяц изменился, заново осмысли сочетание, не перекрашивай прежний ответ парой слов. Для разных вопросов об одном мужчине выбирай разные уместные стороны сочетания, не повторяй привычный портрет. Если энергии одинаковые, исследуй их совместное усиление, не выдумывай искусственные различия. Не придумывай свойства человека только ради разнообразия. Промежуточный анализ не показывай женщине.\n\nРассказывай прежде всего, как это может проявиться в поступках и общении с женщиной, на что ей обратить внимание и чем это может обернуться в отношениях. Причины поведения объясняй, когда это помогает понять ситуацию, но не подменяй ими ответ и не оправдывай неприятные поступки. Не придумывай мужчине жестокость или измены только ради красного флага и не приукрашивай его ради приятного впечатления.\n\nПиши легко, естественно и обычными человеческими словами, как наблюдательная доброжелательная женщина разговаривает с подругой. Можно с теплом, точностью, лёгкой иронией и характером. Пусть интерес вызывают узнаваемые наблюдения, а не торжественные фразы, философские образы и длинные рассуждения. Не делай мужчину загадкой, которую читательнице нужно разгадывать.\n\nСохраняй узнаваемость мужчины между вопросами, но каждый раз отвечай на новую тему. Не повторяй общий портрет, если женщина спрашивает о ревности, отказе, извинениях, помощи или другой конкретной ситуации. Излагай трактовку как возможные склонности, а не как доказанные поступки реального человека.\n\nНе упоминай числа, названия энергий, арканы и способы расчёта. Женщина должна получить готовый ответ, а не объяснение нумерологической методики.\n\nВсего два абзаца и ориентир 750–1100 символов с пробелами. Первый абзац это прямой ответ с понятными проявлениями поведения. Второй абзац это короткий, естественный переход к одному действительно доступному вопросу из другого раздела, который дополняет тему. Без заголовков, списков, двоеточий и длинных тире."
          titles={
              "hero":"Скромный мужчина или считает себя подарком судьбы?",
              "say-no":"Уважает женское «нет» или начинает давить?"
          }
          focus={
              "hero":"Как мужчина оценивает себя, принимает похвалу и ведёт себя при несогласии.",
              "say-no":"Как мужчина реагирует на отказ женщины, выдерживает её границы и пытается ли надавить."
          }
          followups=[
              "Держит слово или опять одни красивые разговоры?",
              "Будет опорой для семьи или всё снова окажется на твоих плечах?",
              "Щедрый мужчина или считает каждую копейку?",
              "Пишет первым или ждёт инициативы от женщины?",
              "Верный или у него каждая вторая «просто подруга»?",
              "На каком языке любви он вообще понимает чувства?",
              "Самостоятельный мужчина или мамина корзиночка?",
              "Какой финальный вердикт по этому мужчине без розовых очков?",
              "Будет ли мужчина жить за твой счёт?",
              "Сексуальный огонь или пять минут — и спасибо?"
          ]
          result=[]
          for month in (1,3,9,10):
              for qid in ("hero","say-no"):
                  message=("Вопрос: "+titles[qid]+"\n"
                           +"Тема вопроса: "+focus[qid]+"\n"
                           +"День мужчины: 9 (энергия 9).\n"
                           +"Месяц мужчины: "+str(month)+" (энергия "+str(month)+").\n"
                           +"Реально доступные следующие вопросы: "+json.dumps(followups,ensure_ascii=False))
                  payload={
                      "model":"openai/gpt-oss-120b",
                      "temperature":0.7,
                      "reasoning_effort":"medium",
                      "max_completion_tokens":1700,
                      "stream":False,
                      "messages":[{"role":"system","content":system},{"role":"user","content":message}]
                  }
                  request=urllib.request.Request(
                      "https://api.groq.com/openai/v1/chat/completions",
                      data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                      method="POST",
                      headers={"Authorization":"Bearer "+key,"Content-Type":"application/json",
                               "Accept":"application/json","User-Agent":"NumiRedFlagIsolatedGroq120B/1.0"}
                  )
                  error=None
                  answer=""
                  usage=0
                  status=0
                  for attempt in range(4):
                      try:
                          with urllib.request.urlopen(request,timeout=90) as res:
                              status=res.status
                              out=json.load(res)
                          answer=out.get("choices",[{}])[0].get("message",{}).get("content") or ""
                          usage=out.get("usage",{}).get("total_tokens",0)
                          break
                      except urllib.error.HTTPError as exc:
                          status=exc.code
                          if exc.code==429 and attempt<3:
                              delay=min(max(float(exc.headers.get("retry-after","35")),5),90)
                              print("GROQ_LIMIT_RETRY",month,qid,int(delay),flush=True)
                              time.sleep(delay)
                              continue
                          error="GROQ_HTTP_"+str(exc.code)
                          break
                      except Exception as exc:
                          error="GROQ_"+type(exc).__name__
                          break
                  row={"date":"09."+str(month).zfill(2),"question":qid,
                       "model":"openai/gpt-oss-120b","http":status,"ok":bool(answer.strip()),
                       "answer":answer.strip(),"tokens":usage,"error":error,
                       "draft_only":True,"published":False}
                  result.append(row)
                  print("GROQ_COMPARE",row["date"],qid,"http",status,
                        "chars",len(answer),"tokens",usage,"error",error,flush=True)
                  time.sleep(17)
          folder=pathlib.Path("redflag-groq-probe-output")
          folder.mkdir(exist_ok=True)
          (folder/"redflag-groq-comparison.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          txt=[]
          for r in result:
              txt.append(r["date"]+" | "+r["question"]+" | HTTP "+str(r["http"])+"\n"+r["answer"]+"\n")
          (folder/"redflag-groq-comparison.txt").write_text("\n".join(txt),encoding="utf-8")
          success=sum(bool(r["ok"]) for r in result)
          print("GROQ_DIRECT_SUMMARY",success,"/",len(result),"strictly unpublished tests",flush=True)
          if success==0:
              raise SystemExit("GROQ_NO_VALID_OUTPUT")
          PY
      - name: Save private comparison artifact (no buyer data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redflag-groq120b-direct-comparison-20261118
          path: redflag-groq-probe-output/
          retention-days: 1
          if-no-files-found: warn
