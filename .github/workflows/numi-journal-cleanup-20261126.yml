name: Remove repetitive journal disclaimers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-journal-cleanup-20261126.yml', '.github/scripts/journal-cleanup.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Scan public HTML, verify, publish and synchronize
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/journal-cleanup.py
