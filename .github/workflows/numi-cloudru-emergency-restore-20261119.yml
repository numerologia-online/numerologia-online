name: Emergency restore pre-Cloud.ru website frontend, disable Cloud.ru endpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-cloudru-emergency-restore-20261119.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 110
      - name: Validate original scripts
        run: |
          node --input-type=module --check < redflag-feature.js
          node --input-type=module --check < app.js
          python3 - <<'PY'
          import subprocess, hashlib
          paths=('redflag-feature.js','app.js','index.html')
          ref='35615a2b313cef4539963a5d57d7faea40168a28'
          for p in paths:
              expected=subprocess.check_output(['git','show',ref+':'+p])
              actual=open(p,'rb').read()
              assert actual==expected, 'refuse nonbaseline restore: '+p
          print('ORIGINAL_FILES_VALIDATED_AND_UNMODIFIED')
          PY
      - name: Restore only three frontend files, remove new API, check homepage
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,io,hashlib,subprocess,urllib.request,urllib.error,time
          paths=['redflag-feature.js','app.js','index.html']
          obsolete='api/redflag-cloudru.php'
          target={p:Path(p).read_bytes() for p in paths}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          permitted={}
          for p in paths+[obsolete]:
              versions=subprocess.check_output(['git','log','-n','110','--format=%H','--',p],text=True).splitlines()
              approved=set()
              for rev in versions:
                  try:
                      approved.add(sha(subprocess.check_output(['git','show',rev+':'+p],stderr=subprocess.DEVNULL)))
                  except subprocess.CalledProcessError:pass
              permitted[p]=approved
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backups=home+'/site-safeguard-backups'
          def read(path):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+root+path,b.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+root+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('RESTORE_FILE_READBACK_FAILED_'+path)
          previous={};changed=[]
          try:
              try:ftp.mkd(backups)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              for p in paths+[obsolete]:
                  previous[p]=read(p)
                  if previous[p] is not None and sha(previous[p]) not in permitted[p]:
                      raise RuntimeError('LIVE_FILE_UNKNOWN_REFUSE_OVERWRITE_'+p)
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p,old in previous.items():
                  if old is None or (p in target and old==target[p]):continue
                  bak=backups+'/cloudru-emergency-restore-'+stamp+'-'+p.replace('/','-')+'.bak'
                  ftp.storbinary('STOR '+bak,io.BytesIO(old))
                  b=io.BytesIO();ftp.retrbinary('RETR '+bak,b.write)
                  if b.getvalue()!=old:raise RuntimeError('RESTORE_BACKUP_FAILED_'+p)
              for p in paths:
                  if previous[p]!=target[p]:
                      changed.append(p)
                      write(p,target[p])
              if previous[obsolete] is not None:
                  changed.append(obsolete)
                  ftp.delete(root+obsolete)
                  if read(obsolete) is not None:raise RuntimeError('CLOUDRU_ENDPOINT_NOT_REMOVED')
              site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
              for p in paths:
                  req=urllib.request.Request(site+p+'?restore='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=28) as res:
                      data=res.read(350000)
                      if res.status!=200 or sha(data)!=sha(target[p]):
                          raise RuntimeError('LIVE_RESTORE_HTTP_HASH_MISMATCH_'+p)
              req=urllib.request.Request(site,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=28) as res:
                  if res.status!=200:raise RuntimeError('HOMEPAGE_NOT_200')
              req=urllib.request.Request(site+obsolete,headers={'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      raise RuntimeError('DISABLED_ENDPOINT_STILL_ACTIVE')
              except urllib.error.HTTPError as e:
                  if e.code not in (403,404,410):raise RuntimeError('ENDPOINT_UNEXPECTED_'+str(e.code))
              print('WEBSITE_PRE_CLOUDRU_RESTORED live_frontend_hashes_match=true homepage_200=true cloudru_api_removed=true model_calls=0 payment_unchanged=true',flush=True)
          except BaseException:
              for p in reversed(changed):
                  try:
                      if previous[p] is None:ftp.delete(root+p)
                      else:write(p,previous[p])
                      print('RESTORE_ROLLBACK',p,flush=True)
                  except Exception:print('RESTORE_ROLLBACK_FAILED',p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY