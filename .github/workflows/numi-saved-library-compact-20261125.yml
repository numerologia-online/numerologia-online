name: Publish compact saved materials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-saved-library-compact-20261125.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'Show saved materials as compact Russian links'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check account-browser.js
      - name: Verify the public catalog and publish only the saved-list changes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, io, json, os, pathlib, ssl, subprocess, time, urllib.error, urllib.request
          files = ('account-browser.js', 'index.html')
          baseline = {p: subprocess.check_output(['git', 'show', 'HEAD^:'+p]) for p in files}
          desired = {p: pathlib.Path(p).read_bytes() for p in files}
          origin = 'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          tag = 'saved-library-lines-20261125'

          def request(path, data=None):
              req = urllib.request.Request(
                  origin + '/' + path, data=data,
                  headers={'Cache-Control':'no-cache','Origin':origin,'Content-Type':'application/json'})
              try:
                  resp = urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError as error:
                  resp = error
              with resp:
                  return resp.status, resp.read(2000000)

          def get(path):
              status, content = request(path)
              assert status == 200, 'PUBLIC_STATUS_' + path
              return content

          catalog = json.loads(get('store-catalog.json'))
          assert any(q.get('id') == 'generosity' and q.get('category') == 'money'
                     and 'Щедрый мужчина' in q.get('title', '') for q in catalog['redflag']), 'LIVE_CATALOG_TITLE'
          print('LIVE_RUSSIAN_CATALOG_VERIFIED')

          nonce = str(time.time_ns())
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25) as ftp:
              ftp.connect('server172.hosting.reg.ru', 21)
              ftp.login(os.environ['REG_FTP_USER'], os.environ['REG_FTP_PASSWORD'])
              ftp.prot_p()
              home = ftp.pwd().rstrip('/')
              web = home + '/www/xn--c1adkkdfjbp1a4l.online/'
              backup = home + '/site-safeguard-backups/compact-saved-library-' + nonce

              def read(path):
                  buf = io.BytesIO()
                  ftp.retrbinary('RETR ' + path, buf.write)
                  return buf.getvalue()

              def write(path, data):
                  ftp.storbinary('STOR ' + path, io.BytesIO(data))
                  assert read(path) == data, 'STAGED_BYTES'

              before = {p: read(web + p) for p in files}
              for p in files:
                  assert before[p] in (baseline[p], desired[p]), 'LIVE_CHANGED_' + p
                  assert get(p + '?saved_library_preflight=' + nonce) == before[p], 'WRONG_SITE_ROOT_' + p

              ftp.mkd(backup)
              changes = [p for p in files if before[p] != desired[p]]
              for p in changes:
                  write(backup + '/' + p + '.bak', before[p])
                  write(backup + '/' + p + '.ready', desired[p])

              installed = []
              try:
                  for p in changes:
                      assert read(web + p) == before[p], 'CONCURRENT_CHANGE_' + p
                      ftp.rename(backup + '/' + p + '.ready', web + p)
                      installed.append(p)
                      assert read(web + p) == desired[p], 'INSTALLED_BYTES_' + p
                  assert get('?saved_library=' + nonce) == desired['index.html'], 'LIVE_HOME'
                  for p in files[:1]:
                      assert get(p + '?v=' + tag) == desired[p], 'LIVE_SCRIPT_' + p
              except BaseException:
                  for p in reversed(installed):
                      ftp.rename(backup + '/' + p + '.bak', web + p)
                      assert read(web + p) == before[p], 'ROLLBACK_BYTES_' + p
                  raise
          print('SAVED_LIBRARY_COMPACT_ROWS_LIVE')
          PY
