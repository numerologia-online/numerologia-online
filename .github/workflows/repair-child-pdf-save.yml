name: Repair child PDF save inside Telegram and audit full life viewer
on:
  push:
    branches: [child-owner-live-repair-20261127]
    paths: ['.github/workflows/repair-child-pdf-save.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify only PDF opening changed
        run: |
          node --input-type=module --check < child/child.js
          node --input-type=module --check < child/child-pdf-preview-20261127.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=fs.readFileSync('child/child.js','utf8');
          const viewer=fs.readFileSync('child/child-pdf-preview-20261127.js','utf8');
          assert(source.includes('if(!hasChildPaidAccess()||childPdfKey(birth)!==childPdfKey(date))'));
          assert(source.includes('openChildPdfPanel({file,url,filename})'));
          assert(viewer.includes('await navigator.share({files:[file]})'));
          assert(viewer.includes('actions.append(shareButton)'));
          assert(viewer.includes('dialog.showModal()'));
          assert(viewer.includes('downloadButton.addEventListener("click",downloadFile)'));
          assert(viewer.includes('URL.revokeObjectURL(url)'));
          console.log('CHILD_PDF_ACCESS_AND_SAVE_TOOLBAR_STATIC_PASS');
          JS
      - name: Patch only live child PDF click handler and cache version with backups
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,socket,os,re,io,pathlib,time,urllib.request,subprocess
          h=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(h)
          ptr=socket.gethostbyaddr(h)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert h in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def get(p):
              req=urllib.request.Request(origin+p+('?' if '?' not in p else '&')+'verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200
                  return r.read(2200001)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect(ptr,21);ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          def read(p,optional=False):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+p,b.write)
              except ftplib.error_perm as e:
                  if optional and str(e).startswith('550'):return None
                  raise
              return b.getvalue()
          def put(p,d):
              ftp.storbinary('STOR '+p,io.BytesIO(d))
              assert read(p)==d
          def lint(d):subprocess.run(['node','--input-type=module','--check'],input=d,check=True)
          try:
              home=ftp.pwd().rstrip('/')
              root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
              js='child/child.js';html='child/index.html';viewer='child/child-pdf-preview-20261127.js'
              before={p:read(root+p) for p in (js,html)}
              assert all(get(p)==d for p,d in before.items()),'LIVE_ROOT_MISMATCH'
              old=b'''    const url=URL.createObjectURL(blob);
              const link=document.createElement("a");
              link.href=url;
              link.download=filename;
              link.target="_blank";
              link.rel="noopener";
              document.body.append(link);
              link.click();
              link.remove();
              window.setTimeout(()=>URL.revokeObjectURL(url),120000);'''
              old=b'\n'.join([old.split(b'\n')[0]]+[b'    '+s.lstrip() for s in old.split(b'\n')[1:]])
              desired=pathlib.Path(js).read_bytes()
              start=desired.index(b'    const {openChildPdfPanel}=await import(')
              end=desired.index(b'    pdfStatus.textContent=',start)
              replacement=desired[start:end].rstrip(b'\n')
              assert before[js].count(old)==1,'LIVE_CHILD_PDF_HANDLER_CHANGED'
              updated=before[js].replace(old,replacement,1)
              assert updated.replace(replacement,old,1)==before[js]
              assert b'ownerChild={key,material}' in updated
              lint(updated)
              newhtml,n=re.subn(rb'(src="\./child\.js\?v=)[^"]+(")',rb'\g<1>child-pdf-save-20261127\2',before[html])
              assert n==1
              code=pathlib.Path(viewer).read_bytes();lint(code)
              previous=read(root+viewer,True)
              assert previous in (None,code)
              backup=home+'/site-safeguard-backups/child-pdf-save-'+os.environ['GITHUB_RUN_ID']
              ftp.mkd(backup)
              for i,p in enumerate(before):put(backup+'/'+str(i)+'.bak',before[p])
              print('CHILD_PDF_BACKUPS_VERIFIED')
              touched=[];added=False
              try:
                  if previous is None:put(root+viewer,code);added=True
                  assert get(viewer)==code
                  for i,(p,d) in enumerate(((js,updated),(html,newhtml))):
                      assert read(root+p)==before[p],'CONCURRENT_EDIT'
                      tmp=backup+'/'+str(i)+'.ready'
                      put(tmp,d);ftp.rename(tmp,root+p);touched.append((i,p))
                      assert read(root+p)==d and get(p)==d
                  assert get('child/')==newhtml
                  print('LIVE_CHILD_PDF_PREVIEW_AND_SAVE_TOOLBAR_VERIFIED')
                  print('CHILD_PDF_ENGINE_CONTENT_ACCESS_PAYMENTS_AND_MAILING_UNCHANGED')
              except BaseException:
                  for i,p in reversed(touched):
                      tmp=backup+'/'+str(i)+'.restore'
                      put(tmp,before[p]);ftp.rename(tmp,root+p);assert read(root+p)==before[p]
                  if added:ftp.delete(root+viewer)
                  print('CHILD_PDF_ROLLBACK_VERIFIED')
                  raise
              # Audit full life without changing it.
              try:
                  pro=get('pro/pro.js')
                  secure=get('pro/full-report-pdf-secure.js')
                  panel=get('pro/full-report-pdf-panel.js')
                  assert b'full-report-pdf-secure.js' in pro
                  assert b'openFullReportPdfPanel(fileInfo)' in secure
                  assert b'await navigator.share({files:[file]})' in panel and b'dialog.showModal()' in panel
                  assert b'actions.append(shareButton)' in panel
                  print('LIVE_FULL_LIFE_NATIVE_SHARE_TOOLBAR_PRESENT')
              except Exception:
                  print('FULL_LIFE_TOOLBAR_NOT_CONFIRMED_READ_ONLY')
          finally:ftp.quit()
          PY
