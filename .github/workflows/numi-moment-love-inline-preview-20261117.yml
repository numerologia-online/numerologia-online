name: Publish inline Love question answers preview to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-love-inline-preview-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate owner-only inline Love generation and share
        run: |
          set -euo pipefail
          node --check moment/moment.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('moment/moment.js').read_text()
          css=Path('moment/moment.css').read_text()
          html=Path('moment/index.html').read_text()
          for required in [
            "if(ownerMode && q.category==='love' && q.mode==='partner')",
            "toggleLoveAnswer(q,item,body,b)",
            "question_id:q.id,birth_date:isoDate(self),other_date:isoDate(other)",
            "method:'POST',credentials:'same-origin',cache:'no-store'",
            "addLoveAnswerActions(body,q,data.answer.trim(),self,other)",
            "const loveAnswers=new Map()",
            "function invalidateLoveAnswers()",
            "const response=await fetch('/api/redflag-save.php'",
            "navigator.share({title:q.title,text:report})",
            "showComingSoon(q.title)",
            "data?.ok===true",
          ]:
            assert required in js,required
          assert "/* Inline Love answers: verified-owner preview." in css
          assert "./moment.css?v=love-inline-20261117" in html
          assert "./moment.js?v=love-inline-20261117" in html
          assert 'id="moment-pair-dates"' in html
          assert '<h3 id="results-title">Все вопросы</h3>' in html
          assert '49 ₽ за вопрос' in html
          print('MOMENT_INLINE_LOVE_PREVIEW_VALIDATED',flush=True)
          PY
      - name: Backup, safely upload only three Moment frontend files, verify public readback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          paths=['moment/moment.js','moment/moment.css','moment/index.html']
          desired={p:Path(p).read_bytes() for p in paths}
          def sha(b):return hashlib.sha256(b).hexdigest()
          baselines={}
          for p in paths:
            revs=subprocess.check_output(['git','log','--format=%H','-n','180','--',p],text=True).splitlines()
            baselines[p]={sha(subprocess.check_output(['git','show',rev+':'+p])) for rev in revs}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
            stream=io.BytesIO()
            ftp.retrbinary('RETR '+root+p,stream.write)
            return stream.getvalue()
          def put(p,body):
            ftp.storbinary('STOR '+root+p,io.BytesIO(body))
            if sha(read(p))!=sha(body):raise RuntimeError('FTP_READBACK_MISMATCH '+p)
          touched=[]
          try:
            original={p:read(p) for p in paths}
            for p in paths:
              if sha(original[p]) not in baselines[p]:
                raise RuntimeError('UNKNOWN_LIVE_VERSION: '+p)
            backup_dir=home+'/site-safeguard-backups'
            try:ftp.mkd(backup_dir)
            except ftplib.error_perm as error:
              if not str(error).startswith('550'):raise
            stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            for p in paths:
              basename=p.replace('/','-')
              archive=backup_dir+'/moment-inline-love-'+stamp+'-'+basename+'.bak'
              ftp.storbinary('STOR '+archive,io.BytesIO(original[p]))
              result=io.BytesIO()
              ftp.retrbinary('RETR '+archive,result.write)
              if result.getvalue()!=original[p]:raise RuntimeError('BACKUP_FAILED '+p)
            for p in paths:
              if read(p)!=original[p]:raise RuntimeError('CONCURRENT_LIVE_CHANGE '+p)
              if original[p]!=desired[p]:
                touched.append(p)
                put(p,desired[p])
            for p in paths:
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?love_inline_check='+str(time.time_ns())
              request=urllib.request.Request(url,headers={
                'Cache-Control':'no-cache','User-Agent':'NumiMomentInlineLoveRelease'})
              with urllib.request.urlopen(request,timeout=35) as response:
                published=response.read(250000)
              if sha(published)!=sha(desired[p]):
                raise RuntimeError('PUBLIC_VERIFICATION_FAILED '+p)
            print('MOMENT_INLINE_LOVE_PUBLISHED_AND_VERIFIED only='+','.join(paths),flush=True)
          except BaseException:
            for p in reversed(touched):
              try:
                put(p,original[p])
                print('ROLLBACK_OK '+p,flush=True)
              except BaseException:
                print('ROLLBACK_FAILED '+p,flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
