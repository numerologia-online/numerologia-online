name: Publish author appointment page (payments guarded)
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_appointment_publish_20261124.py'
      - '.github/workflows/numi-appointment-20261124.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish only appointment files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_appointment_publish_20261124.py
