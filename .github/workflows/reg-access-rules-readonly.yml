name: Inspect REG.RU access rules (read only)
on:
  push:
    paths:
      - .github/workflows/reg-access-rules-readonly.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect access rules without uploading or editing
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,socket,os,re,io,hashlib
          host=os.environ["REG_FTP_HOST"].strip()
          ptr=socket.gethostbyaddr(host)[0].rstrip(".").lower()
          if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru",ptr):raise SystemExit("Host mismatch")
          if host not in {a[4][0] for a in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}:raise SystemExit("DNS mismatch")
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);ftp.prot_p()
          home=ftp.pwd();site=home+"/www/xn--c1adkkdfjbp1a4l.online"
          for path in [home+"/.htaccess",home+"/www/.htaccess",site+"/.htaccess"]:
              data=bytearray()
              def collect(chunk):
                  data.extend(chunk)
                  if len(data)>100000:raise RuntimeError("Too large")
              try:ftp.retrbinary("RETR "+path,collect)
              except ftplib.error_perm:print("RULE FILE absent",path.rsplit("/",2)[-2:]);continue
              text=data.decode("utf-8",errors="replace")
              print("RULE FILE sha256",hashlib.sha256(data).hexdigest())
              for line in text.splitlines():
                  if re.match(r"\s*(?:RewriteCond|RewriteRule|Require|Deny|Allow|Order|Redirect|SSLOptions|Header)",line,re.I):
                      print("RULE",line[:700])
          ftp.quit()
          PY
