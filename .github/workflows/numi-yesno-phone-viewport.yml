name: Compact yes-no phone viewport
on:
  push:
    branches: [fix/yesno-phone-viewport]
    paths: [.github/workflows/numi-yesno-phone-viewport.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check yesno-service/phone-layout/yes-no.js
      - name: Publish guarded compact phone layout
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/phone-layout/deploy.py
