name: Guarded Red Flag answer validation release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-answer-validation-20261122.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope and check response handling without provider requests
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --input-type=module --check < redflag-feature.js
          node --input-type=module --check < app.js
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          api = 'redflag-ai-lab/style-test-api.php'
          workflow = '.github/workflows/numi-redflag-answer-validation-20261122.yml'
          files = {api, 'redflag-feature.js', 'app.js', 'index.html', workflow}

          def old(path):
              return subprocess.check_output(['git', 'show', f'{base}:{path}']).decode('utf-8')

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD']).decode().splitlines())
          assert changed == files, 'UNEXPECTED_CHANGED_FILES'
          before, after = old(api), Path(api).read_text()
          def prompts(code):
              return re.findall(r'\$system(?:=|\.=)[\s\S]*?(?=\n\s*(?:\$data=|\$user=|\$categoryFocus=|\$nextTitles=|if\(|$))', code)
          assert len(prompts(before)) == 10 and prompts(after) == prompts(before), 'PROMPT_CHANGED'
          assert re.findall(r'rfCloudCall\([^\n;]+', before) == re.findall(r'rfCloudCall\([^\n;]+', after), 'GENERATOR_CALL_CHANGED'
          def payload(code):
              return code.split('CURLOPT_POSTFIELDS=>', 1)[1].split(']);', 1)[0]
          assert payload(before) == payload(after), 'PROVIDER_PAYLOAD_CHANGED'
          assert 'short_preview' not in after and 'short_preview' not in Path('redflag-feature.js').read_text()
          assert after.count('__CLOUDRU_KEY_BASE64__') == 1
          assert after.count('$generationStarted=true;') == 3
          for path, asset in [('index.html', 'app.js'), ('app.js', 'redflag-feature.js')]:
              original = old(path)
              needle = f'{asset}?v=infidelity-exact-flags-clone-20261122'
              assert original.count(needle) == 1, 'ASSET_VERSION_NOT_FOUND'
              assert Path(path).read_text() == original.replace(needle, f'{asset}?v=redflag-answer-check-20261122'), 'UNRELATED_ASSET_CHANGE'
          print('REDFLAG_SCOPE_OK prompts_and_provider_requests_preserved')
          PY
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $source=file_get_contents('redflag-ai-lab/style-test-api.php');
          $start=strpos($source,'function rfProviderTag(');
          $end=strpos($source,'function rfCloudCall(');
          if($start===false||$end===false||$end<=$start)throw new RuntimeException('PARSER_MISSING');
          eval(substr($source,$start,$end-$start));

          $log=tempnam(sys_get_temp_dir(),'numi-redflag-');
          ini_set('error_log',$log);
          $model='google/gemini-3-flash-preview';
          $fixture='Gemini 3.5 Flash is no longer available. Please switch to Gemini 3.7 Flash in the latest version of Antigravity.';
          $first=rtrim(str_repeat('Он спокойно слушает, когда вы говорите о границах. В разговоре оставляет место для твоего решения. ',7));
          $second='Присмотрись, как он ведёт себя после несогласия. Здесь пригодится вопрос «Умеет говорить о проблемах или наказывает молчанием?»';
          $valid=$first."\n\n".$second;
          function reply(mixed $content,string $finish='stop',array $message=[]): string {
              return json_encode([
                  'id'=>'chatcmpl-offline',
                  'model'=>'google/gemini-3-flash-preview',
                  'usage'=>['prompt_tokens'=>678,'completion_tokens'=>167,'completion_tokens_details'=>['reasoning_tokens'=>18]],
                  'choices'=>[['message'=>['content'=>$content]+$message,'finish_reason'=>$finish]]
              ],JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);
          }
          function reject(string $expected,string $body,int $status=200): void {
              try {
                  rfCloudAnswer($body,$status,'google/gemini-3-flash-preview','req-offline');
              } catch(RuntimeException $error) {
                  if($error->getMessage()!==$expected)throw new RuntimeException("Expected $expected, got ".$error->getMessage());
                  return;
              }
              throw new RuntimeException("Accepted an invalid reply: $expected");
          }

          try {
              reject('PROVIDER_MODEL_UNAVAILABLE',reply($fixture));
              reject('PROVIDER_MODEL_UNAVAILABLE',reply($fixture,'length'));
              reject('PROVIDER_MODEL_UNAVAILABLE',reply('Модель временно недоступна.'));
              reject('PROVIDER_MODEL_UNAVAILABLE','{"error":{"code":"model_not_found","message":"SENSITIVE TEST PAYLOAD"}}',404);
              reject('PROVIDER_SERVICE_MESSAGE',reply('Service unavailable'));
              reject('PROVIDER_SERVICE_MESSAGE','{"error":{"message":"SENSITIVE TEST PAYLOAD"}}');
              reject('PROVIDER_HTTP_429','{"error":{"message":"SENSITIVE TEST PAYLOAD"}}',429);
              reject('PROVIDER_INVALID_JSON','{');
              reject('PROVIDER_OUTPUT_LIMIT',reply($valid,'length'));
              reject('PROVIDER_REFUSAL',reply($valid,'content_filter'));
              reject('PROVIDER_REFUSAL',reply('', 'stop', ['refusal'=>'SENSITIVE TEST PAYLOAD']));
              reject('EMPTY_ANSWER',reply(null));
              reject('OWNER_TEXT_LENGTH_INVALID',reply('Это короткий ответ.'));
              reject('OWNER_TEXT_PARAGRAPHS_INVALID',reply($first));
              reject('OWNER_TEXT_LANGUAGE_INVALID',reply($first."\n\n".str_repeat('This is a long failed output. ',4)));

              $fence=str_repeat(chr(96),3);
              $samples=[
                  reply($valid),
                  reply($first."\n".$second),
                  reply($fence."text\r\n".$first."\r\n\r\n".$second."\r\n".$fence),
                  reply([['type'=>'text','text'=>$first."\n\n"],['type'=>'text','text'=>$second]])
              ];
              foreach(['google/gemini-3-flash-preview','anthropic/claude-sonnet-4.6'] as $requested)
                  foreach($samples as $sample)
                      if(rfCloudAnswer($sample,200,$requested)!==$valid)throw new RuntimeException('VALID_TEXT_CHANGED');

              $records=file($log,FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES);
              $prefix='REDFLAG_PROVIDER ';
              $firstRecord=json_decode(explode($prefix,$records[0],2)[1],true,16,JSON_THROW_ON_ERROR);
              if($firstRecord['error']!=='PROVIDER_MODEL_UNAVAILABLE'
                 ||$firstRecord['request_id']!=='req-offline'
                 ||$firstRecord['requested_model']!==$model||$firstRecord['returned_model']!==$model
                 ||$firstRecord['finish_reason']!=='stop'||$firstRecord['completion_tokens']!==167
                 ||$firstRecord['reasoning_tokens']!==18
                 ||count($records)!==15
                 ||str_contains(implode("\n",$records),'SENSITIVE TEST PAYLOAD')
                 ||str_contains(implode("\n",$records),'Antigravity'))
                  throw new RuntimeException('DIAGNOSTICS_CHECK_FAILED');
          } finally {
              unlink($log);
          }
          echo "REDFLAG_PARSER_OK: error classification, language and format, approved replies, safe metadata; paid_calls=0\n";
          PHP
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const source = readFileSync("redflag-feature.js", "utf8");
          const start = source.indexOf("function ownerGenerationError(");
          const end = source.indexOf("// Prices are explicit pairs:");
          assert.ok(start >= 0 && end > start);
          const testEnvironment = new Function("env",
            'const {activeProfile, categoryStates, ownerDraftAccess, ownerDraftInScope,'
            + 'birthDateInput, parseRedFlagDate, fetch, renderCategories} = env;\n'
            + source.slice(start, end) + '\nreturn ensureAnswer;');
          const {categories} = JSON.parse(readFileSync("redflag-ai-lab/catalog.json", "utf8"));
          assert.equal(categories.length, 6);
          for (const {id: category, questions} of categories) {
            const card = questions[0];
            const state = {
              answers: new Map(), answerRequests: new Map(), answerErrors: new Map(),
              expanded: true, activeQuestionId: card.id
            };
            const text = "Проверенный первый абзац.\n\nВопрос для продолжения.";
            const requests = [];
            const ensureAnswer = testEnvironment({
              activeProfile: {}, categoryStates: new Map([[category, state]]), ownerDraftAccess: true,
              ownerDraftInScope: () => true, birthDateInput: {value: "01.01.2000"},
              parseRedFlagDate: () => ({day: 1, month: 1, year: 2000}), renderCategories: () => {},
              fetch: async (url, options) => {
                assert.equal(url, "/redflag-ai-lab/style-test-api.php");
                assert.equal(options.method, "POST");
                assert.deepEqual(JSON.parse(options.body), {category, question_id: card.id, day: 1, month: 1, year: 2000});
                requests.push(url);
                return requests.length === 1
                  ? {ok: false, json: async () => ({
                      ok: false, error: "PROVIDER_MODEL_UNAVAILABLE", short_preview: "SENSITIVE Not a reading"
                    })}
                  : {ok: true, json: async () => ({ok: true, draft_only: true, category, question_id: card.id, date_key: "1-1", answer: text})};
              }
            });
            ensureAnswer({...card, isComingSoon: true}, state);
            await state.answerRequests.get(card.id);
            assert.equal(requests.length, 1, category);
            assert.equal(state.answers.size, 0, category);
            assert.match(state.answerErrors.get(card.id), /модель недоступна/);
            assert.doesNotMatch(state.answerErrors.get(card.id), /SENSITIVE|слишком коротким/);
            ensureAnswer({...card, isComingSoon: true}, state);
            await state.answerRequests.get(card.id);
            assert.equal(requests.length, 2, category);
            assert.equal(state.answerErrors.size, 0, category);
            assert.equal(state.answers.get(card.id).answer, text);
          }
          console.log("REDFLAG_CARDS_OK six_categories retry_is_manual paid_calls=0");
          JS
      - name: Back up and publish verified Red Flag files on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import io
          import os
          import re
          import ssl
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid
          from pathlib import Path

          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          api = 'redflag-ai-lab/style-test-api.php'
          targets = (api, 'redflag-feature.js', 'app.js', 'index.html')
          version = 'redflag-answer-check-20261122'
          marker = b'__CLOUDRU_KEY_BASE64__'
          site = 'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD']).strip()

          def old_source(path):
              return subprocess.check_output(['git', 'show', f'{base}:{path}'])

          def require_main_head():
              current = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/main']).split()
              if not current or current[0] != head:
                  raise RuntimeError('MAIN_ADVANCED_BEFORE_RELEASE')

          def get_public(path):
              request = urllib.request.Request(site + path, headers={
                  'Cache-Control': 'no-cache', 'User-Agent': 'NumiRedFlagReleaseCheck/1.0'
              })
              try:
                  with urllib.request.urlopen(request, timeout=24) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b''

          def check_health():
              nonce = '?redflag_check=' + str(time.time_ns())
              if get_public(nonce)[0] != 200:
                  raise RuntimeError('HOME_NOT_AVAILABLE')
              if get_public(api + nonce)[0] != 403:
                  raise RuntimeError('EDITOR_ONLY_ACCESS_CHECK_FAILED')
              if get_public('api/numi-account.php' + nonce)[0] >= 500:
                  raise RuntimeError('ACCOUNT_NOT_AVAILABLE')

          def separate_existing_key(value):
              found = list(re.finditer(rb"\$key=base64_decode\('([A-Za-z0-9+/=]{16,})',true\);", value))
              if len(found) != 1:
                  raise RuntimeError('LIVE_KEY_LAYOUT_UNKNOWN')
              match = found[0]
              return value[:match.start(1)] + marker + value[match.end(1):], match.group(1)

          check_health()
          require_main_head()
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=36) as ftp:
              ftp.connect('server172.hosting.reg.ru', 21)
              ftp.login(os.environ['REG_FTP_USER'], os.environ['REG_FTP_PASSWORD'])
              ftp.prot_p()
              root = ftp.pwd().rstrip('/') + '/www/xn--c1adkkdfjbp1a4l.online/'
              backup = ftp.pwd().rstrip('/') + '/site-safeguard-backups/'
              release = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime()) + '-' + uuid.uuid4().hex[:8]

              def read(path):
                  buffer = io.BytesIO()
                  ftp.retrbinary('RETR ' + path, buffer.write)
                  return buffer.getvalue()

              def store(path, content):
                  ftp.storbinary('STOR ' + path, io.BytesIO(content))
                  if read(path) != content:
                      raise RuntimeError('FTP_READBACK_MISMATCH')

              def install(path, content):
                  # Stage privately before replacing a public file so PHP is never partially uploaded.
                  stage = backup + 'redflag-stage-' + uuid.uuid4().hex
                  store(stage, content)
                  ftp.rename(stage, root + path)
                  if read(root + path) != content:
                      raise RuntimeError('LIVE_READBACK_MISMATCH_' + path)

              # Existing public free route is disabled. Any different live implementation
              # needs a scope check before claiming that every active model path is covered.
              if read(root + 'api/redflag-free-ai.php') != old_source('api/redflag-free-ai.php'):
                  raise RuntimeError('LIVE_FREE_GENERATION_ROUTE_DRIFT')
              originals = {path: read(root + path) for path in targets}
              desired = {path: Path(path).read_bytes() for path in targets}
              current_api, key = separate_existing_key(originals[api])
              for path in targets:
                  visible = current_api if path == api else originals[path]
                  if visible not in (old_source(path), desired[path]):
                      raise RuntimeError('UNEXPECTED_LIVE_SOURCE_' + path)
              if desired[api].count(marker) != 1:
                  raise RuntimeError('KEY_PLACEHOLDER_INVALID')
              desired[api] = desired[api].replace(marker, key)
              if subprocess.run(['php', '-l'], input=desired[api], capture_output=True).returncode:
                  raise RuntimeError('LIVE_PHP_LINT_FAILED')

              try:
                  ftp.mkd(backup)
              except ftplib.error_perm as error:
                  if not str(error).startswith('550'):
                      raise
              changed = [path for path in targets if originals[path] != desired[path]]
              for path in changed:
                  store(backup + 'before-redflag-validation-' + release + '-' + path.replace('/', '_') + '.bak', originals[path])
              require_main_head()
              attempted = []
              try:
                  for path in changed:
                      if read(root + path) != originals[path]:
                          raise RuntimeError('CONCURRENT_LIVE_SOURCE_CHANGE_' + path)
                      attempted.append(path)
                      install(path, desired[path])

                  check_health()
                  for path in ('app.js', 'redflag-feature.js'):
                      code, content = get_public(path + '?v=' + version)
                      if code != 200 or content != desired[path]:
                          raise RuntimeError('PUBLIC_ASSET_VERIFICATION_FAILED_' + path)
                  code, content = get_public('?redflag_release=' + release)
                  if code != 200 or ('app.js?v=' + version).encode() not in content:
                      raise RuntimeError('PUBLIC_ENTRY_ASSET_CHECK_FAILED')
              except BaseException:
                  rollback_failed = []
                  for path in reversed(attempted):
                      try:
                          if read(root + path) != originals[path]:
                              install(path, originals[path])
                      except Exception:
                          rollback_failed.append(path)
                  if rollback_failed:
                      print('REDFLAG_ROLLBACK_FAILED ' + ','.join(rollback_failed), flush=True)
                  elif attempted:
                      print('REDFLAG_ROLLBACK_VERIFIED', flush=True)
                  raise

          print(f'REDFLAG_PUBLISHED verified_files={len(targets)} updated_files={len(changed)} paid_calls=0', flush=True)
          PY
