name: Publish first approved yes-no answer
on:
  push:
    branches: [feature/yesno-first-approved-answer]
    paths: [.github/workflows/numi-yesno-first-answer.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check yesno-service/public/yes-no.js
      - run: php -l yesno-service/public/numi-yesno-answer.php
      - run: python3 -m py_compile yesno-service/deploy.py yesno-service/tests/verify.py
      - name: Back up and publish first approved answer
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/deploy.py
