name: Publish matching gold back buttons on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-gold-back-release.yml
permissions:
  contents: read
concurrency:
  group: numi-gold-back-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish matching gold cabinet buttons on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated HTML patch
        run: python3 -m py_compile account-service/deploy-gold-account-back.py
      - name: Deploy with backup and live verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-gold-account-back.py
