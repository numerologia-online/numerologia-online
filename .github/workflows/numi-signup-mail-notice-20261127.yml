name: Publish signup email delivery notice only
on:
  push:
    paths:
      - .github/workflows/numi-signup-mail-notice-20261127.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish signup email delivery notice only on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Patch only live registration message and cache tag with backup
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          node --check account-browser.js
          python3 -u - <<'PY'
          import ftplib, io, os, re, ssl, time, urllib.request, urllib.parse, tempfile, subprocess
          host="server172.hosting.reg.ru"
          domain="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          names=("account-browser.js","index.html")
          old="Проверьте почту: мы отправили ссылку подтверждения.".encode()
          new="Письмо отправлено. Доставка может занять несколько минут. Не забудьте проверить папку «Спам».".encode()
          tag=b"account-browser.js?v=signup-mail-notice-20261127"
          def public(n):
              req=urllib.request.Request("https://"+domain+"/"+n+"?signup_notice="+str(time.time_ns()),headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  if r.status!=200 or urllib.parse.urlsplit(r.geturl()).hostname!=domain: raise RuntimeError("PUBLIC_HOST_MISMATCH")
                  data=r.read(2000001)
                  if len(data)>2000000: raise RuntimeError("OVERSIZE")
                  return data
          live={n:public(n) for n in names}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect(host,21)
          ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p()
          ftp.set_pasv(True)
          def read(p):
              out=io.BytesIO()
              ftp.retrbinary("RETR "+p,out.write)
              return out.getvalue()
          def write(p,b):
              ftp.storbinary("STOR "+p,io.BytesIO(b))
              if read(p)!=b: raise RuntimeError("WRITE_MISMATCH")
          try:
              root=ftp.pwd().rstrip("/")
              site=None
              for d in (domain,"xn--c1adkkdfjbp1a4l.online"):
                  p=root+"/www/"+d
                  try:
                      if all(read(p+"/"+n)==live[n] for n in names):
                          site=p
                          break
                  except ftplib.error_perm: continue
              if not site: raise RuntimeError("ACTIVE_WEBROOT_NOT_VERIFIED")
              guard=read(site+"/.htaccess")
              if b"NUMI PAID STATIC ACCESS GUARD BEGIN 2026-10-31" not in guard: raise RuntimeError("PAID_GUARD_MISSING")
              js=live[names[0]]
              if js.count(old)==1 and js.count(new)==0: updated=js.replace(old,new,1)
              elif js.count(old)==0 and js.count(new)==1: updated=js
              else: raise RuntimeError("UNEXPECTED_REGISTRATION_MESSAGE")
              html,count=re.subn(rb'account-browser\.js\?v=[^"\x27]+',tag,live[names[1]])
              if count!=1: raise RuntimeError("UNEXPECTED_SCRIPT_TAG")
              desired={names[0]:updated,names[1]:html}
              with tempfile.NamedTemporaryFile(suffix=".js") as f:
                  f.write(updated)
                  f.flush()
                  subprocess.run(["node","--check",f.name],check=True)
              changes=[n for n in names if desired[n]!=live[n]]
              if changes:
                  backup_root=root+"/site-safeguard-backups"
                  try: ftp.mkd(backup_root)
                  except ftplib.error_perm: ftp.cwd(backup_root)
                  backup=backup_root+"/signup-mail-notice-"+str(os.environ["GITHUB_RUN_ID"])+"-"+str(time.time_ns())
                  ftp.mkd(backup)
                  for n in changes: write(backup+"/"+n+".bak",live[n])
                  changed=[]
                  try:
                      for n in changes:
                          if read(site+"/"+n)!=live[n]: raise RuntimeError("CONCURRENT_EDIT")
                          changed.append(n)
                          write(site+"/"+n,desired[n])
                      for n in names:
                          if public(n)!=desired[n]: raise RuntimeError("PUBLIC_VERIFY_FAILED:"+n)
                      if read(site+"/.htaccess")!=guard: raise RuntimeError("GUARD_CHANGED")
                  except BaseException:
                      for n in reversed(changed):
                          try:
                              if read(site+"/"+n)==desired[n]: write(site+"/"+n,live[n])
                              else: print("ROLLBACK_SKIPPED_CONCURRENT_EDIT",n)
                          except Exception: print("ROLLBACK_FAILED",n)
                      raise
              print("SIGNUP_MAIL_NOTICE_LIVE_VERIFIED",flush=True)
          finally:
              ftp.close()
          PY
