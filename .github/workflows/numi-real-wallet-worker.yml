          if(!is_array($c)||!naLiveRecurringAllowed($c))exit(4);
          if((string)($c['shop_id']??'')!=='1515851')exit(5);
          foreach(['club_month'=>49000,'school_week'=>14900] as $code=>$price){
              $catalog=naCatalogResolve(['product_code'=>$code],false);
              if((int)($catalog['price_kopeks']??0)!==$price)exit(6);
              $receipt=naLiveSubscriptionReceipt($c,$code,$price,'example@example.com');
              $item=$receipt['items'][0]??[];
              if(($item['payment_mode']??null)!=='full_payment'||
                 ($item['payment_subject']??null)!=='service'||
                 ($item['vat_code']??null)!==($c['offset_receipt_vat_code']??null)||
                 ($item['amount']['value']??null)!==naStoreAmount($price)||
                 ($receipt['customer']['email']??null)!=='example@example.com')exit(7);
          }
          """
          def validate(raw):
              with tempfile.NamedTemporaryFile(mode='wb',suffix='.php',delete=False) as tmp:
                  tmp.write(raw); local=tmp.name
              try:
                  env=os.environ.copy();env['NUMI_RECURRING_CONFIG']=local
                  subprocess.run(['php','-l',local],check=True,
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  subprocess.run(['php','-r',php_check],check=True,env=env,
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              finally:os.unlink(local)
          user=os.environ.get('REG_FTP_USER','')
          password=os.environ.get('REG_FTP_PASSWORD','')
          if not user or not password:raise RuntimeError('FTPS_CREDENTIALS_MISSING')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(user,password);ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          target=home+'/private/numi-wallet-live/config.local.php'
          def read(path):
              out=io.BytesIO()
              def collect(block):
                  if out.tell()+len(block)>16000:raise RuntimeError('CONFIG_OVERSIZED')
                  out.write(block)
              ftp.retrbinary('RETR '+path,collect)
              return out.getvalue()
          try:
