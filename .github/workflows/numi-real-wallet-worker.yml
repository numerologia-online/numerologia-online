name: REG.RU REAL wallet invoices and refunds worker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-real-wallet-worker.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numi-real-wallet-fiscal-worker
  cancel-in-progress: false
jobs:
  release-subscriptions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Approve guarded REG.RU subscription deployment (no charges)'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing private modules, browser and guarded release script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-real-wallet-worker-20261108.py
          node --check account-browser.js
          grep -q 'account-browser.js?v=wallet-same-tab-vpn-20261109' index.html
          grep -q 'directOpenHere(directPrepared.href)' account-browser.js
          grep -q 'scheduleDirectCheckoutPreparation' account-browser.js
          grep -q 'location.assign(url)' account-browser.js
          grep -q 'request("wallet_topup",intent.payload,abort.signal)' account-browser.js
          grep -q 'Если окно оплаты зависает, отключите VPN.' account-browser.js
