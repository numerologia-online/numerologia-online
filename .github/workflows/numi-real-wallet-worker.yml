                      raise RuntimeError('REQUIRED_FISCAL_FLAG_MISSING_'+n)
              if re.search(r"""['"]wallet_mode['"]\s*=>\s*['"]live['"]""",original) is None:
                  raise RuntimeError('LIVE_WALLET_NOT_SELECTED')
              if re.search(r"""['"]provider_test_mode['"]\s*=>\s*false\b""",original) is None:
                  raise RuntimeError('PROVIDER_TEST_MODE_NOT_FALSE')
              if re.search(r"""['"]shop_id['"]\s*=>\s*['"]?1515851['"]?""",original) is None:
                  raise RuntimeError('MERCHANT_ID_DOES_NOT_MATCH_APPROVAL')
              updated=original
              missing=[]
              for n in names:
                  exp=r"""(['"]"""+re.escape(n)+r"""['"]\s*=>\s*)(true|false)\b"""
                  matches=list(re.finditer(exp,updated))
                  if len(matches)>1:raise RuntimeError('DUPLICATE_FLAG_'+n)
                  if matches:
                      updated=re.sub(exp,lambda m:m.group(1)+'true',updated,count=1)
                  else:missing.append(n)
              ends=list(re.finditer(r'(?m)^[ \t]*\];[ \t]*    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
