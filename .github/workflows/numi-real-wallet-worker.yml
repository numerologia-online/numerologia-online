name: REG.RU REAL wallet invoices and refunds worker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-real-wallet-worker.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numi-real-wallet-fiscal-worker
  cancel-in-progress: false
jobs:
  release-subscriptions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Approve guarded REG.RU subscription deployment (no charges)'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing private modules, browser and guarded release script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-real-wallet-worker-20261108.py
          node --check account-browser.js
          grep -q 'account-browser.js?v=wallet-same-tab-vpn-20261109' index.html
          grep -q 'directOpenHere(directPrepared.href)' account-browser.js
          grep -q 'scheduleDirectCheckoutPreparation' account-browser.js
          grep -q 'location.assign(url)' account-browser.js
          grep -q 'request("wallet_topup",intent.payload,abort.signal)' account-browser.js
          grep -q 'Если окно оплаты зависает, отключите VPN.' account-browser.js
          ! grep -q 'directExternalOpen(' account-browser.js
          ! grep -q 'web_app_open_link' account-browser.js
          ! grep -Fq 'location.assign("/wallet-topup.html")' account-browser.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path("wallet-topup.html").read_text(encoding="utf-8")
          js=html.split("<script>\n",1)[1].split("\n</script>",1)[0]
          assert 'openPaymentInThisWindow(prepared.href)' in js
          assert 'location.assign(href)' in js
          assert 'web_app_open_link' not in js
          assert 'openPaymentExternally(' not in js
          assert 'telegramExternal()&&mode==="live"' in js
          assert 'completedFingerprint' in js
          assert 'sessionStorage.getItem(skey)' in js
          assert 'location.assign(paymentUrl(result.confirmation_url))' in js
          assert 'Если окно оплаты зависает, отключите VPN.' in html
          assert 'id="submit"' in html and 'Готовим оплату…' in js
          Path("/tmp/numi-wallet-topup-20261109.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/numi-wallet-topup-20261109.js
          for f in account-service/private/{core,store,wallet,wallet-real,wallet-real-payment,wallet-real-worker,subscriptions,fulfillment}.php; do
            php -l "$f"
          done
          php -l account-service/public/numi-real-worker.php
          for file in app.js year-feature.js compatibility-feature.js pro/pro.js child/child.js store-entry.js shared-offer.js wallet-client.js redflag-feature.js; do node --check "$file"; done
          grep -Fq "naRedFlagPaidStatus" account-service/private/fulfillment.php
          grep -Fq "Недостаточно средств на балансе. Для ответа нужно " wallet-client.js
          grep -Fq "redflag-question-stable-20261109" redflag-feature.js
          grep -Fq "const repaintOnlyQuestions" redflag-feature.js
          grep -Fq "Списать " wallet-client.js
          grep -Fq "REDFLAG_COMPLETE_366_PRIVATE_ANSWERS_VERIFIED" scripts/deploy-real-wallet-worker-20261108.py
          grep -Fq "PAID_ANSWER_READY_AND_BALANCE_GUARDS_MISSING" scripts/deploy-real-wallet-worker-20261108.py
          test "$(grep -c 'Этот материал ещё готовится' wallet-client.js || true)" = "0"
          grep -Fq "modify('+1 year')" account-service/private/store.php
          grep -Fq "INTERVAL 1 YEAR" account-service/public/numi-real-worker.php
          grep -Fq "expires_at'=>\$expiresAt" account-service/private/wallet-real-payment.php
          grep -Fq "app.js?v=redflag-question-stable-20261109" index.html
          grep -Fq "pro/pro.js?v=report-annual-20261109" pro/index.html
          grep -Fq "./child.js?v=report-annual-20261109" child/index.html
          grep -Fq "recognizePurchasedReport" store-entry.js
          grep -Fq "recognizePurchasedReport" year-feature.js
          grep -Fq "recognizePurchasedReport" compatibility-feature.js
          grep -Fq "recognizePurchasedReport" pro/pro.js
          grep -Fq "recognizePurchasedReport" child/child.js
          grep -Fq "на 1 год" pro/index.html
          grep -q 'CREATE TABLE IF NOT EXISTS numi_real_wallet_receipt_allocations' account-service/private/wallet-real.php
          grep -q 'naRealWalletAllocateReceiptSources' account-service/private/wallet-real.php
          grep -q 'JOIN numi_real_wallet_fiscal_events f' account-service/tests/real-wallet-payment.php
          grep -q 'LEFT JOIN numi_real_wallet_receipt_allocations a' account-service/private/wallet-real-worker.php
          grep -q 'numi_real_wallet_receipt_allocations WHERE topup_id' account-service/private/wallet-real-payment.php
          grep -q "recurring_merchant_approved" account-service/private/subscriptions.php
          grep -q "'save_payment_method'=>false" account-service/private/wallet-real-payment.php
          grep -q 'subscription_cancel' account-service/private/core.php
          grep -q 'Оформить подписку' account-browser.js
          grep -q 'auto_renew_consent:true' account-browser.js
          ! grep -q 'consent.type="checkbox"' account-browser.js
          grep -q 'Клуб — 490 рублей в месяц' index.html
          grep -q 'Самоучитель — 149 рублей в неделю' index.html
          grep -q 'Отменить подписку' account-browser.js
          grep -q 'REG_RU_COMPACT_SUBSCRIPTIONS_VIEW_UPDATED' scripts/deploy-real-wallet-worker-20261108.py
          ! grep -q 'row.append(email,payAuto,terms,note)' account-browser.js
          test "$(grep -c 'src="store-browser.js' index.html || true)" = "0"
          echo "SUBSCRIPTION_RELEASE_STATIC_GATES_PASSED"
      - name: Guarded REG.RU comparison, backups, only necessary files and rollback
        shell: bash
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/deploy-real-wallet-worker-20261108.py
  enable-recurring:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Activate YooKassa existing recurring flags with receipt validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check live receipt construction and set three existing private flags with backup
        shell: bash
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,io,os,ssl,re,tempfile,subprocess
          names=['recurring_merchant_approved','subscription_receipts_verified','live_recurring_enabled']
          required=['real_wallet_enabled','fiscalization_verified','refunds_verified',
                    'advance_offset_receipts_verified','offset_receipt_worker_verified',
                    'launch_approved','offset_receipt_reviewed']
          def php_check(raw):
              f=tempfile.NamedTemporaryFile(suffix='.php',delete=False)
              try:
                  f.write(raw);f.close()
                  env=dict(os.environ,NUMI_RECURRING_CONFIG=f.name)
                  php=r"""
                  require_once 'account-service/private/core.php';
                  require_once 'account-service/private/wallet-real-payment.php';
                  $c=require getenv('NUMI_RECURRING_CONFIG');
                  if(!is_array($c)||!naLiveRecurringAllowed($c)||
                     (string)($c['shop_id']??'')!=='1515851')exit(4);
                  foreach(['club_month'=>49000,'school_week'=>14900] as $code=>$price){
                      if(naCatalogResolve(['product_code'=>$code],false)['price_kopeks']!==$price)exit(5);
                      $rec=naLiveSubscriptionReceipt($c,$code,$price,'audit@example.com');
                      $item=$rec['items'][0]??[];
                      if(($item['vat_code']??null)!==($c['offset_receipt_vat_code']??null)||
                         ($item['payment_mode']??null)!=='full_payment'||
                         ($item['payment_subject']??null)!=='service'||
                         ($item['amount']['value']??null)!==naStoreAmount($price))exit(6);
                  }
                  """
                  subprocess.run(['php','-l',f.name],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  subprocess.run(['php','-r',php],env=env,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              finally:
                  f.close();os.unlink(f.name)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          path=ftp.pwd().rstrip('/')+'/private/numi-wallet-live/config.local.php'
          def read(filename):
              buff=io.BytesIO()
              def add(block):
                  if buff.tell()+len(block)>16000:raise RuntimeError('OVERSIZE')
                  buff.write(block)
              ftp.retrbinary('RETR '+filename,add)
              return buff.getvalue()
          try:
              previous=read(path);s=previous.decode('utf-8')
              for n in required:
                  if not re.search(r"""['"]"""+re.escape(n)+r"""['"]\s*=>\s*true\b""",s):
                      raise RuntimeError('UNVERIFIED_REQUIRED_FLAG_'+n)
              if not re.search(r"""['"]wallet_mode['"]\s*=>\s*['"]live['"]""",s):
                  raise RuntimeError('LIVE_MODE_REQUIRED')
              if not re.search(r"""['"]provider_test_mode['"]\s*=>\s*false\b""",s):
                  raise RuntimeError('PRODUCTION_MODE_REQUIRED')
              if not re.search(r"""['"]shop_id['"]\s*=>\s*['"]?1515851['"]?""",s):
                  raise RuntimeError('SHOP_ID_NOT_APPROVED')
              add=[]
              for n in names:
                  reg=r"""(['"]"""+re.escape(n)+r"""['"]\s*=>\s*)(true|false)\b"""
                  if len(re.findall(reg,s))>1:raise RuntimeError('DUPLICATE_FLAG_'+n)
                  if re.search(reg,s):s=re.sub(reg,lambda m:m.group(1)+'true',s,count=1)
                  else:add.append(n)
              endings=list(re.finditer(r'(?m)^[ \t]*\];[ \t]*$',s))
              if len(endings)!=1:raise RuntimeError('UNKNOWN_CONFIG_LAYOUT')
              if add:
                  i=endings[0].start()
                  s=s[:i]+''.join("    '"+n+"' => true,\n" for n in add)+s[i:]
              current=s.encode('utf-8')
              php_check(current)
              if current==previous:print('RECURRING_ALREADY_ENABLED_VERIFIED',flush=True)
              else:
                  if read(path)!=previous:raise RuntimeError('CONCURRENT_CHANGE')
                  backup=path+'.before-recurring-'+os.environ['GITHUB_RUN_ID']
                  ftp.storbinary('STOR '+backup,io.BytesIO(previous))
                  if read(backup)!=previous:raise RuntimeError('BACKUP_CHECK_FAILED')
                  try:
                      ftp.storbinary('STOR '+path,io.BytesIO(current))
                      if read(path)!=current:raise RuntimeError('SAVE_CHECK_FAILED')
                  except BaseException:
                      if read(path)!=previous:ftp.storbinary('STOR '+path,io.BytesIO(previous))
                      raise
                  print('RECURRING_ALL_THREE_FLAGS_ENABLED_AND_VERIFIED',flush=True)
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
  reconcile:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Invoke protected REG.RU worker without exposing credentials
        env:
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,hmac,json,os,urllib.request,urllib.error
          password=os.environ.get('REG_FTP_PASSWORD','')
          if not password:
              raise SystemExit('REG_FTP_PASSWORD_SECRET_MISSING')
          token=hmac.new(password.encode(),
            b'numi-real-wallet-worker-v1@xn----8sbhhqijddjgdebdz2c2o.xn--p1ai',
            hashlib.sha256).hexdigest()
          url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/api/numi-real-worker.php'
          req=urllib.request.Request(url,
            data=b'{"action":"tick"}',
            headers={'Content-Type':'application/json','X-Numi-Worker-Token':token,
                     'Cache-Control':'no-store','User-Agent':'numi-real-wallet-worker/1'},
            method='POST')
          try:
              with urllib.request.urlopen(req,timeout=70) as response:
                  status=response.status
                  payload=json.loads(response.read(4096))
          except urllib.error.HTTPError as err:
              status=err.code
              try:payload=json.loads(err.read(2048))
              except Exception:payload={}
          except Exception:
              raise SystemExit('REG_RU_WORKER_UNREACHABLE')
          if status==503 and payload.get('error')=='LIVE_WALLET_NOT_ACTIVATED':
              print('REAL_WALLET_DISABLED_NO_MONEY_MOVED')
          elif status==200 and payload.get('ok') is True:
              results=payload.get('results',{})
              print('REAL_WALLET_MAINTENANCE',json.dumps(results,ensure_ascii=False))
          else:
              raise SystemExit('REG_RU_WORKER_STATUS_'+str(status)+'_'+str(payload.get('error','unknown')))
          PY

# annual report entitlement by exact subject; guard 1-year expiry and live original-page rendering
