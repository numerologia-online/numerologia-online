          assert 'location.assign(href)' in js
          assert 'web_app_open_link' not in js
          assert 'openPaymentExternally(' not in js
          assert 'telegramExternal()&&mode==="live"' in js
          assert 'completedFingerprint' in js
          assert 'sessionStorage.getItem(skey)' in js
          assert 'location.assign(paymentUrl(result.confirmation_url))' in js
          assert 'Если окно оплаты зависает, отключите VPN.' in html
          assert 'id="submit"' in html and 'Готовим оплату…' in js
          Path("/tmp/numi-wallet-topup-20261109.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/numi-wallet-topup-20261109.js
          for f in account-service/private/{core,store,wallet,wallet-real,wallet-real-payment,wallet-real-worker,subscriptions,fulfillment}.php; do
            php -l "$f"
          done
          php -l account-service/public/numi-real-worker.php
          for file in app.js year-feature.js compatibility-feature.js pro/pro.js child/child.js store-entry.js shared-offer.js wallet-client.js redflag-feature.js; do node --check "$file"; done
          grep -Fq "naRedFlagPaidStatus" account-service/private/fulfillment.php
          grep -Fq "Недостаточно средств на балансе. Для ответа нужно " wallet-client.js
          grep -Fq "redflag-question-stable-20261109" redflag-feature.js
          grep -Fq "const repaintOnlyQuestions" redflag-feature.js
          grep -Fq "Списать " wallet-client.js
          grep -Fq "REDFLAG_COMPLETE_366_PRIVATE_ANSWERS_VERIFIED" scripts/deploy-real-wallet-worker-20261108.py
          grep -Fq "PAID_ANSWER_READY_AND_BALANCE_GUARDS_MISSING" scripts/deploy-real-wallet-worker-20261108.py
          test "$(grep -c 'Этот материал ещё готовится' wallet-client.js || true)" = "0"
