name: Restore last approved Gemini Red Flags and remove today's infidelity experiments
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml
      - redflag-ai-lab/style-test-api.php
      - redflag-ai-lab/catalog.json
      - redflag-feature.js
      - app.js
      - index.html
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  owner-fidelity-all-10-gemini-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact approved Red Flags snapshot and no unrelated changes
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          import pathlib,subprocess,json
          approved='2fe9243a85a0b426b053bc305b67e6956cf060f9'
          previous='f66b6a3b110350e436ba6e461dcbe7ead89973d4'
          targets={
            'redflag-ai-lab/style-test-api.php':'179747e1d537cd5421c976cbaf658268e231dcdc',
            'redflag-feature.js':'f692e86466e014e6659c0a0b3f5d9b3bbd094c5f',
            'redflag-ai-lab/catalog.json':'635eb2847bfe3699dc9becfe0f8dbdc168274a3b',
            'app.js':'67b3d1ec7a0f52a5d916d3d7742595b533d563ab',
            'index.html':'a7ee8a0a9607b9ac2d6d8b69618f02629423599e'
          }
          def git(ref,path):
              return subprocess.check_output(['git','show',ref+':'+path])
          for path,sha in targets.items():
              data=pathlib.Path(path).read_bytes()
              actual=subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip()
              assert actual==sha,'APPROVED_SNAPSHOT_SHA_MISMATCH_'+path
              assert data==git(approved,path),'NOT_APPROVED_SNAPSHOT_'+path
          # Explicitly preserve other published content, customer files and matrix.
          protected=['redflag-public-catalog.js','redflag-engine.js',
                     'redflag-ai-lab/intimacy-knowledge-v1.json',
                     'api/numi-account.php','api/redflag-free-ai.php',
                     'redflag-ai-lab/style-test.php']
          for path in protected:
              assert pathlib.Path(path).read_bytes()==git(previous,path),'UNRELATED_FILE_MODIFIED_'+path
          updated=set(subprocess.check_output(['git','diff','--name-only',previous,'HEAD']).decode().splitlines())
          permitted=set(targets)|{'.github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml'}
          assert updated==permitted,'UNEXPECTED_RESTORE_SCOPE_'+repr(updated^permitted)
          api=pathlib.Path('redflag-ai-lab/style-test-api.php').read_bytes()
          assert api.count(b'function rfOwnerSharpFlags(')==1,'APPROVED_FLAGS_MISSING'
          assert b'function rfOwnerSharpInfidelityPilot(' not in api,'EXPERIMENTAL_FIDELITY_STILL_PRESENT'
          assert b'google/gemini-3-flash-preview' in api,'APPROVED_GEMINI_MISSING'
          catalog=json.loads(pathlib.Path('redflag-ai-lab/catalog.json').read_text())
          assert len(next(x for x in catalog['categories'] if x['id']=='infidelity')['questions'])==9,'FIDEO_CATALOG_NOT_RESTORED'
          print('APPROVED_RED_FLAGS_SNAPSHOT_EXACT; ALL_FIVE_FILES_RESTORED; OTHER_SECTIONS_PROTECTED; ZERO_AI_CALLS',flush=True)
          PY
      - name: Back up live production then restore five approved files with rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,ftplib,ssl,io,os,hashlib,re,time,uuid,urllib.request,urllib.error
          ref='f66b6a3b110350e436ba6e461dcbe7ead89973d4'
          paths=['redflag-ai-lab/style-test-api.php','redflag-feature.js','redflag-ai-lab/catalog.json','app.js','index.html']
          php=paths[0]
          marker=b'__CLOUDRU_KEY_BASE64__'
          def source(p):return subprocess.check_output(['git','show',ref+':'+p])
          def mask(s):
              found=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",s))
              if len(found)!=1:raise RuntimeError('LIVE_API_KEY_LAYOUT_UNKNOWN')
              m=found[0];secret=m.group(2)
              if len(secret)<16 or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_API_KEY_BAD')
              return s[:m.start(2)]+marker+s[m.end(2):],secret
          host='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(host+path+'?owner_fidelity_pilot='+str(time.time_ns()),
                headers={'Cache-Control':'no-store','User-Agent':'NumiOwnerFidelityPilotGuard/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status
              except urllib.error.HTTPError as exc:return exc.code
          if status('')!=200 or status(php)!=403:raise RuntimeError('LIVE_SITE_AUTH_UNHEALTHY_BEFORE')
          if status('api/numi-account.php')>=500:raise RuntimeError('LIVE_ACCOUNT_UNHEALTHY_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup_dir=home+'/site-safeguard-backups'
          def read(path,absolute=False):
              buf=io.BytesIO()
              ftp.retrbinary('RETR '+(path if absolute else root+path),buf.write)
              return buf.getvalue()
          def write(path,payload,absolute=False):
              ftp.storbinary('STOR '+(path if absolute else root+path),io.BytesIO(payload))
              if read(path,absolute)!=payload:raise RuntimeError('READBACK_MISMATCH_'+path)
          before={};written=[]
          try:
              before={p:read(p) for p in paths}
              previous_mask,key=mask(before[php])
              if previous_mask!=source(php):raise RuntimeError('LIVE_API_NOT_APPROVED_BASELINE_REFUSE')
              for p in paths[1:]:
                  if before[p]!=source(p):raise RuntimeError('LIVE_CHANGED_REFUSE_'+p)
              protected=['api/numi-account.php','api/redflag-free-ai.php','redflag-engine.js',
                         'redflag-public-catalog.js',
                         'redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/style-test.php']
              protected_hash={p:hashlib.sha256(read(p)).digest() for p in protected}
              desired={p:pathlib.Path(p).read_bytes() for p in paths}
              if desired[php].count(marker)!=1:raise RuntimeError('SOURCE_API_KEY_SLOT_BAD')
              desired[php]=desired[php].replace(marker,key)
              if subprocess.run(['php','-l'],input=desired[php],capture_output=True).returncode:
                  raise RuntimeError('LIVE_PATCH_PHP_SYNTAX_INVALID')
              try:ftp.mkd(backup_dir)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              for p in paths:
                  write(backup_dir+'/before-restore-approved-redflags-'+stamp+'-'+p.replace('/','-')+'.bak',before[p],True)
              for p in paths:
                  if read(p)!=before[p]:raise RuntimeError('CONCURRENT_LIVE_EDIT_'+p)
              for p in paths:
                  if desired[p]!=before[p]:
                      written.append(p)
                      write(p,desired[p])
              if status('')!=200 or status(php)!=403:raise RuntimeError('SITE_OWNER_AUTH_AFTER')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_FAILED_AFTER')
              if status('redflag-ai-lab/style-test.php')!=403:raise RuntimeError('OWNER_EDITOR_PAGE_EXPOSED')
              for p in paths:
                  if read(p)!=desired[p]:raise RuntimeError('POST_RELEASE_CHANGED_'+p)
              for p,h in protected_hash.items():
                  if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              print('APPROVED_RED_FLAGS_AND_FIDELITY_ROLLBACK_PUBLISHED_VERIFIED approved_snapshot=2fe9243 files=5 customer_payments_untouched=true backups=true inference_calls=0',flush=True)
          except BaseException:
              errors=[]
              for p in reversed(written):
                  try:write(p,before[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:errors.append(p)
              if errors:print('CRITICAL_ROLLBACK_FAILED '+','.join(errors),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
