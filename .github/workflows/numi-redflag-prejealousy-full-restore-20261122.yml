name: Guarded Gemini infidelity ten-question clone of approved Red Flags
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml
      - redflag-ai-lab/style-test-api.php
      - redflag-ai-lab/catalog.json
      - redflag-ai-lab/infidelity-knowledge-v1.json
      - redflag-feature.js
      - app.js
      - index.html
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  owner-fidelity-all-10-gemini-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard approved flags, exact prompt copy, 22 arcana and owner-only routing
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          import json,pathlib,subprocess,re
          base='cabd9fedf8b1afab4fac6938b0b811db20130010'
          targets={
            "redflag-ai-lab/style-test-api.php": "d989274f2b29c4b4d49966fed0979559091d4e0a",
            "redflag-ai-lab/infidelity-knowledge-v1.json": "71639a2752d088e680023df1793d5ed27a9b087e",
            "redflag-ai-lab/catalog.json": "d02969788756b44eec307f5a4426514d38393a31",
            "redflag-feature.js": "ab95e0ff802dca6e5c8a853fe3a7dc8dd94d9f79",
            "app.js": "0f34aa71127ced7a43596a5075469206401a7e1e",
            "index.html": "b375e7d7bf59c8598fc17489d47828c435050466",
          }
          def git(ref,p): return subprocess.check_output(['git','show',ref+':'+p])
          for p,sha in targets.items():
              value=pathlib.Path(p).read_bytes()
              actual=subprocess.check_output(['git','hash-object','--stdin'],input=value).decode().strip()
              assert actual==sha,'WRONG_FILE_VERSION_'+p
          old=git(base,'redflag-ai-lab/style-test-api.php')
          new=pathlib.Path('redflag-ai-lab/style-test-api.php').read_bytes()
          def utf(v):return v.encode('utf-8')
          lead=utf('function rfOwnerSharpFlags(')
          ins=utf('function rfOwnerSharpInfidelity(')
          flag_old=old[old.index(lead):old.index(b'\n\ntry {',old.index(lead))]
          flag_new=new[new.index(lead):new.index(b'\n\n'+ins,new.index(lead))]
          assert flag_old==flag_new,'APPROVED_FLAGS_BYTE_CHANGED'
          original_prompt=flag_old[flag_old.index(b"$system=<<<'PROMPT'"):flag_old.index(b'\nPROMPT;')]
          inf_chunk=new[new.index(ins):new.index(b'\n\ntry {',new.index(ins))]
          clone_prompt=inf_chunk[inf_chunk.index(b"$system=<<<'PROMPT'"):inf_chunk.index(b'\nPROMPT;')]
          expected=original_prompt.replace(utf('Это раздел «Красные флаги».'),
                        utf('Это раздел «Измены и флирт».'))
          assert clone_prompt==expected,'GOLDEN_PROMPT_ALTERED'
          assert inf_chunk.count(b'rfOwner31($day,$month,$year)')==1,'FULL_MATRIX_NOT_REUSED'
          assert inf_chunk.count(b"'google/gemini-3-flash-preview'")==1,'GEMINI_MODEL_DIFFERENT'
          assert b'$system.=' not in inf_chunk,'EXTRA_PROMPT_LAYERS'
          assert b"'/infidelity-knowledge-v1.json'" in inf_chunk,'INDEPENDENT_KB_MISSING'
          assert inf_chunk.count(b"['left','top'")==10,'NOT_TEN_DAY_MONTH_PRIMARY_MAPS'
          approved=function_new_restore=new.replace(b'\n\n'+inf_chunk,b'')
          owner_route=b'    // Owner-only Gemini preview cloned from approved Red Flags for all 10 fidelity questions.\n'
          following=b'    // Shared autonomous Sonnet preview for every question except the editorial'
          assert approved.count(owner_route)==1 and approved.count(following)==1,'OWNER_ROUTE_DRIFT'
          begin=approved.index(owner_route);finish=approved.index(following,begin)
          approved=approved[:begin]+approved[finish:]
          diagnostic=b"    if($reason==='OWNER_TEXT_LENGTH_INVALID'\n       &&($input['category']??null)==='infidelity'"
          until=b'    // Only well-defined error codes are exposed to this verified owner.'
          assert approved.count(diagnostic)==1,'INFIDELITY_DIAGNOSTIC_DRIFT'
          start=approved.index(diagnostic);end=approved.index(until,start)
          approved=approved[:start]+approved[end:]
          assert approved==old,'CODE_OUTSIDE_ISOLATED_CLONE_CHANGED'
          kb=json.loads(pathlib.Path('redflag-ai-lab/infidelity-knowledge-v1.json').read_text())
          assert kb['schema']=='numi-owner-infidelity-matrix-knowledge-v1' and len(kb['arcana'])==22,'NEW_KB_INVALID'
          assert list(kb['arcana'])==list(map(str,range(1,23))),'ARCANA_ORDER_WRONG'
          old_catalog=json.loads(git(base,'redflag-ai-lab/catalog.json'))
          new_catalog=json.loads(pathlib.Path('redflag-ai-lab/catalog.json').read_text())
          old_items=next(z for z in old_catalog['categories'] if z['id']=='infidelity')['questions']
          new_items=next(z for z in new_catalog['categories'] if z['id']=='infidelity')['questions']
          assert len(old_items)==9 and len(new_items)==10 and new_items[1:]==old_items,'CATALOG_EXISTING_ITEMS_MODIFIED'
          assert new_items[0]=={'id':'faithful','title':'Верный или у него каждая вторая «просто подруга»?'},'FIRST_FIDELITY_QUESTION_WRONG'
          new_catalog['categories'][1]['questions']=old_items
          new_catalog['questions']=old_catalog['questions']
          assert new_catalog==old_catalog,'OTHER_CATALOG_DATA_CHANGED'
          old_js=git(base,'redflag-feature.js')
          new_js=pathlib.Path('redflag-feature.js').read_bytes()
          switches=[
           (b'return Boolean(question.isComingSoon&&ownerDraftAccess&&redflagDraftSections.has(section));',
            b'return Boolean(ownerDraftAccess&&redflagDraftSections.has(section)&&\n    (question.isComingSoon||(section==="infidelity"&&question.id==="faithful")));'),
           (b'if(category==="flags"&&failure.message==="OWNER_TEXT_LENGTH_INVALID"',
            b'if((category==="flags"||category==="infidelity")&&failure.message==="OWNER_TEXT_LENGTH_INVALID"'),
           ('free.textContent = "БЕСПЛАТНО";'.encode('utf-8'),
            'free.textContent = state!==null&&ownerDraftInScope(question,state)?"ИИ · тест":"БЕСПЛАТНО";'.encode('utf-8'))
          ]
          for before,after in switches:
              assert old_js.count(before)==1 and new_js.count(after)==1,'JS_OWNER_SCOPE_MISMATCH'
              new_js=new_js.replace(after,before)
          assert new_js==old_js,'JS_UNRELATED_CHANGED'
          for p in ['app.js','index.html']:
              before=git(base,p)
              after=pathlib.Path(p).read_bytes()
              assert after.replace(b'infidelity-exact-flags-clone-20261122',b'redflag-owner-errorfix-20261122')==before,'ONLY_CACHE_BUST_EXPECTED_'+p
          protected=['redflag-public-catalog.js','redflag-engine.js',
                     'redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/style-test.php']
          for p in protected:
              assert pathlib.Path(p).read_bytes()==git(base,p),'RED_FLAGS_DATA_OR_PUBLIC_CHANGED_'+p
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          allowed=set(targets)|{'.github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml'}
          assert changed==allowed,'UNEXPECTED_FILES_CHANGED_'+repr(changed^allowed)
          print('APPROVED_FLAGS_BYTE_IDENTICAL; EXACT_PROMPT_COPY; INDEPENDENT_22_ARCANA; FULL_31_MATRIX; TEN_EDITOR_QUESTIONS; ZERO_INFERENCE',flush=True)
          PY
      - name: Back up approved production, upload six isolated owner files and verify readback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,ftplib,ssl,io,os,hashlib,re,time,uuid,urllib.request,urllib.error,subprocess
          originals=['redflag-ai-lab/style-test-api.php','redflag-ai-lab/catalog.json','redflag-feature.js','app.js','index.html']
          new_file='redflag-ai-lab/infidelity-knowledge-v1.json'
          paths=originals+[new_file]
          api=originals[0]
          marker=b'__CLOUDRU_KEY_BASE64__'
          def mask(s):
              found=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",s))
              if len(found)!=1:raise RuntimeError('LIVE_API_KEY_LAYOUT_UNKNOWN')
              m=found[0];secret=m.group(2)
              if len(secret)<16 or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_API_KEY_BAD')
              return s[:m.start(2)]+marker+s[m.end(2):],secret
          base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(base+path+'?owner_infidelity_clone='+str(time.time_ns()),
                   headers={'Cache-Control':'no-store','User-Agent':'NumiFidelityCloneRestoreGuard/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          if status('')!=200 or status(api)!=403:raise RuntimeError('LIVE_SITE_PRECHECK_FAILED')
          if status('api/numi-account.php')>=500:raise RuntimeError('LIVE_ACCOUNT_PRECHECK_FAILED')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=home+'/site-safeguard-backups'
          def read(p,absolute=False):
              buffer=io.BytesIO()
              ftp.retrbinary('RETR '+(p if absolute else root+p),buffer.write)
              return buffer.getvalue()
          def write(p,content,absolute=False):
              ftp.storbinary('STOR '+(p if absolute else root+p),io.BytesIO(content))
              if read(p,absolute)!=content:raise RuntimeError('FTPS_READBACK_CHANGED_'+p)
          before={};written=[];new_file_preexists=False;new_file_written=False
          try:
              before={p:read(p) for p in originals}
              old_mask,key=mask(before[api])
              expected=pathlib.Path(api).read_bytes()
              assert expected.count(marker)==1,'SECRET_SLOT_MISSING'
              # old approved baseline must be present on live before modification
              old_api=subprocess.check_output(['git','show','cabd9fedf8b1afab4fac6938b0b811db20130010:'+api])
              if old_mask!=old_api:raise RuntimeError('LIVE_API_NOT_APPROVED_FLAGS')
              for p in originals[1:]:
                  reference=subprocess.check_output(['git','show','cabd9fedf8b1afab4fac6938b0b811db20130010:'+p])
                  if before[p]!=reference:raise RuntimeError('LIVE_FILE_CHANGED_REFUSE_'+p)
              try:
                  before[new_file]=read(new_file)
                  new_file_preexists=True
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              protected=['api/numi-account.php','api/redflag-free-ai.php','redflag-engine.js',
                         'redflag-public-catalog.js','redflag-ai-lab/intimacy-knowledge-v1.json',
                         'redflag-ai-lab/style-test.php']
              protected_hash={p:hashlib.sha256(read(p)).digest() for p in protected}
              desired={p:pathlib.Path(p).read_bytes() for p in paths}
              desired[api]=desired[api].replace(marker,key)
              if subprocess.run(['php','-l'],input=desired[api],capture_output=True).returncode:
                  raise RuntimeError('SERVER_PHP_SYNTAX_FAIL')
              try:ftp.mkd(backup)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              for p in before:
                  write(backup+'/before-infidelity-exact-clone-'+stamp+'-'+p.replace('/','-')+'.bak',before[p],True)
              for p in before:
                  if read(p)!=before[p]:raise RuntimeError('CONCURRENT_LIVE_EDIT_'+p)
              if desired[new_file]!=before.get(new_file):
                  new_file_written=True
                  write(new_file,desired[new_file])
              for p in originals:
                  if desired[p]!=before[p]:
                      written.append(p)
                      write(p,desired[p])
              if status('')!=200 or status(api)!=403:raise RuntimeError('SITE_AUTH_AFTER_FAILED')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_AFTER_FAILED')
              if status('redflag-ai-lab/style-test.php')!=403:raise RuntimeError('OWNER_EDITOR_AUTH_EXPOSED')
              for p in paths:
                  if read(p)!=desired[p]:raise RuntimeError('POST_UPLOAD_DRIFT_'+p)
              for p,h in protected_hash.items():
                  if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_CHANGED_'+p)
              print('INFIDELITY_EXACT_FLAGS_CLONE_PUBLISHED_VERIFIED owner_only=true questions=10 model=gemini3 approved_flags_unchanged=true kb_isolated=true public_payment_untouched=true files=6 inference_calls=0',flush=True)
          except BaseException:
              failed=[]
              for p in reversed(written):
                  try:write(p,before[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:failed.append(p)
              if new_file_written:
                  try:
                      if new_file_preexists:
                          write(new_file,before[new_file])
                          print('ROLLBACK_RESTORED_EXISTING_KB',flush=True)
                      else:
                          ftp.delete(root+new_file)
                          print('ROLLBACK_REMOVED_NEW_KB',flush=True)
                  except BaseException:failed.append(new_file)
              if failed:print('CRITICAL_ROLLBACK_FAILED '+','.join(failed),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
