name: Guarded Gemini infidelity owner pilot; approved Red Flags frozen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml
      - redflag-ai-lab/style-test-api.php
      - redflag-feature.js
      - app.js
      - index.html
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  owner-fidelity-pilot-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate approved Red Flags frozen and isolated fidelity pilot
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          import subprocess,pathlib
          baseline='2fe9243a85a0b426b053bc305b67e6956cf060f9'
          target={
            'redflag-ai-lab/style-test-api.php':'3f8be4cec212e42a0ec1af746008f2baaf777c7f',
            'redflag-feature.js':'b597f3ac49e1ee26c8596918dd14c4827df5f914',
            'app.js':'bab7eed07c90f32a1ef09930474f041d9a71997e',
            'index.html':'ba83c2a21c1a16a527185fbb532d884b4d1657fa'
          }
          def git(p):return subprocess.check_output(['git','show',baseline+':'+p])
          for p,expected_sha in target.items():
              data=pathlib.Path(p).read_bytes()
              actual_sha=subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip()
              assert actual_sha==expected_sha,'TARGET_DRIFT_'+p
          for p in ['redflag-ai-lab/catalog.json','redflag-ai-lab/intimacy-knowledge-v1.json',
                    'redflag-ai-lab/banks/care-or-control.json',
                    'redflag-ai-lab/banks/unified-question-answers-v1.json']:
              assert pathlib.Path(p).read_bytes()==git(p),'APPROVED_KNOWLEDGE_DRIFT_'+p
          old=git('redflag-ai-lab/style-test-api.php')
          new=pathlib.Path('redflag-ai-lab/style-test-api.php').read_bytes()
          def approved_prompt(s):
              p=s.index(b'function rfOwnerSharpFlags(')
              a=s.index(b"$system=<<<'PROMPT'",p)
              z=s.index(b'\nPROMPT;',a)
              return s[a:z]
          assert approved_prompt(old)==approved_prompt(new),'APPROVED_PROMPT_ALTERED'
          def frozen_flags(s):
              i=s.index(b'function rfOwnerSharpFlags(')
              j=s.index(b'\n}',i)+2
              return s[i:j]
          assert frozen_flags(old)==frozen_flags(new),'IDEAL_RED_FLAGS_CODE_ALTERED'
          assert new.count(b'function rfOwnerSharpInfidelityPilot(')==1,'OWNER_FIDELITY_FUNCTION_MISSING'
          assert new.count(b'rfOwnerSharpInfidelityPilot($question,$day,$month,$y,$catalog)')==1,'OWNER_FIDELITY_ROUTE_MISSING'
          assert b"'options'=>['loveHeart','tailFirst','center','top','right']" in new,'FIVE_FIDELITY_POINTS_MISSING'
          assert b"if($category['id']==='infidelity' && $question['id']==='options')" in new,'OWNER_ISOLATION_MISSING'
          assert b'RF_OWNER_INF_PILOT_SHORT_PREVIEW' in new,'EDITOR_SHORT_PREVIEW_MISSING'
          js=pathlib.Path('redflag-feature.js').read_bytes()
          assert b'(category==="flags"||category==="infidelity")' in js,'EDITOR_ERROR_UI_MISSING'
          assert js.count(b'AbortSignal.timeout(125000)')==1,'APPROVED_TIMEOUT_CHANGED'
          assert old.count(b'__CLOUDRU_KEY_BASE64__')==new.count(b'__CLOUDRU_KEY_BASE64__')==1,'SECRET_SLOT_DRIFT'
          for token in [b"2800,'google/gemini-3-flash-preview'",b"if(mb_strlen($text)<450)",
                        b"OWNER_TEXT_LENGTH_INVALID",b"unset($_SESSION['last_generation'])",
                        b"RF_OWNER_FLAGS_SHORT_PREVIEW"]:
              assert token in new,'ERROR_HANDLER_MISSING'
          assert b'AbortSignal.timeout(125000)' in pathlib.Path('redflag-feature.js').read_bytes(),'FRONT_TIMEOUT_CHANGED'
          assert b'infidelity-options-owner-pilot-20261122' in pathlib.Path('app.js').read_bytes(),'CACHE_MISSING_APP'
          assert b'infidelity-options-owner-pilot-20261122' in pathlib.Path('index.html').read_bytes(),'CACHE_MISSING_INDEX'
          print('APPROVED_FLAGS_UNCHANGED; ONE_FIDELITY_OWNER_PILOT; 4 files verified; no paid requests',flush=True)
          PY
      - name: Back up current REG.RU files, publish exact patch, verify and rollback if needed
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,ftplib,ssl,io,os,hashlib,re,time,uuid,urllib.request,urllib.error
          ref='2fe9243a85a0b426b053bc305b67e6956cf060f9'
          paths=['redflag-ai-lab/style-test-api.php','redflag-feature.js','app.js','index.html']
          php=paths[0]
          marker=b'__CLOUDRU_KEY_BASE64__'
          def source(p):return subprocess.check_output(['git','show',ref+':'+p])
          def mask(s):
              found=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",s))
              if len(found)!=1:raise RuntimeError('LIVE_API_KEY_LAYOUT_UNKNOWN')
              m=found[0];secret=m.group(2)
              if len(secret)<16 or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_API_KEY_BAD')
              return s[:m.start(2)]+marker+s[m.end(2):],secret
          host='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(host+path+'?owner_fidelity_pilot='+str(time.time_ns()),
                headers={'Cache-Control':'no-store','User-Agent':'NumiOwnerFidelityPilotGuard/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return resp.status
              except urllib.error.HTTPError as exc:return exc.code
          if status('')!=200 or status(php)!=403:raise RuntimeError('LIVE_SITE_AUTH_UNHEALTHY_BEFORE')
          if status('api/numi-account.php')>=500:raise RuntimeError('LIVE_ACCOUNT_UNHEALTHY_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup_dir=home+'/site-safeguard-backups'
          def read(path,absolute=False):
              buf=io.BytesIO()
              ftp.retrbinary('RETR '+(path if absolute else root+path),buf.write)
              return buf.getvalue()
          def write(path,payload,absolute=False):
              ftp.storbinary('STOR '+(path if absolute else root+path),io.BytesIO(payload))
              if read(path,absolute)!=payload:raise RuntimeError('READBACK_MISMATCH_'+path)
          before={};written=[]
          try:
              before={p:read(p) for p in paths}
              previous_mask,key=mask(before[php])
              if previous_mask!=source(php):raise RuntimeError('LIVE_API_NOT_APPROVED_BASELINE_REFUSE')
              for p in paths[1:]:
                  if before[p]!=source(p):raise RuntimeError('LIVE_CHANGED_REFUSE_'+p)
              protected=['api/numi-account.php','api/redflag-free-ai.php','redflag-engine.js',
                         'redflag-public-catalog.js','redflag-ai-lab/catalog.json',
                         'redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/style-test.php']
              protected_hash={p:hashlib.sha256(read(p)).digest() for p in protected}
              desired={p:pathlib.Path(p).read_bytes() for p in paths}
              if desired[php].count(marker)!=1:raise RuntimeError('SOURCE_API_KEY_SLOT_BAD')
              desired[php]=desired[php].replace(marker,key)
              if subprocess.run(['php','-l'],input=desired[php],capture_output=True).returncode:
                  raise RuntimeError('LIVE_PATCH_PHP_SYNTAX_INVALID')
              try:ftp.mkd(backup_dir)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              for p in paths:
                  write(backup_dir+'/before-owner-fidelity-pilot-'+stamp+'-'+p.replace('/','-')+'.bak',before[p],True)
              for p in paths:
                  if read(p)!=before[p]:raise RuntimeError('CONCURRENT_LIVE_EDIT_'+p)
              for p in paths:
                  if desired[p]!=before[p]:
                      written.append(p)
                      write(p,desired[p])
              if status('')!=200 or status(php)!=403:raise RuntimeError('SITE_OWNER_AUTH_AFTER')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_FAILED_AFTER')
              if status('redflag-ai-lab/style-test.php')!=403:raise RuntimeError('OWNER_EDITOR_PAGE_EXPOSED')
              for p in paths:
                  if read(p)!=desired[p]:raise RuntimeError('POST_RELEASE_CHANGED_'+p)
              for p,h in protected_hash.items():
                  if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              print('OWNER_INF_OPTIONS_PILOT_PUBLISHED_VERIFIED model_gemini_reused=true approved_flags_unchanged=true numeric_base_untouched=true client_payments_untouched=true backups=true inference_calls=0',flush=True)
          except BaseException:
              errors=[]
              for p in reversed(written):
                  try:write(p,before[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:errors.append(p)
              if errors:print('CRITICAL_ROLLBACK_FAILED '+','.join(errors),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
