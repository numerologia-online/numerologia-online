name: Guarded faithful-only fidelity point correction (no paid tests)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  one-faithful-question:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact isolated change and lint PHP
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import subprocess,pathlib,json
          base='6c5ad2b2373600634c980a9366fb10c153882a41'
          p='redflag-ai-lab/style-test-api.php'
          old=subprocess.check_output(['git','show',base+':'+p])
          now=pathlib.Path(p).read_bytes()
          a=b"'faithful'=>['loveHeart','center','tailFirst','left','top'],"
          b=b"'faithful'=>['loveHeart','left','top','tailSecond','bottom'],"
          a2=b"$kbFile=$id==='faithful'?'intimacy-knowledge-v1.json':'infidelity-knowledge-v1.json';\n   $kbSchema=$id==='faithful'?'numi-owner-intimacy-matrix-knowledge-v1':'numi-owner-infidelity-matrix-knowledge-v1';\n   $kb=json_decode((string)file_get_contents(__DIR__.'/'.$kbFile),true,25,JSON_THROW_ON_ERROR);\n   if(($kb['schema']??null)!==$kbSchema"
          b2=b"$kb=json_decode((string)file_get_contents(__DIR__.'/infidelity-knowledge-v1.json'),true,25,JSON_THROW_ON_ERROR);\n   if(($kb['schema']??null)!=='numi-owner-infidelity-matrix-knowledge-v1'"
          start=old.index(b'function rfOwnerSharpInfidelity(')
          end=old.index(b'\n\ntry {',start)
          before=old[start:end]
          assert before.count(a)==before.count(a2)==1,'EXPECTED_ORIGINAL_NOT_FOUND'
          expected=old[:start]+before.replace(a,b).replace(a2,b2)+old[end:]
          assert now==expected,'OUTSIDE_FAITHFUL_FUNCTION_CHANGED'
          flag_start=old.index(b'function rfOwnerSharpFlags(')
          assert old[flag_start:start]==now[flag_start:start],'APPROVED_FLAGS_CHANGED'
          protected=[
            'redflag-ai-lab/catalog.json',
            'redflag-ai-lab/intimacy-knowledge-v1.json',
            'redflag-ai-lab/infidelity-knowledge-v1.json',
            'redflag-ai-lab/style-test.php',
            'redflag-feature.js','redflag-public-catalog.js',
            'redflag-engine.js','app.js','index.html',
            'api/redflag-free-ai.php'
          ]
          for filename in protected:
              assert pathlib.Path(filename).read_bytes()==subprocess.check_output(['git','show',base+':'+filename]),'PROTECTED_CHANGED_'+filename
          allowed={p,'.github/workflows/numi-redflag-prejealousy-full-restore-20261122.yml'}
          touched=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert touched==allowed, 'UNEXPECTED_CHANGED_FILES_'+repr(touched^allowed)
          catalog=json.loads(pathlib.Path('redflag-ai-lab/catalog.json').read_text())
          assert len(next(c for c in catalog['categories'] if c['id']=='infidelity')['questions'])==10
          assert len(json.loads(pathlib.Path('redflag-ai-lab/intimacy-knowledge-v1.json').read_text())['arcana'])==22
          assert b"'google/gemini-3-flash-preview'" in now
          print('GUARD_OK only_faithful_points_and_fidelity_KB approved_prompt_frozen red_flags_frozen other_9_frozen',flush=True)
          PY
      - name: No-cost offline matrix check for all 366 calendar dates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          path=pathlib.Path('redflag-ai-lab/style-test-api.php')
          src=path.read_text()
          start=src.index('function rfOwner22(')
          end=src.index('\n\ntry {',src.index('function rfOwnerSharpInfidelity('))
          mock=r"""<?php
          function rfCloudCall(array $messages,int $tokens,string $model=''):string {
             if($tokens!==2800||$model!=='google/gemini-3-flash-preview')throw new RuntimeException('MODEL_OR_BUDGET_CHANGED');
             $GLOBALS['mockMessages']=$messages;
             return str_repeat('Подробный связный текст для бесплатной технической проверки. ',16)
                ."\n\n".str_repeat('Второй абзац проверки. ',9);
          }
          """
          tests=r"""
          $catalog=json_decode(file_get_contents(__DIR__.'/catalog.json'),true,20,JSON_THROW_ON_ERROR);
          $q=null;
          foreach($catalog['categories'] as $group)
            if($group['id']==='infidelity')foreach($group['questions'] as $question)
              if($question['id']==='faithful')$q=$question;
          if(!is_array($q))throw new RuntimeException('FAITHFUL_MISSING');
          $kb=json_decode(file_get_contents(__DIR__.'/infidelity-knowledge-v1.json'),true,25,JSON_THROW_ON_ERROR);
          $positions=['loveHeart','left','top','tailSecond','bottom'];
          $example=rfOwner31(15,7,1987);
          foreach([5,15,7,8,11] as $i=>$n)if($example[$positions[$i]]!==$n)throw new RuntimeException('FAITHFUL_15071987_POINT_CHECK');
          $count=0;
          for($month=1;$month<=12;$month++)for($day=1;$day<=31;$day++){
            if(!checkdate($month,$day,2000))continue;
            $text=rfOwnerSharpInfidelity($q,$day,$month,2000,$catalog);
            if(substr_count($text,"\n\n")!==1)throw new RuntimeException('TWO_PARAGRAPHS_MISSING');
            $input=json_decode($GLOBALS['mockMessages'][1]['content'],true,24,JSON_THROW_ON_ERROR);
            $points=$input['трактовки_значимых_позиций_полной_матрицы']??[];
            if(count($points)!==5)throw new RuntimeException('FIVE_POINTS_MISSING');
            $matrix=rfOwner31($day,$month,2000);
            foreach($positions as $i=>$k){
              $a=$kb['arcana'][(string)$matrix[$k]];
              if($points[$i]['роль_точки']!==$kb['pointDescriptions'][$k]
               ||$points[$i]['ведущий_мотив']!==$a['core']
               ||$points[$i]['теневая_сторона']!==$a['minus'])
                  throw new RuntimeException('MATRIX_MISMATCH_'+$day.'_'.$month.'_'.$k);
            }
            $count++;
          }
          if($count!==366)throw new RuntimeException('CALENDAR_COVERAGE_INCOMPLETE');
          echo "OFFLINE_OK 366_dates five_real_matrix_points approved_22_arcana paid_calls=0\n";
          """
          check=pathlib.Path('redflag-ai-lab/_qa_faithful_no_paid.php')
          check.write_text(mock+src[start:end]+"\n"+tests)
          PY
          php -l redflag-ai-lab/_qa_faithful_no_paid.php
          php redflag-ai-lab/_qa_faithful_no_paid.php
          rm redflag-ai-lab/_qa_faithful_no_paid.php
      - name: Back up and publish ONLY editor API with safe rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,ftplib,ssl,io,os,re,hashlib,time,uuid,urllib.request,urllib.error
          base='6c5ad2b2373600634c980a9366fb10c153882a41'
          api='redflag-ai-lab/style-test-api.php'
          marker=b'__CLOUDRU_KEY_BASE64__'
          old=subprocess.check_output(['git','show',base+':'+api])
          desired=pathlib.Path(api).read_bytes()
          assert old.count(marker)==desired.count(marker)==1,'KEY_PLACEHOLDER_INVALID'
          def mask_secret(value):
              hits=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",value))
              if len(hits)!=1:raise RuntimeError('LIVE_API_KEY_LAYOUT_UNKNOWN')
              m=hits[0];secret=m.group(2)
              if not re.fullmatch(rb'[A-Za-z0-9+/=]{16,}',secret):raise RuntimeError('LIVE_KEY_INVALID')
              return value[:m.start(2)]+marker+value[m.end(2):],secret
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(url):
              req=urllib.request.Request(site+url+'?faithful_guard='+str(time.time_ns()),
                  headers={'Cache-Control':'no-store','User-Agent':'NumiFaithfulOwnerOnly/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=28) as response:return response.status
              except urllib.error.HTTPError as e:return e.code
          def health():
              return status('')==200 and status(api)==403 and status('redflag-ai-lab/style-test.php')==403 and status('api/numi-account.php')<500
          if not health():raise RuntimeError('SITE_PRECHECK_FAILED')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=44)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=home+'/site-safeguard-backups'
          def read(p,absolute=False):
              buffer=io.BytesIO();ftp.retrbinary('RETR '+(p if absolute else root+p),buffer.write);return buffer.getvalue()
          def write(p,v,absolute=False):
              ftp.storbinary('STOR '+(p if absolute else root+p),io.BytesIO(v))
              if read(p,absolute)!=v:raise RuntimeError('READBACK_MISMATCH_'+p)
          protected=['redflag-ai-lab/intimacy-knowledge-v1.json',
                     'redflag-ai-lab/infidelity-knowledge-v1.json','redflag-ai-lab/catalog.json',
                     'redflag-feature.js','redflag-public-catalog.js','redflag-engine.js',
                     'app.js','index.html','api/numi-account.php','api/redflag-free-ai.php']
          changed=False
          previous=None
          try:
              previous=read(api)
              masked,key=mask_secret(previous)
              if masked!=old:
                  if masked==desired:
                      print('ALREADY_PUBLISHED_FAITHFUL_CORRECTED',flush=True)
                  else:
                      raise RuntimeError('LIVE_SOURCE_DRIFT_REFUSE_DEPLOYMENT')
              else:
                  protected_sha={p:hashlib.sha256(read(p)).digest() for p in protected}
                  patched=desired.replace(marker,key)
                  if subprocess.run(['php','-l'],input=patched,capture_output=True).returncode:
                      raise RuntimeError('PATCHED_PHP_LINT_FAILED')
                  try:ftp.mkd(backup)
                  except ftplib.error_perm as e:
                      if not str(e).startswith('550'):raise
                  stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
                  write(backup+'/before-faithful-fidelity-points-'+stamp+'.bak',previous,True)
                  if read(api)!=previous:raise RuntimeError('CONCURRENT_LIVE_CHANGE')
                  changed=True
                  write(api,patched)
                  if not health():raise RuntimeError('SITE_POSTCHECK_FAILED')
                  for p,h in protected_sha.items():
                      if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
                  print('FAITHFUL_POINTS_PUBLISHED editor_only=true question=faithful other_9_unchanged=true approved_flags_unchanged=true gemini3_unchanged=true paid_calls=0',flush=True)
          except BaseException:
              if changed and previous is not None:
                  try:write(api,previous);print('ROLLBACK_FAITHFUL_API_OK',flush=True)
                  except BaseException:print('CRITICAL_ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
