name: REG.RU private preview (staging only, password required)

on:
  push:
    paths:
      - .github/workflows/reg-ru-private-preview.yml
      - .github/private-preview-release.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-private-preview
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code, not production hosting
        uses: actions/checkout@v4
      - name: Provision password-protected preview and verify denied anonymous access
        env:
          FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASS: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, ftplib, hashlib, io, json, os, pathlib, re, secrets, socket, ssl, sys, time, urllib.error, urllib.parse, urllib.request

          # Generated password is NEVER committed. Only its salted bcrypt hash is stored.
          STAGING = "vesta-blinchik-numi-c313e2f44ae802e16599"
          AUTH_LINE = "numi:$2y$12$L3RsE1p6wD3Nd48n.Ft4bO7vBwZVVBqJ7EU8V7nnp67.jQhpUua76"
          DOMAIN = "xn--c1adkkdfjbp1a4l.online"
          REMOTE_SITE = "www/" + DOMAIN
          BASE = "https://" + DOMAIN + "/" + STAGING + "/"

          host = os.environ.get("FTP_HOST", "").strip()
          username = os.environ.get("FTP_USER", "").strip()
          password = os.environ.get("FTP_PASS", "")
          if not (host and username and password):
              raise SystemExit("Missing FTP connection secrets. No production files touched.")
          socket.inet_aton(host)
          hostname = socket.gethostbyaddr(host)[0].rstrip(".").lower()
          if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru", hostname):
              raise SystemExit("Unverified REG.RU hosting endpoint. No files touched.")
          if host not in {x[4][0] for x in socket.getaddrinfo(hostname, 21, type=socket.SOCK_STREAM)}:
              raise SystemExit("REG.RU FTP hostname mismatch. No files touched.")

          def write(ftps, name, data):
              ftps.storbinary("STOR " + name, io.BytesIO(data))
          def get(ftps, name, limit=350000):
              received = bytearray()
              def add(chunk):
                  received.extend(chunk)
                  if len(received) > limit:
                      raise RuntimeError("Refusing unexpected large remote file")
              ftps.retrbinary("RETR " + name, add)
              return bytes(received)
          def http_get(url, timeout=12):
              request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Private-staging-access-check/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, response.read(100000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(2000)

          ftps = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20)
          try:
              ftps.connect(hostname,21)
              ftps.auth()
              ftps.login(username,password)
              ftps.prot_p()
              ftps.set_pasv(True)
              home = ftps.pwd()
              ftps.cwd(REMOTE_SITE)
              live_root = ftps.pwd()
              if not any(x.rsplit("/",1)[-1]=="index.html" for x in ftps.nlst()):
                  raise RuntimeError("Expected live site not found; refusing to change anything")
              ftps.cwd(live_root)
              new = False
              try:
                  ftps.cwd(STAGING)
              except ftplib.error_perm:
                  ftps.mkd(STAGING)
                  ftps.cwd(STAGING)
                  new = True
              preview_root = ftps.pwd()

              if new:
                  # A temporary random PHP probe obtains server filesystem path.
                  # It holds no credentials, accepts an unguessable token, and is removed.
                  probe_token = secrets.token_urlsafe(24)
                  probe_name = "_path_probe_" + secrets.token_hex(12) + ".php"
                  php = ('<?php\n'
                         'header("Content-Type: text/plain; charset=UTF-8");\n'
                         'header("Cache-Control: no-store");\n'
                         'if (!hash_equals(' + json.dumps(probe_token) + ', $_GET["key"] ?? "")) { http_response_code(404); exit; }\n'
                         'echo __DIR__;\n')
                  try:
                      write(ftps,probe_name,php.encode("utf-8"))
                      status, response = http_get(BASE + probe_name + "?key=" + urllib.parse.quote(probe_token))
                      absolute_path = response.decode("utf-8", "replace").strip()
                      if (status != 200 or not absolute_path.startswith("/") or
                          not absolute_path.endswith("/" + STAGING) or
                          len(absolute_path) > 500 or "\n" in absolute_path):
                          raise RuntimeError("Could not confirm PHP directory path. Safe setup aborted.")
                  finally:
                      try: ftps.delete(probe_name)
                      except Exception: pass

                  # Protect the isolated folder before copying any site content.
                  write(ftps, ".htpasswd", (AUTH_LINE + "\n").encode())
                  protected_config = (
                      'Options -Indexes\n'
                      'AuthType Basic\n'
                      'AuthName "Private NUMI preview"\n'
                      'AuthUserFile "' + absolute_path + '/.htpasswd"\n'
                      'Require valid-user\n'
                      '<FilesMatch "^\\.ht">\n'
                      '  Require all denied\n'
                      '</FilesMatch>\n'
                  )
                  write(ftps,".htaccess",protected_config.encode("utf-8"))
                  write(ftps,"index.html",b"<!doctype html><html><title>Private preview</title><body>AUTH-PROTECTED</body></html>\n")
                  write(ftps,"asset-access-check.txt",b"AUTH-PROTECTED-ASSET\n")
                  print("Created private preview directory; no production file replaced.")
              else:
                  policy = get(ftps,".htaccess").decode("utf-8","replace")
                  if not ("AuthType Basic" in policy and "Require valid-user" in policy and "AuthUserFile" in policy):
                      raise RuntimeError("Stage password protection missing; refusing to upload")
                  print("Existing preview folder detected. Checking access policy before files.")

              # Security gate: deny all anonymous visitors BEFORE uploading client assets.
              for part in ("", "index.html", "asset-access-check.txt"):
                  status, _ = http_get(BASE + part)
                  if status != 401:
                      raise RuntimeError("Stage NOT PRIVATE: anonymous URL returned HTTP " + str(status) + ". Refusing to copy site files.")
              print("ANONYMOUS ACCESS DENIED (401): home, index, nested asset test.")
              # Stage only browser-side resources; do not copy live PHP APIs, DB credentials,
              # GitHub settings, secrets, server code or build/deployment internals.
              SKIP_DIRS = {".git", ".github", ".vercel", "node_modules", "api",
                           "auth-server", "auth-free", "cloudflare", "docs",
                           "scripts", "server", "tests", "test", "__pycache__"}
              ALLOWED = {".html", ".js", ".mjs", ".css", ".json", ".jsonc", ".svg",
                         ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico",
                         ".webmanifest", ".txt", ".woff", ".woff2", ".ttf"}
              staged = {}
              for root, dirs, names in os.walk("."):
                  dirs[:] = [x for x in dirs if x not in SKIP_DIRS and not x.startswith(".")]
                  for filename in names:
                      if filename.startswith("."):
                          continue
                      local = pathlib.Path(root,filename)
                      relative = local.relative_to(".").as_posix()
                      if local.is_symlink() or local.suffix.lower() not in ALLOWED:
                          continue
                      if local.stat().st_size > 8000000:
                          raise RuntimeError("Unexpectedly large public asset: " + relative)
                      data = local.read_bytes()
                      if relative == "index.html":
                          # Use a clear visual label; never modify production index.html.
                          html = data.decode("utf-8")
                          html = html.replace('name="robots" content="index, follow"', 'name="robots" content="noindex,nofollow,noarchive"')
                          marker = ('<div style="position:fixed;z-index:2147483647;top:0;left:0;'
                                    'right:0;background:#25213a;color:#fff;text-align:center;'
                                    'font:600 13px Arial,sans-serif;padding:8px"> '
                                    'ТЕСТОВАЯ ВЕРСИЯ - ДЛЯ ПРОВЕРКИ, НЕ ДЛЯ ПОКУПОК'
                                    '</div>')
                          html = html.replace("</body>",marker + "</body>")
                          data = html.encode("utf-8")
                      staged[relative] = data

              # Fail closed: check access again immediately before site content.
              status, _ = http_get(BASE + "index.html")
              if status != 401:
                  raise RuntimeError("Preview protection changed, refusing upload")
              created_dirs = {""}
              uploaded = 0
              identical = 0
              ftps.cwd(preview_root)
              for relative, data in sorted(staged.items()):
                  path = pathlib.PurePosixPath(relative)
                  if len(path.parts) > 1:
                      prefix = ""
                      for part in path.parts[:-1]:
                          prefix = (prefix + "/" + part).strip("/")
                          if prefix not in created_dirs:
                              try:
                                  ftps.mkd(prefix)
                              except ftplib.error_perm:
                                  pass
                              created_dirs.add(prefix)
                  # All paths are relative to the staging folder (never production root).
                  try:
                      old = get(ftps,relative,limit=8000000)
                      if hashlib.sha256(old).digest() == hashlib.sha256(data).digest():
                          identical += 1
                          continue
                  except ftplib.error_perm:
                      pass
                  write(ftps,relative,data)
                  uploaded += 1
                  if uploaded % 50 == 0:
                      print("PREVIEW FILES UPLOADED:",uploaded)

              status,_=http_get(BASE)
              status_css,_=http_get(BASE+"styles.css")
              status_json,_=http_get(BASE+"manifest.webmanifest")
              print("FINAL ANONYMOUS ACCESS statuses (all must equal 401):",status,status_css,status_json)
              if (status,status_css,status_json)!=(401,401,401):
                  raise RuntimeError("Final security audit failed. Keep preview unpublished.")
              print("PRIVATE PREVIEW READY; staged:",len(staged),
                    "new/changed:",uploaded,"unchanged:",identical)
              print("PRODUCTION ROOT FILES MODIFIED: 0")
          finally:
              try: ftps.quit()
              except Exception: ftps.close()
          PY
