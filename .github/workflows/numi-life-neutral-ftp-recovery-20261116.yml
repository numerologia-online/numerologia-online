name: Restore FTP credentials syntax and publish reviewed neutral full-life texts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-life-neutral-ftp-recovery-20261116.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly reviewed published GitHub content commit
        uses: actions/checkout@v4
        with:
          ref: 701b061d4247255ac6aade1b96ebdc56d6090cd0
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct strictly audited release manifest without editing repository
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-life-neutral-20261116.py
          python3 - <<'PY'
          import json,subprocess,hashlib,pathlib,re
          def gitshow(revision,path):
              return subprocess.check_output(['git','show',revision+':'+path])
          def sha(value):
              return hashlib.sha256(value).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='701b061d4247255ac6aade1b96ebdc56d6090cd0'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='3c39295b4a7ad56f95998bc8c0280de5edc39d21'
          paths=subprocess.check_output(['git','diff','HEAD^','HEAD','--name-only'],text=True).splitlines()
          manifest='account-service/private/store-assets.json'
          names=[name for name in paths if name!=manifest]
          assert len(names)==21,(len(names),names)
          assert set(paths)==set(names)|{manifest}
          assert all(re.fullmatch(r'knowledge/full-report/sections/energy-(?:[1-9]|1[0-9]|2[0-2])\.json',x) for x in names)
          prev_manifest=json.loads(gitshow('HEAD^',manifest))
          next_manifest=json.loads(gitshow('HEAD',manifest))
          updates=[]
          for name in names:
              oldhash=sha(gitshow('HEAD^',name))
              newhash=sha(gitshow('HEAD',name))
              assert oldhash != newhash
              assert prev_manifest['files'][name]==oldhash
              assert next_manifest['files'][name]==newhash
              updates.append([name,oldhash,newhash,1])
          pathlib.Path('/tmp/numi-life-gender-release.json').write_text(json.dumps({'updates':updates}),encoding='utf8')
          print('NEUTRAL_LIFE_RECOVERY_PRECHECK_OK banks=21 manifest=verified original_revision=pinned no_repository_changes=true')
          PY
      - name: Back up and publish only verified 21 banks and protected hashes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/deploy-life-neutral-20261116.py
