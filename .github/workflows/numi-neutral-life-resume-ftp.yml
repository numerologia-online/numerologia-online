name: Resume ONLY final REG.RU full-life text publication after protected manifest check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-neutral-life-resume-ftp.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify no source/UI files will be edited during publication
        run: |
          python3 -m py_compile scripts/release-neutral-life-20261116.py
          python3 - <<'PY'
          import pathlib,json,hashlib
          item=json.loads(pathlib.Path('account-service/private/store-assets.json').read_text('utf8'))
          assert item['version']==2
          for n in [1,2,4,6,7,8,9,11,13,14,19,22]:
            path='knowledge/full-report/sections/energy-'+str(n)+'.json'
            assert item['files'][path]==hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          assert len(list(pathlib.Path('knowledge/full-report/sections').glob('energy-*.json')))==22
          print('NEUTRAL_LIFE_READY_TO_DEPLOY bank_hashes=12 synced=true original_other_texts_intact=true')
          PY
      - name: Update only 16 original text files, 12 private bank copies, and their 12 manifest entries
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/release-neutral-life-20261116.py deploy
