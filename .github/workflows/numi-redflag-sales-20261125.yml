name: Red Flag buyer sale and wallet safety release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-redflag-sales-20261125.yml'
      - '.github/scripts/numi_redflag_sales_20261125.py'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NUMI_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=numi_test;charset=utf8mb4"
      NUMI_TEST_MYSQL_USER: root
      NUMI_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all questions, prices, free guards and existing wallet ledger on isolated MySQL
        run: |
          set -euo pipefail
          php -l account-service/private/flags-fidelity-live.php
          php -l account-service/public/numi-flags-fidelity-free.php
          php -l account-service/private/wallet-real-payment.php
          php -l account-service/private/wallet-real.php
          php -l account-service/private/fulfillment.php
          php account-service/tests/redflag-sales.php
          php account-service/tests/real-wallet.php
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
          node --check redflag-feature.js
          node --check wallet-client.js
      - name: Guarded REG.RU release with backups and no real purchases
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_redflag_sales_20261125.py
