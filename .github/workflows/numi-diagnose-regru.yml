name: Diagnose REG.RU files read-only
on:
  push:
    paths:
      - .github/workflows/numi-diagnose-regru.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check live FTPS files without writing
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/diagnose-regru-files.py
