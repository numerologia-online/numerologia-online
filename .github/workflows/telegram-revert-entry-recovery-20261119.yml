name: Restore pre-Cloud.ru Telegram entry and audited asset paths
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-revert-entry-recovery-20261119.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Restore only Nov 19 cache-busted entry assets and original bot menu
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,ftplib,io,re,urllib.request,urllib.parse,json,time,subprocess
          original_url='https://нумерология-онлайн.рф/'
          known_new='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/?v=recovery-20261119-v1'
          stamp='recovery-20261119-v1'
          host='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          web=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          bak=home+'/site-safeguard-backups/'
          def read(path):
              b=io.BytesIO();ftp.retrbinary('RETR '+path,b.write);return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('FTP_READBACK_MISMATCH')
          original={p:read(bak+stamp+'-'+p+'.bak') for p in ['index.html','app.js']}
          live={p:read(web+p) for p in original}
          html=original['index.html'].decode('utf-8')
          app=original['app.js'].decode('utf-8')
          html,n=re.subn(r'(<script\b[^>]*\bsrc=["\x27])([^"\x27]+)(["\x27])',lambda m:m[1]+m[2].split('?')[0]+'?v='+stamp+m[3],html)
          html,c=re.subn(r'(<link\b[^>]*href=["\x27])([^"\x27]+\.css)(?:\?[^"\x27]*)?(["\x27])',lambda m:m[1]+m[2]+'?v='+stamp+m[3],html)
          app,a=re.subn(r'(\./[A-Za-z0-9_/-]+\.js|[A-Za-z0-9_/-]+\.css)\?[^"\x27\s)]+',lambda m:m[1]+'?v='+stamp,app)
          if n<6 or a<5:raise RuntimeError('BACKUP_SHAPE_UNKNOWN')
          updated={'index.html':html.encode(),'app.js':app.encode()}
          if any(live[p]!=updated[p] and live[p]!=original[p] for p in live):
              raise RuntimeError('LIVE_CODE_CHANGED_REFUSE_OVERWRITE')
          subprocess.run(['node','--input-type=module','--check'],input=original['app.js'],check=True)
          private=read(home+'/private/bot-config.php')
          tokens=set(re.findall(rb'[0-9]{6,15}:[A-Za-z0-9_-]{30,60}',private))
          if len(tokens)!=1:raise RuntimeError('BOT_TOKEN_AMBIGUOUS')
          token=next(iter(tokens)).decode()
          def bot(method,payload=None):
              request=urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method,
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8') if payload is not None else None,
                  headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=20) as response:obj=json.load(response)
              if obj.get('ok') is not True:raise RuntimeError('TELEGRAM_API_NOT_OK')
              return obj['result']
          menu=bot('getChatMenuButton')
          if menu.get('type')!='web_app' or menu.get('text')!='Жми сюда 🫶':
              raise RuntimeError('UNEXPECTED_EXISTING_MENU')
          menu_url=menu.get('web_app',{}).get('url')
          if menu_url not in (original_url,known_new):
              raise RuntimeError('UNEXPECTED_MENU_URL_REFUSE_CHANGE')
          changed=[]
          try:
              for p in ('app.js','index.html'):
                  if live[p]!=original[p]:
                      write(web+p,original[p]);changed.append(p)
              site='https://'+host+'/'
              for p in original:
                  req=urllib.request.Request(site+p+'?verify_telegram_restore='+str(time.time_ns()),
                      headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as res:
                      if res.status!=200 or res.read(600000)!=original[p]:
                          raise RuntimeError('PUBLIC_READBACK_FAILED')
              print('SITE_ENTRY_RESTORED files='+','.join(changed)+' payment_db_cron_untouched=true',flush=True)
          except BaseException:
              for p in reversed(changed):
                  try:write(web+p,live[p])
                  except Exception:print('ROLLBACK_REQUIRES_MANUAL_REVIEW',p,flush=True)
              raise
          ftp.quit()
          if menu_url!=original_url:
              bot('setChatMenuButton',{'menu_button':{'type':'web_app','text':menu['text'],
                  'web_app':{'url':original_url}}})
          final=bot('getChatMenuButton')
          link=urllib.parse.urlsplit(final.get('web_app',{}).get('url',''))
          link_host=link.hostname.encode('idna').decode('ascii') if link.hostname else ''
          if final.get('type')!='web_app' or link_host!=host or link.path!='/' or link.query!='':
              raise RuntimeError('MENU_RESTORE_NOT_VERIFIED')
          print('TELEGRAM_ORIGINAL_LAUNCH_URL_RESTORED_AND_VERIFIED',flush=True)
          print('NO_DATABASE_PAYMENT_CRON_OR_MODEL_CHANGES',flush=True)
          PY
