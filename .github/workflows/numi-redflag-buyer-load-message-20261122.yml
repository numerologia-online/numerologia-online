name: Guarded Red Flag buyer loading message release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-buyer-load-message-20261122.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish-buyer-message:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the three browser modules
        run: |
          set -euo pipefail
          node --input-type=module --check < wallet-client.js
          node --input-type=module --check < redflag-feature.js
          node --input-type=module --check < app.js
      - name: Back up, publish and verify the buyer message on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import hashlib
          import io
          import os
          import ssl
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid
          from pathlib import Path

          targets = ('wallet-client.js', 'redflag-feature.js', 'app.js', 'index.html')
          protected = ('api/numi-account.php', 'redflag-ai-lab/style-test-api.php')
          workflow = '.github/workflows/numi-redflag-buyer-load-message-20261122.yml'
          version = 'redflag-buyer-message-20261122'
          site = 'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'

          def git(*args):
              return subprocess.check_output(['git', *args])

          head = git('rev-parse', 'HEAD').strip()
          base = git('rev-parse', 'HEAD^').decode().strip()
          changed_paths = set(git('diff', '--name-only', base, 'HEAD').decode().splitlines())
          if changed_paths != set(targets + (workflow,)):
              raise RuntimeError('BUYER_MESSAGE_RELEASE_SCOPE_CHANGED')

          original_sources = {path: git('show', f'{base}:{path}') for path in targets}
          desired = {path: Path(path).read_bytes() for path in targets}
          for path, asset in (('app.js', 'redflag-feature.js'), ('index.html', 'app.js')):
              before = f'{asset}?v=redflag-answer-check-20261122'.encode()
              after = f'{asset}?v={version}'.encode()
              if original_sources[path].count(before) != 1 or desired[path] != original_sources[path].replace(before, after):
                  raise RuntimeError('UNEXPECTED_CHANGE_OUTSIDE_ASSET_VERSION_' + path)

          def ensure_main():
              remote = git('ls-remote', 'origin', 'refs/heads/main').split()
              if not remote or remote[0] != head:
                  raise RuntimeError('MAIN_ADVANCED_BEFORE_RELEASE')

          def get_public(path):
              req = urllib.request.Request(site + path, headers={
                  'Cache-Control': 'no-cache', 'User-Agent': 'NumiBuyerMessageReleaseCheck/1.0'
              })
              try:
                  with urllib.request.urlopen(req, timeout=24) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b''

          def check_health():
              query = '?buyer_copy_check=' + str(time.time_ns())
              if get_public(query)[0] != 200:
                  raise RuntimeError('HOME_NOT_AVAILABLE')
              if get_public(protected[0] + query)[0] >= 500:
                  raise RuntimeError('ACCOUNT_NOT_AVAILABLE')
              if get_public(protected[1] + query)[0] != 403:
                  raise RuntimeError('EDITOR_ONLY_ACCESS_CHECK_FAILED')

          check_health()
          ensure_main()
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=36) as ftp:
              ftp.connect('server172.hosting.reg.ru', 21)
              ftp.login(os.environ['REG_FTP_USER'], os.environ['REG_FTP_PASSWORD'])
              ftp.prot_p()
              server_home = ftp.pwd().rstrip('/')
              root = server_home + '/www/xn--c1adkkdfjbp1a4l.online/'
              backup = server_home + '/site-safeguard-backups/'
              release = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime()) + '-' + uuid.uuid4().hex[:8]

              def read(path):
                  buffer = io.BytesIO()
                  ftp.retrbinary('RETR ' + path, buffer.write)
                  return buffer.getvalue()

              def store(path, value):
                  ftp.storbinary('STOR ' + path, io.BytesIO(value))
                  if read(path) != value:
                      raise RuntimeError('FTP_READBACK_MISMATCH')

              def install(path, value):
                  staged = backup + 'redflag-buyer-stage-' + uuid.uuid4().hex
                  store(staged, value)
                  ftp.rename(staged, root + path)
                  if read(root + path) != value:
                      raise RuntimeError('LIVE_READBACK_MISMATCH_' + path)

              originals = {path: read(root + path) for path in targets}
              protected_sha = {path: hashlib.sha256(read(root + path)).digest() for path in protected}
              for path in targets:
                  if originals[path] not in (original_sources[path], desired[path]):
                      raise RuntimeError('UNEXPECTED_LIVE_SOURCE_' + path)

              changed = [path for path in targets if originals[path] != desired[path]]
              for path in changed:
                  store(backup + 'before-redflag-buyer-' + release + '-' + path, originals[path])
              ensure_main()
              attempted = []
              try:
                  for path in changed:
                      if read(root + path) != originals[path]:
                          raise RuntimeError('CONCURRENT_LIVE_CHANGE_' + path)
                      attempted.append(path)
                      install(path, desired[path])
                  check_health()
                  for path in targets[:-1]:
                      status, body = get_public(path + '?v=' + version)
                      if status != 200 or body != desired[path]:
                          raise RuntimeError('PUBLIC_ASSET_CHECK_FAILED_' + path)
                  status, index = get_public('?buyer_copy_release=' + release)
                  if status != 200 or f'app.js?v={version}'.encode() not in index:
                      raise RuntimeError('PUBLIC_ENTRYPOINT_CHECK_FAILED')
                  for path, expected in protected_sha.items():
                      if hashlib.sha256(read(root + path)).digest() != expected:
                          raise RuntimeError('PROTECTED_FILE_CHANGED_' + path)
              except BaseException:
                  failed = []
                  for path in reversed(attempted):
                      try:
                          if read(root + path) != originals[path]:
                              install(path, originals[path])
                      except Exception:
                          failed.append(path)
                  if failed:
                      print('REDFLAG_BUYER_ROLLBACK_FAILED ' + ','.join(failed), flush=True)
                  elif attempted:
                      print('REDFLAG_BUYER_ROLLBACK_VERIFIED', flush=True)
                  raise

          print(f'REDFLAG_BUYER_MESSAGE_PUBLISHED updated_files={len(changed)} provider_calls=0 purchase_calls=0', flush=True)
          PY
