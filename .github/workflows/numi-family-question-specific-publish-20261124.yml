name: Publish Family owner question-specific synthesis and KB only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-question-specific-publish-20261124.yml
      - .github/scripts/numi_family_question_specific_publish_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline matrix checks and guarded REG RU Family-only deploy
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_question_specific_publish_20261124.py
