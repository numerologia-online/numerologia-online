name: Verify all twelve 09.xx Red Flag drafts against real Cloudflare Gemma without REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-gemma-12-owner-direct-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Generate twelve answers from real Gemma using EXACT owner-only Red Flag prompt
        id: qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,json,pathlib,urllib.request,urllib.error,time,difflib,concurrent.futures,datetime
          source=pathlib.Path("cloudflare/redflag-draft-ai/src/index.js").read_text(encoding="utf-8")
          match=re.search(r'const flagsSystem=\[([\s\S]*?)\]\.join\(" "\);',source)
          if not match:raise RuntimeError("CURRENT_OWNER_PROMPT_NOT_FOUND")
          strings=[json.loads(line.strip().rstrip(",")) for line in match.group(1).splitlines() if line.strip().startswith('"')]
          if len(strings)!=9:raise RuntimeError("PROMPT_FRAGMENT_COUNT_CHANGED")
          system=" ".join(strings)
          if "одинаковую значимость" not in system:raise RuntimeError("EQUAL_DAY_MONTH_NOT_IN_PROMPT")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if len(token)<15:raise RuntimeError("CF_AI_TOKEN_MISSING")
          endpoint="https://api.cloudflare.com/client/v4/accounts/de77758c4b3efd26fef26ab600cb02a2/ai/run/@cf/google/gemma-4-26b-a4b-it"
          title="Уважает женское «нет» или начинает давить?"
          def invoke(month):
              question="\n".join([
                "Вопрос женщины: "+title,
                "День рождения мужчины: 9; энергия дня: 9.",
                "Месяц рождения мужчины: "+str(month)+"; энергия месяца: "+str(month)+".",
                "Трактуй обе энергии с равным весом, исключительно применительно к вопросу. Никаких технических пояснений в ответе."
              ])
              body=json.dumps({"messages":[{"role":"system","content":system},
                {"role":"user","content":question}],"temperature":0.9,
                "max_completion_tokens":850,"chat_template_kwargs":{"enable_thinking":False}},
                ensure_ascii=False).encode()
              code=0;error=None;answer=""
              for attempt in range(3):
                  req=urllib.request.Request(endpoint,data=body,method="POST",
                    headers={"Authorization":"Bearer "+token,"Content-Type":"application/json",
                      "Accept":"application/json","User-Agent":"NumerologiaRedFlagPrivateGemma12/1.0"})
                  try:
                      with urllib.request.urlopen(req,timeout=125) as response:
                          code=response.status;result=json.load(response)
                      payload=result.get("result",{})
                      if isinstance(payload,dict):
                          answer=payload.get("response") or (payload.get("choices") or [{}])[0].get("message",{}).get("content","")
                      if not isinstance(answer,str):answer=""
                      error=None if answer else "EMPTY_MODEL_TEXT"
                  except urllib.error.HTTPError as ex:
                      code=ex.code;answer=""
                      try:
                          parsed=json.loads(ex.read(3000))
                          error=str(parsed.get("errors",parsed.get("error","API_ERROR")))[:300]
                      except Exception:error="HTTP_"+str(code)
                  except Exception as ex:
                      code=0;error=type(ex).__name__;answer=""
                  if answer or code in (401,403,404):break
                  time.sleep((attempt+1)*5)
              return {"date":f"09.{month:02d}","day":9,"month":month,
                "http":code,"ok":bool(code==200 and len(answer)>=380),
                "answer":answer,"chars":len(answer),"error":error}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              results=sorted(executor.map(invoke,range(1,13)),key=lambda x:x["month"])
          for item in results:
              print("GEMMA_REST_12",item["date"],"HTTP",item["http"],"ANSWER_CHARS",item["chars"],
                    "OK",item["ok"],"ERROR",item["error"],flush=True)
          comparisons=[]
          valid=[x for x in results if x["ok"]]
          for i,a in enumerate(valid):
              for b in valid[i+1:]:
                  one=a["answer"].split("\n\n")[0]
                  two=b["answer"].split("\n\n")[0]
                  ratio=round(difflib.SequenceMatcher(None,one,two).ratio(),3)
                  if ratio>=0.75:comparisons.append({"a":a["date"],"b":b["date"],"similarity":ratio})
          folder=pathlib.Path("private-gemma-12-redflag")
          folder.mkdir(exist_ok=True)
          (folder/"twelve-dates.json").write_text(json.dumps({
            "test_type":"real Cloudflare Workers AI REST; identical model, system and user messages",
            "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "model":"@cf/google/gemma-4-26b-a4b-it","question":title,
            "published":False,"reg_ru_touched":False,
            "answers":results,"high_similarity_pairs":comparisons
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print("GEMMA_REST_12_SUMMARY",len(valid),"/12","SIMILARITY_PAIRS",len(comparisons),flush=True)
          if len(valid)!=12:raise RuntimeError("GEMMA_REST_12_INCOMPLETE")
          PY
      - name: Keep unapproved genuine test drafts in a short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-owner-gemma-09-01-to-09-12
          path: private-gemma-12-redflag/
          retention-days: 3
          if-no-files-found: warn
      - name: Record test result and direct run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.qa.outcome }}" = "success" ]; then outcome=success; else outcome=failure; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$outcome" \
            -f context="numi/redflag-12-direct-gemma-qa" \
            -f description="12 real Gemma owner-only Red Flag answers; no site publication" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
