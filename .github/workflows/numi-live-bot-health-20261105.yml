name: One-time independent bot worker health diagnosis
on:
  push:
    paths: ['.github/workflows/numi-live-bot-health-20261105.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Get endpoint status only, no changes or bot messages
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          urls=[
           'https://numerologia-online-bot.tankraft431.workers.dev/health',
           'https://numerologia-online-bot.tankraft431.workers.dev/',
           'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/api/redflag-save.php',
          ]
          for u in urls:
           request=urllib.request.Request(u,headers={'User-Agent':'Numi-Safe-Diagnostics/1.0'})
           try:
            with urllib.request.urlopen(request,timeout=12) as r:
             status=r.status; data=r.read(2000);headers=r.headers
           except urllib.error.HTTPError as exc:
            status=exc.code;data=exc.read(2000);headers=exc.headers
           except Exception as exc:
            print('ENDPOINT',u,'ERROR',type(exc).__name__,flush=True);continue
           safe={}
           try:
            obj=json.loads(data)
            for k in ['ok','service','version','configured','day_save_route','day_save_bot_token_configured','day_save_bot_identity_matches','reg_ru','telegram_inbound_webhook']:
             if k in obj:
              v=obj[k]
              safe[k]=v if isinstance(v,(bool,str,int)) else 'present'
           except Exception: pass
           print('ENDPOINT',u,'HTTP',status,'ctype',headers.get('Content-Type',''),'safe_json',json.dumps(safe),flush=True)
          
          PY
