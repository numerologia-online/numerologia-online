name: Read-only REG.RU baseline for unified wallet
on:
  push:
    branches: [main]
    paths: [.github/workflows/numi-unified-wallet-live-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare live files with main without any writes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,subprocess,json,urllib.request
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect("server172.hosting.reg.ru",21)
          ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip("/")
          pub=home+"/www/xn--c1adkkdfjbp1a4l.online"
          priv=home+"/private/numi-account-20261031"
          names=["core.php","wallet.php","store.php","subscriptions.php","fulfillment.php",
             "wallet-real.php","wallet-real-payment.php","wallet-real-worker.php",
             "account-browser.js","store-browser.js","store-entry.js","store-material.js",
             "index.html","app.js","shared-offer.js","redflag-feature.js",
             "year-feature.js","compatibility-feature.js","destiny-code-feature.js",
             "child/child.js","child/index.html","pro/pro.js","pro/index.html",
             "moment/yes-no/yes-no.js","moment/yes-no/index.html","wallet-client.js"]
          def read(path,limit=900000):
            out=io.BytesIO()
            def add(block):
              if out.tell()+len(block)>limit:raise RuntimeError("REMOTE_TOO_LARGE")
              out.write(block)
            try:ftp.retrbinary("RETR "+path,add)
            except ftplib.error_perm as e:
              if str(e).startswith("550"):return None
              raise
            return out.getvalue()
          # Read ONLY selected boolean flags for live subscriptions; never emit secrets.
          live_cfg=read(home+"/private/numi-wallet-live/config.local.php",12000)
          import re
          flag_names=("wallet_mode","real_wallet_enabled","fiscalization_verified",
                 "refunds_verified","advance_offset_receipts_verified",
                 "offset_receipt_worker_verified","launch_approved","provider_test_mode",
                 "offset_receipt_reviewed","recurring_merchant_approved",
                 "subscription_receipts_verified","live_recurring_enabled")
          def flag(n):
            if live_cfg is None:return "missing_config"
            pattern=r"""[\'"]"""+re.escape(n)+r"""[\'"]\s*=>\s*(true|false|[\'"][a-z]+[\'"])"""
            match=re.search(pattern,live_cfg.decode("utf-8","replace"),re.I)
            if not match:return "unset"
            val=match.group(1).lower().strip("'\\\"")
            return val if val in ("true","false","live","disabled") else "other"
          print("LIVE_RECURRING_SAFE_FLAGS",json.dumps({n:flag(n) for n in flag_names},sort_keys=True),flush=True)
          try:
            page=read(pub+"/index.html")
            if page is None:raise RuntimeError("WEBROOT_NOT_FOUND")
            req=urllib.request.Request("https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/index.html?read_only=1",headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(req,timeout=25) as r:
              if r.status!=200 or r.read(900001)!=page:raise RuntimeError("PUBLIC_AND_FTPS_DIFFER")
            print("LIVE_WEBROOT_VERIFIED")
            diffs=[]
            for name in names:
              repo_path="account-service/private/"+name if name in ("core.php","wallet.php","store.php","subscriptions.php","fulfillment.php",
                "wallet-real.php","wallet-real-payment.php","wallet-real-worker.php") else name
              path=(priv if repo_path.startswith("account-service/") else pub)+"/"+name
              live=read(path)
              try:base=subprocess.check_output(["git","show","origin/main:"+repo_path],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:base=None
              status="MISSING" if live is None else "NO_MAIN" if base is None else "MATCH" if base==live else "DIFFERS"
              print("FILE",name,status)
              if status=="DIFFERS":diffs.append(name)
            manifest=json.load(open("account-service/private/store-assets.json"))
            # Read-only existence check for ALL referenced private materials.
            # Never send file contents to logs or copy them into the public repo.
            listed=manifest["files"]
            ftp.voidcmd("TYPE I")
            missing=[]
            for key in listed:
              try:
                exists=ftp.size(priv+"/store-content/"+key)
              except ftplib.error_perm as error:
                if str(error).startswith("550"):exists=None
                else:raise
              if exists is None:missing.append(key)
            print("PRIVATE_MATERIAL_EXISTENCE",len(listed),"listed",len(missing),"missing")
            # Hash-check representative content from every major paid category.
            samples=[
              "data/year/energy-1.txt","data/year/odd/energy-9.txt",
              "data/redflag/money/generosity.json",
              "knowledge/full-report/sections/energy-1.json",
              "knowledge/full-report/sections/energy-22.json",
              "data/compatibility/deep/energy-1.json",
              "data/compatibility/deep/energy-22.json",
              "child/data/matrix/sections/energy-1.json",
              "child/data/matrix/sections/energy-22.json",
              "data/money-rituals.json","school-allowlist.json"]
            samples+=[k for k in listed if k.startswith("child/data/matrix/karmic-tail/")][:2]
            samples+=[k for k in listed if k.startswith("moment/yes-no/answers/")][:2]
            bad=[]
            for key in samples:
              material=read(priv+"/store-content/"+key,5_300_000)
              if material is None or hashlib.sha256(material).hexdigest()!=listed[key]:
                bad.append(key)
            print("PRIVATE_MATERIAL_HASHES",len(samples),"tested",len(bad),"bad")
            print("READONLY_AUDIT_DONE",len(diffs),"CODE_DIFFERENCES",len(missing),"MISSING_PRIVATE",len(bad),"HASH_MISMATCHES")
            if missing or bad:raise RuntimeError("PRIVATE_PAID_MATERIALS_INCOMPLETE")
          finally:ftp.quit()
          PY
