name: Keep legacy bot API POST endpoints working after domain migration
on:
  push:
    paths:
      - .github/workflows/numi-redflag-save-audit-20261105.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Back up and safely exempt API from old-host 301 redirect
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,hashlib,time,urllib.request,urllib.error
          OLD="xn--c1adkkdfjbp1a4l.online"
          NEW="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          EXPECTED="78c26fe131d0b55537c125b2093a95d5034a7a426e86b6732de901328b788d29"
          needle="RewriteCond %{HTTP_HOST} ^(www\\.)?"+OLD.replace(".","\\.")+"$ [NC]\n"+"RewriteRule ^ https://"+NEW+"%{REQUEST_URI} [R=301,L,NE]"
          updated="RewriteCond %{HTTP_HOST} ^(www\\.)?"+OLD.replace(".","\\.")+"$ [NC]\n"+"RewriteCond %{REQUEST_URI} !^/api/ [NC]\n"+"RewriteRule ^ https://"+NEW+"%{REQUEST_URI} [R=301,L,NE]"
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect("server172.hosting.reg.ru",21)
          ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p()
          home=ftp.pwd().rstrip("/")
          root=home+"/www/"+OLD
          name=root+"/.htaccess"
          def read(p):
           b=io.BytesIO();ftp.retrbinary("RETR "+p,b.write);return b.getvalue()
          def write(p,data):
           ftp.storbinary("STOR "+p,io.BytesIO(data))
           if read(p)!=data:raise RuntimeError("Readback failed")
          try:
           old=read(name)
           if hashlib.sha256(old).hexdigest()!=EXPECTED:raise RuntimeError("Live .htaccess changed; no files modified")
           original=old.decode("utf-8")
           if original.count(needle)!=1 or "NUMI NEW MAIN DOMAIN 20261105" not in original:raise RuntimeError("Expected migration rule not found")
           new=original.replace(needle,updated,1).encode("utf-8")
           if len(new)-len(old)!=len(updated)-len(needle):raise RuntimeError("Unreviewed length change")
           backup=home+"/site-safeguard-backups/"+time.strftime("%Y%m%dT%H%M%SZ",time.gmtime())+"-before-legacy-api-exemption-htaccess"
           write(backup,old)
           print("BACKUP_VERIFIED",hashlib.sha256(old).hexdigest(),flush=True)
           try:
            write(name,new)
            print("PATCHED_AND_READBACK_VERIFIED",hashlib.sha256(new).hexdigest(),flush=True)
            class NoFollow(urllib.request.HTTPRedirectHandler):
             def redirect_request(self,req,fp,code,msg,headers,newurl):return None
            opener=urllib.request.build_opener(NoFollow)
            def get(url):
             try:
              with opener.open(urllib.request.Request(url,headers={"User-Agent":"Numerologia-Domain-Routing-Verify/1.0"}),timeout=12) as res:
               return res.status,res.headers.get("Location","")
             except urllib.error.HTTPError as exc:return exc.code,exc.headers.get("Location","")
            for suffix in ["/","/offer.html"]:
             code,loc=get("https://"+OLD+suffix)
             if code!=301 or loc!="https://"+NEW+suffix:raise RuntimeError("Public pages must redirect to primary host "+suffix)
            for suffix in ["/api/redflag-save.php","/api/numi-save-answer.php","/api/telegram-reg-stage-15-10-2026.php","/api/owner-mailing.php"]:
             code,loc=get("https://"+OLD+suffix)
             if code in (301,302,307,308):raise RuntimeError("Legacy internal API still redirected "+suffix)
             print("LEGACY_API_DIRECT",suffix,"http_status",code,flush=True)
            code,_=get("https://"+NEW+"/")
            if code!=200:raise RuntimeError("New domain homepage not 200")
            print("DOMAIN_AND_API_ROUTING_VERIFIED",flush=True)
           except Exception:
            try:write(name,old);print("ROLLBACK_VERIFIED",flush=True)
            except Exception:print("ROLLBACK_FAILED",flush=True)
            raise
          finally:
           try:ftp.quit()
           except Exception:ftp.close()
          PY
