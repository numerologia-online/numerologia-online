name: Retire entire isolated wallet TEST from REG.RU without new backups

on:
  push:
    paths:
      - .github/workflows/numi-wallet-test-retire-no-backups-20261106.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Retire entire wallet TEST from REG.RU without backups')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate narrowly scoped irreversible removal code
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/numi_wallet_test_retire_20261106.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/scripts/numi_wallet_test_retire_20261106.py').read_text()
          assert 'NO_NEW_BACKUPS_CREATED' in s
          assert 'create' not in s.lower() or 'NO_NEW_BACKUPS_CREATED' in s
          assert '"api/numi-wallet-test.php"' in s
          assert '"wallet-owner-flow-20261106.js"' in s
          assert 'private/numi-wallet-test-20261106' in s
          assert 'account-browser.js' in s and 'auth-profile.js' in s
          assert 'WALLET_TEST_PUBLIC_AND_PRIVATE_CODE_REMOVED_VERIFIED' in s
          print('WALLET_TEST_RETIRE_SAFE_SCOPE_CHECKS_PASSED')
          PY
      - name: Disconnect TEST overlay, delete only sandbox files, verify existing site
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_wallet_test_retire_20261106.py
