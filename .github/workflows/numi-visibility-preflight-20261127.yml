name: Read-only audit before making source repository private
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-visibility-preflight-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked application source for public GitHub dependencies
        run: |
          python3 -u - <<'PY'
          import subprocess,pathlib,re
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          pattern=re.compile(rb'github(?:usercontent)?\.com|github\.io|(?:cdn|fastly)\.jsdelivr\.net|raw\.githack\.com|rawcdn\.githack\.com|statically\.io',re.I)
          count=0
          for p in paths:
              if not p or p.startswith(('.github/','archive/','docs/','tests/','scripts/','deploy/','diagnostics/','knowledge/')) or pathlib.Path(p).suffix.lower() not in ('.html','.css','.js','.php','.json','.xml','.webmanifest','.txt','.py','.htaccess'):
                  continue
              f=pathlib.Path(p)
              if not f.is_file() or f.stat().st_size>5000000:continue
              count+=1
              data=f.read_bytes()
              if pattern.search(data):
                  print('REPO_GITHUB_REFERENCE',p)
          print('REPO_SCANNED',count)
          PY
      - name: Verify live domain and selected server runtime files without modifying anything
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,socket,os,re,io,urllib.request,urllib.error,concurrent.futures
          domain='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          print('LIVE_DOMAIN_ADDRESSES',sorted({x[4][0] for x in socket.getaddrinfo(domain,443,type=socket.SOCK_STREAM)}))
          for path in ['/','/moment/','/pro/school/','/account-browser.js','/redflag-feature.js','/app.js','/service-worker.js']:
              with urllib.request.urlopen(urllib.request.Request('https://'+domain+path,headers={'Cache-Control':'no-cache'}),timeout=15) as response:
                  print('LIVE_HTTP',path,response.status,'server='+str(response.headers.get('Server','unknown')),'final_host='+urllib.parse.urlparse(response.url).hostname)
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          pattern=re.compile(rb'github(?:usercontent)?\.com|github\.io|(?:cdn|fastly)\.jsdelivr\.net|raw\.githack\.com|rawcdn\.githack\.com|statically\.io',re.I)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21);ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          private=home+'/private/'
          def read(p):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+p,b.write)
              return b.getvalue()
          try:
              count=0
              roots=[(root,''),(root+'api/','api/'),(root+'moment/','moment/'),(private+'numi-account-20261031/','private-account/'),(private+'numi-content-reg-20261031/','private-content/'),(private+'numi-school-owner-20261103/','private-school/')]
              for directory,label in roots:
                  for name,facts in ftp.mlsd(directory):
                      if facts.get('type')!='file' or not re.search(r'\.(js|php|html|htaccess|webmanifest)$',name,re.I) or int(facts.get('size','0'))>2000000:
                          continue
                      if label=='' and name not in {'index.html','app.js','account-browser.js','auth-profile.js','wallet-client.js','redflag-feature.js','redflag-engine.js','redflag-text-bank.js','year-content.js','year-feature.js','numerology-core.js','personal-day-feature.js','club-checkout.js','store-browser.js','service-worker.js','.htaccess'}:
                          continue
                      if label.startswith('private') and re.search(r'config|secret|credential|password|token',name,re.I):continue
                      data=read(directory+name)
                      count+=1
                      if pattern.search(data):print('LIVE_GITHUB_REFERENCE',label+name)
              print('LIVE_SCANNED',count)
              print('READ_ONLY_AUDIT_COMPLETE; no server files changed')
          finally:ftp.quit()
          PY
