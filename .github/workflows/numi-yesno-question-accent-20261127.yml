name: Publish Yes/No question heading accent only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-question-accent-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only question heading and arrow
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          css_path='moment/yes-no/yes-no.css'
          version='question-accent-20261127'
          old_heading="<div class=\"yn-catalog-heading\"><h2>ВЫБЕРИТЕ ВОПРОС</h2></div>"
          new_heading="<div class=\"yn-catalog-heading\"><h2>ВЫБЕРИТЕ <span>ВОПРОС</span></h2><span class=\"yn-catalog-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v17m-6-6 6 6 6-6\"/></svg></span></div>"
          old_block=".yn-catalog-heading{margin:0 2px 7px}\n.yn-catalog-heading h2{font:400 22px/1.2 'Playfair Display',Georgia,serif;color:var(--yn-ink);margin:0}"
          new_block=".yn-catalog-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 7px}\n.yn-catalog-heading h2{font:400 22px/1.2 'Playfair Display',Georgia,serif;color:var(--yn-ink);margin:0}\n.yn-catalog-heading h2 span{color:#a61919}\n.yn-catalog-arrow{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:#f8e8e4;color:#a61919;margin-right:8px}\n.yn-catalog-arrow svg{width:21px;height:21px;display:block}"
          assert new_heading in pathlib.Path(html_path).read_text(encoding='utf-8')
          assert new_block in pathlib.Path(css_path).read_text(encoding='utf-8')
          def patch(current,before,after):
              if current.count(after)==1:return current
              assert current.count(before)==1,'Unexpected live source'
              return current.replace(before,after,1)
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path in (css_path,html_path):
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  if path==css_path:
                      current=patch(current,old_block,new_block)
                  else:
                      current=patch(current,old_heading,new_heading)
                      current,n=re.subn(r'\./yes-no\.css\?v=[a-zA-Z0-9_-]+','./yes-no.css?v='+version,current)
                      assert n==1,'Unexpected CSS link'
                  new[path]=current.encode('utf-8')
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/question-accent-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: question heading accent only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  style=public(origin+'yes-no.css?v='+version)
                  assert new_heading in live and new_block in style and version in live
                  print('PUBLIC HTTP VERIFIED: question heading accent')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
