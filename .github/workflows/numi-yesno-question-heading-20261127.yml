name: Publish Yes/No question heading only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-question-heading-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only question heading text
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          before="<div class=\"yn-catalog-heading\"><h2>Выберите тему</h2></div>"
          after="<div class=\"yn-catalog-heading\"><h2>ВЫБЕРИТЕ ВОПРОС</h2></div>"
          assert pathlib.Path(html_path).read_text(encoding='utf-8').count(after)==1
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              path=html_path
              old[path]=read(root+path)
              current=old[path].decode('utf-8')
              assert current.count(before)+current.count(after)==1,'Unexpected live heading'
              new[path]=current.replace(before,after,1).encode('utf-8')
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/question-heading-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: question heading only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  assert after in live and before not in live
                  print('PUBLIC HTTP VERIFIED: question heading')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
