name: Publish owner-only TEST checkout credit-status fix
on:
  push:
    paths:
      - .github/workflows/numi-test-checkout-credit-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish owner-only TEST checkout credit-status fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check test-only settlement and release script
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/numi_test_checkout_credit_fix_release.py
          node --check wallet-test-checkout-20261106.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("wallet-test-checkout-20261106.js").read_text()
          assert 'd.payment_status===undefined' in js
          assert 'Number.isFinite(Number(d.balance_kopeks))' in js
          assert 'OWNER_TEST_ONLY' in js
          print("TEST_CREDIT_FIX_STATIC_CHECKS_PASSED")
          PY
      - name: Backup old test files and publish checked settlement UI
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_test_checkout_credit_fix_release.py
