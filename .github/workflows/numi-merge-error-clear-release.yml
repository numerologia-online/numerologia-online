name: Fix stale merge error in Telegram account
on:
  push:
    paths:
      - .github/workflows/numi-merge-error-clear-release.yml
permissions:
  contents: read
concurrency:
  group: numi-merge-error-clear-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish cleared stale merge error on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate frontend and release
        run: |
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-merge-error-clear.py
      - name: Publish account JS and version tag with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-merge-error-clear.py
