name: Live WebKit Safari-engine browser open diagnosis
on:
  push:
    paths:
      - .github/workflows/numi-live-browser-visit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install isolated browser (no repo or website changes)
        run: |
          mkdir -p /tmp/numi-browser
          cd /tmp/numi-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit
      - name: Visit public site with mobile viewport, capture JS errors
        run: |
          cd /tmp/numi-browser
          node - <<'JS'
          const { webkit } = require('playwright');
          (async () => {
            const b=await webkit.launch({headless:true});
            for (const target of ['https://xn--c1adkkdfjbp1a4l.online/','https://xn--c1adkkdfjbp1a4l.online/child/','https://xn--c1adkkdfjbp1a4l.online/pro/']) {
              const page=await b.newPage({viewport:{width:390,height:844},isMobile:true,deviceScaleFactor:2});
              const errors=[];
              page.on('pageerror',e=>errors.push('JS '+e.message.slice(0,240)));
              page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text().slice(0,200))});
              page.on('requestfailed',q=>errors.push('NETWORK '+q.url().replace(/\?.*/, '')+' '+q.failure()?.errorText));
              let status;
              try {let r=await page.goto(target,{waitUntil:'domcontentloaded',timeout:25000});status=r?.status();await page.waitForTimeout(2500);}
              catch(e){errors.push('NAVIGATION '+e.message.slice(0,250));}
              console.log('MOBILE PAGE',target,'HTTP',status,'TITLE',await page.title().catch(()=>'?'),'URL',page.url(),'CONTENT_LEN',(await page.locator('body').innerText().catch(()=>'' )).length);
              console.log('MOBILE ERRORS',JSON.stringify(errors.slice(0,15)));
              await page.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
