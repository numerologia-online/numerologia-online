name: Publish Family punchy voice and same Gemini retry to REG RU (validated)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-punch-reliability-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static checks without paid AI calls and guarded Family-only upload
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_punch_reliability_publish_20261123.py
