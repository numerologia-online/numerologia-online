name: One-time read-only inspect Telegram profile origin restriction
on:
  push:
    paths: ['.github/workflows/numi-profile-origin-inspection-20261105.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only inspect origin rules without dumping PHP source or credentials
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,hashlib,re
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']);f.prot_p()
          root=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online'
          try:
            for name in ['api/profile.php','api/numi-account.php']:
              try:
                b=io.BytesIO()
                f.retrbinary('RETR '+root+'/'+name,b.write)
              except ftplib.error_perm:
                print('NOT_FOUND',name,flush=True);continue
              data=b.getvalue()
              print('FILE',name,'SHA256',hashlib.sha256(data).hexdigest(),'bytes',len(data),flush=True)
              for n,line in enumerate(data.decode('utf8','replace').splitlines(),1):
                if not re.search('origin|cors|github.io|xn--|allowlist|referer|HTTP_HOST',line,re.I):
                  continue
                if re.search('secret|password|token|bot_token|authorization|private|api.?key|credential|mysql|pdo',line,re.I):
                  print('RULE',name,n,'[withheld sensitive line]',flush=True)
                else:
                  print('RULE',name,n,line[:380],flush=True)
          finally:f.quit()
          PY
