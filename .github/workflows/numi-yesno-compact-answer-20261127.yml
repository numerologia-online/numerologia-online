name: Publish compact Yes/No layout only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-compact-answer-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only vertical spacing and answer typography
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          css_path='moment/yes-no/yes-no.css'
          version='compact-answer-20261127'
          pairs=[[".yn-answer-box{position:relative;box-sizing:border-box;width:84%;max-width:400px;border:1px solid #c6b58d;border-radius:12px;background:#ffffff;padding:18px 12px 20px;margin:0 auto 10px;text-align:center;scroll-margin-top:8px}",".yn-answer-box{position:relative;box-sizing:border-box;width:88%;max-width:400px;border:1px solid #c6b58d;border-radius:12px;background:#ffffff;padding:13px 12px 13px;margin:0 auto 8px;text-align:center;scroll-margin-top:8px}"],[".yn-time-result{min-height:154px;color:var(--yn-ink);font-size:16px;line-height:1.5;overflow-wrap:anywhere;scroll-margin-top:10px}",".yn-time-result{min-height:146px;color:var(--yn-ink);font-size:16px;line-height:1.5;overflow-wrap:anywhere;scroll-margin-top:10px}"],[".yn-time-result[data-empty=true]{display:grid;place-items:center;min-height:154px;font:600 clamp(16px,4.5vw,21px)/1.35 system-ui,sans-serif;letter-spacing:.035em;color:#826334}",".yn-time-result[data-empty=true]{display:grid;place-items:center;min-height:146px;font:600 clamp(16px,4.5vw,21px)/1.35 system-ui,sans-serif;letter-spacing:.035em;color:#826334}"],[".yn-time-result:not([data-empty=true]){padding-top:18px}",".yn-time-result:not([data-empty=true]){padding-top:16px}"],[".yn-answer-verdict{display:block;font:500 clamp(33px,9vw,45px)/1.13 'Playfair Display',Georgia,serif;color:var(--yn-ink);margin:3px 0 7px}",".yn-answer-verdict{display:block;font:500 clamp(31px,8.5vw,43px)/1.12 'Playfair Display',Georgia,serif;color:var(--yn-ink);margin:2px 0 5px}"],[".yn-answer-explanation{margin:0;font-size:18px;line-height:1.5;color:var(--yn-ink)}",".yn-answer-explanation{margin:0;font-size:17px;line-height:1.4;color:var(--yn-ink)}"],[".yn-telegram-actions{display:grid;gap:7px;margin-top:12px}",".yn-telegram-actions{display:grid;gap:6px;margin-top:9px}"],["#yn-dialog .dialog-content{display:block;width:100%;max-width:none;margin:0;padding:12px;text-align:center}","#yn-dialog .dialog-content{display:block;width:100%;max-width:none;margin:0;padding:9px 12px;text-align:center}"],["#yn-dialog-title{font:400 clamp(21px,5.6vw,28px)/1.2 'Playfair Display',Georgia,serif;letter-spacing:-.015em;color:var(--yn-ink);margin:0 0 10px;overflow-wrap:anywhere}","#yn-dialog-title{font:400 clamp(21px,5.6vw,28px)/1.2 'Playfair Display',Georgia,serif;letter-spacing:-.015em;color:var(--yn-ink);margin:0 0 7px;overflow-wrap:anywhere}"],[".yn-time-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);align-items:center;gap:7px;margin:0 0 8px;text-align:center}",".yn-time-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);align-items:center;gap:5px;margin:0 0 6px;text-align:center}"],[".yn-time-row label{grid-column:1/-1;font-size:13px;line-height:1.4;font-weight:500;color:var(--yn-muted);margin:0 0 3px}",".yn-time-row label{grid-column:1/-1;font-size:13px;line-height:1.35;font-weight:500;color:var(--yn-muted);margin:0 0 2px}"],[".yn-uncensored{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 16px);min-height:48px;margin:10px auto 0;padding:8px 7px;border:1px solid #aac49e;border-radius:8px;background:#f0f7e9;color:#214b39;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer;box-sizing:border-box}",".yn-uncensored{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 16px);min-height:48px;margin:8px auto 0;padding:8px 7px;border:1px solid #aac49e;border-radius:8px;background:#f0f7e9;color:#214b39;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer;box-sizing:border-box}"],[".yn-catalog-heading{margin:0 2px 7px;text-align:center}",".yn-catalog-heading{margin:0 2px 5px;text-align:center}"]]
          assert all(after in pathlib.Path(css_path).read_text(encoding='utf-8') for before,after in pairs)
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path in (css_path,html_path):
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  if path==css_path:
                      for before,after in pairs:
                          assert current.count(before)+current.count(after)==1,'Unexpected live CSS rule'
                          current=current.replace(before,after,1)
                  else:
                      assert 'id="yn-answer-close"' in current and 'id="yn-uncensored"' in current
                      current,n=re.subn(r'\./yes-no\.css\?v=[a-zA-Z0-9_-]+','./yes-no.css?v='+version,current)
                      assert n==1,'Unexpected CSS link'
                  new[path]=current.encode('utf-8')
              assert all(after.encode() in new[css_path] for before,after in pairs)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/compact-answer-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: compact layout only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  style=public(origin+'yes-no.css?v='+version)
                  assert version in live and all(after in style for before,after in pairs)
                  print('PUBLIC HTTP VERIFIED: compact layout')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
