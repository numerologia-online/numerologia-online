name: Publish intimacy humor prompt only to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-intimacy-humor-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PHP and deploy only rfOwnerSharpIntimacy
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import ftplib,ssl,io,os,subprocess,pathlib,time,uuid,hashlib,urllib.request,urllib.error
          path='redflag-ai-lab/style-test-api.php'
          now=pathlib.Path(path).read_bytes()
          oldrepo=subprocess.check_output(['git','show','17f0fba5bc3f26208fbe31e8bb9c369c0f67d7bb:'+path])
          def part(s,name):
              i=s.index(b'function '+name+b'(');j=s.index(b'\n}\n',i)+2
              return s[i:j]
          name=b'rfOwnerSharpIntimacy'
          oldFn=part(oldrepo,name)
          newFn=part(now,name)
          assert newFn!=oldFn and 'ОСТРОУМНЫЙ'.encode('utf-8') in newFn and 'НО НЕ ЗЛОЙ'.encode('utf-8') in newFn
          assert now.replace(newFn,oldFn,1)==oldrepo,'ONLY_PROMPT_FUNCTION_MAY_CHANGE'
          # Formula, all existing categories and original 22-energy KB must remain byte-identical.
          def status(suffix):
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+suffix+'?v='+str(time.time_ns()),headers={'Cache-Control':'no-store'}),timeout=25) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          def healthy():
              statuses=[status(''),status('redflag-ai-lab/style-test-api.php'),status('redflag-ai-lab/style-test.php')]
              print('SITE_HEALTH',statuses,flush=True)
              return statuses==[200,403,403]
          if not healthy():raise RuntimeError('PREFLIGHT_HEALTH_FAIL')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=home+'/site-safeguard-backups'
          def read(p,absolute=False):
              v=io.BytesIO();ftp.retrbinary('RETR '+(p if absolute else root+p),v.write);return v.getvalue()
          def write(p,v,absolute=False):
              ftp.storbinary('STOR '+(p if absolute else root+p),io.BytesIO(v))
              if read(p,absolute)!=v:raise RuntimeError('REMOTE_READBACK_MISMATCH')
          old=None;changed=False
          try:
              old=read(path)
              if part(old,name)!=oldFn:raise RuntimeError('LIVE_INTIMACY_FUNCTION_DRIFT')
              desired=old.replace(oldFn,newFn,1)
              if desired.replace(newFn,oldFn,1)!=old:raise RuntimeError('DIFF_SCOPE_INVALID')
              assert subprocess.run(['php','-l'],input=desired,capture_output=True).returncode==0
              protected=['redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/infidelity-knowledge-v1.json','redflag-ai-lab/sexuality-knowledge-v1.json','redflag-ai-lab/catalog.json','redflag-ai-lab/style-test.php']
              hashes={p:hashlib.sha256(read(p)).digest() for p in protected}
              try:ftp.mkd(backup)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              tag=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
              write(backup+'/before-intimacy-humor-api-'+tag+'.bak',old,True)
              if read(path)!=old:raise RuntimeError('CONCURRENT_REMOTE_CHANGE')
              changed=True;write(path,desired)
              if not healthy():raise RuntimeError('SITE_UNHEALTHY_AFTER')
              for p,h in hashes.items():
                  if hashlib.sha256(read(p)).digest()!=h:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              if part(read(path),name)!=newFn:raise RuntimeError('FUNCTION_NOT_PUBLISHED')
              print('INTIMACY_HUMOR_PROMPT_PUBLISHED_OK paid_calls=0 other_functions_untouched=true KB_unchanged=true',flush=True)
          except BaseException:
              if changed and old is not None:
                  try:write(path,old);print('ROLLBACK_SUCCESS',flush=True)
                  except BaseException:print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
