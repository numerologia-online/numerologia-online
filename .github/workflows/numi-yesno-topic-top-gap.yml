name: Add topic page top spacing
on:
  push:
    branches: [fix/yesno-topic-top-gap]
    paths: [.github/workflows/numi-yesno-topic-top-gap.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish top spacing with backup and guards
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/topic-top-gap/deploy.py
