name: Inspect canonical redirect rules (read only) 2026-11-03
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-canonical-rules-audit-20261103.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live REG.RU htaccess rules without writes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,io,hashlib,re
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          root=ftp.pwd().rstrip('/')
          paths=[root+'/.htaccess',root+'/www/.htaccess',root+'/www/xn--c1adkkdfjbp1a4l.online/.htaccess']
          for p in paths:
           b=io.BytesIO()
           try:ftp.retrbinary('RETR '+p,b.write)
           except ftplib.error_perm as e:
            print('ACCESS',p.removeprefix(root+'/'),'missing',str(e)[:40],flush=True)
            continue
           data=b.getvalue()
           print('ACCESS',p.removeprefix(root+'/'),'sha256',hashlib.sha256(data).hexdigest(),'bytes',len(data),flush=True)
           for l in data.decode('utf-8','replace').splitlines():
            if re.search(r'(?i)(Rewrite|Redirect|HTTPS|HTTP_HOST|SetEnv|Proxy|DirectoryIndex|ErrorDocument|FilesMatch)',l):
             print('RULE',l[:400],flush=True)
          ftp.quit()
          PY
