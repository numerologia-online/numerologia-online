name: Publish right-side Yes/No close button only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-close-right-20261126.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only home button CSS and asset version, backup and verify
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          css_path='moment/yes-no/yes-no.css'
          button_old='<button id="yn-all" type="button" class="yn-back-top">← На главную</button>'
          button_new='<button id="yn-all" type="button" class="yn-back-top" aria-label="На главную" title="На главную">×</button>'
          css_new=next(l for l in pathlib.Path(css_path).read_text().splitlines() if l.startswith('.yn-back-top{'))
          assert 'place-items:center' in css_new and 'margin:0 0 0 auto' in css_new
          version='./yes-no.css?v=close-right-20261127'
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path in (css_path,html_path):
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  if path==css_path:
                      pattern=r'(?m)^\.yn-back-top\{[^{}\n]+\}'
                      matches=re.findall(pattern,current)
                      assert len(matches)==1 and ('display:inline-flex' in matches[0] or matches[0]==css_new), 'Unexpected live button CSS'
                      current=re.sub(pattern,lambda _:css_new,current,count=1)
                  else:
                      assert current.count(button_old)+current.count(button_new)==1, 'Unexpected live button markup'
                      current=current.replace(button_old,button_new,1)
                      current,n=re.subn(r'\./yes-no\.css\?v=[a-zA-Z0-9_-]+',version,current)
                      assert n==1, 'Unexpected CSS version link'
                  new[path]=current.encode('utf-8')
              assert button_new.encode() in new[html_path] and css_new.encode() in new[css_path]
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/back-button-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: right-side close button only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  style=public(origin+'yes-no.css?v=close-right-20261127')
                  assert button_new in live and version in live and css_new in style
                  print('PUBLIC HTTP VERIFIED: right-side close button')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
