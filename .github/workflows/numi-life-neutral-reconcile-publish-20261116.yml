name: Publish neutral full-life copy while preserving newer live partner content
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-life-neutral-reconcile-publish-20261116.yml
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate reviewed partner-language reconciliation, retaining newer REG.RU texts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/reconcile-and-deploy-life-gender-20261116.py
          python3 -m py_compile scripts/neutralize-life-gender-20261116.py
      - name: Verify merge before edits, sync GitHub history, back up and publish only full-life banks
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/reconcile-and-deploy-life-gender-20261116.py
