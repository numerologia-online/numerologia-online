name: Publish privacy policy to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-privacy-policy-release.yml

permissions:
  contents: read

concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish privacy policy on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate dedicated release script and source files
        run: |
          python3 -m py_compile scripts/publish-privacy-policy.py
          test -s privacy.html
          grep -q 'href="/privacy.html"' index.html
      - name: Upload only approved privacy page and homepage footer, then verify
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-privacy-policy.py
