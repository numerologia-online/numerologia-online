name: Remove retired Red Flag inference Worker only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-draft-ai-deploy-20261117.yml
permissions:
  contents: read
  statuses: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove exactly the dedicated Red Flag script (not Moment 300 or REG.RU)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          name="numerologia-redflag-draft-ai"
          account="de77758c4b3efd26fef26ab600cb02a2"
          assert name=="numerologia-redflag-draft-ai"
          assert name!="numerologia-300-ai"
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not token:raise RuntimeError("CLOUDFLARE_TOKEN_NOT_CONFIGURED")
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{name}"
          headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
          try:
              req=urllib.request.Request(url,headers=headers,method="DELETE")
              with urllib.request.urlopen(req,timeout=40) as response:
                  body=json.load(response)
              if body.get("success") is not True:
                  raise RuntimeError("CLOUDFLARE_DELETE_NOT_CONFIRMED")
              print("REDFLAG_DEDICATED_SCRIPT_DELETED",name,flush=True)
          except urllib.error.HTTPError as e:
              if e.code==404:
                  print("REDFLAG_ALREADY_ABSENT",name,flush=True)
              else:
                  print("REDFLAG_DELETE_HTTP",e.code,flush=True)
                  raise
          import time
          confirmed=False
          for attempt in range(7):
              time.sleep(5)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method="GET"),timeout=20) as response:
                      print("REDFLAG_SCRIPT_STILL_RESPONDING",attempt+1,response.status,flush=True)
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      confirmed=True
                      print("REDFLAG_SCRIPT_NOT_FOUND_VERIFIED",flush=True)
                      break
                  print("REDFLAG_VERIFY_HTTP",e.code,flush=True)
                  raise
              if attempt in (2,4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method="DELETE"),timeout=40) as response:
                          check=json.load(response)
                      print("REDFLAG_REPEAT_DELETE_SUCCESS",check.get("success"),flush=True)
                  except urllib.error.HTTPError as e:
                      if e.code==404:
                          confirmed=True;break
                      raise
          if not confirmed:raise RuntimeError("REDFLAG_WORKER_STILL_PRESENT_AFTER_RETRY")
          PY
      - name: Record verified removal
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then outcome=success; else outcome=failure; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$outcome" -f context="numi/retired-redflag-worker-deleted" \
            -f description="Dedicated Red Flag Worker deletion: $outcome" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
