name: Read-only Telegram launch URL and fresh browser check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-telegram-menu-guest-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect default bot launch URL without changing it
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,re,json,urllib.request,urllib.parse
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          home=ftp.pwd().rstrip('/')
          b=io.BytesIO()
          ftp.retrbinary('RETR '+home+'/private/bot-config.php',b.write)
          ftp.quit()
          tokens=set(re.findall(rb'[0-9]{6,15}:[A-Za-z0-9_-]{30,60}',b.getvalue()))
          if len(tokens)!=1:raise SystemExit('AMBIGUOUS_BOT_CONFIG')
          token=next(iter(tokens)).decode()
          def api(method):
              try:
                  with urllib.request.urlopen('https://api.telegram.org/bot'+token+'/'+method,timeout=18) as r:
                      data=json.load(r)
                  if data.get('ok') is not True:raise ValueError()
                  return data['result']
              except Exception:raise SystemExit('TELEGRAM_READ_FAILED_'+method) from None
          me=api('getMe')
          print('BOT',me.get('username'),'main_web_app',me.get('has_main_web_app'),flush=True)
          menu=api('getChatMenuButton')
          u=urllib.parse.urlsplit(menu.get('web_app',{}).get('url',''))
          print('MENU',menu.get('type'),'scheme',u.scheme,'host',u.hostname,'path',u.path,'query_present',bool(u.query),'fragment_present',bool(u.fragment),flush=True)
          assert me.get('username','').lower()=='numerologiaonline_bot'
          assert menu.get('type')=='web_app' and u.scheme=='https' and u.hostname in ('xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','нумерология-онлайн.рф')
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install temporary mobile browser
        run: |
          mkdir -p /tmp/numi-guest
          cd /tmp/numi-guest
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Verify fresh guest DOM and Telegram startup handshake without real user credentials
        run: |
          cd /tmp/numi-guest
          node <<'JS'
          const {webkit}=require('playwright');
          (async()=>{
            const b=await webkit.launch();
            for(const simulated of [false,true]){
              const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'ru-RU'});
              if(simulated)await c.addInitScript(()=>{window.__launchEvents=[];window.TelegramWebviewProxy={postEvent:(name)=>window.__launchEvents.push(name)}});
              const p=await c.newPage(),errors=[],failed=[];
              p.on('pageerror',e=>errors.push(e.message.slice(0,160)));
              p.on('requestfailed',r=>failed.push({path:new URL(r.url()).pathname,error:r.failure()?.errorText}));
              try{
                const root='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/';
                const r=await p.goto(root+(simulated?'#tgWebAppVersion=8.0&tgWebAppPlatform=ios':''),{waitUntil:'domcontentloaded',timeout:25000});
                await p.waitForTimeout(2500);
                const d=await p.evaluate(()=>({ready:document.readyState,title:document.title,bodyTextLength:document.body.innerText.length,events:window.__launchEvents||[],account:!!document.querySelector('[data-account-open="profile"]')}));
                console.log('BROWSER',JSON.stringify({simulated,http:r.status(),d,errors,failed:failed.slice(0,12)}));
              }catch(e){console.log('BROWSER_ERROR',simulated,e.message.slice(0,200));process.exitCode=1;}
              await c.close();
            }
            await b.close();
          })().catch(e=>{console.log('BROWSER_FATAL',e.message.slice(0,200));process.exitCode=1});
          JS
