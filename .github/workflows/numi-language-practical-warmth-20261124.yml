name: Publish precise energy one Love Languages key
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-language-practical-warmth-20261124.yml'
      - '.github/scripts/numi_language_practical_warmth_20261124.py'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify language-only changes and publish
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_language_practical_warmth_20261124.py
