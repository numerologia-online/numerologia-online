name: Publish four approved romance responses to REG.RU
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-romance-four-approved.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-native-content-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish only four approved responses with backup and verification
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,json,hashlib,re,time,urllib.request,urllib.error
          HOST="server172.hosting.reg.ru"
          DOMAIN="xn--c1adkkdfjbp1a4l.online"
          TARGET="data/redflag/love/romance.json"
          REF="c4a4b2fb734bada2091c655d32f4841e775d5583"
          SHA="31041b7ddf2e38af33080e2ee1e73715872c77a7"
          KEYS={"1-1","2-1","3-1","4-1"}
          def blob(b): return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect(HOST,21);ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);ftp.prot_p()
          def read(p):
              out=io.BytesIO()
              def sink(b):
                  if out.tell()+len(b)>5500000: raise RuntimeError("File exceeds limit")
                  out.write(b)
              ftp.retrbinary("RETR "+p,sink);return out.getvalue()
          def put(p,b):
              ftp.storbinary("STOR "+p,io.BytesIO(b))
              if read(p)!=b: raise RuntimeError("Readback verification failed")
          def http(route,data=None):
              req=urllib.request.Request("https://"+DOMAIN+"/api/numi-"+route+".php?verify="+str(time.time_ns()),data=None if data is None else json.dumps(data).encode(),headers={"Content-Type":"application/json","Cache-Control":"no-store"})
              try: res=urllib.request.urlopen(req,timeout=30)
              except urllib.error.HTTPError as e: res=e
              with res:return res.status,json.loads(res.read(10000))
          home=ftp.pwd().rstrip("/")
          base=home+"/private/numi-content-reg-20261031"
          changed=False
          try:
              core=read(base+"/core.php")
              if b"function numiPrivateRead" not in core or b"api.github.com/repos" in core: raise RuntimeError("Local reader guard failed")
              old=read(base+"/manifest.json"); manifest=json.loads(old)
              entry=manifest["files"][TARGET]
              current=read(base+"/cache/"+entry["sha"])
              if blob(current)!=entry["sha"]: raise RuntimeError("Live source integrity failed")
              cfg=read(home+"/private/numi-secure-access/config.local.php")
              tokens=re.findall(rb"(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}",cfg)
              if len(tokens)!=1: raise RuntimeError("Publication credential unavailable")
              token=tokens[0].decode()
              print("::add-mask::"+token)
              req=urllib.request.Request("https://api.github.com/repos/numerologia-online/numi-numi-on-private/contents/site/"+TARGET+"?ref="+REF,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github.raw+json","User-Agent":"numi-approved-release"})
              with urllib.request.urlopen(req,timeout=30) as res: new=res.read(5500001)
              if blob(new)!=SHA: raise RuntimeError("Approved source mismatch")
              before=json.loads(current); after=json.loads(new)
              changed_keys={k for k in set(before["entries"])|set(after["entries"]) if before["entries"].get(k)!=after["entries"].get(k)}
              if current!=new:
                  if changed_keys!=KEYS: raise RuntimeError("Live differences are not exactly four approved responses")
                  if {k:v for k,v in before.items() if k!="entries"}!={k:v for k,v in after.items() if k!="entries"}: raise RuntimeError("Unexpected metadata changes")
              code,h=http("content-health")
              if code!=200 or h.get("configured") is not True: raise RuntimeError("Health guard failed")
              code,h=http("redflag-content",{"init_data":"","path":TARGET})
              if code!=401 or h.get("ok") is not False: raise RuntimeError("Anonymous access guard failed")
              if current==new:
                  print("ALREADY PUBLISHED: four approved responses match protected live storage")
              else:
                  archive=home+"/site-safeguard-backups/romance-four-"+str(int(time.time()))
                  ftp.mkd(archive);put(archive+"/manifest.json.bak",old);put(archive+"/romance.json.bak",current)
                  put(base+"/cache/"+SHA,new)
                  ftp.sendcmd("SITE CHMOD 600 "+base+"/cache/"+SHA)
                  manifest["files"][TARGET]={"sha":SHA,"source":"site/"+TARGET,"ref":REF}
                  newmanifest=json.dumps(manifest,ensure_ascii=False,indent=2).encode()+b"\n"
                  if read(base+"/manifest.json")!=old: raise RuntimeError("Concurrent manifest edit")
                  changed=True;put(base+"/manifest.json",newmanifest)
                  code,h=http("content-health")
                  if code!=200 or h.get("configured") is not True: raise RuntimeError("Post-publication health failed")
                  code,h=http("redflag-content",{"init_data":"","path":TARGET})
                  if code!=401 or h.get("ok") is not False: raise RuntimeError("Post-publication protection failed")
                  active=json.loads(read(base+"/manifest.json"))["files"][TARGET]
                  if active["sha"]!=SHA or read(base+"/cache/"+active["sha"])!=new: raise RuntimeError("Active content verification failed")
                  print("PUBLISHED AND VERIFIED: exactly four responses, January 1-4; protected local storage; backup saved; anonymous access denied")
          except BaseException as e:
              if changed:
                  put(base+"/manifest.json",old);print("ROLLED BACK manifest")
              print("Release failed: "+type(e).__name__)
              raise SystemExit(1)
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          
          PY
