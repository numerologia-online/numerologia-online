name: Publish approved club tariff template in personal day
on:
  push:
    paths:
      - .github/workflows/numi-day-club-template-release-20261103.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish approved club tariff template in personal day to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check source JavaScript and tariff contents
        run: |
          node --check personal-day-feature.js
          node --check app.js
          grep -q 'numi-day-club-offer' personal-day-feature.js
          grep -q 'numi-tariff-table' personal-day-feature.js
          grep -q 'Глава текущего месяца' personal-day-feature.js
          grep -q '20261103tariffs2' app.js
          grep -q '20261103tariffs2' index.html
      - name: Patch only personal-day offer and its cache keys with verified backup
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,io,os,pathlib,ssl,subprocess,tempfile,time
          repo=pathlib.Path('.')
          names=['personal-day-feature.js','app.js','index.html']
          sources={name:(repo/name).read_text('utf-8') for name in names}
          expected_day_sha='5bce3efa2d339179cc3ea226e29282bd69b0acc3baf844f413495ef628b137cf'
          def unique(source,fragment,label):
              n=source.count(fragment)
              if n!=1:
                  raise RuntimeError(label+' expected once, found '+str(n))
              return True
          def subscription_block(source):
              opening='    <button type="button" class="personal-month-open"'
              closing=chr(10)+'  </section>'+chr(96)+';'
              unique(source,opening,'subscription button')
              a=source.index(opening)
              b=source.index(closing,a)
              return source[a:b]
          git_day=sources[names[0]]
          new_offer=subscription_block(git_day)
          if 'numi-day-club-offer' not in new_offer or 'БЕСПЛАТНО!' not in new_offer or '490 ₽' not in new_offer:
              raise RuntimeError('New tariff source is invalid')
          css_start='/* Personal day club uses the same tariff cards'
          css_end='export const openPersonalDay = () => {'
          unique(git_day,css_start,'club styling')
          css=git_day[git_day.index(css_start):git_day.index(css_end)]
          if not css.strip().endswith('};') or 'ensureDayClubTariffStyles' not in css:
              raise RuntimeError('Invalid local style source')
          host='server172.hosting.reg.ru'
          site='www/xn--c1adkkdfjbp1a4l.online'
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          f.connect(host,21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          f.set_pasv(True)
          home=f.pwd()
          f.cwd(site)
          if 'index.html' not in [x.rsplit('/',1)[-1] for x in f.nlst()]:
              raise RuntimeError('Unexpected site root; no files modified')
          def read(file):
              stream=io.BytesIO()
              f.retrbinary('RETR '+file,stream.write)
              return stream.getvalue()
          def upload(file,data):
              f.storbinary('STOR '+file,io.BytesIO(data))
              if hashlib.sha256(read(file)).digest()!=hashlib.sha256(data).digest():
                  raise RuntimeError('Upload verification failed: '+file)
          originals={name:read(name) for name in names}
          print('LIVE HASHES',[(name,hashlib.sha256(raw).hexdigest()) for name,raw in originals.items()],flush=True)
          if hashlib.sha256(originals[names[0]]).hexdigest()!=expected_day_sha:
              raise RuntimeError('Personal day changed on live site. No files overwritten')
          live_day=originals[names[0]].decode('utf-8')
          old_offer=subscription_block(live_day)
          if not ('Ваши важные даты и многое другое' in old_offer and '490 ₽' in old_offer):
              raise RuntimeError('Unexpected old offer; no files overwritten')
          if css_start in live_day or 'ensureDayClubTariffStyles' in live_day:
              raise RuntimeError('New styles are already live; no files overwritten')
          live_day=live_day.replace(old_offer,new_offer,1)
          unique(live_day,css_end,'day feature export')
          live_day=live_day.replace(css_end,css+css_end,1)
          live_day=live_day.replace(css_end,css_end+chr(10)+'  ensureDayClubTariffStyles();',1)
          if 'Ваши важные даты и многое другое' in live_day or 'Месячная подписка ещё готовится' in live_day:
              raise RuntimeError('Old subscription content remains')
          live_app=originals['app.js'].decode('utf-8')
          live_index=originals['index.html'].decode('utf-8')
          prev_import='import("./personal-day-feature.js?v=20261103clubback1")'
          next_import='import("./personal-day-feature.js?v=20261103tariffs2")'
          prev_entry='src="app.js?v=20261103clubback1"'
          next_entry='src="app.js?v=20261103tariffs2"'
          unique(live_app,prev_import,'live personal day import')
          unique(live_index,prev_entry,'live app entry')
          patches={
              'personal-day-feature.js':live_day.encode('utf-8'),
              'app.js':live_app.replace(prev_import,next_import,1).encode('utf-8'),
              'index.html':live_index.replace(prev_entry,next_entry,1).encode('utf-8')
          }
          for name in ['personal-day-feature.js','app.js']:
              with tempfile.NamedTemporaryFile(suffix='.mjs') as js:
                  js.write(patches[name]);js.flush()
                  check=subprocess.run(['node','--check',js.name],capture_output=True,text=True)
                  if check.returncode:
                      raise RuntimeError('Invalid '+name+' syntax: '+check.stderr[:650])
          if subscription_block(patches['personal-day-feature.js'].decode('utf-8')) != new_offer:
              raise RuntimeError('Club block consistency check failed')
          f.cwd(home)
          try:f.mkd('site-safeguard-backups')
          except ftplib.error_perm:pass
          f.cwd('site-safeguard-backups')
          stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
          for name in names:
              backup=stamp+'-club-template-'+name
              upload(backup,originals[name])
              print('BACKUP SAVED AND VERIFIED',name,flush=True)
          f.cwd(home)
          f.cwd(site)
          touched=[]
          try:
              for name in names:
                  touched.append(name)
                  upload(name,patches[name])
                  print('PUBLISHED VERIFIED',name,hashlib.sha256(patches[name]).hexdigest(),flush=True)
          except Exception:
              for name in reversed(touched):
                  try:
                      upload(name,originals[name])
                      print('ROLLBACK VERIFIED',name,flush=True)
                  except Exception:
                      print('ROLLBACK FAILED',name,flush=True)
              raise
          finally:
              f.quit()
          print('PERSONAL DAY CLUB TEMPLATE PUBLISHED: SUCCESS',flush=True)
          PY
