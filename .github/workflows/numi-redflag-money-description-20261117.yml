name: Publish Red Flag money category description only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-money-description-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check only Red Flag money copy and script syntax
        run: |
          set -euo pipefail
          for path in redflag-public-catalog.js redflag-text-bank.js redflag-categories.js redflag-feature.js app.js; do node --check "$path"; done
          python3 - <<'PY'
          from pathlib import Path
          approved='Расчёт учитывает отношение мужчины к деньгам, его способность зарабатывать, привычки в тратах и готовность проявлять щедрость как на ранних этапах отношений, так и в семейной жизни.'
          catalog=Path('redflag-public-catalog.js').read_text()
          assert catalog.count(approved)==1
          chain=[('redflag-text-bank.js','redflag-public-catalog.js'),('redflag-categories.js','redflag-text-bank.js'),('redflag-feature.js','redflag-categories.js'),('app.js','redflag-feature.js'),('index.html','app.js')]
          for owner,target in chain:
            assert target+'?v=money-description-20261117' in Path(owner).read_text(),(owner,target)
          print('REDFLAG_MONEY_DESCRIPTION_VALIDATED')
          PY
      - name: Backup and publish only six listed files, then check HTTP
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          paths=['redflag-public-catalog.js','redflag-text-bank.js','redflag-categories.js','redflag-feature.js','app.js','index.html']
          wanted={p:Path(p).read_bytes() for p in paths}
          def digest(b):return hashlib.sha256(b).hexdigest()
          baselines={}
          for p in paths:
            revisions=subprocess.check_output(['git','log','--format=%H','-n','200','--',p],text=True).splitlines()
            baselines[p]={digest(subprocess.check_output(['git','show',rev+':'+p])) for rev in revisions}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
            b=io.BytesIO();ftp.retrbinary('RETR '+root+p,b.write);return b.getvalue()
          def put(p,b):
            ftp.storbinary('STOR '+root+p,io.BytesIO(b))
            if digest(read(p))!=digest(b):raise RuntimeError('FTP_VERIFICATION_FAILED '+p)
          touched=[]
          try:
            original={p:read(p) for p in paths}
            for p in paths:
              if digest(original[p]) not in baselines[p]:raise RuntimeError('UNRECOGNIZED_LIVE_VERSION '+p)
            backup=home+'/site-safeguard-backups/redflag-money-description-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            ftp.mkd(backup)
            for p in paths:
              backup_file=backup+'/'+p+'.bak'
              ftp.storbinary('STOR '+backup_file,io.BytesIO(original[p]))
              b=io.BytesIO();ftp.retrbinary('RETR '+backup_file,b.write)
              if b.getvalue()!=original[p]:raise RuntimeError('BACKUP_READBACK_FAILED '+p)
            for p in paths:
              if read(p)!=original[p]:raise RuntimeError('CONCURRENT_CHANGE '+p)
              if original[p]!=wanted[p]:touched.append(p);put(p,wanted[p])
            for p in paths:
              url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+p+'?money_copy='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiRedFlagMoneyRelease'})
              with urllib.request.urlopen(req,timeout=30) as res:
                live=res.read(300000)
              if digest(live)!=digest(wanted[p]):raise RuntimeError('PUBLIC_FILE_DIFF '+p)
            print('REDFLAG_MONEY_DESCRIPTION_LIVE_VERIFIED',flush=True)
          except BaseException:
            for p in reversed(touched):
              try:put(p,original[p])
              except BaseException:print('ROLLBACK_FAILED '+p,flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
