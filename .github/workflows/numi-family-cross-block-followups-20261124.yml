name: Publish Family owner cross-block 49R recommendations only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-cross-block-followups-20261124.yml
      - .github/scripts/numi_family_cross_block_followups_publish_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check real 49R catalogue and publish only Family owner followups
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_cross_block_followups_publish_20261124.py
