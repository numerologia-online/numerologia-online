name: Family household five-point pilot - offline checks only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-five-point-pilot-check.yml
      - account-service/private/family-household-five-points-pilot.php
      - tests/family-household-five-points-pilot.php
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l account-service/private/family-household-five-points-pilot.php
      - name: Day and month 50/50, five positions, seven dates; NO external calls
        run: php tests/family-household-five-points-pilot.php
