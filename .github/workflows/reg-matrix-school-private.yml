name: Publish reviewed Matrix school lessons to protected storage
on:
  push:
    paths:
      - .github/numi-local-content-release.json
permissions:
  contents: read
concurrency:
  group: reg-ru-native-content-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish reviewed Matrix school structure in existing protected storage'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check exact reviewed school scope
        run: |
          python3 -m py_compile .github/scripts/reg-local-private-content-publish.py
          python3 - <<'PY'
          import json,pathlib
          release=json.loads(pathlib.Path(".github/numi-local-content-release.json").read_text())
          expected=set(["pro/school/lessons/internal.json","pro/school/lessons/reduce.json","pro/school/lessons/base.json","pro/school/lessons/purpose.json","pro/school/lessons/topics.json","pro/school/lessons/final.json","pro/school/lessons/diagonals.json","pro/school/lessons/channels.json","pro/school/lessons/build-independent.json"])
          if set(release.get("approved_paths", [])) != expected:
              raise SystemExit("Only the nine reviewed structural school lessons are approved.")
          PY
      - name: Publish only reviewed lessons with live-version guard and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-local-private-content-publish.py
      - name: Verify anonymous access remains protected
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          request=urllib.request.Request("https://xn--c1adkkdfjbp1a4l.online/api/numi-paid-content.php",data=json.dumps({"init_data":"","path":"pro/school/lessons/base.json"}).encode(),headers={"Content-Type":"application/json"},method="POST")
          try:
              urllib.request.urlopen(request,timeout=30)
              raise SystemExit("Anonymous protected text must not be returned.")
          except urllib.error.HTTPError as error:
              result=json.loads(error.read())
              if error.code != 401 or result.get("error") != "TELEGRAM_AUTH_REQUIRED":
                  raise SystemExit("Unexpected anonymous access response.")
          print("School source release verified; anonymous access remains denied.")
          PY
