name: Deploy only owner short Gemini preview diagnostics safely
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact editor-only changes and free syntax checks
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          node --check redflag-feature.js
          node --check app.js
          python3 - <<'PY'
          import subprocess,pathlib
          base='e991142fa62abe1dd0346aff578a507130ab2ecb'
          target='057ca1d10a57b523d5fe08e3b5a4276d031530f2'
          paths=['redflag-ai-lab/style-test-api.php','redflag-feature.js','app.js','index.html']
          for path in paths:
              expected=subprocess.check_output(['git','show',target+':'+path])
              actual=pathlib.Path(path).read_bytes()
              assert actual==expected,'SOURCE_HAS_NEW_UNAPPROVED_CHANGE_'+path
          def read(sha,path):
              return subprocess.check_output(['git','show',sha+':'+path]).decode('utf-8')
          b=read(base,paths[0]);a=read(target,paths[0])
          frozen=lambda s:s.split('function rfOwnerSharpFlags(',1)[1].split('function rfOwnerSharpInfidelity(',1)[0]
          assert frozen(b)==frozen(a),'FLAGS_PROMPT_CHANGED'
          assert a.count("]],2800,'google/gemini-3-flash-preview');")==2,'TOKENS_OR_MODEL_CHANGED'
          assert 'RF_OWNER_INF_SHORT_PREVIEW' in a,'OWNER_PREVIEW_NOT_ADDED'
          assert "unset($_SESSION['last_generation'])" in a,'FAILED_COOLDOWN_NOT_RESET'
          assert a.count('__CLOUDRU_KEY_BASE64__')==1,'SERVER_KEY_LAYOUT_CHANGED'
          assert 'short_preview' in read(target,paths[1]) and 'editorPreview' in read(target,paths[1]),'EDITOR_JS_MISSING'
          assert 'infidelity-shortpreview-20261122' in read(target,paths[2]) and 'infidelity-shortpreview-20261122' in read(target,paths[3]),'CACHE_BUST_NOT_SET'
          # All owner-only business logic before infidelity remains byte-identical.
          assert b.split('function rfOwnerSharpInfidelity(',1)[0]==a.split('function rfOwnerSharpInfidelity(',1)[0],'UNAPPROVED_UPSTREAM_API_CHANGE'
          # Only inside the infidelity function or following catch; all other categories untouched.
          assert read(base,'redflag-ai-lab/catalog.json')==read(target,'redflag-ai-lab/catalog.json'),'CATALOG_CHANGED'
          print('APPROVED_EDITOR_ONLY_PATCH_CHECK_PASSED no_provider_calls=true',flush=True)
          PY
      - name: FTPS backup guarded upload readback and rollback with zero model calls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,pathlib,io,ssl,ftplib,re,urllib.request,urllib.error,time
          baseline='e991142fa62abe1dd0346aff578a507130ab2ecb'
          target='057ca1d10a57b523d5fe08e3b5a4276d031530f2'
          paths=['redflag-ai-lab/style-test-api.php','redflag-feature.js','app.js','index.html']
          old={p:subprocess.check_output(['git','show',baseline+':'+p]) for p in paths}
          new={p:subprocess.check_output(['git','show',target+':'+p]) for p in paths}
          assert all(pathlib.Path(p).read_bytes()==new[p] for p in paths),'SOURCE_DRIFT'
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(site+path+'?owner_short_ui='+str(time.time_ns()),
                 headers={'Cache-Control':'no-store','User-Agent':'NumiVerifiedEditorPreviewOnly/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status
              except urllib.error.HTTPError as e:return e.code
          if status('')!=200:raise RuntimeError('HOME_NOT_200_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              out=io.BytesIO();ftp.retrbinary('RETR '+root+p,out.write);return out.getvalue()
          def write(p,data):
              ftp.storbinary('STOR '+root+p,io.BytesIO(data))
              if read(p)!=data:raise RuntimeError('FTPS_READBACK_BAD_'+p)
          protected=['redflag-ai-lab/catalog.json','redflag-ai-lab/intimacy-knowledge-v1.json',
                   'redflag-public-catalog.js','redflag-text-bank.js','api/numi-account.php',
                   'api/redflag-free-ai.php']
          prev={};changed=[]
          try:
              prev={p:read(p) for p in paths}
              api='redflag-ai-lab/style-test-api.php'
              matches=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",prev[api]))
              if len(matches)!=1:raise RuntimeError('LIVE_KEY_LAYOUT_INVALID')
              m=matches[0];secret=m.group(2)
              if len(secret)<16 or secret==b'__CLOUDRU_KEY_BASE64__' or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_SECRET_UNAVAILABLE')
              masked=prev[api][:m.start(2)]+b'__CLOUDRU_KEY_BASE64__'+prev[api][m.end(2):]
              if masked!=old[api]:raise RuntimeError('LIVE_API_NOT_BASELINE')
              for p in paths:
                  if p!=api and prev[p]!=old[p]:raise RuntimeError('LIVE_FILE_DRIFT_'+p)
              desired=dict(new);desired[api]=new[api].replace(b'__CLOUDRU_KEY_BASE64__',secret)
              protected_bytes={p:read(p) for p in protected}
              assert subprocess.run(['php','-l'],input=desired[api],capture_output=True).returncode==0,'INVALID_PRODUCTION_PHP'
              bdir=home+'/site-safeguard-backups'
              try:ftp.mkd(bdir)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in paths:
                  if desired[p]!=prev[p]:
                      ftp.storbinary('STOR '+bdir+'/shortpreview-'+stamp+'-'+p.replace('/','-')+'.bak',io.BytesIO(prev[p]))
              if any(read(p)!=prev[p] for p in paths):raise RuntimeError('CONCURRENT_SERVER_CHANGE')
              for p in paths:
                  if desired[p]!=prev[p]:
                      changed.append(p);write(p,desired[p])
              if status('')!=200:raise RuntimeError('HOME_NOT_200_AFTER')
              if status('redflag-ai-lab/style-test-api.php')!=403:
                  raise RuntimeError('OWNER_GUARD_NOT_403')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_API_5XX')
              if any(read(p)!=data for p,data in protected_bytes.items()):
                  raise RuntimeError('PROTECTED_FILE_CHANGED')
              if any(read(p)!=desired[p] for p in paths):raise RuntimeError('READBACK_NOT_FINAL')
              print('PUBLISHED_AND_VERIFIED owner_short_preview=true failed_editor_cooldown_cleared=true flags_prompt_frozen=true model_and_budget_unchanged=true payment_and_public_routes_unchanged=true generated_inference_calls=0 files='+str(changed),flush=True)
          except BaseException:
              for p in reversed(changed):
                  try:write(p,prev[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:print('ROLLBACK_FAILED '+p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
