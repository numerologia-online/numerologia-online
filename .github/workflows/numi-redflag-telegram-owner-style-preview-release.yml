name: Diagnose Telegram section loading read-only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read only public asset checks and sanitized site errors
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,ssl,time,pathlib,hashlib,collections,ftplib,io,os,re
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          paths=[
           '','?view=redflag','app.js?v=infidelity-shortpreview-20261122',
           'redflag-feature.js?v=infidelity-shortpreview-20261122',
           'redflag-engine.js?v=4','redflag-categories.js?v=flags-owner-preview-20261117',
           'redflag-public-catalog.js','redflag-polish.css?v=20261105scrollfit1',
           'year-feature.js?v=owner-access-20261116','year-content.js?v=4','year-polish.css?v=year-pdf-view-20261113',
           'matrix-feature.js?v=36','numerology-core.js?v=5',
           'compatibility-feature.js?v=compatibility-cards-20261116',
           'personal-day-feature.js?v=20261115-day-source-unified',
           'destiny-code-feature.js?v=wallet-direct1',
           'auth-profile.js','account-browser.js','telegram-scroll-guard.js?v=1',
           'api/profile.php','api/numi-account.php','redflag-ai-lab/style-test-api.php'
          ]
          for path in paths:
              url=site+path
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Numi read-only diagnostics','Cache-Control':'no-cache','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=17) as resp:
                      b=resp.read()
                      code=resp.status;typ=resp.headers.get('content-type','')
                      sha=hashlib.sha256(b).hexdigest()[:14]
                      name=path.split('?')[0]
                      expected=pathlib.Path(name) if name else None
                      match=(expected.exists() and expected.is_file() and expected.read_bytes()==b) if expected else None
                      print('ASSET',repr(path),code,len(b),typ[:60], 'sha='+sha,'matches_github='+str(match),flush=True)
                      if name.endswith('.js') and b'<html' in b[:500].lower():print('WARNING_JS_HTML_BODY',name,flush=True)
              except urllib.error.HTTPError as e:
                  print('ASSET',repr(path),e.code,'http_error',e.headers.get('content-type','')[:50],flush=True)
              except Exception as e:
                  print('ASSET',repr(path),'FAIL',type(e).__name__,str(e)[:130],flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          try:
              ftp.connect('server172.hosting.reg.ru',21)
              ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
              ftp.prot_p();ftp.set_pasv(True);ftp.voidcmd('TYPE I')
              root=ftp.pwd().rstrip('/')
              for typ in ['error','access']:
                  p=root+'/logs/xn--c1adkkdfjbp1a4l.online.'+typ+'.log'
                  try:
                      if ftp.size(p)>2000000:print('SITE_LOG_TOO_LARGE',typ,flush=True);continue
                      out=io.BytesIO();ftp.retrbinary('RETR '+p,out.write)
                      raw=out.getvalue().decode('utf-8','replace')
                      print('SITE_LOG_SIZE',typ,len(raw),flush=True)
                      if typ=='error':
                          counts=collections.Counter()
                          for line in raw.splitlines():
                              if 'PHP Fatal error' in line:counts['PHP_FATAL']+=1
                              if 'REDFLAG_CLOUDRU:' in line:counts['REDFLAG_CLOUDRU']+=1
                              if 'auth' in line.lower():counts['AUTH_ERROR_RELATED']+=1
                              if 'Uncaught' in line:counts['UNCAUGHT']+=1
                          print('SITE_ERROR_COUNTS',dict(counts),flush=True)
                      else:
                          counts=collections.Counter()
                          for line in raw.splitlines()[-1000:]:
                              m=re.search(r' "(?:GET|POST|HEAD) ([^ ?"]+)[^"]* HTTP/[^"]+" (\d{3}) ',line)
                              if m:
                                  ep,status=m.groups()
                                  if status.startswith('4') or status.startswith('5'):
                                      if ep.endswith(('.js','.css')):cat='ASSET_'+status
                                      elif '/api/' in ep:cat='API_'+status
                                      else:cat='OTHER_'+status
                                      counts[cat]+=1
                          print('SITE_RECENT_HTTP_ERROR_COUNTS',dict(counts),flush=True)
                  except Exception as e:print('SITE_LOG_UNAVAILABLE',typ,type(e).__name__,str(e)[:100],flush=True)
              ftp.quit()
          except Exception as e:
              print('FTPS_DIAGNOSTIC_UNAVAILABLE',type(e).__name__,str(e)[:100],flush=True)
          PY
