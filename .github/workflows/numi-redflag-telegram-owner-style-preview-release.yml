name: Inspect exact domain Gemini errors from REG.RU log read-only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Parse redacted error metadata only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,ssl,os,re,io,collections
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=28)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          ftp.voidcmd('TYPE I')
          root=ftp.pwd().rstrip('/')
          base=root+'/logs/xn--c1adkkdfjbp1a4l.online.error.log'
          for suffix in ['', '.1','.1.gz','.2.gz']:
              path=base+suffix
              try:
                  try: n=ftp.size(path)
                  except ftplib.all_errors: n=None
                  if n is None:print('MISSING_OR_UNKNOWN_LOG_FILE '+suffix,flush=True);continue
                  print('ERROR_LOG_BYTES '+suffix+' '+str(n),flush=True)
                  if n>7000000:print('LOG_SKIPPED_FOR_SIZE',flush=True);continue
                  b=io.BytesIO();ftp.retrbinary('RETR '+path,b.write)
                  raw=b.getvalue()
                  if suffix.endswith('.gz'):
                      import gzip
                      raw=gzip.decompress(raw)
                  s=raw.decode('utf-8','replace')
                  reg=r'REDFLAG_INFidelity_LENGTH_META chars=(\d+) finish=([A-Za-z_]*) output_tokens=(\d+) reasoning_tokens=(\d+)'
                  matches=[tuple([int(m[0]),m[1],int(m[2]),int(m[3])]) for m in re.findall(reg,s)]
                  print('INFIDELITY_LENGTH_EVENTS count='+str(len(matches))+' recent='+str(matches[-24:]),flush=True)
                  hist=collections.Counter('short' if c<450 else 'long' if c>1250 else 'ok' for c,*_ in matches)
                  print('LENGTH_BUCKET_COUNTS '+str(dict(hist)),flush=True)
                  err=collections.Counter({k:len(re.findall(r'REDFLAG_CLOUDRU:.*?'+k,s)) for k in [
                    'OWNER_TEXT_LENGTH_INVALID','OWNER_TEXT_PARAGRAPHS_INVALID',
                    'PROVIDER_OUTPUT_LIMIT','PROVIDER_TIMEOUT','EMPTY_ANSWER'
                  ]})
                  print('ERROR_CODES_COUNTS '+str(dict(err)),flush=True)
                  empties=re.findall(r'REDFLAG_EMPTY_META model=([A-Za-z0-9_]+) finish=([A-Za-z_]+) output_tokens=(\d+) reasoning_tokens=(\d+)',s)
                  print('EMPTY_PROVIDER_METRICS '+str(collections.Counter((model,finish) for model,finish,_,_ in empties))+' recent='+str(empties[-10:]),flush=True)
              except ftplib.all_errors as e:
                  print('LOG_READ_UNAVAILABLE '+suffix+' '+type(e).__name__,flush=True)
              except Exception as e:
                  print('LOG_PARSE_UNAVAILABLE '+suffix+' '+type(e).__name__,flush=True)
          ftp.quit()
          PY
