name: Publish distinct editor Infidelity question focuses
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact editor-only patch and free PHP syntax
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import pathlib,subprocess,re
          p='redflag-ai-lab/style-test-api.php'
          base='f3097a5cd958196073429be4926562d65a2341e3'
          target='a67b1a7b156448252f46a201bf9c8a0135ab3dcd'
          before=subprocess.check_output(['git','show',base+':'+p]).decode()
          after=subprocess.check_output(['git','show',target+':'+p]).decode()
          actual=pathlib.Path(p).read_text()
          assert actual==after,'UNAPPROVED_SOURCE'
          opener='function rfOwnerSharpInfidelity('
          closer='\ntry {\n    // DEPLOYMENT_HEALTH_SLOT'
          assert before.count(opener)==1 and after.count(opener)==1
          assert before.count(closer)==1 and after.count(closer)==1
          assert before.split(opener,1)[0]==after.split(opener,1)[0],'FROZEN_FLAGS_AND_EARLY_API_CHANGED'
          assert before.split(closer,1)[1]==after.split(closer,1)[1],'OWNER_PAYMENT_OR_LATE_API_CHANGED'
          x=after.split(opener,1)[1].split(closer,1)[0]
          y=before.split(opener,1)[1].split(closer,1)[0]
          assert x.count("'faithful'=>")==2 and x.count("'after-mistake'=>")==2,'FOCUS_AND_POSITION_MAP_MISSING'
          assert sum(x.count("'"+q+"'=>") for q in ['faithful','options','flirt','trust','ex','temptation','physical-or-emotional','secrecy','return','after-mistake'])==20,'FOCUS_OR_MAP_MISSING'
          assert "ориентир 1200–1500 знаков ВСЕГО" in x,'TARGET_MISSING'
          assert 'Вместо судебных и бюрократических метафор' in x
          assert 'не более 1250 знаков' not in x
          assert x.count("]],2800,'google/gemini-3-flash-preview');")==1
          assert y.count("]],2800,'google/gemini-3-flash-preview');")==1
          assert "if($outLen<450||$outLen>1600)" in x
          assert after.count('__CLOUDRU_KEY_BASE64__')==1
          assert 'RF_OWNER_INF_SHORT_PREVIEW' in x
          assert 'OWNER_TEXT_LENGTH_INVALID' in x
          print('APPROVED_INF_EDITOR_ONLY_PATCH_TRUE ZERO_BILLED_GENERATIONS',flush=True)
          PY
      - name: Upload only approved PHP file to REG.RU with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,ssl,io,ftplib,re,subprocess,pathlib,time,urllib.request,urllib.error
          p='redflag-ai-lab/style-test-api.php'
          base='f3097a5cd958196073429be4926562d65a2341e3'
          target='a67b1a7b156448252f46a201bf9c8a0135ab3dcd'
          before=subprocess.check_output(['git','show',base+':'+p])
          after=subprocess.check_output(['git','show',target+':'+p])
          assert pathlib.Path(p).read_bytes()==after,'UNAPPROVED_LOCAL_SOURCE'
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(route):
              req=urllib.request.Request(site+route+'?owner_inf_focus='+str(time.time_ns()),
                headers={'Cache-Control':'no-store','User-Agent':'NumiEditorInfidelityFocus/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=28) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          if status('')!=200:raise RuntimeError('HOME_NOT_200_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=40)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+root+path,b.write)
              return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+root+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('READBACK_FAILED_'+path)
          protected=['redflag-ai-lab/catalog.json','redflag-ai-lab/intimacy-knowledge-v1.json',
            'redflag-feature.js','app.js','index.html','redflag-public-catalog.js',
            'api/numi-account.php','api/redflag-free-ai.php']
          changed=False
          try:
              live=read(p)
              matches=list(re.finditer(rb"(\$key=base64_decode\(')([^']+)(',true\);)",live))
              if len(matches)!=1:raise RuntimeError('LIVE_KEY_LAYOUT_UNEXPECTED')
              m=matches[0];secret=m.group(2)
              if len(secret)<16 or secret==b'__CLOUDRU_KEY_BASE64__' or not re.fullmatch(rb'[A-Za-z0-9+/=]+',secret):
                  raise RuntimeError('LIVE_KEY_MISSING')
              masked=live[:m.start(2)]+b'__CLOUDRU_KEY_BASE64__'+live[m.end(2):]
              if masked!=before:raise RuntimeError('LIVE_API_DIFFERS_FROM_APPROVED_BASELINE')
              desired=after.replace(b'__CLOUDRU_KEY_BASE64__',secret)
              if subprocess.run(['php','-l'],input=desired,capture_output=True).returncode!=0:
                  raise RuntimeError('LIVE_PHP_LINT_FAILED')
              fingerprints={path:read(path) for path in protected}
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              ftp.storbinary('STOR '+backup+'/editor-infidelity-focus-'+stamp+'.php.bak',io.BytesIO(live))
              if read(p)!=live:raise RuntimeError('LIVE_API_CHANGED_CONCURRENTLY')
              changed=True
              write(p,desired)
              if status('')!=200:raise RuntimeError('HOME_NOT_200_AFTER')
              if status('redflag-ai-lab/style-test-api.php')!=403:
                  raise RuntimeError('OWNER_SECURITY_CHECK_FAILED')
              if status('api/numi-account.php')>=500:
                  raise RuntimeError('ACCOUNT_API_ERROR')
              if read(p)!=desired:raise RuntimeError('FINAL_API_READBACK_FAILED')
              for path,previous in fingerprints.items():
                  if read(path)!=previous:raise RuntimeError('GUARDED_FILE_CHANGED_'+path)
              print('PUBLISHED_AND_VERIFIED infidelity_focus_10=true editor_only=true redflags_prompt_frozen=true gemini_2800_unchanged=true payments_unchanged=true backups_ready=true billable_inference_calls=0',flush=True)
          except BaseException:
              if changed:
                  try:
                      write(p,live)
                      print('ROLLBACK_OK',flush=True)
                  except BaseException:
                      print('ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
