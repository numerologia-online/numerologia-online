name: Publish owner Red Flag Telegram cache refresh
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact two static asset-version changes
        run: |
          set -euo pipefail
          node --check app.js
          python3 - <<'PY'
          import subprocess,pathlib
          baseline='a3370ba7045625c14f255866e439e8f7d2ecd7a9'
          replacements={
            'app.js':(b'./redflag-feature.js?v=flags-owner-sonnet-shared-20261120',b'./redflag-feature.js?v=flags-owner-fullbirth-20261121-2'),
            'index.html':(b'app.js?v=flags-owner-sonnet-shared-20261120',b'app.js?v=flags-owner-fullbirth-20261121-2')
          }
          for p,(old,new) in replacements.items():
              original=subprocess.check_output(['git','show',baseline+':'+p])
              current=pathlib.Path(p).read_bytes()
              assert original.count(old)==1,'BASELINE_VERSION_NOT_UNIQUE_'+p
              assert original.replace(old,new)==current,'UNREVIEWED_DIFF_'+p
          js=pathlib.Path('redflag-feature.js').read_text()
          assert 'year:birth.year})' in js and 'care-or-control"?{}:{year:birth.year}' not in js
          print('CACHE_REFRESH_SCOPE_VERIFIED no_inference=1',flush=True)
          PY
      - name: Publish only app.js and index.html via protected FTPS without model calls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,ssl,os,io,time,subprocess,pathlib,urllib.request,urllib.error
          targets=['app.js','index.html']
          guarded=['redflag-feature.js','redflag-ai-lab/style-test-api.php','redflag-ai-lab/intimacy-knowledge-v1.json','api/numi-account.php','api/redflag-free-ai.php']
          baseline='a3370ba7045625c14f255866e439e8f7d2ecd7a9'
          original_source={p:subprocess.check_output(['git','show',baseline+':'+p]) for p in targets}
          desired={p:pathlib.Path(p).read_bytes() for p in targets}
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def http_status(path):
              req=urllib.request.Request(site+path+'?static_cache_release='+str(time.time_ns()),headers={'Cache-Control':'no-store','User-Agent':'NumiSafeStaticCachePatch/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          if http_status('')!=200:raise RuntimeError('HOME_BEFORE_NOT_200')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              buf=io.BytesIO();ftp.retrbinary('RETR '+root+p,buf.write);return buf.getvalue()
          def put(p,data):
              ftp.storbinary('STOR '+root+p,io.BytesIO(data))
              if read(p)!=data:raise RuntimeError('FTPS_READBACK_FAILED_'+p)
          previous={};changed=[]
          try:
              previous={p:read(p) for p in targets}
              for p in targets:
                  if previous[p] not in (original_source[p],desired[p]):
                      raise RuntimeError('LIVE_STATIC_DIFFERS_FROM_REVIEWED_BASELINE_'+p)
              unchanged={p:read(p) for p in guarded}
              backups=home+'/site-safeguard-backups'
              try:ftp.mkd(backups)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              for p in targets:
                  if previous[p]!=desired[p]:
                      ftp.storbinary('STOR '+backups+'/redflag-static-'+stamp+'-'+p+'.bak',io.BytesIO(previous[p]))
              if any(read(p)!=previous[p] for p in targets):
                  raise RuntimeError('CONCURRENT_LIVE_STATIC_CHANGE')
              for p in targets:
                  if previous[p]!=desired[p]:
                      changed.append(p)
                      put(p,desired[p])
              if http_status('')!=200:raise RuntimeError('HOME_AFTER_NOT_200')
              if http_status('redflag-ai-lab/style-test-api.php')!=403:
                  raise RuntimeError('OWNER_ACCESS_GUARD_FAILED')
              if http_status('api/numi-account.php')>=500:
                  raise RuntimeError('ACCOUNT_ENDPOINT_SERVER_ERROR')
              if any(read(p)!=unchanged[p] for p in guarded):
                  raise RuntimeError('PROTECTED_FILE_CHANGED')
              if any(read(p)!=desired[p] for p in targets):
                  raise RuntimeError('REMOTE_CONTENT_NOT_UPDATED')
              print('PUBLISHED_AND_VERIFIED cache_bust=true changed='+str(changed)+' homepage=200 owner_guard=403 payments_and_model_unchanged=true inference_calls=0',flush=True)
          except BaseException:
              for p in reversed(changed):
                  try:put(p,previous[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:print('ROLLBACK_FAILED '+p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
