name: Browser diagnose site section navigation without purchases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install temporary headless browser only
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check actual browser errors on four section open buttons
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const {webkit,devices}=require('playwright');
            for(const engine of [chromium,webkit]){
            const browser=await engine.launch({headless:true,...(engine===chromium?{args:['--no-sandbox']}:{})});
            const checks=[
              ['redflag','[data-open-redflag]'],
              ['year','[data-open-year]'],
              ['matrix','[data-open-matrix]'],
              ['compatibility','[data-open-compatibility]'],
              ['personal-day','[data-open-personal-day]']
            ];
            for(const [name,selector] of checks){
              const ctx=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}});
              const page=await ctx.newPage();
              const issues=[];
              page.on('pageerror',e=>issues.push('PAGE_ERROR '+e.name+' '+String(e.message).slice(0,280)));
              page.on('requestfailed',req=>issues.push('NETWORK_FAILED '+new URL(req.url()).pathname+' '+String(req.failure()?.errorText).slice(0,80)));
              page.on('response',res=>{
                 if(res.status()>=400){
                   const u=new URL(res.url());
                   if(u.hostname.endsWith('xn--p1ai'))issues.push('HTTP_'+res.status()+' '+u.pathname);
                 }
              });
              page.on('dialog',async d=>{issues.push('ALERT '+d.message().slice(0,140));await d.accept()});
              try {
                await page.goto('https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/',{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForTimeout(2000);
                const modulePath={redflag:'redflag-feature.js?v=infidelity-shortpreview-20261122',year:'year-feature.js?v=owner-access-20261116',matrix:'matrix-feature.js?v=36',compatibility:'compatibility-feature.js?v=compatibility-cards-20261116','personal-day':'personal-day-feature.js?v=20261115-day-source-unified'}[name];
                const imp=await page.evaluate(async href=>{try{await import('./'+href);return 'OK'}catch(e){return String(e?.stack||e).slice(0,350)}},modulePath);
                console.log('MODULE_IMPORT',engine.name(),name,JSON.stringify(imp));
                const clicked=await page.evaluate(s=>{const el=document.querySelector(s);if(!el)return false;el.click();return true},selector);
                await page.waitForTimeout(2500);
                const visible=await page.evaluate(()=>{
                  const c=[...document.querySelectorAll('main,section,dialog,article')].filter(el=>el.getBoundingClientRect().width>50&&el.getBoundingClientRect().height>100&&getComputedStyle(el).display!=='none');
                  return c.slice(0,5).map(el=>({id:el.id,cls:typeof el.className==='string'?el.className.slice(0,80):''}));
                });
                console.log('BROWSER_CHECK',engine.name(),name,'clicked='+clicked,'ISSUES',JSON.stringify(issues.slice(-14)),'visible',JSON.stringify(visible));
              }catch(e){console.log('BROWSER_CHECK',engine.name(),name,'THROWN',String(e.message).slice(0,250),'ISSUES',JSON.stringify(issues.slice(-14)))}
              await ctx.close();
            }
            await browser.close();
            }
          })().catch(e=>{console.log('BROWSER_DIAGNOSTIC_FAILED',e.message);process.exitCode=1});
          JS
