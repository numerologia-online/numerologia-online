name: Publish direct Cloud.ru in existing owner Red Flag only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-telegram-owner-style-preview-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate and publish two existing Red Flag files only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          CLOUD_RU_API_KEY: ${{ secrets.CLOUD_RU_API_KEY_2 }}
        run: |
          python3 - <<'PY'
          import os,io,ssl,ftplib,json,subprocess,time,secrets,hashlib,base64,urllib.request,urllib.error
          from pathlib import Path
          api='redflag-ai-lab/style-test-api.php'
          front='redflag-feature.js'
          paths=[api,front]
          guarded=['index.html','app.js','api/numi-account.php','api/numi-owner-access.php']
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          key=os.environ['CLOUD_RU_API_KEY'].strip()
          if not key:raise SystemExit('CLOUD_RU_API_KEY_2_MISSING')
          encoded=base64.b64encode(key.encode()).decode()
          print('::add-mask::'+encoded)
          desired={p:Path(p).read_bytes() for p in paths}
          expected_hashes={api:'5712dd71351e918fd284d263fbbba773f289e1bb1c8c5add621ea6885cad8e01',front:'4a3877f1154ad4199506bddb367ce607006a7859950c2c1e96d68f0aa9a3cb41'}
          if desired[api].count(b'__CLOUDRU_KEY_BASE64__')!=1:raise SystemExit('INVALID_KEY_TEMPLATE')
          desired[api]=desired[api].replace(b'__CLOUDRU_KEY_BASE64__',encoded.encode())
          token=secrets.token_hex(32)
          health="""if(time()<__DEADLINE__ && hash_equals('__HASH__',hash('sha256',(string)($_SERVER['HTTP_X_NUMI_DEPLOYMENT']??'')))){
              $answer=rfCloudCall([['role'=>'user','content'=>'Ответь одним словом: работает']],20);
              rfPreviewReply(200,['ok'=>true,'direct_cloudru'=>true,'response_received'=>$answer!=='']);
          }"""
          health=health.replace('__DEADLINE__',str(int(time.time())+240)).replace('__HASH__',hashlib.sha256(token.encode()).hexdigest())
          probe=desired[api].replace(b'// DEPLOYMENT_HEALTH_SLOT',health.encode())
          for body in [desired[api],probe]:
              lint=subprocess.run(['php','-l'],input=body,capture_output=True)
              if lint.returncode:raise SystemExit('PHP_SYNTAX_FAILED')
          lint=subprocess.run(['node','--input-type=module','--check'],input=desired[front],capture_output=True)
          if lint.returncode:raise SystemExit('JS_SYNTAX_FAILED')
          assert b'naTestOwner(naCurrent(naDB()))' in desired[api]
          assert b'naAllowedOrigins()' in desired[api]
          assert b'ownerDraftInScope(question,state)' in desired[front]
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+root+p,b.write)
              return b.getvalue()
          def put(p,b):
              ftp.storbinary('STOR '+root+p,io.BytesIO(b))
              if read(p)!=b:raise RuntimeError('READBACK_FAILED_'+p)
          def request(p,data=None,headers=None):
              req=urllib.request.Request(site+p,data=data,headers={'Cache-Control':'no-cache',**(headers or {})})
              try:
                  with urllib.request.urlopen(req,timeout=65) as r:return r.status,r.read(300000)
              except urllib.error.HTTPError as e:return e.code,e.read(10000)
          original={};modified=[]
          try:
              original={p:read(p) for p in paths}
              unchanged={p:read(p) for p in guarded}
              catalog=read('redflag-ai-lab/catalog.json')
              if catalog!=Path('redflag-ai-lab/catalog.json').read_bytes():raise RuntimeError('CATALOG_MISMATCH')
              for p in paths:
                  if hashlib.sha256(original[p]).hexdigest()!=expected_hashes[p]:raise RuntimeError('LIVE_DIFFERS_FROM_BASELINE_'+p)
              if request('')[0]!=200:raise RuntimeError('HOMEPAGE_UNAVAILABLE_BEFORE_CHANGE')
              modified.append(api);put(api,probe)
              code,body=request(api,headers={'X-Numi-Deployment':token})
              data=json.loads(body)
              if code!=200 or data.get('direct_cloudru') is not True or data.get('response_received') is not True:
                  raise RuntimeError('DIRECT_REGRU_CLOUDRU_PROBE_FAILED_HTTP_'+str(code))
              print('DIRECT_REGRU_TO_CLOUDRU_RESPONSE_OK inference_calls=1 max_tokens=20',flush=True)
              put(api,desired[api])
              for payload in [None,b'{"category":"flags","question_id":"care-or-control","day":9,"month":9}']:
                  code,body=request(api,data=payload,headers={'Content-Type':'application/json','Origin':site.rstrip('/')})
                  if code!=403 or json.loads(body).get('error')!='OWNER_ONLY':raise RuntimeError('OWNER_GUARD_FAILED')
              if read(front)!=original[front]:raise RuntimeError('FRONTEND_CHANGED_CONCURRENTLY')
              modified.append(front);put(front,desired[front])
              code,body=request(front+'?cloudru_verify='+str(time.time_ns()))
              if code!=200 or body!=desired[front]:raise RuntimeError('PUBLIC_FRONTEND_MISMATCH')
              for p in guarded:
                  if read(p)!=unchanged[p]:raise RuntimeError('GUARDED_FILE_CHANGED_'+p)
              if request('')[0]!=200:raise RuntimeError('HOMEPAGE_UNAVAILABLE_AFTER_CHANGE')
              code,body=request('api/numi-account.php',data=b'{"action":"session"}',headers={'Content-Type':'application/json','Origin':site.rstrip('/')})
              if code not in (200,401):raise RuntimeError('ACCOUNT_ENDPOINT_CHECK_FAILED_'+str(code))
              try:json.loads(body)
              except ValueError:raise RuntimeError('ACCOUNT_ENDPOINT_NOT_JSON')
              print('REDFLAG_DIRECT_CLOUDRU_LIVE owner_guard_get_post=403 homepage=200 account_json=true other_files_identical=true frontend_hash_verified=true auto_generations=0',flush=True)
          except BaseException:
              for p in reversed(modified):
                  try:put(p,original[p]);print('ROLLBACK_OK '+p,flush=True)
                  except BaseException:print('ROLLBACK_FAILED '+p,flush=True)
              raise
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
