name: Publish Love and Relationships with independent four-point generator
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/numi_love_live_20261124.py'
      - '.github/workflows/numi-love-live-20261124.yml'
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify 220 keys and publish protected love routes
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_love_live_20261124.py
