name: Restore first-party owner access to full-life report on REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-owner-unified-life-access-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check owner authentication and source syntax
        run: |
          php -l account-service/public/numi-owner-access.php
          node --check pro/pro.js
          python3 - <<'PY'
          from pathlib import Path
          owner=Path('account-service/public/numi-owner-access.php').read_text('utf8')
          pro=Path('pro/pro.js').read_text('utf8')
          page=Path('pro/index.html').read_text('utf8')
          assert 'naCurrent($db)' in owner and 'naTestOwner($account)' in owner
          assert "method:\"GET\", credentials:\"same-origin\"" in pro
          assert "/api/numi-owner-access.php" in pro
          assert 'action:"telegram",init_data:signed' in pro
          assert 'if (await verifyRegRuOwner()) return;' in pro
          assert 'verifiedOwner=true' in pro
          assert 'ownerSeeFree=false' in pro
          assert 'if (current && input.value) form.requestSubmit()' in pro
          assert 'pro/pro.js?v=owner-access-20261116' in page
          assert "/api/numi-account.php" in pro
          assert 'numerologia-online-auth-server.vercel.app' in pro
          assert 'function verifyRegRuOwner()' in pro
          assert 'naSignIn(' not in owner
          print('NUMI_OWNER_UNIFIED_PREFLIGHT_OK owner_server_gate=true existing_auth_fallback=true no_entitlement_change=true')
          PY
      - name: Backup and publish just one owner API and two full-life report files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,io,ftplib,ssl,subprocess,hashlib,pathlib,urllib.request,urllib.error,json,time
          base='e1446bd332442bde3e659da3aa27b44e03ab70ec^'
          originals={
            'pro/pro.js':subprocess.check_output(['git','show',base+':pro/pro.js']),
            'pro/index.html':subprocess.check_output(['git','show',base+':pro/index.html']),
            'api/numi-owner-access.php':None
          }
          newest={
            'pro/pro.js':pathlib.Path('pro/pro.js').read_bytes(),
            'pro/index.html':pathlib.Path('pro/index.html').read_bytes(),
            'api/numi-owner-access.php':pathlib.Path('account-service/public/numi-owner-access.php').read_bytes()
          }
          paths=['api/numi-owner-access.php','pro/pro.js','pro/index.html']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          site=root+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=root+'/site-safeguard-backups/'
          def get(p):
            data=io.BytesIO()
            try:ftp.retrbinary('RETR '+p,data.write)
            except ftplib.error_perm as err:
              if str(err).startswith('550'):return None
              raise
            return data.getvalue()
          def put(p,data):
            ftp.storbinary('STOR '+p,io.BytesIO(data))
            if get(p)!=data:raise RuntimeError('OWNER_FTP_READBACK_FAILED')
          old={}
          changed=[]
          try:
            for name in paths:
              value=get(site+name)
              if value not in (originals[name],newest[name]):
                raise RuntimeError('OWNER_LIVE_FILE_CHANGED_REFUSE_OVERWRITE: '+name)
              old[name]=value
            for name in paths:
              if old[name] is not None and old[name]!=newest[name]:
                stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
                put(backup+'owner-full-life-'+name.replace('/','-')+'-'+stamp+'.bak',old[name])
            for name in paths:
              if old[name]!=newest[name]:
                put(site+name,newest[name]);changed.append(name)
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
            for name in paths:
              if name.startswith('api/'):continue
              req=urllib.request.Request(url+name+'?check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=28) as response:
                delivered=response.read(160000)
                status=response.status
              if status!=200 or hashlib.sha256(delivered).digest()!=hashlib.sha256(newest[name]).digest():
                raise RuntimeError('OWNER_PUBLIC_FILE_NOT_UPDATED: '+name)
            req=urllib.request.Request(url+'api/numi-owner-access.php?check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as response:
              result=json.load(response)
              code=response.status
              cc=response.headers.get('Cache-Control','')
            if code!=200 or result.get('ok')!=True or result.get('owner') is not False or result.get('authenticated') is not False or 'no-store' not in cc:
              raise RuntimeError('OWNER_ANONYMOUS_GATE_INSECURE')
            print('NUMI_OWNER_FULL_LIFE_PUBLISHED_OK only_owner_can_unlock=true anonymous_owner_false=true telegram_compatible=true all_store_billing_untouched=true')
          except BaseException:
            for name in reversed(changed):
              try:
                if old[name] is None:ftp.delete(site+name)
                else:put(site+name,old[name])
                print('OWNER_FULL_LIFE_ROLLBACK_OK '+name)
              except Exception:print('OWNER_FULL_LIFE_ROLLBACK_FAILED '+name)
            raise
          finally:
            try:ftp.quit()
            except Exception:ftp.close()
          PY
