name: Yes-no copy and roomier dialog
on:
  push:
    branches: [fix/yesno-copy-roomier-dialog]
    paths: [.github/workflows/numi-yesno-copy-roomier.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish guarded dialog copy and spacing
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u yesno-service/copy-layout/deploy.py
