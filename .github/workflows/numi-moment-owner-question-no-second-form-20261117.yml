name: Publish Moment question without repeat form
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-owner-question-no-second-form-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify single-file owner Love preview change and JS syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          doc=Path('moment/owner-preview.html').read_text()
          assert doc.count('function compactLoveMode(')==1
          assert doc.count('async function showCompactLoveAnswer(')==1
          assert 'await showCompactLoveAnswer(requested);return;' in doc
          assert "compactQuestionParams.get('editor')!=='1'" in doc
          assert "body.moment-inline-love-view #work" in doc
          assert "$('work').hidden=true;" in doc
          assert "loadPairSession();updateReturnLinks();setMomentNow();" in doc
          assert "birth_date:birth,other_date:partner,moment:now" in doc
          assert "renderCompactLoveControls(question,response.answer.trim(),self,other)" in doc
          assert "fetch('/api/redflag-save.php'" in doc
          assert "navigator.share({title:question.title,text:report})" in doc
          assert "id=\"ask-another-question\"" in doc
          assert "id=\"review-controls\"" in doc
          js=doc.split('<script>')[-1].split('</script>')[0]
          file=Path('/tmp/numi-owner-no-repeated-form.js')
          file.write_text(js)
          subprocess.run(['node','--check',str(file)],check=True)
          print('MOMENT_NO_SECOND_FORM_SOURCE_VERIFIED',flush=True)
          PY
      - name: Backup, upload and verify only moment/owner-preview.html on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          path='moment/owner-preview.html'
          desired=Path(path).read_bytes()
          def digest(value):return hashlib.sha256(value).hexdigest()
          revs=subprocess.check_output(['git','log','--format=%H','-n','110','--',path],text=True).splitlines()
          trusted={digest(subprocess.check_output(['git','show',rev+':'+path])) for rev in revs}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          remote=home+'/www/xn--c1adkkdfjbp1a4l.online/'+path
          def read():
            b=io.BytesIO();ftp.retrbinary('RETR '+remote,b.write)
            return b.getvalue()
          def write(body):
            ftp.storbinary('STOR '+remote,io.BytesIO(body))
            if digest(read())!=digest(body):raise RuntimeError('FTP_READBACK_MISMATCH')
          changed=False
          try:
            old=read()
            if digest(old) not in trusted:raise RuntimeError('UNRECOGNIZED_LIVE_EDITOR_REFUSE_OVERWRITE')
            if old!=desired:
              backup_dir=home+'/site-safeguard-backups'
              try:ftp.mkd(backup_dir)
              except ftplib.error_perm as e:
                if not str(e).startswith('550'):raise
              backup=backup_dir+'/moment-owner-no-second-form-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'.bak'
              ftp.storbinary('STOR '+backup,io.BytesIO(old))
              stream=io.BytesIO();ftp.retrbinary('RETR '+backup,stream.write)
              if stream.getvalue()!=old:raise RuntimeError('BACKUP_READBACK_FAILED')
              if read()!=old:raise RuntimeError('CONCURRENT_LIVE_CHANGE')
              changed=True
              write(desired)
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/owner-preview.html?no_second_form_check='+str(time.time_ns())
            request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiOwnerLoveFormRelease'})
            with urllib.request.urlopen(request,timeout=35) as response:
              published=response.read(100000)
            if digest(published)!=digest(desired):raise RuntimeError('PUBLIC_LIVE_FILE_NOT_UPDATED')
            print('MOMENT_NO_SECOND_FORM_LIVE_VERIFIED file='+path,flush=True)
          except BaseException:
            if changed:
              try:write(old);print('MOMENT_NO_SECOND_FORM_ROLLBACK_OK',flush=True)
              except BaseException:print('MOMENT_NO_SECOND_FORM_ROLLBACK_FAILED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
