name: Publish owner-only uncensored Yes/No scaffold
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-uncensored-owner-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated owner preview and private empty bank
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          import urllib.request,urllib.error
          html_path='moment/yes-no/index.html'
          js_path='moment/yes-no/yes-no.js'
          api_path='api/numi-yesno-uncensored.php'
          version='uncensored-owner-20261127'
          source_path='yesno-service/public/numi-yesno-uncensored.php'
          pairs=[["  async function confirmTime(value, scrollToAnswer = false) {","  async function confirmTime(value, scrollToAnswer = false, uncensoredMode = false) {"],["      const response = await fetch(\"/api/numi-yesno-answer.php\", {method:\"POST\",credentials:\"same-origin\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify({question:selectedQuestion.id,time:value}),cache:\"no-store\", signal:controller.signal});","      const response = await fetch(uncensoredMode ? \"/api/numi-yesno-uncensored.php\" : \"/api/numi-yesno-answer.php\", {method:\"POST\",credentials:\"same-origin\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify({question:selectedQuestion.id,time:value}),cache:\"no-store\", signal:controller.signal});"],["      if(data.error===\"DAILY_LIMIT_REACHED\"||data.error===\"LOGIN_REQUIRED\"){","      if (uncensoredMode && data.error === \"UNCENSORED_OWNER_ONLY\") {\n        timeResult.textContent = \"Режим без цензуры 18+ пока закрыт. Готовим ответы для участников Клуба.\";\n        return;\n      }\n      if (uncensoredMode && data.error === \"UNCENSORED_NOT_READY\") {\n        timeResult.textContent = \"Ответ без цензуры для этого вопроса и времени ещё не написан.\";\n        return;\n      }\n      if(data.error===\"DAILY_LIMIT_REACHED\"||data.error===\"LOGIN_REQUIRED\"){"],["  uncensored?.addEventListener(\"click\", async () => {\n    if (pending || uncensored.disabled) return;\n    if (!selectedQuestion) {\n      grid.scrollIntoView({behavior:scrollBehavior(),block:\"start\"});\n      grid.querySelector(\".yn-topic\")?.focus({preventScroll:true});\n      return;\n    }\n    const id = answerRequest;\n    uncensored.disabled = true;\n    try {\n      const response = await fetch(\"/api/numi-yesno-answer.php?status=1\", {credentials:\"same-origin\",cache:\"no-store\"});\n      const data = await response.json();\n      if (id !== answerRequest) return;\n      if (!response.ok || data.ok !== true) throw Error(\"access unavailable\");\n      delete timeResult.dataset.empty;\n      if (data.authenticated && (data.subscribed || data.remaining === null)) {\n        timeResult.textContent = \"Ответы без цензуры 18+ готовятся. Скоро здесь появится новый режим Клуба.\";\n      } else {\n        timeResult.textContent = data.authenticated\n          ? \"Ответы без цензуры 18+ будут доступны только участникам Клуба.\"\n          : \"Войдите в личный кабинет, чтобы пользоваться режимом 18+ для участников Клуба.\";\n        const link = document.createElement(\"a\");\n        link.href = data.authenticated ? \"/?account=1&club_offer=1\" : \"/?account=1\";\n        link.className = \"yn-subscription-link\";\n        link.textContent = data.authenticated ? \"Вступить в Клуб · 490 ₽ в месяц\" : \"Войти в личный кабинет\";\n        timeResult.append(link);\n      }\n      timeResult.scrollIntoView({behavior:scrollBehavior(),block:\"center\"});\n    } catch {\n      if (id === answerRequest) {\n        delete timeResult.dataset.empty;\n        timeResult.textContent = \"Не удалось проверить доступ. Попробуйте ещё раз.\";\n      }\n    } finally { uncensored.disabled = false; }\n  });","  uncensored?.addEventListener(\"click\", () => {\n    if (pending) return;\n    if (!selectedQuestion) {\n      grid.scrollIntoView({behavior:scrollBehavior(),block:\"start\"});\n      grid.querySelector(\".yn-topic\")?.focus({preventScroll:true});\n      return;\n    }\n    confirmTime(useCurrentTime ? currentTime() : normalizeTime(timeInput.value), true, true);\n  });"]]
          assert all(after in pathlib.Path(js_path).read_text(encoding='utf-8') for before,after in pairs)
          subprocess.run(['php','-l',source_path],check=True)
          subprocess.run(['node','--check',js_path],check=True)
          private_revision='d71e75f42f1a40180950c53d7f87f03a6e6d0c7e'
          catalogue=json.loads(pathlib.Path('moment/yes-no/questions.json').read_text(encoding='utf-8'))
          expected={q['id']:q['title'] for q in catalogue['questions']}
          assert len(expected)==100
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path,missing=False):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+path,b.write)
              except ftplib.error_perm as e:
                  if missing and str(e).startswith('550'):return None
                  raise
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              # Reuse the existing private-source credential only on the release runner.
              config=read(home+'/private/numi-secure-access/config.local.php')
              token=re.search(rb'(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}',config)
              assert token,'Private source access unavailable'
              url='https://api.github.com/repos/numerologia-online/numi-numi-on-private/contents/moment/yes-no/uncensored/answer-bank.json?ref='+private_revision
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token.group().decode('ascii'),'Accept':'application/vnd.github.raw+json','User-Agent':'numi-owner-preview-release'})
              with urllib.request.urlopen(req,timeout=35) as response:bank_bytes=response.read(500000)
              bank=json.loads(bank_bytes)
              assert bank['schema_version']==1 and bank['mode']=='uncensored' and bank['calculation_version']=='time-digit-sum-v1'
              assert set(bank['questions'])==set(expected)
              for q,data in bank['questions'].items():
                  assert data['question_id']==q and data['question']==expected[q] and data['status']=='draft'
                  assert data['calculation_version']=='time-digit-sum-v1' and set(data['answers'])==set(map(str,range(10)))
                  assert all(v=='' for v in data['answers'].values())
              private_dir=home+'/private/numi-yesno-v1/uncensored'
              private_path=private_dir+'/answer-bank.json'
              try:ftp.mkd(private_dir)
              except ftplib.error_perm as e:
                  if not str(e).startswith('550'):raise
              desired={private_path:bank_bytes,root+api_path:pathlib.Path(source_path).read_bytes()}
              old={p:read(p,missing=True) for p in desired}
              for p,blob in desired.items():
                  assert old[p] is None or old[p]==blob,'Refusing to overwrite an existing uncensored bank or API'
              for rel in (js_path,html_path):
                  p=root+rel
                  old[p]=read(p)
                  current=old[p].decode('utf-8')
                  if rel==js_path:
                      for before,after in pairs:
                          if after in current:continue
                          assert current.count(before)==1,'Unexpected live script anchor'
                          current=current.replace(before,after,1)
                  else:
                      assert 'id="yn-uncensored"' in current and 'id="yn-answer-close"' in current
                      current,n=re.subn(r'\./yes-no\.js\?v=[a-zA-Z0-9_-]+','./yes-no.js?v='+version,current)
                      assert n==1,'Unexpected script version'
                  desired[p]=current.encode('utf-8')
              with tempfile.TemporaryDirectory() as tmp:
                  jscheck=pathlib.Path(tmp)/'yes-no.js'
                  jscheck.write_bytes(desired[root+js_path])
                  subprocess.run(['node','--check',str(jscheck)],check=True)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for n,(p,blob) in enumerate(old.items()):
                  if blob is not None:put(backup+'/uncensored-owner-'+os.environ['GITHUB_RUN_ID']+'-'+str(n)+'.bak',blob)
              touched=[]
              try:
                  for p,blob in desired.items():
                      if old[p]==blob:continue
                      touched.append(p)
                      put(p,blob)
                      if p==private_path:ftp.sendcmd('SITE CHMOD 600 '+p)
                  assert read(private_path)==bank_bytes
                  print('VERIFIED: isolated owner API, 100 draft questions, 1000 empty slots, button script')
              except BaseException:
                  for p in reversed(touched):
                      if old[p] is None:ftp.delete(p)
                      else:put(p,old[p])
                  raise
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  script=public(origin+'yes-no.js?v='+version)
                  assert version in live and all(after in script for before,after in pairs)
                  endpoint='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/api/numi-yesno-uncensored.php'
                  request=urllib.request.Request(endpoint,data=b'{"question":"yn-man-001","time":"12:30"}',headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'},method='POST')
                  try:
                      urllib.request.urlopen(request,timeout=20)
                      raise RuntimeError('Anonymous owner API unexpectedly allowed')
                  except urllib.error.HTTPError as error:
                      assert error.code==403 and json.load(error).get('error')=='UNCENSORED_OWNER_ONLY'
                  print('PUBLIC HTTP VERIFIED: anonymous access denied; owner-preview UI installed')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
