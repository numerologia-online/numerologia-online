name: Cloud.ru Red Flag - one manual quality test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudru-single-manual-quality-test
  cancel-in-progress: false
jobs:
  test-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Generate exactly one private draft (no retries, no publication)
        env:
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          api_key = os.environ.get("CLOUDRU_API_KEY", "")
          if not api_key:
              sys.exit("STOP: CLOUDRU_API_KEY GitHub secret is missing. No model requests made.")
          question = "Уважает женское «нет» или начинает давить?"
          system = (
              "Ты опытный нумеролог, женщина, которая говорит с женщиной живо, тепло и без лести. "
              "Это символический нумерологический разбор, не утверждение фактов о человеке. "
              "Напиши ровно два абзаца, в сумме 900–1300 знаков. "
              "Первый прямо отвечает на конкретный вопрос, с правдоподобным проявлением теневых сторон "
              "дня и месяца рождения мужчины. Не называй числа, энергии или арканы. "
              "Во втором абзаце мягко предложи изучить вопрос «Заботится или будет контролировать каждый твой шаг?». "
              "Не используй длинные тире, двоеточия, канцелярит или общие клише."
          )
          user = (
              "Вопрос: " + question + "\n"
              "Дата рождения мужчины: 09.09 (день 9 и месяц 9). "
              "Пожалуйста, только окончательный ответ без вступления."
          )
          payload = json.dumps({
              "model": "openai/gpt-oss-120b",
              "messages": [{"role": "system", "content": system}, {"role": "user", "content": user}],
              "max_tokens": 1300, "stream": False
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              "https://foundation-models.api.cloud.ru/v1/chat/completions",
              data=payload, method="POST",
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "NumerologiaSingleManualQualityTest/1.0"
              }
          )
          print("CLOUDRU_TEST: model=openai/gpt-oss-120b; maximum_requests=1; no_retry=true; max_output_tokens=1300", flush=True)
          try:
              with urllib.request.urlopen(req, timeout=75) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              sys.exit("CLOUDRU_TEST_FAILED: HTTP " + str(exc.code) + ". No retries. No site changes.")
          except Exception as exc:
              sys.exit("CLOUDRU_TEST_FAILED: " + type(exc).__name__ + ". No retries. No site changes.")
          choices = result.get("choices") or []
          answer = ((choices[0].get("message") or {}).get("content") or "") if choices else ""
          if not answer.strip():
              print("CLOUDRU_TEST: response contains no visible answer; check model support or service status.")
              sys.exit(1)
          print("=== ANSWER 09.09 START ===", flush=True)
          print(answer.strip(), flush=True)
          print("=== ANSWER 09.09 END ===", flush=True)
          usage = result.get("usage") or {}
          print("CLOUDRU_TOKEN_USAGE:", json.dumps({
              "prompt_tokens": usage.get("prompt_tokens"),
              "completion_tokens": usage.get("completion_tokens"),
              "total_tokens": usage.get("total_tokens")
          }, ensure_ascii=False), flush=True)
          print("ONE_TEST_ONLY; no automatic execution; REG.RU and paid sections untouched.")
          PY
