name: Publish rebuilt owner analytics to REG.RU
on:
  push:
    branches: [feature/analytics-v2-20261101]
    paths: [.github/workflows/numi-insights-release.yml]
permissions:
  contents: read
  checks: read
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish rebuilt analytics to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require successful MySQL and browser-code tests on exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          sha="48313ebe0069738328f04fb0883ae87d3488ef58"
          request=urllib.request.Request("https://api.github.com/repos/numerologia-online/numerologia-online/commits/"+sha+"/check-runs",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
          assert any(c["name"]=="check" and c["conclusion"]=="success" for c in data["check_runs"]), "Release source has not passed the MySQL checks"
          print("Exact release source passed integration checks")
          PY
      - uses: actions/checkout@v4
        with:
          ref: 48313ebe0069738328f04fb0883ae87d3488ef58
      - name: Back up and publish independent collector, owner dashboard, then nonblocking hooks
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u insights/deploy.py
