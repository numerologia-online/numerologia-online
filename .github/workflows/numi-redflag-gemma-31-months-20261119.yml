name: Run 7 private 31.xx Red Flag answers with local Wrangler and real Cloudflare Gemma
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-gemma-31-months-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Run real Gemma through same isolated Worker using local Wrangler AI binding
        id: qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,urllib.error,hmac,hashlib,pathlib,time,difflib,concurrent.futures,datetime
          key=os.environ.get("GROQ_API_KEY","")
          if not key.startswith("gsk_"):raise RuntimeError("OWNER_PROOF_NOT_CONFIGURED")
          proof=hmac.new(key.encode(),b"numi-moment-cloudflare-bridge-v1",hashlib.sha256).hexdigest()
          folder=pathlib.Path("private-gemma-31-redflag")
          folder.mkdir(exist_ok=True)
          title="Уважает женское «нет» или начинает давить?"
          endpoint="http://127.0.0.1:8787/v1/redflag-owner-question"
          log=folder/"wrangler-dev.log"
          env=os.environ.copy()
          env["NO_PROXY"]="localhost,127.0.0.1"
          env["no_proxy"]="localhost,127.0.0.1"
          env["WRANGLER_SEND_METRICS"]="false"
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with log.open("w",encoding="utf-8") as logfile:
              p=subprocess.Popen(["npx","--yes","wrangler@4","dev","--ip","127.0.0.1","--port","8787"],
                cwd="cloudflare/redflag-draft-ai",env=env,stdout=logfile,stderr=subprocess.STDOUT)
              try:
                  ready=False
                  for i in range(75):
                      if p.poll() is not None:break
                      try:
                          with client.open("http://127.0.0.1:8787/health",timeout=3) as r:
                              health=json.load(r)
                          if health.get("ok") and health.get("ai_bound") is True:
                              ready=True;break
                      except Exception:pass
                      time.sleep(1)
                  print("WRANGLER_LOCAL_HEALTH",ready,"process_alive",p.poll() is None,flush=True)
                  if not ready:
                      reason="LOCAL_WRANGLER_AI_BINDING_UNAVAILABLE"
                      print("WRANGLER_LOCAL_START_RESULT",reason,flush=True)
                      raise RuntimeError(reason)
                  def check(month):
                      data={"category":"flags","question_id":"say-no","title":title,
                        "day":31,"month":month,"followups":[]}
                      code=0;message="";answer=""
                      for attempt in range(3):
                          req=urllib.request.Request(endpoint,data=json.dumps(data,ensure_ascii=False).encode(),
                            method="POST",headers={"Content-Type":"application/json","Accept":"application/json",
                              "X-Numi-Moment-Proof":proof})
                          try:
                              with client.open(req,timeout=125) as res:
                                  code=res.status;result=json.load(res)
                          except urllib.error.HTTPError as err:
                              code=err.code
                              try:result=json.loads(err.read(2500))
                              except Exception:result={}
                          except Exception as err:
                              code=0;result={"error":type(err).__name__}
                          answer=result.get("answer","")
                          message=result.get("error")
                          if code==200 or code in (401,403,404,409):break
                          time.sleep((attempt+1)*4)
                      ok=(code==200 and result.get("ok") is True and
                        result.get("published") is False and result.get("draft_only") is True and
                        result.get("model")=="@cf/google/gemma-4-26b-a4b-it" and
                        result.get("date_key")=="31-"+str(month) and
                        isinstance(answer,str) and len(answer)>=380)
                      return {"date":f"31.{month:02d}","day":31,"month":month,"http":code,
                        "ok":bool(ok),"chars":len(answer),"answer":answer if ok else "",
                        "error":message}
                  with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
                      results=sorted(executor.map(check,[1,3,5,7,8,10,12]),key=lambda x:x["month"])
                  pairs=[]
                  valid=[x for x in results if x["ok"]]
                  for i,a in enumerate(valid):
                      for b in valid[i+1:]:
                          ratio=round(difflib.SequenceMatcher(None,
                            a["answer"].split("\n\n")[0],b["answer"].split("\n\n")[0]).ratio(),3)
                          if ratio>=0.75:pairs.append({"a":a["date"],"b":b["date"],"similarity":ratio})
                  for item in results:
                      print("GEMMA_LOCAL_31",item["date"],"HTTP",item["http"],
                        "OK",item["ok"],"CHARS",item["chars"],"ERROR",item["error"],flush=True)
                  (folder/"seven-valid-31st-dates.json").write_text(json.dumps({
                    "test_type":"isolated same Worker source with remote Cloudflare Workers AI binding",
                    "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    "model":"@cf/google/gemma-4-26b-a4b-it","question":title,
                    "published":False,"reg_ru_touched":False,"answers":results,
                    "high_similarity_pairs":pairs
                  },ensure_ascii=False,indent=2),encoding="utf-8")
                  print("GEMMA_LOCAL_31_SUMMARY",len(valid),"/7","HIGH_SIMILARITY_PAIRS",len(pairs),flush=True)
                  if len(valid)!=7:raise RuntimeError("GEMMA_LOCAL_31_INCOMPLETE")
              finally:
                  p.terminate()
                  try:p.wait(timeout=8)
                  except subprocess.TimeoutExpired:p.kill()
          PY
      - name: Save genuine unpublished draft comparisons or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-owner-gemma-31-valid-months
          path: private-gemma-31-redflag/seven-valid-31st-dates.json
          retention-days: 3
          if-no-files-found: warn
      - name: Record the QA outcome and direct run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.qa.outcome }}" = "success" ]; then outcome=success; else outcome=failure; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$outcome" -f context="numi/redflag-31-months-gemma-qa" \
            -f description="7 real private Gemma owner-only drafts; no site publication" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

# seven-valid-31st-dates-20261119: day 31 reduces to fourth energy, month independent
