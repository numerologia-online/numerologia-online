name: Read-only check remaining Family draft JSON after cache deletion
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-drafts-remaining-readonly-20261123.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List only counts of Family files in old cache and separate manually kept owner drafts
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,ssl,os,posixpath,re
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect("server172.hosting.reg.ru",21)
          ftp.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          folders=[
            ('FAMILY_CACHE',home+'/private/numi-account-20261031/family-answer-cache'),
            ('OWNER_SAVED_DRAFTS',home+'/private/numi-redflag-owner-kept-v1')]
          try:
            for tag,folder in folders:
              try:
                raw=ftp.nlst(folder)
              except ftplib.error_perm as e:
                if str(e).startswith('550'):
                  print(tag,'NO_DIRECTORY',flush=True)
                  continue
                raise
              names=[posixpath.basename(item.rstrip('/')) for item in raw]
              family=[n for n in names if n.lower().startswith('family__') or
                (tag=='FAMILY_CACHE' and re.fullmatch(r'(?:independent|household|vacation|plans|children|roles|home|conflict|money-at-home|care)-\d{8}-.+\.json',n))]
              jsons=[n for n in names if n.endswith('.json')]
              print(tag,'entries',len(names),'json_count',len(jsons),'family_related_json_count',len(family),flush=True)
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
