name: Restore original Matrix school safely on REG.RU
on:
  push:
    paths:
      - .github/numi-school-legacy-restore.json
permissions:
  contents: read
concurrency:
  group: reg-ru-school-owner-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish old Matrix school safely, preserve entire site'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test restored lesson, original trainer, existing owner gate and client PDF
        run: |
          node --check pro/school/school.js
          node --check pro/school/lesson/lesson.js
          node --test tests/school-legacy-restore.test.mjs tests/school-client-entry.test.mjs tests/owner-access.test.mjs
          python3 -m py_compile .github/scripts/reg-school-legacy-restore.py
          python3 -m json.tool .github/numi-school-legacy-restore.json >/dev/null
      - name: Backup, compare and restore exactly four protected Matrix school screens
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/reg-school-legacy-restore.py
