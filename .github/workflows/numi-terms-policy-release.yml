name: Publish terms of use to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-terms-policy-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish terms of use on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate dedicated terms release and file
        run: |
          python3 -m py_compile scripts/publish-terms-policy.py
          test -s terms.html
          grep -q 'href="/terms.html"' index.html
      - name: Publish only approved terms file and footer link
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/publish-terms-policy.py
