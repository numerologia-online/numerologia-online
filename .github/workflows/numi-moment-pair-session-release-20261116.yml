name: Publish isolated Moment reusable pair dates to REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-pair-session-release-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check paired dates flow and source syntax
        run: |
          set -euo pipefail
          node --check moment/moment.js
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          js=Path('moment/moment.js').read_text()
          owner=Path('moment/owner-preview.html').read_text()
          html=Path('moment/index.html').read_text()
          css=Path('moment/moment.css').read_text()
          assert 'numi-moment-pair-session-v1' in js and 'numi-moment-pair-session-v1' in owner
          assert "if(q.mode==='partner'&&!storePair())" in js
          assert 'id="moment-pair-dates"' in html
          assert 'moment-pair-20261116' in html
          assert 'ask-another-question' in owner and 'updateReturnLinks()' in owner
          assert '.moment-pair-grid' in css
          assert 'if(ownerMode)' in js and 'showComingSoon(q.title)' in js
          # The owner editor has inline JavaScript; check syntax without executing network calls.
          source=owner.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/numi-moment-owner-syntax.js').write_text(source)
          subprocess.run(['node','--check','/tmp/numi-moment-owner-syntax.js'],check=True)
          print('MOMENT_PAIR_SESSION_VALIDATED',flush=True)
          PY
      - name: Backup, deploy and verify only four Moment frontend files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,hashlib,io,os,ssl,subprocess,time,urllib.request
          from pathlib import Path
          paths=['moment/moment.js','moment/moment.css','moment/index.html','moment/owner-preview.html']
          wanted={p:Path(p).read_bytes() for p in paths}
          def sha(b):return hashlib.sha256(b).hexdigest()
          accepted={}
          for p in paths:
            history=subprocess.check_output(['git','log','--format=%H','-n','150','--',p],text=True).splitlines()
            accepted[p]={sha(subprocess.check_output(['git','show',rev+':'+p])) for rev in history}
            accepted[p].add(sha(wanted[p]))
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
            b=io.BytesIO();ftp.retrbinary('RETR '+root+path,b.write)
            return b.getvalue()
          def put(path,data):
            ftp.storbinary('STOR '+root+path,io.BytesIO(data))
            if sha(read(path))!=sha(data):raise RuntimeError('FTP_VERIFY_FAILED '+path)
          def public(path):
            url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'+path+'?pair_check='+str(time.time_ns())
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NumiMomentPairPublisher'})
            with urllib.request.urlopen(req,timeout=35) as response:return response.read(350000)
          touched=[]
          try:
            old={p:read(p) for p in paths}
            for p in paths:
              if sha(old[p]) not in accepted[p]:raise RuntimeError('UNEXPECTED_SERVER_VERSION '+p)
            backup=home+'/site-safeguard-backups/moment-pair-'+time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
            ftp.mkd(backup)
            for p in paths:
              dest=backup+'/'+p.replace('/','__')+'.bak'
              ftp.storbinary('STOR '+dest,io.BytesIO(old[p]))
              b=io.BytesIO();ftp.retrbinary('RETR '+dest,b.write)
              if b.getvalue()!=old[p]:raise RuntimeError('BACKUP_FAILED '+p)
            for p in paths:
              if read(p)!=old[p]:raise RuntimeError('CONCURRENT_CHANGE '+p)
              if sha(old[p])!=sha(wanted[p]):
                touched.append(p);put(p,wanted[p])
            for p in paths:
              if sha(public(p))!=sha(wanted[p]):raise RuntimeError('PUBLIC_VERIFY_FAILED '+p)
            print('MOMENT_PAIR_SESSION_RELEASE_SUCCESS files='+','.join(paths),flush=True)
          except BaseException:
            for p in reversed(touched):
              try:put(p,old[p])
              except BaseException:print('MOMENT_PAIR_ROLLBACK_FAILED '+p,flush=True)
            print('MOMENT_PAIR_RELEASE_ROLLBACK_ATTEMPTED',flush=True)
            raise
          finally:
            try:ftp.quit()
            except BaseException:ftp.close()
          PY
