name: Publish numerology moment yes-no question catalog to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-yes-no-catalog-release.yml
permissions:
  contents: read
concurrency:
  group: numi-yes-no-catalog-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish yes-no question catalog to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate 100 unique questions and published scripts
        run: |
          python3 -m py_compile moment/deploy-yes-no-catalog.py
          node --check moment/yes-no/yes-no.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('moment/yes-no/questions.json').read_text(encoding='utf-8'))
          assert len(data['categories']) == 7
          assert len(data['questions']) == 100
          assert len({x['title'] for x in data['questions']}) == 100
          assert len({x['id'] for x in data['questions']}) == 100
          for cat in data['categories']:
              assert sum(x['category'] == cat['id'] for x in data['questions']) == cat['count']
          print('Validated 100 unique yes/no questions across seven topics')
          PY
      - name: Deploy isolated yes/no section, backup and verify public files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u moment/deploy-yes-no-catalog.py
