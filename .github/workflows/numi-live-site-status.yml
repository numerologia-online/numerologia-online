name: Live production domain reachability diagnosis
on:
  push:
    paths:
      - .github/workflows/numi-live-site-status.yml
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live REG.RU HTTP and Pages without changing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import socket,json,urllib.request,urllib.error,ssl,os,subprocess
          urls={
           'domain_home':'https://xn--c1adkkdfjbp1a4l.online/',
           'domain_index':'https://xn--c1adkkdfjbp1a4l.online/index.html',
           'domain_script':'https://xn--c1adkkdfjbp1a4l.online/app.js',
           'domain_health':'https://xn--c1adkkdfjbp1a4l.online/api/numi-content-health.php',
           'github_pages':'https://numerologia-online.github.io/numerologia-online/'
          }
          try: print('DNS REG',socket.gethostbyname('xn--c1adkkdfjbp1a4l.online'),flush=True)
          except Exception as e:print('DNS REG ERROR',type(e).__name__,str(e)[:110],flush=True)
          for name,url in urls.items():
           req=urllib.request.Request(url,headers={'User-Agent':'numi-readonly-website-health/1.0','Cache-Control':'no-cache'})
           try:r=urllib.request.urlopen(req,timeout=12)
           except urllib.error.HTTPError as e:r=e
           except Exception as e:
            print(name,'ERROR',type(e).__name__,str(e)[:150],flush=True);continue
           with r:
            body=r.read(500)
            print(name,'HTTP',r.status,'bytes_at_least',len(body),'content_type',r.headers.get('Content-Type'),'head',repr(body[:70]),flush=True)
          PY
