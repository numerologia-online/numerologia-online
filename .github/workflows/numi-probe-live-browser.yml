name: Probe live REG.RU section buttons
on:
  push:
    paths:
      - .github/workflows/numi-probe-live-browser.yml
permissions:
  contents: write
concurrency:
  group: reg-ru-browser-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Test section buttons on production without submitting forms
        run: node scripts/probe-live-browser.cjs
      - name: Save safe public result summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-browser.json
          if ! git diff --cached --quiet; then
            git commit -m "Record production browser smoke test"
            git push
          fi
