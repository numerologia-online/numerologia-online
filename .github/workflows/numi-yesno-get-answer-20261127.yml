name: Publish Yes/No get answer label only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-get-answer-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch only main button label and font
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          html_path='moment/yes-no/index.html'
          css_path='moment/yes-no/yes-no.css'
          js_path='moment/yes-no/yes-no.js'
          version='get-answer-20261127'
          old_button="<button type=\"submit\" id=\"yn-submit\" class=\"yn-confirm-time\">Задать вопрос</button>"
          new_button="<button type=\"submit\" id=\"yn-submit\" class=\"yn-confirm-time\">Получить ответ</button>"
          old_rule=".yn-confirm-time{display:block;width:calc(100% - 16px);min-height:48px;margin:0 auto;box-sizing:border-box;padding:9px;border:0;border-radius:8px;background:#214b39;color:#fffefa;font:650 15px/1.3 system-ui,sans-serif;cursor:pointer}"
          new_rule=".yn-confirm-time{display:block;width:calc(100% - 16px);min-height:48px;margin:0 auto;box-sizing:border-box;padding:9px;border:0;border-radius:8px;background:#214b39;color:#fffefa;font:700 20px/1.2 system-ui,sans-serif;cursor:pointer}"
          old_label='submit.textContent = "Задать вопрос"'
          new_label='submit.textContent = "Получить ответ"'
          assert new_button in pathlib.Path(html_path).read_text(encoding='utf-8')
          assert new_rule in pathlib.Path(css_path).read_text(encoding='utf-8')
          assert pathlib.Path(js_path).read_text(encoding='utf-8').count(new_label)==2
          def replace_checked(current,before,after,n=1):
              assert current.count(before)+current.count(after)==n,'Unexpected live text'
              return current.replace(before,after)
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+path,b.write)
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert b'account-browser.js' in read(root+'index.html')
              old={};new={}
              for path in (css_path,js_path,html_path):
                  old[path]=read(root+path)
                  current=old[path].decode('utf-8')
                  if path==css_path:
                      current=replace_checked(current,old_rule,new_rule)
                  elif path==js_path:
                      current=replace_checked(current,old_label,new_label,2)
                  else:
                      current=replace_checked(current,old_button,new_button)
                      for ext in ('css','js'):
                          current,n=re.subn(r'\./yes-no\.'+ext+r'\?v=[a-zA-Z0-9_-]+','./yes-no.'+ext+'?v='+version,current)
                          assert n==1,'Unexpected asset link '+ext
                  new[path]=current.encode('utf-8')
              with tempfile.TemporaryDirectory() as tmp:
                  jscheck=pathlib.Path(tmp)/'yes-no.js'
                  jscheck.write_bytes(new[js_path])
                  subprocess.run(['node','--check',str(jscheck)],check=True)
              backup=home+'/site-safeguard-backups'
              try:ftp.mkd(backup)
              except ftplib.error_perm:pass
              for path,data in old.items():
                  put(backup+'/get-answer-'+os.environ['GITHUB_RUN_ID']+'-'+path.rsplit('/',1)[1],data)
              uploaded=[]
              try:
                  for path,data in new.items():
                      uploaded.append(path)
                      put(root+path,data)
                      print('PUBLISHED AND VERIFIED',path)
              except BaseException:
                  for path in reversed(uploaded):put(root+path,old[path])
                  raise
              print('SUCCESS: main button label and font only')
          finally:ftp.quit()
          import urllib.request
          origin='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/moment/yes-no/'
          def public(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
          for attempt in range(3):
              try:
                  live=public(origin+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt))
                  style=public(origin+'yes-no.css?v='+version)
                  script=public(origin+'yes-no.js?v='+version)
                  assert new_button in live and new_rule in style and script.count(new_label)==2
                  print('PUBLIC HTTP VERIFIED: main button label and font')
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(3)
          PY
