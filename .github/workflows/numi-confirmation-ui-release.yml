name: Release account password confirmation to REG.RU safely
on:
  push:
    paths:
      - .github/workflows/numi-confirmation-ui-release.yml
permissions:
  contents: read
concurrency:
  group: numi-confirmation-ui-20261031
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish confirmation-ready registration UI on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact frontend source and deployment syntax
        run: |
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-confirmation-ui.py
      - name: Back up and publish only account JS and homepage version tag
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-confirmation-ui.py
