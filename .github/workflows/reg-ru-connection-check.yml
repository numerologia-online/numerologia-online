name: REG.RU connection and website check (read-only)

on:
  push:
    paths:
      - .github/workflows/reg-ru-connection-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public site code for comparison
        uses: actions/checkout@v4

      - name: Check live domain and read-only secure FTP access
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, hashlib, os, re, socket, ssl, urllib.request
          from urllib.parse import urlparse

          expected = "xn--c1adkkdfjbp1a4l.online"
          current = open("auth-profile.js", "rb").read()
          local_hash = hashlib.sha256(current).hexdigest()
          print("SITE: read-only HTTPS inspection")
          for url in ("https://" + expected + "/", "https://" + expected + "/auth-profile.js"):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Site-Deployment-ReadOnly-Check/1.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      final = urlparse(response.geturl())
                      print("HTTP:", "home" if url.endswith("/") else "auth-profile.js",
                            "status", response.status,
                            "final host", final.hostname, "path", final.path)
                      if url.endswith("auth-profile.js"):
                          data = response.read(256000)
                          if len(data) < 256000:
                              print("PUBLIC JS equals GitHub fix:", hashlib.sha256(data).hexdigest() == local_hash)
                          else:
                              print("PUBLIC JS too large to compare safely")
              except Exception as exc:
                  print("HTTP inspection failed:", type(exc).__name__)

          host = os.getenv("REG_FTP_HOST", "").strip()
          user = os.getenv("REG_FTP_USER", "").strip()
          password = os.getenv("REG_FTP_PASSWORD", "")
          if not (host and user and password):
              raise SystemExit("FTP: one or more repository secrets missing")

          # Never send credentials over unencrypted FTP or on a TLS mismatch.
          try:
              socket.inet_aton(host)
              ptr = socket.gethostbyaddr(host)[0].rstrip(".").lower()
              if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru", ptr):
                  raise RuntimeError("FTP hostname is not a REG.RU hosting name")
              resolved = {x[4][0] for x in socket.getaddrinfo(ptr, 21, type=socket.SOCK_STREAM)}
              if host not in resolved:
                  raise RuntimeError("FTP forward/reverse DNS do not match")
              tls_host = ptr
          except Exception as exc:
              print("SECURE FTP: hostname verification unavailable:", type(exc).__name__)
              raise SystemExit(1)

          ftps = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=15)
          try:
              ftps.connect(tls_host, 21)
              ftps.auth()
              ftps.login(user, password)
              ftps.prot_p()
              ftps.set_pasv(True)
              print("SECURE FTP: login succeeded over verified TLS")

              root = ftps.pwd()
              roots = [".", "www", "www/" + expected,
                       expected, "public_html", "httpdocs",
                       "domains/" + expected + "/public_html"]
              found = []
              for candidate in roots:
                  try:
                      ftps.cwd(root)
                      ftps.cwd(candidate)
                      names = [name.rsplit("/", 1)[-1] for name in ftps.nlst()]
                      if "index.html" not in names:
                          continue
                      if "auth-profile.js" in names:
                          chunks = []
                          size = 0
                          def sink(chunk):
                              global size
                              size += len(chunk)
                              if size > 256000:
                                  raise RuntimeError("Unexpectedly large JS file")
                              chunks.append(chunk)
                          ftps.retrbinary("RETR auth-profile.js", sink)
                          equal = hashlib.sha256(b"".join(chunks)).hexdigest() == local_hash
                          print("FTP SITE CANDIDATE:", candidate, "index.html exists;",
                                "auth-profile.js matches GitHub fix:", equal)
                      else:
                          print("FTP SITE CANDIDATE:", candidate,
                                "index.html exists; auth-profile.js missing")
                      found.append(candidate)
                  except Exception:
                      continue
              print("FTP matching candidate directories:", len(found))
              if not found:
                  raise SystemExit("Could not safely locate website root. No files changed.")
          except Exception as exc:
              print("SECURE FTP CHECK FAILED:", type(exc).__name__)
              raise SystemExit(1)
          finally:
              try:
                  ftps.quit()
              except Exception:
                  ftps.close()
          PY
      - name: Read-only Red Flag cached modules and public response
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,hashlib,io,os,json,re,urllib.request,time
          names=['redflag-public-catalog.js','redflag-text-bank.js','redflag-categories.js','redflag-feature.js','app.js','index.html']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          root=ftp.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(n):
            b=io.BytesIO()
            ftp.retrbinary('RETR '+root+n,b.write)
            if b.tell()>250000:raise RuntimeError('Too large: '+n)
            return b.getvalue()
          try:
            for n in names:
              data=read(n);s=data.decode('utf-8','replace')
              refs=[line.strip()[:220] for line in s.splitlines() if any((dep+'.js?v=') in line for dep in ('redflag-public-catalog','redflag-text-bank','redflag-categories','redflag-feature','app'))][:12]
              print('RF_LIVE_MODULE',json.dumps({'file':n,'sha256':hashlib.sha256(data).hexdigest(),'old': 'Качели, контроль, давление и границы' in s,'new':'Где забота, а где контроль и манипуляции?' in s,'dependencies':refs[:12]},ensure_ascii=False),flush=True)
          finally:
            ftp.quit()
          for host in ('xn--c1adkkdfjbp1a4l.online','xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'):
            for n in ('redflag-public-catalog.js','index.html'):
              try:
                req=urllib.request.Request('https://'+host+'/'+n+'?numi_verify=20261107a',headers={'Cache-Control':'no-cache','User-Agent':'NUMI-readonly-audit'})
                with urllib.request.urlopen(req,timeout=12) as res:
                  body=res.read(200000).decode('utf-8','replace')
                  print('RF_LIVE_HTTP',json.dumps({'host':host,'file':n,'status':res.status,'old':'Качели, контроль, давление и границы' in body,'new':'Где забота, а где контроль и манипуляции?' in body,'cache_control':res.headers.get('Cache-Control')},ensure_ascii=False),flush=True)
              except Exception as exc: print('RF_LIVE_HTTP_ERROR',host,n,type(exc).__name__,flush=True)
          PY
