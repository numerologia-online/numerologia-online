name: Publish approved Red Flag July JSON to protected REG.RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-approved-json-20261110.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish complete 366-date comic verdict JSON to REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected content publisher and approved JSON diff
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-redflag-approved-json-20261110.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('publisher',Path('scripts/deploy-redflag-approved-json-20261110.py'))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate()
          PY
      - name: Back up and publish only protected JSON and integrity manifest
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/deploy-redflag-approved-json-20261110.py
