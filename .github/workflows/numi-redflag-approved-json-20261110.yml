          def put(path,raw):
              ftp.storbinary('STOR '+path,io.BytesIO(raw))
              if read(path)!=raw:raise RuntimeError('Read-back mismatch '+path)
          touched=[];remote={}
          try:
              remote={path:read(targets[path]) for path in paths+[manifest]}
              if all(remote[path]==after[path] for path in remote):
                  print('REG_RU_APR27_MAY1_ALREADY_SYNCED',flush=True)
