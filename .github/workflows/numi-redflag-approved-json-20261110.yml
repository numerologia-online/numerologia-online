          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==BASE, 'Unexpected parent commit'
          before={path:previous(path) for path in paths+[manifest]}
          after={path:pathlib.Path(path).read_bytes() for path in paths+[manifest]}
          old_manifest=json.loads(before[manifest])
          new_manifest=json.loads(after[manifest])
          changed=set(subprocess.check_output(['git','diff','--name-only',BASE,'HEAD'],text=True).splitlines())
          assert changed==set(paths+[manifest,'.github/workflows/numi-redflag-approved-json-20261110.yml']), 'Unexpected changed paths'
          for name,path in zip(names,paths):
              old=json.loads(before[path]);new=json.loads(after[path])
              assert old['questionId']==new['questionId']==name, 'Question bank changed'
              assert old['status']==new['status']=='draft', 'Publishing status changed'
              assert len(old['entries'])==116 and len(new['entries'])==121, 'Incorrect date count'
              assert set(new['entries'])==set(old['entries'])|set(dates), 'Unexpected dates changed'
              assert all(new['entries'][k]==v for k,v in old['entries'].items()), 'Existing texts overwritten'
              assert all(isinstance(new['entries'][key],str) and
                         new['entries'][key].count(chr(10)*2)==1 and
                         len(new['entries'][key])>=1000 and
                         '—' not in new['entries'][key] for key in dates), 'Invalid new reading'
              assert {k:v for k,v in old.items() if k!='entries'}=={k:v for k,v in new.items() if k!='entries'}, 'Bank metadata modified'
              assert old_manifest['files'][path]==sha(before[path]), 'Old manifest differs from source'
              assert new_manifest['files'][path]==sha(after[path]), 'New manifest hash mismatch'
          expected=json.loads(before[manifest])
          for path in paths:expected['files'][path]=sha(after[path])
          assert expected==new_manifest, 'Unrelated assets in manifest modified'
          assert os.environ.get('REG_FTP_USER') and os.environ.get('REG_FTP_PASSWORD'), 'REG.RU credentials unavailable'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
