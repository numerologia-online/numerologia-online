        run: |
          python3 -u - <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, ssl, subprocess, time
          BASE='d77b80e98583f5b93ad2c699642ea2d70abc99dc'
          names=['romance','relationship-or-comfort','adult-partner','near-him',
                 'hard-moment','relationship-format','family-or-triangle',
