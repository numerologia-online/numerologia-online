name: Activate 366-date comic verdict using existing Red Flag wallet
# Publish the already-reviewed comic verdict using the existing guarded REG.RU release; no new products.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-approved-json-20261110.yml
      - 'data/redflag/love/*.json'
      - account-service/private/store-assets.json
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish ready 366-date comic verdict on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing 366 answers, generated catalog, prices, and PHP material
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-redflag-approved-json-20261110.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('publisher',Path('scripts/deploy-redflag-approved-json-20261110.py'))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate()
          PY
          python3 scripts/build-store-catalog.py
          python3 scripts/build-store-assets.py
          git diff --exit-code -- store-catalog.json redflag-public-catalog.js account-service/private/redflag-catalog.json account-service/private/store-assets.json
          node --test tests/redflag-calendar-coverage.test.mjs
          for file in redflag-public-catalog.js redflag-text-bank.js redflag-categories.js redflag-feature.js app.js; do
            node --input-type=module --check < "$file"
          done
          php -l account-service/private/core.php
          php -l account-service/private/store.php
          php -l account-service/private/fulfillment.php
          php account-service/tests/store.php
          php -r '
            require "account-service/private/core.php";
            require "account-service/private/fulfillment.php";
            foreach (["1986-09-09", "2000-02-29", "2000-12-31"] as $date) {
              $m=naMaterialBuild("redflag_question", "redflag:money:comic-verdict-money:".$date, getcwd());
              $body=$m["sections"][0]["paragraphs"][0]??"";
              if (($m["title"]??"")!=="😂 Шуточный вердикт" || count($m["sections"]??[])!==1
                  || !is_string($body) || strlen($body)<200
                  || ($date==="2000-12-31" && !str_contains($body, "\n\n")))
                throw new RuntimeException("COMIC_MATERIAL_DATE_NOT_READY:".$date);
            }
            echo "COMIC_MATERIAL_READY_THREE_DATES\n";
          '
          echo EXISTING_REDFLAG_PAYMENT_READY_NO_NEW_PRODUCT
      - name: Back up and publish only verified existing files on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/deploy-redflag-approved-json-20261110.py

  sync_love_jan1:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Sync nine approved Love January 1 texts to REG.RU private bank'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Safely sync nine approved JSON answers to existing REG.RU private storage
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, ssl, subprocess, urllib.request, urllib.error
          repo_root=pathlib.Path.cwd()
          before='f9b65a4fb981fda6b6d775bf5dc7805a7a9f5048'
          content_commit='119a838539f3336288e29a2bd8541ddc6cecf387'
          names=['romance','relationship-or-comfort','adult-partner','near-him',
                 'hard-moment','relationship-format','family-or-triangle',
                 'honest-or-disappear','love-or-attention']
          files=['data/redflag/love/'+id+'.json' for id in names]
          manifest='account-service/private/store-assets.json'
          workflow='.github/workflows/numi-redflag-approved-json-20261110.yml'
          sha=lambda v: hashlib.sha256(v).hexdigest()
          def old_git(commit,path):
              return subprocess.check_output(['git','show',commit+':'+path],timeout=35)
          def changed(a,b):
              return set(subprocess.check_output(['git','diff','--name-only',a,b],timeout=35).decode().splitlines())
          if changed(before,content_commit)!=set(files):
              raise RuntimeError('UNEXPECTED_REVIEWED_CONTENT_DIFF')
          if changed(content_commit,'HEAD')!={manifest,workflow}:
              raise RuntimeError('UNRELATED_RELEASE_CHANGES')
          old_manifest_raw=old_git(content_commit,manifest)
          new_manifest_raw=pathlib.Path(manifest).read_bytes()
          old_manifest=json.loads(old_manifest_raw)
          new_manifest=json.loads(new_manifest_raw)
          if old_manifest.get('version')!=2 or new_manifest.get('version')!=2:
              raise RuntimeError('INVALID_STORE_MANIFEST')
          expected=json.loads(old_manifest_raw)
          old_bytes={}
          new_bytes={}
          for name,id in zip(files,names):
              previous=old_git(before,name)
              approved=pathlib.Path(name).read_bytes()
              a=json.loads(previous)
              b=json.loads(approved)
              if a.get('questionId')!=id or b.get('questionId')!=id or a.get('status')!='draft' or b.get('status')!='draft':
                  raise RuntimeError('WRONG_BANK_OR_READY_STATUS:'+id)
              if a.get('section')!='love' or b.get('section')!='love' or a.get('keyRule')!='day-month' or b.get('keyRule')!='day-month':
                  raise RuntimeError('INVALID_BANK_SCHEMA:'+id)
              if set(a.get('entries',{}))!=set(b.get('entries',{})) or len(b['entries'])!=36:
                  raise RuntimeError('DATE_ENTRIES_CHANGED:'+id)
              for date in a['entries']:
                  if date!='1-1' and a['entries'][date]!=b['entries'][date]:
                      raise RuntimeError('UNAPPROVED_DATE_CHANGED:'+id+':'+date)
              probe=dict(a)
              probe['entries']=dict(a['entries'])
              probe['entries']['1-1']=b['entries']['1-1']
              if probe!=b or len(b['entries']['1-1'].split('\n\n'))!=2:
                  raise RuntimeError('OTHER_METADATA_CHANGED:'+id)
              if sha(previous)!=old_manifest['files'].get(name):
                  raise RuntimeError('OLD_ASSET_HASH_MISMATCH:'+id)
              expected['files'][name]=sha(approved)
              old_bytes[name]=previous
              new_bytes[name]=approved
          if expected!=new_manifest:
              raise RuntimeError('UNRELATED_MANIFEST_CHANGE')
          old_bytes[manifest]=old_manifest_raw
          new_bytes[manifest]=new_manifest_raw
          if not os.environ.get('REG_FTP_USER') or not os.environ.get('REG_FTP_PASSWORD'):
              raise RuntimeError('REG_RU_CREDENTIALS_UNAVAILABLE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          def read(path):
              output=io.BytesIO()
              def receive(chunk):
                  if output.tell()+len(chunk)>900000:
                      raise RuntimeError('REMOTE_FILE_EXCEEDS_LIMIT')
                  output.write(chunk)
              ftp.retrbinary('RETR '+path,receive)
              return output.getvalue()
          def write(path,raw):
              ftp.storbinary('STOR '+path,io.BytesIO(raw))
              if read(path)!=raw:
                  raise RuntimeError('READBACK_MISMATCH:'+path.rsplit('/',1)[-1])
          home=ftp.pwd().rstrip('/')
          protected=home+'/private/numi-account-20261031'
          ftp.cwd(protected)
          ftp.cwd(protected+'/store-content/data/redflag/love')
          targets={path:protected+'/store-content/'+path for path in files}
          targets[manifest]=protected+'/store-assets.json'
          touched=[]
          try:
              live={name:read(targets[name]) for name in [*files,manifest]}
              if all(live[name]==new_bytes[name] for name in live):
                  print('LOVE_JAN1_PRIVATE_ALREADY_SYNCED_VERIFIED',flush=True)
              elif all(live[name]==old_bytes[name] for name in live):
                  backup_root=home+'/site-safeguard-backups'
                  ftp.cwd(backup_root)
                  folder=backup_root+'/redflag-love-jan1-'+os.environ.get('GITHUB_RUN_ID','manual')
                  ftp.mkd(folder)
                  for i,name in enumerate([*files,manifest]):
                      write(folder+'/'+str(i).zfill(2)+'-'+name.rsplit('/',1)[-1]+'.before',live[name])
                  print('LOVE_JAN1_BACKUPS_VERIFIED 10 existing private files',flush=True)
                  try:
                      for name in [*files,manifest]:
                          if read(targets[name])!=live[name]:
                              raise RuntimeError('CONCURRENT_SERVER_EDIT:'+name)
                          touched.append(name)
                          write(targets[name],new_bytes[name])
                          print('LOVE_JAN1_PRIVATE_READBACK_VERIFIED',name,flush=True)
                  except BaseException:
                      for name in reversed(touched):
                          try:
                              write(targets[name],live[name])
                              print('LOVE_JAN1_ROLLBACK_OK',name,flush=True)
                          except BaseException:
                              print('LOVE_JAN1_ROLLBACK_FAILED',name,flush=True)
                      raise
              else:
                  raise RuntimeError('UNEXPECTED_SERVER_BASELINE_REFUSE_TO_OVERWRITE')
              for name in [*files,manifest]:
                  if read(targets[name])!=new_bytes[name]:
                      raise RuntimeError('FINAL_PRIVATE_INTEGRITY_FAILED:'+name)
              for id in names:
                  url='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/data/redflag/love/'+id+'.json'
                  req=urllib.request.Request(url,method='HEAD',headers={'Cache-Control':'no-store'})
                  try:
                      with urllib.request.urlopen(req,timeout=18) as response:
                          status=response.status
                  except urllib.error.HTTPError as error:
                      status=error.code
                  if status not in (401,403,404):
                      raise RuntimeError('PRIVATE_JSON_EXPOSED_OR_UNKNOWN_HTTP_STATUS:'+id+':'+str(status))
              print('LOVE_JAN1_PRIVATE_SYNC_SUCCESS nine approved texts; statuses draft; no public files or payments changed',flush=True)
          finally:
              try: ftp.quit()
              except BaseException: ftp.close()
          PY

  sync_approved_love_date:
    if: github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'Sync approved Love date ') || startsWith(github.event.head_commit.message, 'Sync approved Love dates '))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate date-only JSON changes; back up and sync REG.RU private bank
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, re, ssl, subprocess
          names=['romance','relationship-or-comfort','adult-partner',
                 'near-him','hard-moment','relationship-format','family-or-triangle',
                 'honest-or-disappear','love-or-attention']
          files=['data/redflag/love/'+n+'.json' for n in names]
          manifest_path='account-service/private/store-assets.json'
          workflow_path='.github/workflows/numi-redflag-approved-json-20261110.yml'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def git(*args):
              return subprocess.check_output(['git',*args],timeout=35)
          message=git('log','-1','--pretty=%s').decode().strip()
          pattern=r'([1-9]|[12][0-9]|3[01])-([1-9]|1[0-2])'
          single=re.fullmatch(r'Sync approved Love date '+pattern+r' to REG.RU private bank',message)
          batch=re.fullmatch(r'Sync approved Love dates '+pattern+r' through '+pattern+r' to REG.RU private bank',message)
          if single:
              date_keys={single[1]+'-'+single[2]}
          elif batch:
              first_day,first_month,last_day,last_month=map(int,batch.groups())
              if first_month!=last_month or last_day-first_day!=4:
                  raise RuntimeError('INVALID_FIVE_DATE_RANGE')
              date_keys={str(day)+'-'+str(first_month) for day in range(first_day,last_day+1)}
          else:
              raise RuntimeError('UNAPPROVED_RELEASE_MESSAGE')
          date_label='_'.join(sorted(date_keys,key=lambda s:int(s.split('-')[0])))
          actual_changes=set(git('diff','--name-only','HEAD^','HEAD').decode().splitlines())
          allowed=set(files)|{manifest_path}
          if actual_changes not in (allowed,allowed|{workflow_path}):
              raise RuntimeError('RELEASE_CONTAINS_UNRELATED_CHANGES')
          def old(name):return git('show','HEAD^:'+name)
          previous_manifest_raw=old(manifest_path)
          current_manifest_raw=pathlib.Path(manifest_path).read_bytes()
          previous_manifest=json.loads(previous_manifest_raw)
          current_manifest=json.loads(current_manifest_raw)
          if previous_manifest.get('version')!=2 or current_manifest.get('version')!=2:
              raise RuntimeError('STORE_ASSET_MANIFEST_VERSION')
          expected=json.loads(previous_manifest_raw)
          originals={}
          replacements={}
          for name,id in zip(files,names):
              before=old(name)
              after=pathlib.Path(name).read_bytes()
              original=json.loads(before)
              approved=json.loads(after)
              if original.get('section')!='love' or approved.get('section')!='love':
                  raise RuntimeError('WRONG_SECTION:'+id)
              if original.get('questionId')!=id or approved.get('questionId')!=id:
                  raise RuntimeError('WRONG_QUESTION:'+id)
              if original.get('status')!='draft' or approved.get('status')!='draft':
                  raise RuntimeError('APPROVAL_STATUS_MUST_STAY_DRAFT:'+id)
              if original.get('keyRule')!='day-month' or approved.get('keyRule')!='day-month':
                  raise RuntimeError('WRONG_KEY_RULE:'+id)
              if len(original.get('entries',{}))!=36 or set(original['entries'])!=set(approved.get('entries',{})):
                  raise RuntimeError('DATES_IN_BANK_CHANGED:'+id)
              for other in original['entries']:
                  if other not in date_keys and original['entries'][other]!=approved['entries'][other]:
                      raise RuntimeError('UNAPPROVED_DATE_CHANGED:'+id+':'+other)
              probe=dict(original)
              probe['entries']=dict(original['entries'])
              for date_key in date_keys:
                  answer=approved['entries'].get(date_key)
                  if (not isinstance(answer,str) or len(answer.split('\n\n'))!=2
                      or len(answer)<700 or '—' in answer
                      or original['entries'][date_key]==answer):
                      raise RuntimeError('INVALID_APPROVED_ANSWER:'+id+':'+date_key)
                  probe['entries'][date_key]=answer
              if probe!=approved:
                  raise RuntimeError('INVALID_DATE_ONLY_EDIT:'+id)
              if previous_manifest['files'].get(name)!=sha(before):
                  raise RuntimeError('PREVIOUS_MANIFEST_MISMATCH:'+id)
              expected['files'][name]=sha(after)
              originals[name]=before
              replacements[name]=after
          if current_manifest!=expected:
              raise RuntimeError('UNRELATED_MANIFEST_CHANGE')
          originals[manifest_path]=previous_manifest_raw
          replacements[manifest_path]=current_manifest_raw
          if not (os.environ.get('REG_FTP_USER') and os.environ.get('REG_FTP_PASSWORD')):
              raise RuntimeError('REG_RU_SECRETS_MISSING')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          def read(remote):
              buf=io.BytesIO()
              def collect(chunk):
                  if buf.tell()+len(chunk)>900000:
                      raise RuntimeError('UNEXPECTEDLY_LARGE_REMOTE_FILE')
                  buf.write(chunk)
              ftp.retrbinary('RETR '+remote,collect)
              return buf.getvalue()
          def write(remote,value):
              ftp.storbinary('STOR '+remote,io.BytesIO(value))
              if read(remote)!=value:raise RuntimeError('REMOTE_READBACK_MISMATCH')
          home=ftp.pwd().rstrip('/')
          protected=home+'/private/numi-account-20261031'
          targets={name:protected+'/store-content/'+name for name in files}
          targets[manifest_path]=protected+'/store-assets.json'
          ftp.cwd(protected+'/store-content/data/redflag/love')
          changed=[]
          try:
              live={name:read(targets[name]) for name in [*files,manifest_path]}
              if all(live[n]==replacements[n] for n in live):
                  print('LOVE_PRIVATE_DATE_ALREADY_SYNCED_VERIFIED',date_label,flush=True)
              elif all(live[n]==originals[n] for n in live):
                  backup_root=home+'/site-safeguard-backups'
                  ftp.cwd(backup_root)
                  backup=backup_root+'/redflag-love-'+date_label+'-'+os.environ['GITHUB_RUN_ID']
                  ftp.mkd(backup)
                  for i,name in enumerate([*files,manifest_path]):
                      write(backup+'/'+str(i).zfill(2)+'-'+name.rsplit('/',1)[-1]+'.before',live[name])
                  print('LOVE_PRIVATE_DATE_BACKUPS_VERIFIED',date_label,'10 files',flush=True)
                  try:
                      for name in [*files,manifest_path]:
                          if read(targets[name])!=live[name]:
                              raise RuntimeError('SERVER_CHANGED_DURING_UPLOAD')
                          changed.append(name)
                          write(targets[name],replacements[name])
                          print('LOVE_PRIVATE_DATE_FILE_READBACK_VERIFIED',name,flush=True)
                  except BaseException:
                      for name in reversed(changed):
                          try:
                              write(targets[name],live[name])
                              print('LOVE_PRIVATE_DATE_ROLLBACK_OK',name,flush=True)
                          except BaseException:
                              print('LOVE_PRIVATE_DATE_ROLLBACK_FAILED',name,flush=True)
                      raise
              else:
                  raise RuntimeError('SERVER_BASELINE_MISMATCH_NO_OVERWRITE')
              for name in [*files,manifest_path]:
                  if read(targets[name])!=replacements[name]:
                      raise RuntimeError('FINAL_PRIVATE_READBACK_MISMATCH')
              print('LOVE_PRIVATE_DATE_SYNC_SUCCESS',date_label,'9 approved JSON banks; status draft; no public files, prices or payments changed',flush=True)
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
