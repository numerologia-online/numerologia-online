                          raise RuntimeError('REG_RU_PRIVATE_BASELINE_DRIFT_REFUSE:'+path)
                  backup=home+'/site-safeguard-backups/love-apr27-may1-'+str(int(time.time()))
                  ftp.mkd(backup)
                  for idx,path in enumerate(paths+[manifest]):
                      put(backup+'/'+str(idx)+'-'+path.rsplit('/',1)[-1]+'.bak',remote[path])
                  print('REG_RU_APR27_MAY1_BACKUP_ALL_TEN_VERIFIED',flush=True)
                  try:
                      for path in paths+[manifest]:
                          if read(targets[path])!=before[path]:
                              raise RuntimeError('Concurrent remote edit:'+path)
                          touched.append(path)
                          put(targets[path],after[path])
                          print('REG_RU_APR27_MAY1_READBACK_OK',path,flush=True)
                  except BaseException:
                      for path in reversed(touched):
                          try:put(targets[path],remote[path]);print('ROLLBACK_OK',path,flush=True)
                          except BaseException:print('ROLLBACK_FAILED',path,flush=True)
                      raise
              for path in paths+[manifest]:
                  if read(targets[path])!=after[path]:
                      raise RuntimeError('FINAL_PRIVATE_VERIFICATION_FAILED:'+path)
