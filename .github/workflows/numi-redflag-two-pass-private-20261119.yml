name: Private Red Flag two-pass editorial prototype
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-two-pass-private-20261119.yml
      - .github/scripts/redflag-two-pass-private-qa-20261119.py
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Verify and run two-pass model with real Workers AI binding
        id: qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -m py_compile .github/scripts/redflag-two-pass-private-qa-20261119.py
          python3 .github/scripts/redflag-two-pass-private-qa-20261119.py
      - name: Save private prototype answers for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-redflag-two-pass-six-cases
          path: private-redflag-two-pass-answers/six-dates.json
          retention-days: 3
          if-no-files-found: warn
      - name: Mark result for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.qa.outcome }}" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}"             -f state="$state" -f context="numi/redflag-two-pass-editorial-qa"             -f description="Private two-pass Red Flag editorial test only"             -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
