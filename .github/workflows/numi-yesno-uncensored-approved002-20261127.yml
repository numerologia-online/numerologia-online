name: Publish approved second question in owner-only preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/numi-yesno-uncensored-approved002-20261127.yml']
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update only private answer bank; require existing owner-only API
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import json,os,ssl,ftplib,socket,re,io,time,tempfile,subprocess,pathlib
          import urllib.request,urllib.error
          source_path='yesno-service/public/numi-yesno-uncensored.php'
          assert "if (!naTestOwner($account))" in pathlib.Path(source_path).read_text(encoding='utf-8')
          subprocess.run(['php','-l',source_path],check=True)
          before_revision='014a03291cadc7c354fdcc86ce2993f575c76668'
          after_revision='e3eea3f903d019a181116a24e79258e314823ff7'
          q='yn-man-002'
          host=os.environ['REG_FTP_HOST'].strip()
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].rstrip('.').lower()
          assert re.fullmatch(r'[a-z0-9.-]+\.hosting\.reg\.ru',ptr)
          assert host in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          ftp.connect(ptr,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(path,missing=False):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+path,b.write)
              except ftplib.error_perm as e:
                  if missing and str(e).startswith('550'):return None
                  raise
              return b.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              assert read(path)==data,'Verification failed'
          try:
              assert read(root+'api/numi-yesno-uncensored.php')==pathlib.Path(source_path).read_bytes(),'Owner-only API not deployed; stop'
              config=read(home+'/private/numi-secure-access/config.local.php')
              token=re.search(rb'(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}',config)
              assert token,'Private source access unavailable'
              def fetch_bank(revision):
                  url='https://api.github.com/repos/numerologia-online/numi-numi-on-private/contents/moment/yes-no/uncensored/answer-bank.json?ref='+revision
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token.group().decode('ascii'),'Accept':'application/vnd.github.raw+json','User-Agent':'numi-owner-preview-release'})
                  with urllib.request.urlopen(req,timeout=35) as response:return response.read(500000)
              before_bytes=fetch_bank(before_revision)
              after_bytes=fetch_bank(after_revision)
              before=json.loads(before_bytes)
              after=json.loads(after_bytes)
              assert before['mode']==after['mode']=='uncensored' and len(after['questions'])==100
              new_answers=after['questions'][q]['answers']
              assert set(new_answers)==set(map(str,range(10))) and all(isinstance(v,str) and v.strip() for v in new_answers.values())
              assert all(isinstance(v,str) and v.strip() for v in before['questions'][q]['answers'].values())
              assert after['questions'][q]['status']=='draft'
              before['questions'][q]['answers']=new_answers
              assert before==after,'Unexpected bank changes'
              filled=[v for data in after['questions'].values() for v in data['answers'].values() if v.strip()]
              assert len(filled)==len(set(filled))==110
              assert not any(d in v for v in filled for d in ('—','–'))
              path=home+'/private/numi-yesno-v1/uncensored/answer-bank.json'
              old=read(path)
              initial_bytes=fetch_bank('d71e75f42f1a40180950c53d7f87f03a6e6d0c7e')
              first_draft_bytes=fetch_bank('cf471a79c314cbfe59c5b4d809076c9db636a16f')
              first_final_bytes=fetch_bank('5378640609b2b62a9563571611ffd85b58f30e79')
              first100_bytes=fetch_bank('37ff26d70ca715de729dcc9732715a46ea5f416c')
              assert old in (initial_bytes,first_draft_bytes,first_final_bytes,first100_bytes,before_bytes,after_bytes),'Unexpected live bank; refusing overwrite'
              if old!=after_bytes:
                  backup=home+'/site-safeguard-backups'
                  try:ftp.mkd(backup)
                  except ftplib.error_perm:pass
                  put(backup+'/uncensored-approved002-'+os.environ['GITHUB_RUN_ID']+'.bak',old)
                  try:
                      put(path,after_bytes)
                      ftp.sendcmd('SITE CHMOD 600 '+path)
                  except BaseException:
                      put(path,old)
                      raise
              assert read(path)==after_bytes
              print('Verified: revised second question, owner gate unchanged')
          finally:ftp.quit()
          endpoint='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/api/numi-yesno-uncensored.php'
          request=urllib.request.Request(endpoint,data=b'{"question":"yn-man-001","time":"12:30"}',headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'},method='POST')
          try:
              urllib.request.urlopen(request,timeout=20)
              raise RuntimeError('Anonymous owner API unexpectedly allowed')
          except urllib.error.HTTPError as error:
              assert error.code==403 and json.load(error).get('error')=='UNCENSORED_OWNER_ONLY'
          print('Public HTTP verified: anonymous access denied')
          PY
