name: Read-only IPv4 vs IPv6 reachability
on:
  push:
    paths: [.github/workflows/diagnose-ipv6-access.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare IPv4 and IPv6 HTTPS to REG.RU and control site
        run: |
          for host in xn--c1adkkdfjbp1a4l.online www.xn--c1adkkdfjbp1a4l.online www.google.com; do
            for family in 4 6; do
              if result=$(curl "-$family" --head --location --silent --show-error --max-time 9 --output /dev/null --write-out '%{http_code} %{remote_ip} %{errormsg}' "https://$host/" 2>&1); then
                echo "TEST host=$host ipv=$family result=$result"
              else
                echo "TEST host=$host ipv=$family error=$result"
              fi
            done
          done
