name: Repair Family Gemini answers rejected by two-paragraph validator
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-gemini-format-fix-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repair without Gemini and publish only private Family engine
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_gemini_format_fix_20261123.py
