name: Publish birth date inside all Red Flag answers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-answer-birth-date-20261124.yml
      - .github/scripts/numi_redflag_answer_birth_date_20261124.py
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline check and guarded UI-only publication
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_redflag_answer_birth_date_20261124.py
