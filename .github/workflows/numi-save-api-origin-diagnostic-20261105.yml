name: Inspect failed Telegram save on live REG.RU (read-only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-save-api-origin-diagnostic-20261105.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public frontend and PHP save endpoint without user data or sends
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,re,json,hashlib,urllib.request,urllib.error,urllib.parse
          OLD="xn--c1adkkdfjbp1a4l.online"
          NEW="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          def fetch(url,method="GET",data=None,origin=None):
            h={"User-Agent":"numi-readonly-save-diagnostic/1","Cache-Control":"no-cache"}
            if origin:h["Origin"]="https://"+origin
            if data is not None:h["Content-Type"]="application/json"
            try:
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=18) as r:
                return r.status,r.headers, r.read(100000),r.geturl()
            except urllib.error.HTTPError as e:
              return e.code,e.headers,e.read(100000),e.geturl()
          for file in ("telegram-answer-save.js","personal-day-feature.js"):
            st,h,blob,url=fetch("https://"+NEW+"/"+file+"?nocache=20261106")
            print("PUBLIC_JS",json.dumps({"file":file,"status":st,"length":len(blob),"sha256":hashlib.sha256(blob).hexdigest()},ensure_ascii=False),flush=True)
            if file=="telegram-answer-save.js" and st==200:
              src=blob.decode("utf8",errors="replace")
              terms=("saveAnswerToTelegram","fetch(","origin","initData","init_data","URL","api/","Не удалось","open","Telegram","response")
              for i,line in enumerate(src.splitlines(),1):
                if any(w in line for w in terms):
                  safe=line.strip()[:230]
                  if any(s in safe.lower() for s in ("token","authorization","secret")):continue
                  print("PUBLIC_SAVE_JS_LINE",i,safe,flush=True)
          for domain in (OLD,NEW):
            for origin in (OLD,NEW):
              for method in ("OPTIONS","POST"):
                headers={"Origin":"https://"+origin}
                if method=="OPTIONS":headers.update({"Access-Control-Request-Method":"POST","Access-Control-Request-Headers":"content-type"})
                else:headers["Content-Type"]="application/json"
                data=b'{}' if method=="POST" else None
                req=urllib.request.Request("https://"+domain+"/api/numi-save-answer.php",method=method,data=data,headers=headers)
                try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                    status=r.status; body=r.read(3000); host=urllib.parse.urlsplit(r.url).hostname;acao=r.headers.get("Access-Control-Allow-Origin")
                except urllib.error.HTTPError as e:
                  status=e.code;body=e.read(3000);host=urllib.parse.urlsplit(e.url).hostname;acao=e.headers.get("Access-Control-Allow-Origin")
                try: category=json.loads(body).get("error") or json.loads(body).get("message") or ""
                except:category="NON_JSON"
                print("SAVE_API_PROBE",json.dumps({"domain":"old" if domain==OLD else "new","origin":"old" if origin==OLD else "new","method":method,"status":status,"final_host":host,"cors":acao==("https://"+origin),"error_category":str(category)[:90]},ensure_ascii=False),flush=True)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=24)
          f.connect("server172.hosting.reg.ru",21);f.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          f.prot_p();f.set_pasv(True);home=f.pwd().rstrip("/")
          for domain in (OLD,NEW):
            p=home+"/www/"+domain+"/api/numi-save-answer.php"
            b=io.BytesIO()
            try:f.retrbinary("RETR "+p,b.write)
            except ftplib.error_perm as e:
              if str(e).startswith("550"):
                print("SAVE_PHP_FTP",domain==NEW,"MISSING",flush=True);continue
              raise
            src=b.getvalue().decode("utf8",errors="replace")
            print("SAVE_PHP_FTP",json.dumps({"domain":"new" if domain==NEW else "old","bytes":len(src),"sha256":hashlib.sha256(b.getvalue()).hexdigest(),"has_old":OLD in src,"has_new":NEW in src},ensure_ascii=False),flush=True)
            for i,line in enumerate(src.splitlines(),1):
              if re.search("HTTP_ORIGIN|ORIGIN_NOT_ALLOWED|ALLOWED_ORIGINS|allowedOrigins|Origin|HTTP_HOST|REQUEST_METHOD",line):
                safe=re.sub(r"([A-Za-z0-9_]{50,})","REDACTED",line.strip().replace(OLD,"OLD_DOMAIN").replace(NEW,"NEW_DOMAIN"))
                if "token" in safe.lower() or "secret" in safe.lower():continue
                print("SAVE_PHP_ORIGIN_LINE", "new" if domain==NEW else "old",i,safe[:230],flush=True)
          f.quit()
          PY

      - name: Inspect current allowed links and validation guards read-only
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,io,re,hashlib
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=23)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p()
          p=f.pwd().rstrip('/')+'/www/xn--c1adkkdfjbp1a4l.online/api/numi-save-answer.php'
          b=io.BytesIO();f.retrbinary('RETR '+p,b.write);f.quit()
          lines=b.getvalue().decode('utf8').splitlines()
          for i,s in enumerate(lines,1):
              if 25<=i<=115 and any(x in s for x in ('INVALID_FORECAST','INVALID_REQUEST','init_data','HTTP_ORIGIN','str_contains','strpos','preg_match','SITE_URL','https://')):
                  if any(x in s.lower() for x in ('secret','password','token','private/','db_')):continue
                  s=s.replace('xn--c1adkkdfjbp1a4l.online','OLD_DOMAIN').replace('xn----8sbhhqijddjgdebdz2c2o.xn--p1ai','NEW_DOMAIN')
                  print('SAVE_VALIDATOR_LINE',i,s[:260],flush=True)
          PY

      - name: Publish exact one-line PHP fix for save answer, never touch daily mailing
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ftplib,io,ssl,hashlib,subprocess,tempfile
          OLD="xn--c1adkkdfjbp1a4l.online"
          NEW="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          PIN="6f4832b629f618d0e5611813ebdc25b725e1028ee54f2b1ed6a14195812f2150"
          old=("if($length<90||$length>3800||!str_contains($text,'https://"+OLD+"/'))return false;").encode()
          new=("if($length<90||$length>3800||(!str_contains($text,'https://"+OLD+"/')&&!str_contains($text,'https://"+NEW+"/')))return false;").encode()
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
          f.connect("server172.hosting.reg.ru",21)
          f.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"])
          f.prot_p();f.set_pasv(True)
          p=f.pwd().rstrip("/")+"/www/"+OLD+"/api/numi-save-answer.php"
          def read():
              b=io.BytesIO();f.retrbinary("RETR "+p,b.write);return b.getvalue()
          def write(data):
              f.storbinary("STOR "+p,io.BytesIO(data))
              if read()!=data:raise RuntimeError("FTP_READBACK_MISMATCH")
          before=read()
          if hashlib.sha256(before).hexdigest()!=PIN:raise RuntimeError("LIVE_SOURCE_CHANGED")
          if before.count(old)!=1:raise RuntimeError("VALIDATOR_NOT_FOUND_EXACTLY_ONCE")
          after=before.replace(old,new,1)
          if after.replace(new,old,1)!=before:raise RuntimeError("MORE_THAN_ONE_LINE_CHANGED")
          with tempfile.NamedTemporaryFile(suffix=".php") as tmp:
              tmp.write(after);tmp.flush()
              if subprocess.run(["php","-l",tmp.name],capture_output=True,timeout=12).returncode:
                  raise RuntimeError("PHP_SYNTAX_INVALID")
          print("ONE_LINE_SAVE_VALIDATOR_PREFLIGHT_PASSED",flush=True)
          if read()!=before:raise RuntimeError("LIVE_CHANGED_BEFORE_WRITE")
          try:
              write(after)
              print("SAVE_VALIDATOR_ONE_LINE_LIVE_PUBLISHED_VERIFIED",flush=True)
              print("NO_BOT_MORNING_MAILING_DATABASE_OR_CRON_CHANGES",flush=True)
              print("NO_NEW_BACKUP_FILES",flush=True)
          except BaseException:
              write(before)
              print("SAVE_VALIDATOR_IN_MEMORY_ROLLBACK_VERIFIED",flush=True)
              raise
          finally:
              f.quit()
          PY
