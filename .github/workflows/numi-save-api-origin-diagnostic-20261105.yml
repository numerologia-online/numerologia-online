name: Read exact live Red Flag success label and cache versions
on:
  push:
    paths:
      - .github/workflows/numi-save-api-origin-diagnostic-20261105.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Print only public UI markers
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json
          url="https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/"
          for name in ("redflag-feature.js","app.js","index.html"):
              request=urllib.request.Request(url+name+"?cache_bust=20261106",headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=24) as response:
                  blob=response.read(200000)
                  if response.status!=200:raise RuntimeError("Missing "+name)
              lines=blob.decode("utf8").splitlines()
              terms=("Ссылка на ответ готова","Если Telegram не открылся","redflag-feature.js?v=","app.js?v=")
              marked=[{"line":i+1,"value":v.strip()[:220]} for i,v in enumerate(lines) if any(t in v for t in terms)]
              print("LIVE_RED_FLAG_MARKERS",json.dumps({"file":name,"bytes":len(blob),"sha256":hashlib.sha256(blob).hexdigest(),"lines":marked},ensure_ascii=False),flush=True)
          PY
