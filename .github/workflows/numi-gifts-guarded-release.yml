name: Guarded opt-in publication of 24h club gifts
on:
  push:
    branches: [feature/analytics-gift-club-day-20261121]
    paths:
      - '.github/workflows/numi-gifts-guarded-release.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.head_commit.message == 'Publish safe gift trial to REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gift_test_only
          MYSQL_DATABASE: gift_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgift_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed on syntax errors
        run: |
          php -l insights/public/numi-gifts.php
          php -l account-service/private/core.php
          php -l account-service/private/wallet-real.php
          php -l account-service/private/subscriptions.php
          node --check account-browser.js
          node --check insights/public/insights.js
          python3 -m py_compile insights/deploy-gifts.py
          node --test insights/tests/*.test.cjs
      - name: Verify real MySQL gift lifecycle with no production access
        env:
          NG_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=gift_test;charset=utf8mb4
        run: php insights/tests/gift.mysql.php
      - name: Publish only after byte-perfect preflight, with backups and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u insights/deploy-gifts.py
