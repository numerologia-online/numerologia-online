name: Child karmic tails live browser audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/child-karmic-browser-audit.yml'
      - 'tests/child-karmic-live.mjs'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all 26 published karmic readings
        run: node tests/child-karmic-live.mjs
