name: Publish protected redacted site on explicit approval
on:
  push:
    paths:
      - .github/numi-frontend-release.json
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: numi-production-redacted-rollout
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Backup and publish strictly approved redacted browser files
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi-reg-redacted-site.py
      - name: Record release result for independent verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$STATE" -f "context=numi/live-protection-release" \
            -f "description=REG.RU redacted-content release $JOB_RESULT"
