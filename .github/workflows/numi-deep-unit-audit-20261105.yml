name: One-time safe code test suite for production readiness audit
on:
  push:
    paths: ['.github/workflows/numi-deep-unit-audit-20261105.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing non-networked website unit and architecture suites
        run: |
          python3 - <<'PY'
          import subprocess,glob
          suites=glob.glob('tests/*.test.mjs')
          suites+=glob.glob('moment/tests/*.test.cjs')
          suites+=glob.glob('insights/tests/*.test.cjs')
          names=sorted(suites)
          for f in names:
            p=subprocess.run(['node','--test',f],capture_output=True,text=True,timeout=60)
            summary=[x.strip() for x in p.stdout.splitlines() if x.startswith('# tests ') or x.startswith('# pass ') or x.startswith('# fail ') or x.startswith('# duration_ms')]
            print('UNIT_SUITE',f,'RESULT',('PASS' if p.returncode==0 else 'FAIL'),' '.join(summary)[:290],flush=True)
            if p.returncode!=0:
              details=[x[:240] for x in p.stdout.splitlines() if x.startswith('not ok') or 'ERR_' in x or 'error:' in x or 'failureType:' in x]
              print('SUITE_PROBLEMS',f,repr(details[:6]),flush=True)
          print('UNIT_AUDIT_COMPLETE_FILES',len(names),flush=True)
          PY
