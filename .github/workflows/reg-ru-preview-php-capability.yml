name: REG.RU PHP isolated preview capability probe (one time)

on:
  push:
    paths:
      - .github/workflows/reg-ru-preview-php-capability.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test private file PHP access without exposing any private website assets
        env:
          HOST: ${{ secrets.REG_FTP_HOST }}
          USER: ${{ secrets.REG_FTP_USER }}
          PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, io, json, os, re, secrets, socket, ssl, urllib.parse, urllib.request
          host=os.environ["HOST"].strip(); user=os.environ["USER"].strip(); passwd=os.environ["PASSWORD"]
          ptr=socket.gethostbyaddr(host)[0].rstrip(".").lower()
          if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru",ptr) or host not in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}:
              raise SystemExit("Unverified host")
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20)
          try:
              ftp.connect(ptr,21);ftp.auth();ftp.login(user,passwd);ftp.prot_p()
              home=ftp.pwd()
              ftp.cwd("site-safeguard-backups")
              backups=[name.rsplit("/",1)[-1] for name in ftp.nlst()]
              choices=[x for x in backups if x.startswith("unsafe-stage-")]
              if len(choices)!=1:raise RuntimeError("Private stage archive not uniquely identified")
              backup=choices[0]
              ftp.cwd(home)
              ftp.cwd("www/xn--c1adkkdfjbp1a4l.online/vesta-blinchik-numi-c313e2f44ae802e16599")
              token=secrets.token_urlsafe(28); filename="php-capability-"+secrets.token_hex(10)+".php"
              content=('<?php\nheader("Content-Type: application/json; charset=utf-8");\n'
                       'header("Cache-Control: no-store");\n'
                       'if (!hash_equals('+json.dumps(token)+',$_GET["token"] ?? "")){http_response_code(404);exit;}\n'
                       '$p=realpath(__DIR__."/../../../site-safeguard-backups/'+backup+'/index.html");\n'
                       'echo json_encode(["php"=>true,"private_file_readable"=>$p!==false && is_readable($p),'
                       '"outside_webroot"=>$p!==false && strpos($p,realpath($_SERVER["DOCUMENT_ROOT"]).DIRECTORY_SEPARATOR)!==0,'
                       '"php_version"=>PHP_MAJOR_VERSION]);\n')
              try:
                  ftp.storbinary("STOR "+filename,io.BytesIO(content.encode()))
                  url="https://xn--c1adkkdfjbp1a4l.online/vesta-blinchik-numi-c313e2f44ae802e16599/"+filename+"?token="+urllib.parse.quote(token)
                  with urllib.request.urlopen(url,timeout=18) as r:
                      data=json.loads(r.read(5000))
                  print("PRIVATE PHP CAPABILITY:",data)
                  if data.get("php") is not True or data.get("private_file_readable") is not True or data.get("outside_webroot") is not True:
                      raise SystemExit("PHP cannot securely access private backup. No private site exposed.")
              finally:
                  ftp.delete(filename)
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          PY
