name: Diagnose only newly deployed Moment AI Worker public health endpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-cf-health-diagnose.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check anonymous safe health from GitHub, no token or billing
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,socket
          host='numerologia-300-ai.tankraft431.workers.dev'
          try:
            records=socket.getaddrinfo(host,443)
            print('MOMENT_WORKER_DNS_OK count='+str(len(records)))
          except OSError as e:
            print('MOMENT_WORKER_DNS_FAILED type='+type(e).__name__+' info='+str(e)[:120])
          for path in ['/health','/','/v1/owner-preview']:
            req=urllib.request.Request('https://'+host+path,headers={'User-Agent':'NumiMomentDiagnostic/1.0','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=12) as res:
                print('MOMENT_WORKER_HEALTH path='+path+' status='+str(res.status)+' body='+res.read(270).decode('utf8','replace'))
            except urllib.error.HTTPError as e:
              print('MOMENT_WORKER_HEALTH path='+path+' status='+str(e.code)+' body='+e.read(270).decode('utf8','replace'))
            except Exception as e:
              print('MOMENT_WORKER_HEALTH path='+path+' error='+type(e).__name__+' details='+str(e)[:230])
          PY
