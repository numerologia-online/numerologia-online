name: Audit whole REG.RU reference against GitHub public assets
on:
  push:
    paths:
      - .github/workflows/numi-audit-public-drift.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare static GitHub files with secure frozen REG.RU backup
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u scripts/audit-full-public-drift.py
      - name: Publish filenames and counts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/regru-full-public-drift.json
          if ! git diff --cached --quiet; then
            git commit -m "Record remaining public asset divergence"
            git pull --rebase origin main
            git push
          fi
