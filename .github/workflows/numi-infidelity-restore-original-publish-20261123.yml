name: Publish restored infidelity interpretations ONLY
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-infidelity-restore-original-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish ONLY infidelity knowledge and function, no AI requests
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import pathlib,json,subprocess,ftplib,ssl,io,os,re,hashlib,time,uuid,urllib.request,urllib.error
          ap='redflag-ai-lab/style-test-api.php'
          kp='redflag-ai-lab/infidelity-knowledge-v1.json'
          code=pathlib.Path(ap).read_bytes()
          kb=pathlib.Path(kp).read_bytes()
          knowledge=json.loads(kb)
          assert set(knowledge['arcana'])==set(str(i) for i in range(1,23))
          assert knowledge['arcana']['15']['core'].startswith('Ненасытная страсть')
          assert b"'faithful'=>['left','top','loveHeart','center','tailFirst']" in code
          def piece(data):
              start=data.index(b'function rfOwnerSharpInfidelity(')
              end=data.index(b'\n}\n',start)+2
              return start,end,data[start:end]
          start,end,desired=piece(code)
          assert desired.count(b'function rfOwnerSharpInfidelity(')==1
          assert desired.count(b'google/gemini-3-flash-preview')==1
          host='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(host+path+'?infidelity_publish='+str(time.time_ns()),headers={'Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          def healthy():
              codes=[status(''),status('redflag-ai-lab/style-test-api.php'),status('redflag-ai-lab/style-test.php')]
              print('SITE_HEALTH',codes,flush=True)
              return codes[0]==200 and codes[1]==403 and codes[2]==403
          if not healthy():raise RuntimeError('SITE_UNHEALTHY_BEFORE_NO_WRITES')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=44)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=home+'/site-safeguard-backups'
          def read(path,absolute=False):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+(path if absolute else root+path),b.write)
              return b.getvalue()
          def write(path,blob,absolute=False):
              ftp.storbinary('STOR '+(path if absolute else root+path),io.BytesIO(blob))
              if read(path,absolute)!=blob:raise RuntimeError('READBACK_MISMATCH_'+path)
          oldcode=oldkb=None
          writes=False
          try:
              oldcode=read(ap);oldkb=read(kp)
              rs,re_,oldfn=piece(oldcode)
              assert oldfn.count(b'function rfOwnerSharpInfidelity(')==1
              assert oldcode.count(b'function rfOwnerSharpFlags(')==1
              assert oldcode.count(b'function rfOwner31(')==1
              assert code.count(b'function rfOwnerSharpFlags(')==1
              assert code.count(b'function rfOwner31(')==1
              # Preserve 100% of live PHP outside the infidelity function, including the live secret.
              restored=oldcode[:rs]+desired+oldcode[re_:]
              assert restored[:rs]==oldcode[:rs] and restored[rs+len(desired):]==oldcode[re_:]
              assert restored.count(b'function rfOwnerSharpInfidelity(')==1
              syntax=subprocess.run(['php','-l'],input=restored,capture_output=True)
              if syntax.returncode:raise RuntimeError('RESTORED_PHP_SYNTAX_INVALID_'+syntax.stderr.decode(errors='replace')[:300])
              protected=['redflag-ai-lab/intimacy-knowledge-v1.json','redflag-ai-lab/catalog.json','redflag-ai-lab/style-test.php','redflag-feature.js','redflag-public-catalog.js','redflag-engine.js','app.js','index.html','api/redflag-free-ai.php','wallet-client.js']
              hashes={p:hashlib.sha256(read(p)).hexdigest() for p in protected}
              if restored==oldcode and kb==oldkb:
                  print('ALREADY_LIVE_VERIFIED protected_redflags=true paid_calls=0',flush=True)
              else:
                  try:ftp.mkd(backup)
                  except ftplib.error_perm as e:
                      if not str(e).startswith('550'):raise
                  tag=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
                  write(backup+'/before-infidelity-original-api-'+tag+'.bak',oldcode,True)
                  write(backup+'/before-infidelity-original-kb-'+tag+'.bak',oldkb,True)
                  if read(ap)!=oldcode or read(kp)!=oldkb:raise RuntimeError('REMOTE_CHANGED_ABORT')
                  writes=True
                  write(kp,kb)
                  write(ap,restored)
                  if not healthy():raise RuntimeError('SITE_UNHEALTHY_AFTER_PUBLICATION')
                  for p,h in hashes.items():
                      if hashlib.sha256(read(p)).hexdigest()!=h:
                          raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
                  assert piece(read(ap))[2]==desired
                  assert read(kp)==kb
                  print('PUBLISHED_RESTORED_INFidelity_OK protected_redflags=true paid_calls=0',flush=True)
          except BaseException:
              if writes and oldcode is not None and oldkb is not None:
                  errors=[]
                  for p,b in ((ap,oldcode),(kp,oldkb)):
                      try:write(p,b)
                      except BaseException:errors.append(p)
                  print('ROLLBACK_'+('FAILED_'+','.join(errors) if errors else 'SUCCESS'),flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
