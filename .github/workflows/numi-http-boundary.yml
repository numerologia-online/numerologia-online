name: REG.RU anonymous-access boundary
on:
  push:
    paths:
      - .github/workflows/numi-http-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live PHP backend and paid-text public URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os,subprocess
          base='https://xn--c1adkkdfjbp1a4l.online'
          def request(path,body=None):
              headers={'User-Agent':'numi-readonly-boundary-audit/1.0','Cache-Control':'no-cache'}
              data=None if body is None else json.dumps(body).encode()
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=data,headers=headers)
              try:r=urllib.request.urlopen(req,timeout=15)
              except urllib.error.HTTPError as e:r=e
              with r:return r.status,r.read(5000)
          def status(context,passed,description):
              args=['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA'],
                    '-f','state='+('success' if passed else 'failure'),'-f','context='+context,'-f','description='+description]
              subprocess.run(args,check=True)
          try:
              code,data=request('/api/numi-content-health.php')
              payload=json.loads(data)
              backend=code==200 and payload.get('configured') is True
              print('Backend configured:',backend,'HTTP:',code,flush=True)
              status('numi/backend-installed',backend,'PHP configured='+str(backend))
              denied=True
              for name in ('numi-miniapp','numi-paid-content','numi-redflag-content'):
                  s,_=request('/api/'+name+'.php',{'init_data':'','path':'data/year/energy-1.txt'})
                  print('Anonymous:',name,'HTTP:',s,flush=True)
                  denied=denied and s==401
              status('numi/backend-guest-denied',denied,'Guest API access denied='+str(denied))
              blocked=True
              for path in ('/data/year/energy-1.txt','/data/redflag/love/published/1-2.json','/child/data/matrix/sections/energy-1.json'):
                  s,_=request(path)
                  print('Public paid source:',path,'HTTP:',s,flush=True)
                  blocked=blocked and s in (401,403,404,410)
              status('numi/public-content-closed',blocked,'Paid source URLs blocked='+str(blocked))
              if not backend or not denied or not blocked:raise SystemExit('Protection not complete')
          except Exception as e:
              print('Check failed:',type(e).__name__,flush=True)
              raise
          PY
