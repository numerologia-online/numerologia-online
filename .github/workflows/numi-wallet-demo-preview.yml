name: REG.RU publish isolated demo wallet preview once
on:
  push:
    paths:
      - .github/workflows/numi-wallet-demo-preview.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish standalone fake-money wallet preview only'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone frontend no external network
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("wallet-sandbox-preview-20261106.html").read_text()
          assert "Тестовый макет · без платежей" in s
          assert '<meta name="robots" content="noindex,nofollow,noarchive">' in s
          assert len(s.encode())<100_000
          assert not re.search(r"(?i)<script[^>]+src\s*=|\bfetch\s*\(|XMLHttpRequest|sendBeacon|secret_key|test-core.php|numi-wallet-test.php",s)
          parts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(parts)==1
          Path("/tmp/numi-wallet-demo.js").write_text(parts[0])
          print("Demo static safety checks passed; nothing involving real funds or credentials.")
          PY
          node --check /tmp/numi-wallet-demo.js
      - name: Publish exactly one new static demo file after matching HTTPS domain
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,hashlib,io,os,pathlib,re,socket,ssl,urllib.request,urllib.parse
          FILE="wallet-sandbox-preview-20261106.html"
          NEW="xn----8sbhhqijddjgdebdz2c2o.xn--p1ai"
          OLD="xn--c1adkkdfjbp1a4l.online"
          content=pathlib.Path(FILE).read_bytes()
          assert b"<script>" in content and b"</script>" in content
          host=os.environ.get("REG_FTP_HOST","").strip();user=os.environ.get("REG_FTP_USER","").strip();pw=os.environ.get("REG_FTP_PASSWORD","")
          if not(host and user and pw):raise SystemExit("Missing FTP credentials; no changes.")
          socket.inet_aton(host)
          ptr=socket.gethostbyaddr(host)[0].lower().rstrip(".")
          if not re.fullmatch(r"[a-z0-9.-]+\.hosting\.reg\.ru",ptr):raise SystemExit("Unverified REG.RU host")
          if host not in {x[4][0] for x in socket.getaddrinfo(ptr,21,type=socket.SOCK_STREAM)}:raise SystemExit("Hosting DNS mismatch")
          def read(ftp,name,limit=3_000_000):
            b=bytearray()
            def collect(chunk):
              b.extend(chunk)
              if len(b)>limit:raise RuntimeError("Remote file unexpectedly large")
            ftp.retrbinary("RETR "+name,collect)
            return bytes(b)
          req=urllib.request.Request("https://"+NEW+"/index.html",headers={"Cache-Control":"no-cache","User-Agent":"numi-verified-preview-deployer/1.0"})
          try:
            with urllib.request.urlopen(req,timeout=18) as res:
              if urllib.parse.urlparse(res.geturl()).hostname!=NEW:raise RuntimeError("New domain redirected elsewhere")
              remote_public=res.read(3_000_001)
              if len(remote_public)>3_000_000:raise RuntimeError("Unexpected homepage size")
          except Exception as e:raise SystemExit("Cannot verify new domain homepage; refusing upload: "+str(e)[:120])
          ftps=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=18)
          created=False
          try:
            ftps.connect(ptr,21);ftps.auth();ftps.login(user,pw);ftps.prot_p();ftps.set_pasv(True)
            home=ftps.pwd();selected=None
            for candidate in ("www/"+NEW,"www/"+OLD):
              try:
                ftps.cwd(home);ftps.cwd(candidate)
                data=read(ftps,"index.html")
              except ftplib.error_perm:continue
              if hashlib.sha256(data).digest()==hashlib.sha256(remote_public).digest():
                selected=ftps.pwd()
                break
            if selected is None:raise RuntimeError("No REG.RU webroot exactly matches new domain homepage; nothing uploaded")
            ftps.cwd(selected)
            if FILE in {p.rsplit("/",1)[-1] for p in ftps.nlst()}:
              raise RuntimeError("Preview path already exists. Refusing to overwrite any file")
            ftps.storbinary("STOR "+FILE,io.BytesIO(content));created=True
            if hashlib.sha256(read(ftps,FILE)).digest()!=hashlib.sha256(content).digest():raise RuntimeError("Uploaded preview checksum failed")
            print("NEW STATIC DEMO PUBLISHED. Existing files modified: 0")
            request=urllib.request.Request("https://"+NEW+"/"+FILE+"?verify=20261106",headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(request,timeout=18) as res:
              status=res.status
              served=res.read(100_000)
            if status!=200 or hashlib.sha256(served).digest()!=hashlib.sha256(content).digest():raise RuntimeError("New-domain public URL not verified; rollback")
            print("LIVE HTTPS VERIFIED: https://"+NEW+"/"+FILE)
          except BaseException:
            if created:
              try:
                ftps.delete(FILE)
                print("ROLLBACK: deleted only newly created demo file")
              except Exception:print("ROLLBACK WARNING: demo file could not be deleted")
            raise
          finally:
            try:ftps.quit()
            except Exception:ftps.close()
          PY
