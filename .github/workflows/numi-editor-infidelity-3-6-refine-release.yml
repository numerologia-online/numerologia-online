name: Guarded INFIDELITY 22-arcana thematic knowledge only (no paid calls)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-editor-infidelity-3-6-refine-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact source changes and no-cost check all 22 energy texts
        run: |
          set -euo pipefail
          php -l redflag-ai-lab/style-test-api.php
          python3 - <<'PY'
          import json,pathlib,subprocess
          base='532b6d6fb488007675e6971723b2a3bfc5348495'
          kb='redflag-ai-lab/infidelity-knowledge-v1.json'
          wf='.github/workflows/numi-editor-infidelity-3-6-refine-release.yml'
          touched=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert touched=={kb,wf},'UNEXPECTED_MODIFIED_FILES_'+repr(touched)
          before=json.loads(subprocess.check_output(['git','show',base+':'+kb]))
          after=json.loads(pathlib.Path(kb).read_text())
          assert set(before)==set(after),'KB_SCHEMA_DRIFT'
          for k in before:
              if k!='arcana':assert after[k]==before[k],'KB_METADATA_CHANGED_'+k
          assert set(after['arcana'])==set(str(i) for i in range(1,23)),'MISSING_ARCANA'
          for n,a in after['arcana'].items():
              assert a['name']==before['arcana'][n]['name'],'ARCANA_ID_CHANGED_'+n
              assert set(a)=={'name','core','plus','minus','love'},'ARCANA_FORMAT_CHANGED_'+n
              assert all(isinstance(a[k],str) and len(a[k])>=20 for k in ('core','plus','minus','love'))
          total=sum(len(''.join(a[k] for k in ('core','plus','minus','love'))) for a in after['arcana'].values())
          assert 5800<=total<=6150,'APPROVED_REFERENCE_LENGTH_MISMATCH'
          assert 'Колесница' in after['arcana']['7']['core']
          assert 'азарт завоевания' not in after['arcana']['7']['minus']
          assert 'старые связи' not in after['arcana']['10']['minus']
          assert 'переписки' in after['arcana']['4']['minus']
          assert 'статус' in after['arcana']['8']['minus']
          freeze=[
             'redflag-ai-lab/style-test-api.php','redflag-ai-lab/intimacy-knowledge-v1.json',
             'redflag-ai-lab/catalog.json','redflag-ai-lab/style-test.php',
             'redflag-feature.js','redflag-public-catalog.js','redflag-engine.js',
             'app.js','index.html','api/redflag-free-ai.php'
          ]
          for p in freeze:
              assert pathlib.Path(p).read_bytes()==subprocess.check_output(['git','show',base+':'+p]),'PROTECTED_CHANGED_'+p
          print('OFFLINE_GUARD_PASS arcana=22 characters='+str(total)+' files_only=knowledge_and_workflow model_untouched=YES approved_flags_untouched=YES paid_calls=0',flush=True)
          PY
      - name: Back up and publish ONLY infidelity knowledge with read-back and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,ftplib,ssl,io,os,time,uuid,hashlib,urllib.request,urllib.error
          base='532b6d6fb488007675e6971723b2a3bfc5348495'
          p='redflag-ai-lab/infidelity-knowledge-v1.json'
          prior=subprocess.check_output(['git','show',base+':'+p])
          desired=pathlib.Path(p).read_bytes()
          site='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(path):
              req=urllib.request.Request(site+path+'?infidelity_guard='+str(time.time_ns()),
                  headers={'Cache-Control':'no-store','User-Agent':'NumiKBOnlyGuard/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:return res.status
              except urllib.error.HTTPError as e:return e.code
          def healthy():
              return status('')==200 and status('redflag-ai-lab/style-test-api.php')==403 and status('redflag-ai-lab/style-test.php')==403 and status('api/numi-account.php')<500
          if not healthy():raise RuntimeError('LIVE_SITE_PRECHECK_FAILED')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=44)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          backup=home+'/site-safeguard-backups'
          def read(path,absolute=False):
              b=io.BytesIO()
              ftp.retrbinary('RETR '+(path if absolute else root+path),b.write)
              return b.getvalue()
          def write(path,data,absolute=False):
              ftp.storbinary('STOR '+(path if absolute else root+path),io.BytesIO(data))
              if read(path,absolute)!=data:raise RuntimeError('FTP_READBACK_MISMATCH_'+path)
          protected=[
              'redflag-ai-lab/style-test-api.php','redflag-ai-lab/intimacy-knowledge-v1.json',
              'redflag-ai-lab/catalog.json','redflag-ai-lab/style-test.php',
              'redflag-feature.js','redflag-public-catalog.js','redflag-engine.js',
              'app.js','index.html','api/numi-account.php','api/redflag-free-ai.php'
          ]
          changed=False
          previous=None
          try:
              previous=read(p)
              if previous==desired:
                  print('KB_ALREADY_PUBLISHED_22_ENERGIES',flush=True)
              elif previous!=prior:
                  raise RuntimeError('LIVE_KB_DRIFT_REFUSE_PUBLISH')
              else:
                  hashes={q:hashlib.sha256(read(q)).digest() for q in protected}
                  try:ftp.mkd(backup)
                  except ftplib.error_perm as e:
                      if not str(e).startswith('550'):raise
                  stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+uuid.uuid4().hex[:8]
                  write(backup+'/before-infidelity-22arcana-'+stamp+'.bak',previous,True)
                  if read(p)!=previous:raise RuntimeError('CONCURRENT_KB_CHANGE')
                  changed=True
                  write(p,desired)
                  if not healthy():raise RuntimeError('SITE_POSTCHECK_FAILED')
                  for q,d in hashes.items():
                      if hashlib.sha256(read(q)).digest()!=d:
                          raise RuntimeError('OTHER_LIVE_FILE_CHANGED_'+q)
                  print('INFIDELITY_22_ARCANA_KB_PUBLISHED_VERIFIED other_sections_unchanged=true red_flags_unchanged=true code_unchanged=true paid_calls=0',flush=True)
          except BaseException:
              if changed and previous is not None:
                  try:write(p,previous);print('ROLLBACK_INF_KB_OK',flush=True)
                  except BaseException:print('CRITICAL_ROLLBACK_FAILED_INF_KB',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
