name: Guarded publish of arcana 15 in shared 22-energy knowledge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-editor-infidelity-3-6-refine-release.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exactly one shared arcana entry changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,json,copy
          old='e6438f33e8719df4b0fadbe1700fab060a9f7f91'
          target='8eb929d4fabe3e92bab4c067869e9e3e750501db'
          path='redflag-ai-lab/intimacy-knowledge-v1.json'
          before=subprocess.check_output(['git','show',old+':'+path])
          after=subprocess.check_output(['git','show',target+':'+path])
          assert pathlib.Path(path).read_bytes()==after,'UNAPPROVED_KB_VERSION'
          b=json.loads(before);a=json.loads(after)
          assert len(b['arcana'])==len(a['arcana'])==22,'ARCANA_COUNT_CHANGED'
          assert b['arcana']['15']['name']==a['arcana']['15']['name']=='Дьявол','ARCANA_NAME_CHANGED'
          assert set(b['arcana']['15'])==set(a['arcana']['15']),'ARCANA_FIELDS_CHANGED'
          assert b['arcana']['15']!=a['arcana']['15'],'NOTHING_TO_PUBLISH'
          b['arcana']['15']=copy.deepcopy(a['arcana']['15'])
          assert b==a,'OTHER_KNOWLEDGE_CHANGED'
          assert 'Соблазнение' in a['arcana']['15']['core'],'SEDUCTION_MISSING'
          assert 'бывшими' in a['arcana']['15']['minus'],'EXES_MISSING'
          assert 'страсть' in a['arcana']['15']['love'],'PASSION_MISSING'
          protected=['redflag-ai-lab/style-test-api.php','redflag-ai-lab/catalog.json',
            'redflag-ai-lab/infidelity-knowledge-v1.json']
          for item in protected:
              assert subprocess.check_output(['git','show',old+':'+item])==subprocess.check_output(['git','show',target+':'+item]),'OTHER_SOURCE_CHANGED_'+item
          print('OFFLINE_GUARD_OK only_arcana_15_changed other_21_energies_unchanged flags_prompt_unchanged infidelity_prompt_unchanged paid_calls=0',flush=True)
          PY
          php -r '$d=json_decode(file_get_contents("redflag-ai-lab/intimacy-knowledge-v1.json"),true,25,JSON_THROW_ON_ERROR); if(count($d["arcana"])!==22)exit(1); echo "PHP_JSON_READ_OK energies=22 paid_calls=0\n";'
      - name: Backup and publish only shared knowledge JSON with rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,ssl,os,json,re,copy,ftplib,subprocess,pathlib,time,urllib.request,urllib.error
          previous_ref='e6438f33e8719df4b0fadbe1700fab060a9f7f91'
          desired_ref='8eb929d4fabe3e92bab4c067869e9e3e750501db'
          path='redflag-ai-lab/intimacy-knowledge-v1.json'
          before=subprocess.check_output(['git','show',previous_ref+':'+path])
          approved=subprocess.check_output(['git','show',desired_ref+':'+path])
          assert pathlib.Path(path).read_bytes()==approved,'KB_CHANGED_AFTER_QA'
          assert len(json.loads(approved)['arcana'])==22,'KB_INVALID'
          base='https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'
          def status(p):
              req=urllib.request.Request(base+p+'?arcana15_verify='+str(time.time_ns()),
                  headers={'Cache-Control':'no-store','User-Agent':'NumiOwnerSharedArcana15/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=26) as res:return res.status
              except urllib.error.HTTPError as err:return err.code
          if status('')!=200:raise RuntimeError('HOME_NOT_200_BEFORE')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=38)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          root=home+'/www/xn--c1adkkdfjbp1a4l.online/'
          def read(p):
              b=io.BytesIO();ftp.retrbinary('RETR '+root+p,b.write);return b.getvalue()
          def write(p,content):
              ftp.storbinary('STOR '+root+p,io.BytesIO(content))
              if read(p)!=content:raise RuntimeError('READBACK_FAILED')
          protected=[
              'redflag-ai-lab/style-test-api.php','redflag-ai-lab/catalog.json',
              'redflag-ai-lab/infidelity-knowledge-v1.json',
              'redflag-feature.js','redflag-engine.js','redflag-public-catalog.js',
              'api/numi-account.php','api/redflag-free-ai.php'
          ]
          changed=False
          try:
              live=read(path)
              # The live knowledge file has drifted from GitHub. Preserve all
              # live content except arcana 15, rather than overwriting the file.
              raw=live.decode('utf-8')
              current=json.loads(raw)
              baseline=json.loads(before)
              target=json.loads(approved)
              if current.get('schema')!=baseline.get('schema'):
                  raise RuntimeError('LIVE_KB_SCHEMA_DRIFT')
              live_ar=current.get('arcana',{})
              if not isinstance(live_ar,dict) or set(live_ar)!=set(baseline['arcana']):
                  raise RuntimeError('LIVE_ARCANA_SET_DRIFT')
              if not isinstance(live_ar.get('15'),dict) or set(live_ar['15'])!=set(target['arcana']['15']):
                  raise RuntimeError('LIVE_15_FIELDS_DRIFT')
              pattern=re.compile(r'(?m)^([ \\t]*)"15"[ \\t]*:[ \\t]*')
              matches=list(pattern.finditer(raw))
              if len(matches)!=1:raise RuntimeError('LIVE_15_TEXT_PATTERN_DRIFT')
              match=matches[0]
              parsed,size=json.JSONDecoder().raw_decode(raw[match.end():])
              if parsed!=live_ar['15']:raise RuntimeError('LIVE_15_POSITION_DRIFT')
              replacement=json.dumps(target['arcana']['15'],ensure_ascii=False,indent=2).replace('\\n','\\n'+match.group(1))
              merged_raw=raw[:match.end()]+replacement+raw[match.end()+size:]
              merged_doc=json.loads(merged_raw)
              expected=copy.deepcopy(current)
              expected['arcana']['15']=target['arcana']['15']
              if merged_doc!=expected:raise RuntimeError('ONLY_15_MERGE_GUARD_FAILED')
              merged=merged_raw.encode('utf-8')
              if merged==live:raise RuntimeError('LIVE_15_ALREADY_UPDATED')
              print('LIVE_DRIFT_SAFELY_PRESERVED other_21_energies_and_all_other_fields',flush=True)
              unchanged={p:read(p) for p in protected}
              backup_folder=home+'/site-safeguard-backups'
              try:ftp.mkd(backup_folder)
              except ftplib.error_perm as ex:
                  if not str(ex).startswith('550'):raise
              stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
              backup_path=backup_folder+'/shared-arcana15-before-'+stamp+'.json.bak'
              ftp.storbinary('STOR '+backup_path,io.BytesIO(live))
              if read(path)!=live:raise RuntimeError('CONCURRENT_KB_CHANGE')
              changed=True
              write(path,merged)
              if status('')!=200:raise RuntimeError('HOME_NOT_200_AFTER')
              if status('redflag-ai-lab/style-test-api.php')!=403:raise RuntimeError('EDITOR_ROUTE_NOT_PROTECTED')
              if status('api/numi-account.php')>=500:raise RuntimeError('ACCOUNT_ROUTE_NOT_HEALTHY')
              if read(path)!=merged:raise RuntimeError('PUBLISHED_KB_DRIFT')
              for p,original in unchanged.items():
                  if read(p)!=original:raise RuntimeError('PROTECTED_FILE_CHANGED_'+p)
              print('PUBLISHED_AND_VERIFIED shared_arcana_15_updated=true all_other_live_knowledge_preserved=true other_21_energies_unchanged=true flags_code_and_prompt_unchanged=true infidelity_code_and_prompt_unchanged=true payments_unchanged=true backup_saved=true billable_generations=0',flush=True)
          except BaseException:
              if changed:
                  try:write(path,live);print('ROLLED_BACK_JSON_OK',flush=True)
                  except BaseException:print('CRITICAL_JSON_ROLLBACK_FAILED',flush=True)
              raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
