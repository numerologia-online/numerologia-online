name: Publish Family and Household Gemini without interpretation bank to REG RU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-family-nokb-publish-20261123.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish family only with rollback and zero model calls
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u .github/scripts/numi_family_nokb_publish_20261123.py
# retry modular JS validation without affecting runtime files
# compare against original pre-family source baseline
# efficient line-level drift verification; keep strict FTP lock
