name: Test existing private year preview endpoint without changing production
on:
  push:
    paths:
      - .github/workflows/numi-year-preview-live-probe.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only inspect live year-preview CORS rules (no writes)
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,io,hashlib,re
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=24)
          f.connect("server172.hosting.reg.ru",21)
          f.login(os.environ["REG_FTP_USER"],os.environ["REG_FTP_PASSWORD"]);f.prot_p()
          home=f.pwd().rstrip("/")
          path=home+"/www/xn--c1adkkdfjbp1a4l.online/api/numi-year-preview.php"
          buf=io.BytesIO()
          f.retrbinary("RETR "+path,buf.write)
          data=buf.getvalue()
          print("YEAR_LIVE_PHP",len(data),"sha256",hashlib.sha256(data).hexdigest(),flush=True)
          if len(data)<500 and b"password" not in data.lower() and b"secret" not in data.lower() and b"token" not in data.lower():
            print("YEAR_LOADER_STUB",repr(data.decode("utf-8","replace")),flush=True)
          lines=data.decode("utf-8","replace").splitlines()
          rx=re.compile("origin|cors|access.control|http_origin|options|forbid|denied|method",re.I)
          sensitive=re.compile("secret|token|password|db_|credential|key|private|smtp|ftp_",re.I)
          for n,line in enumerate(lines[:180],1):
            if rx.search(line) and not sensitive.search(line):
              print("YEAR_CORS_LINE",n,line[:230],flush=True)
          core_path=home+"/private/numi-content-reg-20261031/core.php"
          full=io.BytesIO()
          f.retrbinary("RETR "+core_path,full.write)
          core=full.getvalue()
          print("YEAR_PRIVATE_CORE",len(core),"sha256",hashlib.sha256(core).hexdigest(),flush=True)
          source=core.decode("utf-8","replace").splitlines()
          hits=[i for i,s in enumerate(source) if re.search(r"origin|cors|allow.*domain|allowed.*host",s,re.I)]
          forbidden=re.compile("secret|password|token|credential|private.key|db_|smtp|ftp_",re.I)
          for i in sorted(set(j for n in hits for j in range(max(0,n-2),min(len(source),n+3)))):
            if not forbidden.search(source[i]):
              print("YEAR_CORE_CORS",i+1,source[i][:270],flush=True)
          for name in ("redflag-feature.js", "app.js", "index.html"):
            public=io.BytesIO()
            f.retrbinary("RETR "+home+"/www/xn--c1adkkdfjbp1a4l.online/"+name, public.write)
            body=public.getvalue()
            print("REDFLAG_LIVE_SHA256",name,hashlib.sha256(body).hexdigest(),"bytes",len(body),flush=True)
            if name=="redflag-feature.js":
              print("REDFLAG_SCROLL_ANCHOR",body.count(b'      state.activeQuestionId = opened ? null : question.id;'),body.count(b'    state.expanded = opening;'),flush=True)
            if name=="app.js":
              print("REDFLAG_APP_VERSION",body.count(b'redflag-feature.js?v=20261105scrollfit1'),flush=True)
            if name=="index.html":
              print("REDFLAG_INDEX_VERSION",body.count(b'app.js?v=20261105scrollfit1'),flush=True)
          name="account-browser.js"
          public=io.BytesIO()
          f.retrbinary("RETR "+home+"/www/xn--c1adkkdfjbp1a4l.online/"+name, public.write)
          body=public.getvalue()
          print("CABINET_LIVE_SHA256",name,hashlib.sha256(body).hexdigest(),"bytes",len(body),flush=True)
          checks=[
            b'if (!overview.querySelector("#numi-cabinet-documents")) {',
            b'const legalHeading = document.createElement("div");',
            b'legalNav.append(legalHeading, legalGrid);',
            b'margin: 21px 0 3px; padding: 16px 1px 0;',
            b'margin: 0 0 10px; color: #2c5846;',
            b'min-height: 39px; padding: 5px 0;',
            b'dialog.append(legalStyle);',
          ]
          for test in checks:
            print("CABINET_LEGAL_ANCHOR",test.decode(),body.count(test),flush=True)
          body=read_data if False else body
          f.quit()
          PY
      - name: Read-only compare current website and bot section links
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,re
          roots={
            "old_regru":"https://xn--c1adkkdfjbp1a4l.online/",
            "new_regru":"https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/",
            "bot_code_github_pages":"https://numerologia-online.github.io/numerologia-online/"
          }
          for label,root in roots.items():
            for asset in ("","account-browser.js","redflag-feature.js"):
              url=root+asset
              try:
                req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"Numi-ReadOnly-Domain-Verification/1"})
                with urllib.request.urlopen(req,timeout=18) as resp:
                  content=resp.read(200000)
                  code=resp.status
                  final=resp.geturl()
                text=content.decode("utf-8","replace")
                print("SITE_ADDRESS_CHECK",label,asset or "index.html","status",code,"bytes",len(content),"sha256",hashlib.sha256(content).hexdigest()[:20],"final",final,flush=True)
                if not asset:
                  refs=re.findall(r'account-browser\\.js\\?v=[^"\\s<>]+',text)
                  print("SITE_ACCOUNT_SCRIPT_VERSION",label,refs[:2],flush=True)
                if asset=="account-browser.js":
                  print("SITE_COMPACT_DOCS",label,"details_markup",int('legalDetails = document.createElement("details")' in text),"old_grid",int('legalNav.append(legalHeading, legalGrid)' in text),flush=True)
                if asset=="redflag-feature.js":
                  print("SITE_REDFLAG_SCROLL",label,"new_scroll",int('findScrollAnchor({ type: "category", id: category.id })' in text),flush=True)
              except Exception as e:
                print("SITE_ADDRESS_CHECK",label,asset or "index.html","ERROR",type(e).__name__,str(e)[:120],flush=True)
          PY
      - name: Read-only preflight and guest calculation from old and current website origins
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          api="https://xn--c1adkkdfjbp1a4l.online/api/numi-year-preview.php"
          origins={
            "old":"https://xn--c1adkkdfjbp1a4l.online",
            "new":"https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai",
          }
          failures=[]
          for label,origin in origins.items():
            api=origin+"/api/numi-year-preview.php"
            for method in ("OPTIONS","POST"):
              body=json.dumps({"birth_date":"1986-09-09","year":2026,"timezone":"Europe/Samara"}).encode() if method=="POST" else None
              headers={"Origin":origin,"Cache-Control":"no-cache"}
              if method=="OPTIONS":
                headers.update({"Access-Control-Request-Method":"POST","Access-Control-Request-Headers":"content-type"})
              else:
                headers["Content-Type"]="application/json"
              req=urllib.request.Request(api,data=body,headers=headers,method=method)
              try:
                with urllib.request.urlopen(req,timeout=25) as resp:
                  code=resp.status; cors=resp.headers.get("Access-Control-Allow-Origin","")
                  allowed_methods=resp.headers.get("Access-Control-Allow-Methods","")
                  allowed_headers=resp.headers.get("Access-Control-Allow-Headers","")
                  data=json.loads(resp.read(200000)) if method=="POST" else None
              except urllib.error.HTTPError as exc:
                code=exc.code; cors=exc.headers.get("Access-Control-Allow-Origin","")
                allowed_methods=exc.headers.get("Access-Control-Allow-Methods","")
                allowed_headers=exc.headers.get("Access-Control-Allow-Headers","")
                data=None
              except Exception as exc:
                print("YEAR_DIAG_NETWORK",label,method,type(exc).__name__,str(exc)[:150],flush=True)
                failures.append((label,method,"NETWORK"))
                continue
              cors_ok=cors==origin or cors=="*"
              ok=code in (200,204) if method=="OPTIONS" else code==200 and isinstance(data,dict) and data.get("ok") is True
              print("YEAR_DIAG",json.dumps({"origin":label,"method":method,"status":code,"cors":cors,"cors_ok":cors_ok,"methods":allowed_methods,"headers":allowed_headers,"api_ok":data.get("ok") if isinstance(data,dict) else None,"primary_count":len(data.get("primary",{})) if isinstance(data,dict) else None},ensure_ascii=False),flush=True)
              if not ok or not cors_ok:failures.append((label,method,code))
          print("YEAR_DIAG_SUMMARY",json.dumps({"failures":failures},ensure_ascii=False),flush=True)
          if failures:raise SystemExit("Current year guest calculation or browser CORS preflight failed")
          PY
