name: Independently verify Red Flag Love Aug 31 Sep 1-4 on REG.RU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-love-aug31-sep04-readback.yml'
permissions:
  contents: write
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  readback:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Verify REG.RU Love Aug 31 Sep 1-4 readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch REG.RU banks and prove all 45 answers match
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib,hashlib,io,json,os,pathlib,ssl,subprocess
          ids=['first-step','romance','relationship-or-comfort','adult-partner','near-him','hard-moment','relationship-format','family-or-triangle','honest-or-disappear']
          source_files={'31-8':'approved-aug31-20261116.json','1-9':'approved-sep01-20261116.json','2-9':'approved-sep02-20261116.json','3-9':'approved-sep03-20261116.json','4-9':'approved-sep04-20261116.json'}
          days=list(source_files)
          paths=[f'data/redflag/love/{id}.json' for id in ids]
          expected={}
          for day,filename in source_files.items():
              obj=json.loads(pathlib.Path('data/redflag/love/'+filename).read_bytes())
              assert obj['section']=='love' and obj['date']==day and set(obj['texts'])==set(ids)
              expected[day]=obj['texts']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          base=ftp.pwd().rstrip('/')+'/private/numi-account-20261031'
          def read(p):
              dest=io.BytesIO()
              def collect(c):
                  if dest.tell()+len(c)>1500000:raise RuntimeError('FILE_TOO_LARGE:'+p)
                  dest.write(c)
              ftp.retrbinary('RETR '+p,collect)
              return dest.getvalue()
          try:
              manifest=json.loads(read(base+'/store-assets.json'))
              assert manifest.get('version')==2
              for id,p in zip(ids,paths):
                  content=read(base+'/store-content/'+p)
                  bank=json.loads(content)
                  if bank.get('section')!='love' or bank.get('questionId')!=id or bank.get('keyRule')!='day-month':
                      raise RuntimeError('WRONG_REMOTE_BANK:'+id)
                  if manifest['files'].get(p)!=hashlib.sha256(content).hexdigest():
                      raise RuntimeError('INVALID_REMOTE_MANIFEST_HASH:'+p)
                  for day in days:
                      if bank['entries'].get(day)!=expected[day][id]:
                          raise RuntimeError('APPROVED_TEXT_NOT_ON_REG_RU:'+id+':'+day)
                  print('VERIFIED_REMOTE_5_DAYS:'+id,flush=True)
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          marker={
            'section':'love',
            'dates':days,
            'count':45,
            'verified':'REG.RU private bank FTP readback and SHA-256 manifest',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'source':'approved-aug31-sep04-20261116',
          }
          marker_path=pathlib.Path('data/redflag/love/aug31-sep04-reg-ru-verified.json')
          marker_path.write_text(json.dumps(marker,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(marker_path)],check=True)
          subprocess.run(['git','commit','-m','REG.RU independently verified Love Aug 31 Sep 1-4: 45 answers'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('REG_RU_VERIFIED_45_APPROVED_ANSWERS_INDEPENDENTLY',flush=True)
          PY
