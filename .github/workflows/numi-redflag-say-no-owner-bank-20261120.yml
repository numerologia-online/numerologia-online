name: Publish say-no Red Flag owner-only test bank, protected
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-say-no-owner-bank-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the exact patch, back up, and publish just the owner test bank
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import calendar,ftplib,hashlib,io,json,os,ssl,subprocess,time
          from pathlib import Path
          previous='85747794a7047e9113fef3c8f6010254ce14abb2'
          approved='bf20cac3475d05ff31f6874522be013af07402c8'
          bank='redflag-ai-lab/banks/unified-question-answers-v1.json'
          cat='redflag-ai-lab/catalog.json'
          key='flags/say-no'
          title='Уважает женское «нет» или начинает давить?'
          def show(ref,path):return subprocess.check_output(['git','show',ref+':'+path])
          before=json.loads(show(previous,bank))
          after_raw=show(approved,bank)
          after=json.loads(after_raw)
          oldcat=json.loads(show(previous,cat))
          newcat_raw=show(approved,cat)
          newcat=json.loads(newcat_raw)
          if Path(bank).read_bytes()!=after_raw or Path(cat).read_bytes()!=newcat_raw:
              raise RuntimeError('SOURCE_DIFFERS_FROM_APPROVED')
          if set(before)!=set(after) or any(before[k]!=after[k] for k in before if k!='questions'):
              raise RuntimeError('UNRELATED_BANK_METADATA_CHANGE')
          if key in before['questions'] or set(after['questions'])!=set(before['questions'])|{key}:
              raise RuntimeError('WRONG_QUESTION_SET')
          if any(before['questions'][k]!=after['questions'][k] for k in before['questions']):
              raise RuntimeError('PREVIOUS_EIGHT_QUESTIONS_CHANGED')
          entry=after['questions'][key]
          answers=entry['answers']
          valid={f'{d:02d}.{m:02d}' for m in range(1,13) for d in range(1,calendar.monthrange(2024,m)[1]+1)}
          if entry['title']!=title or set(answers)!=valid or len(set(answers.values()))!=366 or any(len(t)<150 for t in answers.values()):
              raise RuntimeError('NEW_366_BANK_INVALID')
          if oldcat['questions']+1!=newcat['questions'] or set(oldcat)!=set(newcat):
              raise RuntimeError('UNEXPECTED_OWNER_CATALOG_COUNT')
          if any(oldcat[k]!=newcat[k] for k in oldcat if k not in ('categories','questions')):
              raise RuntimeError('CATALOG_UNRELATED_FIELD_CHANGED')
          if [x['id'] for x in oldcat['categories']]!=[x['id'] for x in newcat['categories']]:
              raise RuntimeError('CATALOG_SECTION_ORDER_CHANGED')
          for x,y in zip(oldcat['categories'],newcat['categories']):
              if x['id']!='flags':
                  if x!=y: raise RuntimeError('OTHER_CATALOG_SECTION_CHANGED')
              else:
                  if any(x[k]!=y[k] for k in x if k!='questions'):
                      raise RuntimeError('FLAGS_METADATA_CHANGED')
                  if y['questions'][0]!={'id':'say-no','title':title} or y['questions'][1:]!=x['questions']:
                      raise RuntimeError('FLAGS_OTHER_QUESTIONS_CHANGED')
          print('SOURCE_OK say-no=366 unique previous_banks=8 unchanged prompt=unchanged public_shop=unchanged',flush=True)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')
          livebank=root+'/private/numi-account-20261031/redflag-question-banks/unified-question-answers-v1.json'
          livecat=root+'/www/xn--c1adkkdfjbp1a4l.online/redflag-ai-lab/catalog.json'
          backupdir=root+'/site-safeguard-backups'
          def read(path):
              out=io.BytesIO()
              def append(chunk):
                  if out.tell()+len(chunk)>2500000: raise RuntimeError('TOO_LARGE')
                  out.write(chunk)
              ftp.retrbinary('RETR '+path,append)
              return out.getvalue()
          def put(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data: raise RuntimeError('FTPS_READBACK_MISMATCH')
          touched=[]
          try:
              origbank=read(livebank)
              origcat=read(livecat)
              livebankobj=json.loads(origbank)
              livecatobj=json.loads(origcat)
              if livebankobj==after and livecatobj==newcat:
                  print('ALREADY_PUBLISHED_AND_VERIFIED 366/366',flush=True)
              else:
                  if livebankobj!=before or livecatobj!=oldcat:
                      raise RuntimeError('LIVE_BASELINE_MISMATCH_NO_CHANGES')
                  banktext=origbank.decode('utf-8')
                  closing='\n  }\n}\n'
                  if not banktext.endswith(closing):raise RuntimeError('UNEXPECTED_BANK_LAYOUT')
                  block=json.dumps({key:entry},ensure_ascii=False,indent=2)[2:-2]
                  block='\n'.join('  '+v for v in block.split('\n'))
                  desired=(banktext[:-len(closing)]+',\n'+block+closing).encode('utf-8')
                  if json.loads(desired)!=after:raise RuntimeError('PATCH_VALIDATION_FAILED')
                  try:ftp.mkd(backupdir)
                  except ftplib.error_perm as err:
                      if not str(err).startswith('550'):raise
                  stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())
                  digest=hashlib.sha256(origbank+origcat).hexdigest()[:12]
                  put(backupdir+'/redflag-say-no-'+stamp+'-'+digest+'-bank.bak',origbank)
                  put(backupdir+'/redflag-say-no-'+stamp+'-'+digest+'-catalog.bak',origcat)
                  if read(livebank)!=origbank or read(livecat)!=origcat:
                      raise RuntimeError('CONCURRENT_CHANGE')
                  try:
                      touched.append((livebank,origbank))
                      put(livebank,desired)
                      touched.append((livecat,origcat))
                      put(livecat,newcat_raw)
                      if json.loads(read(livebank))!=after or json.loads(read(livecat))!=newcat:
                          raise RuntimeError('AFTER_WRITE_DIFFERS')
                      print('PUBLISHED_AND_VERIFIED flags/say-no 366 dates backup_verified=true previous_8_banks_unchanged=true owner_test_catalog_only=true production_free_answer_unchanged=true model_prompt_unchanged=true',flush=True)
                  except BaseException:
                      for path,data in reversed(touched):
                          try:put(path,data);print('ROLLBACK_SUCCEEDED '+path.split('/')[-1],flush=True)
                          except BaseException as err:print('ROLLBACK_CRITICAL_FAILED '+type(err).__name__,flush=True)
                      raise
          finally:
              try:ftp.quit()
              except BaseException:ftp.close()
          PY
