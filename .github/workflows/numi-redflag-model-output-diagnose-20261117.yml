name: Diagnose Red Flag Gemma model response shape (private credentials)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-model-output-diagnose-20261117.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Run one actual model inference with synthetic date and record safe metadata
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          model='@cf/google/gemma-4-26b-a4b-it'
          endpoint='https://api.cloudflare.com/client/v4/accounts/de77758c4b3efd26fef26ab600cb02a2/ai/run/'+model
          system='Ты опытный нумеролог. Пиши женщине о мужчине как умная, доброжелательная подруга, живо, ясно, без лести. В первом предложении прямо ответь на заданный вопрос. Опирайся на теневые проявления дня и месяца по системе 22 энергий. Не утверждай доказанные поступки. Два абзаца, 750–1100 знаков.'
          user='Вопрос: Скромный мужчина или считает себя подарком судьбы?\nДень рождения мужчины: 9 (энергия 9).\nМесяц рождения мужчины: 9 (энергия 9).\nНапиши ответ только на этот вопрос.'
          body={'messages':[{'role':'system','content':system},{'role':'user','content':user}],
            'temperature':0.82,'max_completion_tokens':730,
            'chat_template_kwargs':{'enable_thinking':False}}
          req=urllib.request.Request(endpoint,data=json.dumps(body,ensure_ascii=False).encode(),method='POST',headers={
            'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json',
            'User-Agent':'NumiOwnerRedFlagModelProbe/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=100) as res:
              status=res.status;result=json.load(res)
          except urllib.error.HTTPError as ex:
            status=ex.code
            try:result=json.loads(ex.read(12000))
            except:result={'non_json_http_error':True}
          top=result.get('result') if isinstance(result,dict) else None
          if not isinstance(top,dict):top={}
          msg=(top.get('choices') or [{}])[0].get('message') or {}
          raw=top.get('response',msg.get('content'))
          answer=raw if isinstance(raw,str) else ''
          print('CF_AI_MODEL_HTTP',status,'success',result.get('success') if isinstance(result,dict) else 'unexpected',
            'top_keys',list(top.keys()),'response_type',type(raw).__name__,
            'response_chars',len(answer),
            'choices',len(top.get('choices') or []),
            'first_choice_keys',list((top.get('choices') or [{}])[0].keys()),
            'first_message_keys',list(msg.keys()),
            'finish_reason',(top.get('choices') or [{}])[0].get('finish_reason'),
            'paragraphs',len([p for p in answer.split('\n\n') if p.strip()]),
            'num_colons',answer.count(':'),'num_emdashes',answer.count('—'),
            'errors',[str(e.get('code')) for e in (result.get('errors') or []) if isinstance(e,dict)]
            if isinstance(result,dict) else [],flush=True)
          if status!=200:raise RuntimeError('MODEL_RESPONSE_UNAVAILABLE_'+str(status))
          PY
