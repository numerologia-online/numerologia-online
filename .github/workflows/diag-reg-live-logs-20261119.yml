name: READ ONLY inspect REG.RU November 19 access and error log summaries
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-reg-live-logs-20261119.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate status/error codes only and compare access-file metadata
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import os,ssl,ftplib,io,re,collections,datetime,hashlib
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          f.connect('server172.hosting.reg.ru',21)
          f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          f.prot_p();f.set_pasv(True);f.voidcmd('TYPE I')
          home=f.pwd().rstrip('/')
          host='xn--c1adkkdfjbp1a4l.online'
          web=home+'/www/'+host+'/'
          def read(path,limit=30_000_000):
              out=io.BytesIO()
              def add(data):
                  if out.tell()+len(data)>limit:raise RuntimeError('LOG_TOO_LARGE')
                  out.write(data)
              try:f.retrbinary('RETR '+path,add)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return out.getvalue()
          for path in [web+'.htaccess',web+'index.html',web+'app.js',home+'/site-safeguard-backups/20261105T112944Z-before-legacy-api-exemption-htaccess']:
              label=path.rsplit('/',1)[-1]
              try: print('MDTM',label, f.sendcmd('MDTM '+path),flush=True)
              except Exception as e:print('MDTM',label,type(e).__name__,flush=True)
              try: print('SIZE',label,f.size(path),flush=True)
              except Exception as e:print('SIZE',label,type(e).__name__,flush=True)
          try:
              path=home+'/site-safeguard-backups'
              files=[x.split('/')[-1] for x in f.nlst(path)]
              for k in ['htaccess','20261118','20261119']:
                  hits=[a for a in files if k in a.lower()]
                  print('BACKUP_NAMED',k,len(hits),hits[:25],flush=True)
          except Exception as e:print('BACKUP_LIST_UNAVAILABLE',type(e).__name__,flush=True)
          access=read(home+'/logs/'+host+'.access.log')
          if access is not None:
              rows=access.decode('utf-8','replace').splitlines()
              print('ACCESS_FILE_TOTAL_BYTES_LINES',len(access),len(rows),flush=True)
              tally=collections.Counter();failed=collections.Counter();hours=collections.Counter();formats=collections.Counter()
              for row in rows:
                  # Common/combined log. Do not emit IPs, raw URLs, IDs or queries.
                  d=re.search(r'\[(\d{2}/\w{3}/2026):(\d{2}):',row)
                  a=re.search(r'"(GET|POST|HEAD|OPTIONS)\s+([^\s]+)\s+HTTP/[^"]+"\s+(\d{3})\s',row)
                  if not a:formats['unparsed']+=1;continue
                  method,route,status=a.groups()
                  category=('api' if route.startswith('/api/') else
                     'static' if route.endswith(('.js','.css','.png','.woff2','.svg','.webp')) else
                     'homepage' if route.split('?')[0] in ('/','/index.html') else 'other')
                  key=d.group(1)+' '+d.group(2) if d else 'unknown'
                  tally[(key,status[0]+'xx',category)]+=1
                  hours[(key,status)]+=1
                  if int(status)>=400:
                      failed[(status,category)]+=1
              print('ACCESS_TOTAL_PARSED',sum(tally.values()),'UNPARSED',formats['unparsed'],flush=True)
              for dayhour in sorted(set(k for k,_,_ in tally)):
                  good=sum(v for (k,s,c),v in tally.items() if k==dayhour and s in ('2xx','3xx'))
                  bad=sum(v for (k,s,c),v in tally.items() if k==dayhour and s in ('4xx','5xx'))
                  print('HOUR',dayhour,'ok',good,'bad',bad,flush=True)
              print('ACCESS_FAILURE_CLASSES',failed.most_common(25),flush=True)
          else: print('ACCESS_LOG_ABSENT',flush=True)
          errors=read(home+'/logs/'+host+'.error.log')
          if errors is not None:
              lines=errors.decode('utf-8','replace').splitlines()
              print('ERROR_FILE_TOTAL_BYTES_LINES',len(errors),len(lines),flush=True)
              summary=collections.Counter()
              for s in lines:
                  if 'PHP Fatal error' in s:category='php_fatal'
                  elif 'PHP Warning' in s:category='php_warning'
                  elif 'PHP Notice' in s:category='php_notice'
                  elif 'client denied' in s.lower():category='client_denied'
                  elif 'permission denied' in s.lower():category='permission_denied'
                  elif 'upstream' in s.lower():category='upstream'
                  elif 'rewrite' in s.lower():category='rewrite'
                  elif 'mod_security' in s.lower() or 'modsecurity' in s.lower():category='modsecurity'
                  else:category='other'
                  dt=re.search(r'\[(?:\w+\s+)?(?:\w+\s+)?(Nov\s+\d+|2026-11-\d+)[^\]]*\]',s)
                  summary[(dt.group(1) if dt else 'undated',category)]+=1
              print('ERROR_SUMMARY',summary.most_common(30),flush=True)
          else:print('ERROR_LOG_ABSENT',flush=True)
          f.quit()
          print('READONLY_LOG_AUDIT_COMPLETE',flush=True)
          PY
