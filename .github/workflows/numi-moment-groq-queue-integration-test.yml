name: Verify Moment 300 GitHub Groq queue end to end (owner data untouched)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-moment-groq-queue-integration-test.yml
permissions:
  contents: read
concurrency:
  group: moment-300-groq-queue-processor
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enqueue synthetic nines and thirties with no personal data, execute worker, verify private result
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import importlib.util,ftplib,ssl,io,os,json,secrets
          spec=importlib.util.spec_from_file_location('moment_worker','moment/process-owner-queue.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          root=ftp.pwd().rstrip('/')+'/private/numi-moment-groq/jobs'
          jid=secrets.token_hex(16)
          pending=root+'/'+jid+'.pending.json'
          result=root+'/'+jid+'.result.json'
          content=json.dumps({
            'question_id':'love-001','title':'Что он чувствует ко мне?',
            'birth_date':'2000-09-09','other_date':'2000-10-31',
            'moment':None,'created_utc':'synthetic-test'
          },ensure_ascii=False).encode('utf8')
          try:
            ftp.storbinary('STOR '+pending,io.BytesIO(content))
            ftp.quit()
            m.process()
            f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
            f.connect('server172.hosting.reg.ru',21)
            f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
            f.prot_p();f.set_pasv(True)
            try:
              data=io.BytesIO()
              f.retrbinary('RETR '+result,data.write)
              parsed=json.loads(data.getvalue())
              assert parsed.get('ok') is True, 'GROQ_DID_NOT_GENERATE'
              answer=parsed.get('answer','')
              assert len(answer)>170,'RESPONSE_TOO_SHORT'
              assert '—' not in answer,'LONG_DASH_NOT_CLEANED'
              assert 'доказательство' not in answer.lower(),'DISCLOSURE_IN_ANSWER'
              print('MOMENT_QUEUE_END_TO_END_TEST_OK real_groq=true private_ftp=true dash_clean=true chars='+str(len(answer)))
            finally:
              try:f.delete(result)
              except ftplib.all_errors:pass
              try:f.delete(pending)
              except ftplib.all_errors:pass
              try:f.quit()
              except Exception:f.close()
          except BaseException:
            try:
              clean=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
              clean.connect('server172.hosting.reg.ru',21)
              clean.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
              clean.prot_p();clean.set_pasv(True)
              for name in (pending,root+'/'+jid+'.working.json',result):
                try:clean.delete(name)
                except ftplib.all_errors:pass
              clean.quit()
            except Exception:pass
            raise
          PY
