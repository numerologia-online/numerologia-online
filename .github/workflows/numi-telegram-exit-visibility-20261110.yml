name: Publish safe Telegram account exit UI
on:
  push:
    paths:
      - .github/workflows/numi-telegram-exit-visibility-20261110.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Telegram exit UI on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check only Telegram visibility has changed
        run: |
          set -euo pipefail
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-telegram-exit-visibility-20261110.py
          python3 - <<'PY'
          import subprocess, pathlib
          old=subprocess.check_output(["git","show","1fe10e979e2d2577454c337ccb1a578e70fd684c^:account-browser.js"])
          new=pathlib.Path("account-browser.js").read_bytes()
          original=b'for(const exit of logoutControls) exit.hidden=!(tg||current);'
          replacement=b'for(const exit of logoutControls) exit.hidden=(tg||!current);'
          assert old.count(original)==1
          assert new==old.replace(original,replacement)
          orig_page=subprocess.check_output(["git","show","816c2f592c6ff2f558a75939e1221197441e9b3b^:index.html"])
          fresh_page=pathlib.Path("index.html").read_bytes()
          assert fresh_page==orig_page.replace(b'account-browser.js?v=wallet-card-singleline-20261110',b'account-browser.js?v=telegram-logout-hidden-20261110')
          print("EXACT_UI_CHANGE_ONLY",flush=True)
          PY
      - name: Publish with backup and HTTPS check
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-telegram-exit-visibility-20261110.py
