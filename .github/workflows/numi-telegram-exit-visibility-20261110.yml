name: Publish clear centered VPN notice to REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-telegram-exit-visibility-20261110.yml
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish centered VPN notice on REG.RU'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only the warning text and CSS changed
        run: |
          set -euo pipefail
          node --check account-browser.js
          python3 -m py_compile account-service/deploy-telegram-exit-visibility-20261110.py
          python3 - <<'PY'
          import subprocess, pathlib
          original=subprocess.check_output(["git","show","34ba2e0cc52241d699c37a3c1475cf6339ceb076^:account-browser.js"])
          updated=pathlib.Path("account-browser.js").read_bytes()
          a=original.splitlines()
          b=updated.splitlines()
          assert len(a)==len(b)
          edits=[(x,y) for x,y in zip(a,b) if x!=y]
          assert len(edits)==2
          assert b'.numi-wallet-vpn-warning{' in edits[0][0]
          assert b'.numi-wallet-vpn-warning{' in edits[0][1]
          assert b'background:#e6f0ea' in edits[0][1]
          assert b'width:fit-content' in edits[0][1]
          assert b'color:#173e30' in edits[0][1]
          assert 'vpnWarning.textContent="Если окно оплаты зависает, отключите VPN."'.encode() in edits[1][0]
          assert 'vpnWarning.textContent="Зависла оплата? Отключите VPN."'.encode() in edits[1][1]
          assert b'for(const exit of logoutControls) exit.hidden=(tg||!current);' in updated
          old_html=subprocess.check_output(["git","show","f7a27906784fb07f0c872fc1ec80506bf1eefbfd^:index.html"])
          new_html=pathlib.Path("index.html").read_bytes()
          assert new_html==old_html.replace(b'account-browser.js?v=vpn-soft-dark-20261110',b'account-browser.js?v=vpn-centered-notice-20261110')
          print("CENTERED_WALLET_NOTICE_ONLY",flush=True)
          PY
      - name: Deploy verified notice with guarded backup and HTTPS check
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-telegram-exit-visibility-20261110.py
