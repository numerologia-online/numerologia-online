name: Read-only verify unique Yes No answers at 13:51
on:
  push:
    paths:
      - .github/workflows/numi-yesno-1351-readonly-20261103.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Read-only inspect live Yes No at 13:51'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public answers at 13:51 without authentication, writing no site files
        run: |
          python3 - <<'PY'
          import collections,concurrent.futures,json,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          base='https://xn--c1adkkdfjbp1a4l.online/api/numi-yesno-answer.php'
          samples=['yn-man-001','yn-man-002','yn-man-003','yn-man-019',
                   'yn-love-001','yn-love-002','yn-work-001','yn-work-002',
                   'yn-money-001','yn-money-002','yn-choice-001','yn-choice-002',
                   'yn-future-001','yn-future-002','yn-home-001','yn-home-002']
          def fetch(q):
              url=base+'?'+urllib.parse.urlencode({'question':q,'time':'13:51','audit':'20261103'})
              req=urllib.request.Request(url,headers={'User-Agent':'NumiYesNoQualityAudit/1.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=17) as response:
                      code=response.status;data=json.load(response)
              except urllib.error.HTTPError as err:
                  code=err.code
                  try:data=json.load(err)
                  except: data={}
              except Exception as err:
                  return {'id':q,'error':type(err).__name__}
              return {'id':q,'http':code,'id_returned':data.get('question_id'),'answer':data.get('answer'),'error':data.get('error')}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              results=list(executor.map(fetch,samples))
          for item in results:
              print('LIVE_SAMPLE',item['id'],'http',item.get('http'),
                    'question_id',item.get('id_returned'),
                    'verdict',str(item.get('answer') or '').split('.',1)[0],
                    'answer_chars',len(item.get('answer') or ''),
                    'error',item.get('error'),flush=True)
          ok=[x for x in results if x.get('http')==200 and x.get('id_returned')==x['id'] and isinstance(x.get('answer'),str)]
          groups=collections.defaultdict(list)
          for item in ok:
              groups[item['answer']].append(item['id'])
          print('LIVE_1351_SUMMARY',json.dumps({
              'tested':len(samples),'valid_distinct_ids':len(ok),
              'unique_full_answers':len(groups),
              'exact_duplicate_groups':[ids for ids in groups.values() if len(ids)>1],
              'failures':[{k:v for k,v in item.items() if k!='answer'} for item in results if item not in ok]
          },ensure_ascii=False),flush=True)
          if len(ok)!=len(samples) or len(groups)!=len(samples):
              raise RuntimeError('Read-only 13:51 integrity audit failed; manual diagnosis required')
          PY
