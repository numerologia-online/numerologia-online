name: Diagnose actual Red Flag AI output from REG.RU, NO customer edits
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numi-redflag-real-ai-probe-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual Cloudflare AI via ephemeral secret-guarded PHP, remove it
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 .github/scripts/numi-redflag-live-ai-diagnose.py
