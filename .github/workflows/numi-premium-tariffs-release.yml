name: Publish premium account tariffs on REG.RU
on:
  push:
    paths:
      - .github/workflows/numi-premium-tariffs-release.yml
permissions:
  contents: read
concurrency:
  group: numi-premium-tariffs-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish premium tariff design on REG.RU'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release script and source markup
        run: |
          python3 -m py_compile account-service/deploy-premium-tariffs.py
          grep -q 'numi-premium-tariffs-20261031' index.html
      - name: Publish only pricing layout with backup and rollback
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 -u account-service/deploy-premium-tariffs.py
