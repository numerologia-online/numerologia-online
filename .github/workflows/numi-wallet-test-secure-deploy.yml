name: REG.RU REAL wallet, fiscal worker and YooKassa verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-wallet-test-secure-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm_real_code_only:
        description: 'Publish the existing REAL wallet PHP to REG.RU (does not enable charges)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish-real-wallet-code:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && (github.event.head_commit.message == 'Publish existing real wallet PHP to REG.RU with rollback' || (github.event.head_commit.message == 'Configure existing real wallet fiscal VAT codes on REG.RU' || github.event.head_commit.message == 'Probe existing YooKassa sandbox advance receipt code without payment' || github.event.head_commit.message == 'Configure full refund receipt settings on REG.RU' || github.event.head_commit.message == 'Activate existing real wallet prepayment on REG.RU' || github.event.head_commit.message == 'Diagnose deployed live wallet status without charging' || github.event.head_commit.message == 'Verify full live wallet and club status query' || github.event.head_commit.message == 'Audit live wallet account API files on REG.RU' || github.event.head_commit.message == 'Sync existing live account PHP versions on REG.RU' || github.event.head_commit.message == 'Trace wallet status across accounts and deployed JS' || github.event.head_commit.message == 'Inspect exact live account browser JS delta' || github.event.head_commit.message == 'Deploy live wallet browser JS and cache bust' || github.event.head_commit.message == 'Publish dedicated wallet topup screen on REG.RU'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_real_code_only == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guarded REG.RU REAL wallet deployment
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish existing real wallet PHP to REG.RU with rollback' || github.event.head_commit.message == 'Configure full refund receipt settings on REG.RU'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          php -l account-service/private/wallet-real.php
          php -l account-service/private/wallet-real-payment.php
          grep -q 'function naRealRefundReceiptSettings' account-service/private/wallet-real-payment.php
          grep -q 'yookassa_full_auto' account-service/private/wallet-real-payment.php
          php -l account-service/private/wallet.php
          python3 -m py_compile scripts/deploy-real-wallet-reg-ru-20261108.py
          python3 -u scripts/deploy-real-wallet-reg-ru-20261108.py
      - name: Install REAL wallet receipt and approved-refund scheduler on REG.RU
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish existing real wallet PHP to REG.RU with rollback'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          php -l account-service/private/wallet-real-worker.php
          php -l account-service/public/numi-real-worker.php
          python3 -m py_compile scripts/deploy-real-wallet-worker-20261108.py
          python3 -u scripts/deploy-real-wallet-worker-20261108.py
      - name: Privately stage live YooKassa keys if separately configured
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish existing real wallet PHP to REG.RU with rollback'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          NUMI_YOOKASSA_LIVE_SHOP_ID: ${{ secrets.NUMI_YOOKASSA_LIVE_SHOP_ID }}
          NUMI_YOOKASSA_LIVE_SECRET_KEY: ${{ secrets.NUMI_YOOKASSA_LIVE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/stage-real-yookassa-credentials-20261108.py
          python3 -u scripts/stage-real-yookassa-credentials-20261108.py

      - name: Set confirmed non-VAT codes in existing private REG.RU wallet config (charges stay disabled)
        if: github.event_name == 'push' && github.event.head_commit.message == 'Configure existing real wallet fiscal VAT codes on REG.RU'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, ssl, os, io, re, hashlib, hmac, json, urllib.request
          host='server172.hosting.reg.ru'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect(host,21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          config=home+'/private/numi-wallet-live/config.local.php'
          backup=home+'/private/numi-wallet-live/config.local.php.before-vat-20261108.bak'
          def read(path):
              b=io.BytesIO()
              try: ftp.retrbinary('RETR '+path,b.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'): return None
                  raise
              if len(b.getvalue())>10000: raise RuntimeError('PRIVATE_CONFIG_TOO_LARGE')
              return b.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data: raise RuntimeError('PRIVATE_CONFIG_READBACK_MISMATCH')
          try:
              original=read(config)
              if not original: raise RuntimeError('PRIVATE_LIVE_CONFIG_MISSING')
              value=original.decode('utf-8')
              required={
                'wallet_mode':r"['\"]wallet_mode['\"]\s*=>\s*['\"]disabled['\"]",
                'real_wallet_enabled':r"['\"]real_wallet_enabled['\"]\s*=>\s*false",
                'provider_test_mode':r"['\"]provider_test_mode['\"]\s*=>\s*false",
                'shop_id':r"['\"]shop_id['\"]\s*=>\s*['\"]1515851['\"]",
                'live_secret':r"['\"]secret_key['\"]\s*=>\s*['\"]live_[A-Za-z0-9_-]{12,480}['\"]",
              }
              if not all(re.search(p,value) for p in required.values()):
                  raise RuntimeError('PRIVATE_LIVE_CONFIG_NOT_EXPECTED_DISABLED_BASELINE')
              for flag in ['fiscalization_verified','refunds_verified','advance_offset_receipts_verified','offset_receipt_worker_verified','launch_approved']:
                  if re.search(r"['\"]"+flag+r"['\"]\s*=>\s*true",value):
                      raise RuntimeError('UNEXPECTED_ACTIVE_LIVE_FLAG')
              names=['advance_receipt_vat_code','offset_receipt_vat_code']
              present=[bool(re.search(r"['\"]"+n+r"['\"]\s*=>",value)) for n in names]
              if all(present):
                  if not all(re.search(r"['\"]"+n+r"['\"]\s*=>\s*1\s*[,\n]",value) for n in names):
                      raise RuntimeError('VAT_CODES_EXIST_BUT_DIFFER')
                  print('REAL_WALLET_VAT_ALREADY_CONFIGURED_NO_WRITE')
              else:
                  if any(present) or value.count('\n];')!=1:
                      raise RuntimeError('CONFIG_FORMAT_UNRECOGNIZED_NO_WRITE')
                  new=value.replace('\n];',"\n    'advance_receipt_vat_code' => 1,\n    'offset_receipt_vat_code' => 1,\n];",1).encode('utf-8')
                  existing_backup=read(backup)
                  if existing_backup is not None:
                      raise RuntimeError('EXISTING_FISCAL_BACKUP_WOULD_BE_OVERWRITTEN')
                  write(backup,original)
                  try: write(config,new)
                  except BaseException:
                      write(config,original)
                      raise
                  print('PRIVATE_LIVE_VAT_CODES_SET_NO_LIVE_ACTIVATION')
              digest=hmac.new(os.environ['REG_FTP_PASSWORD'].encode(),
                  b'numi-real-wallet-worker-v1@xn----8sbhhqijddjgdebdz2c2o.xn--p1ai',hashlib.sha256).hexdigest()
              req=urllib.request.Request(
                  'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/api/numi-real-worker.php',
                  data=b'{"action":"probe"}',
                  headers={'Content-Type':'application/json','X-Numi-Worker-Token':digest},method='POST')
              with urllib.request.urlopen(req,timeout=35) as response:
                  status=json.loads(response.read(3000))
              if not (status.get('ok') is True and status.get('vat_codes_set') is True
                      and status.get('provider_authenticated') is True
                      and status.get('wallet_mode_live') is False):
                  raise RuntimeError('PRIVATE_FISCAL_PROBE_NOT_VERIFIED')
              print('REG_RU_VAT_AND_LIVE_PROVIDER_VERIFIED_CHARGING_STILL_DISABLED')
          finally:
              try: ftp.quit()
              except BaseException: ftp.close()
          PY

      - name: Probe actual TEST YooKassa receipt acceptance (NO card charged, no live config edit)
        if: github.event_name == 'push' && github.event.head_commit.message == 'Probe existing YooKassa sandbox advance receipt code without payment'
        env:
          NUMI_YOOKASSA_TEST_SECRET_KEY_1521071: ${{ secrets.NUMI_YOOKASSA_TEST_SECRET_KEY_1521071 }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,io,ftplib,ssl,json,hashlib,base64,urllib.request,urllib.error
          key=os.environ.get('NUMI_YOOKASSA_TEST_SECRET_KEY_1521071','')
          if not key.startswith('test_'):
              f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
              f.connect('server172.hosting.reg.ru',21)
              f.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD']); f.prot_p(); f.set_pasv(True)
              try:
                  home=f.pwd().rstrip('/')
                  buf=io.BytesIO()
                  f.retrbinary('RETR '+home+'/private/numi-wallet-test-20261106/config.local.php',buf.write)
                  cfg=buf.getvalue().decode('utf-8')
                  m=re.search(r"['\"]secret_key['\"]\s*=>\s*['\"](test_[A-Za-z0-9_-]{12,480})['\"]",cfg)
                  key=m.group(1) if m else ''
              finally: f.quit()
          if not key.startswith('test_'): raise RuntimeError('TEST_KEY_NOT_CONFIGURED')
          cred=base64.b64encode(('1521071:'+key).encode('utf-8')).decode('ascii')
          sha=os.environ['GITHUB_SHA']
          results={}
          for mode in ('advance','full_prepayment'):
              value='1.00'
              payload={
                  'amount':{'value':value,'currency':'RUB'},
                  'capture':True,
                  'confirmation':{'type':'redirect','return_url':'https://xn----8sbhhqijddjgdebdz2c2o.xn--p1ai/'},
                  'payment_method_data':{'type':'bank_card'},
                  'description':'Тест чеков предоплаты без списания',
                  'receipt':{'customer':{'email':'receipt-test@example.com'},'items':[
                      {'description':'Тест цифровой услуги', 'quantity':1.0,
                       'amount':{'value':value,'currency':'RUB'},'vat_code':1,
                       'payment_mode':mode,'payment_subject':'payment' if mode=='advance' else 'service'}
                  ]}
              }
              ik=hashlib.sha256(('real-wallet-fiscal-probe:'+sha+':'+mode).encode()).hexdigest()
              req=urllib.request.Request('https://api.yookassa.ru/v3/payments',
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),method='POST',
                  headers={'Authorization':'Basic '+cred,'Content-Type':'application/json','Idempotence-Key':ik})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:
                      code=res.status; obj=json.loads(res.read(10000))
              except urllib.error.HTTPError as res:
                  code=res.code
                  try: obj=json.loads(res.read(10000))
                  except ValueError: obj={}
              summary={'http_status':code, 'accepted': code in (200,201),
                       'response_code':str(obj.get('code',''))[:100],
                       'error_parameter':str(obj.get('parameter',''))[:120]}
              results[mode]=summary
              print('YOOKASSA_SANDBOX_RECEIPT_MODE',mode,json.dumps(summary,ensure_ascii=False))
          print('YOOKASSA_SANDBOX_PROBE_COMPLETE_NO_REAL_PAYMENT')
          PY

      - name: Set automatic FULL refund receipt policy in existing REG.RU private config
        if: github.event_name == 'push' && github.event.head_commit.message == 'Configure full refund receipt settings on REG.RU'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, ssl, io, os, re
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect('server172.hosting.reg.ru',21)
          ftp.login(os.environ['REG_FTP_USER'],os.environ['REG_FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          src=home+'/private/numi-wallet-live/config.local.php'
          backup=home+'/private/numi-wallet-live/config.local.php.before-refund-receipt-20261108.bak'
          def read(p):
              b=io.BytesIO()
              try: ftp.retrbinary('RETR '+p,b.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'): return None
                  raise
              if len(b.getvalue())>12000: raise RuntimeError('PRIVATE_CONFIG_TOO_LARGE')
              return b.getvalue()
          def put(p,data):
              ftp.storbinary('STOR '+p,io.BytesIO(data))
              if read(p)!=data: raise RuntimeError('PRIVATE_CONFIG_READBACK_MISMATCH')
          try:
              old=read(src)
              if old is None: raise RuntimeError('PRIVATE_CONFIG_MISSING')
              text=old.decode('utf-8')
              required=[
                r"['\"]wallet_mode['\"]\s*=>\s*['\"]disabled['\"]",
                r"['\"]real_wallet_enabled['\"]\s*=>\s*false",
                r"['\"]provider_test_mode['\"]\s*=>\s*false",
                r"['\"]advance_receipt_vat_code['\"]\s*=>\s*1",
                r"['\"]offset_receipt_vat_code['\"]\s*=>\s*1",
                r"['\"]secret_key['\"]\s*=>\s*['\"]live_[A-Za-z0-9_-]{12,480}['\"]",
              ]
              if not all(re.search(p,text) for p in required):
                  raise RuntimeError('REFUND_CONFIG_PRECONDITIONS_NOT_MET')
              names=['refund_receipt_mode','refund_receipt_status_check']
              presence=[bool(re.search(r"['\"]"+x+r"['\"]\s*=>",text)) for x in names]
              if all(presence):
                  if not (re.search(r"['\"]refund_receipt_mode['\"]\s*=>\s*['\"]yookassa_full_auto['\"]",text)
                      and re.search(r"['\"]refund_receipt_status_check['\"]\s*=>\s*true",text)):
                      raise RuntimeError('REFUND_SETTINGS_ALREADY_DIFFER')
                  print('FULL_REFUND_RECEIPT_SETTINGS_ALREADY_CURRENT')
              elif any(presence):
                  raise RuntimeError('PARTIAL_REFUND_CONFIG_MANUAL_REVIEW')
              else:
                  if text.count('\n];')!=1 or read(backup) is not None:
                      raise RuntimeError('UNEXPECTED_CONFIG_FORMAT_OR_EXISTING_BACKUP')
                  new=text.replace('\n];',"\n    'refund_receipt_mode' => 'yookassa_full_auto',\n    'refund_receipt_status_check' => true,\n];",1).encode('utf-8')
                  put(backup,old)
                  try: put(src,new)
                  except BaseException:
                      put(src,old)
                      raise
                  print('FULL_REFUND_RECEIPT_SETTINGS_PUBLISHED')
              if not (re.search(r"['\"]wallet_mode['\"]\s*=>\s*['\"]disabled['\"]",read(src).decode('utf-8'))
                  and b'\x27refund_receipt_status_check\x27 => true' in read(src)):
                  raise RuntimeError('REFUND_RECEIPT_SERVER_VERIFICATION_FAILED')
              print('FULL_REFUND_RECEIPT_CONFIG_VERIFIED_NO_LIVE_CHARGING')
          finally:
              try: ftp.quit()
              except BaseException: ftp.close()
          PY

      - name: Enable existing REAL wallet configuration on REG.RU (production prepayments)
        if: github.event_name == 'push' && github.event.head_commit.message == 'Activate existing real wallet prepayment on REG.RU'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib,ssl,io,os,re,hashlib,hmac,json,urllib.request,urllib.error
          host='server172.hosting.reg.ru'
          domain='xn----8sbhhqijddjgdebdz2c2o.xn--p1ai'
          pw=os.environ['REG_FTP_PASSWORD']
          token=hmac.new(pw.encode(),('numi-real-wallet-worker-v1@'+domain).encode(),hashlib.sha256).hexdigest()
          url='https://'+domain+'/api/numi-real-worker.php'
          def call(action):
              req=urllib.request.Request(url,
                data=json.dumps({'action':action}).encode(),
                headers={'Content-Type':'application/json','X-Numi-Worker-Token':token},
                method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=42) as res:
                      status=res.status; obj=json.loads(res.read(6000))
              except urllib.error.HTTPError as ex:
                  status=ex.code; obj=json.loads(ex.read(6000))
              return status,obj
          # Refuse to accept the very first customer charge if provider is unreachable.
          # Preflight is a no-charge credential check; any exception leaves server unchanged.
          status,preflight=call('probe')
          if (status!=200 or not preflight.get('ok') or not preflight.get('provider_authenticated')
              or not preflight.get('private_credentials_present') or not preflight.get('vat_codes_set')
              or preflight.get('provider_test_mode_false') is not True):
              raise RuntimeError('REAL_LIVE_PREFLIGHT_FAILED_NO_CHANGES')
          print('REAL_PROVIDER_AUTHENTICATED_PRE_ACTIVATION')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35)
          ftp.connect(host,21)
          ftp.login(os.environ['REG_FTP_USER'],pw)
          ftp.prot_p();ftp.set_pasv(True)
          home=ftp.pwd().rstrip('/')
          cfg=home+'/private/numi-wallet-live/config.local.php'
          bak=home+'/private/numi-wallet-live/config.local.php.before-live-20261108.bak'
          def read(path):
              buf=io.BytesIO()
              try: ftp.retrbinary('RETR '+path,buf.write)
              except ftplib.error_perm as ex:
                  if str(ex).startswith('550'):return None
                  raise
              if buf.tell()>12000:raise RuntimeError('PRIVATE_LIVE_CONFIG_TOO_LARGE')
              return buf.getvalue()
          def write(path,data):
              ftp.storbinary('STOR '+path,io.BytesIO(data))
              if read(path)!=data:raise RuntimeError('REG_RU_WRITE_UNVERIFIED')
          changed=False
          try:
              old=read(cfg)
              if not old:raise RuntimeError('REAL_WALLET_CONFIG_NOT_PRESENT')
              src=old.decode('utf-8')
              required={
                  'shop':r"['\"]shop_id['\"]\s*=>\s*['\"]1515851['\"]",
                  'secret':r"['\"]secret_key['\"]\s*=>\s*['\"]live_[A-Za-z0-9_-]{12,480}['\"]",
                  'provider':r"['\"]provider_test_mode['\"]\s*=>\s*false",
                  'vat_advance':r"['\"]advance_receipt_vat_code['\"]\s*=>\s*1",
                  'vat_offset':r"['\"]offset_receipt_vat_code['\"]\s*=>\s*1",
                  'refund_mode':r"['\"]refund_receipt_mode['\"]\s*=>\s*['\"]yookassa_full_auto['\"]",
                  'refund_status':r"['\"]refund_receipt_status_check['\"]\s*=>\s*true",
              }
              if not all(re.search(pattern,src) for pattern in required.values()):
                  raise RuntimeError('REAL_ACTIVATION_PREREQUISITES_MISSING')
              flags=['real_wallet_enabled','fiscalization_verified','refunds_verified',
                     'advance_offset_receipts_verified','offset_receipt_worker_verified',
                     'refund_worker_verified','advance_receipt_reviewed','offset_receipt_reviewed',
                     'launch_approved']
              is_live=bool(re.search(r"['\"]wallet_mode['\"]\s*=>\s*['\"]live['\"]",src))
              if is_live:
                  if not all(re.search(r"['\"]"+n+r"['\"]\s*=>\s*true",src) for n in flags):
                      raise RuntimeError('REAL_WALLET_PARTIALLY_LIVE_REVIEW_REQUIRED')
                  print('REAL_WALLET_ALREADY_ACTIVE')
              else:
                  pattern=r"(['\"]wallet_mode['\"]\s*=>\s*)['\"]disabled['\"]"
                  src,n=re.subn(pattern,r"\g<1>'live'",src)
                  if n!=1:raise RuntimeError('REAL_WALLET_MODE_NOT_EXACTLY_DISABLED')
                  for name in flags:
                      patt=r"(['\"]"+name+r"['\"]\s*=>\s*)false\b"
                      src,n=re.subn(patt,r'\g<1>true',src)
                      if n!=1:
                          if re.search(r"['\"]"+name+r"['\"]\s*=>",src):
                              raise RuntimeError('LIVE_FLAG_VALUE_UNEXPECTED_'+name)
                          if src.count('\n];')!=1:
                              raise RuntimeError('LIVE_CONFIG_FORMAT_UNEXPECTED')
                          src=src.replace('\n];',"\n    '"+name+"' => true,\n];",1)
                  new=src.encode('utf-8')
                  if read(bak) is not None:raise RuntimeError('LIVE_BACKUP_ALREADY_EXISTS')
                  write(bak,old)
                  if read(cfg)!=old:raise RuntimeError('CONCURRENT_LIVE_CONFIG_CHANGE')
                  try:
                      write(cfg,new); changed=True
                  except BaseException:
                      write(cfg,old)
                      raise
                  print('REAL_WALLET_LIVE_FLAGS_ACTIVATED')
              status,probe=call('probe')
              if (status!=200 or probe.get('wallet_mode_live') is not True
                  or probe.get('provider_authenticated') is not True
                  or probe.get('vat_codes_set') is not True
                  or not all(probe.get('flags',{}).get(n) is True for n in flags)):
                  raise RuntimeError('ACTIVATION_PROBE_FAILED')
              status,tick=call('tick')
              if status!=200 or tick.get('ok') is not True:
                  raise RuntimeError('LIVE_WORKER_TICK_FAILED')
              print('REAL_WALLET_ACTIVATION_AND_WORKER_CONFIRMED')
          except BaseException:
              if changed:
                  write(cfg,old)
                  print('REAL_WALLET_LIVE_FLAGS_ROLLED_BACK')
              raise
          finally:
              try: ftp.quit()
              except BaseException:ftp.close()
          PY

      - name: Read-only wallet status diagnostic on REG.RU
        if: github.event_name == 'push' && (github.event.head_commit.message == 'Diagnose deployed live wallet status without charging' || github.event.head_commit.message == 'Verify full live wallet and club status query' || github.event.head_commit.message == 'Trace wallet status across accounts and deployed JS')
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          php -l account-service/public/numi-real-worker.php
          python3 - <<'PY'
          import os,io,ssl,ftplib,subprocess,json,hashlib,hmac,urllib.request
          src='account-service/public/numi-real-worker.php'
          proposed=open(src,'rb').read()
