name: REG.RU unified wallet release preflight (TEST ONLY, NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-wallet-test-secure-deploy.yml'
      - 'account-service/private/wallet.php'
      - 'account-service/private/wallet-real.php'
      - 'account-service/private/wallet-real-payment.php'
      - 'account-service/private/core.php'
      - 'account-service/private/subscriptions.php'
      - 'account-service/tests/real-wallet.php'
      - 'account-service/tests/real-wallet-payment.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  current-wallet-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: numi_wallet_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NUMI_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=numi_wallet_release_test;charset=utf8mb4"
      NUMI_TEST_MYSQL_USER: root
      NUMI_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate current main, not deleted historical pilot branches
        shell: bash
        run: |
          set -euo pipefail
          for p in account-service/private/{core,wallet,wallet-real,wallet-real-payment,subscriptions,fulfillment}.php account-service/tests/{store,subscriptions,real-wallet,real-wallet-payment}.php; do
            php -l "$p"
          done
          node --check account-browser.js
          node --input-type=module --check < wallet-client.js
          grep -q 'naRealWalletServe' account-service/private/wallet.php
          grep -q 'REAL_REFUNDS_REQUIRE_FISCAL_REVIEW' account-service/private/wallet-real.php
          grep -q 'REAL_FISCAL_ADVANCE_BUILDER_NOT_APPROVED' account-service/private/wallet-real-payment.php
          echo "CURRENT_MAIN_SOURCE_VALIDATED"
      - name: Verify existing product catalog and subscription behavior
        shell: bash
        run: |
          set -euo pipefail
          php account-service/tests/store.php
          php account-service/tests/subscriptions.php
      - name: Check isolated real and test wallets without money transfers
        shell: bash
        run: |
          set -euo pipefail
          php account-service/tests/real-wallet.php
      - name: Release gate - explicitly no REG.RU writes before end-to-end readiness
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"mode": "check"' .github/reg-ru-publish.json
          echo "NO_DEPLOY: current code reviewed by CI, but production fiscal settlement, refunds and real subscription renewal are not release-approved."
          echo "Existing REG.RU content and all secrets remain unchanged."
