              else:print('LIVE_WALLET_HTML_CACHE_KEY_ALREADY_CURRENT')
              if read(root+'account-browser.js')!=updated or read(root+'index.html')!=patched:
                  raise RuntimeError('LIVE_BROWSER_DEPLOY_VERIFICATION_FAILED')
