      - name: Publish reviewed LIVE core and subscriptions PHP with safe rollback
        if: github.event_name == 'push' && github.event.head_commit.message == 'Sync existing live account PHP versions on REG.RU'
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
