              if prior is None:write(bak,old)
              if read(path)!=old:raise RuntimeError('CONCURRENT_REMOTE_CHANGE')
              write(pending,new)
              ftp.rename(pending,path)
              files[path.split('/')[-1]]='changed'
              if read(path)!=new:raise RuntimeError('DEPLOY_READBACK_MISMATCH')
          originals={}
