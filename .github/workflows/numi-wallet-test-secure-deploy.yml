name: REG.RU REAL wallet, fiscal worker and YooKassa verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numi-wallet-test-secure-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm_real_code_only:
        description: 'Publish the existing REAL wallet PHP to REG.RU (does not enable charges)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: reg-ru-manual-publication
  cancel-in-progress: false
jobs:
  publish-real-wallet-code:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && github.event.head_commit.message == 'Publish existing real wallet PHP to REG.RU with rollback') ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_real_code_only == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guarded REG.RU REAL wallet deployment
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          php -l account-service/private/wallet-real.php
          php -l account-service/private/wallet-real-payment.php
          php -l account-service/private/wallet.php
          python3 -m py_compile scripts/deploy-real-wallet-reg-ru-20261108.py
          python3 -u scripts/deploy-real-wallet-reg-ru-20261108.py
      - name: Install REAL wallet receipt and approved-refund scheduler on REG.RU
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          php -l account-service/private/wallet-real-worker.php
          php -l account-service/public/numi-real-worker.php
          python3 -m py_compile scripts/deploy-real-wallet-worker-20261108.py
          python3 -u scripts/deploy-real-wallet-worker-20261108.py
      - name: Privately stage live YooKassa keys if separately configured
        env:
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
          NUMI_YOOKASSA_LIVE_SHOP_ID: ${{ secrets.NUMI_YOOKASSA_LIVE_SHOP_ID }}
          NUMI_YOOKASSA_LIVE_SECRET_KEY: ${{ secrets.NUMI_YOOKASSA_LIVE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/stage-real-yookassa-credentials-20261108.py
          python3 -u scripts/stage-real-yookassa-credentials-20261108.py
