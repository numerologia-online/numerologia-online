<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка закрытых текстов</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font:17px system-ui,sans-serif;max-width:540px;margin:48px auto;padding:20px;color:#282222}pre{white-space:pre-wrap;word-break:break-word;background:#f4f1ed;padding:18px;border-radius:12px}button{padding:14px;border:0;border-radius:10px;background:#272320;color:white;font-size:16px}</style></head>
<body><h2>Проверка закрытых текстов</h2><p>Эта страница не показывает и не сохраняет авторские тексты.</p><button id="run">Проверить доступ</button><pre id="result">Для проверки открой страницу внутри Telegram-приложения.</pre>
<script>
document.querySelector('#run').onclick=async()=>{
const out=document.querySelector('#result');const init=window.Telegram?.WebApp?.initData;
if(!init){out.textContent='NO_TELEGRAM_AUTH: откройте проверку внутри Telegram Mini App';return;}
out.textContent='Проверяю...';
try{
const r=await fetch('https://numerologia-online-auth-server.vercel.app/api/redflag-private',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,path:'data/redflag/money/gift.json'}),signal:AbortSignal.timeout(14000)});
const data=await r.json();
out.textContent='HTTP '+r.status+'; '+(r.ok && data?.questionId==='gift' && data?.entries ? 'PRIVATE_TEXT_RECEIVED' : 'ERROR '+(data?.error||'INVALID_RESPONSE'));
}catch(e){out.textContent='NETWORK_ERROR: '+(e?.name||'unknown');}
};
</script></body></html>
