<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Мои подарки — Нумерология онлайн</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{background:#f5f4ef;color:#1a3c30;font:15px/1.55 system-ui,-apple-system,sans-serif;margin:0}main{max-width:640px;margin:0 auto;padding:36px 20px 100px}.brand{font-size:12px;letter-spacing:.13em;text-decoration:none;color:#2e604d;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.1em;font-weight:700;color:#8b7747;margin:44px 0 6px}h1{font:normal 38px/1.15 Georgia,serif;margin:0 0 12px}p{color:#667568}.panel{background:#fff;border:1px solid #dce2d8;border-radius:15px;padding:22px;margin:22px 0}.gift{border-top:1px solid #dce2d8;padding:18px 0}.gift:first-child{border-top:0}h2{font:normal 23px Georgia,serif;margin:0 0 8px}button,.action{display:inline-block;background:#1b4e3d;border:1px solid #1b4e3d;border-radius:8px;padding:12px 18px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer}button:disabled{opacity:.65;cursor:default}#message{min-height:20px}small{display:block;color:#7b897e;margin:8px 0}
</style></head><body><main>
<a class="brand" href="/">НУМЕРОЛОГИЯ ОНЛАЙН</a>
<p class="eyebrow">ПОДАРКИ ДЛЯ ВАС</p><h1>Мои подарки</h1>
<p>Здесь можно активировать подарочные 24 часа клуба. Подарок не подключает автопродление и не списывает деньги.</p>
<div class="panel" id="container"><p id="message" role="status">Проверяем подарки в личном кабинете…</p><div id="gifts"></div></div>
<a href="/">Вернуться на сайт</a>
</main>
<script>
(() => {
'use strict';
const api='/api/numi-gifts.php', list=document.getElementById('gifts'),message=document.getElementById('message');
const date=raw=>{if(!raw)return '';const d=new Date(raw.replace(' ','T')+'Z');return isNaN(d.getTime())?'':d.toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Samara'});};
async function load(){
 try{
  const res=await fetch(api+'?action=my',{credentials:'same-origin',cache:'no-store'});
  if(res.status===401){message.textContent='Сначала войдите в личный кабинет.';const a=document.createElement('a');a.className='action';a.textContent='Войти на сайте';a.href='/?account=login';list.replaceChildren(a);return;}
  const data=await res.json();if(!res.ok||!data.ok)throw Error('Не удалось проверить подарки.');
  list.replaceChildren();const gifts=data.gifts||[];
  if(!gifts.length){message.textContent='Подарков пока нет. Заглядывайте иногда!';return;}
  message.textContent='';
  gifts.forEach(g=>{
   const box=document.createElement('div');box.className='gift';
   const h=document.createElement('h2');h.textContent='24 часа клуба';box.append(h);
   const p=document.createElement('p');
   if(g.status==='ready'){
     p.textContent='Можно активировать до '+date(g.claim_by)+'. Срок начнётся после нажатия кнопки.';
     const btn=document.createElement('button');btn.type='button';btn.textContent='Активировать подарок';
     btn.addEventListener('click',async()=>{
       btn.disabled=true;btn.textContent='Активируем…';
       try{
        const r=await fetch(api,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate',gift_id:g.id})});
        const result=await r.json();if(!r.ok||!result.ok)throw Error(result.error==='PAID_CLUB_ACTIVE'?'У вас уже действует оплаченный клуб.':result.error==='GIFT_EXPIRED'?'Срок активации истёк.':'Не удалось активировать подарок.');
        await load();
       }catch(e){message.textContent=e.message;btn.disabled=false;btn.textContent='Повторить активацию';}
     });box.append(p,btn);
   }else if(g.status==='active')p.textContent='Подарок действует до '+date(g.expires_at)+'. Приятного знакомства с клубом!';
   else p.textContent='Срок действия этого подарка завершился.';
   if(g.status!=='ready')box.append(p);
   list.append(box);
  });
 }catch(e){message.textContent=e.message||'Не удалось открыть подарки.';}
}
load();
})();
</script></body></html>
