<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="robots" content="noindex,nofollow">
  <base href="../../../">
  <title>Урок · Школа нумерологов</title>
  <meta name="description" content="Пошаговые уроки матрицы судьбы: от рисования схемы до самостоятельного расчёта и проверки знаний.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="pro/school/school.css?v=11">
  <link rel="stylesheet" href="pro/school/lesson/lesson.css?v=19">
</head>
<body>
  <div class="school-shell school-lesson-shell">
    <header class="school-top">
      <a href="pro/school/" class="school-back">← К программе обучения</a>
      <span class="school-brand">ШКОЛА НУМЕРОЛОГОВ</span>
    </header>
    <main>
      <section id="lesson-hero" class="school-lesson-hero" aria-labelledby="lesson-title">
        <p id="lesson-count" class="school-overline">УРОК</p>
        <h1 id="lesson-title">Загружаю урок…</h1>
        <p id="lesson-lead" class="school-lesson-lead"></p>
        <aside id="lesson-main-rule" class="school-main-rule" aria-label="Главное правило урока" hidden></aside>
      </section>
      <p id="lesson-error" class="school-error" role="alert" hidden></p>
      <section id="lesson-drawing" class="school-drawing" aria-label="Построение матрицы" hidden>
        <div class="school-drawing-intro">
          <p class="school-overline">ПРАКТИКА НА БУМАГЕ</p>
          <h2 id="lesson-drawing-title">Рисуем и считаем вместе</h2>
          <p id="lesson-drawing-description">Откройте тетрадь и записывайте расчёты по шагам.</p>
        </div>
        <form id="lesson-date-form" class="school-date-form">
          <label for="lesson-date">Дата рождения</label>
          <div class="school-date-row">
            <input id="lesson-date" inputmode="numeric" maxlength="10" placeholder="Введите любую дату" autocomplete="off" required>
            <button id="lesson-date-submit" type="submit" aria-label="Использовать выбранную дату">Использовать</button>
          </div>
          <p id="lesson-date-error" class="school-date-error" role="alert" hidden></p>
          <p id="lesson-date-confirmed" class="school-date-confirmed" role="status" hidden></p>
        </form>
        <div class="school-visual-grid">
          <div class="school-diagram-frame"><div id="lesson-diagram" class="school-diagram" aria-live="polite"></div></div>
          <div class="school-step-panel">
            <p id="lesson-step-count" class="school-overline"></p>
            <h3 id="lesson-step-title"></h3>
            <p id="lesson-step-text"></p>
            <div id="lesson-step-formula" class="school-step-formula"></div>
            <div class="school-step-buttons">
              <button id="lesson-step-back" type="button">← Назад</button>
              <button id="lesson-step-next" type="button">Следующий шаг →</button>
            </div>
          </div>
        </div>
      </section>
      <article id="lesson-content" class="school-lesson-reading" aria-live="polite"></article>
      <section id="lesson-quiz" class="school-lesson-quiz" aria-label="Проверка знаний"></section>
      <nav id="lesson-navigation" class="school-lesson-navigation" aria-label="Перемещение между уроками"></nav>
    </main>
    <footer class="school-footer">Школа нумерологов · Продолжайте в своём темпе</footer>
  </div>
  <script type="module" src="pro/school/lesson/lesson.js?v=27"></script>
</body>
</html>
